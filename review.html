<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review — WaterWorks Lawn & Landscaping</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f4;
    margin: 0;
    padding: 0;
    color: #1c2a1c;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 48px 20px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
  }
  p.lede {
    color: #4a5a4a;
    margin-top: 0;
    margin-bottom: 28px;
  }
  form {
    background: #fff;
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  label {
    display: block;
    font-weight: 600;
    margin-top: 16px;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }
  input[type="text"],
  textarea,
  select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea {
    min-height: 110px;
    resize: vertical;
  }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    background: #2f6b3a;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover {
    background: #26542e;
  }
  .thanks {
    display: none;
    background: #fff;
    border-radius: 10px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .thanks h2 {
    margin-top: 0;
  }
  a.back {
    display: inline-block;
    margin-top: 24px;
    color: #2f6b3a;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Leave a review</h1>
  <p class="lede">Tell us how we did. We read every one.</p>

  <form id="reviewForm" action="https://formspree.io/aidenthebuilder123@gmail.com" method="POST">
    <label for="name">Your name</label>
    <input type="text" id="name" name="name" required>

    <label for="rating">Rating</label>
    <select id="rating" name="rating" required>
      <option value="">Select a rating</option>
      <option value="5 stars">5 stars — Excellent</option>
      <option value="4 stars">4 stars — Good</option>
      <option value="3 stars">3 stars — Okay</option>
      <option value="2 stars">2 stars — Not great</option>
      <option value="1 star">1 star — Poor</option>
    </select>

    <label for="comment">Your review</label>
    <textarea id="comment" name="comment" required placeholder="What did we do for you, and how did it go?"></textarea>

    <button type="submit">Submit review</button>
  </form>

  <div class="thanks" id="thanksMsg">
    <h2>Thank you!</h2>
    <p>Your review has been sent. We appreciate you taking the time.</p>
    <a class="back" href="index.html">&larr; Back to home</a>
  </div>
</div>

<script>
  const form = document.getElementById('reviewForm');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const data = new FormData(form);
    fetch(form.action, {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    }).then(response => {
      if (response.ok) {
        form.style.display = 'none';
        document.getElementById('thanksMsg').style.display = 'block';
      } else {
        alert('Something went wrong. Please try again.');
      }
    }).catch(() => {
      alert('Something went wrong. Please try again.');
    });
  });
</script>
</body>
</html>
