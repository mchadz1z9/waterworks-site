function resolve(){
 const s=shot,tx=s.tx,ty=s.ty;let r;

 if(s.who==='cpu'){if(dive){hx=dive.x;hy=dive.y;const prog=clamp((T-dive.t)/.3,.3,1);R=92*prog}else{hx=500;hy=232;R=58}}

 if(nearPost||nearBar)r='post';else if(!inX||!inY)r='miss';else if(saved)r='save';else r='goal';
 s.res=r;s.rt=T;phase='res';
 const you=s.who==='you';
 if(r==='goal'){ripple={x:tx,y:ty,t:T};shake=.25;flash=1;
  say(you?(s.corner?'TOP CORNER!':'GOAL!'):'THEY SCORE','#'+(you?'ffd23f':'ff7a7a'));
  if(you)streak++;else streak=0;
  if(you){for(let i=0;i<70;i++)parts.push({x:tx,y:ty,vx:(Math.random()-.5)*14,vy:-Math.random()*13-2,c:['#ffd23f','#fff','#ff6a2b','#4bd88c'][i%4],l:1.4+Math.random()});if(mode==='shoot'&&streak%3===0)level++}
  noise(.5,.35,2600);if(you){beep(520,.18,'square',.1);setTimeout(()=>beep(780,.25,'square',.1),120);setTimeout(()=>beep(1040,.3,'square',.1),260)}else beep(180,.4,'sawtooth',.12,90);
  if(mode==='match'&&!you)streak=0}
 else{if(you)streak=0;
  if(r==='save'){say(you?'SAVED!':'GREAT SAVE!',you?'#7fc8ff':'#4bd88c');if(!you){for(let i=0;i<40;i++)parts.push({x:hx,y:hy,vx:(Math.random()-.5)*10,vy:-Math.random()*8,c:'#7fe8a8',l:1+Math.random()*.6})}beep(220,.25,'sawtooth',.15,100);noise(.15,.3,1200)}
  else if(r==='post'){say('OFF THE POST!','#ff9a5a');beep(900,.3,'triangle',.3,500);shake=.2}
  else{say(tx<G.l||tx>G.r?'WIDE!':'OVER THE BAR!',you?'#ff7a7a':'#4bd88c');beep(150,.3,'sawtooth',.1,90)}}

   else if(shot.res==='miss'){depth=-Math.min(9,k*14)}
   else{depth=-Math.min(1.7,k*6)}}}
 if(V3){V3.frame(()=>{
  const B=V3.box,BR=V3.boxR;
  /* goal frame */ for(const sx of [-1,1])V3.cyl(sx*3.7,1.22,0,.06,2.44,'#f8fafc');BR(0,2.44,0,7.52,.12,.12,'#f8fafc');
  /* net, with a ripple where the ball went in */ const rp=ripple?Math.max(0,1-(T-ripple.t)/900):0,RX=ripple?(ripple.x-500)*.01464:0,RY=ripple?(300-ripple.y)*.01435:0;

  for(let i=0;i<=24;i++){const X=-3.66+7.32*i/24;for(let j=0;j<8;j++){const y0=2.44*j/8,y1=2.44*(j+1)/8;V3.beam(np(X,y0),np(X,y1),.012,'#e5e7eb')}V3.beam([X,2.44,0],np(X,2.44),.012,'#e5e7eb')}
  for(let j=0;j<=8;j++){const Y=2.44*j/8;for(let i=0;i<24;i++){V3.beam(np(-3.66+7.32*i/24,Y),np(-3.66+7.32*(i+1)/24,Y),.012,'#e5e7eb')}for(const sx of [-1,1])V3.beam([sx*3.66,Y,0],np(sx*3.66,Y),.012,'#e5e7eb')}
