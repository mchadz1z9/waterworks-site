<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Sailing</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }

.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; position:relative; z-index:1; }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl{ display:block; }
.viewbtn{ position:absolute; top:8px; right:8px; z-index:4; font:inherit; font-size:15px; color:#fff; background:rgba(5,8,18,.78); border:2px solid #ffd166; border-radius:999px; padding:3px 12px; cursor:pointer; }
.viewbtn:hover{ background:rgba(20,28,51,.95); }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
.st tr.dim td{ opacity:.55; }
.result{ align-items:flex-start; }
.bxw{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.bxs h3{ margin:6px 0 0; font-size:22px; } .bxs h3 img{ width:26px; height:26px; vertical-align:middle; }
.bxs small{ color:#93a0bd; }
.bxw .ls{ font-size:14px; } .bxw .ls th,.bxw .ls td{ padding:1px 6px; }
.result h2{ font-size:clamp(32px,6vw,60px); }
.potg{ margin:12px auto 0; max-width:420px; background:#141c33; border-left:8px solid var(--tc); border-radius:10px; padding:8px 14px; text-align:left; display:flex; flex-direction:column; }
.potg small{ color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:.06em; } .potg b{ font-size:24px; color:#fff; } .potg span{ color:#93a0bd; }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>

<main>
  <div class="top">
    <div class="brand">Rink Rivals <span>Sailing</span></div>
    <div class="tools">
      <a href="./">Home</a> <a href="hockey">Hockey</a>
      <a href="surf">Surfing</a>
      <a href="fishing">Fishing</a>
      <button id="btnView" tabindex="-1">Broadcast 3D</button>
      <button id="btnFs" tabindex="-1">Full screen (Z)</button>
      <button id="btnSnd" tabindex="-1">Sound on</button>
    </div>
  </div>

  <section class="board" aria-label="Scoreboard">
    <div class="side" id="sideL"><img id="logoL" alt=""><div style="min-width:0"><div class="tn" id="nameL">-</div><div class="tp" id="tpL">Away</div></div><div class="sc" id="scoreL">0</div></div>
    <div class="clock"><div class="t" id="cntT">0-0</div><div class="pd"><span id="innT">Top 1st</span><span id="basesT"></span></div><div class="pd" id="outsT">0 outs</div></div>
    <div class="side r" id="sideR"><img id="logoR" alt=""><div style="min-width:0"><div class="tn" id="nameR">-</div><div class="tp" id="tpR">Home</div></div><div class="sc" id="scoreR">0</div></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <button class="viewbtn" id="viewBtn2" tabindex="-1">View: Broadcast 3D</button>
    <canvas id="cv" role="img" aria-label="Sailing game"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="menu"><div class="menu-in" id="menuIn"></div></div>
    <div class="overlay result hidden" id="result"><div id="resultIn"></div></div>
  </div>

  <footer class="keys" id="keysHelp"></footer>
  <section class="hub" id="hub" aria-label="Season hub"></section>
</main>

<script>
(() => {
'use strict';
const W=1120, H=620, DPR=Math.min(2, window.devicePixelRatio||1);
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const TEST=/[?&]test\b/.test(location.search);
const rnd=(a,b)=>a+(b-a)*Math.random(), pick=a=>a[Math.floor(Math.random()*a.length)];
function gauss(){ let u=0; while(!u) u=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random()); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- vectors ---------- */
const v3=(x=0,y=0,z=0)=>[x,y,z], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{ const l=len(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; }, madd=(a,b,s)=>{ a[0]+=b[0]*s; a[1]+=b[1]*s; a[2]+=b[2]*s; return a; };
function rotV(v,ax,ang){ const c=Math.cos(ang), s=Math.sin(ang), d=dot(ax,v), cr=cross(ax,v); return [v[0]*c+cr[0]*s+ax[0]*d*(1-c),v[1]*c+cr[1]*s+ax[1]*d*(1-c),v[2]*c+cr[2]*s+ax[2]*d*(1-c)]; }
const angD=a=>{ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; };


const G=9.81, RHOA=1.225, RHOW=1025, KN=1.94384;
const sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
/* ---------- the boats: real dimensions, sail areas, weights and righting moments ----------

   rm max righting moment of the hull (N·m), hike extra moment from the crew hiking / trapezing, cap capsize heel (rad),
   Sw wetted area (m²), plane: the hull planes off its bow wave, foil: takeoff speed (m/s) and flying lift/drag */
const CLS={
 ilca:{name:'ILCA 7 (Laser)',short:'ILCA 7',L:4.23,lwl:3.81,A:7.06,Ak:0,m:142,ce:2.3,rm:450,hike:1150,cap:1.05,Sw:3.2,beam:1.39,mastH:6.4,plane:.55,foil:0,leg:340,fleet:8,col:['#f8fafc','#e2e8f0'],sailC:'#f1f5f9',turn:1.6,
  crews:[['Matt Wearn','AUS'],['Pavlos Kontides','CYP'],['Hermann Tomasgaard','NOR'],['Philipp Buhl','GER'],['Michael Beckett','GBR'],['Jean-Baptiste Bernaz','FRA'],['Tom Saunders','NZL'],['Stefano Peschiera','PER'],['Finn Lynch','IRL'],['Kaarle Tapper','FIN']]},
 '49er':{name:'49er skiff',short:'49er',L:4.99,lwl:4.6,A:21.2,Ak:38,m:300,ce:3.4,rm:900,hike:3600,cap:1.0,Sw:3.6,beam:2.9,mastH:8.1,plane:.75,foil:0,leg:420,fleet:8,col:['#1e293b','#e2e8f0'],sailC:'#e5e7eb',turn:1.7,
  crews:[['Diego Botín / Florian Trittel','ESP'],['Isaac McHardie / William McKenzie','NZL'],['Ian Barrows / Hans Henken','USA'],['Bart Lambriex / Floris van de Werken','NED'],['Dylan Fletcher / Stuart Bithell','GBR'],['Erwan Fischer / Clément Pequin','FRA'],['Sime Fantela / Mihovil Fantela','CRO'],['Jim Colley / Shaun Connor','AUS']]},
 nacra:{name:'Nacra 17 (foiling catamaran)',short:'Nacra 17',L:5.25,lwl:5,A:20.1,Ak:18.5,m:320,ce:3.6,rm:3600,hike:2400,cap:.85,Sw:3.4,beam:2.59,mastH:9.1,plane:.9,foil:{to:6.3,ld:9},leg:560,fleet:6,col:['#0f172a','#e5e7eb'],sailC:'#d1d5db',turn:1.25,cat:1,
  crews:[['Ruggero Tita / Caterina Banti','ITA'],['Mateo Majdalani / Eugenia Bosco','ARG'],['John Gimson / Anna Burnet','GBR'],['Tim Mourniac / Aloise Retornaz','FRA'],['Micah Wilkinson / Erica Dawson','NZL'],['Paul Kohlhoff / Alica Stuhlemmer','GER']]},
 ac75:{name:'AC75 (America\'s Cup)',short:'AC75',L:22.7,lwl:20,A:235,Ak:0,m:7000,ce:13,rm:1.6e6,hike:0,cap:1.2,Sw:30,beam:5,mastH:26.5,plane:1,foil:{to:6,ld:18},leg:1300,fleet:2,col:['#0f172a','#facc15'],sailC:'#111827',turn:.55,match:1,
  crews:[['Emirates Team New Zealand','NZL'],['INEOS Britannia','GBR'],['Luna Rossa Prada Pirelli','ITA'],['NYYC American Magic','USA'],['Alinghi Red Bull Racing','SUI'],['Orient Express Racing Team','FRA']]}};
const NCOL={AUS:'#facc15',CYP:'#f97316',NOR:'#dc2626',GER:'#111827',GBR:'#1d4ed8',FRA:'#2563eb',NZL:'#0f172a',PER:'#dc2626',IRL:'#16a34a',FIN:'#1e40af',ESP:'#dc2626',USA:'#1e3a8a',NED:'#f97316',CRO:'#dc2626',ITA:'#16a34a',ARG:'#38bdf8',SUI:'#dc2626'};
/* ---------- the sail: lift and drag from its angle of attack to the apparent wind.
   Below zero it luffs (flaps, no drive); past ~22° the flow separates and it stalls; square to the wind it is just a drag brake */
function sailCoef(a){ if(a<=.02) return {cl:0,cd:.06,st:'luff'}; let cl=a<.38?3.6*a:Math.max(.35,1.37-(a-.38)*1.35), cd=.05+.07*cl*cl+(a>.38?(a-.38)*.75:0); cd+=1.35*sstep(.6,1.4,a)*Math.sin(Math.min(a,1.57));
  return {cl,cd,st:a<.12?'soft':a>.5?'stall':'flow'}; }

/* ---------- audio ---------- */
let AC=null, muted=false;

/* ---------- one boat, one time step: apparent wind, sail force, heel against righting moment, hull and foil drag ---------- */
function stepBoat(b,C,tw,I,dt){ const f=[Math.sin(b.h),Math.cos(b.h)], r=[Math.cos(b.h),-Math.sin(b.h)];

/* ---------- state ---------- */

try{ const P=JSON.parse(localStorage.getItem('rinkRivalsSailingPrefs')||'null'); if(P){ clsSel=CLS[P.clsSel]?P.clsSel:'ilca'; windSel=P.windSel??1; lvl=P.lvl??1; assist=P.assist??true; camMode=P.camMode||0; crewSel=P.crewSel|0; } }catch(e){}
const savePrefs=()=>{ try{ localStorage.setItem('rinkRivalsSailingPrefs',JSON.stringify({clsSel,windSel,lvl,assist,camMode,crewSel})); }catch(e){} };
const fmtT=s=>`${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`;
/* the best angles to the true wind: close-hauled upwind, and the downwind angle (foilers reach down in their own apparent wind) */

/* ---------- the wind: a breeze that oscillates through shifts, with gusts you can see coming as dark patches on the water ---------- */
function windAt(x,z,t){ const W=R.W; let d=W.d0+W.a1*Math.sin(t/W.p1+W.ph)+W.a2*Math.sin(t/W.p2+W.ph*2)+.05*Math.sin(x/320+t/60), s=W.s0*(1+.1*Math.sin(t/37+W.ph)+.06*Math.sin(x/150+z/210));

function stepWind(dt){ const W=R.W, L=R.C.leg; for(const p of R.puffs){ const w=windAt(p.x,p.z,R.t); p.x+=-Math.sin(w.d)*w.s*.75*dt; p.z+=-Math.cos(w.d)*w.s*.75*dt; if(p.z<-L*.5){ p.z=L*1.5+Math.random()*L*.3; p.x=(Math.random()-.5)*L*1.2; p.r=L*(.06+Math.random()*.08); p.k=.2+Math.random()*.3; p.dd=(Math.random()-.5)*.18; } } }

/* ---------- a race: start line, windward mark, leeward gate, two laps ---------- */
function newRace(){ const C=CLS[clsSel], L=C.leg, rng=mulberry32(window.RRV&&RRV.on?(RRV.seed||1):Math.floor(Math.random()*1e9)), rr=()=>rng();

  const lineW=Math.max(60,C.L*C.fleet*2.6), marks={W:{x:0,z:L},G:[{x:-C.L*2.5,z:L*.12},{x:C.L*2.5,z:L*.12}],pin:{x:-lineW/2,z:0},cb:{x:lineW/2,z:0}};
  R={C,cls:clsSel,W,puffs:[],marks,lineW,t:-60,boats:[],legs:['W','G','W','F'],feed:[],finish:[],over:false,started:false};
  for(let i=0;i<9;i++) R.puffs.push({x:(rr()-.5)*L*1.4,z:rr()*L*1.6-L*.2,r:L*(.06+rr()*.08),k:.2+rr()*.3,dd:(rr()-.5)*.18});

  R.boats.push(mkBoat(me,true,0,n)); for(let i=1;i<n;i++) R.boats.push(mkBoat(crews[(i-1)%crews.length],false,i,n));

  return {crew:crew[0],code:crew[1],me,x,z:-C.L*7-Math.random()*C.L*2,h:Math.PI/2*(i%2?1:-1)*.9,v:C.foil?2:1.2,heel:0,hv:0,trim:.6,leg:0,ocs:false,pen:0,penRot:0,done:false,time:0,sk,wake:[],cap:0,id:i,tackT:0,top:0}; }

/* ---------- the AI: sails the right angles, tacks on the laylines, takes the gusts ---------- */

/* ---------- the race loop ---------- */
function step(dt){ if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('on'); } if(bannerT>0&&!paused){ bannerT-=dt; if(bannerT<=0) $('banner').classList.remove('on'); }

  if(!R||paused||phase!=='play') return; /* once you are home the rest of the fleet is fast-forwarded in to the line */ const ff=R.me.done?8:1, n=4*ff; for(let i=0;i<n&&!R.over;i++) tick(dt*ff/n); for(const f of R.feed) f.T-=dt; R.feed=R.feed.filter(f=>f.T>0); if(Math.floor(R.t*2)!==Math.floor((R.t-dt)*2)) updateBoard(); }
function tick(dt){ const C=R.C, t0=R.t; R.t+=dt; stepWind(dt);
  if(t0<0&&R.t>=0){ R.started=true; sfx.gun(); for(const b of R.boats) if(b.z>0){ b.ocs=true; if(b.me){ feed('OVER EARLY! Go back below the line and restart','#f87171'); speak('Over early',true); } } if(!R.me.ocs) feed('GO!','#22c55e'); }
  if(t0<-10&&R.t>=-10) sfx.beep(); if(R.t<0&&Math.ceil(R.t)!==Math.ceil(t0)&&R.t>-5) sfx.beep();
  for(const b of R.boats){ if(b.done){ b.v*=1-dt*.4; b.x+=Math.sin(b.h)*b.v*dt; b.z+=Math.cos(b.h)*b.v*dt; continue; }
    const I=b.me&&!window.__ai0?playerInput(b,dt):aiTick(b,dt), w=windAt(b.x,b.z,R.t), ph=b.h;
    if(b.cap>0){ b.cap-=dt; b.v*=1-dt*2; b.heel=lerp(b.heel,1.5,dt*2); if(b.cap<=0){ b.heel=.2; b.hv=0; b.v=0; if(b.me) feed('Back up and sailing','#86efac'); } continue; }
    if(stepBoat(b,C,w,I,dt)&&b.cap<=0){ b.cap=C.foil&&C.match?5:7; b.v*=.2; sfx.splash(); if(b.me){ feed(C.match?'Crash! Nose-dived off the foils':'CAPSIZED! Righting the boat...','#f87171'); speak(C.match?'Crash':'Capsize',true); } }

    const nx=dx/d, nz=dz/d, push=(lim-d)/2; a.x-=nx*push; a.z-=nz*push; b.x+=nx*push; b.z+=nz*push; a.v*=1-dt*2.5; b.v*=1-dt*2.5;

      guilty.pen=1; guilty.penRot=0; feed(`Collision: ${guilty.me?'you have':guilty.crew.split(' ')[0]+' has'} to do a penalty turn`,guilty.me?'#f87171':'#fbbf24'); if(guilty.me) speak('Protest! Do your turn',true); } }
  if(R.t>0&&(R.boats.every(b=>b.done)||R.me.done&&R.t>R.finish[0].time*1.5+30||R.t>(C.match?900:1500))) endRace(); }
function legCheck(b){ const C=R.C, k=R.legs[b.leg], rad=Math.max(14,C.L*3);

  else if(k==='F'){ if(b.z<=0&&b.z>-15&&b.x>R.marks.pin.x-2&&b.x<R.marks.cb.x+2&&!b.pen){ b.done=true; b.time=R.t; R.finish.push(b); const pos=R.finish.length; if(pos===1) feed(`${b.crew} wins the race!`,'#fde047'); if(b.me){ sfx.win(); banner(pos===1?'BULLET!':`Finished ${pos}${['st','nd','rd'][pos-1]||'th'}`,fmtT(b.time),pos===1?'#22c55e':'#38bdf8',3); } } } }
function mk(b,name){ if(b.me){ sfx.mark(); const pos=R.boats.filter(o=>o.leg>b.leg||o.leg===b.leg&&o!==b&&o.legT<R.t).length+1; feed(`Rounded the ${name} in ${pos}${['st','nd','rd'][pos-1]||'th'}`,'#93c5fd'); } b.legT=R.t; }
function feed(t,col){ R.feed.unshift({t,col:col||'#e5e7eb',T:4}); if(R.feed.length>4) R.feed.pop(); }
/* where everyone is: legs done, then distance to the next mark */
function standings(){ return R.boats.slice().sort((a,b)=>(a.done&&b.done)?a.time-b.time:a.done?-1:b.done?1:(b.leg-a.leg)||(Math.hypot(nextMark(a).x-a.x,nextMark(a).z-a.z)-Math.hypot(nextMark(b).x-b.x,nextMark(b).z-b.z))); }

/* ---------- you: rudder on A / D, the mainsheet on W / S (or auto-trim), hike with Shift, SPACE tacks or gybes for you ---------- */
function playerInput(b,dt){ const C=R.C, w=windAt(b.x,b.z,R.t); let rud=(held(['KeyA','ArrowLeft'])?1:0)-(held(['KeyD','ArrowRight'])?1:0);
  if(b.auto){ const e=angD(b.auto-b.h); rud=clamp(e*2.5,-1,1); if(Math.abs(e)<.06) b.auto=null; }
  if(b.pen>0&&!rud&&assist) rud=1;
  const sheet=(held(['KeyW','ArrowUp'])?1:0)-(held(['KeyS','ArrowDown'])?1:0);
  return {rud,auto:assist,sheet:-sheet,hike:held(['ShiftLeft','ShiftRight'])?1:0}; }
function autoTack(){ const b=R.me; if(!b||b.done) return; const w=windAt(b.x,b.z,R.t), twa=angD(b.h-w.d), dh=w.d+Math.PI; /* mirror the heading across the wind (a tack) or across dead downwind (a gybe) */ b.auto=Math.abs(twa)<Math.PI/2?w.d-twa:dh-angD(b.h-dh); feed(Math.abs(twa)<Math.PI/2?'Ready about! Tacking':'Gybe-ho!','#93c5fd'); }
function endRace(){ if(R.over) return; R.over=true; phase='over'; const st=R.finish.concat(standings().filter(b=>!b.done)), pos=st.indexOf(R.me)+1, me=R.me, key=`${R.cls}_${windSel}`;
  SV.races++; if(pos===1&&me.done) SV.wins++; SV.top=Math.max(SV.top,Math.round(me.top*KN*10)/10); if(me.done&&(!SV.best[key]||me.time<SV.best[key])) SV.best[key]=me.time; saveSV(); R.place=pos;
  $('resultIn').innerHTML=`<h2>${me.done?(pos===1?'Race win! ⛵':`Finished ${pos}${['st','nd','rd'][pos-1]||'th'}`):'Did not finish'}</h2><div class="rs">${me.done?fmtT(me.time):'-'}</div><p>${R.C.name} · ${WINDS[windSel].name} breeze · top speed ${(me.top*KN).toFixed(1)} knots</p>
    <table class="ls"><tr><th>#</th><th>Crew</th><th>Time</th></tr>${st.map((b,i)=>`<tr${b.me?' style="background:rgba(255,209,102,.2)"':''}><td>${i+1}</td><td style="text-align:left">${esc(b.crew)} ${b.code}</td><td>${b.done?fmtT(b.time):'DNF'}</td></tr>`).join('')}</table><p>Enter for the menu, R to race again.</p>`;

/* ---------- 3D engine (shared with the other Rink Rivals sports) ---------- */
function makeR3(glc,stage){

`precision mediump float;varying vec2 vUV;uniform sampler2D uTex;uniform vec4 uUVR;uniform vec3 uTint;uniform float uAlpha;

  /* ---- geometry ---- */
  function primBox(){
    const p=[],n=[];

      const u=Math.abs(f[1])>0?[1,0,0]:[0,1,0], v=cross(f,u);
      const c=(a,b)=>[f[0]*.5+u[0]*a*.5+v[0]*b*.5,f[1]*.5+u[1]*a*.5+v[1]*b*.5,f[2]*.5+u[2]*a*.5+v[2]*b*.5];

    }
    return {p,n};
  }
  function primSphere(la,lo){
    const p=[],n=[], P=(i,j)=>{ const t=i/la*Math.PI, f=j/lo*Math.PI*2; return [Math.sin(t)*Math.cos(f),Math.cos(t),Math.sin(t)*Math.sin(f)]; };
    for(let i=0;i<la;i++) for(let j=0;j<lo;j++){ const a=P(i,j),b=P(i+1,j),c=P(i+1,j+1),d=P(i,j+1); for(const q of [a,b,c,a,c,d]){ p.push(...q); n.push(...q); } }
    return {p,n};
  }
  class Geo{
    constructor(){ this.p=[]; this.n=[]; this.c=[]; this.ph=[]; }
    add(pr,m,col,ph=0){
      const c=typeof col==='string'?rgb(col):col;
      for(let i=0;i<pr.p.length;i+=3){
        const v=tp(m,[pr.p[i],pr.p[i+1],pr.p[i+2]]);
        const nn=nrm([m[0]*pr.n[i]+m[4]*pr.n[i+1]+m[8]*pr.n[i+2],m[1]*pr.n[i]+m[5]*pr.n[i+1]+m[9]*pr.n[i+2],m[2]*pr.n[i]+m[6]*pr.n[i+1]+m[10]*pr.n[i+2]]);

  function upload(g){

  /* textured quad meshes */

  /* number atlas */
  const nc=document.createElement('canvas'); nc.width=nc.height=1024;
  { const c=nc.getContext('2d'); c.textAlign='center'; c.textBaseline='middle'; c.font='900 74px "Arial Black",Impact,sans-serif'; c.lineJoin='round';
    for(let i=0;i<100;i++){ const x=(i%10)*102.4+51.2, y=Math.floor(i/10)*102.4+54; c.lineWidth=10; c.strokeStyle='rgba(0,0,0,.55)'; c.strokeText(String(i),x,y); c.fillStyle='#fff'; c.fillText(String(i),x,y); } }
  const numTex=mkTex(nc,true);
  const ccv=document.createElement('canvas'); ccv.width=256; ccv.height=128;
  { const c=ccv.getContext('2d'); c.textAlign='center'; c.textBaseline='middle'; c.font='900 104px "Arial Black",Impact,sans-serif'; c.lineJoin='round';
    [['C',64],['A',192]].forEach(([l,x])=>{ c.lineWidth=12; c.strokeStyle='rgba(0,0,0,.55)'; c.strokeText(l,x,68); c.fillStyle='#fff'; c.fillText(l,x,68); }); }
  const capTex=mkTex(ccv,true);
  const sc=document.createElement('canvas'); sc.width=sc.height=64;
  { const c=sc.getContext('2d'), g=c.createRadialGradient(32,32,2,32,32,32); g.addColorStop(0,'rgba(10,20,40,.55)'); g.addColorStop(1,'rgba(10,20,40,0)'); c.fillStyle=g; c.fillRect(0,0,64,64); }

  /* ---- draw helpers ---- */
  let VP=I(), eye=[0,400,800];

  function useT(){

  function tquad(mesh,tex,m,uvr,tint,alpha){
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.bindBuffer(gl.ARRAY_BUFFER,mesh.pos); gl.vertexAttribPointer(PT.a.aPos,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,mesh.uv); gl.vertexAttribPointer(PT.a.aUV,2,gl.FLOAT,false,0,0);
    gl.uniformMatrix4fv(PT.u.uM,false,m); gl.uniform4fv(PT.u.uUVR,uvr); gl.uniform3fv(PT.u.uTint,tint); gl.uniform1f(PT.u.uAlpha,alpha);

  const decals=[], shadows=[];
  const numUV=n=>{ n=Math.max(0,Math.min(99,Math.round(n))); return [(n%10)/10,Math.floor(n/10)/10,.1,.1]; };

  /* ---- ground and static scenery ---- */
  let ground=null, groundTex=null, world=null, crowdM=null;
  function setGround(canvas,x0,z0,x1,z1,mip){

  /* crowd: seats in tiers with fans that bob when the crowd cheers */
  const FANS=['#e2e8f0','#f87171','#60a5fa','#fbbf24','#34d399','#f472b6','#a78bfa','#94a3b8','#1f2937','#f97316'];
  function crowdRow(g,c,a,b,y,depth,rows,seat){
    const d=sub(b,a), L=Math.hypot(d[0],d[2]), n=Math.max(1,Math.floor(L/seat)), ux=d[0]/L, uz=d[2]/L, px=uz, pz=-ux;

      g.add(primBox(),mm(T((a[0]+b[0])/2+px*(off+depth/2),yy-seat*.4,(a[2]+b[2])/2+pz*(off+depth/2)),RY(-Math.atan2(uz,ux)),S(L,seat*.8,seat*.9)),r%2?'#1e293b':'#273449');

  /* ---- athlete model (built like the hockey players) ---- */
  const SKIN=['#e0b48f','#c68e63','#8d5a3b','#f1c7a1','#a9724d'];
  function athlete(o){
    const t=o.team, base=mm(T(o.x,o.lift||0,o.z),RY(-o.ang)), k=Math.min(1,o.run||0);

      part(UB,mm(b2,T(0,8,0),S(7,15,12)),t.jersey); part(UB,mm(b2,T(0,-6,0),S(6,14,9)),pants);

    }

      part(UB,mm(leg,T(0,-16.5,0),S(4.1,10,4.1)),socks);
      part(UB,mm(leg,T(1.6,-hip+1.6+(o.down?0:0),0),RZ(-sw*.3),S(7.5,3,4.6)),'#111827');
    }
    const lean=(o.fb?.12:.06)+.28*k+crouch*.45;
    const tor=mm(base,T(0,hip,0),RZ(-lean));
    part(UB,mm(tor,T(0,8,0),S(7,15,12)),t.jersey);
    part(UB,mm(tor,T(0,1.5,0),S(7.4,2,12.4)),t.trim);
    part(UB,mm(tor,T(0,15.5,0),S(o.fb?9:7.6,o.fb?5:3.6,o.fb?18:14)),t.jersey);
    part(US,mm(tor,T(.6,20,0),S(2.2,2.2,2.2)),skin);
    part(US,mm(tor,T(.8,23,0),S(3.4,3.9,3.3)),skin);

  /* crew out on the windward side */ const crewN=C.match?4:C.crews[0][0].includes('/')?2:1; for(let k=0;k<crewN;k++){ const out=C.match?0:Wd*.5+b.hikeF*(C.name.includes('49er')||C.cat?1:.5), cz=-L*.2-k*.7; R3.part(UB,mm(M,T(side*out*K,.75*K,cz*K),RZ(-side*b.hikeF*1.1),S(.35*K,1.2*K,.3*K)),[.15,.2,.35]); R3.part(US,mm(M,T(side*(out+b.hikeF*.6)*K,1.25*K,cz*K),S(.13*K,.15*K,.13*K)),[.9,.7,.55]); } }
let camE=null, camC=null;
function render3D(dt){ build3(); const K=K3, sky=[.62,.78,.95];
  if(!R||phase==='menu'){ const a=performance.now()/16000; R3.frame({eye:[Math.sin(a)*60*K,18*K,Math.cos(a)*60*K],center:[0,0,0],fov:55,near:10,far:500000,sky},()=>{},dt); return; }
  const b=R.me, C=R.C, f=[Math.sin(b.h),Math.cos(b.h)]; let e, c, fov=58; const back=C.L*(C.match?2.2:3.2)+4;
  if(camMode===1){ e=[b.x+f[1]*back*1.6,C.L*1.4+6,b.z-f[0]*back*1.6]; c=[b.x,1,b.z]; } else if(camMode===2){ e=[b.x-f[0]*C.L*.5,C.L*4+30,b.z-f[1]*C.L*.5-20]; c=[b.x+f[0]*10,0,b.z+f[1]*10]; fov=60; }
  else { e=[b.x-f[0]*back,C.L*.6+3,b.z-f[1]*back]; c=[b.x+f[0]*C.L*2,C.mastH*.35,b.z+f[1]*C.L*2]; }
  if(!camE){ camE=e; camC=c; } else { const r=Math.min(1,dt*2.5); for(let i=0;i<3;i++){ camE[i]=lerp(camE[i],e[i],r); camC[i]=lerp(camC[i],c[i],r); } }
  R3.frame({eye:camE.map(v=>v*K),center:camC.map(v=>v*K),fov,near:10,far:500000,sky},()=>{ const em=R3.partE||R3.part; drawSea(b.x,b.z);
    /* marks: big orange inflatables; the committee boat and the pin */ for(const m of [R.marks.W,...R.marks.G]) R3.part(R3.UC,R3.mm(R3.T(m.x*K,1*K,m.z*K),R3.S(1.6*K,2.2*K,1.6*K)),[.98,.45,.08]);
    R3.part(R3.UB,R3.mm(R3.T(R.marks.cb.x*K,1*K,R.marks.cb.z*K),R3.S(4*K,2*K,10*K)),[.95,.95,.97]); R3.part(R3.UB,R3.mm(R3.T(R.marks.cb.x*K,4*K,R.marks.cb.z*K),R3.S(.1*K,6*K,.1*K)),[.8,.8,.8]); R3.part(R3.UC,R3.mm(R3.T(R.marks.pin.x*K,.8*K,0),R3.S(1.2*K,1.6*K,1.2*K)),[.98,.75,.1]);
    if(R.t<0) for(let x=R.marks.pin.x;x<R.marks.cb.x;x+=6) em(R3.UB,R3.mm(R3.T(x*K,.08*K,0),R3.S(3*K,.02*K,.15*K)),[1,.9,.3]);
    for(const o of R.boats){ for(let i=1;i<o.wake.length;i++){ const p=o.wake[i]; R3.part(R3.UB,R3.mm(R3.T(p[0]*K,.06*K,p[1]*K),R3.S(.25*K*(1+o.v*.05)*(i/o.wake.length),.02*K,.6*K)),[.85,.93,.97]); } drawBoat(o); } if(typeof drawGhosts==='function') drawGhosts(); },dt); }

/* ---------- board, toasts ---------- */
let toastT=0, bannerT=0;
const setText=(id,t)=>{ const e=$(id); if(e&&e.textContent!==String(t)) e.textContent=t; };
const badge=c=>svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${c}"/><path d="M50 18 L50 70 L78 70 Z" fill="#f8fafc"/><path d="M46 26 L46 70 L26 70 Z" fill="#e2e8f0"/><path d="M22 76 L78 76 L70 84 L30 84 Z" fill="#f8fafc"/></svg>`);
function updateBoard(){ if(!R) return; const b=R.me, pos=standings().indexOf(b)+1; $('logoL').src=badge(NCOL[b.code]||'#0ea5e9'); setText('nameL',b.crew); setText('tpL',R.C.short); setText('scoreL',R.t<0?'-':`${pos}`); $('logoR').src=badge('#0e7490'); const ld=standings()[0]; setText('nameR',ld===b?'Leading':ld.crew); setText('tpR',`${(windAt(b.x,b.z,R.t).s*KN).toFixed(0)} kn breeze`); setText('scoreR',''); setText('cntT',R.t<0?`-${Math.ceil(-R.t)}s`:fmtT(R.t)); setText('innT',R.C.short); setText('outsT',WINDS[windSel].name); setText('basesT',''); }
function toast(t,col='#34d399'){ const e=$('toast'); e.textContent=t; e.style.borderColor=col; e.classList.add('on'); toastT=2.2; }
function banner(big,sub,glow='#000',dur=2){ const b=$('banner'); b.innerHTML=`<span class="big">${esc(big)}</span>${sub?`<span class="sub">${esc(sub)}</span>`:''}`; b.style.setProperty('--glow',glow); b.classList.add('on'); bannerT=dur; }

/* ---------- input ---------- */
addEventListener('keydown',e=>{ const tag=document.activeElement&&document.activeElement.tagName; if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); if(e.repeat) return; keys.add(e.code); audio();
  if(e.code==='KeyZ'){ toggleFs(); return; }
  if(phase==='menu'){ if(['Enter','NumpadEnter'].includes(e.code)) startGame(); return; }
  if(phase==='over'){ if(e.code==='KeyR'&&!(window.RRV&&RRV.on)) newRace(); else if(['Enter','NumpadEnter','Escape','KeyM'].includes(e.code)) toMenu(); return; }
  if(!R) return;
  if(e.code==='Escape'||e.code==='KeyP'){ if(window.RRV&&RRV.on&&!paused) return; paused=!paused; if(paused) banner('Paused','Esc to resume · M for the menu','#000',1e9); else { $('banner').classList.remove('on'); bannerT=0; } return; }
  if(e.code==='KeyM'&&paused){ paused=false; toMenu(); return; }
  if(e.code==='KeyC'){ camMode=(camMode+1)%3; savePrefs(); toast(['Chase camera','Side camera','Helicopter'][camMode],'#93c5fd'); return; }
  if(e.code==='Space') autoTack(); });
addEventListener('keyup',e=>keys.delete(e.code)); addEventListener('blur',()=>keys.clear());

/* ---------- menu ---------- */
const pill=(attr,val,on,label,key)=>`<button data-${attr}="${val}" class="${on?'on':''}" tabindex="-1">${label}${key?` <kbd>${key}</kbd>`:''}</button>`;
function renderMenu(){ const C=CLS[clsSel]; if(crewSel>=C.crews.length) crewSel=0;
  let h=`<h1>Rink Rivals: Sailing</h1><p>Real sail aerodynamics: the apparent wind your own speed makes, sails that drive, stall and luff, heel against the crew hiking out, hulls that hit their bow wave and skiffs that plane past it, and foilers that fly at twice the wind speed. Read the shifts, take the gusts, nail the start.</p>
  <div class="pills"><span class="lbl">Boat</span>${Object.keys(CLS).map(k=>pill('c',k,clsSel===k,CLS[k].name,'')).join('')}</div>
  <div class="pills"><span class="lbl">You</span>${C.crews.map((c,i)=>pill('cr',i,crewSel===i,`${c[0]} ${c[1]}`,'')).join('')}</div>
  <div class="pills"><span class="lbl">Breeze</span>${WINDS.map((w,i)=>pill('w',i,windSel===i,`${w.name} ${Math.round(w.s*KN)} kn`,'')).join('')}<span class="lbl">Fleet</span>${LVL.map((l,i)=>pill('l',i,lvl===i,l,String(i+1))).join('')}</div>
  <div class="pills"><span class="lbl">Trim</span>${pill('as',1,assist,'Auto trim and hiking','')}${pill('as',0,!assist,'Manual: sheet and hike yourself','')}</div>
  <div class="pills"><button class="gold" data-act="start" tabindex="-1">Race <kbd>Enter</kbd></button><a href="./" tabindex="-1">Home</a><a href="surf" tabindex="-1">Surfing</a><a href="fishing" tabindex="-1">Fishing</a></div>
  <div id="hint">${C.match?'A match race against another America\'s Cup team.':`A ${C.fleet}-boat fleet race.`} Windward / leeward, two laps: start, windward mark, leeward gate, windward mark, finish. ${WINDS[windSel].info}. Your record: ${SV.wins} wins in ${SV.races} races${SV.top?` · top speed ${SV.top} kn`:''}${SV.best[clsSel+'_'+windSel]?` · best time ${fmtT(SV.best[clsSel+'_'+windSel])}`:''}</div>`;
  $('menuIn').innerHTML=h; $('logoL').src=badge(NCOL[C.crews[crewSel][1]]||'#0ea5e9'); setText('nameL',C.crews[crewSel][0]); setText('tpL',C.short); setText('scoreL',''); $('logoR').src=badge('#0e7490'); setText('nameR',C.match?'Match race':'Fleet race'); setText('tpR',LVL[lvl]); setText('scoreR',''); setText('cntT','SAIL'); setText('innT',C.short); setText('outsT',WINDS[windSel].name); setText('basesT',''); renderKeysHelp(); }
$('menuIn').addEventListener('mousedown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
$('menuIn').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset; audio(); sfx.click(); if(d.c){ clsSel=d.c; crewSel=0; } else if(d.cr!==undefined) crewSel=+d.cr; else if(d.w!==undefined) windSel=+d.w; else if(d.l!==undefined) lvl=+d.l; else if(d.as!==undefined) assist=d.as==='1'; else if(d.act==='start'){ startGame(); return; } savePrefs(); renderMenu(); });
addEventListener('keydown',e=>{ if(phase!=='menu') return; if(['Digit1','Digit2','Digit3'].includes(e.code)){ lvl=+e.code.slice(5)-1; savePrefs(); renderMenu(); } });
function startGame(){ audio(); savePrefs(); newRace(); }
function renderKeysHelp(){ $('keysHelp').innerHTML='<div><b>Steer</b> A / D</div><div><b>Tack / gybe</b> SPACE</div><div><b>Sheet in / ease</b> W / S (manual)</div><div><b>Hike</b> Shift (manual)</div><div><b>Camera</b> C</div><div><b>Pause</b> Esc</div>'; }
function toMenu(){ phase='menu'; R=null; $('result').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu(); }

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; frameDtG=dt||1/60; if(!(TEST&&window.__freeze)) step(dt); draw(); requestAnimationFrame(frame); }
function toggleFs(){ const st=$('stage'); try{ if(document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen&&st.requestFullscreen(); }catch(e){} }
$('btnFs').addEventListener('click',toggleFs);
$('btnSnd').addEventListener('click',()=>{ muted=!muted; $('btnSnd').textContent=muted?'Sound off':'Sound on'; if(!muted){ audio(); sfx.click(); } });
$('result').addEventListener('click',()=>{ if(phase==='over') toMenu(); });
if(TEST) window.__sail={get R(){return R;},get phase(){return phase;},step,newRace,keys,autoTack,windAt,set clsSel(v){clsSel=v;},set windSel(v){windSel=v;},set lvl(v){lvl=v;},set assist(v){assist=v;},set camMode(v){camMode=v;},standings,nextMark,stepBoat,CLS};
$('btnView').style.display='none'; $('viewBtn2').style.display='none'; setView3(true);
renderMenu();
requestAnimationFrame(frame);

/* ---------- world records ---------- */
const LBG=((location.pathname.split('/').pop()||'').replace(/\.html$/,'')||'game').toLowerCase(), lbPost=(id,s,t)=>{ try{ window.RRL&&RRL.post(id,s,t); }catch(e){} }, lbBoards=l=>{ try{ window.RRL&&RRL.boards(LBG,l); }catch(e){} };
lbBoards([{id:'wins',name:'Race wins',mode:'sum'},{id:'top',name:'Top speed (knots)',mode:'max'},{id:'t_ilca',name:'Fastest ILCA 7 race (s)',mode:'min'},{id:'t_49er',name:'Fastest 49er race (s)',mode:'min'},{id:'t_nacra',name:'Fastest Nacra 17 race (s)',mode:'min'},{id:'t_ac75',name:'Fastest AC75 race (s)',mode:'min'}]);
{ const _e=endRace; endRace=function(){ const was=R&&R.over, r=_e.apply(this,arguments); try{ if(R&&!was){ const me=R.me; if(me.done&&R.place===1) lbPost('wins',1,R.C.short); if(me.top>0) lbPost('top',Math.round(me.top*KN*10)/10,R.C.short); if(me.done) lbPost('t_'+R.cls,Math.round(me.time*10)/10,`${WINDS[windSel].name} breeze`); } }catch(e){} return r; }; }


/* ---------- online score battle ---------- */
const NETV=window.RRV?RRV.attach({game:'sailing',title:'sailing ghost race',blurb:'Sailing ghost race: everyone sails the same course in the same wind at the same time and sees the others as ghost boats. Fastest finish wins.',
  better:'low',
  opts:()=>({clsSel,windSel,lvl}), start(o){ if(o.clsSel&&CLS[o.clsSel]) clsSel=o.clsSel; if(o.windSel!=null) windSel=o.windSel; if(o.lvl!=null) lvl=o.lvl; newRace(); },
  state(){ if(!R||!R.me) return null; const b=R.me, done=!!b.done||!!R.over; const v=b.done?+b.time.toFixed(2):null;
    const txt=b.done?fmtT(b.time):R.t<0?`start in ${Math.ceil(-R.t)} s`:`leg ${Math.min(4,b.leg+1)} of 4 · ${(b.v*KN).toFixed(1)} kn`;
    const r2=x=>+(+x||0).toFixed(2); return {v,txt,done,pos:[r2(b.x),r2(b.z),r2(b.h),r2(b.heel),r2(b.trim),r2(b.fly),r2(b.awa),b.kite?1:0]}; }}):null;
function drawGhosts(){ if(!window.RRV||!RRV.on||!R) return;
  for(const g of RRV.ghosts()){ if(g.age>3||!g.pos||g.pos.length<8) continue; const q=g.pos;
    drawBoat({x:q[0],z:q[1],h:q[2],heel:q[3],trim:q[4],fly:q[5],awa:q[6],kite:!!q[7],flow:'flow',hikeF:.6,cap:0,me:false,code:'ZZZ',v:0}); } }

})();
