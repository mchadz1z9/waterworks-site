<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Skate</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }

.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; position:relative; z-index:1; }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl{ display:block; }
.viewbtn{ position:absolute; top:8px; right:8px; z-index:4; font:inherit; font-size:15px; color:#fff; background:rgba(5,8,18,.78); border:2px solid #ffd166; border-radius:999px; padding:3px 12px; cursor:pointer; }
.viewbtn:hover{ background:rgba(20,28,51,.95); }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
.st tr.dim td{ opacity:.55; }
.result{ align-items:flex-start; }
.bxw{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.bxs h3{ margin:6px 0 0; font-size:22px; } .bxs h3 img{ width:26px; height:26px; vertical-align:middle; }
.bxs small{ color:#93a0bd; }
.bxw .ls{ font-size:14px; } .bxw .ls th,.bxw .ls td{ padding:1px 6px; }
.result h2{ font-size:clamp(32px,6vw,60px); }
.potg{ margin:12px auto 0; max-width:420px; background:#141c33; border-left:8px solid var(--tc); border-radius:10px; padding:8px 14px; text-align:left; display:flex; flex-direction:column; }
.potg small{ color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:.06em; } .potg b{ font-size:24px; color:#fff; } .potg span{ color:#93a0bd; }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>

<main>
  <div class="top">
    <div class="brand">Rink Rivals <span>Skate</span></div>

    </div>
  </div>

  <section class="board" aria-label="Scoreboard">
    <div class="side" id="sideL"><img id="logoL" alt=""><div style="min-width:0"><div class="tn" id="nameL">-</div><div class="tp" id="tpL">Away</div></div><div class="sc" id="scoreL">0</div></div>
    <div class="clock"><div class="t" id="cntT">0-0</div><div class="pd"><span id="innT">Top 1st</span><span id="basesT"></span></div><div class="pd" id="outsT">0 outs</div></div>
    <div class="side r" id="sideR"><img id="logoR" alt=""><div style="min-width:0"><div class="tn" id="nameR">-</div><div class="tp" id="tpR">Home</div></div><div class="sc" id="scoreR">0</div></div>
  </section>

  <div class="stage" id="stage">

function drawSkater3D(){

  let pitch=0, rollA=0; if(S.mode==='ground'||S.mode==='manual'){ const g=grad(P,S.x,S.z), dx=Math.cos(S.psi), dz=Math.sin(S.psi); pitch=Math.atan(g[0]*dx+g[1]*dz); rollA=-Math.atan(-g[0]*dz+g[1]*dx); }
  if(S.mode==='grind'&&S.grind) pitch=Math.asin(clamp(S.grind.dy,-1,1));
  if(S.mode==='manual') pitch+=.22;
  const base=R3.mm(R3.T(S.x*K3,S.y*K3,S.z*K3),R3.RY(-S.psi),R3.RZ(pitch),R3.RX(rollA));
  /* board */
  const lift=S.mode==='air'?S.pose.lft[1]-.12:0;
  const bm=R3.mm(base,R3.T(0,(.08+lift)*K3,0),R3.RY(S.boardRot.y),R3.RX(S.boardRot.x));
  R3.part(R3.UB,R3.mm(bm,R3.S(.82*K3,.03*K3,.21*K3)),'#1f2937'); R3.part(R3.UB,R3.mm(bm,R3.T(0,.018*K3,0),R3.S(.78*K3,.01*K3,.2*K3)),sk.shirt);
  for(const [x,z] of [[.28,.09],[.28,-.09],[-.28,.09],[-.28,-.09]]) R3.part(R3.UC,R3.mm(bm,R3.T(x*K3,-.05*K3,z*K3),R3.RX(Math.PI/2),R3.S(.06*K3,.04*K3,.06*K3)),'#f8fafc');
  if(S.mode==='bail'){ R3.part(R3.UB,R3.mm(R3.T((S.x+1.2)*K3,.05*K3,S.z*K3),R3.RY(-S.psi+1),R3.S(.82*K3,.03*K3,.21*K3)),'#1f2937'); }
  /* rider */
  const J={}; for(const j of JN) J[j]=wk([S.pose[j][0]*K3,S.pose[j][1]*K3,S.pose[j][2]*K3],base);
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2], Bm=(a,b,th,col)=>R3.part(R3.UB,R3.beam(a,b,th*K3,th*K3),col);
  Bm(J.lhp,J.lkn,.15,sk.pants); Bm(J.lkn,J.lft,.12,sk.pants); Bm(J.rhp,J.rkn,.15,sk.pants); Bm(J.rkn,J.rft,.12,sk.pants);
  for(const f of ['lft','rft']) R3.part(R3.UB,R3.mm(R3.T(...J[f]),R3.RY(-S.psi),R3.S(.26*K3,.08*K3,.11*K3)),'#e5e7eb');
  R3.part(R3.UB,R3.beam(J.hip,J.chest,.22*K3,.36*K3),sk.shirt); Bm(J.lsh,J.rsh,.14,sk.shirt);
  Bm(J.lsh,J.lel,.1,sk.shirt); Bm(J.lel,J.lha,.08,sk.skin); Bm(J.rsh,J.rel,.1,sk.shirt); Bm(J.rel,J.rha,.08,sk.skin);
  R3.part(R3.US,R3.mm(R3.T(...J.head),R3.S(.11*K3,.13*K3,.11*K3)),sk.skin);
  R3.part(R3.US,R3.mm(R3.T(J.head[0],J.head[1]+.045*K3,J.head[2]),R3.S(.118*K3,.1*K3,.118*K3)),sk.helmet?'#111827':sk.hair);
  R3.shadow(S.x*K3,S.z*K3,24);
}
function render3D(dt){
  if(!S){ const a=performance.now()/8000; R3.frame({eye:[Math.sin(a)*20*K3,9*K3,Math.cos(a)*20*K3],center:[0,0,0],fov:55},()=>{},dt); return; }
  build3();
  const d=S.mode==='air'&&S.vert?Math.atan2(-S.vert.nz,-S.vert.nx):S.mode==='air'?Math.atan2(S.vz,S.vx):S.psi;
  if(!cam3) cam3={a:d,x:S.x,y:S.y,z:S.z}; const k=1-Math.exp(-dt*(S.mode==='air'?1.5:4)); cam3.a+=angD(d-cam3.a)*k; cam3.x=lerp(cam3.x,S.x,Math.min(1,dt*8)); cam3.z=lerp(cam3.z,S.z,Math.min(1,dt*8)); cam3.y=lerp(cam3.y,S.y,Math.min(1,dt*(S.mode==='air'?2:6)));
  const ca=Math.cos(cam3.a), sa=Math.sin(cam3.a); let back=S.vert?5.5:4.6, ey=cam3.y+2.3;
  for(let b=.6;b<=back;b+=.3){ const h=Hf(S.P,cam3.x-ca*b,cam3.z-sa*b); if(h>ey-.9){ if(h>cam3.y+3.2||h>=90){ back=Math.max(1.4,b-.4); break; } ey=h+.9; } }
  const cam={eye:[(cam3.x-ca*back)*K3,ey*K3,(cam3.z-sa*back)*K3],center:[(cam3.x+ca*2.5)*K3,(cam3.y+.9)*K3,(cam3.z+sa*2.5)*K3],fov:64,sky:S.P.sky||[.06,.07,.1]};
  R3.frame(cam,()=>{ drawSkater3D(); },dt);
}

/* ---------- 2D fallback (top-down) ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'); cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
function hudText(t,x,y,size=18,col='#fff',align='left'){ ctx.font=`800 ${size}px 'Big Shoulders Display','Arial Narrow',sans-serif`; ctx.textAlign=align; ctx.lineWidth=Math.max(3,size/6); ctx.strokeStyle='rgba(0,0,0,.7)'; ctx.strokeText(t,x,y); ctx.fillStyle=col; ctx.fillText(t,x,y); }
function draw2D(){
  const P=S.P, sc=Math.min(W/(P.bx*2+6),H/(P.bz*2+6)), ox=W/2, oy=H/2, X=x=>ox+x*sc, Z=z=>oy+z*sc;
  ctx.fillStyle=P.floor; ctx.fillRect(0,0,W,H);
  for(const s of P.shapes){ ctx.fillStyle=s.t==='qp'?'#c99563':s.t==='box'?'#9ca3af':s.t==='steps'?'#a1a1aa':'#b8b0a6';
    if(s.t==='qp'){ if(s.axis==='z'){ const z0=s.at, z1=s.at+s.side*s.r; ctx.fillRect(X(s.from),Z(Math.min(z0,z1)),(s.to-s.from)*sc,s.r*sc); } else { const x0=s.at, x1=s.at+s.side*s.r; ctx.fillRect(X(Math.min(x0,x1)),Z(s.from),s.r*sc,(s.to-s.from)*sc); } }
    else ctx.fillRect(X(s.x0),Z(s.z0),(s.x1-s.x0)*sc,(s.z1-s.z0)*sc); }
  ctx.strokeStyle='#fbbf24'; ctx.lineWidth=3; for(const r of P.rails){ ctx.beginPath(); ctx.moveTo(X(r[0][0]),Z(r[0][2])); ctx.lineTo(X(r[1][0]),Z(r[1][2])); ctx.stroke(); }
  P.letters.forEach((L,i)=>{ if(!S.letters[i]) hudText('SKATE'[i],X(L[0]),Z(L[2])+6,18,'#ffd166','center'); });
  ctx.save(); ctx.translate(X(S.x),Z(S.z)); ctx.rotate(S.psi); const r=6+S.y*2; ctx.fillStyle=SKATERS[S.sk].shirt; ctx.fillRect(-r,-r*.4,r*2,r*.8); ctx.restore();
}

/* ---------- HUD ---------- */
const fmtN=n=>Math.round(n).toLocaleString('en-US');
function balanceBar(v,vertical){ const cx=W/2, cy=H/2+60; ctx.fillStyle='rgba(5,8,18,.75)'; if(vertical){ ctx.fillRect(cx+90,cy-90,14,180); ctx.fillStyle='#22c55e'; ctx.fillRect(cx+90,cy-14,14,28); ctx.fillStyle='#fff'; ctx.fillRect(cx+86,cy+v*90-2,22,4); } else { ctx.fillRect(cx-90,cy+60,180,14); ctx.fillStyle='#22c55e'; ctx.fillRect(cx-14,cy+60,28,14); ctx.fillStyle='#fff'; ctx.fillRect(cx+v*90-2,cy+56,4,22); } }
function drawHUD(){
  const P=S.P;
  ctx.fillStyle='rgba(5,8,18,.78)'; ctx.beginPath(); ctx.roundRect(14,14,250,74,10); ctx.fill();
  hudText(fmtN(S.score),26,52,34,'#ffd166'); hudText(`Best combo ${fmtN(S.best)}`,26,76,15,'#cbd5e1');
  if(S.timed){ const t=Math.max(0,Math.ceil(S.time)); hudText(`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`,W-24,84,34,t<=10?'#ef4444':'#fff','right'); }
  ctx.fillStyle='rgba(5,8,18,.78)'; ctx.fillRect(20,96,200,10); ctx.fillStyle=S.special>=1?(Math.sin(performance.now()/90)>0?'#f59e0b':'#fde047'):'#38bdf8'; ctx.fillRect(20,96,200*S.special,10); hudText(S.special>=1?'SPECIAL! J+K in the air':'Special',24,124,14,S.special>=1?'#fde047':'#93c5fd');
  'SKATE'.split('').forEach((c,i)=>hudText(c,W-150+i*24,116,22,S.letters[i]?'#ffd166':'rgba(255,255,255,.25)','center'));
  if(S.tape) hudText('📼',W-30,116,20,'#fff','center');
  const C=S.combo;
  if(C.list.length){ hudText(C.list.slice(-5).join(' + '),W/2,H-58,20,'#fff','center'); hudText(`${fmtN(C.pts)} × ${C.mult}`,W/2,H-24,30,'#ffd166','center'); }
  else if(S.lastBank&&S.lastBank.t<1.6){ hudText(S.lastBank.ok?`${fmtN(S.lastBank.tot)}`:S.lastBank.txt,W/2,H-30,34,S.lastBank.ok?'#34d399':'#ef4444','center'); if(S.lastBank.ok) hudText(S.lastBank.txt,W/2,H-66,16,'#cbd5e1','center'); }
  S.popups.forEach((p,i)=>{ hudText(p.txt,W/2,H/2-80-i*26-p.t*20,22,'#fff','center'); });
  if(S.mode==='grind'&&S.grind) balanceBar(S.grind.bl,false);
  if(S.mode==='manual'&&S.manual) balanceBar(S.manual.bl,true);
  if(S.mode==='air'&&S.vert) hudText(`${Math.round(S.spin*180/Math.PI)}°`,W/2,140,22,'#93c5fd','center');
  if(view3){ const proj=(x,y,z)=>{ const p=R3.proj(x*K3,y*K3,z*K3); return p?[p[0]*W,p[1]*H]:null; };
    P.letters.forEach((L,i)=>{ if(S.letters[i]) return; const p=proj(L[0],L[1]+Math.sin(performance.now()/300+i)*.15,L[2]); if(p) hudText('SKATE'[i],p[0],p[1],40,'#ffd166','center'); });
    if(!S.tape){ const p=proj(...S.P.tape); if(p) hudText('📼',p[0],p[1],34,'#fff','center'); } }
  if(phase==='play'&&S.ph<7) hudText('Shift push · Space hold and let go to ollie · J flip · K grab (hold) · L grind · I manual · A/D turn and spin',W/2,H-100,17,'#ffd166','center');
}
function draw(){
  if(view3) render3D(frameDtG);
  ctx.clearRect(0,0,W,H);
  if(!S){ if(!view3){ ctx.fillStyle='#111827'; ctx.fillRect(0,0,W,H); } return; }
  if(!view3) draw2D();
  drawHUD();
}

/* ---------- results, menus, career ---------- */
let toastT=0, bannerT=0;
const setText=(id,t)=>{ const e=$(id); if(e&&e.textContent!==String(t)) e.textContent=t; };
function toast(t,col='#34d399'){ const e=$('toast'); e.textContent=t; e.style.borderColor=col; e.classList.add('on'); toastT=2.2; }
function banner(big,sub,glow='#000',dur=2){ const b=$('banner'); b.innerHTML=`<span class="big">${esc(big)}</span>${sub?`<span class="sub">${esc(sub)}</span>`:''}`; b.style.setProperty('--glow',glow); b.classList.add('on'); bannerT=dur; }
function updateBoard(){ if(!S) return; const sk=SKATERS[S.sk]; setText('nameL',sk.name); setText('tpL',sk.style); setText('scoreL',''); $('sideL').style.setProperty('--tc',sk.shirt); $('logoL').src=badgeS(sk); setText('nameR',S.P.name); setText('tpR',`${Object.keys(S.done).length}/${S.P.goals.length} goals`); setText('scoreR',''); $('logoR').src=badgeS(sk); const t=Math.max(0,Math.ceil(S.time)); setText('cntT',S.timed?`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`:'Free'); setText('innT',fmtN(S.score)); setText('outsT',S.mode==='air'?'Air':S.mode==='grind'?'Grind':S.mode==='manual'?'Manual':S.mode==='bail'?'Bail':'Rolling'); setText('basesT',''); }
const badgeS=sk=>svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="${sk.shirt}"/><rect x="18" y="44" width="64" height="12" rx="6" fill="#111827"/><circle cx="30" cy="62" r="6" fill="#f8fafc"/><circle cx="70" cy="62" r="6" fill="#f8fafc"/></svg>`);
const CKEY='rinkRivalsSkateCareerV1';
let CAR=null; try{ CAR=JSON.parse(localStorage.getItem(CKEY)||'null'); }catch(e){}
if(!CAR) CAR={goals:{},best:{},boost:{},unlocked:1};
function saveCar(){ try{ localStorage.setItem(CKEY,JSON.stringify(CAR)); }catch(e){} }
function endSession(){
  if(S.combo.list.length&&S.mode!=='bail') bankCombo();
  phase='over'; const P=S.P, key=P.id; CAR.best[key]=Math.max(CAR.best[key]||0,S.score);
  let newG=0; const g=CAR.goals[key]=CAR.goals[key]||{}; for(const i in S.done){ if(!g[i]){ g[i]=1; newG++; const b=CAR.boost[S.sk]=CAR.boost[S.sk]||{}; const k=pick(['air','speed','spin','bal','flip']); b[k]=(b[k]||0)+1; } }
  const total=Object.keys(g).length; if(total>=P.unlock&&CAR.unlocked<=S.pi+1) CAR.unlocked=Math.min(PARKS.length,S.pi+2);
  saveCar();
  $('resultIn').innerHTML=`<h2>${fmtN(S.score)}</h2><div class="rs" style="font-size:clamp(22px,3vw,32px)">${esc(SKATERS[S.sk].name)} · ${esc(P.name)}</div><p>Best combo ${fmtN(S.best)} · Biggest spin ${S.maxSpin}° · Longest grind ${S.grindT.toFixed(1)}s</p>
  <table class="ls"><tr><th>Goal</th><th></th></tr>${P.goals.map(([t,v,n],i)=>`<tr><td>${esc(n)}</td><td>${g[i]?(S.done[i]?'✅ new':'✅'):'⬜'}</td></tr>`).join('')}</table>
  <p>${newG?`${newG} new goal${newG>1?'s':''}! +${newG} stat point${newG>1?'s':''} for ${esc(SKATERS[S.sk].name)}.`:''}${CAR.unlocked>S.pi+1&&PARKS[S.pi+1]&&newG?` ${esc(PARKS[S.pi+1].name)} unlocked!`:''}</p><p>Enter for the menu, R to skate again.</p>`;
  setTimeout(()=>{ if(phase==='over') $('result').classList.remove('hidden'); },500);
}
const pill=(attr,val,on,label,key,dis)=>`<button data-${attr}="${val}" class="${on?'on':''}" tabindex="-1"${dis?' disabled style="opacity:.35"':''}>${label}${key?` <kbd>${key}</kbd>`:''}</button>`;
function renderMenu(){
  const sk=SKATERS[skSel], P=PARKS[parkSel], b=CAR.boost[skSel]||{}, st=k=>sk[k]+(b[k]||0);
  let h=`<h1>Rink Rivals: Skate</h1><p>Real pro skaters, two parks, flip tricks, grabs, spins, grinds, manuals, combos with multipliers and special tricks. Two-minute career runs with goals, S-K-A-T-E letters and secret tapes.</p>
  <div class="pills">${pill('m',1,menuMode===1,'Career run','1')}${pill('m',2,menuMode===2,'Free skate','2')}<a href="./" tabindex="-1">Home</a><a href="hockey" tabindex="-1">Hockey</a><a href="ufc" tabindex="-1">UFC</a></div>
  <div class="pills"><span class="lbl">Park</span>${PARKS.map((p,i)=>pill('pk',i,parkSel===i,i<CAR.unlocked?p.name:`🔒 ${p.name}`,'',i>=CAR.unlocked)).join('')}</div>
  <div class="pickers"><div class="pk p1"><button class="ar" data-sk="-1" tabindex="-1">‹</button><div class="mid"><div class="who">Skater</div><img src="${badgeS(sk)}" alt=""><div class="n">${FLAGS[sk.nat]||''} ${esc(sk.name)}</div><div class="meta">${sk.style} · Air ${st('air')} · Speed ${st('speed')} · Spin ${st('spin')} · Balance ${st('bal')} · Flip ${st('flip')}</div><div class="meta">Special: ${esc(sk.special)}</div></div><button class="ar" data-sk="1" tabindex="-1">›</button></div></div>
  <div class="pills"><button class="gold" data-act="start" tabindex="-1">Drop in <kbd>Enter</kbd></button></div>
  <div class="how" style="flex-direction:column;align-items:center"><div><b>Goals at ${esc(P.name)}</b> (${Object.keys(CAR.goals[P.id]||{}).length}/${P.goals.length}) · best run ${fmtN(CAR.best[P.id]||0)}</div><div style="font-size:11px;max-width:880px;line-height:1.3">${P.goals.map(([t,v,n],i)=>`${(CAR.goals[P.id]||{})[i]?'✅':'⬜'} ${esc(n)}`).join(' · ')}</div></div>`;
  $('menuIn').innerHTML=h; setText('nameL',sk.name); setText('tpL',sk.style); $('logoL').src=badgeS(sk); $('sideL').style.setProperty('--tc',sk.shirt); setText('nameR',P.name); setText('tpR',menuMode===1?'2:00 run':'Free skate'); $('logoR').src=badgeS(sk); $('sideR').style.setProperty('--tc','#ffd166'); setText('scoreL',''); setText('scoreR',''); setText('cntT',menuMode===1?'2:00':'Free'); setText('innT','0'); setText('outsT','Ready'); setText('basesT','');
  renderKeysHelp();
}
$('menuIn').addEventListener('mousedown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
$('menuIn').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; const d=b.dataset; audio(); sfx.click();
  if(d.m) menuMode=+d.m; else if(d.pk!==undefined) parkSel=+d.pk; else if(d.sk) skSel=(skSel+ +d.sk+SKATERS.length)%SKATERS.length; else if(d.act==='start'){ startGame(); return; } renderMenu(); });
function menuKey(code){ if(code==='Digit1'||code==='Digit2'){ menuMode=+code.slice(5); renderMenu(); } else if(code==='KeyA'||code==='ArrowLeft'){ skSel=(skSel-1+SKATERS.length)%SKATERS.length; renderMenu(); } else if(code==='KeyD'||code==='ArrowRight'){ skSel=(skSel+1)%SKATERS.length; renderMenu(); } else if(['Enter','NumpadEnter','Space'].includes(code)) startGame(); }
function renderKeysHelp(){ $('keysHelp').innerHTML='<div><b>Push</b> Shift (or W)</div><div><b>Turn / spin</b> A D</div><div><b>Brake</b> S</div><div><b>Ollie</b> hold Space, let go</div><div><b>Flip tricks</b> J + direction</div><div><b>Grabs</b> hold K + direction</div><div><b>Grind</b> L near a rail or ledge (+ direction)</div><div><b>Manual</b> I (W/S to balance)</div><div><b>Special</b> J+K when the bar glows</div><div><b>View</b> V</div><div><b>Pause</b> Esc</div>'; }
function startGame(){ audio(); if(parkSel>=CAR.unlocked) parkSel=0; newSession(skSel,parkSel,menuMode===1); }
function toMenu(){ phase='menu'; S=null; $('result').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu(); }
function hideHub(){ document.body.classList.remove('inhub'); }

/* ---------- input and loop ---------- */
addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName; if(tag==='INPUT'||tag==='SELECT') return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.repeat) return; keys.add(e.code); audio();
  if(e.code==='KeyZ'){ toggleFs(); return; }
  if(e.code==='KeyV'){ setView3(!view3); return; }
  if(phase==='menu'){ menuKey(e.code); return; }
  if(phase==='over'){ if(e.code==='KeyR') startGame(); else if(['Enter','NumpadEnter','Space','Escape'].includes(e.code)) toMenu(); return; }
  if(e.code==='Escape'){ paused=!paused; if(paused) banner('Paused','Esc to resume · M for menu','#000',1e9); else { $('banner').classList.remove('on'); bannerT=0; } return; }
  if(e.code==='KeyM'){ if(confirm('End this run?')) endSession(); keys.clear(); return; }
  press(e.code);
});
addEventListener('keyup',e=>{ keys.delete(e.code); release(e.code); });
addEventListener('blur',()=>keys.clear());
let last=performance.now();
function loopStep(dt){
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('on'); }
  if(bannerT>0&&!paused){ bannerT-=dt; if(bannerT<=0) $('banner').classList.remove('on'); }
  rollTick(S?(S.mode==='ground'||S.mode==='manual'?S.s:0):0,S&&S.mode==='grind',S&&phase==='play'&&!paused&&S.mode!=='air'&&S.mode!=='bail');
  if(!S||paused||phase!=='play') return;
  for(let i=0;i<4;i++) step(dt/4);
  animate(dt);
  if(S.timed){ S.time-=dt; if(S.time<=0){ S.time=0; if(S.mode==='ground'||S.mode==='bail'){ endSession(); } else if(S.time<-4) endSession(); } }
  updateBoard();
}
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; frameDtG=dt||1/60; loopStep(dt); draw(); requestAnimationFrame(frame); }
function toggleFs(){ const st=$('stage'); try{ if(document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen&&st.requestFullscreen(); }catch(e){} }
$('btnFs').addEventListener('click',toggleFs);
$('btnView').addEventListener('click',()=>setView3(!view3));
$('viewBtn2').addEventListener('click',e=>{ e.stopPropagation(); audio(); setView3(!view3); });
$('btnSnd').addEventListener('click',()=>{ muted=!muted; $('btnSnd').textContent=muted?'Sound off':'Sound on'; if(!muted){ audio(); sfx.click(); } });
$('result').addEventListener('click',()=>{ if(phase==='over') toMenu(); });
if(TEST) window.__sk={get S(){return S;},get phase(){return phase;},startGame,step,press,release,keys,setPark:i=>{parkSel=i;},CAR:()=>CAR,Hf,PARKS,endSession};
setView3(view3);
renderMenu();
requestAnimationFrame(frame);
})();
</script>
