<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Storm Royale</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }

.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; position:relative; z-index:1; }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl{ display:block; }
.viewbtn{ position:absolute; top:8px; right:8px; z-index:4; font:inherit; font-size:15px; color:#fff; background:rgba(5,8,18,.78); border:2px solid #ffd166; border-radius:999px; padding:3px 12px; cursor:pointer; }
.viewbtn:hover{ background:rgba(20,28,51,.95); }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
.st tr.dim td{ opacity:.55; }
.result{ align-items:flex-start; }
.bxw{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.bxs h3{ margin:6px 0 0; font-size:22px; } .bxs h3 img{ width:26px; height:26px; vertical-align:middle; }
.bxs small{ color:#93a0bd; }
.bxw .ls{ font-size:14px; } .bxw .ls th,.bxw .ls td{ padding:1px 6px; }
.result h2{ font-size:clamp(32px,6vw,60px); }
.potg{ margin:12px auto 0; max-width:420px; background:#141c33; border-left:8px solid var(--tc); border-radius:10px; padding:8px 14px; text-align:left; display:flex; flex-direction:column; }
.potg small{ color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:.06em; } .potg b{ font-size:24px; color:#fff; } .potg span{ color:#93a0bd; }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Rink Rivals <span>Storm Royale</span></div>
    <div class="tools">
      <a href="./">Home</a> <a href="hockey">Hockey</a>
      <a href="airsoft">Airsoft</a>
      <a href="paintball">Paintball</a>
      <button id="btnView" tabindex="-1">Broadcast 3D</button>
      <button id="btnFs" tabindex="-1">Full screen (Z)</button>
      <button id="btnSnd" tabindex="-1">Sound on</button>
    </div>
  </div>

  <section class="board" aria-label="Scoreboard">
    <div class="side" id="sideL"><img id="logoL" alt=""><div style="min-width:0"><div class="tn" id="nameL">-</div><div class="tp" id="tpL">Away</div></div><div class="sc" id="scoreL">0</div></div>
    <div class="clock"><div class="t" id="cntT">0-0</div><div class="pd"><span id="innT">Top 1st</span><span id="basesT"></span></div><div class="pd" id="outsT">0 outs</div></div>
    <div class="side r" id="sideR"><img id="logoR" alt=""><div style="min-width:0"><div class="tn" id="nameR">-</div><div class="tp" id="tpR">Home</div></div><div class="sc" id="scoreR">0</div></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <button class="viewbtn" id="viewBtn2" tabindex="-1">View: Broadcast 3D</button>
    <canvas id="cv" role="img" aria-label="Storm Royale game"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="menu"><div class="menu-in" id="menuIn"></div></div>
    <div class="overlay result hidden" id="result"><div id="resultIn"></div></div>
  </div>

  <footer class="keys" id="keysHelp"></footer>
  <section class="hub" id="hub" aria-label="Season hub"></section>
</main>
<script src="online.js"></script>
<script src="versus.js"></script>
<script>
(() => {
'use strict';
const W=1120, H=620, DPR=Math.min(2, window.devicePixelRatio||1);
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const TEST=/[?&]test\b/.test(location.search);
const rnd=(a,b)=>a+(b-a)*Math.random(), pick=a=>a[Math.floor(Math.random()*a.length)];
function gauss(){ let u=0; while(!u) u=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random()); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- vectors ---------- */
const v3=(x=0,y=0,z=0)=>[x,y,z], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{ const l=len(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; }, madd=(a,b,s)=>{ a[0]+=b[0]*s; a[1]+=b[1]*s; a[2]+=b[2]*s; return a; };
function rotV(v,ax,ang){ const c=Math.cos(ang), s=Math.sin(ang), d=dot(ax,v), cr=cross(ax,v); return [v[0]*c+cr[0]*s+ax[0]*d*(1-c),v[1]*c+cr[1]*s+ax[1]*d*(1-c),v[2]*c+cr[2]*s+ax[2]*d*(1-c)]; }
const angD=a=>{ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; };

const G=9.81;
const sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

/* ---------- the island ----------
   An 800 m island: rolling hills, a mountain, a lake, beaches. Seven named towns of buildings with chests inside.
   The height is precomputed on a 4 m grid and read back bilinearly, so the physics is fast. */
const ISL={R:370,half:420,cell:4};
let HG=null, HN=0, WORLD=null;
function noise2(x,z,s){ return Math.sin(x*.013*s+1.7)*Math.cos(z*.011*s+.4)+.5*Math.sin(x*.031*s+z*.023*s+2.1)+.25*Math.sin(-x*.067*s+z*.059*s+.7); }
function rawH(x,z){ const r=Math.hypot(x,z), isl=1-sstep(ISL.R-70,ISL.R+20,r); let h=2+noise2(x,z,1)*7+noise2(x+300,z-200,1.9)*2.5;
  h+=55*Math.exp(-((x-150)**2+(z+140)**2)/9000); /* Crater Peak */ h-=9*Math.exp(-((x+120)**2+(z-150)**2)/3500); /* Lazy Lagoon */
  for(const t of TOWNS){ const d=Math.hypot(x-t.x,z-t.z); if(d<t.r+30){ const k=1-sstep(t.r*.6,t.r+30,d); h=lerp(h,t.h,k); } }
  return lerp(-6,h,isl); }
const TOWNS=[{name:'Pine Hollow',x:-190,z:-170,r:55},{name:'Rusty Yard',x:40,z:-250,r:50},{name:'Sunny Shores',x:250,z:120,r:55},{name:'Crater Peak',x:150,z:-140,r:35},{name:'Lazy Lagoon',x:-130,z:170,r:45},{name:'Fort Foxtrot',x:0,z:20,r:60},{name:'Mill Valley',x:-260,z:40,r:45}];
function buildHeights(){ for(const t of TOWNS) t.h=0; for(const t of TOWNS){ let s=0,n=0; for(let a=0;a<8;a++){ const x=t.x+Math.cos(a)*t.r*.5, z=t.z+Math.sin(a)*t.r*.5; s+=rawHnoTown(x,z); n++; } t.h=Math.max(1.5,s/n); }
  HN=Math.ceil(ISL.half*2/ISL.cell)+1; HG=new Float32Array(HN*HN); for(let i=0;i<HN;i++) for(let j=0;j<HN;j++) HG[i*HN+j]=rawH(-ISL.half+i*ISL.cell,-ISL.half+j*ISL.cell); }
function rawHnoTown(x,z){ const r=Math.hypot(x,z), isl=1-sstep(ISL.R-70,ISL.R+20,r); let h=2+noise2(x,z,1)*7+noise2(x+300,z-200,1.9)*2.5; h+=55*Math.exp(-((x-150)**2+(z+140)**2)/9000); h-=9*Math.exp(-((x+120)**2+(z-150)**2)/3500); return lerp(-6,h,isl); }
function terrainH(x,z){ const c=ISL.cell, fx=(x+ISL.half)/c, fz=(z+ISL.half)/c; if(fx<0||fz<0||fx>=HN-1||fz>=HN-1) return -6; const i=Math.floor(fx), j=Math.floor(fz), u=fx-i, v=fz-j, a=HG[i*HN+j], b=HG[(i+1)*HN+j], cc=HG[i*HN+j+1], d=HG[(i+1)*HN+j+1]; return lerp(lerp(a,b,u),lerp(cc,d,u),v); }
const WATER=0;

/* ---------- buildings: boxes you can walk around and inside, with door gaps and stairs ---------- */
/* every solid is an axis-aligned box {x0,x1,y0,y1,z0,z1}; floors and roofs are boxes too, so you can stand on them */
let HOUSES=[];
function mkWorld(seed){ const rng=mulberry32(seed||77), B=[], CH=[], SP=[], TR=[], RK=[], CARS=[]; HOUSES=[];
  buildHeights();
  const box=(x0,x1,y0,y1,z0,z1,col,kind)=>B.push({x0:Math.min(x0,x1),x1:Math.max(x0,x1),y0,y1,z0:Math.min(z0,z1),z1:Math.max(z0,z1),col,kind:kind||'wall'});
  /* a house: walls with a door gap, a window gap, a floor, maybe a second storey and a roof */
  function house(cx,cz,w,d,floors,col,roof){ const y=terrainH(cx,cz)+.05, H=3.2, t=.25, door=1.5, HS={x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,y0:y+.15,door:[cx,cz-d/2],stair:[cx+w/2-.95,cz-d/2+.6],top:[cx+w/2-.95,cz-d/2+4.6],H}; HOUSES.push(HS);
    box(cx-w/2,cx+w/2,y-1.5,y+.15,cz-d/2,cz+d/2,'#8b7355','floor');

  }
  function warehouse(cx,cz,w,d){ const y=terrainH(cx,cz)+.05, H=6, t=.3, HS={x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,y0:y+.15,door:[cx,cz-d/2],H}; HOUSES.push(HS); box(cx-w/2,cx+w/2,y-1.5,y+.15,cz-d/2,cz+d/2,'#6b7280','floor');

    box(cx-w/2-.3,cx+w/2+.3,y+H,y+H+.3,cz-d/2-.3,cz+d/2+.3,'#475569','roof');
    for(let i=0;i<3;i++){ const x=cx-w/3+i*w/3; box(x-1.2,x+1.2,y,y+1.8,cz+d/2-3,cz+d/2-1,'#a16207','crate'); } box(cx-w/4,cx+w/4,y,y+2.6,cz-1,cz+1,'#78716c','crate');
    CH.push({x:cx,y,z:cz+1.8,open:false,tier:1,hs:HS,lv:0}); CH.push({x:cx-w/2+1.5,y,z:cz-d/2+1.5,open:false,tier:0,hs:HS,lv:0}); for(let i=0;i<3;i++) SP.push({x:cx+(i-1)*w/4,y,z:cz-d/4,used:false,hs:HS,lv:0}); }
  function tower(cx,cz){ const y=terrainH(cx,cz)+.05; for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]) box(cx+sx*2-.2,cx+sx*2+.2,y,y+12,cz+sz*2-.2,cz+sz*2+.2,'#7c2d12','post');
    box(cx-2.6,cx+2.6,y+12,y+12.25,cz-2.6,cz+2.6,'#92400e','floor'); for(let s=0;s<24;s++){ const a=s/24*Math.PI*2*1.5; box(cx+Math.cos(a)*1.4-.45,cx+Math.cos(a)*1.4+.45,y+s*.5,y+s*.5+.15,cz+Math.sin(a)*1.4-.45,cz+Math.sin(a)*1.4+.45,'#a16207','stair'); }
    CH.push({x:cx+1.5,y:y+12.25,z:cz+1.5,open:false,tier:2,tower:1}); }
  const HC=['#e9d5b7','#bfdbfe','#fecaca','#d9f99d','#fde68a','#e5e7eb','#c4b5fd'], RC=['#7f1d1d','#1e3a8a','#14532d','#78350f','#334155'];
  for(const t of TOWNS){ const n=t.name==='Fort Foxtrot'?9:t.name==='Crater Peak'?3:6; const pts=[];
    for(let k=0;k<n*8&&pts.length<n;k++){ const a=rng()*Math.PI*2, r=8+rng()*(t.r-14), x=t.x+Math.cos(a)*r, z=t.z+Math.sin(a)*r; if(pts.every(p=>Math.hypot(p[0]-x,p[1]-z)>17)) pts.push([x,z]); }
    pts.forEach(([x,z],i)=>{ if(t.name==='Rusty Yard'&&i<3) warehouse(x,z,18,12); else if(t.name==='Fort Foxtrot'&&i===0) tower(x,z); else house(x,z,8+Math.floor(rng()*3)*2,8+Math.floor(rng()*2)*2,rng()<.45?2:1,HC[Math.floor(rng()*HC.length)],RC[Math.floor(rng()*RC.length)]); });

  /* lone huts and loot in the wild */
  for(let i=0;i<14;i++){ const a=rng()*Math.PI*2, r=60+rng()*260, x=Math.cos(a)*r, z=Math.sin(a)*r; if(TOWNS.some(t=>Math.hypot(t.x-x,t.z-z)<t.r+25)||terrainH(x,z)<1.5) continue; house(x,z,6,6,1,HC[i%HC.length],RC[i%RC.length]); }
  /* trees and rocks you can harvest */
  for(let i=0;i<900;i++){ const x=rnd(-ISL.R,ISL.R), z=rnd(-ISL.R,ISL.R), h=terrainH(x,z); if(h<1.2||TOWNS.some(t=>Math.hypot(t.x-x,t.z-z)<t.r*.85)) continue; if(B.some(b=>x>b.x0-3&&x<b.x1+3&&z>b.z0-3&&z<b.z1+3)) continue; TR.push({x,z,y:h,s:.8+rng()*.6,hp:150,kind:rng()<.25?'oak':'pine'}); }
  for(let i=0;i<260;i++){ const x=rnd(-ISL.R,ISL.R), z=rnd(-ISL.R,ISL.R), h=terrainH(x,z); if(h<1||TOWNS.some(t=>Math.hypot(t.x-x,t.z-z)<t.r*.8)) continue; RK.push({x,z,y:h,s:.8+rng()*1.4,hp:300}); }
  /* a spatial grid of the solid boxes */
  const GC=16, grid=new Map(); B.forEach((b,i)=>{ for(let gx=Math.floor(b.x0/GC);gx<=Math.floor(b.x1/GC);gx++) for(let gz=Math.floor(b.z0/GC);gz<=Math.floor(b.z1/GC);gz++){ const k=gx*10007+gz; if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(i); } });
  WORLD={B,CH,SP,TR,RK,CARS,grid,GC,builds:[],bgrid:new Map(),items:[],HOUSES}; return WORLD; }
function boxesNear(x,z,r){ const W=WORLD, GC=W.GC, out=new Set(); for(let gx=Math.floor((x-r)/GC);gx<=Math.floor((x+r)/GC);gx++) for(let gz=Math.floor((z-r)/GC);gz<=Math.floor((z+r)/GC);gz++){ const L=W.grid.get(gx*10007+gz); if(L) for(const i of L) out.add(W.B[i]); }
  for(let gx=Math.floor((x-r)/BC);gx<=Math.floor((x+r)/BC);gx++) for(let gz=Math.floor((z-r)/BC);gz<=Math.floor((z+r)/BC);gz++){ const L=W.bgrid.get(gx*10007+gz); if(L) for(const p of L) if(p.hp>0) for(const b of p.boxes) out.add(b); }
  return out; }

/* ---------- player-built pieces on a 4 m grid: walls, floors, ramps. Each is made of boxes (ramps of steps) ---------- */
const BC=4, BH=3.4, MATS={wood:{hp:150,build:3,col:'#b45309'},stone:{hp:300,build:6,col:'#9ca3af'},metal:{hp:450,build:9,col:'#64748b'}};
function pieceBoxes(p){ const x=p.gx*BC, z=p.gz*BC, y=p.y, t=.22, out=[];
  if(p.type==='floor') out.push({x0:x,x1:x+BC,y0:y-.2,y1:y,z0:z,z1:z+BC});
  else if(p.type==='wall'){ if(p.dir%2===0){ const zz=p.dir===0?z+BC:z; out.push({x0:x,x1:x+BC,y0:y,y1:y+BH,z0:zz-t/2,z1:zz+t/2}); } else { const xx=p.dir===1?x+BC:x; out.push({x0:xx-t/2,x1:xx+t/2,y0:y,y1:y+BH,z0:z,z1:z+BC}); } }
  else if(p.type==='ramp'){ const n=12; for(let s=0;s<n;s++){ const a=s/n, b=(s+1)/n, h=y+b*BH; let r;
      if(p.dir===0) r={x0:x,x1:x+BC,z0:z+a*BC,z1:z+b*BC}; else if(p.dir===2) r={x0:x,x1:x+BC,z0:z+BC-b*BC,z1:z+BC-a*BC}; else if(p.dir===1) r={x0:x+a*BC,x1:x+b*BC,z0:z,z1:z+BC}; else r={x0:x+BC-b*BC,x1:x+BC-a*BC,z0:z,z1:z+BC};
      out.push(Object.assign(r,{y0:h-.25,y1:h,ramp:1})); } }
  for(const b of out){ b.piece=p; b.col=MATS[p.mat].col; } return out; }
function addPiece(p){ const W=WORLD; p.boxes=pieceBoxes(p); W.builds.push(p); const k=p.gx*10007+p.gz; if(!W.bgrid.has(k)) W.bgrid.set(k,[]); W.bgrid.get(k).push(p); return p; }
function pieceAt(type,gx,gz,y,dir){ const L=WORLD.bgrid.get(gx*10007+gz)||[]; return L.find(p=>p.hp>0&&p.type===type&&Math.abs(p.y-y)<.5&&(type==='floor'||p.dir===dir)); }
function removePiece(p){ p.hp=0; const L=WORLD.bgrid.get(p.gx*10007+p.gz); if(L){ const i=L.indexOf(p); if(i>=0) L.splice(i,1); } const i=WORLD.builds.indexOf(p); if(i>=0) WORLD.builds.splice(i,1); }

/* the highest thing you can stand on below a point (terrain, floors, roofs, stairs, ramps, crates, cars) */
function groundAt(x,y,z,r){ let g=Math.max(terrainH(x,z),WATER-1.3); for(const b of boxesNear(x,z,r+1)){ if(x>b.x0-r*.5&&x<b.x1+r*.5&&z>b.z0-r*.5&&z<b.z1+r*.5&&b.y1<=y+.55&&b.y1>g) g=b.y1; } return g; }
/* push a body (vertical capsule) out of walls */
function collide(e){ const r=.4; for(const b of boxesNear(e.x,e.z,r+1)){ if(e.y+1.75<=b.y0||e.y>=b.y1-.5) continue; if(e.x<=b.x0-r||e.x>=b.x1+r||e.z<=b.z0-r||e.z>=b.z1+r) continue;
    const dx0=e.x-(b.x0-r), dx1=(b.x1+r)-e.x, dz0=e.z-(b.z0-r), dz1=(b.z1+r)-e.z, m=Math.min(dx0,dx1,dz0,dz1);
    if(m===dx0){ e.x=b.x0-r; if(e.vx>0) e.vx=0; } else if(m===dx1){ e.x=b.x1+r; if(e.vx<0) e.vx=0; } else if(m===dz0){ e.z=b.z0-r; if(e.vz>0) e.vz=0; } else { e.z=b.z1+r; if(e.vz<0) e.vz=0; } e.bump=1; }
  for(const t of WORLD.TR){ if(t.hp<=0) continue; const dx=e.x-t.x, dz=e.z-t.z, d=Math.hypot(dx,dz), rr=.45*t.s+r; if(d<rr&&d>1e-3&&e.y<t.y+6){ e.x=t.x+dx/d*rr; e.z=t.z+dz/d*rr; } }
  for(const k of WORLD.RK){ if(k.hp<=0) continue; const dx=e.x-k.x, dz=e.z-k.z, d=Math.hypot(dx,dz), rr=k.s*1.1+r; if(d<rr&&d>1e-3&&e.y<k.y+k.s*1.4){ e.x=k.x+dx/d*rr; e.z=k.z+dz/d*rr; } }
  for(const c of WORLD.CARS){ if(c.hp<=0) continue; const ca=Math.cos(c.yaw), sa=Math.sin(c.yaw), lx=(e.x-c.x)*ca-(e.z-c.z)*sa, lz=(e.x-c.x)*sa+(e.z-c.z)*ca; if(Math.abs(lx)<1+r&&Math.abs(lz)<2.2+r&&e.y<terrainH(c.x,c.z)+1.4){ if(1+r-Math.abs(lx)<2.2+r-Math.abs(lz)){ const nl=Math.sign(lx)*(1+r); e.x=c.x+nl*ca+lz*sa; e.z=c.z-nl*sa+lz*ca; } else { const nz=Math.sign(lz)*(2.2+r); e.x=c.x+lx*ca+nz*sa; e.z=c.z-lx*sa+nz*ca; } } }
  const R=Math.hypot(e.x,e.z); if(R>ISL.half-5){ e.x*=(ISL.half-5)/R; e.z*=(ISL.half-5)/R; } }

/* ---------- shooting: a ray against boxes, build pieces, trees, rocks, cars and bodies ---------- */
function rayBox(o,d,b,tmax){ let t0=0, t1=tmax; const lo=[b.x0,b.y0,b.z0], hi=[b.x1,b.y1,b.z1]; for(let i=0;i<3;i++){ if(Math.abs(d[i])<1e-9){ if(o[i]<lo[i]||o[i]>hi[i]) return -1; continue; } let a=(lo[i]-o[i])/d[i], c=(hi[i]-o[i])/d[i]; if(a>c){ const s=a; a=c; c=s; } t0=Math.max(t0,a); t1=Math.min(t1,c); if(t0>t1) return -1; } return t0; }
function rayWorld(o,d,maxD){ let best=maxD, hit=null; const steps=Math.ceil(maxD/12);
  /* march in 12 m chunks so we only test nearby boxes */ for(let s=0;s<=steps;s++){ const t=s*12; if(t>best) break; const px=o[0]+d[0]*t, pz=o[2]+d[2]*t;
    for(const b of boxesNear(px,pz,9)){ const tt=rayBox(o,d,b,best); if(tt>=0&&tt<best){ best=tt; hit={kind:b.piece?'piece':'box',b,p:b.piece}; } } }
  /* terrain: march */ for(let t=0;t<best;t+=1.5){ const x=o[0]+d[0]*t, y=o[1]+d[1]*t, z=o[2]+d[2]*t; if(y<terrainH(x,z)){ best=t; hit={kind:'ground'}; break; } }
  for(const tr of WORLD.TR){ if(tr.hp<=0) continue; const tt=rayCyl(o,d,tr.x,tr.z,.45*tr.s,tr.y,tr.y+7*tr.s,best); if(tt>=0&&tt<best){ best=tt; hit={kind:'tree',t:tr}; } }
  for(const rk of WORLD.RK){ if(rk.hp<=0) continue; const tt=rayCyl(o,d,rk.x,rk.z,rk.s*1.1,rk.y-1,rk.y+rk.s*1.3,best); if(tt>=0&&tt<best){ best=tt; hit={kind:'rock',t:rk}; } }
  for(const c of WORLD.CARS){ if(c.hp<=0) continue; const tt=rayCyl(o,d,c.x,c.z,1.6,terrainH(c.x,c.z),terrainH(c.x,c.z)+1.5,best); if(tt>=0&&tt<best){ best=tt; hit={kind:'car',t:c}; } }
  return {t:best,hit}; }
function rayCyl(o,d,cx,cz,r,y0,y1,maxT){ const ox=o[0]-cx, oz=o[2]-cz, a=d[0]*d[0]+d[2]*d[2]; if(a<1e-9) return -1; const b=2*(ox*d[0]+oz*d[2]), c=ox*ox+oz*oz-r*r, disc=b*b-4*a*c; if(disc<0) return -1; const t=(-b-Math.sqrt(disc))/(2*a); if(t<0||t>maxT) return -1; const y=o[1]+d[1]*t; return y>=y0&&y<=y1?t:-1; }

/* what a chest or a floor spawn gives */
function rollItem(rng,tier){ const r=rng(); const rar=Math.min(4,Math.floor(Math.pow(rng(),1.6-tier*.35)*5*(.75+tier*.15)));
  if(r<.55){ const k=pickW(rng,{ar:28,smg:20,pump:24,pistol:16,sniper:8,rocket:4}); return {kind:'gun',g:k,rar:k==='rocket'||k==='sniper'?Math.max(2,rar):rar,mag:GUNS[k].mag}; }
  if(r<.8){ const k=pickW(rng,{bandage:30,medkit:12,minis:35,shield:23}); return {kind:'heal',h:k,n:k==='bandage'?5:k==='minis'?3:1}; }
  const k=pickW(rng,{light:30,medium:30,heavy:15,shells:20,rockets:5}); return {kind:'ammo',a:k,n:AMMO_PICK[k]}; }
function pickW(rng,o){ let s=0; for(const k in o) s+=o[k]; let r=rng()*s; for(const k in o){ r-=o[k]; if(r<=0) return k; } return Object.keys(o)[0]; }

/* ---------- the storm: shrinking circles, harder each phase ---------- */
const STORM=[{wait:70,move:45,r:230,d:1},{wait:55,move:40,r:140,d:1},{wait:45,move:35,r:85,d:2},{wait:35,move:30,r:48,d:5},{wait:30,move:25,r:24,d:8},{wait:20,move:25,r:8,d:10},{wait:15,move:20,r:0,d:10}];

/* ---------- audio ---------- */
let AC=null, muted=false;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type='square',v=.05,f2=null,delay=0){ if(muted||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function noise(d,v,fc,type='lowpass',delay=0){ if(muted||!AC) return; const n=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,n,AC.sampleRate), x=b.getChannelData(0); for(let i=0;i<n;i++) x[i]=(Math.random()*2-1)*(1-i/n); const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=b; f.type=type; f.frequency.value=fc; g.gain.value=v; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(AC.currentTime+delay); }
function shotSfx(g,dist){ const v=Math.max(.02,.3/(1+(dist||0)/25)); if(g==='pump'){ noise(.35,v*1.3,900); tone(70,.2,'sine',v*.4,40); } else if(g==='sniper'){ noise(.5,v*1.5,1400); tone(90,.3,'sine',v*.5,40); } else if(g==='rocket'){ noise(.6,v,500); } else if(g==='smg'||g==='pistol'){ noise(.09,v*.8,2600); } else noise(.14,v,1800); }
const sfx={ click:()=>tone(700,.04,'square',.03), hit:()=>tone(1500,.05,'square',.04), head:()=>{ tone(2200,.06,'square',.05); tone(1700,.06,'square',.04,null,.05); }, shield:()=>tone(900,.08,'sine',.05), pick:()=>tone(880,.06,'sine',.04), chest:()=>{ tone(660,.1,'sine',.05); tone(990,.14,'sine',.05,null,.1); tone(1320,.2,'sine',.05,null,.22); },
  build:()=>noise(.08,.08,700), harvest:()=>{ noise(.06,.08,1200); tone(240,.05,'square',.03); }, boom:()=>{ noise(1.2,.5,300); tone(50,.6,'sine',.2,30); }, elim:()=>{ tone(523,.12,'square',.05); tone(784,.18,'square',.05,null,.12); }, storm:()=>noise(.5,.06,300), bus:()=>tone(330,.4,'sine',.04,260), win:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,.3,'square',.06,null,i*.15)); }, reload:()=>{ tone(400,.05,'square',.03); tone(300,.05,'square',.03,null,.25); } };
/* ---------- state ---------- */
let BR=null, phase='menu', paused=false, lvl=1, nPlayers=30, sens=1, camSide=1;
const LVL=['Casual','Normal','Sweaty'], LVLK=[.55,.8,1];
const keys=new Set(); const held=a=>a.some(k=>keys.has(k));
const SKEY='rinkRivalsStormV1'; let SV=(()=>{ try{ return Object.assign({wins:0,games:0,kills:0,best:99,top:0},JSON.parse(localStorage.getItem(SKEY)||'null')||{}); }catch(e){ return {wins:0,games:0,kills:0,best:99,top:0}; } })();
const saveSV=()=>{ try{ localStorage.setItem(SKEY,JSON.stringify(SV)); }catch(e){} };
try{ const p=JSON.parse(localStorage.getItem('rinkRivalsStormPrefs')||'null'); if(p){ lvl=p.lvl??lvl; nPlayers=p.nPlayers||nPlayers; sens=p.sens||1; } }catch(e){}
const savePrefs=()=>{ try{ localStorage.setItem('rinkRivalsStormPrefs',JSON.stringify({lvl,nPlayers,sens})); }catch(e){} };
const fmtT=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const NAMES=['Blaze','Nova','Pixel','Rook','Echo','Viper','Jinx','Ghost','Rex','Luna','Bolt','Ziggy','Comet','Dash','Fury','Glitch','Hex','Ion','Juno','Kite','Lynx','Moss','Nitro','Onyx','Puck','Quill','Rift','Sage','Taz','Umbra','Volt','Wren','Yeti','Zorro','Ace','Bean','Cosmo','Drift','Ember','Flux'];
const SKINS=[['#ef4444','#1f2937','#fcd34d'],['#3b82f6','#e5e7eb','#1e3a8a'],['#22c55e','#14532d','#f59e0b'],['#a855f7','#f472b6','#1e1b4b'],['#f97316','#0f172a','#fef3c7'],['#06b6d4','#164e63','#f8fafc'],['#eab308','#713f12','#111827'],['#ec4899','#fdf2f8','#831843'],['#64748b','#0f172a','#ef4444'],['#84cc16','#365314','#fafafa'],['#f8fafc','#dc2626','#111827'],['#7c3aed','#facc15','#0f172a']];

/* ---------- a match ---------- */
function mkEnt(id,name,ai,skin){ return {id,name,ai,skin,x:0,y:150,z:0,vx:0,vy:0,vz:0,yaw:0,pitch:0,hp:100,sh:0,state:'bus',inv:[null,null,null,null,null],sel:-1,ammo:{light:0,medium:0,heavy:0,shells:0,rockets:0},mats:{wood:0,stone:0,metal:0},mat:'wood',cool:0,rel:0,heal:null,kills:0,dead:false,on:false,crouch:0,ads:0,spread:0,ph:0,lastHit:-9,dmgBy:null,place:0,swing:0,build:0,piece:'wall',aim:[0,0,1]}; }
function newMatch(){ const rng=mulberry32(window.RRV&&RRV.on?(RRV.seed||1):Math.floor(Math.random()*1e9)); mkWorld(91);
  BR={t:0,ents:[],feed:[],fx:[],nums:[],proj:[],items:[],over:false,map:false,lastJump:0,alive:0,rng,buildMode:false,cam:0};
  /* floor loot */ for(const s of WORLD.SP){ if(rng()<.62){ const it=rollItem(rng,0); BR.items.push(Object.assign(it,{x:s.x,y:s.y+.1,z:s.z,id:BR.items.length,hs:s.hs,lv:s.lv})); } }
  /* the bus flies straight across the island */ const a=rng()*Math.PI*2, R=ISL.R+60; BR.bus={x0:Math.cos(a)*R,z0:Math.sin(a)*R,x1:-Math.cos(a)*R,z1:-Math.sin(a)*R,y:160,v:42,t:0}; BR.bus.dur=Math.hypot(BR.bus.x1-BR.bus.x0,BR.bus.z1-BR.bus.z0)/BR.bus.v;
  const names=NAMES.slice().sort(()=>rng()-.5);
  const me=mkEnt(0,(localStorage.getItem('rrOnlineName')||'You').slice(0,16)||'You',false,SKINS[0]); me.me=true; BR.me=me; BR.ents.push(me);
  /* online opponents ride the same bus as ghosts that play their own match: we add the AI players */
  for(let i=1;i<nPlayers;i++){ const e=mkEnt(i,names[i%names.length]+(i>=names.length?i:''),true,SKINS[i%SKINS.length]); e.sk=LVLK[lvl]*(.75+rng()*.35); e.target=pickTown(rng); e.jumpAt=.12+rng()*.76; BR.ents.push(e); }
  /* the storm: the first circle is announced after the bus */ BR.storm={ph:-1,t:0,c:[0,0],r:ISL.R+120,nc:[rnd(-90,90),rnd(-90,90)],nr:STORM[0].r,moving:false,c0:[0,0],r0:ISL.R+120,wait:60};
  phase='play'; paused=false; $('menu').classList.add('hidden'); $('result').classList.add('hidden'); built3=false; renderKeysHelp(); sfx.bus(); toast('Press Space to jump from the bus','#a78bfa'); }
function pickTown(rng){ const t=TOWNS[Math.floor(rng()*TOWNS.length)]; return {x:t.x+rnd(-t.r*.6,t.r*.6),z:t.z+rnd(-t.r*.6,t.r*.6)}; }
const fwd3=(yaw,pitch)=>[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)];
const gunOf=e=>e.sel>=0&&e.inv[e.sel]&&e.inv[e.sel].kind==='gun'?e.inv[e.sel]:null;
const headPos=e=>[e.x,e.y+(e.crouch?1.25:1.62),e.z];
function busPos(t){ const B=BR.bus, k=clamp(t/B.dur,0,1); return [lerp(B.x0,B.x1,k),B.y,lerp(B.z0,B.z1,k)]; }
function jump(e){ const p=busPos(BR.bus.t); e.x=p[0]; e.y=p[1]-3; e.z=p[2]; e.vx=(BR.bus.x1-BR.bus.x0)/BR.bus.dur*.5; e.vz=(BR.bus.z1-BR.bus.z0)/BR.bus.dur*.5; e.vy=0; e.state='fall'; if(e.me){ sfx.bus(); toast('Skydiving! Steer with WASD · Space opens the glider','#a78bfa'); } }

/* ---------- movement: skydive, glide, run, jump, crouch ---------- */
function moveEnt(e,dt,mv){ /* mv: {f, s, jump, sprint, crouch} in the entity's yaw frame */
  const f=[Math.sin(e.yaw),0,Math.cos(e.yaw)], r=[-Math.cos(e.yaw),0,Math.sin(e.yaw)];
  if(e.state==='fall'||e.state==='glide'){ const g=e.state==='glide', hs=g?11:16, dir=add(mul(f,mv.f),mul(r,mv.s)), want=mul(dir,hs*(mv.f||mv.s?1:0));
    e.vx=lerp(e.vx,want[0]+(g?f[0]*7:0),Math.min(1,dt*(g?1.6:1.2))); e.vz=lerp(e.vz,want[2]+(g?f[2]*7:0),Math.min(1,dt*(g?1.6:1.2)));
    e.vy=lerp(e.vy,g?-5.5:(mv.f>0?-38:-28),Math.min(1,dt*(g?2.5:.9)));
    const gnd=groundAt(e.x,e.y,e.z,.4); if(e.state==='fall'&&(e.y-gnd<55||mv.jump&&e.y-gnd<110)){ e.state='glide'; if(e.me) sfx.click(); }
    e.x+=e.vx*dt; e.y+=e.vy*dt; e.z+=e.vz*dt; collide(e); const g2=groundAt(e.x,e.y,e.z,.4); if(e.y<=g2){ e.y=g2; e.vy=0; e.state='ground'; e.on=true; e.vx*=.3; e.vz*=.3; if(e.me) toast('Landed! Loot up: open chests (E), grab guns, watch the storm','#34d399'); }
    if(e.y<WATER-1){ e.y=WATER-1; e.state='ground'; } return; }
  /* on foot: Fortnite-ish speeds, a little slower crouched and aiming, sprint when not shooting */
  e.crouch=mv.crouch?1:0; const sp=(mv.sprint&&mv.f>0&&!e.ads?6.8:e.crouch?2.6:e.ads?3.4:5.2)*(e.heal?.5:1)*(e.y<WATER-.4?.55:1);
  let dir=add(mul(f,mv.f),mul(r,mv.s)); const dl=len(dir); if(dl>1) dir=mul(dir,1/dl);
  const ax=e.on?14:3; e.vx+=(dir[0]*sp-e.vx)*Math.min(1,dt*ax); e.vz+=(dir[2]*sp-e.vz)*Math.min(1,dt*ax);
  if(mv.jump&&e.on){ e.vy=5.6; e.on=false; }
  e.vy-=G*1.45*dt; e.x+=e.vx*dt; e.z+=e.vz*dt; const ox=e.x, oz=e.z; e.bump=0; collide(e); if(e.bump){ e.bumpT=(e.bumpT||0)+dt; } else e.bumpT=0;
  /* step up small ledges and ramps */
  let g=groundAt(e.x,e.y,e.z,.4); e.y+=e.vy*dt;
  if(e.y<=g){ if(!e.on&&e.vy<-17){ const dmg=Math.round((-e.vy-17)*9); hurt(e,dmg,null,'fall'); } e.y=g; e.vy=0; e.on=true; } else if(e.on&&e.y-g<.6&&e.vy<=0){ e.y=g; e.vy=0; } else e.on=false;
  /* ceilings */ for(const b of boxesNear(e.x,e.z,1)){ if(e.vy>0&&e.x>b.x0-.3&&e.x<b.x1+.3&&e.z>b.z0-.3&&e.z<b.z1+.3&&e.y+1.8>b.y0&&e.y<b.y0){ e.y=b.y0-1.8; e.vy=0; } }
  e.ph+=Math.hypot(e.vx,e.vz)*dt*1.6; }

/* ---------- damage ---------- */
function hurt(e,dmg,by,how,head,dist){ if(e.dead||dmg<=0||BR.over) return; let d=dmg; const hadSh=e.sh>0; if(e.sh>0&&how!=='storm'&&how!=='fall'){ const a=Math.min(e.sh,d); e.sh-=a; d-=a; } e.hp-=d; e.lastHit=BR.t; if(by) e.dmgBy=by; if(e.heal){ e.heal=null; }
  if(by&&by.me){ BR.nums.push({x:e.x,y:e.y+2,z:e.z,v:Math.round(dmg),t:0,head,sh:hadSh}); head?sfx.head():hadSh?sfx.shield():sfx.hit(); BR.hitT=.18; }
  if(e.me&&by){ BR.dmgDir={x:by.x,z:by.z,t:1.2}; BR.shake=Math.min(.6,(BR.shake||0)+dmg/150); }
  if(e.hp<=0) kill(e,by||e.dmgBy,how,dist); }
function kill(e,by,how,dist){ if(e.dead) return; e.dead=true; e.hp=0; BR.alive=BR.ents.filter(q=>!q.dead).length; e.place=BR.alive+1;
  /* drop everything */ let k=0; for(const it of e.inv) if(it){ BR.items.push(Object.assign({},it,{x:e.x+Math.cos(k)*1.2,y:e.y+.1,z:e.z+Math.sin(k)*1.2,id:BR.items.length})); k++; }
  for(const a in e.ammo) if(e.ammo[a]>0){ BR.items.push({kind:'ammo',a,n:e.ammo[a],x:e.x+Math.cos(k)*1.2,y:e.y+.1,z:e.z+Math.sin(k)*1.2,id:BR.items.length}); k++; }
  for(const m in e.mats) if(e.mats[m]>0){ BR.items.push({kind:'mat',m,n:e.mats[m],x:e.x+Math.cos(k)*1.2,y:e.y+.1,z:e.z+Math.sin(k)*1.2,id:BR.items.length}); k++; }
  const wn=how==='storm'?'the storm':how==='fall'?'a big fall':how==='rocket'?'a rocket':how==='pick'?'a pickaxe':how&&GUNS[how]?GUNS[how].name:'';
  if(by&&by!==e){ by.kills++; feed(`${by.name} eliminated ${e.name}${wn?' · '+wn:''}${dist>100?` (${Math.round(dist)} m)`:''}`,by.me?'#fde047':e.me?'#f87171':'#e2e8f0'); if(by.me){ sfx.elim(); BR.elimT=2; BR.lastElim=e.name; if(dist>(BR.longShot||0)&&how==='sniper') BR.longShot=dist; } }
  else feed(`${e.name} ${how==='storm'?'was taken by the storm':how==='fall'?'fell to their death':'was eliminated'}`,e.me?'#f87171':'#94a3b8');
  if(e.me){ BR.spec=by&&!by.dead?by:null; endMatch(false); } else if(BR.alive===1&&!BR.me.dead) endMatch(true); }

/* ---------- shooting ---------- */
function canFire(e){ const g=gunOf(e); return g&&e.cool<=0&&e.rel<=0&&g.mag>0&&!e.heal&&e.state==='ground'; }
function fire(e){ const g=gunOf(e); if(!g) return; const G0=GUNS[g.g]; if(e.rel>0||e.cool>0) return; if(g.mag<=0){ reload(e); return; }
  g.mag--; e.cool=1/G0.rps; const o=headPos(e); let ad=e.aim; /* shots come from the eye along the aim (third person aims at the crosshair) */
  const base=G0.spr*(e.ads?G0.ads/G0.spr*.9+.1:1)*(e.on?1:2)*(1+Math.hypot(e.vx,e.vz)/9)+e.spread, n=G0.pel||1;
  e.spread=Math.min(.06,e.spread+(G0.auto?.006:.012));
  if(e.me){ shotSfx(g.g,0); BR.recoil=(BR.recoil||0)+(G0.auto?.012:.04); } else { const d=Math.hypot(e.x-BR.me.x,e.z-BR.me.z); if(d<160) shotSfx(g.g,d); }
  if(G0.rocket||G0.bullet){ const s=G0.rocket?60:G0.bullet; const d=norm(add(ad,[gauss()*base*.3,gauss()*base*.3,gauss()*base*.3])); BR.proj.push({x:o[0],y:o[1],z:o[2],v:mul(d,s),by:e,g:g.g,rar:g.rar,t:0,o:o.slice()}); return; }
  for(let p=0;p<n;p++){ const d=norm(add(ad,[gauss()*base,gauss()*base,gauss()*base])); hitscan(e,o,d,G0,g); }
  if(e.me) BR.muzzle=.06; }
function hitscan(e,o,d,G0,g){ const W=rayWorld(o,d,G0.range); let best=W.t, tgt=null, head=false;
  for(const q of BR.ents){ if(q===e||q.dead||q.state==='bus') continue; const dx=q.x-o[0], dz=q.z-o[2]; if(dx*dx+dz*dz>(best+2)**2) continue;
    const hh=[q.x,q.y+(q.crouch?1.2:1.6),q.z], th=raySph(o,d,hh,.24); if(th>=0&&th<best){ best=th; tgt=q; head=true; }
    const tb=rayCyl(o,d,q.x,q.z,.42,q.y,q.y+(q.crouch?1.05:1.45),best); if(tb>=0&&tb<best){ best=tb; tgt=q; head=false; } }
  const hp=add(o,mul(d,best));
  if(tgt){ let dmg=G0.dmg*RAR[g.rar].k*(head?G0.head:1); if(G0.falloff) dmg*=clamp(1.15-best/G0.range,.35,1); if(best>G0.range*.6&&!G0.falloff) dmg*=.85; hurt(tgt,dmg,e,g.g,head,best); BR.fx.push({x:hp[0],y:hp[1],z:hp[2],t:0,c:[.9,.15,.1],s:.08}); }
  else if(W.hit){ hitThing(W.hit,G0.dmg*RAR[g.rar].k*(W.hit.kind==='piece'?1:.5),e); BR.fx.push({x:hp[0],y:hp[1],z:hp[2],t:0,c:[.85,.8,.6],s:.06}); }
  if(e.me||Math.random()<.4) BR.tracers.push({a:add(o,mul(d,1.2)),b:hp,t:0}); }
function raySph(o,d,c,r){ const oc=sub(o,c), b=dot(oc,d), cc=dot(oc,oc)-r*r, h=b*b-cc; if(h<0) return -1; const t=-b-Math.sqrt(h); return t>=0?t:-1; }
function hitThing(h,dmg,by){ if(h.kind==='piece'&&h.p){ h.p.hp-=dmg; if(h.p.hp<=0){ removePiece(h.p); if(by&&by.me) sfx.build(); } }
  else if(h.kind==='tree'||h.kind==='rock'||h.kind==='car'){ /* bullets chip at the world but only the pickaxe harvests */ } }
function reload(e){ const g=gunOf(e); if(!g||e.rel>0) return; const G0=GUNS[g.g]; if(g.mag>=G0.mag||e.ammo[G0.ammo]<=0) return; e.rel=G0.rl; e.relG=g; if(e.me) sfx.reload(); }
function finishReload(e){ const g=e.relG; if(!g||!e.inv.includes(g)) return; const G0=GUNS[g.g], need=G0.mag-g.mag, take=Math.min(need,e.ammo[G0.ammo]); g.mag+=take; e.ammo[G0.ammo]-=take; }
function stepProj(dt){ for(const p of BR.proj){ p.t+=dt; if(p.g==='sniper') p.v[1]-=G*dt; const step=len(p.v)*dt, d=norm(p.v), o=[p.x,p.y,p.z];
    const W=rayWorld(o,d,step); let best=W.t, tgt=null, head=false; for(const q of BR.ents){ if(q===p.by||q.dead||q.state==='bus') continue; const hh=[q.x,q.y+1.6,q.z], th=raySph(o,d,hh,.24); if(th>=0&&th<best){ best=th; tgt=q; head=true; } const tb=rayCyl(o,d,q.x,q.z,.42,q.y,q.y+1.45,best); if(tb>=0&&tb<best){ best=tb; tgt=q; head=false; } }
    if(best<step||p.t>4){ const hp=add(o,mul(d,best)); p.dead=true; const G0=GUNS[p.g];
      if(p.g==='rocket'){ boom(hp,p.by,G0.dmg*RAR[p.rar].k); }
      else if(tgt){ hurt(tgt,G0.dmg*RAR[p.rar].k*(head?G0.head:1),p.by,p.g,head,Math.hypot(hp[0]-p.o[0],hp[2]-p.o[2])); }
      else if(W.hit) hitThing(W.hit,G0.dmg,p.by); }
    else { p.x+=p.v[0]*dt; p.y+=p.v[1]*dt; p.z+=p.v[2]*dt; } }
  BR.proj=BR.proj.filter(p=>!p.dead); }
function boom(c,by,dmg){ sfx.boom(); BR.shake=Math.max(BR.shake||0,Math.max(0,.8-Math.hypot(c[0]-BR.me.x,c[2]-BR.me.z)/60)); for(let i=0;i<30;i++) BR.fx.push({x:c[0],y:c[1],z:c[2],vx:rnd(-6,6),vy:rnd(1,9),vz:rnd(-6,6),t:0,c:i%3?[1,.55,.1]:[.3,.3,.3],s:.35,life:1});
  for(const q of BR.ents){ if(q.dead) continue; const d=Math.hypot(q.x-c[0],q.y+1-c[1],q.z-c[2]); if(d<4.5) hurt(q,dmg*(1-d/5),by,'rocket'); }
  for(const p of WORLD.builds.slice()) for(const b of p.boxes){ const cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2, cz=(b.z0+b.z1)/2; if(Math.hypot(cx-c[0],cy-c[1],cz-c[2])<4.5){ p.hp-=400; if(p.hp<=0) removePiece(p); break; } } }

/* ---------- the pickaxe: harvest and hit ---------- */
function swing(e){ if(e.cool>0) return; e.cool=.5; e.swing=.35; const o=headPos(e), d=e.aim, W=rayWorld(o,d,2.8);
  for(const q of BR.ents){ if(q===e||q.dead) continue; const t=rayCyl(o,d,q.x,q.z,.45,q.y,q.y+1.8,2.8); if(t>=0&&t<W.t){ hurt(q,20,e,'pick'); return; } }
  if(!W.hit) return; const h=W.hit, gain=(m,n)=>{ e.mats[m]=Math.min(999,e.mats[m]+n); if(e.me){ sfx.harvest(); BR.gain={m,n,t:1}; } };
  if(h.kind==='tree'){ h.t.hp-=50; gain('wood',Math.round(7+Math.random()*4)); if(h.t.hp<=0) gain('wood',20); }
  else if(h.kind==='rock'){ h.t.hp-=50; gain('stone',Math.round(6+Math.random()*4)); if(h.t.hp<=0) gain('stone',15); }
  else if(h.kind==='car'){ h.t.hp-=50; gain('metal',Math.round(6+Math.random()*4)); if(h.t.hp<=0) gain('metal',15); }
  else if(h.kind==='box'&&h.b.kind!=='floor'){ const b=h.b; gain(b.col==='#94a3b8'||b.col==='#64748b'?'metal':b.kind==='crate'?'wood':'stone',3); }
  else if(h.kind==='piece'){ h.p.hp-=50; if(h.p.hp<=0) removePiece(h.p); if(e.me) sfx.build(); } }

/* ---------- building ---------- */

/* ---------- the player ---------- */

  if(phase==='over'){ if(e.code==='KeyR'&&!(window.RRV&&RRV.on)) newMatch(); else if(['Enter','NumpadEnter','Escape'].includes(e.code)) toMenu(); return; }

  if(/^Digit[1-5]$/.test(e.code)){ BR.buildMode=false; const s=+e.code.slice(5)-1; if(me.inv[s]){ me.sel=s; me.rel=0; me.cool=Math.max(me.cool,.25); } return; }

/* touch: the touch layer sends keys; the right half of the screen is a look pad */
let tLook=null; cv.addEventListener('touchstart',e=>{ const t=e.changedTouches[0], r=cv.getBoundingClientRect(); if(t.clientX>r.left+r.width*.5) tLook={x:t.clientX,y:t.clientY,id:t.identifier}; },{passive:true});
cv.addEventListener('touchmove',e=>{ for(const t of e.changedTouches) if(tLook&&t.identifier===tLook.id){ look.dx+=(t.clientX-tLook.x)*2.2; look.dy+=(t.clientY-tLook.y)*2.2; tLook.x=t.clientX; tLook.y=t.clientY; } },{passive:true});
cv.addEventListener('touchend',e=>{ for(const t of e.changedTouches) if(tLook&&t.identifier===tLook.id) tLook=null; },{passive:true});
/* touch buttons for fire / aim arrive as keys */
addEventListener('keydown',e=>{ if(e.code==='KeyF') mouse.l=true; if(e.code==='KeyX') mouse.r=!mouse.r; }); addEventListener('keyup',e=>{ if(e.code==='KeyF'){ mouse.l=false; mouse.used=false; } });

/* ---------- menu ---------- */
const pill=(attr,val,on,label,key)=>`<button data-${attr}="${val}" class="${on?'on':''}" tabindex="-1">${label}${key?` <kbd>${key}</kbd>`:''}</button>`;
function renderMenu(){ let h=`<h1>Rink Rivals: Storm Royale</h1><p>Jump from the battle bus, land, loot chests for guns and shields, harvest wood, stone and metal and build walls, floors and ramps. The storm keeps closing in. Last one standing wins.</p>
  <div class="pills"><span class="lbl">Players</span>${[16,30,50].map(n=>pill('n',n,nPlayers===n,`${n} players`,'')).join('')}</div>
  <div class="pills"><span class="lbl">Opponents</span>${LVL.map((l,i)=>pill('l',i,lvl===i,l,String(i+1))).join('')}</div>
  <div class="pills"><span class="lbl">Mouse</span>${[.6,1,1.6].map((s,i)=>pill('s',s,sens===s,['Slow','Normal','Fast'][i],'')).join('')}</div>
  <div class="pills"><button class="gold" data-act="start" tabindex="-1">Board the bus <kbd>Enter</kbd></button><a href="./" tabindex="-1">Home</a><a href="airsoft" tabindex="-1">Airsoft</a><a href="paintball" tabindex="-1">Paintball</a></div>
  <div id="hint">Your record: ${SV.wins} win${SV.wins===1?'':'s'} in ${SV.games} matches · ${SV.kills} eliminations${SV.best<99?` · best finish #${SV.best}`:''}</div>`;
  $('menuIn').innerHTML=h; $('logoL').src=badgeS(SKINS[0][0]); setText('nameL','You'); setText('tpL','Storm Royale'); setText('scoreL',''); $('logoR').src=badgeS('#7e22ce'); setText('nameR',`${nPlayers} players`); setText('tpR',LVL[lvl]); setText('scoreR',''); setText('cntT','DROP'); setText('innT','Storm Royale'); setText('outsT','Battle royale'); setText('basesT',''); renderKeysHelp(); }
$('menuIn').addEventListener('mousedown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
$('menuIn').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset; audio(); sfx.click(); if(d.n) nPlayers=+d.n; else if(d.l!==undefined) lvl=+d.l; else if(d.s) sens=+d.s; else if(d.act==='start'){ startGame(); return; } savePrefs(); renderMenu(); });
addEventListener('keydown',e=>{ if(phase!=='menu') return; if(['Digit1','Digit2','Digit3'].includes(e.code)){ lvl=+e.code.slice(5)-1; savePrefs(); renderMenu(); } });
function startGame(){ audio(); savePrefs(); newMatch(); }
function renderKeysHelp(){ $('keysHelp').innerHTML='<div><b>Move</b> W A S D</div><div><b>Aim</b> mouse (click the game) · arrows</div><div><b>Shoot</b> left click · <b>Aim down sights</b> right click</div><div><b>Jump / glider</b> Space</div><div><b>Sprint</b> Shift · <b>Crouch</b> Ctrl</div><div><b>Open / pick up</b> E</div><div><b>Weapons</b> 1-5 · wheel · <b>Pickaxe</b> Q</div><div><b>Reload</b> R</div><div><b>Build</b> B, then 1 wall 2 floor 3 ramp · G material</div><div><b>Map</b> M</div><div><b>Shoulder</b> H</div><div><b>Pause</b> P</div>'; }
function toMenu(){ phase='menu'; BR=null; $('result').classList.add('hidden'); $('menu').classList.remove('hidden'); if(document.pointerLockElement) document.exitPointerLock(); renderMenu(); }

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; frameDtG=dt||1/60; if(!(TEST&&window.__freeze)) step(dt); draw(); requestAnimationFrame(frame); }
function toggleFs(){ const st=$('stage'); try{ if(document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen&&st.requestFullscreen(); }catch(e){} }
$('btnFs').addEventListener('click',toggleFs);
$('btnView').addEventListener('click',()=>{});
$('btnSnd').addEventListener('click',()=>{ muted=!muted; $('btnSnd').textContent=muted?'Sound off':'Sound on'; if(!muted){ audio(); sfx.click(); } });
$('result').addEventListener('click',()=>{ if(phase==='over') toMenu(); });
if(TEST) window.__br={get BR(){return BR;},get phase(){return phase;},step,newMatch,keys,mouse,look,get WORLD(){return WORLD;},terrainH,groundAt,rayWorld,place,fire,jump,set lvl(v){lvl=v;},set nPlayers(v){nPlayers=v;},giveItem,openChest,kill,endMatch,camPose};
$('btnView').style.display='none'; $('viewBtn2').style.display='none'; setView3(true);
renderMenu();
requestAnimationFrame(frame);

/* ---------- world records ---------- */
const LBG=((location.pathname.split('/').pop()||'').replace(/\.html$/,'')||'game').toLowerCase(), lbPost=(id,s,t)=>{ try{ window.RRL&&RRL.post(id,s,t); }catch(e){} }, lbBoards=l=>{ try{ window.RRL&&RRL.boards(LBG,l); }catch(e){} };
lbBoards([{id:'wins',name:'Wins (#1 finishes)',mode:'sum'},{id:'kills',name:'Most eliminations in a match',mode:'max'},{id:'elims',name:'Total eliminations',mode:'sum'},{id:'snipe',name:'Longest sniper elimination (m)',mode:'max'}]);
{ const _e=endMatch; endMatch=function(won){ const was=BR&&BR.over; const r=_e.apply(this,arguments); try{ if(!was&&BR){ const me=BR.me; if(won) lbPost('wins',1); if(me.kills>0){ lbPost('kills',me.kills,`${me.kills} elims · #${BR.place} of ${BR.ents.length}`); lbPost('elims',me.kills); } if(BR.longShot) lbPost('snipe',Math.round(BR.longShot),`${Math.round(BR.longShot)} m`); } }catch(e){} return r; }; }


/* ---------- online score battle ---------- */
const NETV=window.RRV?RRV.attach({game:'br',title:'storm royale battle',blurb:'Storm Royale battle: everyone drops into the same island at the same time (same bus route, loot and storm). Best placement wins; eliminations break ties.',
  better:'low', opts:()=>({lvl,nPlayers}), start(o){ if(o.lvl!=null) lvl=o.lvl; if(o.nPlayers) nPlayers=o.nPlayers; newMatch(); },
  state(){ if(!BR) return null; const me=BR.me, done=!!BR.over, place=done?BR.place:BR.alive; return {v:done?+(place-Math.min(me.kills,40)/100).toFixed(2):null,txt:done?`#${BR.place} · ${me.kills} elims`:`${me.dead?'out':'alive'} · ${me.kills} elims · ${BR.alive} left`,done,pos:[+me.x.toFixed(1),+me.y.toFixed(1),+me.z.toFixed(1),+me.yaw.toFixed(2)]}; }}):null;

})();
</script>
