const SEED0=Math.floor(Math.random()*2147483646)+1;   /* a fresh order on every visit */
function shuffle(a){ let seed=SEED0; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  /* weighted random order: things you like come up more often, but everything still shows up */

  for(let i=1;i<r.length-1;i++) if(r[i].by&&r[i].by===r[i-1].by){ let j=i+1; while(j<r.length&&r[j].by===r[i].by) j++; if(j<r.length) [r[i],r[j]]=[r[j],r[i]]; }   /* no long streaks of one creator */

function unmount(i){ const st=stageOf(i); if(!st) return; if(LIST[i]&&(LIST[i].src==='nhl'||LIST[i].src==='chan')) return; const v=st.querySelector('video'); if(v){ v.pause(); v.removeAttribute('src'); v.load(); } st.innerHTML=''; delete st.dataset.m; }
/* live NHL scores (through our server, refreshed every 30 s while the Hockey tab is open) */

/* ---- live game tracker: every shot, hit and goal drawn on a rink, refreshed every 8 s ---- */
let TRK=null, TRKT=0;
function rinkSVG(d){ const X=x=>(x+100)*5, Y=y=>(42.5-y)*5;   /* NHL coords: x -100..100 ft, y -42.5..42.5 ft */
  const H=d.home.id, col=t=>t===H?'#2563eb':'#dc2626';
  let g=`<svg viewBox="0 0 1000 425" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="996" height="421" rx="140" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
  <line x1="500" y1="2" x2="500" y2="423" stroke="#dc2626" stroke-width="6"/><line x1="375" y1="2" x2="375" y2="423" stroke="#2563eb" stroke-width="6"/><line x1="625" y1="2" x2="625" y2="423" stroke="#2563eb" stroke-width="6"/>
  <line x1="55" y1="20" x2="55" y2="405" stroke="#dc2626" stroke-width="2"/><line x1="945" y1="20" x2="945" y2="405" stroke="#dc2626" stroke-width="2"/>
  <circle cx="500" cy="212" r="75" fill="none" stroke="#2563eb" stroke-width="3"/>${[[155,102],[155,322],[845,102],[845,322]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="75" fill="none" stroke="#dc2626" stroke-width="3"/>`).join('')}
  <path d="M55 182 a30 30 0 0 1 0 60" fill="#bfdbfe" stroke="#dc2626" stroke-width="2" transform="translate(0,0) scale(1,1)"/><path d="M945 182 a30 30 0 0 0 0 60" fill="#bfdbfe" stroke="#dc2626" stroke-width="2"/>
  <rect x="45" y="197" width="10" height="30" fill="none" stroke="#475569" stroke-width="3"/><rect x="945" y="197" width="10" height="30" fill="none" stroke="#475569" stroke-width="3"/>`;
  const shots=d.plays.filter(p=>p.x!=null&&/goal|shot/.test(p.k)&&p.p===d.period||p.k==='goal'&&p.x!=null);
  for(const p of shots){ const x=X(p.x), y=Y(p.y);
    if(p.k==='goal') g+=`<text x="${x}" y="${y+9}" text-anchor="middle" font-size="30" fill="${col(p.tm)}" stroke="#fff" stroke-width="1.5">★</text>`;
    else g+=`<circle cx="${x}" cy="${y}" r="${p.k==='shot-on-goal'?8:6}" fill="${p.k==='shot-on-goal'?col(p.tm):'none'}" stroke="${col(p.tm)}" stroke-width="2.5" opacity=".85"/>`; }
  const last=d.plays.filter(p=>p.x!=null).slice(-1)[0];
  if(last&&d.state!=='OFF'&&d.state!=='FINAL') g+=`<circle cx="${X(last.x)}" cy="${Y(last.y)}" r="11" fill="#111827"><animate attributeName="r" values="9;15;9" dur="1.2s" repeatCount="indefinite"/></circle>`;
  return g+'</svg>'; }
const PLN={'goal':'🚨 GOAL','shot-on-goal':'🥅 Shot on goal','missed-shot':'↗️ Missed shot','blocked-shot':'🧱 Blocked shot','hit':'💥 Hit','penalty':'⛔ Penalty','faceoff':'⚪ Faceoff','giveaway':'🔄 Giveaway','takeaway':'🫳 Takeaway','period-start':'▶️ Period start','period-end':'⏹ Period end'};
async function trkLoad(){ clearTimeout(TRKT); if(!TRK) return; const box=$('trkBox');
  try{ const d=await (await fetch(SERVER+'/nhl/game?id='+TRK)).json(); if(d.err) throw 0;
    const live=d.state==='LIVE'||d.state==='CRIT', fin=d.state==='OFF'||d.state==='FINAL', per=d.ptype==='OT'?'OT':d.ptype==='SO'?'Shootout':['','1st','2nd','3rd'][d.period]||('P'+d.period);
    const tn=id=>id===d.home.id?d.home.ab:id===d.away.id?d.away.ab:'';
    box.innerHTML=`<div class="hd"><b>🏒 ${live?'<span style="color:#f87171">🔴 LIVE</span> ':''}game tracker</b><button class="x" data-trkx>✕</button></div>
      <div class="sc"><div class="t"><img src="${esc(d.away.logo)}" alt="">${esc(d.away.name)}</div><div class="n">${d.away.score??0}</div><div style="font-size:26px;color:#64748b">–</div><div class="n">${d.home.score??0}</div><div class="t"><img src="${esc(d.home.logo)}" alt="">${esc(d.home.name)}</div></div>
      <div class="clk">${live?`${per} · ${d.inter?'Intermission':esc(d.clock)+' left'}`:fin?'Final':'Not started yet'}</div>
      <div class="sub2">Shots ${d.away.sog??0}–${d.home.sog??0} · ${esc(d.venue)}${d.tv&&d.tv.length?` · On TV: ${d.tv.map(esc).join(', ')}`:''}</div>
      ${rinkSVG(d)}
      <div class="lg"><span><i style="background:#dc2626"></i>${esc(d.away.ab)}</span><span><i style="background:#2563eb"></i>${esc(d.home.ab)}</span><span>● shot on goal</span><span>○ missed</span><span>★ goal</span><span>Dots: this period · stars: all goals</span></div>
      <h3 style="margin:14px 0 8px">Play by play</h3><div class="feed2">${d.plays.slice().reverse().slice(0,40).map(p=>`<div class="pl${p.k==='goal'?' g':''}"><b style="min-width:62px">${['','1st','2nd','3rd'][p.p]||'OT'} ${esc(p.t||'')}</b><span>${PLN[p.k]||esc(p.k)}${tn(p.tm)?` · <b>${esc(tn(p.tm))}</b>`:''}${p.who?` · ${esc(p.who)}`:''}${p.st?` (${esc(p.st)})`:''}${p.a1?` · assist ${esc(p.a1)}`:''}${p.k==='goal'&&p.a!=null?` · ${p.a}–${p.h}`:''}</span></div>`).join('')||'<div class="pl">No plays yet.</div>'}</div>
      <p class="sub2" style="margin-top:12px">Live data from the NHL · updates by itself every few seconds</p>`;
    if(live) TRKT=setTimeout(trkLoad,8000);
  }catch(e){ box.innerHTML='<div class="hd"><b>🏒 Game tracker</b><button class="x" data-trkx>✕</button></div><p>Could not load this game right now. Try again in a moment.</p>'; } }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-trk]'); if(t){ TRK=t.dataset.trk; $('trk').classList.remove('hide'); $('trkBox').innerHTML='<p>Loading the game…</p>'; trkLoad(); return; } if(e.target.closest('[data-trkx]')){ TRK=null; clearTimeout(TRKT); $('trk').classList.add('hide'); } });
let NHLT=0;
async function nhlLoad(){ clearTimeout(NHLT); const el=document.getElementById('nhlSB'); if(!el) return;
  try{ const d=await (await fetch(SERVER+'/nhl')).json(); const G=d.games||[];
    const order={LIVE:0,CRIT:0,PRE:1,FUT:2,OFF:3,FINAL:3}; G.sort((a,b)=>(order[a.state]??2)-(order[b.state]??2)||String(a.start).localeCompare(String(b.start)));
    const nLive=G.filter(g=>g.state==='LIVE'||g.state==='CRIT').length;
    const per=g=>g.ptype==='OT'?'OT':g.ptype==='SO'?'Shootout':['','1st','2nd','3rd'][g.period]||('P'+g.period);
    const team=t=>`<div class="tm"><img src="${esc(t.logo||'')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="nm">${esc(t.name)}</span><span class="sc">${t.score??''}</span></div>`;
    const card=g=>{ const live=g.state==='LIVE'||g.state==='CRIT', fin=g.state==='OFF'||g.state==='FINAL';
      const when=new Date(g.start).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
      const st=live?`<span class="lv">🔴 LIVE · ${per(g)} ${g.inter?'intermission':esc(g.clock)}</span>`:fin?`<span>Final${g.ptype==='OT'?' (OT)':g.ptype==='SO'?' (SO)':''}</span>`:`<span>Starts ${when}</span>`;
      const sog=(g.away.sog!=null&&(live||fin))?`<span>Shots ${g.away.sog}–${g.home.sog}</span>`:'';
      const gl=g.goals&&g.goals.length?`<div class="gl">🚨 ${g.goals.slice(-3).map(x=>`${esc(x.team)} ${esc(x.who)} (${esc(x.t)})`).join(' · ')}</div>`:'';
      const hl=fin?CLIPS.find(c=>c.cat==='🏒 Hockey'&&!c.short&&c.title.includes(g.away.name)&&c.title.includes(g.home.name)):null;
      const acts=[(live||fin)?`<a class="${live?'lt':''}" data-trk="${g.id}">${live?'📡 Watch live tracker':'📊 Game tracker'}</a>`:'',hl?`<a data-goclip="${esc(hl.id)}">▶ Highlights</a>`:''].filter(Boolean).join('');
      return `<div class="gm${live?' live':''}">${team(g.away)}${team(g.home)}<div class="st">${st}${sog}</div>${gl}${acts?`<div class="acts">${acts}</div>`:''}</div>`; };
    const ytl=d.yt?`<div class="ytl"><iframe src="https://www.youtube-nocookie.com/embed/${esc(d.yt.id)}?autoplay=0&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="NHL live"></iframe><div>🔴 LIVE on the NHL's YouTube: ${esc(d.yt.title)}</div></div>`:'';
    el.innerHTML=`<h2>🏒 NHL scoreboard</h2><div class="sub">${G.length?`${G.length} game${G.length>1?'s':''} today${nLive?` · <b style="color:#f87171">${nLive} live now</b>`:''} · scores update by themselves`:'No NHL games today.'} · swipe down for highlights ⬇</div>`+ytl+G.map(card).join('');
  }catch(e){ el.innerHTML='<h2>🏒 NHL scoreboard</h2><div class="sub">Could not load scores right now. Swipe down for highlights ⬇</div>'; }
  NHLT=setTimeout(()=>{ if(CAT==='🏒 Hockey') nhlLoad(); },30000); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-goclip]'); if(!b) return; const i=LIST.findIndex(c=>c.id===b.dataset.goclip); const s=i>=0&&document.querySelector(`.clip[data-i="${i}"]`); if(s) s.scrollIntoView({behavior:'smooth'}); });
function openChan(nm){ CAT='👤 '+nm; WHO=''; ACT=-1; build(); }
let SEENAT=0; function activate(i){ if(i===ACT) return; const old=ACT; if(old>=0&&LIST[old]){ const secs=(Date.now()-SEENAT)/1000; taste(LIST[old],secs>12?1:secs>5?.4:secs<2?-.3:0); } SEENAT=Date.now(); ACT=i; if(old>=0) unmount(old); for(const k of [i-2,i+2]) if(k!==i) unmount(k); mount(i,true); if(!MUTED){ [600,1500,3000].forEach(t=>setTimeout(()=>{ if(ACT===i&&!MUTED){ ytCmd('unMute'); ytCmd('setVolume',[100]); } },t)); } const nx=LIST[i+1]; if(nx&&nx.src==='yt') mount(i+1,false); if(location.hash.slice(1)!==LIST[i].id) history.replaceState(null,'','#'+encodeURIComponent(LIST[i].id)); }
document.addEventListener('click',async e=>{ const ch=e.target.closest('[data-chan]'); if(ch){ e.preventDefault(); openChan(ch.dataset.chan); return; } if(e.target.closest('[data-chanplay]')){ const s2=document.querySelector('.clip[data-i="1"]'); if(s2) s2.scrollIntoView({behavior:'smooth'}); return; } const wc=e.target.closest('[data-who]'); if(wc){ WHO=wc.dataset.who; ACT=-1; build(); return; } const chip=e.target.closest('[data-c]'); if(chip){ CAT=chip.dataset.c; if(CAT!=='▶️ Shorts') WHO=''; ACT=-1; build(); return; }
  const sec=e.target.closest('.clip'); if(!sec) return; const c=LIST[+sec.dataset.i];
  if(e.target.closest('[data-mute]')){ setSound(MUTED); WANT=!MUTED; ls.set('rrClipsMuted',MUTED?'1':'0'); return; }
  if(e.target.closest('[data-like]')){ const b=e.target.closest('[data-like]'), on=!MINE.has(c.id); on?MINE.add(c.id):MINE.delete(c.id); b.classList.toggle('liked',on); ST.likes[c.id]=Math.max(0,(ST.likes[c.id]||0)+(on?1:-1)); b.querySelector('span').textContent=fmtN(ST.likes[c.id]); if(on){ b.animate([{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:300}); } taste(c,on?3:-3); post('/feed/like',{id:c.id,on}).catch(()=>{}); return; }
  if(e.target.closest('[data-share]')){ const u=location.origin+location.pathname+'#'+encodeURIComponent(c.id); try{ if(navigator.share){ await navigator.share({title:c.title,url:u}); return; } await navigator.clipboard.writeText(u); toast('🔗 Link copied!'); }catch(_){ toast(u); } return; }
  if(e.target.closest('[data-rep]')){ if(!confirm('Report this clip to the admins? Only do this if it is mean, scary, rude or not OK.')) return; post('/feed/report',{id:c.id}).then(()=>toast('🚩 Thanks — the admins will take a look')).catch(()=>{}); return; }
  if(e.target.closest('[data-com]')){ openCom(c); return; } });
/* sound: browsers only allow it after you tap, so the first tap anywhere turns it on (unless you chose mute) */
function ytCmd(f,a){ const fr=document.querySelector(`.clip[data-i="${ACT}"] iframe`); if(fr&&fr.contentWindow) fr.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*'); }
function setSound(on){ MUTED=!on; const sec=document.querySelector(`.clip[data-i="${ACT}"]`); if(!sec) return; const v=sec.querySelector('video'); if(v){ v.muted=MUTED; if(on) v.play().catch(()=>{}); }

  sec.querySelectorAll('[data-mute]').forEach(b=>b.textContent=MUTED?'🔇':'🔊'); const sb=$('sndBtn'); if(sb) sb.style.display=MUTED?'':'none'; }
function firstTap(e){ if(TAPPED) return; TAPPED=true; if(WANT&&!(e&&e.target&&e.target.closest&&e.target.closest('[data-mute]'))) setSound(true); }
addEventListener('pointerdown',firstTap,{capture:true}); addEventListener('keydown',firstTap,{capture:true});

const ago=t=>{ const s=(Date.now()-t)/1000; return s<60?'just now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'; };
$('comX').onclick=()=>$('comSheet').classList.add('hide');

  x.upload.onprogress=e=>{ if(e.lengthComputable) $('prog').style.width=(e.loaded/e.total*100)+'%'; }; $('pGo').disabled=true; $('pMsg').textContent='Uploading…'; $('pMsg').className='msg';
  x.onload=()=>{ $('pGo').disabled=false; let r={}; try{ r=JSON.parse(x.responseText); }catch(e){} if(r.ok){ $('pMsg').textContent=r.st==='pending'?'✅ Posted! An admin will check it, then everyone can see it.':'✅ Posted!'; $('pMsg').className='msg ok'; FILE=null; $('file').value=''; $('cap').value=''; $('drop').textContent='📁 Tap to choose a video or picture'; $('prog').style.width='0'; setTimeout(()=>{ $('postM').classList.add('hide'); load(); },1800); }
    else { $('pMsg').textContent={big:'That file is too big.',type:'Only videos (mp4, webm, mov) and pictures work.',words:'Please keep the caption friendly.',banned:'You can\'t post right now.',slow:'That\'s a lot of posts! Try again in an hour.',off:'Posting is switched off right now.'}[r.err]||'Upload failed — try again.'; $('pMsg').className='msg err'; } };
  x.onerror=()=>{ $('pGo').disabled=false; $('pMsg').textContent='Upload failed — check your connection.'; $('pMsg').className='msg err'; }; x.send(FILE); };
