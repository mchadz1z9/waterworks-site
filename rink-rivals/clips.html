(()=>{

function community(){ return ST.posts.map(p=>({id:p.id,src:'user',kind:p.kind,url:SERVER+'/feed/media/'+p.id.slice(2),title:p.cap||'',by:'@'+p.name,cat:'🆕 Community',ts:p.ts})); }
function build(){ ACT=-1; const hide=new Set(ST.hide||[]), cur=CLIPS.filter(c=>!hide.has(c.id)), com=community();

  if(CAT==='For you'){ const mix=shuffle(cur.filter(c=>c.cat!=='🎬 Movies')); LIST=[]; let k=0; for(let i=0;i<mix.length;i++){ LIST.push(mix[i]); if(i%4===2&&com[k]) LIST.push(com[k++]); } while(com[k]) LIST.push(com[k++]); }

  if(c.kind==='image'){ st.innerHTML=`<img class="media" src="${esc(c.url)}" alt="">`; return; }
  const movie=c.cat==='🎬 Movies'; st.innerHTML=`<video playsinline ${movie?'controls':'loop'} ${MUTED?'muted':''} preload="${play?'auto':'metadata'}" ${c.thumb?`poster="${esc(c.thumb)}"`:''} src="${esc(c.url)}"></video><button class="mute" data-mute>${MUTED?'🔇':'🔊'}</button>`;
  const v=st.querySelector('video'); if(!movie) v.onclick=()=>{ v.paused?v.play().catch(()=>{}):v.pause(); }; if(play) v.play().catch(()=>{ if(!v.muted){ v.muted=true; MUTED=true; st.querySelectorAll('[data-mute]').forEach(b=>b.textContent='🔇'); const sb=$('sndBtn'); if(sb) sb.style.display=''; } v.play().catch(()=>{}); }); }
function unmount(i){ const st=stageOf(i); if(!st) return; if(LIST[i]&&LIST[i].src==='nhl') return; const v=st.querySelector('video'); if(v){ v.pause(); v.removeAttribute('src'); v.load(); } st.innerHTML=''; delete st.dataset.m; }
/* live NHL scores (through our server, refreshed every 30 s while the Hockey tab is open) */
let NHLT=0;
async function nhlLoad(){ clearTimeout(NHLT); const el=document.getElementById('nhlSB'); if(!el) return;
  try{ const d=await (await fetch(SERVER+'/nhl')).json(); const G=d.games||[];
    const order={LIVE:0,CRIT:0,PRE:1,FUT:2,OFF:3,FINAL:3}; G.sort((a,b)=>(order[a.state]??2)-(order[b.state]??2)||String(a.start).localeCompare(String(b.start)));
    const nLive=G.filter(g=>g.state==='LIVE'||g.state==='CRIT').length;
    const per=g=>g.ptype==='OT'?'OT':g.ptype==='SO'?'Shootout':['','1st','2nd','3rd'][g.period]||('P'+g.period);
    const team=t=>`<div class="tm"><img src="${esc(t.logo||'')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="nm">${esc(t.name)}</span><span class="sc">${t.score??''}</span></div>`;
    const card=g=>{ const live=g.state==='LIVE'||g.state==='CRIT', fin=g.state==='OFF'||g.state==='FINAL';
      const when=new Date(g.start).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
      const st=live?`<span class="lv">🔴 LIVE · ${per(g)} ${g.inter?'intermission':esc(g.clock)}</span>`:fin?`<span>Final${g.ptype==='OT'?' (OT)':g.ptype==='SO'?' (SO)':''}</span>`:`<span>Starts ${when}</span>`;
      const sog=(g.away.sog!=null&&(live||fin))?`<span>Shots ${g.away.sog}–${g.home.sog}</span>`:'';
      const gl=g.goals&&g.goals.length?`<div class="gl">🚨 ${g.goals.slice(-3).map(x=>`${esc(x.team)} ${esc(x.who)} (${esc(x.t)})`).join(' · ')}</div>`:'';
      const hl=fin?CLIPS.find(c=>c.cat==='🏒 Hockey'&&!c.short&&c.title.includes(g.away.name)&&c.title.includes(g.home.name)):null;
      return `<div class="gm${live?' live':''}">${team(g.away)}${team(g.home)}<div class="st">${st}${sog}</div>${gl}${hl?`<a class="hl" data-goclip="${esc(hl.id)}">▶ Watch the highlights</a>`:''}</div>`; };
    el.innerHTML=`<h2>🏒 NHL scoreboard</h2><div class="sub">${G.length?`${G.length} game${G.length>1?'s':''} today${nLive?` · <b style="color:#f87171">${nLive} live now</b>`:''} · scores update by themselves`:'No NHL games today.'} · swipe down for highlights ⬇</div>`+G.map(card).join('');
  }catch(e){ el.innerHTML='<h2>🏒 NHL scoreboard</h2><div class="sub">Could not load scores right now. Swipe down for highlights ⬇</div>'; }
  NHLT=setTimeout(()=>{ if(CAT==='🏒 Hockey') nhlLoad(); },30000); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-goclip]'); if(!b) return; const i=LIST.findIndex(c=>c.id===b.dataset.goclip); const s=i>=0&&document.querySelector(`.clip[data-i="${i}"]`); if(s) s.scrollIntoView({behavior:'smooth'}); });
function activate(i){ if(i===ACT) return; const old=ACT; ACT=i; if(old>=0) unmount(old); for(const k of [i-2,i+2]) if(k!==i) unmount(k); mount(i,true); if(!MUTED){ [600,1500,3000].forEach(t=>setTimeout(()=>{ if(ACT===i&&!MUTED){ ytCmd('unMute'); ytCmd('setVolume',[100]); } },t)); } const nx=LIST[i+1]; if(nx&&nx.src==='yt') mount(i+1,false); if(location.hash.slice(1)!==LIST[i].id) history.replaceState(null,'','#'+encodeURIComponent(LIST[i].id)); }
document.addEventListener('click',async e=>{ const chip=e.target.closest('[data-c]'); if(chip){ CAT=chip.dataset.c; ACT=-1; build(); return; }
  const sec=e.target.closest('.clip'); if(!sec) return; const c=LIST[+sec.dataset.i];
  if(e.target.closest('[data-mute]')){ setSound(MUTED); WANT=!MUTED; ls.set('rrClipsMuted',MUTED?'1':'0'); return; }
  if(e.target.closest('[data-like]')){ const b=e.target.closest('[data-like]'), on=!MINE.has(c.id); on?MINE.add(c.id):MINE.delete(c.id); b.classList.toggle('liked',on); ST.likes[c.id]=Math.max(0,(ST.likes[c.id]||0)+(on?1:-1)); b.querySelector('span').textContent=fmtN(ST.likes[c.id]); if(on){ b.animate([{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:300}); } post('/feed/like',{id:c.id,on}).catch(()=>{}); return; }
  if(e.target.closest('[data-share]')){ const u=location.origin+location.pathname+'#'+encodeURIComponent(c.id); try{ if(navigator.share){ await navigator.share({title:c.title,url:u}); return; } await navigator.clipboard.writeText(u); toast('🔗 Link copied!'); }catch(_){ toast(u); } return; }
  if(e.target.closest('[data-rep]')){ if(!confirm('Report this clip to the admins? Only do this if it is mean, scary, rude or not OK.')) return; post('/feed/report',{id:c.id}).then(()=>toast('🚩 Thanks — the admins will take a look')).catch(()=>{}); return; }
  if(e.target.closest('[data-com]')){ openCom(c); return; } });
/* sound: browsers only allow it after you tap, so the first tap anywhere turns it on (unless you chose mute) */
function ytCmd(f,a){ const fr=document.querySelector(`.clip[data-i="${ACT}"] iframe`); if(fr&&fr.contentWindow) fr.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*'); }
function setSound(on){ MUTED=!on; const sec=document.querySelector(`.clip[data-i="${ACT}"]`); if(!sec) return; const v=sec.querySelector('video'); if(v){ v.muted=MUTED; if(on) v.play().catch(()=>{}); }
  if(sec.querySelector('iframe')){ if(on){ ytCmd('unMute'); ytCmd('setVolume',[100]); ytCmd('playVideo'); } else ytCmd('mute'); }
  sec.querySelectorAll('[data-mute]').forEach(b=>b.textContent=MUTED?'🔇':'🔊'); const sb=$('sndBtn'); if(sb) sb.style.display=MUTED?'':'none'; }
function firstTap(e){ if(TAPPED) return; TAPPED=true; if(WANT&&!(e&&e.target&&e.target.closest&&e.target.closest('[data-mute]'))) setSound(true); }
addEventListener('pointerdown',firstTap,{capture:true}); addEventListener('keydown',firstTap,{capture:true});
$('sndBtn').onclick=()=>{ TAPPED=true; WANT=true; ls.set('rrClipsMuted','0'); setSound(true); };
/* comments */
let COMC=null;
async function openCom(c){ COMC=c; $('comSheet').classList.remove('hide'); $('comT').textContent='💬 Comments'; $('comList').innerHTML='<div class="cm" style="color:#94a3b8">Loading…</div>';
  try{ const d=await post('/feed/comments',{id:c.id}); $('comList').innerHTML=(d.list||[]).map(x=>`<div class="cm"><b>${esc(x.name)}</b><span>${ago(x.ts)}</span><div>${esc(x.text)}</div></div>`).join('')||'<div class="cm" style="color:#94a3b8">No comments yet — say something nice!</div>'; }catch(e){ $('comList').innerHTML='<div class="cm">Could not load comments.</div>'; } }
const ago=t=>{ const s=(Date.now()-t)/1000; return s<60?'just now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'; };
$('comX').onclick=()=>$('comSheet').classList.add('hide');
async function sendCom(){ const t=$('comIn').value.trim(); if(!t||!COMC) return; $('comIn').value=''; const r=await post('/feed/comment',{id:COMC.id,name:myName(),text:t}).catch(()=>({})); if(r.ok){ ST.coms[COMC.id]=(ST.coms[COMC.id]||0)+1; openCom(COMC); } else toast(r.err==='words'?'Please keep it friendly 🙂':r.err==='banned'?'You can\'t comment right now':r.err==='slow'?'Slow down a bit!':'Could not send'); }
$('comGo').onclick=sendCom; $('comIn').onkeydown=e=>{ e.stopPropagation(); if(e.key==='Enter') sendCom(); };
/* posting */
let FILE=null;
$('postBtn').onclick=()=>{ if(ST.off){ toast('Posting is switched off right now'); return; } $('postM').classList.remove('hide'); $('pMsg').textContent=ST.approve?'New posts are checked by an admin before everyone can see them.':''; $('pMsg').className='msg'; };
$('pX').onclick=()=>{ $('postM').classList.add('hide'); };
$('drop').onclick=()=>$('file').click();
$('file').onchange=()=>{ const f=$('file').files[0]; if(!f) return; const vid=f.type.startsWith('video/'), max=vid?20e6:6e6; if(f.size>max){ $('pMsg').textContent=`That file is too big — max ${max/1e6} MB.`; $('pMsg').className='msg err'; FILE=null; return; } FILE=f; const u=URL.createObjectURL(f); $('drop').innerHTML=vid?`<video src="${u}" muted autoplay loop playsinline></video>`:`<img src="${u}">`; $('pMsg').textContent=''; };
$('cap').onkeydown=e=>e.stopPropagation();
$('pGo').onclick=()=>{ if(!FILE){ $('pMsg').textContent='Choose a video or picture first.'; $('pMsg').className='msg err'; return; } const x=new XMLHttpRequest(); x.open('POST',SERVER+'/feed/upload'); x.setRequestHeader('content-type',FILE.type||'application/octet-stream'); x.setRequestHeader('x-pid',pid()); x.setRequestHeader('x-name',encodeURIComponent(myName())); x.setRequestHeader('x-cap',encodeURIComponent($('cap').value.trim()));
  x.upload.onprogress=e=>{ if(e.lengthComputable) $('prog').style.width=(e.loaded/e.total*100)+'%'; }; $('pGo').disabled=true; $('pMsg').textContent='Uploading…'; $('pMsg').className='msg';
  x.onload=()=>{ $('pGo').disabled=false; let r={}; try{ r=JSON.parse(x.responseText); }catch(e){} if(r.ok){ $('pMsg').textContent=r.st==='pending'?'✅ Posted! An admin will check it, then everyone can see it.':'✅ Posted!'; $('pMsg').className='msg ok'; FILE=null; $('file').value=''; $('cap').value=''; $('drop').textContent='📁 Tap to choose a video or picture'; $('prog').style.width='0'; setTimeout(()=>{ $('postM').classList.add('hide'); load(); },1800); }
    else { $('pMsg').textContent={big:'That file is too big.',type:'Only videos (mp4, webm, mov) and pictures work.',words:'Please keep the caption friendly.',banned:'You can\'t post right now.',slow:'That\'s a lot of posts! Try again in an hour.',off:'Posting is switched off right now.'}[r.err]||'Upload failed — try again.'; $('pMsg').className='msg err'; } };
  x.onerror=()=>{ $('pGo').disabled=false; $('pMsg').textContent='Upload failed — check your connection.'; $('pMsg').className='msg err'; }; x.send(FILE); };
/* keyboard */
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'')) return; const f=$('feed'); if(e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); f.scrollBy({top:innerHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='k'){ e.preventDefault(); f.scrollBy({top:-innerHeight,behavior:'smooth'}); } if(e.key==='m'){ const b=document.querySelector(`.clip[data-i="${ACT}"] [data-mute]`); if(b) b.click(); } });
async function load(){ try{ ST=await post('/feed/list',{}); MINE=new Set(ST.mine||[]); }catch(e){} const want=decodeURIComponent(location.hash.slice(1)); build();
  if(want){ const i=LIST.findIndex(c=>c.id===want); if(i>0){ const s=document.querySelector(`.clip[data-i="${i}"]`); if(s) $('feed').scrollTop=s.offsetTop; } } }
build(); load();
})();
