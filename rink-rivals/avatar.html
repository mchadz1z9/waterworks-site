<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Avatars</title>
<style>
:root{--bg:#070712;--p1:#11111f;--p2:#1b1b30;--line:#2a2a44;--tx:#f4f4fb;--mut:#a1a1c0;--acc:linear-gradient(135deg,#a855f7,#ec4899 55%,#f59e0b)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
#hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:1200px;margin:0 auto}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal}
#hd .sp{flex:1}#hd a.b{background:var(--p2);border-radius:18px;padding:7px 13px;font:600 13px system-ui}
#wrap{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px}
#prev{position:sticky;top:16px;align-self:start;background:var(--p1);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center}
#big{width:100%;aspect-ratio:100/130;border-radius:16px;overflow:hidden}
#nm{font:900 22px system-ui;margin:12px 0 2px}#prev small{color:var(--mut)}
#prev .row{display:flex;gap:8px;margin-top:12px}#prev .row button{flex:1;border:0;border-radius:12px;padding:12px;font:900 15px system-ui}
#save{background:var(--acc);color:#fff}#rand{background:var(--p2);color:var(--tx)}
#chatPrev{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--p2);border-radius:12px;padding:8px 10px;text-align:left;font-size:14px}
#chatPrev i{flex:none;width:34px;height:34px;border-radius:50%;overflow:hidden;display:block}#chatPrev b{color:#fbbf24;margin-right:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:var(--p1);color:var(--tx);border-radius:999px;padding:8px 14px;font:700 14px system-ui}.tabs button.on{background:var(--acc);border-color:transparent}
.sec h3{margin:14px 0 8px;font:800 15px system-ui;color:var(--mut)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--p1);border-radius:14px;padding:0;overflow:hidden;aspect-ratio:1}.opt.on{border-color:#ec4899;box-shadow:0 0 0 3px #ec489955}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}.sw button.on{border-color:#fff}
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gi{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--p1);border-radius:14px;padding:10px;color:var(--tx);text-align:left}.gi.on{border-color:#ec4899}
.gi span{font-size:26px}.gi b{display:block;font-size:14px}.gi small{color:var(--mut);font-size:12px}
.note{color:var(--mut);font-size:14px}
#num{width:90px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--p1);color:var(--tx);font:800 16px system-ui}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#0f0f1d;border:2px solid #ec4899;border-radius:14px;padding:12px 16px;font:800 15px system-ui;z-index:99;display:none}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
@media(max-width:820px){#wrap{grid-template-columns:1fr}#prev{position:static;display:grid;grid-template-columns:130px 1fr;gap:12px;text-align:left;align-items:center}#big{grid-row:span 3}#prev .row{margin-top:0}#chatPrev{grid-column:1/-1}}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a id="logo" href="avatar"><i>🧑‍🎤</i>Rival Avatars</a><span class="sp"></span><a class="b" href="./">← Arcade</a></header>
<div id="wrap">
  <aside id="prev"><div id="big"></div><div><div id="nm"></div><small>Your avatar shows in chat, the TV and Game Day chats, and the online list.</small></div>
    <div class="row"><button id="rand">🎲 Random</button><button id="save">💾 Save</button></div>
    <div id="chatPrev"><i id="cpA"></i><div><b id="cpN"></b>this is how you look in chat!</div></div></aside>
  <section><div class="tabs" id="tabs"></div><div id="body"></div></section>
</div>
<div id="toast"></div>
<script src="avatar.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const R=window.RRAV; let A=R.load(), tab='look', dirty=false;
  const name=()=>{ try{ return localStorage.getItem('rrOnlineName')||'You'; }catch(e){ return 'You'; } };
  const toast=t=>{ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',2600); };
  const TABS=[['look','😀 Face & hair'],['fit','👕 Outfit'],['color','🎨 Colors'],['gear','🧢 Gear']];
  function preview(){ $('big').innerHTML=R.svg(Object.assign({},A,{g:R.gearNow()}),true); $('cpA').innerHTML=R.mini(R.code(A)); $('nm').textContent=name(); $('cpN').textContent=name(); }
  const opt=(key,n,label)=>`<div class="sec"><h3>${label}</h3><div class="opts">${Array.from({length:n},(_,i)=>`<button class="opt${A[key]===i?' on':''}" data-k="${key}" data-v="${i}">${R.svg(Object.assign({},A,{[key]:i,g:R.gearNow()}),false)}</button>`).join('')}</div></div>`;
  const sw=(key,list,label)=>`<div class="sec"><h3>${label}</h3><div class="sw">${list.map((c,i)=>`<button style="background:${c}" class="${A[key]===i?'on':''}" data-k="${key}" data-v="${i}" aria-label="${label} ${i+1}"></button>`).join('')}</div></div>`;
  function body(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab)); let h='';
    if(tab==='look') h=sw('sk',R.SKIN,'Skin')+opt('hs',R.N.hs,'Hair')+sw('hc',R.HAIRC,'Hair color')+opt('ey',R.N.ey,'Eyes')+opt('mo',R.N.mo,'Mouth');
    else if(tab==='fit') h=opt('tp',R.N.tp,'Top (tee, hoodie, jersey, tank, jacket)')+(A.tp===2?`<div class="sec"><h3>Jersey number</h3><input id="num" type="number" min="0" max="99" value="${A.num}"></div>`:'');
    else if(tab==='color') h=sw('tc',R.COL,'Top color')+sw('pc',R.COL,'Pants color')+sw('sh',R.COL,'Shoes color')+sw('bg',R.BG,'Background');
    else { const C=window.RRCOIN; const items=(C&&C.tradeable?C.tradeable():[]).map(x=>C.itemOf(x.k)).filter(i=>i&&R.SLOTS.includes(i.slot));
      const owned=items.filter(i=>C.owns(i.k)), rest=items.filter(i=>!C.owns(i.k));
      const card=i=>`<button class="gi${C.eqKey(i.slot)===i.k?' on':''}" data-gear="${esc(i.k)}"><span>${esc(i.ic)}</span><div><b>${esc(i.n)}</b><small>${C.eqKey(i.slot)===i.k?'✅ Wearing':C.owns(i.k)?'Tap to wear':'🪙 '+(i.p||0).toLocaleString()+' in the Shop'}</small></div></button>`;
      h=`<p class="note">Hats, glasses, chains, capes and badges from the 🪙 Arcade Shop show up on your avatar <b>and</b> in the 3D games.</p>`+(owned.length?`<div class="sec"><h3>Yours</h3><div class="gear">${owned.map(card).join('')}</div></div>`:'<p class="note">You don\'t own any gear yet.</p>')+(rest.length?`<div class="sec"><h3>In the Shop</h3><div class="gear">${rest.map(card).join('')}</div></div>`:''); }
    $('body').innerHTML=h; const n=$('num'); if(n) n.oninput=()=>{ A.num=Math.max(0,Math.min(99,parseInt(n.value,10)||0)); dirty=true; preview(); }; }
  $('tabs').innerHTML=TABS.map(([k,t])=>`<button data-t="${k}">${t}</button>`).join('');
  document.addEventListener('click',e=>{ const t=e.target.closest('[data-t]'); if(t){ tab=t.dataset.t; body(); return; }
    const o=e.target.closest('[data-k]'); if(o){ A[o.dataset.k]=+o.dataset.v; dirty=true; preview(); body(); return; }
    const g=e.target.closest('[data-gear]'); if(g){ const C=window.RRCOIN, k=g.dataset.gear; if(C.owns(k)){ C.toggleItem(k); dirty=true; setTimeout(()=>{ preview(); body(); },50); } else if(C.open) C.open('shop'); else location.href='./#shop'; } });
  $('rand').onclick=()=>{ const r=n=>Math.floor(Math.random()*n); A=Object.assign(A,{sk:r(R.SKIN.length),hs:r(R.N.hs),hc:r(R.HAIRC.length),ey:r(R.N.ey),mo:r(R.N.mo),tp:r(R.N.tp),tc:r(R.COL.length),pc:r(R.COL.length),sh:r(R.COL.length),bg:r(R.BG.length),num:r(100)}); dirty=true; preview(); body(); };
  $('save').onclick=()=>{ R.save(A); dirty=false; try{ window.RRC&&RRC.setAv&&RRC.setAv(R.code(A)); }catch(e){} toast('💾 Saved! Everyone sees your new look.'); };
  addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  const wait=setInterval(()=>{ if(window.RRCOIN&&RRCOIN.eqKey){ clearInterval(wait); preview(); body(); } },150); preview(); body();
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
