<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Remix</title>
<style>
:root{--bg:#09060f;--p1:#140f1f;--p2:#1f1830;--line:#2f2546;--tx:#f7f2ff;--mut:#ab9fc6;--acc:linear-gradient(135deg,#f43f5e,#a855f7 55%,#3b82f6)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui}
#hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:1200px;margin:0 auto;flex-wrap:wrap}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal}
#hd .sp{flex:1}.tabs{display:flex;gap:6px}.tabs button{border:0;background:none;color:var(--mut);font:700 14px system-ui;padding:8px 12px;border-radius:10px}.tabs button.on{background:var(--p2);color:var(--tx)}
main{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px;font:800 16px system-ui}
.btn{border:0;border-radius:11px;padding:10px 14px;font:900 14px system-ui;background:var(--acc);color:#fff}.btn.g{background:var(--p2);color:var(--tx)}.btn.rec{background:#dc2626}
.note{color:var(--mut);font-size:13px}
input,select{border:1px solid var(--line);background:#0c0915;color:var(--tx);border-radius:10px;padding:9px 11px;font-size:14px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.games button{border:2px solid var(--line);background:var(--p2);color:var(--tx);border-radius:12px;padding:10px;font:800 13px system-ui}.games button span{display:block;font-size:26px}
#gframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000;display:block}
.ed{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
#out{width:100%;aspect-ratio:9/16;background:#000;border-radius:16px;display:block;touch-action:none}
.stk{display:flex;gap:6px;flex-wrap:wrap}.stk button{border:0;background:var(--p2);border-radius:10px;font-size:22px;padding:4px 8px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fi{background:var(--p1);border:1px solid var(--line);border-radius:14px;overflow:hidden}.fi video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}.fi div{padding:8px 10px;display:flex;align-items:center;gap:8px}.fi b{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.best{border:2px solid #facc15}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
@media(max-width:820px){.ed{grid-template-columns:1fr}.tabs{order:3;width:100%}#out{max-height:70vh;width:auto;margin:0 auto}}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a class="bk" href="./" title="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><a id="logo" href="remix"><i>🎞️</i>Rival Remix</a><span class="sp"></span>
  <nav class="tabs"><button data-t="make" class="on">🎬 Make</button><button data-t="feed">🔥 Remixes</button></nav></header>
<main id="main"></main>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SRV=(()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })();
  const pid=()=>{ try{ let p=localStorage.getItem('rrPid'); if(!p||p.length<8){ p=Math.random().toString(36).slice(2,14); localStorage.setItem('rrPid',p); } return p; }catch(e){ return ''; } };
  const name=()=>{ try{ return localStorage.getItem('rrOnlineName')||'Player'; }catch(e){ return 'Player'; } };
  const post=(u,b)=>fetch(SRV+u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({pid:pid(),name:name()},b||{}))}).then(r=>r.json()).catch(()=>null);
  const GAMES=[['city','🏙️','Rival City'],['br','🌪️','Storm Royale'],['skystunt','🚗','Sky Stunt'],['hockey','🏒','Hockey'],['football','🏈','Football'],['basketball','🏀','Basketball'],['soccer','⚽','Soccer'],['f1','🏎️','F1 Racing'],['blockverse','🧱','Blockverse'],['mx','🏍️','Motocross'],['golf','⛳','Golf'],['airsoft','🔫','Airsoft']];
  const STICKERS=['🔥','😂','😱','💯','👑','🏆','⚡','💥','😎','🤯','👀','🎯','🚀','💀','🥶','GG'];
  const REMIX='🎞️ Remix: ';
  let tab='make', clip=null, clipURL='', S={cap:'',pos:'top',style:'bold',fx:'none',beat:'none',stickers:[]}, raf=0, recStream=null;
  const canRec=!!(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream);
  /* ---------- step 1: record a game ---------- */
  function make(){ cancelAnimationFrame(raf);
    if(!canRec){ $('main').innerHTML='<div class="card"><p class="note">This browser can\'t record video. Try Chrome or Edge on a computer or Chromebook.</p></div>'; return; }
    if(clip){ editor(); return; }
    $('main').innerHTML=`<div class="card"><h3>1. Pick a game to record</h3><div class="games">${GAMES.map(g=>`<button data-g="${g[0]}"><span>${g[1]}</span>${esc(g[2])}</button>`).join('')}</div><p class="note">Play inside the box below, then press ● Record to capture up to 15 seconds of your best moment.</p></div><div class="card" id="recBox" style="display:none"><iframe id="gframe" allow="autoplay; fullscreen; gamepad"></iframe><div class="row" style="margin-top:10px"><button class="btn rec" id="recB">● Record</button><span class="note" id="recM"></span></div></div>`; }
  function findCanvas(){ try{ const d=$('gframe').contentDocument; const cs=[...d.querySelectorAll('canvas')].filter(c=>c.width*c.height>50000&&getComputedStyle(c).display!=='none'); cs.sort((a,b)=>b.width*b.height-a.width*a.height); return cs[0]||null; }catch(e){ return null; } }
  /* records every visible canvas of the game (3D world + score overlay) into one picture; if that comes out black, records the main canvas directly */
  function record(){ const cv=findCanvas(); if(!cv){ $('recM').textContent='Start the game first (click Play inside the box), then press Record.'; return; }
    const d=$('gframe').contentDocument, fw=d.documentElement.clientWidth||1280, fh=d.documentElement.clientHeight||720;
    const comp=document.createElement('canvas'); comp.width=1280; comp.height=Math.round(1280*fh/fw); const cx=comp.getContext('2d'); let on=true;
    const vis=()=>[...d.querySelectorAll('canvas')].filter(c=>{ const r=c.getBoundingClientRect(), st=getComputedStyle(c); return r.width>40&&r.height>40&&st.display!=='none'&&st.visibility!=='hidden'&&+st.opacity>0; });
    const paint=()=>{ if(!on) return; cx.fillStyle='#000'; cx.fillRect(0,0,comp.width,comp.height); for(const c of vis()){ const r=c.getBoundingClientRect(); try{ cx.drawImage(c,r.left/fw*comp.width,r.top/fh*comp.height,r.width/fw*comp.width,r.height/fh*comp.height); }catch(e){} } requestAnimationFrame(paint); }; paint();
    const bright=()=>{ try{ const D=cx.getImageData(0,0,comp.width,comp.height).data; let s=0, n=0; for(let k=0;k<D.length;k+=4*997){ s+=D[k]+D[k+1]+D[k+2]; n++; } return s/n; }catch(e){ return 0; } };
    let stream; try{ stream=comp.captureStream(30); }catch(e){ $('recM').textContent='This game can\'t be recorded. Try another one.'; on=false; return; }
    const chunks=[]; let mr=null, t=15; const B=$('recB');
    const begin=st=>{ mr=new MediaRecorder(st,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',videoBitsPerSecond:2500000}); mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      mr.onstop=()=>{ on=false; clearInterval(iv); const blob=new Blob(chunks,{type:'video/webm'}); if(blob.size<20000){ B.textContent='● Record'; B.onclick=record; $('recM').textContent='That recording came out empty. Play a bit first, or try another game.'; return; } clip=blob; clipURL=URL.createObjectURL(clip); $('gframe').src='about:blank'; editor(); }; mr.start(250); };
    setTimeout(()=>{ if(bright()<4){ try{ begin(cv.captureStream(30)); return; }catch(e){} } begin(stream); },400);
    B.textContent='■ Stop'; B.onclick=()=>{ if(mr&&mr.state==='recording') mr.stop(); };
    const iv=setInterval(()=>{ t--; $('recM').textContent=`Recording… ${t}s left`; if(t<=0&&mr&&mr.state==='recording') mr.stop(); },1000);
    $('recM').textContent='Recording… 15s left'; try{ $('gframe').contentWindow.focus(); }catch(e){} }
  /* ---------- step 2: edit ---------- */
  function editor(){ $('main').innerHTML=`<div class="ed"><div><canvas id="out" width="720" height="1280"></canvas><video id="src" src="${clipURL}" muted loop playsinline style="display:none"></video></div>
    <div><div class="card"><h3>2. Make it yours</h3><div class="row" style="flex-direction:column;align-items:stretch">
      <input id="cap" maxlength="60" placeholder="Caption (e.g. HOW DID THAT GO IN 😱)" value="${esc(S.cap)}">
      <div class="row"><select id="pos"><option value="top">Caption at top</option><option value="bottom">Caption at bottom</option></select><select id="sty"><option value="bold">Big bold</option><option value="neon">Neon</option><option value="meme">Meme</option></select></div>
      <div class="row"><select id="fx"><option value="none">No effect</option><option value="zoom">Slow zoom</option><option value="punch">Punch zoom</option><option value="shake">Shake</option></select><select id="beat"><option value="none">No music</option><option value="hype">🎵 Hype beat</option><option value="chill">🎵 Chill beat</option></select></div>
      <div class="note">Stickers: tap to add, drag on the video to move, double-tap to remove.</div><div class="stk">${STICKERS.map(s=>`<button data-s="${s}">${s}</button>`).join('')}</div></div></div>
      <div class="card"><h3>3. Share it</h3><input id="ttl" maxlength="40" placeholder="Title for the Remix feed" style="width:100%;margin-bottom:8px"><div class="row"><button class="btn" id="exp">📨 Post (owner approves first)</button><button class="btn g" id="dl">💾 Save to device</button><button class="btn g" id="redo">🔁 Record again</button></div><p class="note" id="em"></p></div></div></div>`;
    $('pos').value=S.pos; $('sty').value=S.style; $('fx').value=S.fx; $('beat').value=S.beat;
    for(const [id,k] of [['cap','cap'],['pos','pos'],['sty','style'],['fx','fx'],['beat','beat']]) $(id).oninput=$(id).onchange=e=>{ S[k]=e.target.value; };
    $('redo').onclick=()=>{ clip=null; S.stickers=[]; make(); };
    const v=$('src'); v.play().catch(()=>{}); const cv=$('out'), x=cv.getContext('2d'); let t0=performance.now();
    const loop=()=>{ draw(x,v,(performance.now()-t0)/1000); raf=requestAnimationFrame(loop); }; cancelAnimationFrame(raf); loop();
    let drag=null; const pt=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*720,(e.clientY-r.top)/r.height*1280]; };
    cv.onpointerdown=e=>{ const [px,py]=pt(e); drag=S.stickers.find(s=>Math.hypot(s.x-px,s.y-py)<70)||null; if(drag) cv.setPointerCapture(e.pointerId); };
    cv.onpointermove=e=>{ if(drag){ const [px,py]=pt(e); drag.x=px; drag.y=py; } }; cv.onpointerup=()=>drag=null;
    cv.ondblclick=e=>{ const [px,py]=pt(e); S.stickers=S.stickers.filter(s=>Math.hypot(s.x-px,s.y-py)>=70); };
    $('dl').onclick=()=>render(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='rival-remix.webm'; a.click(); });
    $('exp').onclick=()=>{ const ttl=$('ttl').value.trim()||S.cap||'My remix'; render(b=>upload(b,ttl)); }; }
  document.addEventListener('click',e=>{ const g=e.target.closest('[data-g]'); if(g){ $('recBox').style.display='block'; $('gframe').src=g.dataset.g; $('recB').onclick=record; $('recM').textContent='Loading the game…'; setTimeout(()=>$('recM').textContent='Play, then press ● Record.',2500); return; }
    const s=e.target.closest('[data-s]'); if(s){ S.stickers.push({e:s.dataset.s,x:200+Math.random()*320,y:500+Math.random()*300,r:(Math.random()-.5)*.5}); } });
  function draw(x,v,t){ x.setTransform(1,0,0,1,0,0); x.fillStyle='#000'; x.fillRect(0,0,720,1280);
    if(v.readyState>=2){ const vw=v.videoWidth, vh=v.videoHeight; let sc=Math.max(720/vw,1280/vh)*.62; /* show the game across the middle, with blurred fill behind */
      x.save(); x.filter='blur(24px) brightness(.5)'; const bs=Math.max(720/vw,1280/vh); x.drawImage(v,(720-vw*bs)/2,(1280-vh*bs)/2,vw*bs,vh*bs); x.restore();
      let z=1, dx=0, dy=0; if(S.fx==='zoom') z=1+((t%15)/15)*.35; if(S.fx==='punch') z=1+Math.max(0,Math.sin(t*2.2))*.18; if(S.fx==='shake'){ dx=Math.sin(t*41)*8; dy=Math.cos(t*37)*8; }
      sc=Math.min(720/vw,1280/vh)*z*1.0; const w=vw*sc, h=vh*sc; x.drawImage(v,(720-w)/2+dx,(1280-h)/2+dy,w,h); }
    if(S.cap){ const y=S.pos==='top'?200:1080; x.textAlign='center'; x.textBaseline='middle'; const words=S.cap.toUpperCase(); x.font=S.style==='meme'?'900 64px Impact, Arial Black, sans-serif':'900 62px system-ui, sans-serif';
      if(S.style==='neon'){ x.shadowColor='#f0abfc'; x.shadowBlur=30; x.fillStyle='#fff'; x.fillText(words,360,y,680); x.shadowBlur=0; }
      else { x.lineWidth=S.style==='meme'?10:12; x.strokeStyle='#000'; x.lineJoin='round'; x.strokeText(words,360,y,680); x.fillStyle=S.style==='meme'?'#fff':'#fde047'; x.fillText(words,360,y,680); } }
    x.font='96px system-ui'; x.textAlign='center'; x.textBaseline='middle'; x.fillStyle='#000';
    for(const s of S.stickers){ x.save(); x.translate(s.x,s.y); x.rotate(s.r+Math.sin(t*3+s.x)*.08); if(s.e==='GG'){ x.font='900 80px system-ui'; x.lineWidth=8; x.strokeStyle='#000'; x.strokeText('GG',0,0); x.fillStyle='#22c55e'; x.fillText('GG',0,0); } else x.fillText(s.e,0,0); x.restore(); }
    x.font='800 26px system-ui'; x.textAlign='right'; x.fillStyle='rgba(255,255,255,.75)'; x.fillText('🎞️ Rival Remix',700,1250); }
  /* the final Short: record the edited canvas (plus the beat) once through the clip */
  function render(done){ const cv=$('out'), v=$('src'); $('em').textContent='Making your video… (it plays through once)'; v.currentTime=0; v.loop=false; v.play().catch(()=>{});
    const vs=cv.captureStream(30); let ac=null; if(S.beat!=='none'){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); const dst=ac.createMediaStreamDestination(); beat(ac,dst,S.beat,(v.duration&&isFinite(v.duration)?v.duration:15)); dst.stream.getAudioTracks().forEach(t=>vs.addTrack(t)); }catch(e){} }
    const chunks=[], mr=new MediaRecorder(vs,{mimeType:'video/webm',videoBitsPerSecond:3000000}); mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    mr.onstop=()=>{ v.loop=true; v.play().catch(()=>{}); if(ac) ac.close(); const b=new Blob(chunks,{type:'video/webm'}); $('em').textContent=`Ready! (${(b.size/1e6).toFixed(1)} MB)`; done(b); };
    v.onended=()=>{ if(mr.state==='recording') mr.stop(); v.onended=null; }; mr.start(250); setTimeout(()=>{ if(mr.state==='recording') mr.stop(); },16500); }
  function beat(ac,dst,kind,dur){ const bpm=kind==='hype'?128:84, spb=60/bpm, t0=ac.currentTime+.05, g=ac.createGain(); g.gain.value=.35; g.connect(dst);
    for(let i=0;i*spb<dur;i++){ const t=t0+i*spb; const o=ac.createOscillator(), e=ac.createGain(); o.frequency.setValueAtTime(kind==='hype'?120:90,t); o.frequency.exponentialRampToValueAtTime(40,t+.15); e.gain.setValueAtTime(1,t); e.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(e).connect(g); o.start(t); o.stop(t+.22);
      if(i%2===1){ const n=ac.createBufferSource(), b=ac.createBuffer(1,ac.sampleRate*.08,ac.sampleRate), d=b.getChannelData(0); for(let k=0;k<d.length;k++) d[k]=(Math.random()*2-1)*(1-k/d.length); n.buffer=b; const ng=ac.createGain(); ng.gain.value=kind==='hype'?.5:.25; n.connect(ng).connect(g); n.start(t); }
      if(i%4===0){ const m=ac.createOscillator(), me=ac.createGain(); m.type='triangle'; m.frequency.value=[262,330,392,294][(i/4)%4|0]*(kind==='hype'?1:.75); me.gain.setValueAtTime(.18,t); me.gain.exponentialRampToValueAtTime(.001,t+spb*3.5); m.connect(me).connect(g); m.start(t); m.stop(t+spb*3.6); } } }
  function upload(b,ttl){ if(b.size>19e6){ $('em').textContent='That video is too big. Record a shorter clip.'; return; } $('em').textContent='Uploading…';
    const x=new XMLHttpRequest(); x.open('POST',SRV+'/feed/upload'); x.setRequestHeader('content-type','video/webm'); x.setRequestHeader('x-pid',pid()); x.setRequestHeader('x-name',encodeURIComponent(name())); x.setRequestHeader('x-cap',encodeURIComponent(REMIX+ttl.slice(0,60)));
    x.upload.onprogress=e=>{ if(e.lengthComputable) $('em').textContent=`Uploading… ${Math.round(100*e.loaded/e.total)}%`; };
    x.onload=()=>{ let r={}; try{ r=JSON.parse(x.responseText); }catch(e){} $('em').textContent=r.ok?(r.st==='pending'?'📨 Sent! It shows in the Remix feed after the owner approves it.':'✅ Posted!'):({words:'Please pick a friendlier title.',slow:'You can post up to 5 videos an hour.',banned:'Posting is turned off for you.',off:'Posting is turned off right now.',big:'That video is too big.'}[r.err]||'Could not upload. Try again.'); };
    x.onerror=()=>{ $('em').textContent='Could not upload. Check your internet and try again.'; }; x.send(b); }
  /* ---------- feed ---------- */
  async function feed(){ cancelAnimationFrame(raf); const d=await post('/feed/list',{}); if(!d){ $('main').innerHTML='<p class="note">Could not load remixes.</p>'; return; }
    const hide=new Set(d.hide||[]), mine=new Set(d.mine||[]); const L=(d.posts||[]).filter(p=>p.kind==='video'&&String(p.cap||'').startsWith(REMIX)&&!hide.has(p.id));
    const week=L.filter(p=>Date.now()-p.ts<7*864e5).sort((a,b)=>(d.likes[b.id]||0)-(d.likes[a.id]||0))[0];
    const tile=(p,best)=>`<div class="fi${best?' best':''}"><video src="${SRV}/feed/media/${p.id.slice(2)}" muted loop playsinline preload="metadata" onmouseenter="this.play()" onmouseleave="this.pause()" onclick="this.muted=!this.muted;this.play()"></video><div><b title="${esc(p.cap)}">${best?'🏆 ':''}${esc(String(p.cap).slice(REMIX.length))}</b><button class="btn g" data-like="${p.id}" style="padding:6px 10px">${mine.has(p.id)?'❤️':'🤍'} ${d.likes[p.id]||0}</button></div><div class="note" style="padding-top:0">by ${esc(p.name)}</div></div>`;
    $('main').innerHTML=(week&&(d.likes[week.id]||0)>0?`<div class="card"><h3>🏆 Remix of the week</h3><div class="feed">${tile(week,true)}</div></div>`:'')+`<div class="card"><h3>🔥 Latest remixes</h3>${L.length?`<div class="feed">${L.map(p=>tile(p,false)).join('')}</div>`:'<p class="note">No remixes yet. Make the first one in 🎬 Make!</p>'}${d.pend?`<p class="note">You have ${d.pend} video${d.pend>1?'s':''} waiting for approval.</p>`:''}</div>`; }
  document.addEventListener('click',async e=>{ const l=e.target.closest('[data-like]'); if(l){ const on=!l.textContent.includes('❤️'); await post('/feed/like',{id:l.dataset.like,on}); feed(); } });
  document.querySelector('.tabs').onclick=e=>{ const b=e.target.closest('[data-t]'); if(!b) return; tab=b.dataset.t; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); tab==='feed'?feed():make(); };
  make();
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
