<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Esports</title>
<style>
:root{--bg:#05060c;--p1:#0e1020;--p2:#171a33;--line:#252a4d;--tx:#eef0ff;--mut:#9aa0c8;--acc:linear-gradient(135deg,#6366f1,#ec4899);--gold:#facc15}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui}
#hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:1200px;margin:0 auto}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal}
#hd .sp{flex:1}
.tabs{display:flex;gap:6px}.tabs button{border:0;background:none;color:var(--mut);font:700 14px system-ui;padding:8px 12px;border-radius:10px}.tabs button.on{background:var(--p2);color:var(--tx)}
main{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.card h3{margin:0 0 10px;font:800 17px system-ui}
.btn{border:0;border-radius:12px;padding:11px 16px;font:900 15px system-ui;background:var(--acc);color:#fff}.btn.g{background:var(--p2);color:var(--tx)}.btn.w{background:#16a34a}.btn.l{background:#dc2626}
.note{color:var(--mut);font-size:14px}
.me{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.me .rk{font-size:46px}.me b{font:900 24px system-ui;display:block}.me .st{display:flex;gap:16px}.me .st div{text-align:center}.me .st b{font-size:20px}
.cups{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cup{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cup .t{display:flex;align-items:center;gap:10px}.cup .t span{font-size:30px}.cup .t b{font:900 17px system-ui;display:block}.cup .t small{color:var(--mut)}
.pill{display:inline-block;font:800 12px system-ui;border-radius:999px;padding:3px 10px}.p-open{background:#22c55e22;color:#86efac}.p-live{background:#ef444433;color:#fca5a5}.p-done{background:#facc1522;color:#fde68a}.p-cancelled{background:#64748b33;color:#cbd5e1}
.brk{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}.col{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:190px}.col h4{margin:0 0 4px;font:800 13px system-ui;color:var(--mut);text-align:center}
.m{background:var(--p2);border:1px solid var(--line);border-radius:10px;overflow:hidden}.m.mine{border-color:#ec4899;box-shadow:0 0 0 2px #ec489955}
.m div{display:flex;justify-content:space-between;padding:7px 10px;font-size:14px}.m div+div{border-top:1px solid var(--line)}.m .w{font-weight:900;color:#86efac}.m .lo{opacity:.5}
.mym{border:2px solid #ec4899;background:linear-gradient(135deg,#2a1240,#0e1020)}
.mym .vs{font:900 22px system-ui;margin:6px 0 10px}.mym .code{font:900 20px ui-monospace,monospace;letter-spacing:.15em;background:var(--p2);border-radius:10px;padding:6px 12px;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);text-align:left;font-size:12px;padding:6px}td{padding:8px 6px;border-top:1px solid var(--line)}td.n{text-align:right}
#msgs{height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:14px}#msgs b{color:#fbbf24;margin-right:6px}
#say{display:flex;gap:8px;margin-top:8px}#say input{flex:1;min-width:0;border:1px solid var(--line);background:#080a16;color:var(--tx);border-radius:10px;padding:10px 12px}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
@media(max-width:700px){.tabs{order:3;width:100%}}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a class="bk" href="./" title="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><a id="logo" href="esports"><i>🏆</i>Rival Esports</a><span class="sp"></span>
  <nav class="tabs"><button data-t="cups" class="on">🗓️ Cups</button><button data-t="lb">📊 Rankings</button><button data-t="hof">🏛️ Hall of Fame</button></nav></header>
<main id="main"><p class="note">Loading…</p></main>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SRV=(()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })();
  const pid=()=>{ try{ let p=localStorage.getItem('rrPid'); if(!p||p.length<8){ p=Math.random().toString(36).slice(2,14); localStorage.setItem('rrPid',p); } return p; }catch(e){ return ''; } };
  const name=()=>{ try{ return localStorage.getItem('rrOnlineName')||'Player'; }catch(e){ return 'Player'; } };
  const get=u=>fetch(SRV+u).then(r=>r.json()).catch(()=>null), post=(u,b)=>fetch(SRV+u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({pid:pid(),name:name()},b||{}))}).then(r=>r.json()).catch(()=>({err:'net'}));
  let tab='cups', cupId=new URLSearchParams(location.search).get('c')||'', timer=null;
  const when=t=>{ const d=new Date(t), today=new Date().toDateString()===d.toDateString(); return (today?'Today':d.toLocaleDateString([],{weekday:'short'}))+' '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); };
  const left=ms=>{ ms=Math.max(0,ms); const h=Math.floor(ms/3600000), m=Math.ceil(ms%3600000/60000); return h?`${h}h ${m}m`:`${m}m`; };
  const ST={open:['Sign-ups open','p-open'],live:['LIVE','p-live'],done:['Finished','p-done'],cancelled:['Not enough players','p-cancelled']};
  async function cups(){ const d=await get('/es/list?pid='+encodeURIComponent(pid())); if(!d){ $('main').innerHTML='<p class="note">Could not reach the esports server.</p>'; return; } const me=d.me;
    $('main').innerHTML=`<div class="card me"><span class="rk">${me.rank[1]}</span><div><b>${me.rank[0]}</b><span class="note">${esc(name())} · Season ${esc(d.season)}</span></div><div class="st" style="margin-left:auto"><div><b>${me.pts}</b><div class="note">points</div></div><div><b>${me.w}–${me.l}</b><div class="note">record</div></div><div><b>${me.cups}</b><div class="note">cups won</div></div></div></div>
      <p class="note">Two cups every day (4:00 PM and 7:30 PM Eastern). Join before it starts. When the bracket begins, open your match: you and your opponent play in the same game room, then both tap who won. Win = +25 points, cup champion = +100 and a place in the Hall of Fame.</p>
      <div class="cups">${d.cups.map(c=>`<div class="cup"><div class="t"><span>${c.icon}</span><div><b>${esc(c.name)}</b><small>${when(c.at)}${c.st==='open'?` · starts in ${left(c.at-d.now)}`:''}</small></div></div>
        <div><span class="pill ${ST[c.st][1]}">${ST[c.st][0]}</span> <span class="note">${c.n}/${c.max} players${c.champ?` · 🏆 ${esc(c.champ)}`:''}</span></div>
        <div class="row">${c.st==='open'?(c.in?`<button class="btn g" data-leave="${c.id}">✓ You're in · leave</button>`:`<button class="btn" data-join="${c.id}">Join cup</button>`):''}<button class="btn g" data-open="${c.id}">${c.st==='live'?'📺 Watch bracket':'View'}</button></div></div>`).join('')||'<p class="note">No cups right now.</p>'}</div>`;
    clearTimeout(timer); timer=setTimeout(()=>{ if(tab==='cups'&&!cupId) cups(); },30000); }
  async function cup(){ const d=await get('/es/cup?id='+encodeURIComponent(cupId)+'&pid='+encodeURIComponent(pid())); if(!d||d.err){ $('main').innerHTML='<p class="note">Cup not found.</p>'; return; }
    const R=d.rounds||[], last=R[R.length-1]||[], my=last.find(m=>m.mine&&m.win===undefined);
    const rn=(i,n)=>n-i===1?'Final':n-i===2?'Semifinals':n-i===3?'Quarterfinals':'Round '+(i+1);
    const total=R.length?Math.log2(R[0].length*2):0;
    let h=`<div class="row" style="margin-bottom:12px"><button class="btn g" id="backC">← All cups</button><h2 style="margin:0;font:900 22px system-ui">${d.icon} ${esc(d.name)}</h2><span class="pill ${ST[d.st][1]}">${ST[d.st][0]}</span></div>`;
    if(d.st==='done'&&d.champ) h+=`<div class="card" style="text-align:center;background:linear-gradient(135deg,#713f12,#facc15 50%,#713f12);color:#1c1917;font:900 22px system-ui">🏆 ${esc(d.champ)} won the ${esc(d.name)}!</div>`;
    if(my){ const opp=my.a&&my.a.me?my.b:my.a; h+=`<div class="card mym"><h3>⚔️ Your match</h3><div class="vs">You vs ${esc(opp?opp.name:'?')}</div>
      <div class="row"><span class="note">Room code</span><span class="code">${esc(my.room)}</span><a class="btn" id="playM" href="${d.game}?room=${encodeURIComponent(my.room)}" target="_blank">▶ Play match in ${esc(d.gname)}</a></div>
      <p class="note">Play the match, then come back and tap the result. ${my.myRep?`You said you <b>${my.myRep==='w'?'won':'lost'}</b>. Waiting for ${esc(opp.name)}… (if they don't answer in 15 minutes, your result counts)`:''}${my.replays?` · Replay #${my.replays}: you both said you won, so play again in the new room.`:''}</p>
      ${my.myRep?'':`<div class="row"><button class="btn w" data-rep="w">🏆 I won</button><button class="btn l" data-rep="l">I lost</button></div>`}</div>`; }
    else if(d.st==='open') h+=`<div class="card"><p class="note">Starts ${when(d.at)} (in ${left(d.at-d.now)}). ${d.n} player${d.n===1?'':'s'} signed up: ${d.players.map(p=>esc(p.name)).join(', ')||'nobody yet'}.</p></div>`;
    if(R.length) h+=`<div class="card"><h3>🗂️ Bracket</h3><div class="brk">${R.map((col,i)=>`<div class="col"><h4>${rn(i,total)}</h4>${col.map(m=>`<div class="m${m.mine?' mine':''}"><div class="${m.win==='a'?'w':m.win==='b'?'lo':''}"><span>${m.a?esc(m.a.name):'—'}</span><span>${m.win==='a'?'✓':''}</span></div><div class="${m.win==='b'?'w':m.win==='a'?'lo':''}"><span>${m.b?esc(m.b.name):(m.bye?'bye':'—')}</span><span>${m.win==='b'?'✓':''}</span></div></div>`).join('')}</div>`).join('')}</div></div>`;
    h+=`<div class="card"><h3>💬 Cup chat</h3><div id="msgs"><div class="note">Cheer on the players!</div></div><form id="say" autocomplete="off"><input id="sayI" maxlength="200" placeholder="Say something…"><button class="btn">Send</button></form></div>`;
    $('main').innerHTML=h; $('backC').onclick=()=>{ cupId=''; history.pushState(null,'','esports'); cups(); };
    const pm=$('playM'); if(pm) pm.onclick=()=>post('/es/check',{id:cupId});
    chatJoin(); $('say').onsubmit=e=>{ e.preventDefault(); const t=$('sayI').value.trim(); if(t&&window.RRC&&RRC.ready){ RRC.tvSay(t); $('sayI').value=''; } };
    clearTimeout(timer); timer=setTimeout(()=>{ if(cupId) cup(); },d.st==='live'?8000:30000); }
  /* cup chat: the site chat's room feature (same filters) */
  const seen=new Set(); let room='';
  function chatJoin(){ room='tvq'+cupId.slice(-10); seen.clear(); if(window.RRC&&RRC.ready) RRC.tvJoin(room); }
  setInterval(()=>{ if(cupId&&window.RRC&&RRC.ready&&RRC._tv!==room) RRC.tvJoin(room); },3000);
  addEventListener('rrc-tv',e=>{ const m=e.detail; if(m.room!==room||!$('msgs')) return; const add=x=>{ if(seen.has(x.id)) return; seen.add(x.id); const d=document.createElement('div'); d.innerHTML=`<b>${esc(x.name)}</b>${esc(x.text)}`; $('msgs').appendChild(d); $('msgs').scrollTop=1e9; }; if(m.t==='tvhist') (m.list||[]).forEach(add); else if(m.m) add(m.m); });
  async function lb(){ const d=await get('/es/lb'); if(!d) return; $('main').innerHTML=`<div class="card"><h3>📊 Season ${esc(d.season)} rankings</h3>${d.lb.length?`<table><tr><th>#</th><th>Player</th><th>Rank</th><th class="n">Points</th><th class="n">W–L</th><th class="n">Cups</th></tr>${d.lb.map((r,i)=>`<tr${r.name===name()?' style="background:#ec489918"':''}><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${r.rank[1]} ${r.rank[0]}</td><td class="n">${r.pts}</td><td class="n">${r.w}–${r.l}</td><td class="n">${r.cups}</td></tr>`).join('')}</table>`:'<p class="note">No matches played this season yet.</p>'}<p class="note">Ranks: 🥉 Bronze · 🥈 Silver 100 · 🥇 Gold 250 · 🔷 Platinum 450 · 💎 Diamond 700 · 👑 Legend 1000. Points reset each month.</p></div>`; }
  async function hof(){ const d=await get('/es/lb'); if(!d) return; $('main').innerHTML=`<div class="card"><h3>🏛️ Hall of Fame</h3>${d.hof.length?d.hof.map(x=>`<div style="padding:8px 0;border-top:1px solid var(--line)">🏆 <b>${esc(x.name)}</b> won the ${x.icon} ${esc(x.cup)} <span class="note">· ${new Date(x.at).toLocaleDateString()}</span></div>`).join(''):'<p class="note">No champions yet. The first cup winner goes here!</p>'}</div>`; }
  document.addEventListener('click',async e=>{ const t=e.target.closest('[data-t]'); if(t){ tab=t.dataset.t; cupId=''; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===t)); history.replaceState(null,'','esports'); ({cups,lb,hof})[tab](); return; }
    const j=e.target.closest('[data-join]'); if(j){ const r=await post('/es/join',{id:j.dataset.join}); if(r.err) alert(r.err==='full'?'That cup is full.':'Sign-ups are closed.'); cups(); return; }
    const l=e.target.closest('[data-leave]'); if(l){ await post('/es/leave',{id:l.dataset.leave}); cups(); return; }
    const o=e.target.closest('[data-open]'); if(o){ cupId=o.dataset.open; history.pushState(null,'','esports?c='+cupId); cup(); return; }
    const r=e.target.closest('[data-rep]'); if(r){ if(!confirm(r.dataset.rep==='w'?'Did you WIN the match?':'Did you LOSE the match?')) return; const x=await post('/es/report',{id:cupId,res:r.dataset.rep}); if(x.err) alert('Could not save the result.'); cup(); } });
  addEventListener('popstate',()=>{ cupId=new URLSearchParams(location.search).get('c')||''; cupId?cup():cups(); });
  cupId?cup():cups();
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
