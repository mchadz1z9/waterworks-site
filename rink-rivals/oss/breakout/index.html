<!DOCTYPE html> 
<html>
<head><script id="rrNoTrack">window.ga=window.ga||function(){};window.gtag=window.gtag||function(){};window.dataLayer=window.dataLayer||[];</script>
  <title>Javascript Breakout</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <meta name="viewport" content="width=device-width", initial-scale=1.0, user-scalable="no"/>
  <link href="breakout.css" media="screen, print" rel="stylesheet" type="text/css" /> 
</head> 
 
<body><div id="rrOss" style="position:fixed;left:8px;top:8px;z-index:2147483000;display:flex;gap:6px;align-items:center;font:600 12px system-ui,sans-serif"><a href="/" style="background:rgba(15,23,42,.88);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;text-decoration:none">← Arcade</a><a href="https://github.com/jakesgordon/javascript-breakout" target="_blank" rel="noopener" style="background:rgba(15,23,42,.7);color:#cbd5e1;border-radius:999px;padding:6px 10px;text-decoration:none">Breakout by Jake Gordon · MIT</a></div> 


  <div id="breakout">
    <canvas id="canvas">
      <div class='unsupported'>
        Sorry, this example cannot be run because your browser does not support the &lt;canvas&gt; element
      </div>
    </canvas>
    <div id="levels">
      <img id="next" class="disabled" src="images/up.png"   title="next level">
      <img id="prev" class="disabled" src="images/down.png" title="previous level">
      <span id="label">level:</span><span id="level"></span>
    </div>
    <div id="controls">
      <input id='sound' type='checkbox' />
      <label for='sound'>sound</label>
    </div>
    <div id="instructions" style='display:none;'>
      <div class='keyboard'>
        <b>space</b> to start<br>
        <b>left/right</b> to move paddle<br>
        <b>up/down</b> to change level
      </div>
      <div class='touch'>
        <b>touch here</b> to start<br>
        <b>drag</b> paddle to move<br>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="breakout.js"></script>
  <script src="levels.js"></script>
  <script>
  Game.ready(function() {
    var game = Game.start('canvas', Breakout);
  });
  </script>

</body> 
</html>
