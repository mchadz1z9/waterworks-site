<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rink Rivals AI — Arcade Rivals</title>
<meta name="description" content="Rink Rivals AI: ask anything, send a photo of a question and get the answer, make pictures, get homework help, game tips, stories and quizzes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
:root{--bg:#060914;--pan:rgba(13,19,36,.82);--line:rgba(148,163,184,.16);--ink:#e2e8f0;--mut:#94a3b8;--a1:var(--v1,#4f46e5);--a2:var(--v2,#0ea5e9)}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;height:100%;overflow:hidden}
.glow{position:fixed;border-radius:50%;filter:blur(100px);opacity:.38;z-index:-1;pointer-events:none;animation:drift 24s ease-in-out infinite alternate}
.glow.a{width:46vw;height:46vw;left:-12vw;top:-16vw;background:var(--a1)}.glow.b{width:40vw;height:40vw;right:-10vw;bottom:-10vh;background:var(--a2);animation-duration:29s}
@keyframes drift{to{transform:translate(6vw,8vh) scale(1.15)}}
/* sidebar: saved chats */
aside{width:262px;flex:none;display:flex;flex-direction:column;background:var(--pan);border-right:1px solid var(--line);backdrop-filter:blur(14px)}
aside .top{padding:14px;display:flex;flex-direction:column;gap:10px}
aside a.home{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px}
#newChat{border:0;border-radius:12px;padding:11px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--a1),var(--a2))}
#chats{flex:1;overflow-y:auto;padding:0 8px 12px}
.ch{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer;color:#cbd5e1;font-size:14px}
.ch:hover{background:rgba(148,163,184,.1)}.ch.on{background:rgba(99,102,241,.22);color:#fff}
.ch .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch .d{opacity:0;border:0;background:none;color:var(--mut);cursor:pointer}.ch:hover .d{opacity:1}
.side-h{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mut);padding:6px 10px}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:rgba(6,9,20,.8);backdrop-filter:blur(6px)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(6,9,20,.55);backdrop-filter:blur(10px);flex-wrap:wrap}
#menu{display:none;border:0;background:none;color:#fff;font-size:22px;cursor:pointer}
h1{margin:0;font:900 28px 'Big Shoulders Display',sans-serif;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.modes button{flex:none;border:1px solid var(--line);background:rgba(15,23,42,.7);color:#cbd5e1;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
.modes button.on{background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
#log{flex:1;overflow-y:auto;padding:22px 16px}
.inner{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:flex-start}.row:last-child{animation:pop .25s ease-out}.row.u{flex-direction:row-reverse}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,var(--a1),var(--a2))}
.row.u .av{background:#334155}
.m{max-width:min(720px,86%);padding:11px 15px;border-radius:18px;line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere}
.row.u .m{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-top-right-radius:6px;white-space:pre-wrap}
.row.a .m{background:rgba(22,30,52,.88);border:1px solid var(--line);border-top-left-radius:6px}
.m img{display:block;max-width:100%;max-height:340px;border-radius:12px;margin:4px 0}
.m h2,.m h3,.m h4{margin:.6em 0 .3em;line-height:1.25}.m h2{font-size:1.25em}.m h3{font-size:1.1em}
.m p{margin:.4em 0}.m ul,.m ol{margin:.4em 0;padding-left:1.4em}.m li{margin:.15em 0}
.m code{background:rgba(148,163,184,.18);padding:1px 6px;border-radius:6px;font-size:.92em}
.m pre{position:relative;background:#0b1020;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;margin:.5em 0}
.m pre code{background:none;padding:0;font-size:13px;white-space:pre}
.m pre .cp{position:absolute;top:6px;right:6px;border:0;border-radius:8px;background:#1e293b;color:#cbd5e1;font-size:12px;padding:3px 8px;cursor:pointer}
.m a{color:#93c5fd}.m table{border-collapse:collapse}.m td,.m th{border:1px solid var(--line);padding:4px 8px}
.srcs{margin-top:8px;font-size:13.5px;color:#94a3b8;display:flex;flex-wrap:wrap;gap:6px}.srcs a{color:#93c5fd;background:rgba(59,130,246,.12);border-radius:8px;padding:3px 8px;text-decoration:none;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#webT.on{background:linear-gradient(90deg,#0ea5e9,#22c55e)!important;color:#fff!important;border-color:transparent!important}
.acts{display:flex;gap:4px;margin-top:6px}.acts button{border:0;background:rgba(148,163,184,.12);color:#cbd5e1;border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}.acts button:hover{background:rgba(148,163,184,.25)}
.cur::after{content:'▍';animation:bl 1s steps(1) infinite;color:#93c5fd}@keyframes bl{50%{opacity:0}}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:#94a3b8;animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.5}}
.hello{text-align:center;margin:6vh auto 0;max-width:640px;color:#cbd5e1}
.hello .big{font-size:60px;filter:drop-shadow(0 8px 30px rgba(99,102,241,.6))}.hello h2{font:900 38px 'Big Shoulders Display',sans-serif;margin:6px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:18px;text-align:left}
.cards button{border:1px solid var(--line);background:rgba(15,23,42,.7);color:#e2e8f0;border-radius:14px;padding:12px;cursor:pointer;font-size:14px;line-height:1.35}
.cards button b{display:block;margin-bottom:3px}.cards button:hover{border-color:#60a5fa;transform:translateY(-1px)}
footer{padding:10px 16px 14px}
.fw{max-width:860px;margin:0 auto}
#styles{display:none;gap:6px;margin-bottom:8px;flex-wrap:wrap}
#styles button{border:1px solid var(--line);background:rgba(15,23,42,.8);color:#cbd5e1;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}#styles button.on{border-color:#a78bfa;color:#fff;background:rgba(124,58,237,.3)}
#prev{display:none;align-items:center;gap:10px;margin-bottom:8px;padding:6px;background:var(--pan);border-radius:12px;border:1px solid var(--line);width:max-content}
#prev img{height:60px;border-radius:8px}#prev button{border:0;background:#334155;color:#fff;border-radius:8px;padding:5px 9px;cursor:pointer}
.bar{display:flex;gap:8px;align-items:flex-end;background:rgba(15,23,42,.92);border:1px solid rgba(148,163,184,.25);border-radius:20px;padding:8px}
.bar:focus-within{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.2)}
#q{flex:1;border:0;outline:0;background:none;color:#f8fafc;font:16px system-ui,sans-serif;resize:none;max-height:180px;padding:8px 6px}
.ib{border:0;background:#1e293b;color:#e2e8f0;width:42px;height:42px;border-radius:14px;font-size:19px;cursor:pointer;flex:none}
.ib.rec{background:#dc2626;animation:pl 1s infinite}@keyframes pl{50%{box-shadow:0 0 0 6px rgba(220,38,38,.3)}}
#send{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.note{font-size:12px;color:#64748b;text-align:center;margin-top:7px}
@media(max-width:820px){aside{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}#menu{display:block}h1{font-size:22px}.m{max-width:92%}}

/* bigger: larger text, wider conversation, roomier input */
body{font-size:17px}
.inner,.fw{max-width:1080px!important}
.m{font-size:17.5px;line-height:1.65;padding:14px 19px;max-width:min(900px,88%)!important}
.av{width:42px;height:42px;font-size:22px;border-radius:14px}
h1{font-size:34px!important}
.modes button{font-size:15px;padding:8px 15px}
#q{font-size:18px;padding:11px 8px}
.ib{width:50px;height:50px;font-size:22px;border-radius:16px}
.bar{padding:10px;border-radius:24px}
.hello .big{font-size:84px}.hello h2{font-size:50px}.hello>div{font-size:18px}
.cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))!important;gap:12px}.cards button{font-size:16px;padding:16px}
.m img{max-height:520px}.row.a .m img{max-height:640px}
.acts button{font-size:13.5px;padding:5px 10px}
aside{width:290px}.ch{font-size:15px;padding:11px 12px}
#styles button{font-size:14.5px;padding:7px 13px}

/* keep the site's floating chat/keys buttons clear of the send button */
@media(min-width:821px){footer{padding-right:150px!important}}
</style></head><body>
<div class="glow a"></div><div class="glow b"></div>
<aside id="side"><div class="top"><a class="home" href="./">← Arcade Rivals</a><button id="newChat">＋ New chat</button></div><div class="side-h">YOUR CHATS</div><div id="chats"></div></aside>
<main>
<header><button id="menu" title="Chats">☰</button><h1>🤖 Rink Rivals AI</h1><div class="modes" id="modes"></div><button id="webT" title="Let the AI search the web for up-to-date answers (with sources)" style="flex:none;border:1px solid rgba(148,163,184,.25);background:rgba(15,23,42,.7);color:#cbd5e1;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;cursor:pointer">🌐 Web: off</button></header>
<div id="log"><div class="inner" id="inner"></div></div>
<footer><div class="fw">
  <div id="styles"></div>
  <div id="prev"><img id="pimg" alt=""><span style="font-size:13px;color:#cbd5e1">Photo attached</span><button id="prm">✕</button></div>
  <div class="bar"><button class="ib" id="cam" title="Send a photo">📷</button><input type="file" id="file" accept="image/*" hidden><button class="ib" id="mic" title="Talk instead of typing">🎤</button>
    <textarea id="q" rows="1" placeholder="Ask anything, or send a photo of a question…"></textarea><button class="ib" id="send" title="Send">➤</button></div>
  <div class="note">Rink Rivals AI can make mistakes — double-check important answers. Don't share personal info. Paste a screenshot with Ctrl+V.</div></div></footer>
</main>
<script>
(()=>{
const qs=new URLSearchParams(location.search);
const SERVER=()=>(qs.get('server')||((()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })())).replace(/^ws/,'http');
const $=id=>document.getElementById(id), inner=$('inner'), log=$('log'), q=$('q');
const MODES=[['chat','✨ Chat'],['homework','📚 Homework'],['coach','🎮 Game coach'],['story','✍️ Stories'],['code','💻 Code'],['quiz','❓ Quiz me'],['eli10','🧒 Explain simply'],['image','🎨 Make a picture']];
const STY=[['','✨ Any'],['photorealistic, detailed','📷 Realistic'],['cartoon style, bold outlines','🖍️ Cartoon'],['pixel art, 16-bit','👾 Pixel art'],['anime style','🌸 Anime'],['3D render, soft lighting','🧊 3D'],['watercolor painting','🎨 Watercolor'],['blocky voxel style','🧱 Blocky']];
const START={chat:[['🌋 How volcanoes work','Explain how volcanoes work'],['🏒 Hockey trivia','Give me 3 fun hockey facts'],['🚀 Space','What would happen if you fell into a black hole?'],['🎲 Would you rather','Ask me a fun would-you-rather question']],
 homework:[['➗ Fractions','How do I add 2/3 + 3/4?'],['🧪 Photosynthesis','Explain photosynthesis step by step'],['📸 Photo of a question','(Tap 📷 and send a photo of your homework)'],['✏️ Essay help','Help me plan a paragraph about my favourite sport']],
 coach:[['🎯 Aim better','How do I get better aim in shooter games?'],['🏗️ Building','Give me tips for building fast in Storm Royale'],['🏎️ Racing lines','How do I take corners faster in racing games?'],['⛏️ Survival','What should I do on my first night in a block survival game?']],
 story:[['🐉 Dragon story','Write a short story about a dragon who loves pizza'],['🏒 Hockey hero','Write a story about a kid who scores the winning goal'],['👻 Spooky (not scary)','Write a funny ghost story'],['📝 Poem','Write a poem about snow days']],
 code:[['🌐 First webpage','Show me how to make a simple webpage with a button'],['🐍 Python game','Write a tiny Python guessing game'],['🎮 JavaScript','Make a bouncing ball in JavaScript canvas'],['🐞 Fix my code','Help me find the bug in my code (paste it next)']],
 quiz:[['🧠 General','Quiz me on general knowledge'],['🌍 Geography','Quiz me on world capitals'],['🔢 Maths','Quiz me on times tables'],['🏟️ Sports','Quiz me on sports']],
 eli10:[['⚡ Electricity','How does electricity work?'],['🧬 DNA','What is DNA?'],['💰 Money','Why do things cost money?'],['🌈 Rainbows','Why do rainbows happen?']],
 image:[['🐧 Hockey penguin','A penguin playing hockey on a frozen lake'],['🏙️ Neon city','A neon race car in a futuristic city at night'],['🍕 Pizza dragon','A cute dragon eating pizza'],['🏰 Candy castle','A castle made of candy and clouds']]};
const ls={get:(k,d)=>{ try{ return JSON.parse(localStorage.getItem(k)||'null')??d; }catch(e){ return d; } },set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ /* full: drop old chats */ const c=ls.get('rrAIChats',[]); if(c.length>3){ c.splice(-3); try{ localStorage.setItem(k,JSON.stringify(v)); }catch(x){} } } }};
let webOn=!!ls.get('rrAIWeb',false); const webBtn=()=>{ const b=$('webT'); b.classList.toggle('on',webOn); b.textContent='🌐 Web: '+(webOn?'on':'off'); }; $('webT').onclick=()=>{ webOn=!webOn; ls.set('rrAIWeb',webOn); webBtn(); };
let chats=ls.get('rrAIChats',[]), cur=null, mode=ls.get('rrAIMode','chat'), sty='', img=null, busy=false, ctrl=null;
const trimM=x=>{ const y={role:x.role,content:x.content}; if(x.src) y.src=x.src; if(x.hadImg) y.hadImg=1; if(x.err) y.err=1; if(x.pic) y.pic=x.pic.length<400000?x.pic:''; return y; };
const save=()=>{ chats=chats.slice(0,40); ls.set('rrAIChats',chats.map(c=>({id:c.id,title:c.title,mode:c.mode,msgs:c.msgs.map(trimM)}))); };
/* ---- markdown: bold, italic, headings, lists, links, code ---- */
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inl(t){ return t.replace(/`([^`]+)`/g,(m,a)=>'<code>'+a+'</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>'); }
function md(src){ const parts=String(src).split(/```/); let out='';
  parts.forEach((p,i)=>{ if(i%2){ const nl=p.indexOf('\n'), lang=nl>0?p.slice(0,nl).trim():'', code=nl>0?p.slice(nl+1):p; out+=`<pre><button class="cp">Copy</button><code>${esc(code.replace(/\n$/,''))}</code></pre>`; return; }
    const lines=esc(p).split('\n'); let list=null;
    const close=()=>{ if(list){ out+='</'+list+'>'; list=null; } };
    for(const L of lines){ let m;
      if(m=L.match(/^\s*#{1,4}\s+(.*)/)){ close(); out+='<h3>'+inl(m[1])+'</h3>'; }
      else if(m=L.match(/^\s*[-*•]\s+(.*)/)){ if(list!=='ul'){ close(); out+='<ul>'; list='ul'; } out+='<li>'+inl(m[1])+'</li>'; }
      else if(m=L.match(/^\s*\d+[.)]\s+(.*)/)){ if(list!=='ol'){ close(); out+='<ol>'; list='ol'; } out+='<li>'+inl(m[1])+'</li>'; }
      else if(!L.trim()){ close(); }
      else { close(); out+='<p>'+inl(L)+'</p>'; } }
    close(); });
  return out; }
/* ---- UI ---- */
$('modes').innerHTML=MODES.map(([k,l])=>`<button data-m="${k}">${l}</button>`).join('');
$('styles').innerHTML=STY.map(([v,l],i)=>`<button data-s="${i}" class="${i?'':'on'}">${l}</button>`).join('')+'<span style="width:10px"></span>'+[['hd','💎 HD'],['fast','⚡ Fast']].map(([k,l])=>`<button data-qq="${k}" class="${k==='hd'?'on':''}">${l}</button>`).join('')+'<span style="width:10px"></span>'+[['sq','⬛ Square'],['wide','▬ Wide'],['tall','▮ Tall']].map(([k,l])=>`<button data-sh="${k}" class="${k==='sq'?'on':''}">${l}</button>`).join('');
let qual='hd', shape='sq'; const SHP={sq:[1024,1024],wide:[1344,768],tall:[768,1344]};
function setMode(m){ mode=m; ls.set('rrAIMode',m); document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m)); $('styles').style.display=m==='image'?'flex':'none'; $('cam').style.display=m==='image'?'none':''; q.placeholder=m==='image'?'Describe the picture you want…':m==='quiz'?'Say what to be quizzed on, or answer the question…':'Ask anything, or send a photo of a question…'; if(m==='image') setImg(null); if(!cur||!cur.msgs.length) hello(); }
$('modes').onclick=e=>{ const b=e.target.closest('[data-m]'); if(b){ setMode(b.dataset.m); q.focus(); } };
$('styles').onclick=e=>{ const qq=e.target.closest('[data-qq]'); if(qq){ qual=qq.dataset.qq; document.querySelectorAll('[data-qq]').forEach(x=>x.classList.toggle('on',x===qq)); return; } const sh=e.target.closest('[data-sh]'); if(sh){ shape=sh.dataset.sh; document.querySelectorAll('[data-sh]').forEach(x=>x.classList.toggle('on',x===sh)); return; } const b=e.target.closest('[data-s]'); if(!b) return; sty=STY[+b.dataset.s][0]; document.querySelectorAll('#styles [data-s]').forEach(x=>x.classList.toggle('on',x===b)); };
function hello(){ inner.innerHTML=`<div class="hello"><div class="big">🤖</div><h2>${mode==='image'?'What should I draw?':'Hi! How can I help?'}</h2><div>${mode==='image'?'Describe anything — pick a style below the box.':'Ask anything, <b>send a photo</b> of a question 📷, or <b>talk</b> 🎤. Pick a helper up top.'}</div><div class="cards">${(START[mode]||START.chat).map(([t,p])=>`<button data-p="${esc(p)}"><b>${t}</b>${esc(p)}</button>`).join('')}</div></div>`; }
inner.addEventListener('click',e=>{ const c=e.target.closest('[data-p]'); if(c){ const p=c.dataset.p; if(p.startsWith('(')){ $('cam').click(); return; } q.value=p; send(); return; }
  const cp=e.target.closest('.cp'); if(cp){ navigator.clipboard&&navigator.clipboard.writeText(cp.nextElementSibling.textContent); cp.textContent='Copied!'; setTimeout(()=>cp.textContent='Copy',1200); return; }
  const a=e.target.closest('[data-a]'); if(a){ const i=+a.closest('.row').dataset.i, m=cur&&cur.msgs[i]; if(!m) return;
    if(a.dataset.a==='copy'){ navigator.clipboard&&navigator.clipboard.writeText(m.content); a.textContent='✓ Copied'; setTimeout(()=>a.textContent='📋 Copy',1200); }
    if(a.dataset.a==='say'){ if(speechSynthesis.speaking){ speechSynthesis.cancel(); return; } const u=new SpeechSynthesisUtterance(m.content.replace(/[#*`_>]/g,'')); u.rate=1.05; speechSynthesis.speak(u); }
    if(a.dataset.a==='retry'){ if(busy) return; cur.msgs.splice(i); render(); ask(); } } });
function rowHTML(m,i){ const u=m.role==='user'; let body;
  if(u) body=(m.img?`<img src="${m.img}" alt="photo">`:'')+(m.hadImg&&!m.img?'<i style="opacity:.7">📷 photo</i>\n':'')+esc(m.content);
  else if(m.pic) body=`<img src="${m.pic}" alt="${esc(m.content)}"><div class="acts"><a href="${m.pic}" download="rink-rivals-ai.jpg"><button>⬇ Save picture</button></a></div>`;
  else body=md(m.content)+(m.src&&m.src.length?`<div class="srcs">🔎 Sources: ${m.src.map((x,i)=>`<a href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.t)}">${i+1}. ${esc(x.t)}</a>`).join('')}</div>`:'')+`<div class="acts"><button data-a="copy">📋 Copy</button><button data-a="say">🔊 Read</button>${i===cur.msgs.length-1?'<button data-a="retry">🔁 Retry</button>':''}</div>`;
  return `<div class="row ${u?'u':'a'}" data-i="${i}"><div class="av">${u?'🙂':'🤖'}</div><div class="m">${body}</div></div>`; }
function render(){ if(!cur||!cur.msgs.length){ hello(); return; } inner.innerHTML=cur.msgs.map(rowHTML).join(''); log.scrollTop=log.scrollHeight; }
function drawChats(){ $('chats').innerHTML=chats.length?chats.map(c=>`<div class="ch ${cur&&c.id===cur.id?'on':''}" data-c="${c.id}"><span>${c.mode==='image'?'🎨':'💬'}</span><span class="t">${esc(c.title||'New chat')}</span><button class="d" data-del="${c.id}" title="Delete">🗑</button></div>`).join(''):'<div style="padding:10px;color:#64748b;font-size:13px">No chats yet</div>'; }
$('chats').onclick=e=>{ const d=e.target.closest('[data-del]'); if(d){ chats=chats.filter(c=>c.id!==d.dataset.del); if(cur&&cur.id===d.dataset.del) cur=null; save(); drawChats(); render(); return; } const c=e.target.closest('[data-c]'); if(c){ cur=chats.find(x=>x.id===c.dataset.c); if(cur&&cur.mode) setMode(cur.mode); render(); drawChats(); $('side').classList.remove('open'); } };
$('newChat').onclick=()=>{ cur=null; render(); drawChats(); q.focus(); $('side').classList.remove('open'); };
$('menu').onclick=()=>$('side').classList.toggle('open');
/* ---- photos ---- */
function setImg(d){ img=d; $('prev').style.display=d?'flex':'none'; if(d) $('pimg').src=d; }
function readImg(file){ if(!file||!/^image\//.test(file.type)) return; const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,1280/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); setImg(c.toDataURL('image/jpeg',.85)); if(mode==='image') setMode('homework'); q.focus(); }; im.src=fr.result; }; fr.readAsDataURL(file); }
$('cam').onclick=()=>$('file').click(); $('file').onchange=e=>{ readImg(e.target.files[0]); e.target.value=''; }; $('prm').onclick=()=>setImg(null);
addEventListener('paste',e=>{ for(const it of (e.clipboardData||{}).items||[]) if(it.type.startsWith('image/')){ readImg(it.getAsFile()); e.preventDefault(); } });
addEventListener('dragover',e=>e.preventDefault()); addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) readImg(f); });
/* ---- voice ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null;
if(!SR) $('mic').style.display='none';
$('mic').onclick=()=>{ if(rec){ rec.stop(); return; } rec=new SR(); rec.lang='en-US'; rec.interimResults=true; const base=q.value; rec.onresult=e=>{ let t=''; for(const r of e.results) t+=r[0].transcript; q.value=(base?base+' ':'')+t; q.dispatchEvent(new Event('input')); }; rec.onend=()=>{ rec=null; $('mic').classList.remove('rec'); }; rec.onerror=()=>{}; $('mic').classList.add('rec'); rec.start(); };
q.addEventListener('input',()=>{ q.style.height='auto'; q.style.height=Math.min(180,q.scrollHeight)+'px'; });
q.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
$('send').onclick=()=>{ if(busy&&ctrl){ ctrl.abort(); return; } send(); };
function setBusy(b){ busy=b; $('send').textContent=b?'■':'➤'; $('send').title=b?'Stop':'Send'; }
/* ---- talking to the server ---- */
function send(){ if(busy) return; const t=q.value.trim(); if(!t&&!img) return; q.value=''; q.style.height='auto';
  if(!cur){ cur={id:Date.now().toString(36),title:(t||'Photo question').slice(0,48),mode,msgs:[]}; chats.unshift(cur); }
  cur.mode=mode; const m={role:'user',content:t||(mode==='image'?'':'Please look at this photo and answer the question in it.')}; if(img){ m.img=img; m.hadImg=true; } cur.msgs.push(m); setImg(null); render(); drawChats(); ask(); }
async function ask(){ const last=cur.msgs[cur.msgs.length-1]; if(!last||last.role!=='user') return; setBusy(true);
  const row=document.createElement('div'); row.className='row a'; row.innerHTML='<div class="av">🤖</div><div class="m"><span class="dots"><span></span><span></span><span></span></span></div>'; inner.appendChild(row); log.scrollTop=log.scrollHeight; const box=row.querySelector('.m');
  ctrl=new AbortController();
  try{
    if(mode==='image'){ box.insertAdjacentHTML('beforeend',` <span style="font-size:13px;opacity:.7">${qual==='hd'?'painting in HD… (about 10–20 s)':'drawing…'}</span>`);
      const r=await fetch(SERVER()+'/ai',{method:'POST',signal:ctrl.signal,headers:{'content-type':'application/json'},body:JSON.stringify({op:'image',prompt:last.content+(sty?', '+sty:''),q:qual,w:SHP[shape][0],h:SHP[shape][1]})}); const j=await r.json().catch(()=>({})); if(!r.ok||j.err) throw new Error(j.err||'The picture maker is busy');
      cur.msgs.push({role:'assistant',content:last.content,pic:j.image}); try{ window.RRCOIN&&RRCOIN.add(5,'made an AI picture',true); }catch(e){} }
    else { const msgs=cur.msgs.filter(x=>!x.pic&&!x.err).map(x=>({role:x.role,content:x.content})).slice(-16);
      const r=await fetch(SERVER()+'/ai',{method:'POST',signal:ctrl.signal,headers:{'content-type':'application/json'},body:JSON.stringify({op:'chat',stream:true,web:webOn&&!last.img,mode:mode==='chat'?'':mode,messages:msgs,image:last.img||undefined})});
      if(!r.ok||!/event-stream/.test(r.headers.get('content-type')||'')){ const j=await r.json().catch(()=>({})); if(j.reply){ cur.msgs.push({role:'assistant',content:j.reply,src:j.sources||[]}); } else throw new Error(j.err||'The AI is busy — try again'); }
      else { const rd=r.body.getReader(), dec=new TextDecoder(); let buf='', txt=''; const am={role:'assistant',content:''}; try{ const sx=r.headers.get('x-sources'); if(sx) am.src=JSON.parse(decodeURIComponent(sx)); }catch(e){} cur.msgs.push(am); if(webOn&&!last.img) box.insertAdjacentHTML('afterbegin','<div style="font-size:13px;opacity:.7">🔎 searched the web…</div>'); box.classList.add('cur');
        try{ for(;;){ const {done,value}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true}); let k; while((k=buf.indexOf('\n'))>=0){ const line=buf.slice(0,k).trim(); buf=buf.slice(k+1); if(!line.startsWith('data:')) continue; const d=line.slice(5).trim(); if(d==='[DONE]') continue; try{ const o=JSON.parse(d); const piece=o.response!=null?o.response:(o.choices&&o.choices[0]&&o.choices[0].delta&&o.choices[0].delta.content)||''; if(piece){ txt+=piece; am.content=txt; box.innerHTML=md(txt); log.scrollTop=log.scrollHeight; } }catch(e){} } } }
        catch(e){ if(e.name!=='AbortError') throw e; }
        box.classList.remove('cur'); if(!txt){ am.content='Hmm, I could not think of an answer. Try asking another way?'; } } }
  }catch(e){ if(e.name==='AbortError'){ if(cur.msgs[cur.msgs.length-1].role==='user') cur.msgs.push({role:'assistant',content:'*(stopped)*',err:1}); } else cur.msgs.push({role:'assistant',content:'⚠️ '+e.message,err:1}); }
  save(); setBusy(false); ctrl=null; render(); drawChats(); q.focus(); }
setMode(mode); drawChats(); render(); webBtn();
/* ai?q=...&web=1 — the Rivals Browser (or anything) can open the AI with a question ready */
{ const q0=qs.get('q'); if(qs.get('web')==='1'){ webOn=true; webBtn(); } if(qs.get('mode')&&MODES.some(m=>m[0]===qs.get('mode'))) setMode(qs.get('mode')); if(q0&&!sessionStorage.getItem('rrAIq:'+q0)){ try{ sessionStorage.setItem('rrAIq:'+q0,'1'); history.replaceState(null,'',location.pathname+(webOn?'?web=1':'')); }catch(e){} cur=null; q.value=q0.slice(0,500); setTimeout(()=>{ if(!busy) send(); },300); } }
})();
</script>
