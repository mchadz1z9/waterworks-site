  for(let i=0;i<2;i++){const pd=g.pad[i],R=rr(pd)+PK,dx=pk.x-pd.x,dy=pk.y-pd.y,d=Math.hypot(dx,dy);if(d<R&&d>.01){const nx=dx/d,ny=dy/d;pk.x=pd.x+nx*R;pk.y=pd.y+ny*R;const rv=(pk.vx-pd.vx)*nx+(pk.vy-pd.vy)*ny;if(rv<0){pk.vx-=(1.9)*rv*nx;pk.vy-=(1.9)*rv*ny;}const sp=Math.hypot(pk.vx,pk.vy),mx=(g.fast>0?1500:1100);if(sp>mx){pk.vx*=mx/sp;pk.vy*=mx/sp}if(sp<260){pk.vx=nx*260;pk.vy=ny*260}spark(pk.x,pk.y,8);beep(300+Math.random()*100,.05,'square',.05)}}
