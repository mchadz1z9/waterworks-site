function bag(x,px,py,col,s,rot){x.save();x.translate(px,py);x.rotate(rot||0);x.scale(s,s);x.fillStyle='rgba(0,0,0,.3)';x.fillRect(-12,-9,26,26);x.fillStyle=col;x.beginPath();x.roundRect(-13,-13,26,26,5);x.fill();x.strokeStyle='rgba(0,0,0,.45)';x.lineWidth=1.5;x.stroke();x.strokeStyle='rgba(255,255,255,.35)';x.beginPath();x.moveTo(-9,-9);x.lineTo(9,-9);x.moveTo(-9,9);x.lineTo(9,9);x.stroke();x.restore()}
function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d'),g=G;
 const bg=x.createLinearGradient(0,0,0,560);bg.addColorStop(0,'#7cc4ff');bg.addColorStop(.32,'#cfeaff');bg.addColorStop(.33,'#4aa05a');bg.addColorStop(1,'#2d6e3b');x.fillStyle=bg;x.fillRect(0,0,1000,560);
 for(let i=0;i<14;i++){x.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)';x.fillRect(0,185+i*28,1000,14)}
 x.fillStyle='#6b4a2a';x.fillRect(0,168,1000,18);for(let i=0;i<18;i++){x.fillStyle='#7a5632';x.fillRect(i*58,150,6,36)}
 // board
 const c0=proj(-30,0),c1=proj(30,0),c2=proj(30,BL),c3=proj(-30,BL);
 x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.moveTo(c0[0]+8,c0[1]+8);x.lineTo(c1[0]+8,c1[1]+8);x.lineTo(c2[0]+8,c2[1]+8);x.lineTo(c3[0]+8,c3[1]+8);x.fill();
 const bd=x.createLinearGradient(0,c3[1],0,c0[1]);bd.addColorStop(0,'#e8c27a');bd.addColorStop(1,'#c9974f');x.fillStyle=bd;x.beginPath();x.moveTo(c0[0],c0[1]);x.lineTo(c1[0],c1[1]);x.lineTo(c2[0],c2[1]);x.lineTo(c3[0],c3[1]);x.fill();x.strokeStyle='#8a5a2b';x.lineWidth=5;x.stroke();
 x.fillStyle='#3a7bd5';x.beginPath();x.moveTo(c3[0]+10,c3[1]+8);x.lineTo(c2[0]-10,c2[1]+8);x.lineTo(c2[0]-14,c2[1]+34);x.lineTo(c3[0]+14,c3[1]+34);x.fill();
 const h=proj(HX,HY);x.fillStyle='#1a1008';x.beginPath();x.ellipse(h[0],h[1],34,13,0,0,7);x.fill();x.strokeStyle='#5a3a18';x.lineWidth=3;x.stroke();
 // bags on board
 const draws=g.bags.filter(b=>b.res!=='ground'&&b.res!=='hole').map(b=>({b,p:proj(b.u,b.v)}));draws.sort((a,c)=>a.p[1]-c.p[1]).forEach(d=>bag(x,d.p[0],d.p[1],d.b.pl?'#ff6b5a':'#4cc3ff',.55+.3*(1-d.b.v/BL)*0+.35,d.b.u*.03));
 // ground bags
 g.bags.filter(b=>b.res==='ground').forEach((b,i)=>{bag(x,360+i*38+(b.pl?400:0),505,b.pl?'#ff6b5a':'#4cc3ff',.7,.4*i)});
 // flight
 if(g.fl){const f=g.fl,t=f.t,s=proj(g.aim,0);const tp=proj(f.u,clamp(f.v,-14,BL+20));const px=500+(tp[0]-500)*(t*t*.4+t*.6),py=560+(tp[1]-560)*t-Math.sin(t*Math.PI)*190,sc=1.5-.95*t;bag(x,px,py,f.pl?'#ff6b5a':'#4cc3ff',sc,t*7)}
 // aim line
 if(g.ph==='aim'&&g.turn===0){const a=proj(g.aim,0),b=proj(g.aim,HY);x.setLineDash([6,8]);x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=2;x.beginPath();x.moveTo(500+g.aim*7,540);x.lineTo(b[0],b[1]);x.stroke();x.setLineDash([]);bag(x,500+g.aim*7,530,'#4cc3ff',1.1,0);
  const bx=280,by=540,w=440;x.fillStyle='rgba(8,12,22,.85)';x.beginPath();x.roundRect(bx-10,by-18,w+20,34,10);x.fill();const gr=x.createLinearGradient(bx,0,bx+w,0);gr.addColorStop(0,'#3ddc84');gr.addColorStop(.4,'#ffd23f');gr.addColorStop(.62,'#3ddc84');gr.addColorStop(.8,'#ffd23f');gr.addColorStop(1,'#ff4a3a');x.fillStyle=gr;x.fillRect(bx,by-10,w,18);x.fillStyle='#fff';x.fillRect(bx+g.m*w-3,by-16,6,30)}
 else if(g.ph==='aim'){bag(x,500,530,'#ff6b5a',1.1,0)}
 g.sp.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c||'#ffd23f';x.fillRect(p.x,p.y,5,5)});x.globalAlpha=1;
 // HUD
 x.fillStyle='rgba(8,12,22,.85)';x.beginPath();x.roundRect(330,10,340,56,12);x.fill();x.textAlign='center';x.fillStyle='#4cc3ff';x.font='800 13px system-ui';x.fillText('YOU',410,28);x.fillStyle='#ff6b5a';x.fillText(OPP[sv.opp][0].toUpperCase(),590,28);x.fillStyle='#fff';x.font='900 30px system-ui';x.fillText(g.sc[0]+'  -  '+g.sc[1],500,54);
 x.fillStyle='rgba(8,12,22,.75)';x.beginPath();x.roundRect(20,10,210,34,10);x.fill();x.fillStyle='#fff';x.font='700 13px system-ui';x.fillText('Round '+g.round+' · first to '+sv.to+' · bags '+g.cnt[0]+'/4 · '+g.cnt[1]+'/4',125,32);
 if(g.t-g.msgT<1.6&&g.msg){x.font='900 40px system-ui';x.lineWidth=8;x.strokeStyle='rgba(0,0,0,.7)';x.strokeText(g.msg,500,250);x.fillStyle=/CORN/.test(g.msg)?'#ffd23f':'#fff';x.fillText(g.msg,500,250)}
 if(g.ph==='aim'&&g.turn===0&&g.round===1&&g.cnt[0]===0){x.fillStyle='rgba(8,12,22,.8)';x.beginPath();x.roundRect(250,100,500,28,8);x.fill();x.fillStyle='#fff';x.font='600 13px system-ui';x.fillText('Move the mouse to aim · click or Space to stop the power bar (green = right power)',500,119)}}
function loop(){let last=performance.now();const f=now=>{const dt=Math.min(.033,(now-last)/1000||0);last=now;if(G){step(dt);draw()}if(V==='game')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
render();
