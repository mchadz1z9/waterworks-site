<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Market</title>
<style>
:root{--bg:#05080d;--p1:#0d141f;--p2:#152031;--line:#1f2b3f;--tx:#eef2f7;--mut:#8ea0b7;--up:#22c55e;--dn:#ef4444;--acc:linear-gradient(135deg,#22c55e,#eab308)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
#hd{position:sticky;top:0;z-index:20;background:rgba(5,8,13,.95);border-bottom:1px solid var(--line)}
#hd .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal;font-size:18px}
#hd .sp{flex:1}#bal{background:var(--p2);border-radius:999px;padding:7px 14px;font:800 14px system-ui}
.tabs{display:flex;gap:6px}.tab{border:0;background:none;color:var(--mut);font:700 15px system-ui;padding:8px 12px;border-radius:10px}.tab.on{background:var(--p2);color:var(--tx)}
main{max-width:1200px;margin:0 auto;padding:14px 16px 60px}
.lgs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}.lg{flex:none;border:1px solid var(--line);background:var(--p1);color:var(--tx);border-radius:999px;padding:7px 14px;font:700 14px system-ui}.lg.on{background:var(--acc);color:#0b1405;border-color:transparent}
#q{width:100%;max-width:320px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--p1);color:var(--tx);font-size:14px;margin-bottom:12px}
.note{color:var(--mut);font-size:14px;margin:0 0 14px}
.tick{display:flex;gap:18px;overflow:hidden;white-space:nowrap;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px;font:700 13px system-ui}
.tick span{display:inline-flex;gap:6px}.up{color:var(--up)}.dn{color:var(--dn)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.st{display:flex;align-items:center;gap:10px;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.st:hover{border-color:#eab308}.st img{width:36px;height:36px;object-fit:contain}.st .nm{flex:1;min-width:0}.st .nm b{display:block;font-size:15px}.st .nm small{color:var(--mut);font-size:12px}
.st .pr{text-align:right}.st .pr b{display:block;font:900 18px system-ui}.st .pr small{font:800 12px system-ui}
.own{font:800 11px system-ui;background:#eab30822;color:#fde047;border-radius:6px;padding:2px 6px;margin-left:4px}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.stat{flex:1;min-width:140px;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font:900 24px system-ui}.stat span{color:var(--mut);font-size:13px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px;font:800 16px system-ui}
.lb{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lb ol{margin:0;padding-left:22px}.lb li{padding:6px 0;border-top:1px solid var(--line)}.lb li:first-child{border:0}.lb li span{float:right;color:var(--mut)}
.empty{color:var(--mut);padding:30px;text-align:center;background:var(--p1);border-radius:16px;border:1px dashed var(--line)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#dlg .bx{width:min(480px,100%);max-height:92vh;overflow:auto;background:var(--p1);border:1px solid var(--line);border-radius:18px;padding:18px}
#dlg .hd{display:flex;align-items:center;gap:12px}#dlg .hd img{width:52px;height:52px}#dlg .hd b{font-size:20px;display:block}#dlg .hd small{color:var(--mut)}
#dlg .big{font:900 34px system-ui;margin:10px 0 2px}#spark{width:100%;height:70px;display:block;margin:8px 0}
#dlg .qty{display:flex;gap:8px;margin:10px 0}#dlg .qty button{flex:1;border:1px solid var(--line);background:var(--p2);color:var(--tx);border-radius:10px;padding:8px;font:800 14px system-ui}#dlg .qty button.on{border-color:#eab308;color:#fde047}
#dlg .act{display:flex;gap:10px;margin-top:10px}#dlg .act button{flex:1;border:0;border-radius:12px;padding:12px;font:900 15px system-ui}
.buy{background:var(--up);color:#052e16}.sell{background:var(--dn);color:#fff}.x{background:var(--p2);color:var(--tx)}
#dlg .msg{min-height:18px;color:var(--mut);font-size:13px;margin-top:8px;text-align:center}
.bar{height:7px;border-radius:4px;background:#1f2b3f;overflow:hidden;display:flex;margin-top:5px}.bar i{display:block;height:100%}
.ownb{font:800 11px system-ui;border-radius:6px;padding:2px 6px;margin-left:4px;background:#a855f722;color:#e9d5ff}.ownb.full{background:#eab30833;color:#fde047}
.news{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px;font:600 13px system-ui;max-height:118px;overflow:auto}.news div{padding:3px 0;border-top:1px solid var(--line)}.news div:first-child{border:0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:14px}.rules div{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--mut)}.rules b{color:var(--tx);display:block;font-size:14px;margin-bottom:2px}
.bo{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;font:900 15px system-ui;background:linear-gradient(135deg,#eab308,#a855f7);color:#140b02}
.hold{font-size:13px;color:var(--mut);margin-top:6px}.hold span{display:inline-block;margin:2px 8px 2px 0}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
@media(max-width:700px){.lb{grid-template-columns:1fr}.tabs{order:3;width:100%}}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui;text-decoration:none}.bk:hover{background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><div class="in"><a class="bk" href="./" title="Back" aria-label="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><a id="logo" href="market"><i>📈</i>Rival Market</a><span class="sp"></span><a href="marketday" style="background:#231a10;border-radius:999px;padding:7px 12px;font:800 13px system-ui">🛒 Market Day</a><span id="bal">🪙 …</span>
  <nav class="tabs"><button class="tab" data-t="mkt">📊 Market</button><button class="tab" data-t="me">💼 My stocks</button><button class="tab" data-t="lb">🏆 Leaders</button><button class="tab" data-t="own">👑 Owners</button></nav></div></header>
<main id="main"><div class="empty">Opening the market…</div></main>
<div id="dlg"><div class="bx" id="dlgB"></div></div>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SRV=(()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })();
  const pid=()=>{ try{ let p=localStorage.getItem('rrPid'); if(!p||p.length<8){ p=Math.random().toString(36).slice(2,14); localStorage.setItem('rrPid',p); } return p; }catch(e){ return ''; } };
  const name=()=>{ try{ return localStorage.getItem('rrOnlineName')||'Player'; }catch(e){ return 'Player'; } };
  const post=(u,b)=>fetch(SRV+u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({pid:pid(),name:name()},b||{}))}).then(r=>r.json()).catch(()=>null);
  const bal=()=>{ const b=window.RRCOIN&&RRCOIN.bal; return typeof b==='number'?b:0; }, fmt=n=>Math.round(n).toLocaleString();
  const LG={nfl:'🏈 NFL',nba:'🏀 NBA',nhl:'🏒 NHL',mlb:'⚾ MLB'};
  let Q=[], QM={}, ME=[], NEWS=[], SH=500, FEE=.02, tab=new URLSearchParams(location.search).get('t')||'mkt', lg='all', sel=null, qty=1, holders=[];
  /* the same price rule as the server: each extra share owned by players makes the next one cost more */
  const unit=(base,k)=>Math.max(1,Math.round(base*(1+1.2*Math.pow(Math.max(0,k)/SH,1.5))));
  const costBuy=(x,n)=>{ let c=0; for(let k=x.held;k<x.held+n;k++) c+=unit(x.base,k); return c; }, gotSell=(x,n)=>{ let c=0; for(let k=x.held-1;k>=x.held-n;k--) c+=unit(x.base,k); return c; };
  const chg=c=>c>0?`<small class="up">▲ ${c}</small>`:c<0?`<small class="dn">▼ ${-c}</small>`:`<small style="color:var(--mut)">—</small>`;
  const owned=sym=>(ME.find(h=>h.sym===sym)||{}).qty||0;
  const toast=t=>{ let e=$('mToast'); if(!e){ e=document.createElement('div'); e.id='mToast'; e.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#0d141f;border:1px solid #eab308;border-radius:12px;padding:10px 16px;font:800 14px system-ui;max-width:92vw'; document.body.appendChild(e); } e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',5000); };
  setInterval(()=>{ $('bal').textContent='🪙 '+fmt(bal()); },1000);
  async function loadQ(){ const d=await fetch(SRV+'/mkt/quotes').then(r=>r.json()).catch(()=>null); Q=(d&&d.q)||[]; NEWS=(d&&d.news)||[]; if(d&&d.sh) SH=d.sh; if(d&&d.fee) FEE=d.fee; QM={}; for(const x of Q) QM[x.sym]=x; }
  async function loadMe(){ const d=await post('/mkt/me'); ME=(d&&d.h)||[]; if(d&&d.div>0&&window.RRCOIN){ RRCOIN.tradeGive([],d.div); toast(`💸 Dividends: +${fmt(d.div)} 🪙 (${d.divWhy})`); } }
  async function claims(){ const d=await post('/mkt/claims'); for(const c of (d&&d.claims)||[]){ if(window.RRCOIN) RRCOIN.tradeGive([],c.n); toast(c.why); } }
  function nav(){ document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab)); history.replaceState(null,'','market?t='+tab); }
  const ownBadge=x=>x.owner?`<span class="ownb${x.owner.full?' full':''}">${x.owner.full?'🏆':'👑'} ${esc(x.owner.name)}</span>`:'';
  const bar=(x,mine)=>{ const o=Math.max(0,x.held-(mine||0)); return `<div class="bar" title="${x.held} of ${SH} shares owned"><i style="width:${(mine||0)/SH*100}%;background:#22c55e"></i><i style="width:${o/SH*100}%;background:#a855f7"></i></div>`; };
  const row=x=>`<div class="st" data-s="${esc(x.sym)}"><img src="${esc(x.logo)}" alt="" loading="lazy"><div class="nm"><b>${esc(x.name)}${owned(x.sym)?`<span class="own">${owned(x.sym)} yours</span>`:''}</b><small>${LG[x.lg]} · ${esc(x.rec)} · ${SH-x.held} left</small>${ownBadge(x)}${bar(x,owned(x.sym))}</div><div class="pr"><b>🪙 ${x.price}</b>${chg(x.chg||0)}</div></div>`;
  const newsBox=()=>NEWS.length?`<div class="news">${NEWS.map(n=>`<div>${esc(n.txt)} <span style="color:var(--mut)">· ${ago(n.ts)}</span></div>`).join('')}</div>`:'';
  const ago=t=>{ const m=Math.round((Date.now()-t)/60000); return m<1?'now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'; };
  function mkt(){ if(!Q.length){ $('main').innerHTML='<div class="empty">The market is closed right now. Try again soon.</div>'; return; }
    const movers=Q.filter(x=>x.chg).sort((a,b)=>Math.abs(b.chg)-Math.abs(a.chg)).slice(0,12); const s=($('q')&&$('q').value||'').toLowerCase();
    $('main').innerHTML=`<div class="rules"><div><b>📊 ${SH} shares per team</b>Prices follow the team's real record, and every share players buy makes the next one cost more.</div><div><b>👑 Own the team</b>Hold more than half (251+) and you're the owner. You earn ${FEE*100}% of every trade on your team.</div><div><b>🏆 Buy it out</b>Buy every share, even the ones other players own (they get paid +25%). Full owners are safe from takeovers for 12 hours.</div><div><b>💸 Dividends</b>Every share pays a little every day. Owners get 1.5×, full owners 2×.</div></div>`+newsBox()+
      (movers.length?`<div class="tick">${movers.map(x=>`<span>${esc(x.ab)} ${x.price} <b class="${x.chg>0?'up':'dn'}">${x.chg>0?'▲':'▼'}${Math.abs(x.chg)}</b></span>`).join('')}</div>`:'')+
      `<div class="lgs">${[['all','All'],...Object.entries(LG)].map(([k,t])=>`<button class="lg${k===lg?' on':''}" data-l="${k}">${t}</button>`).join('')}<button class="lg${lg==='owned'?' on':''}" data-l="owned">👑 Owned teams</button><button class="lg${lg==='cheap'?' on':''}" data-l="cheap">💲 Cheapest buyouts</button></div><input id="q" placeholder="Find a team…" value="${esc(s)}">`+
      `<div class="list" id="list"></div>`; listDraw(); $('q').oninput=listDraw; }
  function listDraw(){ const s=$('q').value.toLowerCase(); let L=Q.filter(x=>(lg==='all'||lg==='cheap'||x.lg===lg||(lg==='owned'&&x.owner))&&(!s||(x.name+' '+x.ab).toLowerCase().includes(s)));
    L=lg==='cheap'?L.sort((a,b)=>costBuy(a,SH-a.held)-costBuy(b,SH-b.held)):L.sort((a,b)=>b.price-a.price); $('list').innerHTML=L.map(row).join('')||'<div class="empty">No teams match.</div>'; }
  function me(){ const H=ME.filter(h=>h.qty>0); const val=H.reduce((t,h)=>t+h.price*h.qty,0), cost=H.reduce((t,h)=>t+h.cost,0), pr=val-cost, teams=H.filter(h=>h.qty>SH/2).length;
    $('main').innerHTML=`<div class="stats"><div class="stat"><b>🪙 ${fmt(val)}</b><span>your stocks are worth</span></div><div class="stat"><b class="${pr>=0?'up':'dn'}">${pr>=0?'+':''}${fmt(pr)}</b><span>profit so far</span></div><div class="stat"><b>👑 ${teams}</b><span>teams you own</span></div><div class="stat"><b>🪙 ${fmt(bal())}</b><span>coins to spend</span></div></div>`+
      (H.length?`<div class="list">${H.map(h=>{ const x=QM[h.sym]||{sym:h.sym,name:h.sym,logo:'',lg:h.sym.split(':')[0],rec:'',price:h.price,held:h.qty,chg:0}; const p=h.price*h.qty-h.cost; const tag=h.qty>=SH?'🏆 Full owner':h.qty>SH/2?'👑 Owner':Math.round(h.qty/SH*100)+'% of the team'; return `<div class="st" data-s="${esc(h.sym)}"><img src="${esc(x.logo)}" alt=""><div class="nm"><b>${esc(x.name)}</b><small>${h.qty} share${h.qty>1?'s':''} · ${tag} · paid ${fmt(h.cost)}</small>${bar(x,h.qty)}</div><div class="pr"><b>🪙 ${fmt(h.price*h.qty)}</b><small class="${p>=0?'up':'dn'}">${p>=0?'+':''}${fmt(p)}</small></div></div>`; }).join('')}</div>`:'<div class="empty">You don\'t own any stocks yet. Go to 📊 Market and buy your favorite team!</div>'); }
  async function lb(){ const d=await fetch(SRV+'/mkt/lb').then(r=>r.json()).catch(()=>null); const L=(a,f)=>a&&a.length?`<ol>${a.map(x=>`<li${x.name===name()?' style="color:#4ade80;font-weight:800"':''}>${esc(x.name)}<span>${f(x)}</span></li>`).join('')}</ol>`:'<div class="note">Nobody yet. Be the first investor!</div>';
    $('main').innerHTML=`<div class="lb"><div class="card"><h3>💰 Biggest portfolios</h3>${d?L(d.rich,x=>'🪙 '+fmt(x.value)):'…'}</div><div class="card"><h3>🚀 Best profit</h3>${d?L(d.best,x=>'+'+fmt(x.profit)):'…'}</div></div>`; }
  async function own(){ const d=await fetch(SRV+'/mkt/lb').then(r=>r.json()).catch(()=>null); const O=(d&&d.owners)||[];
    $('main').innerHTML=newsBox()+`<div class="card"><h3>👑 Team owners</h3>${O.length?`<div class="list">${O.map(o=>`<div class="st" style="cursor:default"><img src="${esc(o.logo)}" alt=""><div class="nm"><b>${esc(o.team)}</b><small>${o.full?'🏆 Fully owned by':'👑 Owned by'} <b style="display:inline;color:#fde047">${esc(o.name)}</b> · ${o.qty}/${SH} shares</small></div></div>`).join('')}</div>`:'<div class="note">Nobody owns a team yet. Buy 251 shares of one and it\'s yours!</div>'}</div>`; }
  async function open(sym){ sel=QM[sym]; if(!sel) return; qty=1; holders=[]; $('dlg').style.display='flex'; drawDlg(); const h=await fetch(SRV+'/mkt/hist?s='+encodeURIComponent(sym)).then(r=>r.json()).catch(()=>null); holders=(h&&h.holders)||[]; drawDlg(); spark((h&&h.h)||[]); }
  function drawDlg(msg){ const own=owned(sel.sym), left=SH-sel.held, n=Math.min(qty,Math.max(1,left)), cost=costBuy(sel,n), feeTo=sel.owner&&sel.owner.name!==name(), sv=Math.min(qty,own), got=sv?Math.round(gotSell(sel,sv)*(feeTo?1-FEE:1)):0;
    const maxAff=(()=>{ let c=0,k=0; while(k<left&&c+unit(sel.base,sel.held+k)<=bal()){ c+=unit(sel.base,sel.held+k); k++; } return k; })();
    $('dlgB').innerHTML=`<div class="hd"><img src="${esc(sel.logo)}" alt=""><div><b>${esc(sel.name)}</b><small>${LG[sel.lg]} · record ${esc(sel.rec)} · you own ${own}/${SH}</small></div></div>
      <div class="big">🪙 ${sel.price} ${chg(sel.chg||0)}</div><canvas id="spark" width="440" height="70"></canvas>
      <div style="font-size:13px;color:var(--mut)">${sel.held}/${SH} shares owned by players · ${left} left on the market${sel.owner?` · ${sel.owner.full?'🏆 fully owned':'👑 owned'} by <b style="color:#fde047">${esc(sel.owner.name)}</b>`:''}</div>${bar(sel,own)}
      ${holders.length?`<div class="hold">${holders.map(h=>`<span>${esc(h.name)} ${h.qty}</span>`).join('')}</div>`:''}
      <div class="qty">${[1,10,50,100].map(k=>`<button data-q="${k}" class="${k===qty?'on':''}">${k}</button>`).join('')}<button data-q="max" class="${qty===maxAff&&maxAff>100?'on':''}">Max ${maxAff}</button></div>
      <div class="act"><button class="buy" id="bBuy" ${left<1?'disabled style="opacity:.4"':''}>Buy ${n} · 🪙 ${fmt(cost)}</button><button class="sell" id="bSell" ${own<1?'disabled style="opacity:.4"':''}>Sell ${sv||qty} · 🪙 ${fmt(got)}</button><button class="x" id="bX">✕</button></div>
      ${own<SH?`<button class="bo" id="bOut">${sel.owner&&sel.owner.full&&sel.owner.name!==name()?'⚔️ Hostile takeover':'🏆 Buy out the whole team'}</button>`:'<div class="note" style="margin-top:10px;text-align:center">🏆 You own 100% of this team. You earn the owner fee on every trade and 2× dividends.</div>'}
      <div class="msg" id="dMsg">${msg||''}</div>`; }
  function spark(h){ const c=$('spark'); if(!c) return; const x=c.getContext('2d'); x.clearRect(0,0,440,70); if(h.length<2){ x.fillStyle='#8ea0b7'; x.font='13px system-ui'; x.fillText('Price history starts today.',8,40); return; }
    const P=h.map(r=>r.price), mn=Math.min(...P), mx=Math.max(...P), r=Math.max(1,mx-mn); x.strokeStyle=P[P.length-1]>=P[0]?'#22c55e':'#ef4444'; x.lineWidth=2.5; x.beginPath(); P.forEach((p,i)=>{ const X=4+i*(432/(P.length-1)), Y=64-(p-mn)/r*58; i?x.lineTo(X,Y):x.moveTo(X,Y); }); x.stroke(); }
  async function refresh(){ await loadQ(); await loadMe(); if(sel&&QM[sel.sym]) sel=QM[sel.sym]; }
  $('dlg').onclick=async e=>{ if(e.target.id==='dlg'||e.target.id==='bX'){ $('dlg').style.display='none'; return; }
    const qb=e.target.closest('[data-q]'); if(qb){ if(qb.dataset.q==='max'){ let c=0,k=0; const left=SH-sel.held; while(k<left&&c+unit(sel.base,sel.held+k)<=bal()){ c+=unit(sel.base,sel.held+k); k++; } qty=Math.max(1,k); } else qty=+qb.dataset.q; drawDlg(); return; }
    if(e.target.id==='bBuy'){ const left=SH-sel.held, n=Math.min(qty,left), cost=costBuy(sel,n); if(n<1) return; if(bal()<cost){ $('dMsg').textContent='Not enough coins. Play games to earn more!'; return; }
      if(!(window.RRCOIN&&RRCOIN.tradeTake([],cost))){ $('dMsg').textContent='Not enough coins.'; return; }
      const r=await post('/mkt/buy',{sym:sel.sym,qty:n,max:cost});
      if(!r||!r.ok){ RRCOIN.tradeGive([],cost); await refresh(); drawDlg(r&&r.err==='price'?'Someone just traded and the price moved. Check the new price and try again.':r&&r.err==='left'?`Only ${r.left} shares are left.`:'Could not buy right now. Your coins were given back.'); return; }
      if(r.paid<cost) RRCOIN.tradeGive([],cost-r.paid); await refresh(); drawDlg(`✅ Bought ${n} share${n>1?'s':''} of ${sel.name}!${owned(sel.sym)>SH/2?' 👑 You own this team!':''}`); return; }
    if(e.target.id==='bSell'){ const n=Math.min(qty,owned(sel.sym)); if(n<1) return; const r=await post('/mkt/sell',{sym:sel.sym,qty:n}); if(!r||!r.ok){ drawDlg('Could not sell right now.'); return; }
      RRCOIN.tradeGive([],r.got); await refresh(); drawDlg(`💰 Sold ${n} for 🪙 ${fmt(r.got)}!`); return; }
    if(e.target.id==='bOut'){ $('dMsg').textContent='Working out the price…'; const b=await post('/mkt/bquote',{sym:sel.sym}); if(!b||b.err==='own'){ $('dMsg').textContent='You already own the whole team.'; return; } if(b.err){ $('dMsg').textContent='Could not get a price.'; return; }
      if(b.safeUntil){ $('dMsg').textContent=`🛡️ This team was just bought out. It's safe from takeovers for ${Math.ceil((b.safeUntil-Date.now())/3600000)} more hour(s).`; return; }
      const lines=[b.free?`${b.free} shares from the market: 🪙 ${fmt(b.fromMkt)}`:'',...b.players.map(p=>`${p.qty} shares from ${p.name} (+${Math.round((b.premium-1)*100)}%): 🪙 ${fmt(p.pay)}`)].filter(Boolean);
      const ok=bal()>=b.total; $('dMsg').innerHTML=`<div style="text-align:left;background:var(--p2);border-radius:12px;padding:10px;color:var(--tx)"><b>${b.premium>1.3?'⚔️ Hostile takeover':'🏆 Buyout'} of the ${esc(sel.name)}</b><br>${lines.map(esc).join('<br>')}<br><b style="font-size:18px">Total 🪙 ${fmt(b.total)}</b><br>${ok?`<button class="bo" id="bOutGo">Confirm and own 100%</button>`:`<span class="dn">You need 🪙 ${fmt(b.total-bal())} more coins.</span>`}</div>`; sel._bq=b; return; }
    if(e.target.id==='bOutGo'&&sel._bq){ const b=sel._bq; if(!(window.RRCOIN&&RRCOIN.tradeTake([],b.total))){ $('dMsg').textContent='Not enough coins.'; return; }
      const r=await post('/mkt/buyout',{sym:sel.sym,max:b.total}); if(!r||!r.ok){ RRCOIN.tradeGive([],b.total); await refresh(); drawDlg(r&&r.err==='price'?'Prices moved. Press buy out again for the new price.':r&&r.err==='safe'?'🛡️ This team is protected from takeovers right now.':'Could not buy out right now. Your coins were given back.'); return; }
      if(r.paid<b.total) RRCOIN.tradeGive([],b.total-r.paid); await refresh(); drawDlg(`🏆 You own 100% of the ${sel.name}!`); toast(`🏆 You bought out the ${sel.name}!`); } };
  document.addEventListener('click',e=>{ const t=e.target.closest('.tab'); if(t){ tab=t.dataset.t; draw(); return; } const l=e.target.closest('[data-l]'); if(l){ lg=l.dataset.l; mkt(); return; } const s=e.target.closest('.st'); if(s&&s.dataset.s&&!e.target.closest('#dlg')) open(s.dataset.s); });
  function draw(){ nav(); if(tab==='me') me(); else if(tab==='lb') lb(); else if(tab==='own') own(); else mkt(); }
  const go=()=>Promise.all([loadQ(),loadMe()]).then(draw).then(claims);
  const wait=setInterval(()=>{ if(window.RRCOIN&&RRCOIN.tradeGive){ clearInterval(wait); go(); } },150); setTimeout(()=>{ if(!Q.length) go(); },4000);
  setInterval(async()=>{ await loadQ(); claims(); if(tab==='mkt'&&$('list')) listDraw(); },60000);
  addEventListener('keydown',e=>{ if(e.key==='Escape') $('dlg').style.display='none'; });
})();
</script>

<script src="chat.js"></script>
