 else if(V==='build')h+=buildView();else h+=simView();
 $('#app').innerHTML=h}
function modeName(){return S.mode==='team'?'team':'player'}

 h+='<div class="card">';

 else if(S.team&&!S.cur){h+='<h2>'+S.team.n+': choose a player</h2><div style="display:grid;gap:8px">'+S.team.list.map((pl,i)=>'<button class="btn g" data-a="tpick" data-v="'+i+'">'+pl[0]+' <small>('+pl[2]+' OVR)</small></button>').join('')+'</div><button class="btn g s" data-a="reroll" style="margin-top:8px">Re-roll ('+S.rr+' left)</button>'}
 else{const pl=S.cur,tv=traits(pl,S.pos);h+='<h2>'+pl[0]+' ('+pl[1]+') · '+pl[2]+' overall</h2><div class="tip" style="margin-bottom:8px">Tap a trait to put this rating in that slot</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">'+POS[S.pos].tr.map((k,i)=>'<button class="btn '+(S.build[i]?'g':'')+'" '+(S.build[i]?'disabled style="opacity:.35"':'')+' data-a="take" data-v="'+i+'"><span>'+k+'</span> <b style="font-size:20px">'+tv[i]+'</b></button>').join('')+'</div><button class="btn g s" data-a="reroll" style="margin-top:8px">Re-roll ('+S.rr+' left)</button>'}
 return h+'</div>'}
function ovr(b){const w=b.map((x,i)=>i<3?1.5:1);return b.reduce((a,x,i)=>a+x.v*w[i],0)/w.reduce((a,b)=>a+b,0)}
const T=(k)=>S.build[POS[S.pos].tr.indexOf(k)].v;
function rr(a,b){return a+Math.random()*(b-a)}
function simSeason(){const O=ovr(S.build),pos=S.pos,g=[];

 if(pos==='NBA'){const sc=(T('Inside Scoring')+T('Three-Point')+T('Mid-Range'))/3,pm=(T('Playmaking')+T('Basketball IQ'))/2,rb=(T('Rebounding')+T('Strength')*.5)/1.5,df=(T('Interior D')+T('Perimeter D'))/2;let t={pts:0,reb:0,ast:0,stl:0,blk:0,gp:0};for(let i=1;i<=82;i++){if(Math.random()<.08)continue;const mn=Math.round(rr(30,38)),pts=Math.max(2,Math.round(mn*(.30+(sc-60)*.0105+(O-60)*.003)+rr(-6,7))),reb=Math.max(0,Math.round(2+(rb-50)*.17+rr(-3,3.5))),ast=Math.max(0,Math.round(1+(pm-50)*.17+rr(-2.5,3))),stl=Math.random()<.1+(df-50)*.005?1:0,blk=Math.random()<.05+(T('Interior D')-50)*.005?1:0;g.push([i,mn,pts,reb,ast,stl,blk]);t.pts+=pts;t.reb+=reb;t.ast+=ast;t.stl+=stl;t.blk+=blk;t.gp++}
  const n=Math.max(1,t.gp);return{head:['Gm','Min','Pts','Reb','Ast','Stl','Blk'],g,tot:[['Games played',t.gp],['Points/game',(t.pts/n).toFixed(1)],['Rebounds/game',(t.reb/n).toFixed(1)],['Assists/game',(t.ast/n).toFixed(1)],['Steals',t.stl],['Blocks',t.blk],['Total points',t.pts]],score:t.pts,rank:rk(Math.round(t.pts/n*10)/10,[16,22,27,31],'PPG')}}
 if(pos==='H'){const ct=(T('Contact')*1.2+T('Vision')+T('Discipline')*.8)/3,pw=T('Power'),sp=(T('Speed')+T('Baserunning'))/2;let t={ab:0,h:0,hr:0,rbi:0,sb:0,bb:0,r:0};const gl=[];for(let i=1;i<=162;i++){if(Math.random()<.05)continue;const ab=Math.round(rr(3.4,4.8)),hr=Math.random()<Math.max(.01,.02+(pw-50)*.0045)?1:0,hit=Array.from({length:ab},()=>Math.random()<Math.max(.14,.2+(ct-50)*.0033+rr(-.03,.03))?1:0).reduce((a,b)=>a+b,0),h=Math.max(hr,hit),bb=Math.random()<.08+(T('Discipline')-50)*.0016?1:0,sb=Math.random()<Math.max(0,(sp-55)*.0042)?1:0,rbi=Math.round(hr*1.6+Math.max(0,h-hr)*rr(.2,.6)+rr(-.2,.4));g.push([i,ab,h,hr,Math.max(0,rbi),sb]);t.ab+=ab;t.h+=h;t.hr+=hr;t.rbi+=Math.max(0,rbi);t.sb+=sb;t.bb+=bb}
  return{head:['Gm','AB','H','HR','RBI','SB'],g,tot:[['Batting avg',(t.h/t.ab).toFixed(3).replace(/^0/,'')],['Home runs',t.hr],['RBI',t.rbi],['Hits',t.h],['Stolen bases',t.sb],['Walks',t.bb]],score:t.hr*4+t.rbi+t.h,rank:rk(t.hr,[20,32,43,55],'home runs')}}
 if(pos==='F'||pos==='D'){const sh=pos==='F'?(T('Shooting')*1.3+T('Goal Scoring')*.7+T('Hockey IQ')*.5)/2.5:(T('Slap Shot')+T('Hockey IQ'))/2,ps=pos==='F'?(T('Passing')+T('Stickhandling'))/2:(T('Outlet Pass')+T('Skating'))/2,df=pos==='F'?T('Defense'):(T('Shot Blocking')+T('Gap Control')+T('Stick Checking'))/3;let t={g:0,a:0,pm:0,sog:0,gp:0};for(let i=1;i<=82;i++){if(Math.random()<.06)continue;const sg=Math.max(0,Math.round(rr(1,3.6)+(sh-60)*(pos==='F'?.05:.025))),gl=Math.random()<Math.min(.7,(pos==='F'?.14:.035)+(sh-60)*(pos==='F'?.011:.003))?1+(Math.random()<.12?1:0):0,as=Math.random()<Math.min(.8,(pos==='F'?.2:.16)+(ps-60)*(pos==='F'?.011:.009))?1+(Math.random()<.14?1:0):0,pm=Math.round(rr(-1,1)+(df-70)*.012);g.push([i,gl,as,gl+as,pm,sg]);t.g+=gl;t.a+=as;t.pm+=pm;t.sog+=sg;t.gp++}
  return{head:['Gm','G','A','Pts','+/-','SOG'],g,tot:[['Goals',t.g],['Assists',t.a],['Points',t.g+t.a],['Plus/minus',t.pm],['Shots',t.sog],['Games',t.gp]],score:(t.g+t.a)*3,rank:rk(t.g+t.a,pos==='F'?[40,65,90,115]:[20,35,55,75],'points')}}
 if(pos==='G'){const sv=(T('Reflexes')+T('Positioning')+T('Glove')+T('Blocker'))/4,rc=T('Rebound Control'),mt=(T('Mental Toughness')+T('Lateral Quickness'))/2;let w=0,l=0,otl=0,sa=0,sv_=0,so=0;for(let i=1;i<=64;i++){const sh=Math.round(rr(23,35)),p=Math.min(.95,.875+(sv-60)*.0021+(rc-60)*.0004+rr(-.04,.035)),ga=Array.from({length:sh},()=>Math.random()>p?1:0).reduce((a,b)=>a+b,0);sa+=sh;sv_+=sh-ga;if(ga===0)so++;const win=Math.random()<Math.max(.2,Math.min(.85,.5+(sv-60)*.007-(ga-2.7)*.12+(mt-60)*.002));if(win)w++;else if(Math.random()<.2)otl++;else l++;g.push([i,sh,ga,((sh-ga)/sh).toFixed(3),win?'W':'L'])}
  return{head:['Gm','SA','GA','SV%','Res'],g,tot:[['Record',w+'-'+l+'-'+otl],['Save %',(sv_/sa).toFixed(3)],['GAA',((sa-sv_)/64).toFixed(2)],['Shutouts',so],['Wins',w],['Saves',sv_]],score:Math.round(sv_/sa*1000)*2+w*5,rank:rk(Math.round(sv_/sa*1000),[905,915,925,932],'SV per 1000')}}
 if(pos==='RB'){const hands=T('Hands'),sp=(T('Speed')+T('Burst'))/2,ev=(T('Elusiveness')+T('Vision'))/2;let tot={car:0,yds:0,td:0,rec:0,ry:0,rtd:0,fum:0};for(let i=1;i<=17;i++){const car=Math.max(4,Math.round(rr(11,17)+(O-70)*.15)),ypc=Math.max(2.4,3.3+(O-60)*.04+(sp-60)*.012+(ev-60)*.01+rr(-1.1,1.4)),y=Math.round(car*ypc),td=(Math.random()<.18+(O-60)*.013?1:0)+(Math.random()<.04+(O-60)*.003?1:0),rec=Math.max(0,Math.round(rr(.4,2.2)+(hands-60)*.045)),ry=Math.round(rec*rr(5,9)),fm=Math.random()<Math.max(.01,.07-(T('Ball Security')-60)*.0016)?1:0;g.push([i,car,y,td,rec,ry,fm]);tot.car+=car;tot.yds+=y;tot.td+=td;tot.rec+=rec;tot.ry+=ry;tot.fum+=fm}
  return{head:['Wk','Car','Yds','TD','Rec','RecYds','Fum'],g,tot:[['Rushing yards',tot.yds],['Carries',tot.car],['Yards/carry',(tot.yds/tot.car).toFixed(1)],['Rushing TDs',tot.td],['Receptions',tot.rec],['Rec yards',tot.ry],['Fumbles',tot.fum]],score:tot.yds+tot.td*20+tot.ry,rank:rk(tot.yds,[1000,1400,1800,2100],'rush yards')}}
 if(pos==='QB'){const acc=(T('Accuracy')+T('Short Accuracy')+T('Touch'))/3,arm=(T('Arm Strength')+T('Deep Ball'))/2,dm=(T('Decision Making')+T('Pocket Presence'))/2;let t={att:0,cmp:0,yds:0,td:0,int:0,ry:0};for(let i=1;i<=17;i++){const att=Math.round(rr(30,43)),cp=Math.min(.82,.5+(acc-60)*.0042+rr(-.07,.07)),cmp=Math.round(att*cp),ypc=7.5+(arm-60)*.06+(acc-60)*.02+rr(-1.5,1.8),y=Math.round(cmp*ypc),td=Math.max(0,Math.round(.9+(O-60)*.035+rr(-1.1,1.4))),it=Math.max(0,Math.round(1.1-(dm-60)*.017+rr(-.9,.9))),ry=Math.round(Math.max(0,rr(0,10)+(T('Mobility')-60)*.4));g.push([i,cmp+'/'+att,y,td,it,ry]);t.att+=att;t.cmp+=cmp;t.yds+=y;t.td+=td;t.int+=it;t.ry+=ry}
  return{head:['Wk','Cmp/Att','Yds','TD','INT','RushYds'],g,tot:[['Passing yards',t.yds],['Completion %',(t.cmp/t.att*100).toFixed(1)],['Pass TDs',t.td],['Interceptions',t.int],['Rush yards',t.ry],['Passer rating',Math.min(158.3,((Math.max(0,Math.min(2.375,(t.cmp/t.att-.3)*5))+Math.max(0,Math.min(2.375,(t.yds/t.att-3)*.25))+Math.min(2.375,t.td/t.att*20)+Math.max(0,2.375-t.int/t.att*25))/6*100)).toFixed(1)]],score:t.yds+t.td*20-t.int*45,rank:rk(t.yds,[3800,4300,4800,5200],'pass yards')}}
 if(pos==='WR'){const hands=(T('Hands')+T('One-Handers')+T('Mossing'))/3,sp=(T('Speed')+T('Release'))/2;let t={tg:0,rec:0,yds:0,td:0};for(let i=1;i<=17;i++){const tg=Math.max(2,Math.round(rr(5,10)+(O-60)*.08)),cp=Math.min(.9,.5+(hands-60)*.004+(T('Route Running')-60)*.002+rr(-.1,.1)),rec=Math.round(tg*cp),ypr=9+(sp-60)*.1+(T('YAC')-60)*.05+rr(-2.5,3.5),y=Math.round(rec*ypr),td=(Math.random()<.22+(O-60)*.013?1:0)+(Math.random()<.03+(O-60)*.003?1:0);g.push([i,tg,rec,y,td]);t.tg+=tg;t.rec+=rec;t.yds+=y;t.td+=td}
  return{head:['Wk','Tgt','Rec','Yds','TD'],g,tot:[['Receptions',t.rec],['Receiving yards',t.yds],['Targets',t.tg],['Receiving TDs',t.td],['Yards/rec',(t.yds/t.rec).toFixed(1)],['Catch %',(t.rec/t.tg*100).toFixed(0)+'%']],score:t.yds+t.td*20,rank:rk(t.yds,[900,1200,1500,1800],'receiving yards')}}
 {let ip=0,k=0,er=0,w=0,l=0,bb=0,h=0;const stam=T('Stamina'),arm=(T('Arm Strength')+T('Slider')+T('Curveball'))/3,cmd=(T('Command')+T('Accuracy')+T('Poise'))/3;for(let i=1;i<=32;i++){const ipp=Math.max(3,Math.min(8.3,rr(4.7,6.6)+(stam-60)*.035)),kk=Math.round(ipp*(5.6+(arm-60)*.135)/9*rr(.8,1.25)),b=Math.max(0,Math.round(ipp*(3.6-(cmd-60)*.05)/9*rr(.6,1.5))),hh=Math.round(ipp*(9.2-(O-60)*.1)/9*rr(.6,1.4)),e=Math.max(0,Math.round(ipp*(5.3-(O-60)*.075+rr(-1.6,1.9))/9)),won=(e<=2&&ipp>=5&&Math.random()<.7)||(e===3&&ipp>=5.5&&Math.random()<.35)?1:0,lost=(e>=4&&Math.random()<.65)||(e===3&&Math.random()<.25)?1:0;g.push([i,ipp.toFixed(1),kk,b,hh,e]);ip+=ipp;k+=kk;er+=e;bb+=b;h+=hh;w+=won;l+=lost}
  return{head:['Start','IP','K','BB','H','ER'],g,tot:[['Wins-Losses',w+'-'+l],['Innings',ip.toFixed(0)],['Strikeouts',k],['ERA',(er/ip*9).toFixed(2)],['WHIP',((bb+h)/ip).toFixed(2)],['Walks',bb]],score:k-er*3+w*8,rank:rk(k,[150,200,250,290],'strikeouts')}}}
function rk(v,th,w){const L=['Bench depth','Solid starter','Pro Bowl level','All-Pro / league leader','Historic season'];let i=0;th.forEach(t=>{if(v>=t)i++});return L[i]+' ('+v+' '+w+')'}
function simView(){const R=S.res;return '<div class="card"><h2>'+S.name+' · '+POS[S.pos].n+' · '+Math.round(ovr(S.build))+' overall</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:10px">'+R.tot.map(x=>'<div style="background:var(--card2);border-radius:10px;padding:10px;text-align:center"><div style="font-size:24px;font-weight:900;color:var(--gold)">'+x[1]+'</div><div class="tip">'+x[0]+'</div></div>').join('')+'</div><div style="font-weight:800;margin:6px 0">'+R.rank+'</div><div class="row2" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="sim">Sim another season</button><button class="btn g" data-a="title">New build</button></div></div><div class="card" style="overflow:auto;max-height:300px"><table><tr>'+R.head.map(h=>'<td><b>'+h+'</b></td>').join('')+'</tr>'+R.g.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div><div class="card"><h2>Your traits</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px">'+POS[S.pos].tr.map((k,i)=>'<div class="tip">'+k+': <b style="color:var(--tx)">'+S.build[i].v+'</b> <span>(from '+S.build[i].from+')</span></div>').join('')+'</div></div>'}
function list(pos){return DATA[pos]}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;ac();const a=b.dataset.a,v=b.dataset.v;
 if(a==='pos'){S={pos:v,mode:'player',build:Array(10).fill(null),rr:3,cur:null,team:null,done:false,name:'My '+POS[v].n};V='build'}
 else if(a==='title'){V='title';S=null}
 else if(a==='mode'){S.mode=v;S.cur=null;S.team=null}
 else if(a==='roll'){const L=list(S.pos);if(S.mode==='player'){S.cur=L[Math.floor(Math.random()*L.length)]}else{const teams=[...new Set(L.map(p=>p[1]))];const t=teams[Math.floor(Math.random()*teams.length)];S.team={n:t,list:L.filter(p=>p[1]===t).sort((a,b)=>b[2]-a[2]).slice(0,5)}}}
 else if(a==='tpick'){S.cur=S.team.list[+v];S.team=null}
 else if(a==='reroll'){if(S.rr>0){S.rr--;S.cur=null;S.team=null}}
 else if(a==='take'){const i=+v;if(!S.build[i]&&S.cur){S.build[i]={v:traits(S.cur,S.pos)[i],from:S.cur[0]};S.cur=null;S.team=null;S.done=S.build.every(x=>x)}}
 else if(a==='sim'){S.res=simSeason();sv.sims++;const k=S.pos;const sc=Math.round(ovr(S.build));if(!sv.best[k]||sc>sv.best[k])sv.best[k]=sc;sv_('bp1',sv);V='sim'}
 render()});
render();
