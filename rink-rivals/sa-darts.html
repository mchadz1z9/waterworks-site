document.addEventListener('pointermove',e=>{const cv=$('#cv');if(!cv||!G)return;if(e.pointerType==='mouse'||G.mouseDown){const q=cpt(e);if(G.turn===0&&G.ph==='aim'){G.ax=clamp((q.x-CX)/S,-190,190);G.ay=clamp((q.y-CY)/S,-190,190)}}});
const pu=()=>{if(G&&G.mouseDown){G.mouseDown=false;release()}};document.addEventListener('pointerup',pu);document.addEventListener('pointercancel',pu);
/* ---------- drawing */
const COL={bk:'#10130f',cr:'#f3e7c6',rd:'#d8232e',gr:'#13874a'};
function sector(x,i,r0,r1,col){const a0=(i-.5)*Math.PI/10-Math.PI/2,a1=(i+.5)*Math.PI/10-Math.PI/2;x.beginPath();x.arc(CX,CY,r1*S,a0,a1);x.arc(CX,CY,r0*S,a1,a0,true);x.closePath();x.fillStyle=col;x.fill()}
function drawBoard(x){const gl=x.createRadialGradient(CX,CY,100,CX,CY,330);gl.addColorStop(0,'rgba(255,230,160,.22)');gl.addColorStop(1,'rgba(255,230,160,0)');x.fillStyle=gl;x.fillRect(0,0,1000,560);
 x.fillStyle='#0b0c0b';x.beginPath();x.arc(CX,CY,196*S,0,7);x.fill();x.fillStyle='#1a1410';x.beginPath();x.arc(CX,CY,181*S,0,7);x.fill();
 for(let i=0;i<20;i++){const e=i%2===0;sector(x,i,15.9,99,e?COL.bk:COL.cr);sector(x,i,99,107,e?COL.rd:COL.gr);sector(x,i,107,162,e?COL.bk:COL.cr);sector(x,i,162,170,e?COL.rd:COL.gr)}
 x.fillStyle=COL.gr;x.beginPath();x.arc(CX,CY,15.9*S,0,7);x.fill();x.fillStyle=COL.rd;x.beginPath();x.arc(CX,CY,6.35*S,0,7);x.fill();
 x.strokeStyle='rgba(200,205,215,.7)';x.lineWidth=1;[6.35,15.9,99,107,162,170].forEach(r=>{x.beginPath();x.arc(CX,CY,r*S,0,7);x.stroke()});
 for(let i=0;i<20;i++){const a=(i-.5)*Math.PI/10-Math.PI/2;x.beginPath();x.moveTo(CX+Math.cos(a)*15.9*S,CY+Math.sin(a)*15.9*S);x.lineTo(CX+Math.cos(a)*170*S,CY+Math.sin(a)*170*S);x.stroke()}
 x.fillStyle='#f4f4f4';x.font='800 22px system-ui';x.textAlign='center';x.textBaseline='middle';for(let i=0;i<20;i++){const a=i*Math.PI/10-Math.PI/2;x.fillText(ORDER[i],CX+Math.cos(a)*183*S,CY+Math.sin(a)*183*S+1)}x.textBaseline='alphabetic'}
function drawDart(x,px,py,col,sc){sc=sc||1;x.save();x.translate(px,py);x.strokeStyle='#c8ccd6';x.lineWidth=2*sc;x.beginPath();x.moveTo(0,0);x.lineTo(7*sc,10*sc);x.stroke();x.strokeStyle='#333';x.lineWidth=5*sc;x.beginPath();x.moveTo(7*sc,10*sc);x.lineTo(20*sc,28*sc);x.stroke();x.strokeStyle='#999';x.lineWidth=1.3*sc;x.beginPath();x.moveTo(20*sc,28*sc);x.lineTo(30*sc,42*sc);x.stroke();
 x.fillStyle=col;x.beginPath();x.moveTo(30*sc,42*sc);x.lineTo(38*sc,40*sc);x.lineTo(44*sc,56*sc);x.lineTo(34*sc,50*sc);x.closePath();x.fill();x.beginPath();x.moveTo(30*sc,42*sc);x.lineTo(26*sc,50*sc);x.lineTo(24*sc,58*sc);x.lineTo(34*sc,50*sc);x.closePath();x.fillStyle=shade(col);x.fill();x.restore()}
const shade=c=>c==='#ff3d4d'?'#b01f2c':'#1f8a5a';
function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d'),g=G;
 const bg=x.createLinearGradient(0,0,0,560);bg.addColorStop(0,'#0a0f0d');bg.addColorStop(1,'#050806');x.fillStyle=bg;x.fillRect(0,0,1000,560);
 x.fillStyle='rgba(255,255,255,.03)';for(let i=0;i<12;i++)x.fillRect(i*90-20,0,40,560);
 for(let i=0;i<7;i++){x.fillStyle=i%2?'#1a120c':'#21170f';x.fillRect(i*104,0,104,560)}
 x.fillStyle='rgba(255,230,160,.12)';x.beginPath();x.moveTo(CX-60,0);x.lineTo(CX+60,0);x.lineTo(CX+330,560);x.lineTo(CX-330,560);x.fill();
 for(let i=0;i<36;i++){const bx=i*29+((i*53)%17),bh=(g.crowd>0?Math.sin(g.t*10+i)*8*g.crowd:0);x.fillStyle=['#2a1a1f','#1a2230','#26261a','#1d2a20'][i%4];x.beginPath();x.arc(bx,545-bh,13,0,7);x.fill();x.fillRect(bx-13,545-bh,26,30)}
 drawBoard(x);
 g.darts.forEach(d=>drawDart(x,CX+d.x*S,CY+d.y*S,d.pl?'#2fc47a':'#ff3d4d',.7));
 if(g.fl){const f=g.fl,t=f.t,e=t*t,px=f.x0+(CX+f.x*S-f.x0)*e,py=f.y0+(CY+f.y*S-f.y0)*e-Math.sin(t*Math.PI)*70,sc=1.6-.9*e;drawDart(x,px,py,f.pl?'#2fc47a':'#ff3d4d',sc)}
 if(g.ph==='aim'||g.ph==='wait'){const w=g.turn===0?wobble():[0,0];const px=CX+(g.ax+w[0])*S,py=CY+(g.ay+w[1])*S;if(g.turn===0&&g.ph==='aim'){x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;x.beginPath();x.arc(px,py,12+(g.holding?0:8),0,7);x.moveTo(px-18,py);x.lineTo(px+18,py);x.moveTo(px,py-18);x.lineTo(px,py+18);x.stroke();x.fillStyle='rgba(8,12,10,.85)';x.fillRect(CX+215*S/1.5-190,515,0,0)}
  else if(g.turn===1&&g.ph==='aim'){drawDart(x,px,py,'#ff3d4d',.9)}}
 g.sp.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillStyle='#ffd23f';x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1;
 // side panel
 x.fillStyle='rgba(8,12,10,.9)';x.beginPath();x.roundRect(720,20,260,520,14);x.fill();x.strokeStyle='#2f4a3d';x.lineWidth=2;x.stroke();x.textAlign='center';
 g.pl.forEach((p,i)=>{const y=40+i*130,act=g.turn===i;x.fillStyle=act?'rgba(255,61,77,.18)':'rgba(255,255,255,.04)';x.beginPath();x.roundRect(732,y,236,118,10);x.fill();x.fillStyle=act?'#ffd23f':'#92b0a2';x.font='800 14px system-ui';x.fillText(p.n,850,y+22);const live=act&&!g.over?p.rem-g.tmp:p.rem;x.fillStyle='#fff';x.font='900 56px system-ui';x.fillText(live,850,y+80);x.fillStyle='#92b0a2';x.font='600 12px system-ui';x.fillText('Last: '+(p.hist.length?p.hist[p.hist.length-1]:'-')+' · Avg: '+(p.hist.length?(p.hist.reduce((a,b)=>a+b,0)/p.hist.length).toFixed(0):'-'),850,y+104)});
 x.fillStyle='#92b0a2';x.font='700 13px system-ui';x.fillText('Dart '+Math.min(3,g.dn+(g.ph==='aim'||g.ph==='fly'?1:0))+' of 3'+(sv.legs>1?' · Legs '+g.legs[0]+'-'+g.legs[1]:'')+(TOUR?' · Round '+(TOUR.r+1)+'/4':''),850,320);
 const rem=g.pl[g.turn].rem-g.tmp;const chk=CHK[rem];if(chk&&rem<=170){x.fillStyle='#ffd23f';x.font='800 14px system-ui';x.fillText('Checkout: '+chk,850,350)}
 if(g.t-g.msgT<1.3&&g.msg){x.font='900 54px system-ui';x.textAlign='center';x.lineWidth=8;x.strokeStyle='rgba(0,0,0,.75)';x.strokeText(g.msg,CX,80);x.fillStyle=g.msg==='BUST!'?'#ff6b5a':'#ffd23f';x.fillText(g.msg,CX,80)}
 if(g.turn===0&&g.ph==='aim'&&g.pl[0].hist.length===0&&g.dn===0){x.fillStyle='rgba(8,12,10,.85)';x.beginPath();x.roundRect(100,518,640,32,10);x.fill();x.fillStyle='#fff';x.font='600 13px system-ui';x.fillText('Move to aim · hold mouse or Space to steady · release to throw',420,539)}}
const CHK=(()=>{const o={};for(let r=2;r<=40;r+=2)o[r]='D'+r/2;o[50]='BULL';const t=[];for(let n=1;n<=20;n++){t.push(['S'+n,n]);t.push(['D'+n,n*2]);t.push(['T'+n,n*3])}t.push(['BULL',50]);
 for(const [a,av] of t)for(let d=1;d<=20;d++){const v=av+d*2;if(!o[v]&&v<=110)o[v]=a+' D'+d}for(let r=41;r<=110;r++)if(!o[r]){for(const [a,av] of t){const l=r-av;if(l>=2&&l<=40&&l%2===0){o[r]=a+' D'+l/2;break}}}
 [[170,'T20 T20 BULL'],[167,'T20 T19 BULL'],[164,'T20 T18 BULL'],[161,'T20 T17 BULL'],[160,'T20 T20 D20']].forEach(a=>o[a[0]]=a[1]);for(let r=111;r<=170;r++)if(!o[r]){outer:for(const [a,av] of t)for(const [b,bv] of t){const l=r-av-bv;if(l>=2&&l<=40&&l%2===0&&av>=bv){o[r]=a+' '+b+' D'+l/2;break outer}}}return o})();
function loop(){let last=performance.now();const f=now=>{const dt=Math.min(.033,(now-last)/1000||0);last=now;if(G){step(dt);draw()}if(V==='game')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
