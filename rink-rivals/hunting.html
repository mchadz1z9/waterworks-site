<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Hunting</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }

.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; position:relative; z-index:1; }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl{ display:block; }
.viewbtn{ position:absolute; top:8px; right:8px; z-index:4; font:inherit; font-size:15px; color:#fff; background:rgba(5,8,18,.78); border:2px solid #ffd166; border-radius:999px; padding:3px 12px; cursor:pointer; }
.viewbtn:hover{ background:rgba(20,28,51,.95); }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
.st tr.dim td{ opacity:.55; }
.result{ align-items:flex-start; }
.bxw{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.bxs h3{ margin:6px 0 0; font-size:22px; } .bxs h3 img{ width:26px; height:26px; vertical-align:middle; }
.bxs small{ color:#93a0bd; }
.bxw .ls{ font-size:14px; } .bxw .ls th,.bxw .ls td{ padding:1px 6px; }
.result h2{ font-size:clamp(32px,6vw,60px); }
.potg{ margin:12px auto 0; max-width:420px; background:#141c33; border-left:8px solid var(--tc); border-radius:10px; padding:8px 14px; text-align:left; display:flex; flex-direction:column; }
.potg small{ color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:.06em; } .potg b{ font-size:24px; color:#fff; } .potg span{ color:#93a0bd; }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>

  <section class="hub" id="hub" aria-label="Season hub"></section>
</main>

/* ---------- the world: a 1.2 km reserve from a height grid (4 m), vegetation, trees, stands ---------- */
const WD={half:600,cell:6};
let HG=null, VG=null, HN=0, WL=0, WORLD=null, resI=0;
function rawH(x,z){ const R=RES[resI], d=Math.hypot(x,z);
  if(R.id==='mo'){ let h=16*fbm(x/260,z/260,11)+5*fbm(x/90,z/90,12,3)+12*ridge(x/420,z/420,13); const cz=Math.sin(x/140)*90+Math.sin(x/53)*25-60, dc=z-cz; h-=7*Math.exp(-dc*dc/160); return h; }
  if(R.id==='co'){ return sstep(220,580,d)*160+38*fbm(x/300,z/300,21)+26*ridge(x/170,z/170,22)*sstep(120,420,d)+7*fbm(x/70,z/70,23,3); }
  if(R.id==='sc'){ /* a glen with a loch, heather slopes rising to a ridge of hills */ const gl=z-Math.sin(x/230)*110; return 55*sstep(80,520,Math.abs(gl))+22*fbm(x/260,z/260,61)+14*ridge(x/200,z/200,62)*sstep(60,300,Math.abs(gl))+3*fbm(x/50,z/50,63,3); }
  let h=6*fbm(x/200,z/200,31)+2.5*fbm(x/55,z/55,32,3)+4*fbm(x/90,z/90,35,2); const nz=-z+fbm(x/300,7,33)*90; return h+230*sstep(230,620,nz)*(.55+.45*ridge(x/150,z/150,34)); }
function vegRaw(x,z,h){ const R=RES[resI]; if(h<WL+.4) return 0;
  if(R.id==='mo') return sstep(-.08,.2,fbm(x/200,z/200,41,3));
  if(R.id==='co') return sstep(8,30,h)*(1-sstep(150,178,h))*sstep(-.3,.12,fbm(x/150,z/150,42,3));
  if(R.id==='sc') return .55*sstep(-.05,.4,fbm(x/170,z/170,64,3))*(1-sstep(22,48,h-WL));
  return .6*sstep(-.1,.35,fbm(x/160,z/160,43,3))*(1-sstep(50,100,h)); }
function gridAt(A,x,z){ const c=WD.cell, fx=(x+WD.half)/c, fz=(z+WD.half)/c; if(fx<0||fz<0||fx>=HN-1||fz>=HN-1) return A===HG?60:0; const i=Math.floor(fx), j=Math.floor(fz), u=fx-i, v=fz-j;
  return lerp(lerp(A[i*HN+j],A[(i+1)*HN+j],u),lerp(A[i*HN+j+1],A[(i+1)*HN+j+1],u),v); }
const terrainH=(x,z)=>gridAt(HG,x,z), vegAt=(x,z)=>gridAt(VG,x,z);
const slopeAt=(x,z)=>Math.hypot(terrainH(x+1,z)-terrainH(x-1,z),terrainH(x,z+1)-terrainH(x,z-1))/2;
const inWater=(x,z)=>terrainH(x,z)<WL-.15;
const TGc=10, tkey=(i,j)=>i*4096+j; let TGm=new Map();
function treesNear(x,z,r){ const out=[], i0=Math.floor((x-r)/TGc), i1=Math.floor((x+r)/TGc), j0=Math.floor((z-r)/TGc), j1=Math.floor((z+r)/TGc); for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++){ const L=TGm.get(tkey(i,j)); if(L) for(const t of L) out.push(t); } return out; }
function mkWorld(ri){ if(WORLD&&WORLD.ri===ri) return; resI=ri; const R=RES[ri], rng=mulberry32(1000+ri*77), c=WD.cell;
  HN=Math.round(WD.half*2/c)+1; HG=new Float32Array(HN*HN); VG=new Float32Array(HN*HN);
  for(let i=0;i<HN;i++) for(let j=0;j<HN;j++) HG[i*HN+j]=rawH(-WD.half+i*c,-WD.half+j*c);
  { const s=Float32Array.from(HG).sort(); WL=s[Math.floor(s.length*R.water)]; }
  for(let i=0;i<HN;i++) for(let j=0;j<HN;j++){ const x=-WD.half+i*c, z=-WD.half+j*c; VG[i*HN+j]=vegRaw(x,z,HG[i*HN+j]); }
  const TR=[], BU=[], RK=[], ST=[], TG=new Map(); TGm=TG; const sp=R.id==='ak'?11:R.id==='mo'?13:12, lim=WD.half-6;
  for(let x=-lim;x<lim;x+=sp) for(let z=-lim;z<lim;z+=sp){ const tx=x+rng()*sp*.9, tz=z+rng()*sp*.9, h=terrainH(tx,tz), v=vegAt(tx,tz); if(h<WL+.3||slopeAt(tx,tz)>1.1) continue;
    if(rng()<v*(R.id==='ak'?.6:.8)){ let kind, s=.8+rng()*.45;
      if(R.id==='mo') kind=rng()<.15?'cedar':rng()<.3?'hickory':'oak';
      else if(R.id==='co') kind=h<70&&rng()<.75?'aspen':h>135?'fir':rng()<.5?'spruce':'aspen';
      else if(R.id==='sc') kind=rng()<.42?'birch':'fir';
      else kind=rng()<.22?'birch':'bspruce';
      const t={x:tx,z:tz,y:h,kind,s,r:(kind==='bspruce'?.12:kind==='aspen'||kind==='birch'?.16:kind==='cedar'?.2:.28)*s,col:rng()}; TR.push(t); const k=tkey(Math.floor(tx/TGc),Math.floor(tz/TGc)); if(!TG.has(k)) TG.set(k,[]); TG.get(k).push(t); }
    else if(rng()<(R.id==='ak'?.32:R.id==='sc'?.22:.1)+v*.25){ BU.push({x:tx+rng()*3,z:tz+rng()*3,y:h,s:.6+rng()*.9,kind:R.id==='ak'&&h-WL<6?'willow':R.id==='co'&&h>60?'sage':'brush',col:rng()}); }
    else if(rng()<.012+slopeAt(tx,tz)*.02) RK.push({x:tx,z:tz,y:h,s:.5+rng()*1.4,col:rng()}); }
  /* tree stands and ground blinds at forest edges looking over open ground */
  for(let k=0;k<500&&ST.length<6;k++){ const x=(rng()*2-1)*430, z=(rng()*2-1)*430, h=terrainH(x,z), v=vegAt(x,z); if(h<WL+1||v<.25||v>.7||slopeAt(x,z)>.25) continue;
    let best=null; for(let a=0;a<12;a++){ const dx=Math.sin(a/12*6.283), dz=Math.cos(a/12*6.283); let open=0; for(let r=15;r<=60;r+=15) if(vegAt(x+dx*r,z+dz*r)<.12&&!inWater(x+dx*r,z+dz*r)) open++; if(open>=3&&(!best||open>best.o)) best={o:open,yaw:Math.atan2(dx,dz)}; }
    if(!best||ST.some(s=>Math.hypot(s.x-x,s.z-z)<170)) continue; const blind=R.id!=='mo'&&ST.length%2===1; ST.push({x,z,y:h,yaw:best.yaw,blind,top:h+(blind?0:4.2)});
    for(const t of treesNear(x,z,4)) t.gone=true; }
  for(const [k,L] of TG) TG.set(k,L.filter(t=>!t.gone)); const TR2=TR.filter(t=>!t.gone);
  /* the lodge: a cabin on the edge of the reserve */ let cab=null; for(let k=0;k<400&&!cab;k++){ const a=rng()*6.283, r=430+rng()*60, x=Math.sin(a)*r, z=Math.cos(a)*r; if(terrainH(x,z)>WL+1.5&&slopeAt(x,z)<.12&&slopeAt(x+6,z)<.15) cab={x,z,y:terrainH(x,z),yaw:Math.atan2(-x,-z)}; }
  if(!cab) cab={x:0,z:400,y:terrainH(0,400),yaw:Math.PI};
  for(const t of treesNear(cab.x,cab.z,14)) t.gone=true; for(const [k,L] of TG) TG.set(k,L.filter(t=>!t.gone));
  WORLD={ri,TR:TR2.filter(t=>!t.gone),BU,RK,ST,cab,TG}; }
/* can an eye at a see b? (terrain only) */
function terrainLOS(a,b){ const n=Math.max(4,Math.ceil(Math.hypot(b[0]-a[0],b[2]-a[2])/6)); for(let i=1;i<n;i++){ const k=i/n, x=lerp(a[0],b[0],k), z=lerp(a[2],b[2],k), y=lerp(a[1],b[1],k); if(terrainH(x,z)>y-.05) return false; } return true; }
/* how much do trees and brush hide the line from a to b (1 = clear) */
function coverLOS(a,b){ const dx=b[0]-a[0], dz=b[2]-a[2], L=Math.hypot(dx,dz)||1; let k=1; const n=Math.max(3,Math.ceil(L/8)); let vs=0; for(let i=1;i<n;i++) vs+=vegAt(a[0]+dx*i/n,a[2]+dz*i/n); k*=Math.max(.15,1-vs/n*Math.min(1,L/60)*.85);
  const mx=(a[0]+b[0])/2, mz=(a[2]+b[2])/2; for(const t of treesNear(mx,mz,L/2+2)){ const px=t.x-a[0], pz=t.z-a[2], u=(px*dx+pz*dz)/(L*L); if(u<=0||u>=1) continue; const ex=a[0]+dx*u-t.x, ez=a[2]+dz*u-t.z; if(Math.hypot(ex,ez)<t.r+.35) k*=.45; } return k; }

/* yaw 0 looks along +z = north on the map; yaw grows to the west, so east is -x */
const bearing=(dx,dz)=>Math.atan2(-dx,dz);

/* ---------- zeroing: the bore is 4 cm under the scope and tilted up so the bullet crosses the sight line at the zero range ---------- */
function flight2D(g,ang,dist){ let x=0, y=-.04, z=0, vx=g.v0*Math.cos(ang), vy=g.v0*Math.sin(ang), vz=0, t=0; const dt=g.bow?1/1000:1/4000;
  /* with a 1 m/s crosswind, for the drift table */ while(x<dist&&t<4){ const wz=vz-1, v=Math.hypot(vx,vy,wz); vx-=g.k*v*vx*dt; vy-=(g.k*v*vy+G)*dt; vz-=g.k*v*wz*dt; x+=vx*dt; y+=vy*dt; z+=vz*dt; t+=dt; } return {y,t,v:Math.hypot(vx,vy),z}; }
for(const g of GUNS){ let lo=-.02, hi=.08; for(let i=0;i<40;i++){ const m=(lo+hi)/2; if(flight2D(g,m,g.z).y<0) lo=m; else hi=m; } g.zero=(lo+hi)/2;
  g.table=(g.bow?[20,30,40,50]:g.shot?[20,30,40]:[100,200,300,400,500]).map(d=>{ const f=flight2D(g,g.zero,d); return {d,drop:f.y,mil:-f.y/d*1000,t:f.t,E:.5*g.m*f.v*f.v,drift:f.z}; }); }

/* ---------- the animals ---------- */
function hab(sp,x,z){ const h=terrainH(x,z), v=vegAt(x,z), wet=sstep(6,0,h-WL), sl=slopeAt(x,z); if(h<WL+.3||sl>.7||Math.abs(x)>WD.half-60||Math.abs(z)>WD.half-60) return -1;
  const edge=1-Math.abs(v-.4)*2;
