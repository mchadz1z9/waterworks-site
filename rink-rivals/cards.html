<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Cards</title>
<style>
:root{--bg:#0a0612;--p1:#140d22;--p2:#1f1533;--line:#2e2147;--tx:#f5f0ff;--mut:#a99bc6;--acc:linear-gradient(135deg,#f59e0b,#ec4899 55%,#8b5cf6)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui}
#hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:1100px;margin:0 auto}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal}
#hd .sp{flex:1}#hd a.b{background:var(--p2);border-radius:18px;padding:7px 13px;font:600 13px system-ui}
main{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
.btn{border:0;border-radius:12px;padding:12px 18px;font:900 15px system-ui;background:var(--acc);color:#fff}.btn.g{background:var(--p2);color:var(--tx)}
.note{color:var(--mut);font-size:14px}
.cardx{position:relative;width:120px;aspect-ratio:5/7;border-radius:12px;padding:8px;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));border:3px solid var(--rc);box-shadow:0 6px 18px rgba(0,0,0,.45);display:flex;flex-direction:column;user-select:none;flex:none}
.cardx .r{font:900 26px/1 system-ui;text-shadow:0 2px 4px rgba(0,0,0,.5)}.cardx .ps{font:800 11px system-ui;opacity:.9}
.cardx .ic{flex:1;display:grid;place-items:center;font-size:30px}
.cardx .nm{font:800 12px/1.15 system-ui;text-shadow:0 1px 3px rgba(0,0,0,.6);min-height:28px}
.cardx .st{display:flex;justify-content:space-between;font:800 10px system-ui;background:rgba(0,0,0,.35);border-radius:6px;padding:3px 5px;margin-top:4px}
.cardx .st b{font-size:12px}.cardx .st .hl{color:#fde047}
.cardx.sel{outline:3px solid #fde047;outline-offset:2px}.cardx.used{opacity:.25;filter:grayscale(1)}.cardx.back{background:repeating-linear-gradient(45deg,#3b2a5e,#3b2a5e 8px,#2a1d45 8px,#2a1d45 16px);border-color:#6d28d9}
.cardx .cnt{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border-radius:6px;padding:1px 5px;font:800 11px system-ui}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.deck{display:flex;gap:10px;flex-wrap:wrap;min-height:170px;background:var(--p1);border:1px dashed var(--line);border-radius:16px;padding:12px;margin-bottom:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
select{border:1px solid var(--line);background:var(--p1);color:var(--tx);border-radius:10px;padding:9px 12px}
.arena{background:radial-gradient(800px 300px at 50% 50%,#2a1a48,transparent),var(--p1);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.score{display:flex;justify-content:center;align-items:center;gap:18px;font:900 28px system-ui;margin-bottom:8px}.score small{font:700 13px system-ui;color:var(--mut);display:block}
.stat{display:inline-block;font:900 22px system-ui;background:var(--acc);border-radius:999px;padding:8px 20px;margin:6px 0 12px;box-shadow:0 0 30px #ec489966}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.mid{display:flex;justify-content:center;align-items:center;gap:30px;min-height:190px}.vs{font:900 26px system-ui;color:var(--mut)}
.msg{font:800 18px system-ui;min-height:26px;margin:6px 0}
.lbl{font:800 13px system-ui;color:var(--mut);margin-top:10px}
@keyframes pop{0%{transform:scale(.6) rotateY(90deg)}100%{transform:scale(1) rotateY(0)}}.pop{animation:pop .45s ease-out}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
@media(max-width:600px){.cardx{width:92px;padding:6px}.cardx .r{font-size:20px}.cardx .ic{font-size:22px}.cardx .nm{font-size:10px}.mid{gap:12px}}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a class="bk" href="./" title="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><a id="logo" href="cards"><i>🃏</i>Rival Cards</a><span class="sp"></span><a class="b" href="packs">🎁 Open packs</a></header>
<main id="main"></main>
<script src="packs-data.js"></script>
<script>
let NET=null;
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ls={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
  /* the same cards as Pack Rip */
  const D=window.PACKDATA||{}, SP={hockey:['🏒','nhl','NHL'],football:['🏈','nfl','NFL'],basketball:['🏀','nba','NBA'],baseball:['⚾','mlb','MLB'],soccer:['⚽','soc','SOC']};
  const RARC=['#a16207','#94a3b8','#facc15','#38bdf8','#f59e0b','#f472b6'], RARN=['Bronze','Silver','Gold','Elite','Icon','Legend'];
  const ALL=[]; for(const [sp,[e,lg,K]] of Object.entries(SP)){ for(const leg of [0,1]) for(const p of (D[K+(leg?'_LEG':'_NOW')]||[])){ const r=p[4], rar=leg?4:r>=95?4:r>=90?3:r>=85?2:r>=78?1:0; const t=(D.TEAMS||{})[lg+':'+p[1]]||[p[1],'#334155','#94a3b8'];
      ALL.push({id:sp+':'+p[0]+(leg?':L':''),sp,name:p[0],team:t[0],c1:t[1],c2:t[2],pos:p[2],r,rar}); } }
  for(const k of D.KIDS||[]) ALL.push({id:'kid:'+k[0],sp:'kid',name:k[0],team:'Arcade Rivals',c1:'#a855f7',c2:'#22d3ee',pos:'⭐',r:k[1],rar:5});
  const BY={}; for(const c of ALL) BY[c.id]=c;
  /* battle stats from rating, position and rarity (the same for everyone) */
  const hs=s=>{ let h=2166136261; for(const c of s) h=Math.imul(h^c.charCodeAt(0),16777619); return h>>>0; };
  const OFF=/^(QB|WR|TE|C|LW|RW|F|ST|CF|LF|RF|SF|SG|PG|1B|DH|CAM|LM|RM|W)$/, DEF=/^(D|G|GK|CB|S|LB|DE|DT|CB|C\b|PF|CDM|LB|RB_D|P|SP|RP|CB)$/, SPD=/^(RB|WR|LW|RW|PG|SG|CF|LF|RF|SS|W|LM|RM)$/;
  function stats(c){ const h=hs(c.id), j=k=>((h>>(k*5))&15)-7, b=c.rar; let a=c.r+j(0)*.6, d=c.r+j(1)*.6, s=c.r+j(2)*.6;
    if(OFF.test(c.pos)) a+=5; if(DEF.test(c.pos)) d+=6; if(SPD.test(c.pos)) s+=5; if(c.pos==='⭐'){ a+=3; d+=3; s+=3; }
    const cl=v=>Math.max(40,Math.min(110,Math.round(v+b))); return {ATK:cl(a),DEF:cl(d),SPD:cl(s)}; }
  const STATN={ATK:'⚔️ Attack',DEF:'🛡️ Defense',SPD:'⚡ Speed'};
  const own=()=>ls.get('pk_own',{});
  const ROOK=['Rookie Ace','Rookie Blaze','Rookie Comet','Rookie Dash','Rookie Echo'].map((n,i)=>({id:'rook:'+i,sp:'kid',name:n,team:'Rookies',c1:'#475569',c2:'#1e293b',pos:['QB','RB','WR','D','G'][i],r:70+i,rar:0}));
  for(const c of ROOK) BY[c.id]=c;
  const card=(c,o)=>{ o=o||{}; if(o.back) return `<div class="cardx back${o.cls?' '+o.cls:''}"></div>`; const S=stats(c), e=c.sp==='kid'?'🕹️':SP[c.sp][0];
    return `<div class="cardx${o.cls?' '+o.cls:''}" style="--c1:${esc(c.c1)};--c2:${esc(c.c2)};--rc:${RARC[c.rar]}" ${o.attr||''}><div class="r">${c.r}</div><div class="ps">${esc(c.pos)} · ${RARN[c.rar]}</div>${o.cnt>1?`<span class="cnt">×${o.cnt}</span>`:''}<div class="ic">${e}</div><div class="nm">${esc(c.name)}</div><div class="st">${['ATK','DEF','SPD'].map(k=>`<span class="${o.hl===k?'hl':''}">${k[0]}<b>${S[k]}</b></span>`).join('')}</div></div>`; };
  let deck=ls.get('rc_deck',[]).filter(id=>BY[id]), sport='all', M=null;
  function fullDeck(){ const d=deck.slice(0,5); let i=0; while(d.length<5) d.push(ROOK[i++].id); return d; }
  /* ---------- deck builder ---------- */
  function home(){ const O=own(), ids=Object.keys(O).filter(id=>BY[id]&&(sport==='all'||BY[id].sp===sport)).sort((a,b)=>BY[b].r-BY[a].r);
    const W=ls.get('rc_rec',{w:0,l:0});
    $('main').innerHTML=`<p class="note">Pick 5 cards from your collection. Each battle is first to 3 rounds: a stat is shown, both players secretly play a card, and the higher stat wins the round. Your record: <b>${W.w}–${W.l}</b>.</p>
      <div class="lbl">🧩 Your deck (${deck.length}/5)${deck.length<5?' · empty spots use Rookie cards':''}</div><div class="deck" id="deck">${fullDeck().map((id,i)=>card(BY[id],{attr:`data-rm="${id}"`,cls:id.startsWith('rook:')?'used':''})).join('')}</div>
      <div class="bar"><button class="btn" id="cpu">🤖 Battle the computer</button><button class="btn g" id="pvp">🌐 Battle a friend</button><button class="btn g" id="auto">✨ Best 5</button></div>
      <div class="bar"><span class="lbl" style="margin:0">📚 Your collection (${Object.keys(O).length} cards)</span><select id="sp"><option value="all">All sports</option>${Object.entries(SP).map(([k,v])=>`<option value="${k}" ${k===sport?'selected':''}>${v[0]} ${v[2]}</option>`).join('')}<option value="kid" ${sport==='kid'?'selected':''}>🕹️ Classmates</option></select></div>
      <div class="grid">${ids.length?ids.slice(0,300).map(id=>card(BY[id],{cnt:O[id],attr:`data-add="${id}"`,cls:deck.includes(id)?'sel':''})).join(''):'<p class="note">No cards yet. <a href="packs" style="color:#f9a8d4;font-weight:800">Open some packs</a> to get players, or battle with Rookie cards.</p>'}</div>`;
    $('sp').onchange=e=>{ sport=e.target.value; home(); };
    $('auto').onclick=()=>{ deck=Object.keys(own()).filter(id=>BY[id]).sort((a,b)=>BY[b].r-BY[a].r).slice(0,5); ls.set('rc_deck',deck); home(); };
    $('cpu').onclick=()=>start(null); $('pvp').onclick=()=>{ if(NET&&NET.open) NET.open(); else alert('Online play is loading, try again in a second.'); }; }
  document.addEventListener('click',e=>{ const a=e.target.closest('[data-add]'); if(a&&!M){ const id=a.dataset.add; deck=deck.includes(id)?deck.filter(x=>x!==id):deck.length<5?deck.concat(id):deck; ls.set('rc_deck',deck); home(); return; }
    const r=e.target.closest('[data-rm]'); if(r&&!M&&!r.dataset.rm.startsWith('rook:')){ deck=deck.filter(x=>x!==r.dataset.rm); ls.set('rc_deck',deck); home(); return; }
    const p=e.target.closest('[data-play]'); if(p&&M) play(+p.dataset.play); });
  /* ---------- battle ---------- */
  function cpuDeck(avg){ const pool=ALL.filter(c=>Math.abs(c.r-avg)<=6); const out=[]; const used=new Set(); while(out.length<5&&pool.length){ const c=pool[Math.floor(Math.random()*pool.length)]; if(!used.has(c.id)){ used.add(c.id); out.push(c.id); } } return out.length===5?out:ROOK.map(c=>c.id); }
  function start(net,oppDeck,seed){ const mine=fullDeck(); const avg=mine.reduce((s,id)=>s+BY[id].r,0)/5;
    const sd=seed||Math.floor(Math.random()*1e9); const order=[]; let x=sd; for(let i=0;i<5;i++){ x=Math.imul(x^x>>>15,1|x)+0x6D2B79F5>>>0; order.push(['ATK','DEF','SPD'][x%3]); }
    M={net:!!net,me:mine,opp:oppDeck||cpuDeck(avg),used:[],oused:[],round:0,w:0,l:0,stats:order,myPick:-1,oppPick:-1,oppName:net?((NET&&NET.peers[0]||{}).name||'Friend'):'Computer',busy:false}; draw(); }
  function draw(msg){ const st=M.stats[M.round];
    $('main').innerHTML=`<div class="arena"><div class="score"><div>${M.w}<small>You</small></div><div style="color:var(--mut)">–</div><div>${M.l}<small>${esc(M.oppName)}</small></div></div>
      ${M.done?'':`<div class="note">Round ${M.round+1} · this round is</div><div class="stat">${STATN[st]}</div>`}
      <div class="lbl">${esc(M.oppName)}</div><div class="row">${M.opp.map((id,i)=>card(BY[id]||ROOK[0],{back:!M.oused.includes(i)||true,cls:M.oused.includes(i)?'used':''})).join('')}</div>
      <div class="mid" id="mid"><div id="mineSlot"></div><div class="vs">VS</div><div id="oppSlot"></div></div>
      <div class="msg" id="msg">${msg||(M.done?'':M.myPick>=0?'Waiting for '+esc(M.oppName)+'…':'Pick a card to play!')}</div>
      <div class="lbl">Your hand</div><div class="row">${M.me.map((id,i)=>card(BY[id],{hl:st,cls:M.used.includes(i)?'used':'',attr:M.used.includes(i)||M.myPick>=0||M.done?'':`data-play="${i}"`})).join('')}</div>
      ${M.done?`<div class="bar" style="justify-content:center"><button class="btn" id="again">${M.net?'Back':'Play again'}</button><button class="btn g" id="home">Change deck</button></div>`:''}</div>`;
    if(M.done){ $('again').onclick=()=>{ if(M.net){ M=null; home(); } else start(null); }; $('home').onclick=()=>{ M=null; home(); }; } }
  function play(i){ if(M.busy||M.used.includes(i)||M.myPick>=0||M.done) return; M.myPick=i;
    if(M.net){ NET.send({t:'pick',r:M.round,i}); draw(); if(M.oppPick>=0) reveal(); return; }
    /* computer: plays its best card for this stat about 70% of the time */
    const st=M.stats[M.round], left=M.opp.map((id,k)=>k).filter(k=>!M.oused.includes(k)); left.sort((a,b)=>stats(BY[M.opp[b]]||ROOK[0])[st]-stats(BY[M.opp[a]]||ROOK[0])[st]);
    M.oppPick=Math.random()<.7?left[0]:left[Math.floor(Math.random()*left.length)]; reveal(); }
  function reveal(){ M.busy=true; const st=M.stats[M.round], a=BY[M.me[M.myPick]], b=BY[M.opp[M.oppPick]]||ROOK[0], sa=stats(a)[st], sb=stats(b)[st];
    draw(); $('mineSlot').innerHTML=card(a,{hl:st,cls:'pop'}); $('oppSlot').innerHTML=card(b,{hl:st,cls:'pop'});
    const win=sa>sb||(sa===sb&&a.r>b.r), tie=sa===sb&&a.r===b.r; $('msg').textContent=tie?`Tie! ${sa} vs ${sb}`:win?`You win the round! ${sa} vs ${sb}`:`${M.oppName} wins the round. ${sa} vs ${sb}`;
    setTimeout(()=>{ M.used.push(M.myPick); M.oused.push(M.oppPick); if(!tie){ if(win) M.w++; else M.l++; } M.round++; M.myPick=-1; M.oppPick=-1; M.busy=false;
      if(M.w>=3||M.l>=3||M.round>=5){ M.done=true; const won=M.w>M.l; const R=ls.get('rc_rec',{w:0,l:0}); if(won) R.w++; else if(M.l>M.w) R.l++; ls.set('rc_rec',R);
        let coins=won?(M.net?80:40):10; const day=new Date().toDateString(), dc=ls.get('rc_day',{d:'',n:0}); if(dc.d!==day){ dc.d=day; dc.n=0; } if(!M.net&&won){ if(dc.n>=10) coins=5; dc.n++; ls.set('rc_day',dc); }
        try{ window.RRCOIN&&RRCOIN.add(coins,won?'Rival Cards win':'Rival Cards'); }catch(e){}
        draw(won?`🏆 You won ${M.w}–${M.l}! +${coins} 🪙`:M.w===M.l?`It's a draw! +${coins} 🪙`:`😤 ${M.oppName} won ${M.l}–${M.w}. +${coins} 🪙 for playing`); }
      else { draw(); if(M.net&&M.oppPick>=0) reveal(); } },1700); }
  /* ---------- online: 2 players, each sends their deck; the host picks the round stats ---------- */
  function netReady(){ if(!window.RRO) return setTimeout(netReady,400);
    NET=RRO.init({game:'cards',maxPlayers:2,minPlayers:2,blurb:'Card battle with a friend: same stats each round, both play a card at once, first to 3 wins.',
      onStart:()=>{ NET.send({t:'deck',d:fullDeck(),seed:Math.floor(Math.random()*1e9)}); },
      onMsg:m=>{ if(m.t==='deck'){ const opp=(m.d||[]).filter(id=>BY[id]).slice(0,5); while(opp.length<5) opp.push(ROOK[opp.length].id);
          const seed=NET.isHost()?(window.__rcSeed=window.__rcSeed||Math.floor(Math.random()*1e9)):0; if(NET.isHost()){ NET.send({t:'seed',s:seed}); start(true,opp,seed); } else { window.__rcOpp=opp; if(window.__rcSeedIn) start(true,opp,window.__rcSeedIn); } }
        if(m.t==='seed'){ window.__rcSeedIn=+m.s; if(window.__rcOpp&&!NET.isHost()) start(true,window.__rcOpp,+m.s); }
        if(m.t==='pick'&&M&&M.net&&+m.r===M.round){ M.oppPick=+m.i; if(M.myPick>=0&&!M.busy) reveal(); else draw(); } } }); }
  home(); netReady();
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
