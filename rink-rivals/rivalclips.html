<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Clips</title>
<style>
:root{--bg:#0d0d12;--bg2:#17171f;--bg3:#24242e;--tx:#f1f1f4;--mut:#a3a3b2;--acc:linear-gradient(135deg,#f59e0b,#ec4899 60%,#8b5cf6)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
#hd{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg)}
#menu{background:none;border:0;color:var(--tx);font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer}#menu:hover{background:var(--bg3)}
#logo{display:flex;align-items:center;gap:7px;font:900 20px system-ui;letter-spacing:-.02em;white-space:nowrap}
#logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc);font:900 13px system-ui;font-style:normal;color:#fff;box-shadow:0 0 14px rgba(236,72,153,.5)}
#sf{flex:1;max-width:640px;margin:0 auto;display:flex}
#q{flex:1;min-width:0;height:40px;padding:0 16px;border:1px solid #33333f;border-right:0;border-radius:20px 0 0 20px;background:#121218;color:var(--tx);font-size:16px;outline:none}#q:focus{border-color:#8b5cf6}
#sb{width:64px;height:40px;border:1px solid #33333f;border-radius:0 20px 20px 0;background:var(--bg3);color:var(--tx);font-size:17px;cursor:pointer}
#arc{background:var(--bg3);border-radius:18px;padding:8px 14px;font:600 14px system-ui;white-space:nowrap}
#lay{display:flex}
#nav{position:sticky;top:56px;height:calc(100vh - 56px);width:228px;flex:none;overflow-y:auto;padding:8px 12px 20px;scrollbar-width:thin}
#nav a{display:flex;align-items:center;gap:20px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav a:hover{background:var(--bg2)}#nav a.on{background:var(--bg3);font-weight:600}
#nav a span{width:24px;text-align:center;font-size:18px;flex:none}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC{display:none!important}
#nav{padding-bottom:140px!important}
#nav hr{border:0;border-top:1px solid #2a2a35;margin:10px 0}#nav h4{margin:6px 12px;font:600 15px system-ui}
body.mini #nav{width:76px;padding:4px}body.mini #nav a{flex-direction:column;gap:4px;height:auto;padding:14px 0 12px;font-size:10px;justify-content:center}body.mini #nav .x{display:none}
#main{flex:1;min-width:0;padding:0 24px 40px}
#chips{position:sticky;top:56px;z-index:40;display:flex;gap:12px;overflow-x:auto;padding:12px 0;background:var(--bg);scrollbar-width:none}#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:8px;padding:7px 12px;background:var(--bg3);color:var(--tx);font:500 14px system-ui;cursor:pointer}.chip.on{background:var(--tx);color:#0d0d12}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 16px;padding-top:12px}
.v{display:block;cursor:pointer;min-width:0}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.th .bl{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(18px) brightness(.55)}
.th .fg{position:absolute;top:0;bottom:0;left:50%;width:31.64%;transform:translateX(-50%);background-size:auto 100%;background-position:center}
.th .full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .rc{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);border-radius:4px;padding:2px 5px;font:600 11px system-ui;letter-spacing:.01em}
.th .rc b{background:var(--acc);-webkit-background-clip:text;background-clip:text;color:transparent}
.v:hover .th{border-radius:0;transition:border-radius .2s}
.mt{display:flex;gap:12px;margin-top:12px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px system-ui;color:#fff}
.mt h3{margin:0 0 4px;font:600 16px/1.35 system-ui;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt p{margin:0;color:var(--mut);font-size:14px;line-height:1.4}
#sent{height:60px}
.shelf{grid-column:1/-1;border-top:1px solid #2a2a35;border-bottom:1px solid #2a2a35;padding:16px 0 18px}
.shelf h2{margin:0 0 12px;font:700 20px system-ui}
.srow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:8px;overflow-x:auto;scrollbar-width:thin}
.st{display:block;min-width:0}.st .sth{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#111 center/auto 100% no-repeat}
.st .sth .rc{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.7);border-radius:4px;padding:2px 5px;font:600 10px system-ui}.st .sth .rc b{background:var(--acc);-webkit-background-clip:text;background-clip:text;color:transparent}
.st h3{margin:8px 2px 0;font:600 14px/1.3 system-ui;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:800px){.srow{grid-auto-columns:42vw}}
.note{color:var(--mut);padding:30px 0;font-size:14px}
/* search results: list layout */
.list .v{display:flex;gap:16px}.list .th{width:min(360px,45%);flex:none}.list .mt{margin-top:0}.list .mt h3{font-size:18px;font-weight:500}
.list{grid-template-columns:1fr;gap:16px}
/* watch page */
#watch{display:flex;gap:24px;padding-top:24px}
#wl{flex:1;min-width:0}
#pl{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
#pl.sh{aspect-ratio:auto;height:min(78vh,900px)}
#pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#pl.sh iframe{left:50%;width:min(100%,calc(min(78vh,900px)*9/16));transform:translateX(-50%)}
#wt{margin:12px 0 8px;font:700 20px/1.3 system-ui}
#wr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#wr .ch b{display:block;font-size:16px}#wr .ch small{color:var(--mut);font-size:12px}
.pill{border:0;border-radius:18px;padding:8px 16px;background:var(--bg3);color:var(--tx);font:600 14px system-ui;cursor:pointer}.pill.on{background:var(--tx);color:#0d0d12}
#wr .sp{flex:1}
#desc{margin-top:12px;background:var(--bg2);border-radius:12px;padding:12px;font-size:14px;color:#d4d4dc}
#up{width:402px;flex:none}
#up .v{display:flex;gap:8px;margin-bottom:8px}#up .th{width:168px;flex:none;border-radius:8px}#up .mt{margin:0;display:block}#up .mt h3{font-size:14px}#up .mt p{font-size:12px}#up .av{display:none}
@media(max-width:1100px){#watch{flex-direction:column}#up{width:auto}}
@media(max-width:800px){#nav{display:none}body.navopen #nav{display:block;position:fixed;left:0;background:var(--bg);z-index:60;width:240px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}#main{padding:0 12px 40px}#arc{display:none}#logo span{display:none}.grid{grid-template-columns:1fr;gap:24px}.list .v{display:block}.list .th{width:auto}.list .mt{margin-top:12px}#watch{padding-top:0;margin:0 -12px}#pl{border-radius:0}#wt,#wr,#desc,#up{margin-left:12px;margin-right:12px}#pl.sh{height:72vh}}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui;text-decoration:none}.bk:hover{background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a class="bk" href="./" title="Back" aria-label="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><button id="menu" aria-label="Menu">☰</button><a id="logo" href="rivalclips"><i>RC</i><span>Rival Clips</span></a>
  <form id="sf" role="search"><input id="q" placeholder="Search" autocomplete="off" enterkeyhint="search"><button id="sb" aria-label="Search">🔍</button></form>
  <a id="arc" href="./">← Arcade</a></header>
<div id="lay"><nav id="nav"></nav><main id="main"></main></div>
<script src="clips-data.js"></script>
<script>
(function(){
  const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SERVER=(()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })();
  const LS={get(k,d){ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
  let V=[], byId=new Map(), CATS=[], LONG=[], SHORT=[]; const base=k=>String(k||'').replace(/ shorts$/,'');
  /* every clip, YouTube ones only, with a fixed shuffle that changes once a day */
  const day=Math.floor(Date.now()/864e5); const hsh=s=>{ let h=day*2654435761>>>0; for(let i=0;i<s.length;i++) h=Math.imul(h^s.charCodeAt(i),16777619)>>>0; return h; };
  function ingest(){ const A=(window.RR_CLIPS||[]).filter(c=>c.src==='yt'&&c.yt); if(A.length===V.length) return false;
    for(const c of A) if(c._k===undefined) c._k=hsh(c.yt); V=A.slice().sort((a,b)=>a._k-b._k); byId=new Map(V.map(c=>[c.yt,c]));
    const n={}; for(const c of V) n[c.cat]=(n[c.cat]||0)+1; const b={}; for(const [k,v] of Object.entries(n)) b[base(k)]=(b[base(k)]||0)+v; CATS=Object.entries(b).filter(e=>e[1]>=60).sort((a,b)=>b[1]-a[1]).map(e=>e[0]); LONG=V.filter(c=>!c.short); SHORT=V.filter(c=>c.short); return true; }
  const COL=['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
  const av=by=>`<div class="av" style="background:${COL[hsh(by||'?')%COL.length]}">${esc((by||'?').trim().charAt(0).toUpperCase())}</div>`;
  const dur=s=>{ s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,'0'); return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x; };
  const thumb=c=>{ const u=`https://i.ytimg.com/vi/${c.yt}/hqdefault.jpg`; return c.short?`<div class="th"><div class="bl" style="background-image:url('${u}')"></div><div class="fg" style="background-image:url('${u}')"></div><span class="rc"><b>Rival Clips</b></span></div>`:`<div class="th"><img class="full" loading="lazy" src="https://i.ytimg.com/vi/${c.yt}/mqdefault.jpg" alt=""><span class="rc"><b>Rival Clips</b>${c.d?' · '+dur(c.d):''}</span></div>`; };
  const card=c=>`<a class="v" href="?v=${c.yt}" data-v="${c.yt}">${thumb(c)}<div class="mt">${av(c.by)}<div><h3>${esc(c.title)}</h3><p>${esc(c.by||'')}<br>Rival Clips</p></div></div></a>`;
  const stile=c=>`<a class="st" href="?v=${c.yt}"><div class="sth" style="background-image:url('https://i.ytimg.com/vi/${c.yt}/hqdefault.jpg')"><span class="rc"><b>Rival Clips</b></span></div><h3>${esc(c.title)}</h3></a>`;
  const shelf=L=>L.length?`<section class="shelf"><h2>📱 Shorts</h2><div class="srow">${L.map(stile).join('')}</div></section>`:'';
  /* the background image of each Shorts tile only loads when it comes near the screen */
  let io=null; const lazyBg=root=>{ if(!('IntersectionObserver' in window)) return; if(!io) io=new IntersectionObserver(es=>{ for(const e of es) if(e.isIntersecting){ const t=e.target; (t.matches('[data-bg]')?[t]:[]).concat([...t.querySelectorAll('[data-bg]')]).forEach(d=>{ d.style.backgroundImage=d.dataset.bg; d.removeAttribute('data-bg'); }); io.unobserve(t); } },{rootMargin:'600px'}); root.querySelectorAll('.th,.sth').forEach(t=>{ if(t.matches('[data-bg]')||t.querySelector('[data-bg]')) io.observe(t); }); };
  const fix=h=>h.replace(/style="background-image:(url\('[^']+'\))"/g,'data-bg="$1"');
  let feedObs=null;
  function feed(list,cls,top,SH){ let si=0, nextShelf=12; const M=$('#main'); M.innerHTML=(top||'')+`<div class="grid ${cls||''}" id="g"></div><div id="sent"></div>`; let i=0; const g=$('#g');
    const more=()=>{ const tmp=document.createElement('div'); let h=''; for(const c of list.slice(i,i+36)){ h+=card(c); if(SH&&SH.length&&++si===nextShelf){ h+=shelf(SH.slice((si/12|0)*12%Math.max(1,SH.length-12)).slice(0,12)); nextShelf+=48; } } tmp.innerHTML=fix(h); lazyBg(tmp); while(tmp.firstChild) g.appendChild(tmp.firstChild); i+=36; if(i>=list.length&&feedObs){ feedObs.disconnect(); feedObs=null; } };
    if(feedObs){ feedObs.disconnect(); feedObs=null; } more(); if(!list.length) g.innerHTML='<div class="note">Nothing here yet.</div>';
    if(i<list.length&&'IntersectionObserver' in window){ feedObs=new IntersectionObserver(e=>{ if(e[0].isIntersecting) more(); },{rootMargin:'1200px'}); feedObs.observe($('#sent')); } return { add(L){ list=list.concat(L); if(!feedObs&&i<list.length){ more(); } } }; }
  function nav(cur){ const it=[['home','🏠','Home','rivalclips'],['shorts','📱','Shorts','clips'],['hist','🕘','History','?h=1'],['liked','👍','Liked','?l=1'],['tv','📺','Rival TV','tv']];
    $('#nav').innerHTML=it.map(([k,i,t,h])=>`<a href="${h}" class="${k===cur?'on':''}" data-k="${k}"><span>${i}</span>${t}</a>`).join('')+`<div class="x"><hr><h4>Explore</h4>${CATS.map(c=>`<a href="?c=${encodeURIComponent(c)}" class="${c===cur?'on':''}"><span>${c.split(' ')[0]}</span>${esc(c.split(' ').slice(1).join(' '))}</a>`).join('')}<hr><a href="./"><span>🎮</span>Arcade Rivals</a></div>`; }
  function chips(cur){ return `<div id="chips">${[['','All']].concat(CATS.map(c=>[c,c])).map(([k,t])=>`<button class="chip${k===cur?' on':''}" data-chip="${esc(k)}">${esc(t)}</button>`).join('')}</div>`; }
  /* search: our own list first, then YouTube's live results (kid-filtered on our server) */
  let sTok=0;
  function search(q){ const t=++sTok, w=q.toLowerCase().split(/\s+/).filter(Boolean);
    const L=V.filter(c=>{ const s=(c.title+' '+c.by+' '+c.cat).toLowerCase(); return w.every(x=>s.includes(x)); }).slice(0,600);
    const f=feed(L,'list',`<div class="note" id="sn" style="padding:14px 0 0">${L.length?'':'Searching…'}</div>`);
    let next='', busy=false, got=0; const live=()=>{ if(busy) return; busy=true; fetch(SERVER+'/yts?q='+encodeURIComponent(q)+(next?'&p='+next:'')).then(r=>r.json()).then(d=>{ busy=false; if(t!==sTok) return; const have=new Set(L.map(c=>c.yt));
      const add=(d.items||[]).filter(x=>!have.has(x.yt)&&!byId.has(x.yt)).map(x=>({yt:x.yt,title:x.title,by:x.by,cat:'🔎 Search',live:1}));
      add.forEach(c=>byId.set(c.yt,c)); got+=add.length; f.add(add); next=d.next||'';
      const sn=$('#sn'); if(sn) sn.textContent=d.blocked?'That search isn\'t allowed on Rival Clips.':(!(L.length+got)?'No results.':''); if(next&&add.length&&!$('#lm')) $('#main').insertAdjacentHTML('beforeend','<div style="text-align:center"><button class="pill" id="lm">Show more</button></div>'); else if(!next){ const b=$('#lm'); if(b) b.remove(); } }).catch(()=>{ busy=false; const sn=$('#sn'); if(sn&&!(L.length+got)) sn.textContent='No results.'; }); };
    live(); document.onclick2=e=>{ if(e.target.id==='lm') live(); }; }
  function watch(id){ const c=byId.get(id)||{yt:id,title:'',by:'',cat:''};
    const h=LS.get('rcHist',[]).filter(x=>x!==id); h.unshift(id); LS.set('rcHist',h.slice(0,200));
    const liked=LS.get('rcLiked',[]).includes(id);
    const same=(c.short?SHORT:LONG.length?LONG:V).filter(x=>base(x.cat)===base(c.cat)&&x.yt!==id), up=same.slice(hsh(id)%Math.max(1,same.length-30)).slice(0,24).concat(V.slice(0,6));
    $('#main').innerHTML=`<div id="watch"><div id="wl"><div id="pl" class="${c.short?'sh':''}"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(c.title)}"></iframe></div>
      <h1 id="wt">${esc(c.title||'Rival Clips video')}</h1><div id="wr">${av(c.by)}<div class="ch"><b>${esc(c.by||'')}</b><small>on Rival Clips</small></div><span class="sp"></span><button class="pill${liked?' on':''}" id="lk">👍 ${liked?'Liked':'Like'}</button><button class="pill" id="sh">↗ Share</button></div>
      <div id="desc">${esc(c.cat||'')}<br>Watching on <b>Rival Clips</b> by Arcade Rivals.</div></div><div id="up">${fix(up.map(card).join(''))}</div></div>`;
    lazyBg($('#up')); document.title=(c.title||'Video')+' - Rival Clips'; scrollTo(0,0);
    $('#lk').onclick=()=>{ let l=LS.get('rcLiked',[]); const on=!l.includes(id); l=on?[id].concat(l):l.filter(x=>x!==id); LS.set('rcLiked',l.slice(0,300)); $('#lk').classList.toggle('on',on); $('#lk').textContent='👍 '+(on?'Liked':'Like'); };
    $('#sh').onclick=()=>{ const u=location.origin+'/rivalclips?v='+id; (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{ $('#sh').textContent='✓ Link copied'; }).catch(()=>prompt('Copy this link',u)); }; }
  function route(){ const p=new URLSearchParams(location.search), v=p.get('v'), q=p.get('q'), c=p.get('c')||''; document.body.classList.remove('navopen');
    if(v){ nav(''); watch(v); return; } document.title='Rival Clips';
    if(q){ $('#q').value=q; nav(''); search(q); return; }
    if(p.get('h')){ nav('hist'); feed(LS.get('rcHist',[]).map(i=>byId.get(i)).filter(Boolean),'',`<h2 style="margin:20px 0 0">🕘 History</h2>`); return; }
    if(p.get('l')){ nav('liked'); feed(LS.get('rcLiked',[]).map(i=>byId.get(i)).filter(Boolean),'',`<h2 style="margin:20px 0 0">👍 Liked videos</h2>`); return; }
    nav(c||'home'); const inC=x=>!c||base(x.cat)===c, Lg=LONG.filter(inC), Sh=SHORT.filter(inC); feed(Lg.length>=24?Lg:V.filter(inC),'',chips(c),Lg.length>=24?Sh:null); }
  const go=u=>{ history.pushState(null,'',u); route(); };
  document.addEventListener('click',e=>{ if(e.target.id==='lm'&&document.onclick2){ document.onclick2(e); return; }
    const ch=e.target.closest('[data-chip]'); if(ch){ go(ch.dataset.chip?'?c='+encodeURIComponent(ch.dataset.chip):'rivalclips'); scrollTo(0,0); return; }
    const a=e.target.closest('a'); if(!a||e.ctrlKey||e.metaKey||e.shiftKey) return; const h=a.getAttribute('href')||''; if(h.startsWith('?')||h==='rivalclips'){ e.preventDefault(); go(h); if(!h.startsWith('?v=')) scrollTo(0,0); } });
  addEventListener('popstate',route);
  $('#sf').onsubmit=e=>{ e.preventDefault(); const q=$('#q').value.trim(); if(q) go('?q='+encodeURIComponent(q)); $('#q').blur(); };
  $('#menu').onclick=()=>{ if(innerWidth<=800) document.body.classList.toggle('navopen'); else document.body.classList.toggle('mini'); };
  ingest(); route();
  /* the big Shorts list arrives after the page is up; the home feed picks it up without jumping */
  addEventListener('rr-clips-more',()=>{ if(ingest()){ const p=new URLSearchParams(location.search); if(!p.get('v')&&!p.get('q')&&!p.get('h')&&!p.get('l')&&scrollY<200) route(); else nav(p.get('c')||''); } });
  for(const f of ['clips-long.js','clips-data2.js','clips-data3.js']){ const s=document.createElement('script'); s.src=f; s.async=true; document.body.appendChild(s); }
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
