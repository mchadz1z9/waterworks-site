<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Baseball</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }
.side.bat .tp::before{ content:'At bat · '; color:#f59e0b; }
.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; position:relative; z-index:1; }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl{ display:block; }
.viewbtn{ position:absolute; top:8px; right:8px; z-index:4; font:inherit; font-size:15px; color:#fff; background:rgba(5,8,18,.78); border:2px solid #ffd166; border-radius:999px; padding:3px 12px; cursor:pointer; }
.viewbtn:hover{ background:rgba(20,28,51,.95); }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
.st tr.dim td{ opacity:.55; }
.result{ align-items:flex-start; }
.bxw{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.bxs h3{ margin:6px 0 0; font-size:22px; } .bxs h3 img{ width:26px; height:26px; vertical-align:middle; }
.bxs small{ color:#93a0bd; }
.bxw .ls{ font-size:14px; } .bxw .ls th,.bxw .ls td{ padding:1px 6px; }
.result h2{ font-size:clamp(32px,6vw,60px); }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Rink Rivals <span>Baseball</span></div>
    <div class="tools">
      <a href="./" id="toHockey">Hockey</a>
      <a href="football">Football</a>
      <button id="btnView" tabindex="-1">Broadcast 3D</button>
      <button id="btnFs" tabindex="-1">Full screen (Z)</button>
      <button id="btnSnd" tabindex="-1">Sound on</button>
    </div>
  </div>

  <section class="board" aria-label="Scoreboard">
    <div class="side" id="sideL"><img id="logoL" alt=""><div style="min-width:0"><div class="tn" id="nameL">-</div><div class="tp" id="tpL">Away</div></div><div class="sc" id="scoreL">0</div></div>
    <div class="clock"><div class="t" id="cntT">0-0</div><div class="pd"><span id="innT">Top 1st</span><span id="basesT"></span></div><div class="pd" id="outsT">0 outs</div></div>
    <div class="side r" id="sideR"><img id="logoR" alt=""><div style="min-width:0"><div class="tn" id="nameR">-</div><div class="tp" id="tpR">Home</div></div><div class="sc" id="scoreR">0</div></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <button class="viewbtn" id="viewBtn2" tabindex="-1">View: Broadcast 3D</button>
    <canvas id="cv" role="img" aria-label="Baseball field"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="menu"><div class="menu-in" id="menuIn"></div></div>
    <div class="overlay result hidden" id="result"><div id="resultIn"></div></div>
  </div>

  <footer class="keys" id="keysHelp"></footer>
  <section class="hub" id="hub" aria-label="Franchise"></section>
</main>
<script>
(() => {
'use strict';
/* ---------- basics ---------- */
const W=1120, H=620, DPR=Math.min(2, window.devicePixelRatio||1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let RNG=Math.random;
const rnd=(a,b)=>a+(b-a)*RNG();
const rint=(a,b)=>Math.floor(a+(b-a+1)*RNG());
const pick=a=>a[Math.floor(RNG()*a.length)];
function gauss(){ let u=0; while(!u) u=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random()); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=7; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return h; }
const ORD=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
const TEST=/[?&]test\b/.test(location.search), LOG=[];

if(!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){ this.rect(x,y,w,h); };

/* ---------- teams ---------- */
const svg=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const MLB=[
 ['nyy','New York','Yankees','NYY','AL','E','#0c2340','#c4ced3'],
 ['bos','Boston','Red Sox','BOS','AL','E','#bd3039','#0c2340'],
 ['tor','Toronto','Blue Jays','TOR','AL','E','#134a8e','#e8291c'],
 ['tb','Tampa Bay','Rays','TB','AL','E','#092c5c','#8fbce6'],
 ['bal','Baltimore','Orioles','BAL','AL','E','#df4601','#000000'],
 ['cle','Cleveland','Guardians','CLE','AL','C','#00385d','#e50022'],
 ['det','Detroit','Tigers','DET','AL','C','#0c2340','#fa4616'],
 ['kc','Kansas City','Royals','KC','AL','C','#004687','#bd9b60'],
 ['min','Minnesota','Twins','MIN','AL','C','#002b5c','#d31145'],
 ['cws','Chicago','White Sox','CWS','AL','C','#27251f','#c4ced4'],
 ['hou','Houston','Astros','HOU','AL','W','#002d62','#eb6e1f'],
 ['sea','Seattle','Mariners','SEA','AL','W','#0c2c56','#005c5c'],
 ['tex','Texas','Rangers','TEX','AL','W','#003278','#c0111f'],
 ['laa','Los Angeles','Angels','LAA','AL','W','#ba0021','#003263'],
 ['ath','Sacramento','Athletics','ATH','AL','W','#003831','#efb21e'],
 ['atl','Atlanta','Braves','ATL','NL','E','#ce1141','#13274f'],
 ['phi','Philadelphia','Phillies','PHI','NL','E','#e81828','#002d72'],
 ['nym','New York','Mets','NYM','NL','E','#002d72','#ff5910'],
 ['mia','Miami','Marlins','MIA','NL','E','#00a3e0','#ef3340'],
 ['wsh','Washington','Nationals','WSH','NL','E','#ab0003','#14225a'],
 ['mil','Milwaukee','Brewers','MIL','NL','C','#12284b','#ffc52f'],
 ['chc','Chicago','Cubs','CHC','NL','C','#0e3386','#cc3433'],
 ['stl','St. Louis','Cardinals','STL','NL','C','#c41e3a','#0c2340'],
 ['cin','Cincinnati','Reds','CIN','NL','C','#c6011f','#000000'],
 ['pit','Pittsburgh','Pirates','PIT','NL','C','#27251f','#fdb827'],
 ['lad','Los Angeles','Dodgers','LAD','NL','W','#005a9c','#ef3e42'],
 ['sd','San Diego','Padres','SD','NL','W','#2f241d','#ffc425'],
 ['sf','San Francisco','Giants','SF','NL','W','#fd5a1e','#27251f'],
 ['ari','Arizona','Diamondbacks','ARI','NL','W','#a71930','#e3d4ad'],
 ['col','Colorado','Rockies','COL','NL','W','#33006f','#c4ced4']
];
function makeLogo(abbr,c1,c2,shield){
  const fs=abbr.length>2?26:34;
  const body=shield
    ?`<path d="M50 3L93 16V50C93 76 73 92 50 98C27 92 7 76 7 50V16Z" fill="${c2}"/><path d="M50 11L85 22V50C85 71 69 84 50 90C31 84 15 71 15 50V22Z" fill="${c1}"/>`
    :`<circle cx="50" cy="50" r="48" fill="${c2}"/><circle cx="50" cy="50" r="41" fill="${c1}"/><path d="M22 30C34 42 34 58 22 70M78 30C66 42 66 58 78 70" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="4 3" opacity=".6"/>`;
  return svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${body}<text x="50" y="${50+fs*.36}" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="${fs}" text-anchor="middle" fill="#fff" stroke="${c2}" stroke-width="1.5" paint-order="stroke">${abbr}</text></svg>`);
}
const starLogo=(c1,c2,t)=>svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="${c2}"/><circle cx="50" cy="50" r="42" fill="${c1}"/><polygon fill="${c2}" points="50,12 59,38 87,38 64,55 73,82 50,66 27,82 36,55 13,38 41,38"/><text x="50" y="58" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="15" text-anchor="middle" fill="${c1}">${t}</text></svg>`);
const LOGO_JCC=svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 4L92 17V50C92 75 73 91 50 97C27 91 8 75 8 50V17Z" fill="#ffc72c"/><path d="M50 12L84 22V50C84 70 68 83 50 89C32 83 16 70 16 50V22Z" fill="#4b2a86"/><text x="50" y="56" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="24" text-anchor="middle" fill="#ffc72c">JCC</text><text x="50" y="72" font-family="Arial,sans-serif" font-weight="700" font-size="9" text-anchor="middle" fill="#fff">WARRIORS</text></svg>`);
const TEAMS={};
MLB.forEach(([id,city,nick,abbr,lg,div,c1,c2],i)=>{ TEAMS[id]={id,city,name:nick,full:city+' '+nick,abbr,lg,div,c1,c2,logo:makeLogo(abbr,c1,c2,i%3===1)}; });
TEAMS.warriors={id:'warriors',city:'JCC',name:'Warriors',full:'JCC Warriors',abbr:'JCC',c1:'#4b2a86',c2:'#ffc72c',logo:LOGO_JCC};
TEAMS.al={id:'al',city:'AL',name:'All-Stars',full:'AL All-Stars',abbr:'AL',lg:'AL',c1:'#0b3d91',c2:'#ffffff',logo:starLogo('#0b3d91','#ffffff','AL')};
TEAMS.nl={id:'nl',city:'NL',name:'All-Stars',full:'NL All-Stars',abbr:'NL',lg:'NL',c1:'#c8102e',c2:'#ffffff',logo:starLogo('#c8102e','#ffffff','NL')};
const LEAGUE_IDS=MLB.map(t=>t[0]);
const EX_LIST=[...LEAGUE_IDS.slice().sort((a,b)=>TEAMS[a].full.localeCompare(TEAMS[b].full)),'warriors','al','nl'];
const FR_LIST=EX_LIST.filter(id=>LEAGUE_IDS.includes(id));

function addStars(id,R){
  const st=STARS[id]; if(!st) return;
  const used=new Set(R.map(p=>p.num)), taken=new Set();
  for(const [name,pos,num,ovr,age,nat] of st){
    const pit=pos==='SP'||pos==='RP';
    const cand=R.filter(p=>p.pos===pos&&!taken.has(p)).sort(byOvr)[0]||R.filter(p=>isP(p)===pit&&!taken.has(p)).sort((a,b)=>a.ovr-b.ovr)[0];
    if(!cand) continue;
    const np=genPlayer(pos,ovr,age,null,nat); np.name=name; np.real=true; np.pot=age<25?Math.min(98,ovr+4):ovr;
    const clash=R.find(p=>p.num===num&&p!==cand); if(clash){ used.delete(clash.num); clash.num=pickNum(used); }
    np.num=num; used.add(num); R[R.indexOf(cand)]=np; taken.add(np);
  }
}

const GRP={C:'C','1B':'1B','2B':'IF',SS:'IF','3B':'IF',LF:'OF',CF:'OF',RF:'OF',DH:'DH'};
const batVal=p=>p.a.con*.45+p.a.pow*.42+p.a.eye*.13;
function buildLineup(R){
  const hit=R.filter(p=>!isP(p)), used=new Set(), lu=[];
  for(const pos of ['C','SS','CF','2B','3B','1B','RF','LF']){
    const sc=p=>(p.pos===pos?1000:GRP[p.pos]===GRP[pos]?400:(pos==='1B'||pos==='LF'||pos==='RF')?200:0)-(p.pos==='C'&&pos!=='C'?300:0)+p.ovr;
    const c=hit.filter(p=>!used.has(p)).sort((a,b)=>sc(b)-sc(a))[0]||genPlayer(pos,45,30);
    used.add(c); lu.push({p:c,pos});
  }
  const dh=hit.filter(p=>!used.has(p)).sort((a,b)=>batVal(b)-batVal(a))[0]; if(dh) lu.push({p:dh,pos:'DH'});
  const me=CAREER_ID&&hit.find(p=>p.id===CAREER_ID); if(me&&!lu.some(x=>x.p===me)){ const slot=lu.find(x=>x.pos===me.pos)||lu.find(x=>x.pos==='DH')||lu[lu.length-1]; slot.p=me; }
  const lv=x=>x.p.a.con+x.p.a.spd+x.p.a.eye, lead=lu.slice().sort((a,b)=>lv(b)-lv(a))[0];
  const rest=lu.filter(x=>x!==lead).sort((a,b)=>batVal(b.p)-batVal(a.p));
  return [lead,rest[1],rest[0],rest[2],...rest.slice(3)].filter(Boolean);
}

/* pitch */
function throwPitch(target,type){
  const fs=fieldSide(), pit=pitcherOf(fs), human=!!ctrlOf(fs)&&!G.derby, fat=fatigue(G,fs);
  const ctl=pit.a.ctl/100-fat*.25, lvl=human?.6:G.lvl;
  const sig=human?.1+fat*.08:(.25-.12*ctl-.06*lvl);
  let fu=target.u+gauss()*sig, fv=target.v+gauss()*sig;
  const pt=PITCHES[type], bk=.7+pit.a.stf/100*.6;
  let mph=mphOf(G,fs)+pt.mph+rnd(-1.5,1);
  if(!!G.derby) mph=[72,80,88][diff]+(type?-8:0)+rnd(-1,1);

    if(r.delay>0){ r.delay-=dt; continue; }
    if(r.to!==null){
      /* on a catchable fly, runners go halfway and wait */
      const lead=Math.hypot(F.cpt.x,F.cpt.y)>220?.4:.12;
      if(F.fly&&!r.bat&&!r.ret&&r.p>=lead){ r.p=lead; continue; }
      r.p+=r.spd*dt/90;
      if(r.p>=1){
        r.p=0; r.at=r.to; r.from=r.to; r.to=null; r.ret=false;
        if(r.at===4){ runnerScores(r); continue; }
        if(F.hr){ r.to=r.at+1; r.from=r.at; }
      }
    } else if(!F.hr) decide(r);
  }
  if(F.hr){ if(!F.run.length&&F.t-F.hrT>2) F.done=true; return; }
  if(G.outs>=3){ F.doneT+=dt; if(F.doneT>.5) F.done=true; return; }
  /* holder throws */
  if(b.held){
    const f=b.held; f.holdT+=dt;
    if(F.humSch) F.hum=f;
    const wait=F.humSch?3.5:isOF(f.pos)?.45:.3;
    if(f.holdT>wait&&F.throws<4){
      const c=chooseThrow(f);
      if(c){ if(c.tb===0){ outRunner(c.r,c.r.ret?'fly':'ground'); f.holdT=0; } else throwTo(f,c.n); }
      else {
        const moving=F.run.filter(r=>r.to!==null);
        const deep=Math.hypot(f.x,f.y)>150;
        if(deep&&(moving.length||F.throws===0)){ const lead=moving.sort((a,b)=>b.to-a.to)[0]; throwTo(f,lead?lead.to:2); }
      }
    }
    const moving=F.run.some(r=>r.to!==null||r.delay>0);
    if(!moving){ F.settle+=dt; if(F.settle>.5) F.done=true; } else F.settle=0;
  }
  if(!!G.derby&&(b.held||(b.bounced&&F.t>2.5))) { F.settle+=dt; if(F.settle>.6) F.done=true; }
  if(F.t>25) F.done=true;
}
function startHR(){
  const side=F.side; F.fly=false;
  for(const r of F.run){ if(r.to===null&&r.at<4){ r.from=r.at; r.to=r.at+1; r.p=0; } r.spd=30; r.delay=Math.min(r.delay,.2); r.ret=false; if(r.from>r.to){ const a=r.from; r.from=r.to; r.to=a; r.p=1-r.p; } }
  if(G.derby){ G.derby.hr++; G.derby.long=Math.max(G.derby.long,F.hrDist); }
  sfx.hr(); banner('Home run!',`${F.hrDist} ft`,TEAMS[G.t[side]].c2,2.2);
}
function finishPlay(){
  const res=F;
  if(res.foulBall){ for(let i=0;i<3;i++) G.bases[i]=res.orig[i]; phase='wait'; foul(); return; }
  if(G.derby){
    if(res.hr){ toast(`${res.hrDist} ft! That's ${G.derby.hr}`,'#ffd166'); after(1,()=>startAim()); }
    else derbyOut(`${res.ball.bounced?'In play':'Caught'}, no home run`);
    return;
  }
  const bat=batterOf(F.side);
  for(const r of res.run) if(r.at>=1&&r.at<=3&&r.to===null) G.bases[r.at-1]=r.pl;
  const br=res.run.find(r=>r.bat);
  let txt, code;
  if(res.hr){ txt=res.runs>=4?'Grand slam!':res.runs>1?`${res.runs}-run homer`:'Solo home run'; code='HR'; }
  else if(res.batOut){
    const la=res.res.la;
    txt=res.outs>=3?'Triple play!':res.outs===2?'Double play':res.batOut==='fly'?(res.runs?'Sacrifice fly':la<16?'Line out':la>48?'Pop out':'Fly out'):'Ground out';
    code=res.outs>=2?'DP':res.batOut==='fly'?(res.runs?'SF':'FO'):'GO';
  } else if(br){ txt=res.outs?'Fielder\'s choice':['','Single','Double','Triple'][br.at]||'Safe'; code=res.outs?'FC':['1B','1B','2B','3B'][br.at]||'1B'; }
  else { txt=res.outs>1?'Double play':'Out'; code=res.outs>1?'DP':'GO'; }
  recPA(G,code,code==='DP'?0:res.runs);
  if(!res.hr&&res.runs) txt+=` · ${res.runs} run${res.runs>1?'s':''} score${res.runs>1?'':'s'}`;
  if(TEST) LOG.push({txt,ev:Math.round(res.res.ev),la:Math.round(res.res.la),sp:Math.round(res.res.spray),runs:res.runs,outs:res.outs});
  if(!res.hr) toast(`${shortNm(bat.name)}: ${txt}`,res.batOut?'#f87171':'#34d399');
  else toast(`${shortNm(bat.name)}: ${txt}`,'#ffd166');
  endPA();
}

/* ---------- input ---------- */
function actorPointer(){

  if(phase==='aim'&&ctrlOf(fieldSide())&&!G.derby) return 'pit';
  if(ctrlOf(batSide())&&(phase==='aim'||phase==='wind'||phase==='pitch'||phase==='wait')) return 'bat';
  return null;
}
function act(scheme){
  if(!G||paused) return;

  if(phase==='aim'&&ctrlOf(fs)&&!G.derby&&(scheme==='any'||ctrlOf(fs)===scheme||ctrlOf(fs)==='solo'&&scheme!=='p2')){ phase='wind'; phT=0; G.pending={u:cur.pit.u,v:cur.pit.v,type:ptype}; return; }
  if(phase==='pitch'&&ctrlOf(bs)&&(scheme==='any'||ctrlOf(bs)===scheme||ctrlOf(bs)==='solo'&&scheme!=='p2')) doSwing(cur.bat.u,cur.bat.v);
}
function schemeOfKey(code){

  return SCHEME.solo.act.includes(code)?'solo':null;
}
function cycleFor(code){
  if(!G||!!G.derby) return;
  const pc=ctrlOf(fieldSide()); if(!pc||phase!=='aim') return;
  const sc=SCHEME[pc==='solo'?'solo':pc];
  if(sc.cyc.includes(code)){ ptype=(ptype+1)%3; sfx.click(); }
  if(pc==='solo'||pc==='p1'){ const dg=code.replace('Numpad','Digit'); if(['Digit1','Digit2','Digit3'].includes(dg)){ ptype=+dg.slice(5)-1; sfx.click(); } }
}
addEventListener('keydown',e=>{

  if(e.repeat){ return; }
  keys.add(e.code); audio();

  if(e.code==='KeyV'){ setView3(!view3); return; }
  if(phase==='menu'){ menuKey(e.code); return; }
  if(phase==='hub') return;
  if(phase==='over'){ const lg=G&&G.inLeague; if(e.code==='KeyR'&&!lg){ startGame(); } else if(['Enter','NumpadEnter','Space','KeyM','Escape'].includes(e.code)){ if(lg) showHub(); else toMenu(); } return; }
  if(e.code==='KeyP'||e.code==='Escape'){ paused=!paused; if(paused) banner('Paused','P to resume · M for menu','#000',1e9); else { $('banner').classList.remove('on'); bannerT=0; } return; }
  if(e.code==='KeyM'){ if(G.inLeague){ if(confirm('Sim the rest of this game?')) G.ffast=true; } else if(confirm('Quit to the menu? This game will end.')) toMenu(); keys.clear(); return; }

  if(e.code==='KeyN'&&G.career){ G.skip=true; toast('Skipping to your next turn'); return; }
  if(phase==='play'&&F&&F.humSch){ const sc=SCHEME[F.humSch], nums=F.humSch==='p2'?['Digit7','Digit8','Digit9','Digit0']:['Digit1','Digit2','Digit3','Digit4'], i=nums.indexOf(e.code.replace('Numpad','Digit')); if(i>=0){ humanThrow(i+1); return; } if(sc.act.includes(e.code)){ fieldDive(); return; } if(sc.cyc.includes(e.code)){ fieldSwitch(); return; } }

  cycleFor(e.code);

});

function moveCursors(dt){
  if(!G) return;

  const mv=(c,sc)=>{ const s=SCHEME[sc]; if(held(s.left)) c.u-=sp; if(held(s.right)) c.u+=sp; if(held(s.up)) c.v+=sp; if(held(s.down)) c.v-=sp; c.u=clamp(c.u,-1.7,1.7); c.v=clamp(c.v,-1.7,1.7); };

/* ---------- update ---------- */
function step(dt){
  time+=dt;
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('on'); }
  if(bannerT>0&&!paused){ bannerT-=dt; if(bannerT<=0) $('banner').classList.remove('on'); }
  if(!G||paused||phase==='over') return;
  phT+=dt; hud.pitchT+=dt;
  moveCursors(dt);
  if(swingAnim>=0){ swingAnim+=dt; if(swingAnim>.45) swingAnim=-1; }
  if(phase==='aim'&&G.ffast){ for(let i=0;i<90&&phase==='aim'&&G&&!G.over;i++) quickPA(); }
  else if(phase==='aim'&&G.career&&!ctrlOf(batSide())&&!ctrlOf(fieldSide())){ if(G.skip){ for(let i=0;i<90&&phase==='aim'&&G&&!G.over&&G.skip&&!ctrlOf(batSide())&&!ctrlOf(fieldSide());i++) quickPA(); } else if(phT>.55) quickPA(); }
  else if(phase==='aim'){
    const fs=fieldSide();
    if((!ctrlOf(fs)||!!G.derby)&&phT>(!!G.derby?.9:1.2)){ const t=cpuPitchTarget(); G.pending=t; phase='wind'; phT=0; }
  } else if(phase==='wind'){
    if(phT>.42){ const p=G.pending; throwPitch({u:p.u,v:p.v},p.type); }
  } else if(phase==='pitch'){
    P.t+=dt;
    if(P.cpuSw&&!P.swung&&P.t>=P.cpuSw.t) doSwing(P.cpuSw.u,P.cpuSw.v);
    if(!P.done&&P.res&&!P.res.miss&&P.t>=Math.min(P.T,P.sw?Math.max(P.sw.t,P.T-0.13):P.T)){
      P.done=true;
      if(P.res.foul){ sfx.crack(.2); P.flyOff=true; foul(); return; }
      sfx.crack(P.res.q);
      if(!!G.derby&&P.res.la<10){ /* worm burner */ }
      startPlay(P.res); return;
    }
    if(!P.done&&P.t>P.T+.12) callPitch();
  } else if(phase==='play'){
    const sub=4; for(let i=0;i<sub&&phase==='play';i++){ fieldTick(dt/sub); if(F&&F.done){ finishPlay(); break; } }
  } else if(phase==='wait'){
    waitT-=dt; if(P) P.t+=dt;
    if(waitT<=0&&waitFn){ const f=waitFn; waitFn=null; f(); }
  }
  updateBoard();
}

function scrToField(x,y){ if(view3&&R3.ok){ const g=R3.unproject(x/W,y/H); return [g[0]/K3,-g[1]/K3]; } return [(x-HX)/FS,(HY-y)/FS]; }
function baseScr(n){ const [bx,by]=BASE[n]; if(view3&&R3.ok){ const q=R3.proj(bx*K3,4,-by*K3); return q?[q[0]*W,q[1]*H]:[-99,-99]; } return [fx(bx),fy(by)]; }
function fieldDir(){
  if(!F||!F.humSch) return [0,0];
  if(ptrF.on&&F.hum){ const [wx,wy]=scrToField(ptrF.x,ptrF.y), dx=wx-F.hum.x, dy=wy-F.hum.y, d=Math.hypot(dx,dy); return d>2?[dx/d,dy/d]:[0,0]; }
  const s=SCHEME[F.humSch]; let x=0,y=0; if(held(s.left)) x--; if(held(s.right)) x++; if(held(s.up)) y++; if(held(s.down)) y--; const d=Math.hypot(x,y); return d?[x/d,y/d]:[0,0];
}
function humanThrow(n){
  if(phase!=='play'||!F||!F.hum||F.ball.held!==F.hum) return;
  const f=F.hum, bp=BASE[n];
  if(Math.hypot(f.x-bp[0],f.y-bp[1])<6){ for(const r of F.run.slice()) if(r.to===n&&r.delay<=0){ outRunner(r,r.ret?'fly':'ground'); if(G.outs>=3) break; } f.holdT=0; return; }
  if(F.cover[n]===f) return;

}

function fieldHud(){

function hubLead(){
  const A=allPlayers(L), gp=Math.max(1,L.round), qAB=gp*2.2, qO=gp*2.4, H=A.filter(([p])=>!isP(p)), Pi=A.filter(([p])=>isP(p));

function hubTrade(){
  if(L.phase!=='season') return '<div class="hcard">Trades open again when the next season starts.</div>';

hubEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.tagName==='SELECT') return; const a=b.dataset.a; audio();
  if(a==='menu'){ saveL(L); toMenu(); return; }
  if(a==='play'){ playLeague(); return; }
  if(a==='tab'){ hubTab=b.dataset.k; hubMsg=''; }
  else if(a==='sim') simUser();
  else if(a==='train'){ const p=findMe(), k=b.dataset.k, c=trainCost(p.a[k]); if((L.xp||0)>=c&&p.a[k]<99){ L.xp-=c; p.a[k]++; p.ovr=calcOvr(p); if(p.pot<p.ovr) p.pot=p.ovr; } }
  else if(a==='retire'){ if(confirm('Retire? This ends your career.')){ const p=findMe(); L.retired=true; L.log.unshift(`${L.season}: ${p.name} retires.`); } }
  else if(a==='simn'){ for(let i=0;i<+b.dataset.n&&L.phase==='season';i++) simUser(); }
  else if(a==='poday') poDay(L,null);
  else if(a==='poall'){ while(L.phase==='playoffs') poDay(L,null); }
  else if(a==='dpick'){ draftPick(L,b.dataset.id); simDraft(L,false); }
  else if(a==='dsim') simDraft(L,false);
  else if(a==='dall') simDraft(L,true);
  else if(a==='tgive'||a==='tget'){ const arr=trd[a==='tgive'?'give':'get'], i=arr.indexOf(b.dataset.id); if(i>=0) arr.splice(i,1); else arr.push(b.dataset.id); }
  else if(a==='tprop'){ const o=trd.o||FR_LIST.find(x=>x!==L.id), give=ros(L,L.id).filter(p=>trd.give.includes(p.id)), get=ros(L,o).filter(p=>trd.get.includes(p.id)), m=tradeCheck(L,give,get,o); if(m) hubMsg=m; else { doTrade(L,give,get,o); hubMsg='Trade done!'; trd.give=[]; trd.get=[]; } }
  if(hubTab==='draft'&&L.phase!=='draft') hubTab='home';
  saveL(L); renderHub();
});
hubEl.addEventListener('change',e=>{ const a=e.target.dataset.a; if(a==='rosteam') rosTeam=e.target.value; if(a==='tteam'){ trd.o=e.target.value; trd.get=[]; } renderHub(); });

    const e=[bx*.35,42+by*.2,by*.35-85], c=[bx,b.z*.3,by*.9+10];
    if(!cam3) cam3={e,c}; const k=1-Math.exp(-dt*3.2); for(let i=0;i<3;i++){ cam3.e[i]+=(e[i]-cam3.e[i])*k; cam3.c[i]+=(c[i]-cam3.c[i])*k; }
    cam={eye:W3(cam3.e[0],cam3.e[2],cam3.e[1]),center:W3(cam3.c[0],cam3.c[2],cam3.c[1]),fov:50};
  } else { cam3=null; cam={eye:W3(0,-44,15),center:W3(0,58,3),fov:24}; }
  R3.frame({...cam,cheer:F&&F.hr?1:0},()=>{
    if(!G) return;
    const fs=fieldSide(), bs=batSide(), fu=uni(fs), bu=uni(bs);
    if(inPlay){
      for(const f of F.fl){ const [x,z]=W3(f.x,f.y); const hold=F.ball.held===f; if(f===F.hum) R3.part(R3.UC,R3.mm(R3.T(x,.6,z),R3.S(20,1,20)),'#ffd166'); ath('f'+f.pos,{x,z,ang:faceTo(f.x,f.y,F.ball.x,F.ball.y),team:fu,num:f.pl.num||0,pose:hold?'throw':'run',arm:hold?Math.min(1,f.holdT/.4):0,glove:true,crouch:f.pos==='C'?.2:0}); }
      for(const r of F.run){ const [rx,ry]=runnerPos(r), [x,z]=W3(rx,ry), nb=BASE[r.to??r.at]||BASE[0]; ath('r'+r.pl.id,{x,z,ang:faceTo(rx,ry,nb[0],nb[1]),team:bu,num:r.pl.num,helm:true}); }
      const b=F.ball; if(!b.gone||b.z>0){ const [x,,z]=W3(b.x,b.y); R3.ball(x,(b.z+.3)*K3,z,.45*K3,'#ffffff'); R3.shadow(x,z,10); }
    } else {
      const pit=G.pit[fs], wind=phase==='wind'?phT/.42:phase==='pitch'?1:0;
      ath('p',{x:0,z:-60.5*K3,ang:Math.PI/2,team:fu,num:pit.num,pose:'pitch',arm:wind,glove:true});
      ath('c',{x:0,z:4*K3,ang:-Math.PI/2,team:fu,num:(G.lu[fs].find(q=>q.pos==='C')||{p:{num:0}}).p.num,crouch:.95,pose:'ready',glove:true,helm:true});
      for(const pos of ['1B','2B','SS','3B','LF','CF','RF']){ const [hx,hy]=HOME_POS[pos], [x,z]=W3(hx,hy), pl=(G.lu[fs].find(q=>q.pos===pos)||{p:{num:0}}).p; ath('f'+pos,{x,z,ang:faceTo(hx,hy,0,0),team:fu,num:pl.num,pose:'ready',crouch:.3,glove:true}); }
      for(let i=0;i<3;i++) if(G.bases[i]){ const [bx,by]=BASE[i+1], [x,z]=W3(bx*1.06-(i===1?6:0),by*1.04); ath('r'+G.bases[i].id,{x,z,ang:faceTo(bx,by,BASE[i+2][0],BASE[i+2][1]),team:bu,num:G.bases[i].num,helm:true,crouch:.3,pose:'ready'}); }
      const b=batterOf(bs); ath('b',{x:-2.7*K3,z:.3*K3,ang:0,team:bu,num:b.num,pose:'bat',swing:swingAnim>=0?Math.min(1,swingAnim/.2):0,helm:true,crouch:.25});
      if(P&&!(P.done&&P.res&&!P.res.miss)&&!P.flyOff){ const s=P.t/P.T;
        if(s<=1.6&&phase!=='aim'){ let u,v,y; if(s<=1){ u=lerp(-1.9,P.fu-P.bu,s)+P.bu*s*s*s; v=lerp(3.6,P.fv-P.bv,s)+P.bv*s*s*s+Math.sin(Math.PI*s)*1.3; y=lerp(54,0,s); } else { u=P.fu; v=P.fv; y=-(s-1)*12; }
          R3.ball(u*.85*K3,(2.55+v*.95)*K3,-y*K3,.32*K3,'#ffffff'); } }
    }
  },dt);
  if(G&&!inPlay){ const a=R3.proj(-.85*K3,1.6*K3,0), b=R3.proj(.85*K3,3.5*K3,0); if(a&&b){ ZX=(a[0]+b[0])/2*W; ZW=(b[0]-a[0])/2*W; ZY=(a[1]+b[1])/2*H; ZH=(a[1]-b[1])/2*H; } }
}
$('btnView').addEventListener('click',()=>setView3(!view3));
$('viewBtn2').addEventListener('click',e=>{ e.stopPropagation(); audio(); setView3(!view3); });
$('viewBtn2').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; frameDtG=dt||1/60;
  step(dt); draw();
  requestAnimationFrame(frame);
}

/* ---------- top buttons ---------- */
function toggleFs(){
  const st=$('stage');
  try{ if(document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen&&st.requestFullscreen(); }catch(e){}
}
$('btnFs').addEventListener('click',toggleFs);
$('btnSnd').addEventListener('click',()=>{ muted=!muted; $('btnSnd').textContent=muted?'Sound off':'Sound on'; if(!muted){ audio(); sfx.click(); } });
$('result').addEventListener('click',()=>{ if(phase==='over'){ if(G&&G.inLeague) showHub(); else toMenu(); } });

if(TEST) window.__bb={LOG,get L(){return L;},newLeague,simGame,gameOpts,finishRound,poDay,simDraft,simUser,showHub,hubSet:t=>{hubTab=t;renderHub();},setFrLen:n=>{frLen=n;},get G(){return G;},get F(){return F;},get phase(){return phase;},step,startGame,setMode:m=>{menuMode=m;}};
setView3(view3);
renderMenu();
requestAnimationFrame(frame);
})();
