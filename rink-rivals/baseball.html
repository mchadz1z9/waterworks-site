<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Baseball</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }
.side.bat .tp::before{ content:'At bat · '; color:#f59e0b; }
.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Rink Rivals <span>Baseball</span></div>
    <div class="tools">
      <a href="./" id="toHockey">Hockey</a>
      <button id="btnFs" tabindex="-1">Full screen (Z)</button>
      <button id="btnSnd" tabindex="-1">Sound on</button>
    </div>
  </div>

  <section class="board" aria-label="Scoreboard">
    <div class="side" id="sideL"><img id="logoL" alt=""><div style="min-width:0"><div class="tn" id="nameL">-</div><div class="tp" id="tpL">Away</div></div><div class="sc" id="scoreL">0</div></div>
    <div class="clock"><div class="t" id="cntT">0-0</div><div class="pd"><span id="innT">Top 1st</span><span id="basesT"></span></div><div class="pd" id="outsT">0 outs</div></div>
    <div class="side r" id="sideR"><img id="logoR" alt=""><div style="min-width:0"><div class="tn" id="nameR">-</div><div class="tp" id="tpR">Home</div></div><div class="sc" id="scoreR">0</div></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="Baseball field"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="menu"><div class="menu-in" id="menuIn"></div></div>
    <div class="overlay result hidden" id="result"><div id="resultIn"></div></div>
  </div>

  <footer class="keys" id="keysHelp"></footer>
</main>
<script>
(() => {
'use strict';
/* ---------- basics ---------- */
const W=1120, H=620, DPR=Math.min(2, window.devicePixelRatio||1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+(b-a)*Math.random();
const pick=a=>a[Math.floor(Math.random()*a.length)];
function gauss(){ let u=0; while(!u) u=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random()); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=7; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return h; }
const ORD=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
const TEST=/[?&]test\b/.test(location.search), LOG=[];

if(!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){ this.rect(x,y,w,h); };

/* ---------- teams ---------- */
const svg=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const TEAM_DEF=[
  ['tor','Toronto','Lumberjacks','TOR','#13294b','#e8291c',84],
  ['mtl','Montreal','Voyageurs','MTL','#0b2c5f','#bf0d3e',80],
  ['van','Vancouver','Orcas','VAN','#00205b','#00a86b',78],
  ['nyc','New York','Skyliners','NYS','#0c2340','#9fb3c8',88],
  ['bos','Boston','Harbor Hawks','BOS','#bd3039','#0c2340',85],
  ['chi','Chicago','Blizzard','CHI','#0e3386','#cc3433',81],
  ['la','Los Angeles','Stars','LAS','#005a9c','#f5c518',87],
  ['hou','Houston','Comets','HOU','#eb6e1f','#002d62',83],
  ['sea','Seattle','Pines','SEA','#0c2c56','#2e8b57',77],
  ['atl','Atlanta','Peaches','ATL','#ce1141','#13274f',82],
  ['mia','Miami','Flamingos','MIA','#e0457b','#00a3e0',76],
  ['den','Denver','Peaks','DEN','#33006f','#c4ced4',79],
  ['warriors','JCC','Warriors','JCC','#4b2a86','#ffc72c',80]
];
const LOGO_JCC=svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 4L92 17V50C92 75 73 91 50 97C27 91 8 75 8 50V17Z" fill="#ffc72c"/><path d="M50 12L84 22V50C84 70 68 83 50 89C32 83 16 70 16 50V22Z" fill="#4b2a86"/><text x="50" y="56" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="24" text-anchor="middle" fill="#ffc72c">JCC</text><text x="50" y="72" font-family="Arial,sans-serif" font-weight="700" font-size="9" text-anchor="middle" fill="#fff">WARRIORS</text></svg>`);
function makeLogo(abbr,c1,c2){
  return svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="${c2}"/><circle cx="50" cy="50" r="41" fill="${c1}"/><path d="M22 30C34 42 34 58 22 70M78 30C66 42 66 58 78 70" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="4 3" opacity=".7"/><text x="50" y="${abbr.length>3?58:60}" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="${abbr.length>3?20:26}" text-anchor="middle" fill="#fff" stroke="${c2}" stroke-width="1.5" paint-order="stroke">${abbr}</text></svg>`);
}
const FIRST=['Jake','Mason','Tyler','Luis','Carlos','Ryan','Noah','Aiden','Marcus','Diego','Kenji','Owen','Jose','Eli','Cody','Andre','Mike','Ben','Trey','Javier','Nate','Cal','Rafael','Zach','Derek','Hector','Ian','Logan','Sam','Wes'];
const LAST=['Ramirez','Walker','Chen','Okafor','Silva','Brooks','Nakamura','Diaz','Foster','Moreno','Kowalski','Hayes','Bennett','Ortiz','Lindqvist','Carter','Reyes','Price','Tanaka','Grant','Delgado','Murphy','Santos','Fischer','Holloway','Vega','Abbott','Pena','Sullivan','Kim'];
const LINEUP_POS=['CF','SS','1B','RF','3B','LF','2B','C','DH'];
const TEAMS={};
for(const [id,city,name,abbr,c1,c2,ovr] of TEAM_DEF){
  const R=mulberry32(hashStr(id)*7+2026), rr=(a,b)=>a+(b-a)*R(), used=new Set();
  const nm=()=>{ let n; do{ n=FIRST[Math.floor(R()*FIRST.length)]+' '+LAST[Math.floor(R()*LAST.length)]; }while(used.has(n)); used.add(n); return n; };
  const num=()=>{ let n; do{ n=1+Math.floor(R()*65); }while(used.has('#'+n)); used.add('#'+n); return n; };
  const bats=LINEUP_POS.map((pos,i)=>{
    const conB=[8,6,2,0,0,-2,-2,-6,-4][i], powB=[-10,-6,6,10,6,2,-4,-6,4][i];
    return {nm:nm(),num:num(),pos,con:Math.round(clamp(ovr+conB+rr(-6,6),45,99)),pow:Math.round(clamp(ovr+powB+rr(-6,6),40,99))};
  });
  const pitcher={nm:nm(),num:num(),vel:Math.round(clamp(88+(ovr-74)*.6+rr(-2,2),86,100)),ctl:Math.round(clamp(ovr+rr(-6,6),50,99))};
  TEAMS[id]={id,city,name,full:city+' '+name,abbr,c1,c2,ovr,bats,pitcher,logo:id==='warriors'?LOGO_JCC:makeLogo(abbr,c1,c2)};
}
const TEAM_IDS=TEAM_DEF.map(t=>t[0]);
const shortNm=n=>{ const p=n.split(' '); return p[0][0]+'. '+p.slice(1).join(' '); };

/* ---------- audio ---------- */
let AC=null, muted=false;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type='square',v=.05,f2=null,delay=0){
  if(muted||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);
}
function noise(d,v,fc,delay=0){
  if(muted||!AC) return; const t=AC.currentTime+delay, n=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,n,AC.sampleRate), x=b.getChannelData(0);
  for(let i=0;i<n;i++) x[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=b; f.type='lowpass'; f.frequency.value=fc; g.gain.value=v;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
}
const sfx={
  crack:q=>{ noise(.09,.5,4000); tone(900+q*500,.06,'square',.06,300); },
  pop:()=>{ noise(.05,.35,1800); tone(220,.05,'sine',.08,120); },
  whiff:()=>{ noise(.18,.12,700); },
  throw:()=>tone(520,.08,'triangle',.04,380),
  out:()=>{ tone(330,.12,'square',.05,220); },
  run:()=>{ tone(660,.09,'square',.05); tone(880,.12,'square',.05,null,.1); },
  hr:()=>{ noise(1.8,.25,1400); [0,4,7,12,7,12].forEach((s,i)=>tone(392*Math.pow(2,s/12),.16,'square',.05,null,i*.14)); },
  organ:()=>{ [0,4,7,12].forEach((s,i)=>tone(262*Math.pow(2,s/12),.18,'sine',.06,null,i*.16)); },
  click:()=>tone(700,.04,'square',.03)
};

/* ---------- geometry ---------- */
/* batting view (behind the plate) */
const ZX=560, ZY=452, ZW=62, ZH=76, RX=560, RY=262;
const zx=u=>ZX+u*ZW, zy=v=>ZY-v*ZH;
/* field view (top-down, feet) */
const FS=1.33, HX=560, HY=594;
const fx=x=>HX+x*FS, fy=y=>HY-y*FS;
const BASE=[[0,0],[63.6,63.6],[0,127.3],[-63.6,63.6],[0,0]];
const fenceR=th=>330+70*Math.cos(2*th);
const FAIR=Math.PI/4;
const HOME_POS={P:[0,60.5],C:[0,-7],'1B':[70,92],'2B':[30,142],SS:[-32,142],'3B':[-70,92],LF:[-160,268],CF:[0,318],RF:[160,268]};
const K_DRAG=.0013, GRAV=32, RUN_SPD=27, THROW=112;
const isOF=pos=>pos==='LF'||pos==='CF'||pos==='RF';
const fSpd=f=>isOF(f.pos)?23:f.pos==='C'?16:f.pos==='P'?17:18.5;

const PITCHES=[
  {n:'Fastball',  bu:.12, bv:.05, mph:0},
  {n:'Curveball', bu:-.55,bv:-.95,mph:-17},
  {n:'Changeup',  bu:.32, bv:-.45,mph:-11}
];
const DIFF_NAMES=['Rookie','Pro','All-Star'], DIFF_T=[.15,.55,.92];

/* ---------- state ---------- */
let G=null, phase='menu', phT=0, P=null, F=null, paused=false, time=0;
let menuMode=1, diff=1, innSel=3, sel=[TEAM_IDS.indexOf('warriors'),TEAM_IDS.indexOf('tor')];
const keys=new Set();
const cur={bat:{u:0,v:0},pit:{u:.3,v:-.3}};
let ptype=0, ptrUsed=false, hud={pitchTxt:'',pitchT:0}, swingAnim=-1;
const SCHEME={
  p1:{up:['KeyW'],down:['KeyS'],left:['KeyA'],right:['KeyD'],act:['Space'],cyc:['KeyQ']},
  p2:{up:['ArrowUp'],down:['ArrowDown'],left:['ArrowLeft'],right:['ArrowRight'],act:['Enter','NumpadEnter'],cyc:['Slash','ShiftRight']},
  solo:{up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],act:['Space','Enter','NumpadEnter'],cyc:['KeyQ','Slash']}
};
const held=a=>a.some(k=>keys.has(k));
const batSide=()=>G.half, fieldSide=()=>1-G.half;
const ctrlOf=side=>G.ctrl[side];
const batterOf=side=>TEAMS[G.t[side]].bats[G.ord[side]%9];
const pitcherOf=side=>TEAMS[G.t[side]].pitcher;

/* ---------- canvas ---------- */
const cv=$('cv'), ctx=cv.getContext('2d');
cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
function offscreen(draw){ const c=document.createElement('canvas'); c.width=W*DPR; c.height=H*DPR; const x=c.getContext('2d'); x.setTransform(DPR,0,0,DPR,0,0); draw(x); return c; }
const CROWD=['#e2e8f0','#f87171','#60a5fa','#fbbf24','#34d399','#f472b6','#a78bfa','#94a3b8'];
function crowd(x,y0,y1,seed){
  const R=mulberry32(seed);
  for(let i=0;i<1400;i++){ x.fillStyle=CROWD[Math.floor(R()*CROWD.length)]; x.globalAlpha=.25+R()*.35; const px=R()*W, py=y0+R()*(y1-y0); x.fillRect(px,py,3,3); }
  x.globalAlpha=1;
}
const bvBg=offscreen(x=>{
  let g=x.createLinearGradient(0,0,0,175); g.addColorStop(0,'#060a14'); g.addColorStop(1,'#16213f'); x.fillStyle=g; x.fillRect(0,0,W,175);
  crowd(x,20,165,11);
  x.fillStyle='#0f3d2e'; x.fillRect(0,165,W,26); x.fillStyle='#fbbf24'; x.fillRect(0,165,W,3);
  x.fillStyle='#e5e7eb'; x.font='800 15px Arial Narrow, sans-serif'; x.textAlign='center';
  [['330',90],['375',300],['400',560],['375',820],['330',1030]].forEach(([t,px])=>x.fillText(t,px,184));
  g=x.createLinearGradient(0,191,0,H); g.addColorStop(0,'#2a6e2e'); g.addColorStop(1,'#3f9a45'); x.fillStyle=g; x.fillRect(0,191,W,H-191);
  /* mow stripes converging on a far vanishing point */
  x.save(); x.beginPath(); x.rect(0,191,W,H-191); x.clip(); x.globalAlpha=.07; x.fillStyle='#fff';
  for(let i=-12;i<=12;i+=2){ x.beginPath(); x.moveTo(560+i*30,191); x.lineTo(560+(i+1)*30,191); x.lineTo(560+(i+1)*190,H); x.lineTo(560+i*190,H); x.fill(); }
  x.restore();
  /* infield dirt */
  x.fillStyle='#b9814f';
  x.beginPath(); x.moveTo(120,H); x.lineTo(230,382); x.quadraticCurveTo(560,170,890,382); x.lineTo(1000,H); x.closePath(); x.fill();
  x.fillStyle='#3a8f40'; x.beginPath(); x.moveTo(560,548); x.lineTo(820,372); x.lineTo(560,262); x.lineTo(300,372); x.closePath(); x.fill();
  /* base lines */

/* pitch */
function throwPitch(target,type){
  const fs=fieldSide(), pit=pitcherOf(fs), human=!!ctrlOf(fs)&&G.mode!==3;
  const ctl=pit.ctl/100, lvl=human?.6:G.lvl;
  const sig=human?.11:(.25-.12*ctl-.06*lvl);
  let fu=target.u+gauss()*sig, fv=target.v+gauss()*sig;
  const pt=PITCHES[type];
  let mph=pit.vel+pt.mph+rnd(-1.5,1);
  if(G.mode===3) mph=[72,80,88][diff]+(type?-8:0)+rnd(-1,1);
  else if(!human&&ctrlOf(batSide())) mph+= (G.lvl-.55)*6;
  const T=.47*(94/mph)*(ctrlOf(batSide())&&!human?[1.12,1,.95][diff]:1);
  P={t:0,T,type,mph:Math.round(mph),fu,fv,bu:pt.bu,bv:pt.bv,swung:false,sw:null,res:null,done:false,cpuSw:null};
  const bs=batSide();
  if(!ctrlOf(bs)) planCpuSwing(bs);
  hud.pitchTxt=`${P.mph} mph ${pt.n}`; hud.pitchT=0;
  phase='pitch'; phT=0; swingAnim=-1;
  tone(180,.08,'triangle',.03);
}
function cpuPitchTarget(){
  const fs=fieldSide(), ctl=pitcherOf(fs).ctl/100;
  let zoneP=.38+.15*ctl;
  if(G.balls===3) zoneP=.85; else if(G.strikes===2&&G.balls<2) zoneP=.3;
  if(G.mode===3) zoneP=.88;
  const type=G.mode===3?(Math.random()<.75?0:2):(Math.random()<.55?0:Math.random()<.5?1:2);
  let u,v;
  if(Math.random()<zoneP){ u=(Math.random()<.5?-1:1)*rnd(.15,.9); v=rnd(-.85,.85); if(G.mode===3){ u*=.6; v*=.6; } }
  else if(Math.random()<.5){ u=(Math.random()<.5?-1:1)*rnd(1.2,1.7); v=rnd(-1,1); }
  else { u=rnd(-1,1); v=(Math.random()<.6?-1:1)*rnd(1.2,1.6); }
  /* aim the break: target is where the pitch should end, so no change needed */
  return {u,v,type};
}
function planCpuSwing(bs){
  const b=batterOf(bs), s=clamp(G.lvl*.6+b.con/100*.4,0,1);
  const inZ=Math.abs(P.fu)<=1.08&&Math.abs(P.fv)<=1.08;
  let pSw=inZ?(.6+.25*s):(.34-.22*s);
  if(G.strikes===2) pSw+=inZ?.2:.12; if(G.balls===3&&G.strikes<2) pSw-=.2;
  if(Math.random()<pSw){
    const fool=P.type?(.05-.025*s):0;
    P.cpuSw={t:P.T-fool+gauss()*(.085-.04*s),u:P.fu+gauss()*(.36-.14*s),v:P.fv+gauss()*(.36-.14*s)};
  }
}
function batR(b,human){ return (human?.36:.29)+b.con/100*.12+(human?[.07,.02,0][G.mode===2?1:diff]:0); }
function doSwing(u,v){
  if(!P||P.swung||P.done) return;
  P.swung=true; P.sw={t:P.t,u,v}; swingAnim=0;
  const bs=batSide(), b=batterOf(bs), human=!!ctrlOf(bs);
  const win=human?[.13,.11,.1][G.mode===2?1:diff]:.11;
  const dt=P.t-P.T;
  const R=batR(b,human), pow=.82+b.pow/100*.32;
  if(Math.abs(dt)>win){ P.res={miss:1}; return; }
  const d=Math.hypot(u-P.fu,(v-P.fv)*.85);
  if(d>R){ P.res={miss:1}; return; }
  const qa=1-d/R, qt=1-Math.abs(dt)/win, q=.55*qa+.45*qt;
  if(q<.3&&Math.random()<.55){ P.res={foul:1,q}; return; }
  const ev=clamp(46+72*q*pow+gauss()*6,35,119);
  const la=clamp(13+(P.fv-v)/R*44+gauss()*7,-25,78);
  const spray=dt/win*52+gauss()*10;
  P.res={ev,la,spray,q,foul:Math.abs(spray)>45};
}
function callPitch(){
  P.done=true;
  const inZ=Math.abs(P.fu)<=1.08&&Math.abs(P.fv)<=1.08;
  sfx.pop();
  if(P.swung){ addStrike('Swing and a miss',true); return; }
  if(inZ) addStrike('Strike',false); else addBall();
}
function addStrike(txt,swung){
  if(G.mode===3){ derbyOut(swung?'Swing and miss':'Called strike'); return; }
  G.strikes++;
  if(G.strikes>=3){ if(TEST) LOG.push({txt:'K'}); toast(swung?'Strikeout swinging':'Strikeout looking','#f87171'); recordOut(); sfx.out(); endPA(); return; }
  toast(txt+'!','#f87171'); nextPitch(.7);
}
function addBall(){
  if(G.mode===3){ toast('Ball'); nextPitch(.6); return; }
  G.balls++;
  if(G.balls>=4){ if(TEST) LOG.push({txt:'BB'}); toast('Walk','#60a5fa'); walk(); endPA(); return; }
  toast('Ball','#60a5fa'); nextPitch(.7);
}
function walk(){
  const b=batterOf(batSide()), n={nm:b.nm,num:b.num};
  if(G.bases[0]){ if(G.bases[1]){ if(G.bases[2]) scoreRun(); G.bases[2]=G.bases[1]; } G.bases[1]=G.bases[0]; }
  G.bases[0]=n;
}
function foul(){
  if(TEST) LOG.push({txt:'foul'});
  if(G.mode===3){ derbyOut('Foul ball'); return; }
  if(G.strikes<2) G.strikes++;
  toast('Foul ball','#fbbf24'); nextPitch(.8);
}
function recordOut(){ G.outs++; }
function scoreRun(){ G.score[batSide()]++; G.halfRuns++; }
let waitT=0, waitFn=null;
function after(t,fn){ waitT=t; waitFn=fn; phase='wait'; phT=0; }
function nextPitch(t){ after(t,()=>{ phase='aim'; phT=0; P=null; F=null; }); }
function endPA(){
  G.ord[batSide()]++; G.balls=0; G.strikes=0;
  after(1.1,()=>{
    P=null; F=null;
    if(walkOff()){ gameOver(); return; }
    if(G.outs>=3) endHalf(); else { phase='aim'; phT=0; }
  });
}
const walkOff=()=>G.mode!==3&&G.half===1&&G.inn>=G.innings&&G.score[1]>G.score[0];
function endHalf(){
  G.line[G.half][G.inn-1]=G.halfRuns; G.halfRuns=0; G.outs=0; G.bases=[null,null,null]; G.balls=G.strikes=0;
  if(G.half===0){
    if(G.inn>=G.innings&&G.score[1]>G.score[0]){ G.line[1][G.inn-1]='X'; gameOver(); return; }
    G.half=1;
  } else {
    if(G.inn>=G.innings&&G.score[0]!==G.score[1]){ gameOver(); return; }
    if(G.inn>=15){ gameOver(); return; }
    G.inn++; G.half=0;
  }
  const bt=TEAMS[G.t[G.half]];
  banner(`${G.half?'Bottom':'Top'} of the ${ORD(G.inn)}`,`${bt.full} at bat`,bt.c1,1.4);

function derbyOut(txt){

function gameOver(){

/* ---------- field play ---------- */
function ballStep(b,dt){
  if(b.z>0||b.vz>0){ const s=Math.hypot(b.vx,b.vy,b.vz); b.vx-=K_DRAG*s*b.vx*dt; b.vy-=K_DRAG*s*b.vy*dt; b.vz-=(GRAV+K_DRAG*s*b.vz)*dt; }
  b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt;
  let ev=null;
  if(b.z<=0){
    b.z=0;
    if(b.vz<-7){ if(!b.bounced){ b.bounced=true; ev='land'; } b.vz=-b.vz*.36; b.vx*=.72; b.vy*=.72; }
    else { b.vz=0; if(!b.bounced){ b.bounced=true; ev='land'; } const sp=Math.hypot(b.vx,b.vy), ns=Math.max(0,sp-30*dt); if(sp>0){ b.vx*=ns/sp; b.vy*=ns/sp; } }
  }
  const r=Math.hypot(b.x,b.y), th=Math.atan2(b.x,b.y);
  if(!b.gone&&Math.abs(th)<=FAIR+.01&&r>=fenceR(th)){
    if(b.z>10&&!b.bounced){ b.gone=true; ev='hr'; }
    else if(!b.gone){ const nx=b.x/r, ny=b.y/r, dot=b.vx*nx+b.vy*ny; if(dot>0){ b.vx-=1.4*dot*nx; b.vy-=1.4*dot*ny; } const fr=fenceR(th)-.6; b.x=nx*fr; b.y=ny*fr; if(!ev) ev='wall'; }
  }
  if(!b.gone&&(Math.abs(th)>FAIR||b.y<0)&&r>fenceR(FAIR)*.92){ b.vx=b.vy=0; b.vz=Math.min(b.vz,0); }
  return ev;
}
function predict(b0){
  const b=Object.assign({},b0), pts=[]; let t=0;
  for(let i=0;i<8*120;i++){
    const ev=ballStep(b,1/120); t+=1/120;
    if(ev==='hr') break;
    if(i%4===3) pts.push({t,x:b.x,y:b.y,z:b.z,bounced:b.bounced});
    if(b.bounced&&Math.hypot(b.vx,b.vy)<1) break;
  }
  return pts;
}
const isFoulPos=(x,y)=>Math.abs(Math.atan2(x,y))>FAIR||y<-2;
function startPlay(res){
  const side=batSide(), fs=fieldSide();
  const dir=res.spray*Math.PI/180, la=res.la*Math.PI/180, v=res.ev*1.467;
  F={t:0,side,ball:{x:0,y:2,z:3,vx:v*Math.cos(la)*Math.sin(dir),vy:v*Math.cos(la)*Math.cos(dir),vz:v*Math.sin(la),bounced:false,gone:false,held:null,thr:null},
     fl:Object.entries(HOME_POS).map(([pos,[x,y]])=>({pos,x,y,react:pos==='C'?.4:isOF(pos)?.38:.24,holdT:0})),
     run:[],hr:false,hrDist:0,settle:0,throws:0,outs:0,runs:0,batOut:null,fly:false,foulBall:false,landed:false,done:false,res,doneT:0,orig:G.bases.slice(),chaser:null,cpt:null,cover:{}};
  F.fl.forEach(f=>{ f.x+=rnd(-4,4); f.y+=rnd(-4,4); });
  if(G.mode!==3){
    for(let b=3;b>=1;b--) if(G.bases[b-1]) F.run.push({...G.bases[b-1],at:b,from:b,to:null,p:0,spd:RUN_SPD+rnd(-2,2),delay:0});
    const bt=batterOf(side); F.run.push({nm:bt.nm,num:bt.num,at:0,from:0,to:1,p:0,spd:RUN_SPD-1+rnd(-2,2),delay:.35,bat:true});
    G.bases=[null,null,null];
  }
  planChase();
  phase='play'; phT=0;
}
function planChase(){
  const pts=predict(F.ball); let best=null;
  for(const pt of pts){
    if(pt.z>7) continue;
    if(Math.hypot(pt.x,pt.y)>fenceR(Math.atan2(pt.x,pt.y))+2) continue;
    for(const f of F.fl){
      if(f.pos==='C'&&Math.hypot(pt.x,pt.y)>45) continue;
      const tt=f.react+Math.hypot(pt.x-f.x,pt.y-f.y)/fSpd(f)+(pt.bounced?0:.15);
      if(tt<=pt.t&&(!best||tt<best.tt)) best={f,pt,tt};
    }
    if(best) break;
  }
  if(!best&&pts.length){
    const last=pts[pts.length-1]; let bd=1e9;
    for(const f of F.fl){ if(f.pos==='C') continue; const d=Math.hypot(last.x-f.x,last.y-f.y); if(d<bd){ bd=d; best={f,pt:last}; } }
    /* on balls that get through, the nearest outfielder chases */
    const ofs=F.fl.filter(f=>isOF(f.pos)); if(Math.hypot(last.x,last.y)>150&&!isOF(best.f.pos)) best={f:ofs.sort((a,b)=>Math.hypot(last.x-a.x,last.y-a.y)-Math.hypot(last.x-b.x,last.y-b.y))[0],pt:last};
  }
  if(!best) best={f:F.fl.find(f=>f.pos==='P'),pt:{t:0,x:0,y:60,z:0,bounced:true}};
  F.chaser=best.f; F.cpt=best.pt; F.fly=!best.pt.bounced&&best.pt.z>1.5;
  const by=p=>F.fl.find(f=>f.pos===p), ch=F.chaser.pos;
  F.cover={1:ch==='1B'?by('P'):by('1B'),2:ch==='SS'||ch==='3B'?by('2B'):by('SS'),3:ch==='3B'?by('SS'):by('3B'),4:ch==='C'?by('P'):by('C')};
}
const holder=()=>F.ball.held;
const runnerPos=r=>{ const a=BASE[r.from], b=BASE[r.to===null?r.from:r.to]; return [lerp(a[0],b[0],r.p),lerp(a[1],b[1],r.p)]; };
function ballETA(pt){
  const b=F.ball;
  if(b.held) return Math.max(0,(isOF(b.held.pos)?.45:.3)-b.held.holdT)+Math.hypot(b.held.x-pt[0],b.held.y-pt[1])/THROW;
  if(b.thr) return (b.thr.T-b.thr.t)+Math.hypot(b.thr.x1-pt[0],b.thr.y1-pt[1])/THROW+.3;
  const c=F.chaser, d=Math.hypot(b.x-c.x,b.y-c.y), sp=Math.hypot(b.vx,b.vy);
  return Math.max(F.cpt.t-F.t,d/fSpd(c))+.45+Math.hypot(b.x-pt[0],b.y-pt[1])/THROW+sp*.004;
}
function decide(r){
  if(r.to!==null||r.delay>0||r.at>=4) return;
  const b=r.at, nb=b+1;
  const forced=F.run.some(o=>o!==r&&o.to===b&&o.from===b-1);
  if(!forced){
    if(F.fly&&!r.bat) return;
    if(F.run.some(o=>o!==r&&((o.to===null&&o.at===nb)||o.to===nb))) return;
    const tRun=90/r.spd*.9, tBall=ballETA(BASE[nb]);
    if(!(tRun<tBall*.85)) return;
  }
  r.from=b; r.to=nb; r.p=0;
}
function outRunner(r,kind){
  F.run.splice(F.run.indexOf(r),1); F.outs++; recordOut(); sfx.out();
  if(TEST) LOG.push({txt:`out@${r.to}${r.bat?'B':''}${kind}${F.run.length}`});
  if(r.bat) F.batOut=kind;
  toast(`${shortNm(r.nm)} is out`,'#f87171');
}
function runnerScores(r){
  F.run.splice(F.run.indexOf(r),1);
  if(G.outs>=3) return;
  scoreRun(); F.runs++; sfx.run();
}
function chooseThrow(f){
  let best=null;
  for(const r of F.run){
    if(r.to===null||r.delay>0) continue;
    const n=r.to, bp=BASE[n], d=Math.hypot(f.x-bp[0],f.y-bp[1]);
    const tb=d<6?0:d/THROW+.05, rem=(1-r.p)*90/r.spd;
    if(tb<rem&&(!best||n>best.n)) best={n,tb,r};
  }
  return best;
}
function throwTo(f,n){
  const cov=F.cover[n]||F.fl.find(x=>x.pos==='C'); const bp=BASE[n];
  if(cov===f){ return; }
  const d=Math.hypot(f.x-bp[0],f.y-bp[1]);
  F.ball.held=null; F.ball.thr={x0:f.x,y0:f.y,x1:bp[0],y1:bp[1],n,t:0,T:Math.max(.12,d/THROW),to:cov};
  F.throws++; f.holdT=0; sfx.throw();
}
function fieldTick(dt){
  F.t+=dt; const b=F.ball;
  /* ball */
  if(b.held){ b.x=b.held.x; b.y=b.held.y; b.z=4; b.vx=b.vy=b.vz=0; }
  else if(b.thr){
    const T=b.thr; T.t+=dt; const s=Math.min(1,T.t/T.T);
    b.x=lerp(T.x0,T.x1,s); b.y=lerp(T.y0,T.y1,s); b.z=5+Math.sin(Math.PI*s)*Math.min(25,T.T*12);
    if(s>=1){
      const cov=T.to; cov.x=T.x1; cov.y=T.y1; b.thr=null; b.held=cov; cov.holdT=0; sfx.pop();
      for(const r of F.run.slice()) if(r.to===T.n&&r.delay<=0){ outRunner(r,'ground'); if(G.outs>=3) break; }
    }
  } else {
    const ev=ballStep(b,dt);
    if(ev==='hr'&&!F.hr){
      F.hr=true; F.hrT=F.t; const c=Object.assign({},b); c.gone=true; while(c.z>0) ballStep(c,1/60); F.hrDist=Math.round(Math.hypot(c.x,c.y));
      startHR();
    }
    if(ev==='land'){
      F.landed=true;
      if(isFoulPos(b.x,b.y)&&!F.hr){ F.foulBall=true; F.done=true; return; }
      if(F.fly){ F.fly=false; }
    }
    /* catches */
    if(!F.hr) for(const f of F.fl){
      const reach=f===F.chaser?4:2.5, d=Math.hypot(b.x-f.x,b.y-f.y);
      if(d<reach&&b.z<(b.bounced?4:7.5)&&F.t>f.react){
        b.held=f; f.holdT=0; sfx.pop();
        if(!b.bounced){
          F.fly=false; const bat=F.run.find(r=>r.bat);
          if(bat) outRunner(bat,'fly'); else F.batOut='fly';
          for(const r of F.run){ if(r.to!==null&&!r.bat&&r.to>r.from){ const a=r.from; r.from=r.to; r.to=a; r.p=1-r.p; r.ret=true; } }
        }
        break;
      }
    }
  }
  if(F.done) return;
  /* fielders */
  for(const f of F.fl){
    let tx=HOME_POS[f.pos][0], ty=HOME_POS[f.pos][1];
    if(F.hr){ continue; }
    if(f===F.chaser&&!b.held&&!b.thr){
      if(F.t<F.cpt.t){ tx=F.cpt.x; ty=F.cpt.y; } else { tx=b.x+b.vx*.25; ty=b.y+b.vy*.25; }
    } else {
      for(const n of [1,2,3,4]) if(F.cover[n]===f&&f!==F.chaser){ tx=BASE[n][0]+(n===1?-2:n===3?2:0); ty=BASE[n][1]+(n===2?-2:0); }
      if(f.pos==='P'&&F.cover[1]!==f&&F.cover[3]!==f){ tx=0; ty=60; }
      if((f.pos==='LF'||f.pos==='CF'||f.pos==='RF')&&f!==F.chaser&&!b.held){ const k=.2; tx=lerp(tx,b.x,k); ty=lerp(ty,b.y,k); }
    }
    if(b.held===f) continue;
    if(F.t<f.react) continue;
    const dx=tx-f.x, dy=ty-f.y, d=Math.hypot(dx,dy), st=fSpd(f)*dt;
    if(d>.5){ f.x+=dx/d*Math.min(st,d); f.y+=dy/d*Math.min(st,d); }
  }
  /* runners */
  const order=F.run.slice().sort((a,b)=>(b.to??b.at)-(a.to??a.at));
  for(const r of order){
    if(!F.run.includes(r)) continue;
    if(r.delay>0){ r.delay-=dt; continue; }
    if(r.to!==null){
      /* on a catchable fly, runners go halfway and wait */
      const lead=Math.hypot(F.cpt.x,F.cpt.y)>220?.4:.12;
      if(F.fly&&!r.bat&&!r.ret&&r.p>=lead){ r.p=lead; continue; }
      r.p+=r.spd*dt/90;
      if(r.p>=1){
        r.p=0; r.at=r.to; r.from=r.to; r.to=null; r.ret=false;
        if(r.at===4){ runnerScores(r); continue; }
        if(F.hr){ r.to=r.at+1; r.from=r.at; }
      }
    } else if(!F.hr) decide(r);
  }
  if(F.hr){ if(!F.run.length&&F.t-F.hrT>2) F.done=true; return; }
  if(G.outs>=3){ F.doneT+=dt; if(F.doneT>.5) F.done=true; return; }
  /* holder throws */
  if(b.held){
    const f=b.held; f.holdT+=dt;
    const wait=isOF(f.pos)?.45:.3;
    if(f.holdT>wait&&F.throws<4){
      const c=chooseThrow(f);
      if(c){ if(c.tb===0){ outRunner(c.r,c.r.ret?'fly':'ground'); f.holdT=0; } else throwTo(f,c.n); }
      else {

      }
    }
    const moving=F.run.some(r=>r.to!==null||r.delay>0);
    if(!moving){ F.settle+=dt; if(F.settle>.5) F.done=true; } else F.settle=0;
  }
  if(G.mode===3&&(b.held||(b.bounced&&F.t>2.5))) { F.settle+=dt; if(F.settle>.6) F.done=true; }
  if(F.t>25) F.done=true;
}
function startHR(){
  const side=F.side; F.fly=false;
  for(const r of F.run){ if(r.to===null&&r.at<4){ r.from=r.at; r.to=r.at+1; r.p=0; } r.spd=30; r.delay=Math.min(r.delay,.2); r.ret=false; if(r.from>r.to){ const a=r.from; r.from=r.to; r.to=a; r.p=1-r.p; } }
  if(G.mode===3){ G.derby.hr++; G.derby.long=Math.max(G.derby.long,F.hrDist); }
  sfx.hr(); banner('Home run!',`${F.hrDist} ft`,TEAMS[G.t[side]].c2,2.2);
}
function finishPlay(){
  const res=F;
  if(res.foulBall){ for(let i=0;i<3;i++) G.bases[i]=res.orig[i]; phase='wait'; foul(); return; }
  if(G.mode===3){
    if(res.hr){ toast(`${res.hrDist} ft! That's ${G.derby.hr}`,'#ffd166'); after(1,()=>{ phase='aim'; phT=0; P=null; F=null; }); }
    else derbyOut(`${res.ball.bounced?'In play':'Caught'}, no home run`);
    return;
  }
  const bat=batterOf(F.side);
  for(const r of res.run) if(r.at>=1&&r.at<=3&&r.to===null) G.bases[r.at-1]={nm:r.nm,num:r.num};
  const br=res.run.find(r=>r.bat);
  let txt;
  if(res.hr) txt=res.runs>=4?'Grand slam!':res.runs>1?`${res.runs}-run homer`:'Solo home run';
  else if(res.batOut){
    const la=res.res.la;
    txt=res.outs>=3?'Triple play!':res.outs===2?'Double play':res.batOut==='fly'?(res.runs?'Sacrifice fly':la<16?'Line out':la>48?'Pop out':'Fly out'):'Ground out';
  } else if(br){ txt=res.outs?'Fielder\'s choice':['','Single','Double','Triple'][br.at]||'Safe'; }
  else txt=res.outs>1?'Double play':'Out';
  if(res.hr||(br&&!res.outs)) G.hits[F.side]++;
  if(!res.hr&&res.runs) txt+=` · ${res.runs} run${res.runs>1?'s':''} score${res.runs>1?'':'s'}`;
  if(TEST) LOG.push({txt,ev:Math.round(res.res.ev),la:Math.round(res.res.la),sp:Math.round(res.res.spray),runs:res.runs,outs:res.outs});
  if(!res.hr) toast(`${shortNm(bat.nm)}: ${txt}`,res.batOut?'#f87171':'#34d399');
  else toast(`${shortNm(bat.nm)}: ${txt}`,'#ffd166');
  endPA();
}

/* ---------- input ---------- */
function actorPointer(){
  if(!G||G.over) return null;
  if(phase==='aim'&&ctrlOf(fieldSide())&&G.mode!==3) return 'pit';
  if(ctrlOf(batSide())&&(phase==='aim'||phase==='wind'||phase==='pitch'||phase==='wait')) return 'bat';
  return null;
}
function act(scheme){
  if(!G||paused) return;
  const fs=fieldSide(), bs=batSide();
  if(phase==='aim'&&ctrlOf(fs)&&G.mode!==3&&(scheme==='any'||ctrlOf(fs)===scheme||ctrlOf(fs)==='solo'&&scheme!=='p2')){ phase='wind'; phT=0; G.pending={u:cur.pit.u,v:cur.pit.v,type:ptype}; return; }
  if(phase==='pitch'&&ctrlOf(bs)&&(scheme==='any'||ctrlOf(bs)===scheme||ctrlOf(bs)==='solo'&&scheme!=='p2')) doSwing(cur.bat.u,cur.bat.v);
}
function schemeOfKey(code){
  if(!G) return null;
  if(G.mode===2){ for(const s of ['p1','p2']) if(SCHEME[s].act.includes(code)) return s; return null; }
  return SCHEME.solo.act.includes(code)?'solo':null;
}
function cycleFor(code){
  if(!G||G.mode===3) return;
  const pc=ctrlOf(fieldSide()); if(!pc||phase!=='aim') return;
  const sc=SCHEME[pc==='solo'?'solo':pc];
  if(sc.cyc.includes(code)){ ptype=(ptype+1)%3; sfx.click(); }
  if(pc==='solo'||pc==='p1'){ const dg=code.replace('Numpad','Digit'); if(['Digit1','Digit2','Digit3'].includes(dg)){ ptype=+dg.slice(5)-1; sfx.click(); } }
}
addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==='INPUT'||tag==='SELECT') return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash'].includes(e.code)) e.preventDefault();
  if(e.repeat){ return; }
  keys.add(e.code); audio();
  if(e.code==='KeyZ'){ toggleFs(); return; }
  if(phase==='menu'){ menuKey(e.code); return; }
  if(phase==='over'){ if(e.code==='KeyR'){ startGame(); } else if(['Enter','NumpadEnter','Space','KeyM','Escape'].includes(e.code)) toMenu(); return; }
  if(e.code==='KeyP'||e.code==='Escape'){ paused=!paused; if(paused) banner('Paused','P to resume · M for menu','#000',1e9); else { $('banner').classList.remove('on'); bannerT=0; } return; }
  if(e.code==='KeyM'){ if(confirm('Quit to the menu? This game will end.')) toMenu(); keys.clear(); return; }
  cycleFor(e.code);
  const s=schemeOfKey(e.code); if(s){ ptrUsed=false; act(s); }
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
function canvasXY(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]; }
const PT_BTNS=()=>PITCHES.map((p,i)=>({i,x:24+i*128,y:H-58,w:120,h:40}));
cv.addEventListener('pointermove',e=>{
  const a=actorPointer(); if(!a) return; const [x,y]=canvasXY(e);
  if(e.pointerType==='mouse'||e.buttons){ ptrUsed=true; cur[a].u=clamp((x-ZX)/ZW,-1.8,1.8); cur[a].v=clamp((ZY-y)/ZH,-1.8,1.8); }
});
cv.addEventListener('pointerdown',e=>{
  audio(); e.preventDefault();
  if(!G||paused) return;
  const [x,y]=canvasXY(e);
  if(phase==='aim'&&ctrlOf(fieldSide())&&G.mode!==3){
    for(const b of PT_BTNS()) if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ ptype=b.i; sfx.click(); return; }
  }
  const a=actorPointer(); if(!a) return;
  ptrUsed=true; cur[a].u=clamp((x-ZX)/ZW,-1.8,1.8); cur[a].v=clamp((ZY-y)/ZH,-1.8,1.8);
  act('any');
});
function moveCursors(dt){
  if(!G) return;
  const sp=2.6*dt;
  const mv=(c,sc)=>{ const s=SCHEME[sc]; if(held(s.left)) c.u-=sp; if(held(s.right)) c.u+=sp; if(held(s.up)) c.v+=sp; if(held(s.down)) c.v-=sp; c.u=clamp(c.u,-1.7,1.7); c.v=clamp(c.v,-1.7,1.7); };
  const bc=ctrlOf(batSide()), pc=G.mode===3?null:ctrlOf(fieldSide());
  if(G.mode===2){ if(bc) mv(cur.bat,bc); if(pc&&phase==='aim') mv(cur.pit,pc); }
  else { if(bc) mv(cur.bat,'solo'); else if(pc&&phase==='aim') mv(cur.pit,'solo'); }
}

/* ---------- update ---------- */
function step(dt){
  time+=dt;
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('on'); }
  if(bannerT>0&&!paused){ bannerT-=dt; if(bannerT<=0) $('banner').classList.remove('on'); }
  if(!G||paused||phase==='over') return;
  phT+=dt; hud.pitchT+=dt;
  moveCursors(dt);
  if(swingAnim>=0){ swingAnim+=dt; if(swingAnim>.45) swingAnim=-1; }
  if(phase==='aim'){
    const fs=fieldSide();
    if((!ctrlOf(fs)||G.mode===3)&&phT>(G.mode===3?.9:1.2)){ const t=cpuPitchTarget(); G.pending=t; phase='wind'; phT=0; }
  } else if(phase==='wind'){
    if(phT>.42){ const p=G.pending; throwPitch({u:p.u,v:p.v},p.type); }
  } else if(phase==='pitch'){
    P.t+=dt;
    if(P.cpuSw&&!P.swung&&P.t>=P.cpuSw.t) doSwing(P.cpuSw.u,P.cpuSw.v);
    if(!P.done&&P.res&&!P.res.miss&&P.t>=Math.min(P.T,P.sw?Math.max(P.sw.t,P.T-0.13):P.T)){
      P.done=true;
      if(P.res.foul){ sfx.crack(.2); P.flyOff=true; foul(); return; }
      sfx.crack(P.res.q);
      if(G.mode===3&&P.res.la<10){ /* worm burner */ }
      startPlay(P.res); return;
    }
    if(!P.done&&P.t>P.T+.12) callPitch();
  } else if(phase==='play'){
    const sub=4; for(let i=0;i<sub&&phase==='play';i++){ fieldTick(dt/sub); if(F&&F.done){ finishPlay(); break; } }
  } else if(phase==='wait'){
    waitT-=dt; if(P) P.t+=dt;
    if(waitT<=0&&waitFn){ const f=waitFn; waitFn=null; f(); }
  }
  updateBoard();
}

/* ---------- draw ---------- */
function drawBatter(x,c,t,cu,cv2){
  const team=TEAMS[G.t[batSide()]];
  ctx.save(); ctx.lineCap='round';
  /* legs */
  ctx.strokeStyle='#d6d9df'; ctx.lineWidth=20;
  ctx.beginPath(); ctx.moveTo(x-6,505); ctx.lineTo(x-38,600); ctx.moveTo(x+8,505); ctx.lineTo(x+34,600); ctx.stroke();
  ctx.fillStyle='#111827'; ctx.fillRect(x-52,594,30,12); ctx.fillRect(x+22,594,30,12);
  /* body */
  ctx.fillStyle=G.half===0?'#b8bec8':'#f3f4f6'; ctx.strokeStyle=team.c1; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect(x-30,392,60,118,14); ctx.fill(); ctx.stroke();
  ctx.fillStyle=team.c1; ctx.font='800 34px Arial Narrow, sans-serif'; ctx.textAlign='center'; ctx.fillText(batterOf(batSide()).num,x,462);
  /* swing: bat angle */
  let ang=-2.1, hx=x+30, hy=400;
  if(t>=0){ const s=Math.min(1,t/.2); const e=1-Math.pow(1-s,2); ang=lerp(-2.1,1.35,e); hx=lerp(x+30,x+50,e); hy=lerp(400,clamp(zy(cv2),360,540),Math.sin(Math.min(1,s)*Math.PI/2)); if(t>.2){ ang=1.35+(t-.2)*2; } }
  ctx.strokeStyle=team.c1; ctx.lineWidth=12; ctx.beginPath(); ctx.moveTo(x+18,410); ctx.lineTo(hx,hy); ctx.stroke();
  ctx.strokeStyle='#c8955a'; ctx.lineWidth=11; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(ang)*150,hy+Math.sin(ang)*150); ctx.stroke();
  ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(ang)*40,hy+Math.sin(ang)*40); ctx.stroke();
  /* helmet */
  ctx.fillStyle=team.c1; ctx.beginPath(); ctx.arc(x+4,362,25,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=team.c2; ctx.fillRect(x+20,360,16,7);
  ctx.restore();
}
function drawPitcher(){
  const ft=TEAMS[G.t[fieldSide()]], s=phase==='wind'?phT/.42:phase==='pitch'?1:0, x=RX, y=RY+8;
  ctx.save(); ctx.lineCap='round';
  ctx.strokeStyle='#d6d9df'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(x-3,y-8); ctx.lineTo(x-8-s*6,y+6); ctx.moveTo(x+3,y-8); ctx.lineTo(x+8+(s>.5?10:0),y+6-(s>.2&&s<.7?8:0)); ctx.stroke();
  ctx.fillStyle=G.half===1?'#b8bec8':'#f3f4f6'; ctx.strokeStyle=ft.c1; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(x-9,y-32,18,26,5); ctx.fill(); ctx.stroke();
  const arm=s<.7?lerp(-.4,-2.6,s/.7):lerp(-2.6,1.2,(s-.7)/.3);
  ctx.strokeStyle=G.half===1?'#b8bec8':'#f3f4f6'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x+7,y-28); ctx.lineTo(x+7+Math.cos(arm)*16,y-28+Math.sin(arm)*16); ctx.stroke();
  ctx.fillStyle='#8b5a2b'; ctx.beginPath(); ctx.arc(x-12,y-22,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=ft.c1; ctx.beginPath(); ctx.arc(x,y-38,7,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawZoneUI(){
  const bs=batSide(), fs=fieldSide();
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2; ctx.setLineDash([6,5]);
  ctx.strokeRect(zx(-1),zy(1),ZW*2,ZH*2); ctx.setLineDash([]);
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
  for(const k of [-1/3,1/3]){ ctx.beginPath(); ctx.moveTo(zx(k),zy(1)); ctx.lineTo(zx(k),zy(-1)); ctx.moveTo(zx(-1),zy(k)); ctx.lineTo(zx(1),zy(k)); ctx.stroke(); }
  /* pitcher target */
  if(ctrlOf(fs)&&G.mode!==3&&(phase==='aim'||phase==='wind')){
    const c=phase==='wind'?G.pending:cur.pit, px=zx(c.u), py=zy(c.v);
    ctx.strokeStyle=G.mode===2?'#f472b6':'#34d399'; if(G.mode===2&&ctrlOf(fs)==='p1') ctx.strokeStyle='#34d399';
    ctx.lineWidth=3; ctx.beginPath(); ctx.arc(px,py,12,0,Math.PI*2); ctx.moveTo(px-20,py); ctx.lineTo(px+20,py); ctx.moveTo(px,py-20); ctx.lineTo(px,py+20); ctx.stroke();
  }
  /* batter contact cursor */
  if(ctrlOf(bs)){
    const b=batterOf(bs), R=batR(b,true), c=P&&P.sw?P.sw:cur.bat;
    ctx.strokeStyle=G.mode===2&&ctrlOf(bs)==='p2'?'#f472b6':'#ffd166'; ctx.lineWidth=3;
    ctx.fillStyle='rgba(255,209,102,.12)';
    ctx.beginPath(); ctx.ellipse(zx(c.u),zy(c.v),R*ZW,R*ZH/1.1,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(zx(c.u),zy(c.v),3,0,Math.PI*2); ctx.fillStyle=ctx.strokeStyle; ctx.fill();
  }
  ctx.restore();
}
function drawPitchBall(){
  if(!P) return;
  if(P.done&&P.res&&!P.res.miss&&!P.flyOff) return;
  const s=P.t/P.T;
  if(phase!=='pitch'&&!(phase==='wait'&&s<1.6)) return;
  let x,y,r;
  if(P.flyOff){ const k=(P.t-P.T)*3; x=zx(P.fu)+k*(P.res.spray>0?600:-600); y=zy(P.fv)-k*500; r=9-k*4; if(r<1) return; }
  else if(s<=1){
    x=lerp(RX+8,zx(P.fu-P.bu),s)+P.bu*ZW*s*s*s; y=lerp(RY-30,zy(P.fv-P.bv),s)-P.bv*ZH*s*s*s-Math.sin(Math.PI*s)*26;
    r=lerp(2.5,9.5,s*s);
  } else { const k=Math.min(1,(s-1)*3); x=zx(P.fu)*(1-k*.1)+ZX*k*.1; y=zy(P.fv)+k*90; r=9.5+k*8; if(k>=1) return; }
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x,Math.max(y+r*4,lerp(RY+20,560,Math.min(1,s))),r*1.2,r*.4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#dc2626'; ctx.lineWidth=Math.max(1,r/6); ctx.beginPath(); ctx.arc(x-r*.9,y,r*.7,-.9,.9); ctx.stroke(); ctx.beginPath(); ctx.arc(x+r*.9,y,r*.7,Math.PI-.9,Math.PI+.9); ctx.stroke();
  ctx.restore();
}
function drawCatcher(){
  const ft=TEAMS[G.t[fieldSide()]];
  ctx.save();
  ctx.fillStyle='#1f2937'; ctx.beginPath(); ctx.ellipse(ZX+12,H+30,92,70,0,Math.PI,0); ctx.fill();
  ctx.fillStyle=ft.c1; ctx.beginPath(); ctx.arc(ZX+12,H-46,26,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8b5a2b'; ctx.beginPath(); ctx.ellipse(ZX+80,H-60,22,26,.3,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function hudText(t,x,y,size=18,col='#fff',align='left'){ ctx.font=`800 ${size}px 'Big Shoulders Display','Arial Narrow',sans-serif`; ctx.textAlign=align; ctx.lineWidth=4; ctx.strokeStyle='rgba(5,8,18,.85)'; ctx.strokeText(t,x,y); ctx.fillStyle=col; ctx.fillText(t,x,y); }
function drawBattingView(){
  ctx.drawImage(bvBg,0,0,W,H);
  drawPitcher();
  drawZoneUI();
  const bs=batSide();
  drawBatter(ZX-150,null,swingAnim,0,P&&P.sw?P.sw.v:cur.bat.v);
  drawPitchBall();
  drawCatcher();
  /* HUD */
  const b=batterOf(bs), bt=TEAMS[G.t[bs]], fs=fieldSide(), pt=pitcherOf(fs);
  ctx.fillStyle='rgba(5,8,18,.72)'; ctx.beginPath(); ctx.roundRect(14,14,340,62,10); ctx.fill();
  ctx.fillStyle=bt.c1; ctx.fillRect(14,14,8,62);
  hudText(`#${b.num} ${b.nm}  ·  ${b.pos}`,32,40,22);
  hudText(`Contact ${b.con}  ·  Power ${b.pow}${G.mode===3?'':`  ·  ${ORD((G.ord[bs]%9)+1)} in order`}`,32,64,17,'#b7c2dd');
  if(G.mode!==3){
    ctx.fillStyle='rgba(5,8,18,.72)'; ctx.beginPath(); ctx.roundRect(W-314,14,300,62,10); ctx.fill();
    ctx.fillStyle=TEAMS[G.t[fs]].c1; ctx.fillRect(W-22,14,8,62);
    hudText(`P  ${pt.nm}`,W-34,40,22,'#fff','right');
    hudText(`Velo ${pt.vel}  ·  Control ${pt.ctl}`,W-34,64,17,'#b7c2dd','right');
  }
  if(hud.pitchTxt&&hud.pitchT<1.6&&P) hudText(hud.pitchTxt,ZX,118,26,'#ffd166','center');
  /* pitch selector */
  if(ctrlOf(fs)&&G.mode!==3&&phase==='aim'){
    for(const bt2 of PT_BTNS()){
      const on=bt2.i===ptype; ctx.fillStyle=on?'#ffd166':'rgba(5,8,18,.78)'; ctx.beginPath(); ctx.roundRect(bt2.x,bt2.y,bt2.w,bt2.h,20); ctx.fill();
      ctx.strokeStyle=on?'#ffd166':'#27345a'; ctx.lineWidth=2; ctx.stroke();
      ctx.font="800 18px 'Big Shoulders Display','Arial Narrow',sans-serif"; ctx.textAlign='center'; ctx.fillStyle=on?'#08101f':'#dbe3f5';
      ctx.fillText(`${bt2.i+1} ${PITCHES[bt2.i].n}`,bt2.x+bt2.w/2,bt2.y+27);
    }
    hudText(G.mode===2?(ctrlOf(fs)==='p1'?'Player 1 pitching: aim WASD, Q pitch type, Space to throw':'Player 2 pitching: aim arrows, / pitch type, Enter to throw'):'Aim, pick a pitch, then Space or tap the zone to throw',24,H-72,18,'#ffd166');
  } else if(ctrlOf(bs)&&(phase==='aim'||phase==='wind')){
    hudText(G.mode===2?(ctrlOf(bs)==='p1'?'Player 1 batting: WASD to aim, Space to swing':'Player 2 batting: arrows to aim, Enter to swing'):'Line up the circle with the ball and swing as it reaches the plate',24,H-24,18,'#ffd166');
  }
  drawBug();
}
function drawBug(){
  if(G.mode===3){
    ctx.fillStyle='rgba(5,8,18,.8)'; ctx.beginPath(); ctx.roundRect(W-216,H-74,202,60,10); ctx.fill();
    hudText(`HR ${G.derby.hr}`,W-200,H-38,30,'#ffd166'); hudText(`Outs ${G.derby.outs}/10`,W-28,H-38,22,'#fff','right'); return;
  }
  const x=W-250, y=H-80;
  ctx.fillStyle='rgba(5,8,18,.82)'; ctx.beginPath(); ctx.roundRect(x,y,236,66,10); ctx.fill();
  for(let s=0;s<2;s++){ const t=TEAMS[G.t[s]]; ctx.fillStyle=t.c1; ctx.fillRect(x+8,y+8+s*26,8,22); hudText(t.abbr,x+22,y+26+s*26,20); hudText(G.score[s],x+92,y+26+s*26,22,'#ffd166','right'); }
  const bx=x+128, by=y+33;
  for(const [i,dx,dy] of [[0,14,0],[1,0,-13],[2,-14,0]]){ ctx.save(); ctx.translate(bx+dx+14,by+dy); ctx.rotate(Math.PI/4); ctx.fillStyle=G.bases[i]?'#ffd166':'transparent'; ctx.strokeStyle='#ffd166'; ctx.lineWidth=2; ctx.fillRect(-6,-6,12,12); ctx.strokeRect(-6,-6,12,12); ctx.restore(); }
  hudText(`${G.half?'▼':'▲'}${G.inn}`,x+186,y+28,20,'#fff');
  hudText(`${G.balls}-${G.strikes}`,x+186,y+54,20,'#fff');
  for(let i=0;i<2;i++){ ctx.fillStyle=i<G.outs?'#ef4444':'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.arc(x+140+i*14,y+56,5,0,Math.PI*2); ctx.fill(); }
}
function drawFieldView(){
  ctx.drawImage(fvBg,0,0,W,H);
  const fsT=TEAMS[G.t[F.side?0:1]], bsT=TEAMS[G.t[F.side]];
  const dot=(x,y,fill,ring,r=7)=>{ ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(fx(x)+2,fy(y)+3,r,r*.6,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle=fill; ctx.strokeStyle=ring; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(fx(x),fy(y),r,0,Math.PI*2); ctx.fill(); ctx.stroke(); };
  for(const f of F.fl) dot(f.x,f.y,fsT.c1,F.side?'#b8bec8':'#f3f4f6');
  for(const r of F.run){ const [x,y]=runnerPos(r); dot(x,y,bsT.c1,'#ffd166',7.5); }
  const b=F.ball;
  if(!b.gone||b.z>0){
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(fx(b.x),fy(b.y),4,2.5,0,0,Math.PI*2); ctx.fill();
    const r=3.5+Math.min(7,b.z*.05);
    ctx.fillStyle='#fff'; ctx.strokeStyle='#111'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(fx(b.x),fy(b.y)-b.z*FS*.55,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
  if(F.fly&&F.cpt&&!b.held){ ctx.strokeStyle='rgba(255,209,102,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(fx(F.cpt.x),fy(F.cpt.y),9,0,Math.PI*2); ctx.stroke(); }
  hudText(`Exit velo ${Math.round(F.res.ev)} mph  ·  Launch ${Math.round(F.res.la)}°`,24,40,20,'#ffd166');
  drawBug();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(!G){ ctx.drawImage(bvBg,0,0,W,H); return; }
  if((phase==='play'||(phase==='wait'&&F))&&F) drawFieldView(); else drawBattingView();
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  step(dt); draw();
  requestAnimationFrame(frame);
}

/* ---------- top buttons ---------- */
function toggleFs(){
  const st=$('stage');
  try{ if(document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen&&st.requestFullscreen(); }catch(e){}
}
$('btnFs').addEventListener('click',toggleFs);
$('btnSnd').addEventListener('click',()=>{ muted=!muted; $('btnSnd').textContent=muted?'Sound off':'Sound on'; if(!muted){ audio(); sfx.click(); } });
$('result').addEventListener('click',()=>{ if(phase==='over') toMenu(); });

if(TEST) window.__bb={LOG,get G(){return G;},get F(){return F;},get phase(){return phase;},step,startGame,setMode:m=>{menuMode=m;}};
renderMenu();
requestAnimationFrame(frame);
})();
</script>
