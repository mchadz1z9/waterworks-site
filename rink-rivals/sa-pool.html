function cpuPlace(){const g=G;g.cue.x=330;g.cue.y=300;g.inhand=false}
function cpuPlan(){const g=G,c=g.cue,pg=g.grp[1];const mine=g.balls.filter(b=>!b.in&&(pg?(grpOf(b.n)===pg||(grpOf(b.n)==='eight'&&g.balls.filter(q=>!q.in&&q.n!==8&&grpOf(q.n)===pg).length===0)):b.n!==8));let best=null,bs=1e9;const list=mine.length?mine:g.balls.filter(b=>!b.in);

  const score=cd+bd*.6+da*220;if(score<bs){bs=score;best={ang:Math.atan2(cy,cx),pw:clamp((cd+bd)/900+.18,.25,.95),b}}}
 if(!best){const t=list[Math.floor(Math.random()*list.length)];best={ang:Math.atan2(t.y-c.y,t.x-c.x),pw:.45,b:t}}
 const sd=RIV[sv.rv][2]/1000;best.ang+=gauss()*sd;best.pw=clamp(best.pw*(1+gauss()*.06*(1.2-RIV[sv.rv][1])),.2,1);return best}
function step(dt){const g=G;if(!g)return;g.sp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=dt*2});g.sp=g.sp.filter(p=>p.l>0);if(g.over)return;g.t+=dt;
 if(g.ph==='aim'){if(g.turn===0){if(g.hold)g.pw=Math.min(1,g.pw+dt*.9)}else{if(g.cpuT>0){g.cpuT-=dt;if(g.cpuT<=0){g.plan=cpuPlan();g.aimA=g.plan.ang;g.ph='cpuaim';g.cpuT=.8}}}}
 else if(g.ph==='cpuaim'){g.cpuT-=dt;const c=g.cue;g.mx=c.x+Math.cos(g.plan.ang)*200;g.my=c.y+Math.sin(g.plan.ang)*200;g.pw=Math.min(g.plan.pw,g.pw+dt*1.2);if(g.cpuT<=0){shoot(g.plan.ang,g.plan.pw);g.pw=0}}
 else if(g.ph==='roll'){const N=2;for(let i=0;i<N;i++)physics(dt/N);if(allStill()){g.settle=(g.settle||0)+dt;if(g.settle>.25){g.settle=0;resolve()}}else g.settle=0}}

function ball(x,b){const col=b.n===0?'#f6f6f0':COLS[(b.n-1)%8];x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(b.x+3,b.y+4,BR,BR*.8,0,0,7);x.fill();

function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d'),g=G;
 const bg=x.createRadialGradient(500,280,100,500,280,620);bg.addColorStop(0,'#2a1a10');bg.addColorStop(1,'#0c0705');x.fillStyle=bg;x.fillRect(0,0,1000,560);

 x.fillStyle='#fff';[[250,140],[500,140],[750,140],[250,460],[500,460],[750,460]].forEach(d=>{x.globalAlpha=.7;x.beginPath();x.arc(d[0],d[1]===140?TY0-36:TY1+36,3,0,7);x.fill()});x.globalAlpha=1;

 g.balls.forEach(b=>{if(!b.in)ball(x,b)});if(!g.cue.in)ball(x,g.cue);
