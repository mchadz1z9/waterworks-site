<title>Rival World</title>
<style>
:root{--tx:#f1f7ff;--mut:#a7b7cc;--acc:linear-gradient(135deg,#22c55e,#0ea5e9)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#9cc9ef;color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
button{font-family:inherit;cursor:pointer}
.bk{position:fixed;left:12px;top:12px;z-index:6;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font:800 19px system-ui;text-decoration:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;left:62px;top:12px;z-index:4;display:flex;gap:8px;flex-wrap:wrap;font:800 14px system-ui}
#top span,#top button{background:rgba(10,20,40,.6);border:0;color:#fff;border-radius:10px;padding:7px 11px;font:800 14px system-ui;backdrop-filter:blur(4px)}
#mini{position:fixed;right:12px;top:12px;z-index:4;width:190px;height:190px;border-radius:50%;border:3px solid rgba(255,255,255,.75);box-shadow:0 4px 16px #0006;cursor:pointer;background:#0b1220}
#area{position:fixed;right:12px;top:210px;z-index:4;width:190px;text-align:center;font:900 14px system-ui;text-shadow:0 2px 6px #000}
#prompt{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);z-index:4;background:rgba(10,20,40,.78);border-radius:14px;padding:12px 18px;font:900 17px system-ui;display:none;text-align:center;border:2px solid #22c55e}
#prompt small{display:block;font:700 12px system-ui;color:var(--mut);margin-top:3px}
#help{position:fixed;left:12px;bottom:12px;z-index:4;font:700 12px system-ui;color:#fff;background:rgba(10,20,40,.5);border-radius:10px;padding:7px 10px;max-width:60vw;line-height:1.5}
.ov{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(5,10,20,.6);padding:14px}
.box{background:rgba(10,18,32,.96);border:1px solid #2b3d5c;border-radius:20px;padding:20px;max-width:720px;width:100%;max-height:88vh;overflow:auto}
.box h2{margin:0 0 6px;font:900 26px system-ui}
.btn{border:0;border-radius:12px;padding:12px 16px;font:900 15px system-ui;background:var(--acc);color:#04130a}.btn.g{background:#1c2a44;color:var(--tx)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.games a{display:flex;align-items:center;gap:8px;background:#14213a;border:1px solid #2b3d5c;border-radius:12px;padding:10px;color:#fff;text-decoration:none;font:800 14px system-ui}.games a:hover{border-color:#22c55e}.games a i{font-style:normal;font-size:22px}
#big canvas{width:100%;max-width:640px;aspect-ratio:1;border-radius:14px;display:block;margin:10px auto 0;cursor:crosshair;background:#0b1220}
#q{width:100%;padding:11px 13px;border-radius:12px;border:1px solid #2b3d5c;background:#0a1019;color:#fff;font-size:15px;margin-top:8px}
.list{display:grid;gap:6px;margin-top:10px}.list button{display:flex;gap:10px;align-items:center;text-align:left;background:#14213a;border:1px solid #2b3d5c;color:#fff;border-radius:12px;padding:9px 12px;font:800 14px system-ui}.list button small{color:var(--mut);font-weight:600;margin-left:auto}
#tb{display:none;position:fixed;left:0;right:0;bottom:14px;z-index:4;justify-content:space-between;padding:0 14px;pointer-events:none}
#stick{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);position:relative;pointer-events:auto;touch-action:none}#stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.4)}
#tb .r{display:flex;gap:8px;pointer-events:auto;align-items:flex-end}#tb .r button{width:62px;height:62px;border-radius:50%;border:0;background:rgba(10,20,40,.55);color:#fff;font:900 18px system-ui;touch-action:none}
@media(pointer:coarse){#tb{display:flex}#help{display:none}}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
</style>

  const hl=new THREE.MeshBasicMaterial({color:0xfffbe6}); for(const sx of [-.7,.7]){ const l=new THREE.Mesh(new THREE.BoxGeometry(.35,.15,.05),hl); l.position.set(sx,.85,-2.12); g.add(l); } return g; }
const CAR_COLORS=[0xdc2626,0x2563eb,0xf8fafc,0x111827,0xfacc15,0x16a34a];
const car=makeCar(LS.get('rrWorldCar',0xdc2626)); scene.add(car);
const S={x:BX(5)+60,z:BZ(4)+60,y:0,yaw:Math.PI,vy:0,inCar:false,cx:0,cz:0,cyaw:0,cspd:0,steer:0,walk:0,camYaw:Math.PI,camPitch:.32,camDist:9};
{ const sv=SS.get('rrWorldPos',null); if(sv){ Object.assign(S,sv); } else { S.cx=S.x+5; S.cz=S.z; S.cyaw=Math.PI; } }
/* ====================== input ====================== */
const keys={}; let joy={x:0,y:0};
addEventListener('keydown',e=>{ if(document.activeElement&&document.activeElement.tagName==='INPUT') return; keys[e.code]=true; if(e.code==='Space'||e.code.startsWith('Arrow')) e.preventDefault(); if(e.code==='KeyE') interact(); if(e.code==='KeyF') toggleCar(); if(e.code==='KeyM') openMap(); if(e.code==='Escape') document.querySelectorAll('.ov').forEach(o=>o.style.display='none'); });
addEventListener('keyup',e=>{ keys[e.code]=false; }); addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
let drag=null; canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,id:e.pointerId}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; S.camYaw-=(e.clientX-drag.x)*.006; S.camPitch=clamp(S.camPitch+(e.clientY-drag.y)*.004,-.1,1.2); drag.x=e.clientX; drag.y=e.clientY; });
canvas.addEventListener('pointerup',()=>{ drag=null; }); canvas.addEventListener('wheel',e=>{ S.camDist=clamp(S.camDist+e.deltaY*.01,4,30); },{passive:true});
const stick=$('stick'); let sid=null; stick.addEventListener('pointerdown',e=>{ sid=e.pointerId; stick.setPointerCapture(sid); e.stopPropagation(); });
stick.addEventListener('pointermove',e=>{ if(e.pointerId!==sid) return; const r=stick.getBoundingClientRect(), dx=(e.clientX-r.left-60)/50, dy=(e.clientY-r.top-60)/50, n=Math.hypot(dx,dy), k=n>1?1/n:1; joy={x:dx*k,y:dy*k}; stick.firstElementChild.style.transform=`translate(${joy.x*40}px,${joy.y*40}px)`; });
const sEnd=()=>{ sid=null; joy={x:0,y:0}; stick.firstElementChild.style.transform=''; }; stick.addEventListener('pointerup',sEnd); stick.addEventListener('pointercancel',sEnd);
document.querySelectorAll('#tb .r button').forEach(b=>{ const k=b.dataset.k; b.addEventListener('pointerdown',e=>{ e.preventDefault(); keys[k]=true; if(k==='KeyE') interact(); if(k==='KeyF') toggleCar(); }); const up=()=>keys[k]=false; b.addEventListener('pointerup',up); b.addEventListener('pointerleave',up); });
/* ====================== movement ====================== */
function hitSolid(x,z,r){ for(const s of SOLIDS) if(x>s.x0-r&&x<s.x1+r&&z>s.z0-r&&z<s.z1+r) return s; return null; }
function nearestDoor(maxD){ let best=null,bd=maxD; const px=S.inCar?S.cx:S.x, pz=S.inCar?S.cz:S.z; for(const p of PLACES){ const d=Math.hypot(p.door.x-px,p.door.z-pz); if(d<bd){ bd=d; best=p; } } return best; }
function toggleCar(){ if(S.inCar){ S.inCar=false; S.x=S.cx-Math.cos(S.cyaw)*2.6; S.z=S.cz+Math.sin(S.cyaw)*2.6; S.y=hgt(S.x,S.z); S.yaw=S.cyaw; }
  else { const d=Math.hypot(S.cx-S.x,S.cz-S.z); if(d<6){ S.inCar=true; } else { /* call your car */ S.cx=S.x+Math.cos(S.camYaw)*4; S.cz=S.z-Math.sin(S.camYaw)*4; if(hitSolid(S.cx,S.cz,1.6)){ S.cx=S.x; S.cz=S.z; } S.cyaw=S.camYaw; S.cspd=0; toast('🚗 Your car is here. Press F to get in'); } } }
$('carB').onclick=toggleCar;
function step(dt){ const fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y, side=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  if(S.inCar){ const acc=fwd>0?14:fwd<0?(S.cspd>0?-26:-8):0; S.cspd+=acc*dt; S.cspd*=1-(.25+(fwd?0:.7))*dt; S.cspd=clamp(S.cspd,-12,46); if(keys.Space) S.cspd*=1-3*dt;
    S.steer+=((-side)*.6-S.steer)*Math.min(1,dt*6); S.cyaw+=S.steer*S.cspd*dt*.09;
    const nx=S.cx-Math.sin(S.cyaw)*S.cspd*dt, nz=S.cz-Math.cos(S.cyaw)*S.cspd*dt; if(hitSolid(nx,nz,1.6)){ S.cspd*=-.3; } else { S.cx=clamp(nx,-1150,1150); S.cz=clamp(nz,-1100,560); }
    S.x=S.cx; S.z=S.cz; S.yaw=S.cyaw; }
  else { const run=keys.ShiftLeft||keys.ShiftRight, sp=(run?9:4.6), n=Math.hypot(fwd,side);
    if(n>.05){ const k=Math.min(1,n)/n; const fx=-Math.sin(S.camYaw), fz=-Math.cos(S.camYaw), rx=Math.cos(S.camYaw), rz=-Math.sin(S.camYaw); const mx=(fx*fwd+rx*side)*k, mz=(fz*fwd+rz*side)*k;
      const tgt=Math.atan2(-mx,-mz); let d=tgt-S.yaw; d=Math.atan2(Math.sin(d),Math.cos(d)); S.yaw+=d*Math.min(1,dt*10); const nx=S.x+mx*sp*dt, nz=S.z+mz*sp*dt;
      if(!hitSolid(nx,S.z,.4)) S.x=clamp(nx,-1150,1150); if(!hitSolid(S.x,nz,.4)) S.z=clamp(nz,-1100,560); S.walk+=dt*sp*1.6; } else S.walk*=.9;
    const gy=hgt(S.x,S.z); if(keys.Space&&S.y<=gy+.01) S.vy=6; S.vy-=18*dt; S.y=Math.max(gy,S.y+S.vy*dt); if(S.y<=gy) S.vy=0; }
  if(S.z>540&&!S.inCar){ S.z=540; } }
/* ====================== UI: prompt, place menu, map, find ====================== */
let near=null; const toastEl=document.createElement('div'); toastEl.style.cssText='position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:8;background:rgba(10,20,40,.85);border-radius:12px;padding:10px 16px;font:800 15px system-ui;display:none'; document.body.appendChild(toastEl);
const toast=t=>{ toastEl.textContent=t; toastEl.style.display='block'; clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.style.display='none',2600); };
function go(href){ SS.set('rrWorldPos',{x:S.x,z:S.z,y:S.y,yaw:S.yaw,inCar:S.inCar,cx:S.cx,cz:S.cz,cyaw:S.cyaw,camYaw:S.camYaw,camPitch:S.camPitch,camDist:S.camDist}); location.href=href; }
function interact(){ if(document.querySelector('.ov[style*="flex"]')) return; const p=nearestDoor(S.inCar?10:6); if(!p) return; if(!p.g.length){ toast(p.ico+' '+p.n+': coming soon!'); return; } if(p.g.length===1) return go(p.g[0].href); openPlace(p); }
function openPlace(p){ $('pT').textContent=p.ico+' '+p.n; $('pD').textContent=p.desc; $('pG').innerHTML=p.g.map(g=>`<a href="${esc(g.href)}" data-h="${esc(g.href)}"><i>${g.ico}</i>${esc(g.name)}</a>`).join(''); $('pG').onclick=e=>{ const a=e.target.closest('a'); if(!a) return; e.preventDefault(); go(a.dataset.h); }; $('placeOv').style.display='flex'; }
const W2M=(x,z,s,ox,oz)=>[(x-ox)*s,(z-oz)*s];
function drawMap(ctx,W,cx,cz,scale,full){ ctx.fillStyle='#3d6b35'; ctx.fillRect(0,0,W,W); const P=(x,z)=>[W/2+(x-cx)*scale,W/2+(z-cz)*scale];
  ctx.fillStyle='#1e6fa8'; let [a,b]=P(-3000,545); ctx.fillRect(0,b,W,W); ctx.fillStyle='#e9d8a6'; [a,b]=P(-3000,505); const [,b2]=P(0,545); ctx.fillRect(0,b,W,b2-b);
  ctx.fillStyle='#e8eef5'; const [mx,my]=P(MT.x,MT.z); ctx.beginPath(); ctx.ellipse(mx,my,330*scale,260*scale,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#2f5a2a'; const [wx,wy]=P(-1000,-400); ctx.fillRect(wx,wy,720*scale,880*scale);
  ctx.strokeStyle='#4b5563'; ctx.lineCap='round'; for(const r of ROADS){ ctx.lineWidth=Math.max(1.5,r.w*scale); const [x1,y1]=P(r.x1,r.z1), [x2,y2]=P(r.x2,r.z2); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  for(const p of PLACES){ const [x,y]=P(p.x,p.z); ctx.fillStyle=hex(p.c); ctx.beginPath(); ctx.arc(x,y,full?7:Math.max(2.5,4*scale*3),0,7); ctx.fill(); if(full){ ctx.font='15px system-ui'; ctx.fillText(p.ico,x-8,y-9); } }
  if(full){ ctx.font='800 13px system-ui'; ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=3; for(const [k,[x,z]] of Object.entries({downtown:[0,60],sports:[480,0],speedway:[840,-300],harbor:[60,520],woods:[-560,0],mountain:[-260,-720]})){ const [px,py]=P(x,z); ctx.strokeText(DISTRICTS[k],px-40,py); ctx.fillText(DISTRICTS[k],px-40,py); } }
  const [px,py]=P(S.x,S.z); ctx.save(); ctx.translate(px,py); ctx.rotate(-S.yaw+Math.PI); ctx.fillStyle='#fde047'; ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(6,7); ctx.lineTo(-6,7); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
const mini=$('mini').getContext('2d');
function openMap(){ $('big').style.display='flex'; const c=$('bigc'), g=c.getContext('2d'); const sc=900/2300; drawMap(g,900,120,-260,sc,true);
  c.onclick=e=>{ const r=c.getBoundingClientRect(), x=120+((e.clientX-r.left)/r.width*900-450)/sc, z=-260+((e.clientY-r.top)/r.height*900-450)/sc; let best=null,bd=60; for(const p of PLACES){ const d=Math.hypot(p.x-x,p.z-z); if(d<bd){ bd=d; best=p; } } if(best){ travel(best); $('big').style.display='none'; } }; }
$('mapB').onclick=openMap; $('mini').onclick=openMap;
function travel(p){ const x=p.door.x, z=p.door.z+p.face*5; if(S.inCar){ S.cx=x+3; S.cz=z; S.cspd=0; S.cyaw=p.face>0?0:Math.PI; } S.x=x; S.z=z; S.y=hgt(x,z); S.yaw=p.face>0?0:Math.PI; S.camYaw=S.yaw; toast(p.ico+' '+p.n); }
$('findB').onclick=()=>{ $('findOv').style.display='flex'; $('q').value=''; drawFind(); setTimeout(()=>$('q').focus(),50); };
function drawFind(){ const q=$('q').value.trim().toLowerCase(); const L=PLACES.filter(p=>!q||(p.n+' '+p.desc+' '+p.g.map(g=>g.name+' '+g.href).join(' ')).toLowerCase().includes(q)); $('fl').innerHTML=L.map(p=>`<button data-n="${esc(p.n)}"><span style="font-size:22px">${p.ico}</span>${esc(p.n)}<small>${DISTRICTS[p.d]} · ${p.g.length?p.g.length+' game'+(p.g.length>1?'s':''):'soon'}</small></button>`).join('')||'<p style="color:var(--mut)">Nothing found.</p>'; }
$('q').oninput=drawFind; $('fl').onclick=e=>{ const b=e.target.closest('[data-n]'); if(!b) return; const p=PLACES.find(x=>x.n===b.dataset.n); $('findOv').style.display='none'; travel(p); };
/* ====================== render loop ====================== */
const camPos=new V3(), look=new V3(); let last=performance.now(), t0=0, miniT=0;
function areaName(){ let best='🌍 Rival World',bd=1e9; for(const [k,[x,z]] of Object.entries({downtown:[0,60],sports:[480,0],speedway:[840,-300],harbor:[60,520],woods:[-560,0],mountain:[-260,-700]})){ const d=Math.hypot(S.x-x,S.z-z); if(d<bd){ bd=d; best=DISTRICTS[k]; } } return best; }
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(.05,(now-last)/1000); last=now; t0+=dt; step(dt);
  /* person */ me.visible=!S.inCar; me.position.set(S.x,S.y,S.z); me.rotation.y=S.yaw+Math.PI; const P=me.userData, sw=Math.sin(S.walk)*.7*Math.min(1,S.walk>0?1:0);
  P.legs[0].rotation.x=sw; P.legs[1].rotation.x=-sw; P.arms[0].rotation.x=-sw*.8; P.arms[1].rotation.x=sw*.8;
  /* car */ const cy=hgt(S.cx,S.cz), cyF=hgt(S.cx-Math.sin(S.cyaw)*2,S.cz-Math.cos(S.cyaw)*2), cyB=hgt(S.cx+Math.sin(S.cyaw)*2,S.cz+Math.cos(S.cyaw)*2); car.position.set(S.cx,cy,S.cz); car.rotation.set(Math.atan2(cyF-cyB,4),S.cyaw,0,'YXZ'); car.userData.wheels.forEach(w=>w.rotation.x-=S.cspd*dt/.38);
  /* camera follows behind */ const tx=S.inCar?S.cx:S.x, ty=(S.inCar?cy+1.4:S.y+1.6), tz=S.inCar?S.cz:S.z; if(S.inCar&&!drag){ let d=(S.cyaw)-S.camYaw; d=Math.atan2(Math.sin(d),Math.cos(d)); S.camYaw+=d*Math.min(1,dt*2.5); }
  const dist=S.camDist*(S.inCar?1.25:1); camPos.set(tx+Math.sin(S.camYaw)*Math.cos(S.camPitch)*dist,ty+Math.sin(S.camPitch)*dist,tz+Math.cos(S.camYaw)*Math.cos(S.camPitch)*dist); camPos.y=Math.max(camPos.y,hgt(camPos.x,camPos.z)+1); cam.position.lerp(camPos,Math.min(1,dt*10)); look.set(tx,ty,tz); cam.lookAt(look);
  sun.position.set(tx+SUNDIR.x*150,ty+SUNDIR.y*150,tz+SUNDIR.z*150); sun.target.position.set(tx,ty,tz); sky.position.copy(cam.position);
  for(const r of rings){ r.scale.setScalar(1+Math.sin(t0*3)*.08); }
  for(const p of PLACES){ const d=Math.hypot(p.x-tx,p.z-tz); p.lbl.visible=d>60&&d<900; }
  /* prompt */ const p=nearestDoor(S.inCar?10:6); if(p!==near){ near=p; if(p){ $('prompt').style.display='block'; $('prompt').innerHTML=`${matchMedia('(pointer:coarse)').matches?'✋':'<b>E</b> ·'} ${p.g.length===1?'Play '+esc(p.g[0].name):p.g.length?'Enter '+esc(p.n):esc(p.n)+' (coming soon)'}<small>${p.ico} ${esc(p.n)}${p.g.length>1?' · '+p.g.length+' games':''}</small>`; } else $('prompt').style.display='none'; }
  miniT-=dt; if(miniT<=0){ miniT=.1; drawMap(mini,380,tx,tz,.55,false); $('area').textContent=areaName(); $('where').textContent=S.inCar?`🚗 ${Math.round(Math.abs(S.cspd)*3.6)} km/h`:'🌍 Rival World'; }
  R.render(scene,cam); }
requestAnimationFrame(frame);
if(!SS.get('rrWorldPos',null)) setTimeout(()=>toast('Welcome to Rival World! Walk up to any glowing ring and press E. Press F for your car.'),800);
window.__W={S,PLACES,step,travel,hgt};
