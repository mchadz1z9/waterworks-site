<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Pickleball</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }

.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; position:relative; z-index:1; }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl{ display:block; }
.viewbtn{ position:absolute; top:8px; right:8px; z-index:4; font:inherit; font-size:15px; color:#fff; background:rgba(5,8,18,.78); border:2px solid #ffd166; border-radius:999px; padding:3px 12px; cursor:pointer; }
.viewbtn:hover{ background:rgba(20,28,51,.95); }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
.st tr.dim td{ opacity:.55; }
.result{ align-items:flex-start; }
.bxw{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.bxs h3{ margin:6px 0 0; font-size:22px; } .bxs h3 img{ width:26px; height:26px; vertical-align:middle; }
.bxs small{ color:#93a0bd; }
.bxw .ls{ font-size:14px; } .bxw .ls th,.bxw .ls td{ padding:1px 6px; }
.result h2{ font-size:clamp(32px,6vw,60px); }
.potg{ margin:12px auto 0; max-width:420px; background:#141c33; border-left:8px solid var(--tc); border-radius:10px; padding:8px 14px; text-align:left; display:flex; flex-direction:column; }
.potg small{ color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:.06em; } .potg b{ font-size:24px; color:#fff; } .potg span{ color:#93a0bd; }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Rink Rivals <span>Pickleball</span></div>
    <div class="tools">
      <a href="./">Home</a> <a href="hockey">Hockey</a>
      <a href="tabletennis">Table Tennis</a>
      <a href="basketball">Basketball</a>
      <button id="btnView" tabindex="-1">Broadcast 3D</button>
      <button id="btnFs" tabindex="-1">Full screen (Z)</button>
      <button id="btnSnd" tabindex="-1">Sound on</button>
    </div>
  </div>

  <section class="board" aria-label="Scoreboard">
    <div class="side" id="sideL"><img id="logoL" alt=""><div style="min-width:0"><div class="tn" id="nameL">-</div><div class="tp" id="tpL">Away</div></div><div class="sc" id="scoreL">0</div></div>
    <div class="clock"><div class="t" id="cntT">0-0</div><div class="pd"><span id="innT">Top 1st</span><span id="basesT"></span></div><div class="pd" id="outsT">0 outs</div></div>
    <div class="side r" id="sideR"><img id="logoR" alt=""><div style="min-width:0"><div class="tn" id="nameR">-</div><div class="tp" id="tpR">Home</div></div><div class="sc" id="scoreR">0</div></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <button class="viewbtn" id="viewBtn2" tabindex="-1">View: Broadcast 3D</button>
    <canvas id="cv" role="img" aria-label="Pickleball game"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="menu"><div class="menu-in" id="menuIn"></div></div>
    <div class="overlay result hidden" id="result"><div id="resultIn"></div></div>
  </div>

  <footer class="keys" id="keysHelp"></footer>
  <section class="hub" id="hub" aria-label="Season hub"></section>
</main>
<script>
(() => {
'use strict';
const W=1120, H=620, DPR=Math.min(2, window.devicePixelRatio||1);
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const TEST=/[?&]test\b/.test(location.search);
const rnd=(a,b)=>a+(b-a)*Math.random(), pick=a=>a[Math.floor(Math.random()*a.length)];
function gauss(){ let u=0; while(!u) u=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random()); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const angD=a=>{ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; };
const G=9.81;

/* ---------- USA Pickleball court: 20 x 44 ft, the non-volley zone ("kitchen") 7 ft each side, net 36 in at the posts and 34 in in the middle ---------- */
const CW=6.096, CL=13.411, HW=CW/2, HL=CL/2, KZ=2.134, NET0=.864, NET1=.914, BR=.037;
const netH=x=>NET0+(NET1-NET0)*Math.min(1,Math.abs(x)/(HW+.3));
/* the ball: 26.5 g, 74 mm, full of holes: heavy drag (about 15 m/s terminal speed) and little spin effect */
const KD=.5*1.225*.45*Math.PI*BR*BR/.0265, KM=.0005, PDT=1/240;
const PROS={m:[['Ben Johns','USA',98],['Federico Staksrud','ARG',95],['Hayden Patriquin','USA',94],['JW Johnson','USA',95],['Christopher Haworth','USA',93],['Gabe Tardio','USA',94],['Andrei Daescu','ROU',92],['Tyson McGuffin','USA',91]],
 w:[['Anna Leigh Waters','USA',98],['Catherine Parenteau','CAN',95],['Anna Bright','USA',95],['Jorja Johnson','USA',93],['Lea Jansen','USA',92],['Parris Todd','USA',91],['Tyra Black','USA',91],['Callie Smith','USA',92]]};
const FLAG={USA:'🇺🇸',ARG:'🇦🇷',ROU:'🇷🇴',CAN:'🇨🇦',GBR:'🇬🇧'};
const mkBall=()=>({x:0,y:1,z:0,vx:0,vy:0,vz:0,wx:0,wy:0,wz:0});
const cpBall=b=>({x:b.x,y:b.y,z:b.z,vx:b.vx,vy:b.vy,vz:b.vz,wx:b.wx,wy:b.wy,wz:b.wz});
function ballStep(b,dt){ const v=Math.hypot(b.vx,b.vy,b.vz);
  b.vx+=(-KD*v*b.vx+KM*(b.wy*b.vz-b.wz*b.vy))*dt; b.vy+=(-G-KD*v*b.vy+KM*(b.wz*b.vx-b.wx*b.vz))*dt; b.vz+=(-KD*v*b.vz+KM*(b.wx*b.vy-b.wy*b.vx))*dt;
  const pz=b.z; b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt; const k=1-.3*dt; b.wx*=k; b.wy*=k; b.wz*=k;
  if((pz<0)!==(b.z<0)&&Math.abs(b.x)<HW+.3&&b.y<netH(b.x)+BR){ if(b.y>netH(b.x)-.03){ b.vz*=.5; b.vy=Math.abs(b.vy)*.3+.8; return {type:'cord'}; } b.z=pz<0?-BR*1.2:BR*1.2; b.vz*=-.15; b.vx*=.5; b.vy*=.4; return {type:'net'}; }
  if(b.y<=BR&&b.vy<0){ b.y=BR; const vin=-b.vy, e=clamp(.78-vin*.015,.6,.78); b.vy=vin*e; const ux=b.vx+BR*b.wz, uz=b.vz-BR*b.wx, u=Math.hypot(ux,uz), lim=.4*(1+e)*vin; let dx=-.35*ux, dz=-.35*uz; if(.35*u>lim&&u>0){ dx=-lim*ux/u; dz=-lim*uz/u; } b.vx+=dx; b.vz+=dz; b.wx+=-1.5*dz/BR; b.wz+=1.5*dx/BR; return {type:'bounce',x:b.x,z:b.z,side:b.z<0?0:1}; }
  return null; }
function predict(b0,T){ const b=cpBall(b0), path=[], ev=[]; let t=0; for(let n=0;n<T/PDT;n++){ const e=ballStep(b,PDT); t+=PDT; if(n%3===0) path.push([t,b.x,b.y,b.z]); if(e) ev.push(Object.assign({t},e)); } return {path,ev}; }
/* the stroke solver: the speed and launch angle that land the ball on a target, clearing the net by a margin */
function spinVec(dx,dz,top){ const L=Math.hypot(dx,dz)||1; return [top*dz/L,0,-top*dx/L]; }
function launch(P,yaw,th,s,w){ return {x:P[0],y:P[1],z:P[2],vx:Math.sin(yaw)*Math.cos(th)*s,vy:Math.sin(th)*s,vz:Math.cos(yaw)*Math.cos(th)*s,wx:w[0],wy:w[1],wz:w[2]}; }
function evalShot(b,own,maxApex){ maxApex=maxApex||99; let clr=9, land=null, apex=0; for(let n=0;n<4/PDT;n++){ const pz=b.z, e=ballStep(b,PDT); apex=Math.max(apex,b.y); if((pz<0)!==(b.z<0)) clr=Math.min(clr,b.y-netH(b.x)); if(e){ if(e.type==='net') return null; if(e.type==='bounce'){ land=e; break; } } }
  if(!land||land.side===own||clr<.04||apex>maxApex) return null; return {land,clr,apex}; }
function solveShot(P,target,sWant,top,thRange,o){ o=o||{}; const own=P[2]<0?0:1; let yaw=Math.atan2(target[0]-P[0],target[1]-P[2]), best=null;
  for(let pass=0;pass<2;pass++){ let pb=null; const w=spinVec(Math.sin(yaw),Math.cos(yaw),top);
    for(let si=0;si<7;si++){ const s=sWant*(.7+.6*si/6); for(let ti=0;ti<26;ti++){ const th=lerp(thRange[0],thRange[1],ti/25), r=evalShot(launch(P,yaw,th,s,w),own,o.maxApex); if(!r) continue;
      const c=Math.hypot(r.land.x-target[0],r.land.z-target[1])+Math.abs(s-sWant)*.05+Math.max(0,r.clr-.22)*(o.flat||0)+Math.max(0,(o.minApex||0)-r.apex)*.8; if(!pb||c<pb.c) pb={c,s,th,yaw,w,land:r.land}; } }
    if(!pb) break; best=pb; yaw+=Math.atan2(target[0]-pb.land.x,Math.abs(target[1]-P[2])+.01)*.9; }
  return best; }

/* ---------- audio ---------- */
let AC=null, muted=false;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }

/* the pickleball "pock" */
const sfx={ click:()=>tone(700,.04,'square',.03), hit:v=>{ tone(620+v*12,.04,'triangle',.09); noise(.04,.14,1800,'bandpass'); }, bounce:()=>{ tone(380,.03,'triangle',.06); noise(.02,.06,1200,'bandpass'); }, net:()=>noise(.08,.12,700), crowd:v=>noise(1.6,v||.12,900), point:()=>tone(660,.12,'sine',.04), fault:()=>tone(240,.3,'square',.04,160) };

/* ---------- state ---------- */
let M=null, phase='menu', paused=false, gSel='m', modeSel='doubles', diff=1, bestOf=1, oppSel=0;
const DIFF=[{name:'Club',ts:.65,ai:-.3},{name:'Pro',ts:.8,ai:0},{name:'Real speed',ts:1,ai:.12}];
const keys=new Set(); const held=a=>a.some(k=>keys.has(k));
const SKEY='rinkRivalsPickleV1'; let SV=(()=>{ try{ return Object.assign({wins:0,played:0,games:0},JSON.parse(localStorage.getItem(SKEY)||'null')||{}); }catch(e){ return {wins:0,played:0,games:0}; } })();
const saveSV=()=>{ try{ localStorage.setItem(SKEY,JSON.stringify(SV)); }catch(e){} };
try{ const p=JSON.parse(localStorage.getItem('rinkRivalsPicklePrefs')||'null'); if(p){ gSel=p.gSel||gSel; modeSel=p.modeSel||modeSel; diff=p.diff??diff; bestOf=p.bestOf||bestOf; } }catch(e){}
const savePrefs=()=>{ try{ localStorage.setItem('rinkRivalsPicklePrefs',JSON.stringify({gSel,modeSel,diff,bestOf})); }catch(e){} };
const rxOf=t=>t?1:-1, fOf=t=>t?-1:1, sideSign=(p)=>(p.side==='R'?1:-1)*rxOf(p.team);
const KITS=[['#0ea5e9','#0369a1'],['#22c55e','#15803d'],['#ef4444','#991b1b'],['#f59e0b','#b45309']];

function mkP(team,idx,name,nat,rat,me){ return {team,idx,name,nat,rat,me:!!me,x:0,z:fOf(team)*-(HL-.2),tx:0,tz:0,side:idx?'L':'R',armT:-9,shot:null,contactT:-9,cShot:null,moving:false,k:clamp((rat-85)/13,0,1.2)}; }
function newMatch(){ const L=PROS[gSel].slice().sort(()=>Math.random()-.5); const dbl=modeSel==='doubles';
  const partner=L[0], o1=L[1], o2=L[2];
  const T0=[mkP(0,0,'You','GBR',90,true)], T1=[mkP(1,0,o1[0],o1[1],o1[2])]; if(dbl){ T0.push(mkP(0,1,partner[0],partner[1],partner[2])); T1.push(mkP(1,1,o2[0],o2[1],o2[2])); }
  M={dbl,teams:[T0,T1],all:T0.concat(T1),score:[0,0],games:[0,0],gameLog:[],servingTeam:Math.random()<.5?0:1,serverNum:dbl?2:1,b:mkBall(),state:'pre',stT:0,t:0,shotIdx:0,lastHitter:-1,since:false,bounces:[0,0],plan:null,msg:null,msgT:0,fb:null,fbT:0,rally:0,trail:[],stats:{won:0,lost:0,winners:0,errors:0},kAI:DIFF[diff].ai};
  for(const p of M.all) p.k=clamp(p.k+(p.me?0:M.kAI),0,1.3);
  M.server=M.teams[M.servingTeam][0];
  phase='play'; paused=false; $('menu').classList.add('hidden'); $('result').classList.add('hidden'); built3=false;
  banner(dbl?`${o1[0].split(' ').pop()} / ${o2[0].split(' ').pop()}`:o1[0],dbl?`You and ${partner[0]} · side-out scoring to 11`:'Singles to 11, win by 2','#38bdf8',2.4); M.stT=0; renderKeysHelp(); updateBoard(); }
/* where everyone stands to start a rally */
function setupServe(){ M.state='serve'; M.stT=0; M.shotIdx=0; M.lastHitter=-1; M.since=false; M.bounces=[0,0]; M.plan=null; M.rally=0; M.trail=[]; M.toss=null;
  if(!M.dbl){ const sv=M.score[M.servingTeam]%2===0?'R':'L'; for(const p of M.all) p.side=sv; }
  for(const p of M.all){ const serving=p.team===M.servingTeam; const isServer=p===M.server, isRecv=!serving&&p.side===M.server.side;
    p.x=sideSign(p)*(M.dbl?1.5:1.5); p.z=fOf(p.team)*-(isServer?HL+.35:isRecv?HL-.2:serving?HL-.2:KZ+.3); if(!M.dbl&&!serving) p.z=fOf(p.team)*-(HL-.2); p.tx=p.x; p.tz=p.z; p.armT=-9; }
  M.receiver=M.all.find(p=>p.team!==M.servingTeam&&p.side===M.server.side);
  const s=M.server; Object.assign(M.b,{x:s.x+rxOf(s.team)*.3,y:.85,z:s.z+fOf(s.team)*.3,vx:0,vy:0,vz:0,wx:0,wy:0,wz:0});
  M.aiServeAt=M.server.me?1e9:1.0+Math.random()*.8; }
const call=()=>M.dbl?`${M.score[M.servingTeam]}-${M.score[1-M.servingTeam]}-${M.serverNum}`:`${M.score[M.servingTeam]}-${M.score[1-M.servingTeam]}`;

/* ---------- strokes ---------- */
const SHOTS={drive:{s:15,top:50,th:[-.1,.45],o:{flat:3}},dink:{s:6,top:-15,th:[0,1.1],o:{maxApex:2.3}},drop:{s:10,top:-20,th:[.1,1.1],o:{}},lob:{s:10,top:30,th:[.4,1.3],o:{minApex:5}},smash:{s:19,top:40,th:[-.8,.05],o:{flat:1}},serve:{s:13,top:30,th:[0,.75],o:{flat:1}},volley:{s:11,top:20,th:[-.2,.5],o:{flat:2}}};
function strike(p,type,q,aimX){ const b=M.b, t=p.team, os=fOf(t), S=SHOTS[type], P=[b.x,b.y,b.z], vin=Math.hypot(b.vx,b.vy,b.vz);
  const atNet=Math.abs(p.z)<KZ+1.2; let tx, tz, err;
  if(type==='serve'){ const recvSide=-sideSign(M.server)*1; tx=rxOf(1-t)*(M.server.side==='R'?1:-1)*1.55+aimX*.8; tz=os*(HL-1+gauss()*.4); }
  else if(type==='dink'){ tx=(aimX||(Math.random()<.6?-Math.sign(p.x||1):Math.sign(p.x||1)))*rnd(.6,2); tz=os*rnd(.9,1.8); }
  else if(type==='drop'){ tx=(aimX||rnd(-1,1))*1.4; tz=os*rnd(1,1.9); }
  else if(type==='lob'){ tx=(aimX||rnd(-1,1))*1.6; tz=os*(HL-.9); }
  else if(type==='smash'||type==='drive'||type==='volley'){ const opp=M.teams[1-t]; const gap=opp.length>1?(opp[0].x+opp[1].x)/2:-opp[0].x*.6; tx=aimX?aimX*(HW-.5):clamp(gap+rnd(-.6,.6),-HW+.4,HW-.4); tz=os*(atNet&&type!=='smash'?rnd(3,5):rnd(4.5,HL-.6)); }
  err=(type==='dink'?.35:type==='drop'?.55:type==='drive'?.6:type==='smash'?.7:.45)*(1.35-q)+Math.max(0,vin-11)*.035;
  tx=clamp(tx+gauss()*err,-HW-.8,HW+.8); tz+=gauss()*err*1.2;

/* the two-bounce rule and the kitchen */
function legalVolley(p){ if(M.shotIdx<3) return 'Two-bounce rule: let it bounce!'; if(Math.abs(p.z)<KZ) return 'Kitchen fault: no volleys in the non-volley zone'; return null; }

/* ---------- planning: who takes the ball and where they meet it ---------- */
function planAll(){ M.plan=null; const t=1-M.lastHitter; if(M.lastHitter<0) return; const pr=predict(M.b,3.5), sgn=t?1:-1;

  M.plan={p:best.p,...best.c,bounce:firstB?{x:firstB.x,z:firstB.z}:null}; }

/* ---------- the rules ---------- */
function onEvent(e){
  if(e.type==='bounce'){ sfx.bounce(); M.lastBounce={x:e.x,z:e.z,t:M.t}; const s=e.side;
    if(M.lastHitter<0) return; if(s===M.lastHitter) return fault(M.lastHitter,'Into your own court');
    if(!M.since){ const inC=Math.abs(e.x)<=HW+BR&&Math.abs(e.z)<=HL+BR; if(!inC) return fault(M.lastHitter,'Out!');
      if(M.shotIdx===1){ const half=Math.sign(e.x)===Math.sign(rxOf(1-M.servingTeam)*(M.server.side==='R'?1:-1)); if(Math.abs(e.z)<KZ) return fault(M.lastHitter,'Serve in the kitchen: fault'); if(!half) return fault(M.lastHitter,'Serve in the wrong court: fault'); }

    M.bounces[s]++; if(M.bounces[s]>=2) return fault(s,'Double bounce'); return; }
  if(e.type==='net'||e.type==='cord') sfx.net(); }
function fault(t,why){ if(M.state!=='live') return; M.state='dead'; M.stT=0; const servT=M.servingTeam; const youLost=t===0;
  if(youLost) M.stats.errors++; else if(M.lastHitter===0) M.stats.winners++;
  let txt=why;
  if(t!==servT){ M.score[servT]++; /* the serving team scores and its server switches sides */ if(M.dbl){ const [a,b]=M.teams[servT]; const s=a.side; a.side=b.side; b.side=s; } sfx.point(); txt+=` · point ${TEAMS_N(servT)}`; if(servT===0) M.stats.won++; else M.stats.lost++; }

  M.msg={t:txt,col:youLost?'#f87171':'#22c55e'}; M.msgT=2.4; if(M.rally>=8) sfx.crowd(.2);
  const [a,b]=M.score; if((a>=11||b>=11)&&Math.abs(a-b)>=2){ const w=a>b?0:1; M.games[w]++; M.gameLog.push([a,b]); M.gameEnd=w; if(M.games[w]>Math.floor(bestOf/2)) M.matchEnd=w; speak(w===0?'Game!':'Game to them',true); }
  else speak(call().split('-').join(' '),false); updateBoard(); }
const TEAMS_N=t=>t===0?'to you':'to them';

/* ---------- movement ---------- */
function basePos(p){ const t=p.team, os=fOf(t); const atNet=(t!==M.servingTeam&&M.shotIdx>=2)||(t===M.servingTeam&&(M.shotIdx>=4||M.shotIdx>=3&&M.lastHitP&&M.lastHitP.team===t&&(M.lastHitP.cShot==='drop'||M.lastHitP.cShot==='dink')));
  const z=os*-(atNet?KZ+.25:HL-.2); let x=M.dbl?sideSign(p)*1.5:clamp(M.b.x*.5,-1.5,1.5); return [x,z]; }
function movePlayers(dt){ for(const p of M.all){ if(p.me&&M.state==='live'){ continue; } let [tx,tz]=M.state==='live'?basePos(p):[p.tx,p.tz];
    if(M.state==='live'&&M.plan&&M.plan.p===p){ tx=M.plan.x-rxOf(p.team)*.45; tz=M.plan.z-fOf(p.team)*.35; if(M.plan.bounced===false) tz=M.plan.z; }
    const sp=p.me?4.6:4+p.k, dx=tx-p.x, dz=tz-p.z, d=Math.hypot(dx,dz), st=Math.min(d,sp*dt); if(d>1e-4){ p.x+=dx/d*st; p.z+=dz/d*st; } p.moving=d>.05;
    if(p.team===0) p.z=Math.min(p.z,-.3); else p.z=Math.max(p.z,.3); } }
function humanMove(dt){ const p=M.all[0]; if(M.state!=='live') return; const mx=(held(['KeyA','ArrowLeft'])?1:0)-(held(['KeyD','ArrowRight'])?1:0), mz=(held(['KeyW','ArrowUp'])?1:0)-(held(['KeyS','ArrowDown'])?1:0), L=Math.hypot(mx,mz)||1;
  p.x=clamp(p.x+mx/L*4.6*dt,-HW-2.5,HW+2.5); p.z=clamp(p.z+mz/L*4.6*dt,-HL-3,-.3); p.moving=!!(mx||mz); }

/* ---------- contact: the AI meets the ball at its planned point; you hit it when you press a shot as it reaches you ---------- */
function contact(){ const b=M.b; if(M.lastHitter<0) return; const t=1-M.lastHitter;
  for(const p of M.teams[t]){ const dx=b.x-p.x, dz=b.z-p.z, reach=Math.hypot(dx,dz)<1.05&&b.y>.1&&b.y<2.5&&b.z*fOf(t)<0;
    if(p.me){ if(!reach||M.t-p.armT>.5) continue; if(!M.since){ const lv=legalVolley(p); if(lv) return fault(0,lv); } const q=clamp(1-Math.abs(M.t-p.armT-.15)/.45,.25,1)*clamp(1.25-Math.hypot(dx,dz)*.35,.5,1);
      let type=p.shot; if(type==='soft') type=Math.abs(p.z)<KZ+1.4?'dink':'drop'; if(type==='power') type=b.y>1.55?'smash':M.since?'drive':'volley'; if(!M.since&&type==='drive') type='volley';
      M.fb={t:q>.85?'Clean':q>.6?'Good':'Stretch',col:q>.85?'#22c55e':q>.6?'#a3e635':'#fbbf24'}; M.fbT=.9; strike(p,type,q,(held(['KeyQ'])?1:0)-(held(['KeyE'])?1:0)); return; }
    if(!M.plan||M.plan.p!==p||M.t<M.plan.t-.02) continue; if(Math.hypot(dx,dz)>1.25){ continue; }

  if(M.shotIdx===2) return r<.55+.3*p.k?'drop':'drive';   /* the third shot */
  if(!M.since) return b.y>1.1&&r<.5?'volley':'dink';
  if(me<KZ+1.4&&oppNet) return b.y>.95&&r<.35?'drive':r<.04?'lob':'dink';
  return oppNet?(r<.6?'drop':r<.9?'drive':'lob'):'drive'; }

/* ---------- loop ---------- */
function step(dt){
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('on'); }
  if(bannerT>0&&!paused){ bannerT-=dt; if(bannerT<=0) $('banner').classList.remove('on'); }
  if(!M||paused||phase!=='play') return; const sdt=dt*DIFF[diff].ts; M.stT+=sdt; if(M.msgT>0) M.msgT-=dt; if(M.fbT>0) M.fbT-=dt;
  if(M.state==='pre'){ M.t+=sdt; if(M.stT>2.2) setupServe(); return; }
  if(M.state==='dead'){ let n=Math.round(sdt/PDT); while(n-->0) ballStep(M.b,PDT); M.t+=sdt; movePlayers(sdt);
    if(M.stT>1.8){ if(M.matchEnd!==undefined) return endMatch(); if(M.gameEnd!==undefined){ M.score=[0,0]; M.gameEnd=undefined; M.servingTeam=1-M.servingTeam; M.serverNum=M.dbl?2:1; M.server=M.teams[M.servingTeam][0]; for(const tm of M.teams) tm.forEach((p,i)=>p.side=i?'L':'R'); banner(`Game ${M.games[0]+M.games[1]+1}`,`Games ${M.games[0]}–${M.games[1]}`,'#38bdf8',1.8); } setupServe(); } return; }
  if(M.state==='serve'){ M.t+=sdt; humanMove(sdt); movePlayers(sdt); if(M.stT>M.aiServeAt){ M.state='live'; strike(M.server,'serve',clamp(.6+.35*M.server.k,0,1),rnd(-.5,.5)); } return; }
  humanMove(sdt); let n=Math.max(1,Math.round(sdt/PDT));
  while(n-->0){ M.t+=PDT; const e=ballStep(M.b,PDT); if(e) onEvent(e); if(M.state!=='live') break; contact(); movePlayers(PDT); }
  if(M.state==='live'&&(Math.abs(M.b.z)>HL+9||Math.abs(M.b.x)>HW+9)) fault(M.since?1-M.lastHitter:M.lastHitter,'Out!');
  M.trail.push([M.b.x,M.b.y,M.b.z]); if(M.trail.length>8) M.trail.shift(); }
function endMatch(){ phase='over'; const won=M.matchEnd===0; SV.played++; if(won) SV.wins++; SV.games+=M.games[0]; saveSV(); sfx.crowd(won?.3:.15);
  const opp=M.teams[1].map(p=>p.name).join(' / ');
  $('resultIn').innerHTML=`<h2>${won?'You win!':'Defeat'}</h2><div class="rs">${M.gameLog.map(g=>g.join('–')).join(', ')}</div><p>${M.dbl?`You and ${esc(M.teams[0][1].name)}`:'You'} vs ${esc(opp)}</p><table class="ls"><tr><th>Rallies won</th><th>Rallies lost</th><th>Your winners</th><th>Your errors</th></tr><tr><td>${M.stats.won}</td><td>${M.stats.lost}</td><td>${M.stats.winners}</td><td>${M.stats.errors}</td></tr></table><p>Enter for the menu, R for a rematch.</p>`;
  setTimeout(()=>{ if(phase==='over') $('result').classList.remove('hidden'); },700); }

/* ---------- HUD ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'); cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
function hudText(t,x,y,size=18,col='#fff',align='left'){ ctx.font=`800 ${size}px 'Big Shoulders Display','Arial Narrow',sans-serif`; ctx.textAlign=align; ctx.lineWidth=Math.max(3,size/6); ctx.strokeStyle='rgba(0,0,0,.7)'; ctx.strokeText(t,x,y); ctx.fillStyle=col; ctx.fillText(t,x,y); }
function rr(x,y,w,h,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }
function draw2D(){ ctx.fillStyle='#14532d'; ctx.fillRect(0,0,W,H); const sc=38, X=x=>W/2-x*sc, Z=z=>H/2-z*sc;
  ctx.fillStyle='#1d4ed8'; ctx.fillRect(X(HW),Z(HL),CW*sc,CL*sc); ctx.fillStyle='#2563eb'; ctx.fillRect(X(HW),Z(KZ),CW*sc,KZ*2*sc); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(X(HW),Z(HL),CW*sc,CL*sc); ctx.beginPath(); ctx.moveTo(X(0),Z(HL)); ctx.lineTo(X(0),Z(KZ)); ctx.moveTo(X(0),Z(-KZ)); ctx.lineTo(X(0),Z(-HL)); ctx.moveTo(X(HW),Z(0)); ctx.lineTo(X(-HW),Z(0)); ctx.stroke();
  M.all.forEach((p,i)=>{ ctx.fillStyle=KITS[i][0]; ctx.beginPath(); ctx.arc(X(p.x),Z(p.z),10,0,Math.PI*2); ctx.fill(); });
  ctx.fillStyle='#fde047'; ctx.beginPath(); ctx.arc(X(M.b.x),Z(M.b.z)-M.b.y*8,5,0,Math.PI*2); ctx.fill(); }
function drawHUD(){ rr(16,14,300,70,12,'rgba(5,10,24,.8)');

addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName; if(tag==='INPUT'||tag==='SELECT') return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.repeat) return; keys.add(e.code); audio();
  if(e.code==='KeyZ'){ toggleFs(); return; }
  if(e.code==='KeyV'){ setView3(!view3); return; }
  if(phase==='menu'){ menuKey(e.code); return; }
  if(phase==='over'){ if(e.code==='KeyR') newMatch(); else if(['Enter','NumpadEnter','Escape','KeyM'].includes(e.code)) toMenu(); return; }
  if(!M) return;
  if(e.code==='Escape'||e.code==='KeyP'){ paused=!paused; if(paused) banner('Paused','Esc to resume · M for menu','#000',1e9); else { $('banner').classList.remove('on'); bannerT=0; } return; }

  if(e.code==='KeyC'){ M.cam=((M.cam||0)+1)%2; toast(M.cam?'Broadcast cam':'Player cam','#93c5fd'); return; }
  const shot={KeyJ:'power',KeyK:'soft',KeyL:'lob',Space:'power'}[e.code];
  if(shot){ if(M.state==='serve'&&M.server.me&&M.stT>.4){ M.state='live'; strike(M.server,'serve',.85,(held(['KeyQ'])?1:0)-(held(['KeyE'])?1:0)); return; } const p=M.all[0]; p.armT=M.t; p.shot=shot==='lob'?'lob':shot; }

function makeR3(glc,stage){

`precision mediump float;varying vec2 vUV;uniform sampler2D uTex;uniform vec4 uUVR;uniform vec3 uTint;uniform float uAlpha;

        this.p.push(v[0],v[1],v[2]); this.n.push(nn[0],nn[1],nn[2]); this.c.push(c[0],c[1],c[2]); this.ph.push(ph);

  { const c=ccv.getContext('2d'); c.textAlign='center'; c.textBaseline='middle'; c.font='900 104px "Arial Black",Impact,sans-serif'; c.lineJoin='round';

  function bindC(m){

    const b=M.b; E(R3.US,R3.mm(R3.T(b.x*K,b.y*K,b.z*K),R3.S(BR*1.2*K,BR*1.2*K,BR*1.2*K)),[1,.92,.15]);
    R3.part(R3.UC,R3.mm(R3.T(b.x*K,.008*K,b.z*K),R3.S(BR*1.1*K,.002*K,BR*1.1*K)),[.07,.2,.4]);
    M.trail.forEach((q,i)=>{ if(i<M.trail.length-1){ const r=BR*K*(.3+i*.08); E(R3.US,R3.mm(R3.T(q[0]*K,q[1]*K,q[2]*K),R3.S(r,r,r)),[.9,.85,.4]); } });
    /* where the ball will bounce, for the side about to receive */
    if(M.plan&&M.plan.bounce&&M.state==='live'&&M.lastHitter===1){ const pb=M.plan.bounce; for(let k=0;k<12;k++){ const a=k/12*Math.PI*2; E(R3.UB,R3.mm(R3.T((pb.x+Math.cos(a)*.18)*K,.012*K,(pb.z+Math.sin(a)*.18)*K),R3.S(.05*K,.004*K,.05*K)),[1,1,1]); } }
  },dt);
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; frameDtG=dt||1/60; step(dt); draw(); requestAnimationFrame(frame); }
function toggleFs(){ const st=$('stage'); try{ if(document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen&&st.requestFullscreen(); }catch(e){} }
$('btnFs').addEventListener('click',toggleFs);
$('btnView').addEventListener('click',()=>setView3(!view3));

$('result').addEventListener('click',()=>{ if(phase==='over') toMenu(); });
if(TEST) window.__pk={get M(){return M;},get phase(){return phase;},step,newMatch,keys,strike,set diff(v){diff=v;},set modeSel(v){modeSel=v;},set bestOf(v){bestOf=v;}};
setView3(view3);
renderMenu();
requestAnimationFrame(frame);
})();
