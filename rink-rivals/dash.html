<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Dash</title>
<style>
:root{--bg:#05030d;--p1:#110c22;--p2:#1c1536;--line:#2d2450;--tx:#f4f0ff;--mut:#a59cc9;--acc:linear-gradient(135deg,#22d3ee,#a855f7 55%,#f43f5e)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui}
#hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:1100px;margin:0 auto}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal}
main{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px;font:800 16px system-ui}
.btn{border:0;border-radius:11px;padding:10px 14px;font:900 14px system-ui;background:var(--acc);color:#fff}.btn.g{background:var(--p2);color:var(--tx)}
.note{color:var(--mut);font-size:13px}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lc{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}.lc b{font-size:18px}.lc .bar{height:8px;border-radius:4px;background:#0006;overflow:hidden}.lc .bar i{display:block;height:100%;background:var(--acc)}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:auto}
#hud{position:absolute;left:0;right:0;top:8px;text-align:center;font:900 18px system-ui;text-shadow:0 2px 6px #000;pointer-events:none}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(0,0,0,.55);font:900 28px system-ui}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{border:1px solid var(--line);background:#0a0716;color:var(--tx);border-radius:10px;padding:9px 11px;font-size:14px}
.pal button{border:2px solid var(--line);background:var(--p2);color:var(--tx);border-radius:10px;padding:6px 10px;font:800 13px system-ui}.pal button.on{border-color:#22d3ee}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a class="bk" href="./" title="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><a id="logo" href="dash"><i>⚡</i>Rival Dash</a></header>
<main id="main"></main>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const LS={get(k,d){ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
  /* a level is a list of columns; each column is a short string, bottom to top: '#' block, '^' spike, 'P' jump pad, 'O' jump ring, '.' air; '_' first = lava pit (no ground) */
  const PAT={ s:['^'], ss:['^','^'], b:['#'], bb:['#','#'], t2:['#','##'], t3:['#','##','###'], bs:['#','#^'], up:['.','#','.','.','##','.','.','###'], pit2:['_','_'], pit3:['_','_','_'], pad3:['P','.','^','^','^'], ring:['.','_','_..O','_','_'], gap:['.','.','.'], wall:['##','##'], sp:['.','^','.','.','^'], tun:['#..#','#..#','#..#'], pl:['#','#','#^','#','#'] };
  const build=seq=>{ const out=[]; for(const tok of seq.split(' ')){ const [n,r]=tok.split('x'); for(let i=0;i<(+r||1);i++){ if(n==='-') out.push('.'); else out.push(...(PAT[n]||['.'])); } } return out; };
  const LEVELS=[
    {name:'Neon Start',bpm:120,col:['#0e7490','#312e81'],seq:'-x10 s -x6 s -x6 ss -x6 b -x5 bb -x6 s -x4 b -x4 s -x6 t2 -x6 ss -x5 pit2 -x6 s -x3 s -x6 b -x2 s -x6 bb -x5 pit3 -x6 ss -x6 t3 -x8 s -x4 ss -x6 bs -x8 -x10'},
    {name:'Jump City',bpm:132,col:['#7c2d12','#4c1d95'],seq:'-x10 ss -x5 pad3 -x6 t2 -x4 ss -x5 up -x6 pit3 -x5 sp -x5 pad3 -x4 bs -x6 ring -x6 wall -x5 ss -x4 pit2 -x3 s -x5 t3 -x6 pad3 -x5 ring -x6 pl -x6 ss -x4 ss -x10'},
    {name:'Lava Rush',bpm:145,col:['#7f1d1d','#18181b'],seq:'-x10 pit2 -x4 ss -x4 pit3 -x4 pad3 -x4 ring -x4 ss -x3 pit3 -x4 t3 -x4 sp -x3 pad3 -x3 ring -x4 bs -x4 pit3 -x3 ss -x3 pad3 -x4 up -x4 pit3 -x3 ring -x3 ss -x3 pit3 -x10'}];
  for(const L of LEVELS) L.cols=build(L.seq);
  const U=40, GROUND=440, SPEED=8*U, G=3500, JUMP=780, PADJ=1080;
  let raf=0, stopFn=null, best=LS.get('rrDashBest',{}), done=LS.get('rrDashDone',{});
  function menu(){ if(stopFn) stopFn();
    $('main').innerHTML=`<div class="card"><h3>⚡ Levels</h3><div class="lv">${LEVELS.map((L,i)=>`<div class="lc"><b>${['🟦','🟧','🟥'][i]} ${esc(L.name)}</b><span class="note">${['Easy','Medium','Hard'][i]} · best ${best[L.name]||0}%${done[L.name]?' · ✅ beaten':''}</span><div class="bar"><i style="width:${best[L.name]||0}%"></i></div><div class="row"><button class="btn" data-play="${i}">▶ Play</button><button class="btn g" data-prac="${i}">Practice</button></div></div>`).join('')}</div>
      <p class="note">Space, ↑, click or tap to jump. Hold to keep jumping. Yellow pads launch you high; tap while touching a ring to jump in mid-air. Practice mode drops checkpoints. Beat a level for coins!</p></div>
      <div class="card"><h3>🛠️ Level maker</h3><div class="row"><button class="btn" id="mk">Make a level</button><input id="code" placeholder="Paste a friend's level code" style="flex:1;min-width:200px"><button class="btn g" id="pc">▶ Play code</button></div></div>`;
    $('mk').onclick=maker; $('pc').onclick=()=>{ const L=decode($('code').value.trim()); if(!L) return alert('That code does not work.'); play(L,false); }; }
  /* ---------- the run ---------- */
  function play(L,practice,onBack){ if(stopFn) stopFn(); const lvl=L.cols?L:{...L,cols:L.cols};
    $('main').innerHTML=`<div class="stage" id="st"><canvas id="cv" width="960" height="540"></canvas><div id="hud"></div><div id="over"></div></div><div class="row" style="margin-top:10px"><button class="btn g" id="back">← Levels</button><span class="note">${esc(L.name)}${practice?' · practice':''}</span></div>`;
    $('back').onclick=()=>{ (onBack||menu)(); };
    const cv=$('cv'), x=cv.getContext('2d'), cols=lvl.cols, LEN=cols.length*U;
    const solidAt=(cx,lvlY)=>{ const c=cols[cx]; if(!c) return '.'; return c[lvlY]||'.'; };
    let P, attempts=LS.get('rrDashAtt',{})[L.name]||0, held=false, dead=false, won=false, deathT=0, ckpt=null, ac=null, beatT=0, partic=[];
    const reset=()=>{ P={x:ckpt?ckpt.x:2*U,y:ckpt?ckpt.y:GROUND-36,vy:0,rot:0,ground:true,ringUsed:-1}; dead=false; deathT=0; attempts++; const A=LS.get('rrDashAtt',{}); A[L.name]=attempts; LS.set('rrDashAtt',A); };
    reset();
    const press=v=>{ held=v; if(v&&!ac) startAudio(); if(v&&(dead||won)&&$('over').style.display==='flex'&&won) return; };
    const kd=e=>{ if(['Space','ArrowUp','KeyW'].includes(e.code)){ e.preventDefault(); press(e.type==='keydown'); } }; addEventListener('keydown',kd); addEventListener('keyup',kd);
    const st=$('st'); st.onpointerdown=e=>{ if(e.target.closest('button')) return; press(true); }; st.onpointerup=st.onpointerleave=()=>press(false);
    function startAudio(){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); beatT=ac.currentTime; }catch(e){} }
    function tickAudio(){ if(!ac||dead||won) return; const spb=60/(L.bpm||128); while(beatT<ac.currentTime+.2){ const t=beatT, i=Math.round((t)/spb); const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(40,t+.12); g.gain.setValueAtTime(.4,t); g.gain.exponentialRampToValueAtTime(.001,t+.15); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.16);
        if(i%2){ const h=ac.createOscillator(), hg=ac.createGain(); h.type='square'; h.frequency.value=[523,659,784,659][i%4]*.5; hg.gain.setValueAtTime(.05,t); hg.gain.exponentialRampToValueAtTime(.001,t+spb*.9); h.connect(hg).connect(ac.destination); h.start(t); h.stop(t+spb); } beatT+=spb/2; } }
    const die=()=>{ if(dead) return; dead=true; deathT=0; for(let i=0;i<18;i++) partic.push({x:P.x+18,y:P.y+18,vx:(Math.random()-.5)*500,vy:(Math.random()-.8)*500,t:.7}); try{ if(ac){ const o=ac.createOscillator(),g=ac.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(300,ac.currentTime); o.frequency.exponentialRampToValueAtTime(60,ac.currentTime+.3); g.gain.setValueAtTime(.2,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.32); } }catch(e){} };
    function win(){ won=true; const pct=100; best[L.name]=100; LS.set('rrDashBest',best); let msg=''; if(LEVELS.includes(L)&&!practice&&!done[L.name]){ done[L.name]=1; LS.set('rrDashDone',done); const c=[100,200,350][LEVELS.indexOf(L)]; try{ window.RRCOIN&&RRCOIN.add(c,'Rival Dash · '+L.name); }catch(e){} msg=`+${c} 🪙`; }
      $('over').style.display='flex'; $('over').innerHTML=`<div>🏆 Level complete!</div><div style="font-size:16px">${attempts} attempt${attempts>1?'s':''} ${msg}</div><div class="row"><button class="btn" id="ag">Play again</button><button class="btn g" id="lv">Levels</button></div>`; $('ag').onclick=()=>{ attempts=0; ckpt=null; won=false; $('over').style.display='none'; reset(); }; $('lv').onclick=()=>(onBack||menu)(); }
    let last=performance.now();
    function step(dt){ if(won) return; if(dead){ deathT+=dt; if(deathT>.8) reset(); return; }
      P.x+=SPEED*dt; const prevBottom=P.y+36; P.vy+=G*dt; P.y+=P.vy*dt; P.rot+=dt*7*(P.ground?0:1); P.ground=false;
      const c0=Math.floor((P.x+4)/U), c1=Math.floor((P.x+32)/U);
      for(let cx=c0;cx<=c1;cx++){ const col=cols[cx]||'.'; const pit=col[0]==='_';
        if(!pit&&P.y+36>=GROUND&&prevBottom<=GROUND+8){ P.y=GROUND-36; P.vy=0; P.ground=true; }
        for(let ly=0;ly<col.length;ly++){ const ch=col[ly]; if(ch==='.'||ch==='_') continue; const top=GROUND-(ly+1)*U, left=cx*U;
          if(ch==='#'){ if(P.x+34>left&&P.x+2<left+U&&P.y+36>top&&P.y<top+U){ if(prevBottom<=top+10&&P.vy>=0){ P.y=top-36; P.vy=0; P.ground=true; } else return die(); } }
          if(ch==='^'){ if(P.x+30>left+12&&P.x+6<left+U-12&&P.y+36>top+16&&P.y<top+U) return die(); }
          if(ch==='P'){ if(P.x+34>left&&P.x<left+U&&P.y+36>=top+U-12){ P.vy=-PADJ; P.ground=false; } }
          if(ch==='O'){ const ox=left+U/2, oy=top+U/2; if(Math.abs(P.x+18-ox)<34&&Math.abs(P.y+18-oy)<34&&held&&P.ringUsed!==cx*100+ly){ P.vy=-JUMP*1.05; P.ringUsed=cx*100+ly; } } } }
      if(P.ground) P.rot=Math.round(P.rot/(Math.PI/2))*(Math.PI/2);
      if(held&&P.ground){ P.vy=-JUMP; P.ground=false; }
      if(P.y>560) return die();
      if(practice&&P.ground&&(!ckpt||P.x-ckpt.x>12*U)) ckpt={x:P.x,y:P.y};
      const pct=Math.min(100,Math.floor(P.x/LEN*100)); if(!practice&&pct>(best[L.name]||0)&&LEVELS.includes(L)){ best[L.name]=pct; LS.set('rrDashBest',best); }
      if(P.x>=LEN-4*U) win(); }
    function render(){ const cam=Math.max(0,P.x-260), [c1,c2]=L.col||['#0e7490','#312e81'];
      const g=x.createLinearGradient(0,0,0,540); g.addColorStop(0,c1); g.addColorStop(1,c2); x.fillStyle=g; x.fillRect(0,0,960,540);
      x.globalAlpha=.15; x.fillStyle='#fff'; for(let i=0;i<14;i++){ const bx=((i*170-cam*.3)%1100+1100)%1100-70; x.fillRect(bx,120+(i*53)%200,60,60); } x.globalAlpha=1;
      const first=Math.floor(cam/U)-1, lastC=first+26;
      for(let cx=first;cx<=lastC;cx++){ const col=cols[cx]; const sx=cx*U-cam; if(!col||col[0]!=='_'){ x.fillStyle='#0b0b18'; x.fillRect(sx,GROUND,U+1,100); x.fillStyle='#22d3ee'; x.fillRect(sx,GROUND,U+1,3); } else { x.fillStyle='#ea580c'; x.fillRect(sx,GROUND+10,U+1,90); x.fillStyle='#facc15'; x.fillRect(sx,GROUND+10+Math.sin(performance.now()/200+cx)*3,U+1,4); }
        if(!col) continue; for(let ly=0;ly<col.length;ly++){ const ch=col[ly], top=GROUND-(ly+1)*U;
          if(ch==='#'){ x.fillStyle='#111827'; x.fillRect(sx,top,U,U); x.strokeStyle='#22d3ee'; x.lineWidth=2; x.strokeRect(sx+1,top+1,U-2,U-2); }
          if(ch==='^'){ x.fillStyle='#f8fafc'; x.beginPath(); x.moveTo(sx+4,top+U); x.lineTo(sx+U/2,top+6); x.lineTo(sx+U-4,top+U); x.fill(); x.strokeStyle='#f43f5e'; x.lineWidth=2; x.stroke(); }
          if(ch==='P'){ x.fillStyle='#facc15'; x.fillRect(sx+4,top+U-8,U-8,8); }
          if(ch==='O'){ x.strokeStyle='#facc15'; x.lineWidth=4; x.beginPath(); x.arc(sx+U/2,top+U/2,13+Math.sin(performance.now()/150)*2,0,7); x.stroke(); } } }
      if(!dead){ x.save(); x.translate(P.x-cam+18,P.y+18); x.rotate(P.rot); x.fillStyle='#22d3ee'; x.fillRect(-18,-18,36,36); x.fillStyle='#0e7490'; x.fillRect(-10,-10,20,20); x.fillStyle='#fff'; x.fillRect(2,-8,6,6); x.restore(); }
      for(const p of partic){ x.fillStyle='#22d3ee'; x.fillRect(p.x-cam,p.y,6,6); }
      if(practice&&ckpt){ x.fillStyle='#4ade80'; x.beginPath(); x.moveTo(ckpt.x-cam+18,ckpt.y-6); x.lineTo(ckpt.x-cam+10,ckpt.y-18); x.lineTo(ckpt.x-cam+26,ckpt.y-18); x.fill(); }
      $('hud').textContent=`${Math.min(100,Math.floor(P.x/LEN*100))}%   ·   Attempt ${attempts}${!ac?'   ·   tap to start the beat':''}`; }
    function frame(now){ const dt=Math.min(.025,(now-last)/1000); last=now; tickAudio(); for(const p of partic){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=900*dt; p.t-=dt; } partic=partic.filter(p=>p.t>0); step(dt); render(); raf=requestAnimationFrame(frame); }
    raf=requestAnimationFrame(frame);
    stopFn=()=>{ cancelAnimationFrame(raf); removeEventListener('keydown',kd); removeEventListener('keyup',kd); if(ac) ac.close(); stopFn=null; }; }
  /* ---------- level maker ---------- */
  const encode=L=>btoa(unescape(encodeURIComponent(JSON.stringify({n:L.name,c:L.cols.join(','),b:L.bpm})))).replace(/=+$/,'');
  const decode=s=>{ try{ const o=JSON.parse(decodeURIComponent(escape(atob(s)))); const cols=String(o.c).split(',').map(c=>c.replace(/[^#^PO._]/g,'').slice(0,6)); if(cols.length<20||cols.length>2000) return null; return {name:String(o.n||'Custom level').slice(0,30),cols,bpm:+o.b||128,col:['#155e75','#3b0764']}; }catch(e){ return null; } };
  function maker(){ if(stopFn) stopFn(); let M=LS.get('rrDashDraft',null)||{name:'My level',cols:Array(120).fill('.'),bpm:128}, tool='^', scroll=0;
    $('main').innerHTML=`<div class="card"><div class="row"><input id="nm" maxlength="30" value="${esc(M.name)}"><span class="pal row">${[['^','🔺 Spike'],['#','⬛ Block'],['P','🟨 Pad'],['O','⭕ Ring'],['_','🔥 Lava pit'],['.','🧽 Erase']].map(([k,t])=>`<button data-tl="${k}" class="${k===tool?'on':''}">${t}</button>`).join('')}</span></div>
      <p class="note">Click a cell to place (stack blocks up to 6 high). Drag the bar to scroll. The level is ${M.cols.length} blocks long.</p><canvas id="ed" width="960" height="300" style="border-radius:12px;background:#0b0b18;touch-action:none"></canvas><input id="scr" type="range" min="0" max="${M.cols.length-24}" value="0" style="width:100%">
      <div class="row"><button class="btn" id="tp">▶ Test</button><button class="btn g" id="lng">+ Longer</button><button class="btn g" id="sh">🔗 Get share code</button><button class="btn g" id="bk2">← Levels</button></div><textarea id="out" rows="2" style="width:100%;margin-top:8px;display:none" readonly></textarea></div>`;
    const ed=$('ed'), x=ed.getContext('2d'); const SAVE=()=>LS.set('rrDashDraft',M);
    const draw=()=>{ x.fillStyle='#0b0b18'; x.fillRect(0,0,960,300); for(let i=0;i<24;i++){ const c=M.cols[scroll+i]||'.'; const sx=i*40; x.fillStyle=c[0]==='_'?'#ea580c':'#1f2937'; x.fillRect(sx,260,40,40); for(let ly=0;ly<6;ly++){ const ch=c[ly]||'.', top=220-ly*40; x.strokeStyle='#ffffff14'; x.strokeRect(sx,top,40,40);
      if(ch==='#'){ x.fillStyle='#22d3ee'; x.fillRect(sx+2,top+2,36,36); } if(ch==='^'){ x.fillStyle='#f8fafc'; x.beginPath(); x.moveTo(sx+4,top+40); x.lineTo(sx+20,top+6); x.lineTo(sx+36,top+40); x.fill(); } if(ch==='P'){ x.fillStyle='#facc15'; x.fillRect(sx+4,top+32,32,8); } if(ch==='O'){ x.strokeStyle='#facc15'; x.lineWidth=3; x.beginPath(); x.arc(sx+20,top+20,12,0,7); x.stroke(); x.lineWidth=1; } } x.fillStyle='#64748b'; x.font='10px system-ui'; x.fillText(String(scroll+i),sx+3,296); } };
    draw();
    ed.onpointerdown=e=>{ const r=ed.getBoundingClientRect(), i=Math.floor((e.clientX-r.left)/r.width*24), py=(e.clientY-r.top)/r.height*300; const ci=scroll+i; let c=(M.cols[ci]||'.').split('');
      if(tool==='_'){ c[0]=c[0]==='_'?'.':'_'; } else { const ly=Math.max(0,Math.min(5,Math.floor((260-py)/40))); while(c.length<=ly) c.push('.'); c[ly]=tool; if(ly===0&&c[0]==='_'&&tool!=='.') c[0]=tool; }
      M.cols[ci]=c.join('').replace(/\.+$/,'')||'.'; SAVE(); draw(); };
    $('scr').oninput=e=>{ scroll=+e.target.value; draw(); }; $('nm').oninput=e=>{ M.name=e.target.value; SAVE(); };
    document.querySelectorAll('[data-tl]').forEach(b=>b.onclick=()=>{ tool=b.dataset.tl; document.querySelectorAll('[data-tl]').forEach(z=>z.classList.toggle('on',z===b)); });
    $('lng').onclick=()=>{ M.cols.push(...Array(40).fill('.')); SAVE(); $('scr').max=M.cols.length-24; };
    $('tp').onclick=()=>play({name:M.name,cols:M.cols.concat(Array(12).fill('.')),bpm:M.bpm,col:['#155e75','#3b0764']},false,maker);
    $('sh').onclick=()=>{ const o=$('out'); o.style.display='block'; o.value=encode(M); o.select(); try{ navigator.clipboard.writeText(o.value); }catch(e){} };
    $('bk2').onclick=menu; }
  document.addEventListener('click',e=>{ const p=e.target.closest('[data-play]'); if(p) play(LEVELS[+p.dataset.play],false); const q=e.target.closest('[data-prac]'); if(q) play(LEVELS[+q.dataset.prac],true); });
  const code=new URLSearchParams(location.search).get('level'); if(code){ const L=decode(code); if(L) play(L,false); else menu(); } else menu();
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
