<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rink Rivals - Hockey</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; }
.tools button:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }
.clock{ background:var(--ledbg); color:var(--led); padding:6px 22px; text-align:center; min-width:150px; display:flex; flex-direction:column; justify-content:center; }
.clock .t{ font-size:44px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:linear-gradient(#070b16, #101a34 55%, #0b1224); }
.rink{ perspective:1500px; perspective-origin:50% 0%; }
#cv{ display:block; width:100%; height:auto; transform-origin:50% 100%; transition:transform .7s cubic-bezier(.2,.7,.2,1); }
.tilt #cv{ transform:rotateX(30deg) scale(.98); }
.cam #cv{ transition:none; }
.cam .rink{ perspective:none; }
#gl,#glhud{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl,.r3 #glhud{ display:block; }
.r3 #cv{ visibility:hidden; }
@media (prefers-reduced-motion: reduce){ #cv{ transition:none; } }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills button:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.pk .jer{ display:flex; gap:4px; justify-content:center; margin-top:4px; }
.pk .jr{ width:40px; padding:2px; border-radius:8px; border:2px solid transparent; cursor:pointer; }
.pk .jr svg{ display:block; width:100%; height:auto; }
.pk .jr.on{ border-color:#fff; }
.form{ display:grid; grid-template-columns:auto auto; gap:6px 10px; align-items:center; background:#141c33; border:2px solid #27345a; border-radius:14px; padding:12px 16px; text-align:left; }
.form input,.form select{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid #27345a; background:#0b1120; color:#fff; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }

.onice{ display:flex; justify-content:space-between; gap:10px; margin-top:8px; font-size:16px; color:var(--muted); flex-wrap:wrap; min-height:26px; }
.onice .who{ display:flex; align-items:center; gap:8px; }
.onice b{ color:var(--ink); }
.en{ width:70px; height:8px; border-radius:4px; background:var(--line); overflow:hidden; display:inline-block; }
.en i{ display:block; height:100%; background:#34d399; }
.pp{ color:#f59e0b; font-weight:800; }

.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }

.banner{ position:absolute; left:0; right:0; top:28%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
.stars{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
.stars div{ background:#141c33; border:2px solid #27345a; border-radius:12px; padding:4px 12px; font-size:17px; }

.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }

.modal{ position:fixed; inset:0; background:rgba(5,8,18,.82); z-index:20; display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:20px 12px; }
.mpanel{ background:var(--panel); color:var(--ink); border:2px solid var(--line); border-radius:16px; padding:16px 18px; width:min(860px,100%); }
.mpanel h2{ margin:0 0 6px; font-size:30px; }
.kt{ width:100%; border-collapse:collapse; font-size:17px; }
.kt th{ text-align:left; color:var(--muted); font-weight:600; padding:4px 6px; }
.kt td{ padding:4px 6px; border-top:1px solid var(--line); }
.kb{ font:inherit; font-size:16px; min-width:112px; padding:3px 10px; border-radius:8px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
.kb.wait{ border-color:#f59e0b; background:#f59e0b; color:#08101f; }
.fhud{ position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:4; display:flex; gap:12px; align-items:center; background:rgba(8,12,24,.88); color:#fff; padding:6px 14px; border-radius:12px; font-size:17px; white-space:nowrap; }
.fhud .hp{ width:130px; height:12px; background:#334155; border-radius:6px; overflow:hidden; }
.fhud .hp i{ display:block; height:100%; background:#ef4444; }
.fhud .k{ color:#ffd166; font-size:15px; }
.rptag{ position:absolute; top:12px; left:14px; z-index:4; background:#dc2626; color:#fff; font-weight:800; padding:2px 12px; border-radius:6px; font-size:18px; letter-spacing:.08em; text-transform:uppercase; }
.fsbar{ display:none; position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:4; background:rgba(8,12,24,.86); color:#fff; padding:4px 16px; border-radius:10px; font-size:22px; font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums; }
.fsbar .c{ color:var(--led); margin:0 10px; }
body.fs.playing{ background:#05080f; }
body.fs.playing main{ max-width:none; padding:0; min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
body.fs.playing .top, body.fs.playing .board, body.fs.playing .keys, body.fs.playing .onice{ display:none; }
body.fs.playing .stage{ width:min(100vw, calc(100vh * 1.806)); margin:0 auto; border-radius:0; }
body.fs.playing .fsbar{ display:block; }
body.fs.playing .fhud{ top:52px; }
.ktabs{ display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Rink Rivals</div>
    <div class="tools">
      <button id="btnFs" tabindex="-1">Full screen (Z)</button>
      <button id="btnKeys" tabindex="-1">Controls (K)</button>
      <button id="btnSet" tabindex="-1">Settings (O)</button>
      <button id="btnView" tabindex="-1">Broadcast 3D</button>
      <button id="btnSnd" tabindex="-1">Sound on</button>
    </div>
  </div>

  <section class="board" aria-label="Scoreboard">
    <div class="side" id="sideL"><img id="logoL" alt=""><div style="min-width:0"><div class="tn" id="nameL">-</div><div class="tp" id="tpL">Player 1</div></div><div class="sc" id="scoreL">0</div></div>
    <div class="clock"><div class="t" id="clockT">1:00</div><div class="pd" id="clockP">1st</div></div>
    <div class="side r" id="sideR"><img id="logoR" alt=""><div style="min-width:0"><div class="tn" id="nameR">-</div><div class="tp" id="tpR">Player 2</div></div><div class="sc" id="scoreR">0</div></div>
  </section>

  <div class="stage tilt" id="stage">
    <div class="rink"><canvas id="cv" role="img" aria-label="Hockey rink"></canvas></div>
    <canvas id="gl"></canvas>
    <canvas id="glhud"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="fhud hidden" id="fightHud"></div>
    <div class="fsbar" id="fsBar"></div>
    <div class="rptag hidden" id="rpTag">Replay</div>
    <div class="overlay" id="menu"><div class="menu-in" id="menuIn"></div></div>
    <div class="overlay result hidden" id="result">
      <div>
        <h2 id="rTitle"></h2>
        <div class="rs" id="rScore"></div>
        <div class="stars" id="rStars"></div>
        <p id="rExtra"></p>
        <p id="rHint"></p>
      </div>
    </div>
  </div>
  <div class="onice" id="onice"></div>

  <section class="hub" id="hub" aria-label="Hub"></section>

  <footer class="keys" id="keysHelp"></footer>
</main>
<div class="modal hidden" id="ctrlModal"><div class="mpanel" id="ctrlPanel"></div></div>
<div class="modal hidden" id="setModal"><div class="mpanel" id="setPanel"></div></div>
<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const W=1000, H=500, M=60, CW=W+2*M, CH=H+2*M, RC=100;
const GX=80, ND=34, NHW=54, CY=H/2;
const PR=16, KR=8, GR=18, CARRY=30;
const PERIOD_LEN=60, OT_LEN=60, PEN_LEN=20;
const DPR=Math.min(2, window.devicePixelRatio||1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- random ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let RNG=Math.random;
const rnd=(a,b)=>a+(b-a)*RNG();
const rint=(a,b)=>Math.floor(a+(b-a+1)*RNG());
const pick=a=>a[Math.floor(RNG()*a.length)];
const uid=()=>Math.random().toString(36).slice(2,10);
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function wpick(items,wf){ let s=0; const w=items.map(x=>{ const v=Math.max(0,wf(x)); s+=v; return v; }); if(s<=0) return items[0]; let r=Math.random()*s; for(let i=0;i<items.length;i++){ r-=w[i]; if(r<=0) return items[i]; } return items[items.length-1]; }

/* ---------- logos ---------- */
const svg=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const LOGO={
  habs: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#192168"/><circle cx="50" cy="50" r="41" fill="#c8102e"/><path d="M72 30A28 28 0 1 0 72 70" fill="none" stroke="#fff" stroke-width="11"/><text x="50" y="62" font-family="Georgia,serif" font-weight="700" font-size="34" text-anchor="middle" fill="#192168" stroke="#fff" stroke-width="2" paint-order="stroke">H</text></svg>`),
  leafs: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#00205b"/><circle cx="50" cy="50" r="43" fill="none" stroke="#fff" stroke-width="2.5"/><polygon fill="#fff" points="50,14 57,26 65,22 63,41 76,36 72,47 86,51 71,62 74,71 55,67 54,86 46,86 45,67 26,71 29,62 14,51 28,47 24,36 37,41 35,22 43,26"/></svg>`),
  warriors: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 4L92 17V50C92 75 73 91 50 97C27 91 8 75 8 50V17Z" fill="#ffc72c"/><path d="M50 12L84 22V50C84 70 68 83 50 89C32 83 16 70 16 50V22Z" fill="#4b2a86"/><path d="M28 30L72 74M72 30L28 74" stroke="#ffc72c" stroke-width="5" stroke-linecap="round" opacity=".35"/><text x="50" y="56" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="24" text-anchor="middle" fill="#ffc72c">JCC</text><text x="50" y="72" font-family="Arial,sans-serif" font-weight="700" font-size="9" text-anchor="middle" fill="#fff">WARRIORS</text></svg>`)
};
function makeLogo(txt,c1,c2,c3,shape){
  const fs=txt.length>2?27:36;
  const body=shape===1

  p.spd=spdOf(p);
  p.push=0;
  if(len){
    ix/=len; iy/=len;
    const maxV=(puck.owner===p?255:275)*p.spd*(padm>0?Math.max(.4,padm):1)*(p.stun>0?.35:1)*(1-.3*Math.min(1,p.charge/.8));
    const acc=4.6+1.8*N(p,'spd'), sp=Math.hypot(p.vx,p.vy), ta=Math.atan2(iy,ix);
    if(sp>70){
      const va=Math.atan2(p.vy,p.vx), df=wrap(ta-va);
      if(Math.abs(df)<2.1){
        /* carve: rotate the velocity toward the stick input, tighter when slower */
        const tr=(4.2+2.4*N(p,'hnd'))*(1.45-.7*Math.min(1,sp/300));
        const na=va+clamp(df,-tr*dt,tr*dt);
        let ns=sp+(maxV-sp)*(1-Math.exp(-acc*dt));
        ns*=1-Math.min(1,Math.abs(df))*.5*dt;
        p.vx=Math.cos(na)*ns; p.vy=Math.sin(na)*ns;
      } else {
        /* hockey stop / reverse */
        const k=1-Math.exp(-acc*1.25*dt); p.vx+=(ix*maxV-p.vx)*k; p.vy+=(iy*maxV-p.vy)*k;
        if(sp>160&&!p.stopT){ p.stopT=.35; if(p.human) noise(.18,.12,3200); }
      }
    } else { const k=1-Math.exp(-acc*dt); p.vx+=(ix*maxV-p.vx)*k; p.vy+=(iy*maxV-p.vy)*k; }
    p.push=clamp(1-Math.hypot(p.vx,p.vy)/(maxV||1),0,1)*.7+.3;
    if(aim===null) p.ang=turn(p.ang,ta,(6.5+2.5*N(p,'hnd'))*dt);
  } else { const f=Math.exp(-1.1*dt); p.vx*=f; p.vy*=f; }
  if(p.stopT>0) p.stopT=Math.max(0,p.stopT-dt);
  if(aim!==null) p.ang=turn(p.ang,aim,14*dt);
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  const w=wall(p,p.r);
  if(w){ const vn=p.vx*w.nx+p.vy*w.ny; if(vn<0){ p.vx-=1.12*vn*w.nx; p.vy-=1.12*vn*w.ny; } }
}

/* ---------- goalies ---------- */
const goalLineX=g=>g.side===0?GX:W-GX;
const gBaseX=g=>g.side===0?GX+26:W-GX-26;
function gSpeed(g){
  let s=(160+110*N(g,'gpo'))*(1+(SET.goalie-1)*.25);
  const u=G.sides[g.side].ups; if(u) s+=14*u.goalie;
  return s;
}
function saveR(g){
  let r=GR*(.96+.17*N(g,'rfx'));
  if(g.human) r*=1.2;
  r*=1+(SET.goalie-1)*.3;
  if(G&&G.so&&!g.human) r*=.93;
  const u=G.sides[g.side].ups; if(u) r+=.4*u.goalie;
  return r*(g.dive>0?1.45:1);
}
function oppNear(x,y,side,r){ for(const f of live) if(f.side!==side&&Math.hypot(f.x-x,f.y-y)<r) return true; return false; }
function canGoOut(g){
  if(puck.owner||puck.frozen||g.pickCool>0) return false;
  const gl=goalLineX(g), dir=g.side===0?1:-1;
  if(Math.hypot(puck.vx,puck.vy)>300) return false;
  if(Math.abs(puck.x-gl)>230||Math.abs(puck.y-CY)>210) return false;
  if(dir*(puck.x-gl)<-30) return false;
  if(oppNear(puck.x,puck.y,g.side,125)) return false;
  const gd=Math.hypot(g.x-puck.x,g.y-puck.y);
  for(const m of live) if(m.side===g.side&&Math.hypot(m.x-puck.x,m.y-puck.y)<Math.min(55,gd*.6)) return false;
  return true;
}
function moveTo(g,tx,ty,sp,dt){
  const dx=tx-g.x, dy=ty-g.y, d=Math.hypot(dx,dy);
  const v=Math.min(sp,d*6); const k=1-Math.exp(-8*dt);
  g.vx+=((d?dx/d:0)*v-g.vx)*k; g.vy+=((d?dy/d:0)*v-g.vy)*k;
  g.x+=g.vx*dt; g.y+=g.vy*dt; return d;
}
/* 0..1: how much the goalie should seal the post (puck carrier at a sharp angle near the goal line) */
function postHug(g){
  const o=puck.owner&&!puck.owner.isG?puck.owner:puck, dir=g.side===0?1:-1, line=goalLineX(g);
  const front=dir*(o.x-line), off=Math.abs(o.y-CY);
  if(front>150||front<-60) return 0;
  return clamp((off-(NHW-14))/40,0,1)*clamp((150-front)/60,0,1);
}
function gFace(g){ const out=g.side===0?0:Math.PI; return out+clamp(wrap(Math.atan2(puck.y-g.y,puck.x-g.x)-out),-1.2,1.2); }
function updateGoalie(g,dt,enabled){
  if(g.pulled){ g.x=W/2+(g.side?1:-1)*215; g.y=-30; g.vx=g.vy=0; g.ang=Math.PI/2; return; }
  g.pickCool-=dt; g.shotCool-=dt; g.swing=Math.max(0,g.swing-dt); g.dive=Math.max(0,g.dive-dt); g.diveCool-=dt;
  const gs=gSpeed(g), bx=gBaseX(g), dir=g.side===0?1:-1;
  if(puck.owner!==g&&g.mode==='hold') g.mode='ret';
  if(g.human){
    const h=g.human, r=enabled?humanMove(h):{ix:0,iy:0,m:0};
    if(g.down) g.charge=Math.min(1,g.charge+dt);
    let ix=r.ix, iy=r.iy; const len=Math.hypot(ix,iy);
    const mv=gs*1.25*(g.dive>0?.45:1)*(r.m>0?Math.max(.4,r.m):1);
    const k=1-Math.exp(-9*dt);
    if(len){ ix/=len; iy/=len; g.vx+=(ix*mv-g.vx)*k; g.vy+=(iy*mv-g.vy)*k; }
    else if(puck.owner!==g){
      /* positioning assist: with no input the goalie slides to the right spot in the crease */
      let aimY=puck.y;
      if(!puck.owner&&puck.vx*dir<-150){ const tt=(puck.x-goalLineX(g))/(-puck.vx); if(tt>0&&tt<.9) aimY=puck.y+puck.vy*tt; }
      const hug=postHug(g), lim=NHW-GR*lerp(.55,.35,hug);
      const ty=clamp(aimY,CY-lim,CY+lim), adv=clamp((260-Math.abs(puck.x-bx))/260,0,1)*18;
      g.vx+=((lerp(bx+dir*adv,goalLineX(g)+dir*(GR+1),hug)-g.x)*7-g.vx)*k; g.vy+=(clamp((ty-g.y)*10,-mv,mv)-g.vy)*k;
    } else { g.vx*=Math.exp(-8*dt); g.vy*=Math.exp(-8*dt); }
    if(!enabled){ g.vx=(bx-g.x)*3; g.vy=(CY-g.y)*3; }
    g.x+=g.vx*dt; g.y+=g.vy*dt;
    const gl=goalLineX(g); g.x=g.side===0?clamp(g.x,gl-ND-24,gl+250):clamp(g.x,gl-250,gl+ND+24);
    if(puck.owner===g&&len) g.ang=turn(g.ang,Math.atan2(iy,ix),10*dt);
    else if(puck.owner!==g) g.ang=turn(g.ang,gFace(g),12*dt);
  } else {
    if(!enabled&&g.mode!=='net'){ g.mode='ret'; }
    if(g.mode==='net'){
      const rf=N(g,'rfx'), gl=goalLineX(g);
      let aimY=puck.y, kk=5+4.5*rf;
      if(!puck.owner&&puck.vx*dir<-150){
        const tt=(puck.x-gl)/(-puck.vx);
        if(tt>0&&tt<.9){ aimY=puck.y+puck.vy*tt; kk=7+8*rf; }
      } else if(puck.owner&&!puck.owner.isG&&puck.owner.side!==g.side){
        const o=puck.owner; aimY=o.y+Math.sin(o.ang)*CARRY*.6;
      }
      if(G.so) kk*=.78;
      g.ty+=(clamp(aimY,CY-NHW-30,CY+NHW+30)-g.ty)*Math.min(1,dt*kk);
      const hug=postHug(g);
      const lim=NHW-GR*lerp(.55,.35,hug);
      const ty=clamp(g.ty,CY-lim,CY+lim);
      g.vy=clamp((ty-g.y)*9,-gs*1.3,gs*1.3); g.y+=g.vy*dt; g.vx=0;
      const dist=Math.abs(puck.x-bx);
      const adv=clamp((260-dist)/260,0,1)*(12+10*N(g,'gpo'));
      const txg=lerp(bx+dir*adv,gl+dir*(GR+1),hug);
      g.x+=(txg-g.x)*Math.min(1,dt*(5+5*hug));
      g.ang=turn(g.ang,gFace(g),12*dt);
      if(enabled&&canGoOut(g)) g.mode='out';
    } else if(g.mode==='out'){
      moveTo(g,puck.x,puck.y,gs*1.2,dt);
      g.ang=turn(g.ang,Math.atan2(puck.y-g.y,puck.x-g.x),10*dt);
      if(puck.owner&&puck.owner!==g) g.mode='ret';
      else if(!puck.owner&&(oppNear(puck.x,puck.y,g.side,105)||Math.abs(puck.x-goalLineX(g))>270||Math.hypot(puck.vx,puck.vy)>420)) g.mode='ret';
    } else if(g.mode==='hold'){
      g.holdT+=dt; g.vx*=.8; g.vy*=.8;
      const t=goaliePassTarget(g);
      if(t) g.ang=turn(g.ang,Math.atan2(t.y-g.y,t.x-g.x),8*dt);
      if(enabled&&(g.holdT>.6||oppNear(g.x,g.y,g.side,80))){
        if(t) doPass(g,t); else { g.ang=g.side===0?0:Math.PI; fire(g,.5); }
      }
    } else if(g.mode==='ret'){
      const d=moveTo(g,bx,clamp(g.y,CY-NHW+GR*.55,CY+NHW-GR*.55),gs*1.25,dt);
      g.ang=turn(g.ang,gFace(g),10*dt);
      if(d<6){ g.mode='net'; g.ty=g.y; }
    }
  }
  for(const r of netSolid){ const c=circleRect(g.x,g.y,GR,r); if(c){ g.x+=c.nx*c.pen; g.y+=c.ny*c.pen; } }
  wall(g,GR);
}

/* ---------- physics ---------- */
function pushOutCircle(p,g,gr){
  let dx=p.x-g.x, dy=p.y-g.y, d=Math.hypot(dx,dy); const min=p.r+gr;
  if(d>=min) return;
  if(d<1e-6){ dx=1; dy=0; d=1; }
  const nx=dx/d, ny=dy/d;
  p.x=g.x+nx*min; p.y=g.y+ny*min;
  const vn=p.vx*nx+p.vy*ny; if(vn<0){ p.vx-=1.2*vn*nx; p.vy-=1.2*vn*ny; }
}
function collidePP(a,b){
  let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy); const min=a.r+b.r;
  if(d>=min) return;
  if(d<1e-6){ dx=1; dy=0; d=1; }
  const nx=dx/d, ny=dy/d, pen=min-d;
  a.x-=nx*pen/2; a.y-=ny*pen/2; b.x+=nx*pen/2; b.y+=ny*pen/2;
  const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
  if(rel>0){
    const j=.85*rel; a.vx-=j*nx; a.vy-=j*ny; b.vx+=j*nx; b.vy+=j*ny;
    if(state==='play'){
      const v=puck.owner;
      if((v===a||v===b) && a.side!==b.side && rel>140+80*N(v,'hnd')){
        const s=v===a?-1:1;
        puck.owner=null; looseAt(v.x+Math.cos(v.ang)*CARRY,v.y+Math.sin(v.ang)*CARRY);
        puck.vx=v.vx+s*nx*rel*.5+(Math.random()-.5)*120; puck.vy=v.vy+s*ny*rel*.5+(Math.random()-.5)*120;
        v.pickCool=.6; sfx.hit(); shake=Math.max(shake,.25);
      } else if(rel>260){ sfx.hit(); shake=Math.max(shake,.15); }
    }
  }
}
function countShot(g){
  const s=puck.shot; if(!s||s.side===g.side) return;
  G.sog[s.side]++; boxRec(g.pl).sa++;
  puck.shot=null;
  const sh=puck.hist[0]&&puck.hist[0].pl;
  if(!G.so) say(pickS([`${lastN(sh)} shoots, saved by ${lastN(g.pl)}.`,`Shot from ${lastN(sh)}, and ${lastN(g.pl)} makes the save.`,`${lastN(g.pl)} says no.`]),1);
}
function goalieHit(g){
  const pk=puck, R=saveR(g); pk.icing=null;
  let dx=pk.x-g.x, dy=pk.y-g.y, d=Math.hypot(dx,dy); if(d<1e-6){dx=g.side===0?1:-1;dy=0;d=1;}
  const od=g.side===0?1:-1;
  let nx=dx/d, ny=dy/d;
  if(nx*od<.3){ nx=.3*od; const l=Math.hypot(nx,ny)||1; nx/=l; ny=(ny||(Math.random()-.5))/l; const l2=Math.hypot(nx,ny); nx/=l2; ny/=l2; }
  pk.x=g.x+nx*(R+KR+.5); pk.y=g.y+ny*(R+KR+.5);
  const vn=pk.vx*nx+pk.vy*ny;
  if(vn<0){ pk.vx-=1.5*vn*nx; pk.vy-=1.5*vn*ny; }
  pk.vy+=(g.vy||0)*.5;
  const sp=Math.hypot(pk.vx,pk.vy);
  if(sp<260){ const s=260/(sp||1); if(sp<1){ pk.vx=nx*260; pk.vy=ny*260; } else { pk.vx*=s; pk.vy*=s; } }
  countShot(g); sfx.pad();
}
function puckGoalie(g,sp){
  /* returns true if goalie caught the puck */
  if(puck.ghost===g) return false;
  if(g.mode!=='out' && puck.shot && puck.shot.side!==g.side && sp>650 && !g.human){
    const miss=clamp((sp-650)/1600,0,.3)*.8*clamp(2-SET.goalie,.2,1.8)*(1.3-N(g,'rfx'))*(G.sides[g.side].ups?1-.08*G.sides[g.side].ups.goalie:1);
    if(Math.random()<miss){ puck.ghost=g; return false; }
  }
  const behind=(g.side===0?1:-1)*(puck.x-g.x)<0;
  if(state==='play'&&g.pickCool<=0&&(g.mode==='out'||(sp<330&&(behind||!oppNear(puck.x,puck.y,g.side,60))))){
    countShot(g);
    gain(g); g.mode='hold'; g.holdT=0; g.vx*=.3; g.vy*=.3; sfx.pad();
    return true;
  }
  goalieHit(g); return false;
}
function checkGoal(){
  const pk=puck;
  if(Math.abs(pk.y-CY)>=NHW-1) return;
  if(pk.lx>GX && pk.x<=GX) goalScored(1);
  else if(pk.lx<W-GX && pk.x>=W-GX) goalScored(0);
}
function puckStep(dt){
  const pk=puck;
  if(pk.frozen) return;
  if(pk.owner){
    const o=pk.owner;
    pk.lx=pk.x; pk.ly=pk.y;
    if(o.isG){ pk.x=o.x+Math.cos(o.ang)*GR*.7; pk.y=o.y+Math.sin(o.ang)*GR*.7; pk.vx=o.vx; pk.vy=o.vy; wall(pk,KR); return; }
    /* automatic stickhandling: the puck moves side to side on the blade as you skate */
    const mv=Math.min(1,Math.hypot(o.vx,o.vy)/200);
    o.sth=(o.sth||0)+dt*(5+6*N(o,'hnd'))*(.35+.65*mv);
    const lat=Math.sin(o.sth)*(.2+.2*N(o,'hnd'))*(o.down?.25:1)*(.5+.5*mv), dist=CARRY-2+Math.cos(o.sth*2)*2.5*mv;
    const a=o.ang+lat;
    pk.x=o.x+Math.cos(a)*dist; pk.y=o.y+Math.sin(a)*dist; pk.vx=o.vx; pk.vy=o.vy;
    if(state==='play'){ checkGoal(); if(pk.frozen) return; }
    wall(pk,KR);
    for(const g of goalies){
      if(Math.hypot(pk.x-g.x,pk.y-g.y)<saveR(g)+KR){ o.pickCool=.6; pk.owner=null; goalieHit(g); break; }
    }
    return;
  }
  const sp0=Math.hypot(pk.vx,pk.vy), n=Math.max(1,Math.ceil(sp0*dt/6)), h=dt/n;
  for(let i=0;i<n;i++){
    pk.lx=pk.x; pk.ly=pk.y;
    pk.x+=pk.vx*h; pk.y+=pk.vy*h;
    if(state==='play'){ checkGoal(); if(pk.frozen) return; }
    for(const r of puckRects){
      const c=circleRect(pk.x,pk.y,KR,r);
      if(c){
        pk.x+=c.nx*c.pen; pk.y+=c.ny*c.pen;
        const vn=pk.vx*c.nx+pk.vy*c.ny;
        if(vn<0){ pk.vx-=1.7*vn*c.nx; pk.vy-=1.7*vn*c.ny; sfx.wall(Math.hypot(pk.vx,pk.vy)); }
      }
    }
    const w=wall(pk,KR);
    if(w){
      const vn=pk.vx*w.nx+pk.vy*w.ny;
      if(vn<0){ pk.vx-=1.78*vn*w.nx; pk.vy-=1.78*vn*w.ny; sfx.wall(-vn); }
    }
    for(const g of goalies){
      const d=Math.hypot(pk.x-g.x,pk.y-g.y);
      if(d<saveR(g)+KR){ if(puckGoalie(g,Math.hypot(pk.vx,pk.vy))) return; }
      else if(puck.ghost===g&&d>saveR(g)+KR+12) puck.ghost=null;
    }
    for(const p of live){
      const dx=pk.x-p.x, dy=pk.y-p.y, d=Math.hypot(dx,dy)||.001, sp=Math.hypot(pk.vx,pk.vy);
      if(d<p.r+KR+4+3*N(p,'hnd')){
        const lim=620+200*N(p,'hnd');
        if(p.pickCool<=0 && sp<lim && state==='play'){ puck.shot=null; gain(p); sfx.pick(); break; }
        else if(p.pickCool>0 || sp>=lim){
          pk.icing=null;
          const nx=dx/d, ny=dy/d;
          pk.x=p.x+nx*(p.r+KR+4); pk.y=p.y+ny*(p.r+KR+4);
          const vn=(pk.vx-p.vx)*nx+(pk.vy-p.vy)*ny;
          if(vn<0){ pk.vx-=1.5*vn*nx; pk.vy-=1.5*vn*ny; sfx.pad(); }
        }
      }
    }
    if(pk.owner) break;
  }
  if(!pk.owner){
    const f=Math.exp(-.32*dt); pk.vx*=f; pk.vy*=f;
    const sp=Math.hypot(pk.vx,pk.vy); if(sp>1400){ pk.vx*=1400/sp; pk.vy*=1400/sp; }
  }
}

/* ---------- flow ---------- */
function setBanner(big,sub,glow){
  const b=$('banner');
  b.innerHTML=`<span class="big">${esc(big)}</span>${sub?`<span class="sub">${esc(sub)}</span>`:''}`;
  b.style.setProperty('--glow',glow||'#000');
  b.classList.add('on');
}
function clearBanner(){ const b=$('banner'); b.classList.remove('on'); b.dataset.k=''; }
function endPeriod(){
  puck.frozen=true; puck.owner=null; puck.vx=puck.vy=0;
  sfx.horn();
  for(const k in G.en) G.en[k]=Math.min(1,G.en[k]+.5);
  if(period<3){
    state='period'; stateT=2.8; setBanner(`End of period ${period}`,`${teams[0].short} ${score[0]}, ${teams[1].short} ${score[1]}`);
    say(`That's the end of the ${ORD[period-1]} period.`,2);
  } else if(period===3 && score[0]===score[1]){
    state='period'; stateT=2.8; setBanner('Overtime','Next goal wins'); say("We're tied, and we're going to overtime!",2);
  } else if(period===4 && score[0]===score[1] && !G.sudden){ startShootout(); }
  else endGame();
}
function nextPeriod(){ period++; clock=period===4?(G.sudden?0:OT_LEN):SET.plen; faceoff(); }
function goalScored(side){
  if(state!=='play') return;
  if(G.so){ if(G.so.att&&G.so.att.s===side) soResult(true); return; }
  if(G.sk){ skGoal(side); return; }
  score[side]++;
  if(G.prac){ G.sog[side]++; puck.frozen=true; puck.owner=null; puck.vx=puck.vy=0; state='goal'; stateT=1.1; sfx.horn(); setBanner('Goal!','',teams[side].jersey); return; }

  const og=goalies[1-side];
  G.sog[side]++; if(!og.pulled){ boxRec(og.pl).sa++; boxRec(og.pl).ga++; }
  const ch=puck.hist.filter(e=>e.side===side&&e.pl!==og.pl);
  let sub=`${teams[side].short} score`;
  if(ch.length){
    boxRec(ch[0].pl).g++; for(const e of ch.slice(1,3)) boxRec(e.pl).a++;
    sub=`#${ch[0].pl.num} ${ch[0].pl.name}`+(ch.length>1?` (from ${ch.slice(1,3).map(e=>e.pl.name.split(' ').pop()).join(', ')})`:'');
  }
  if(ch.length){ const sp=ch[0].pl; if(boxRec(sp).g>=2&&!(G.hotG&&G.hotG[sp.id])){ (G.hotG=G.hotG||{})[sp.id]=1; const sk=skaters.find(p=>p.pl===sp); if(sk) setTimeout(()=>flashTxt(sk,'Heating up!'),900); } }
  G.lastScorer=ch.length?ch[0].pl:null; G.celebDone={};
  const rv=reviewCheck(side,og); G.rev=rv?Object.assign(rv,{side,scorer:ch.length?ch[0].pl:null,assists:ch.slice(1,3).map(e=>e.pl),og}):null; G.revDone=false;
  if(G.league&&(G.kind==='fr'||G.kind==='car')&&side===0){
    const L=G.league, inv=ch.some(e=>isMe(L,{id:e.pl.id}));
    if(L.kind==='fr'||inv) G.hlPending={side,desc:`${ch.length?ch[0].pl.name:teams[side].short} scores vs ${teams[1].short} (season ${L.season})`};
  }
  if(humans.some(h=>h.side===side&&!h.gk)) setTimeout(()=>{ if(state==='goal') toast('Celebrate! Shoot: fist pump · Pass: knee slide · Check: bow and arrow'); },700);
  else if(ch.length&&Math.random()<.5){ const sk=skaters.find(p=>p.pl===ch[0].pl); if(sk) sk.celeb={type:pick(['pump','bow']),t:0}; }

  if(G.kind==='intl'||G.kind==='skills') return false;

  toast(`${pl.name} is injured and leaves the game${games}`); say(`${lastN(pl)} is hurt on the play and heads to the room.`,1);

  G.rp={i,acc:0,start:i,end:r.length-1,net:G.lastGoal,frac:0,hold:0}; G.rpDone=true;
  state='replay'; clearBanner(); puck.trail=[];

function replayStep(dt){
  const R=G.rp, r=G.rec; if(!R) return;
  if(R.i>=R.end){ R.hold+=dt; if(R.hold>.8) endReplay(); return; }
  R.acc+=dt*.62;
  while(R.i<R.end&&R.acc>=r[R.i].dt){ R.acc-=r[R.i].dt; R.i++; }
  const f=r[R.i]; R.frac=(R.i-R.start)/Math.max(1,R.end-R.start);
  for(const [p,x,y,a,vx,vy,sw] of f.s){ p.x=x; p.y=y; p.ang=a; p.vx=vx; p.vy=vy; p.swing=sw; }
  f.g.forEach((v,k)=>{ const g=goalies[k]; g.x=v[0]; g.y=v[1]; g.ang=v[2]; g.dive=v[3]; });
  puck.x=f.pk[0]; puck.y=f.pk[1];

/* ---------- video review ---------- */
function reviewCheck(side,og){
  if(G.so||G.prac||G.sk||G.kind==='hl') return null;
  const close=!og.pulled&&live.some(p=>p.side===side&&Math.hypot(p.x-og.x,p.y-og.y)<GR+PR+10);
  if(close&&Math.random()<.22) return {reason:'goalie interference',over:Math.random()<.4};
  if(SET.rules&&G.entryMarg&&G.entryMarg.side===side&&time-G.entryMarg.t<7&&Math.random()<.35) return {reason:'offside',over:Math.random()<.45};
  return null;
}
function startReview(){
  const R=G.rev; R.started=true;
  state='review'; stateT=3; sfx.whistle();
  setBanner('Video review',`Checking for ${R.reason}…`);
  say(`This one is going to video review for possible ${R.reason}.`,2);
}
function resolveReview(){
  const R=G.rev; G.rev=null;
  if(R.over){
    score[R.side]--; if(R.scorer){ boxRec(R.scorer).g--; for(const a of R.assists) boxRec(a).a--; }
    if(R.og&&!R.og.pulled) boxRec(R.og.pl).ga--;
    cheer=0; noise(1.2,.12,260);
    setBanner('No goal!',`Overturned for ${R.reason}`);
    say(`The call is overturned. No goal, ${R.reason}.`,2);
    state='stop'; stateT=2.4; G.nextSpot=R.reason==='offside'?neuDot(R.side):null; G.rpDone=false;
  } else {
    setBanner('Good goal!','The call on the ice stands');
    say('After review, it is a good goal!',2);
    state='stop'; stateT=1.8; G.stopFn=()=>{ G.revDone=true; afterGoal(); };
  }
}

/* ---------- celebrations ---------- */
const CELEB={s:['pump','Fist pump!'],p:['slide','Knee slide!'],c:['bow','Bow and arrow!']};
function celebrate(h,a){
  if(!G||state!=='goal'||G.lastGoal!==h.side||G.prac||h.gk||!CELEB[a]) return;
  if(G.celebDone&&G.celebDone[h.i]) return;
  (G.celebDone=G.celebDone||{})[h.i]=1;
  const sc=G.lastScorer&&skaters.find(p=>p.pl===G.lastScorer&&p.side===h.side);
  const t=(sc&&(sc.human===h||!sc.human))?sc:h.sk; if(!t) return;
  const [type,label]=CELEB[a];
  t.celeb={type,t:0}; if(type==='slide'){ t.vx=Math.cos(t.ang)*230; t.vy=Math.sin(t.ang)*230; }
  flashTxt(t,label); cheer=Math.max(cheer,2.5); sfx.crowd();
  say(pickS(['Listen to this crowd!','He is loving that one!','What a celebration!']),1);
}

/* ---------- season highlights: save goal clips ---------- */
function hlCapture(){
  const L=G.league, P=G.hlPending; G.hlPending=null;
  if(!L||!P||!G.rec||G.rec.length<30) return;
  const r=G.rec; let t=0, i=r.length-1; while(i>0&&t<3.3){ t+=r[i].dt; i--; }
  const objs=[], idx=new Map(), fr=[];
  let acc=0;
  for(let k=i;k<r.length;k++){
    acc+=r[k].dt; if((k-i)%2&&k!==r.length-1) continue;
    const s=[];
    for(const [p,x,y,a] of r[k].s){ if(!idx.has(p)){ idx.set(p,objs.length); objs.push(p); } s.push([idx.get(p),Math.round(x),Math.round(y),Math.round(a*100)]); }
    fr.push({d:Math.round(acc*1000)/1000,s,g:r[k].g.map(v=>[Math.round(v[0]),Math.round(v[1]),Math.round(v[2]*100)]),pk:[Math.round(r[k].pk[0]),Math.round(r[k].pk[1])]}); acc=0;
  }
  const meta=objs.map(p=>({side:p.side,role:p.role,num:p.num,name:p.pl?p.pl.name:''}));
  L.hl=(L.hl||[]).concat({season:L.season,desc:P.desc,t:G.opts.t.slice(),kit:[teams[0].kit||0,teams[1].kit||0],net:P.side,meta,fr}).slice(-8);
  saveL(L);
}
function hlPlay(L,i){

  const R=id=>((L.teams&&L.teams[id])||(L.minor&&L.minor.teams[id])||DEF[id]||DEF[LEAGUE_IDS[0]]).roster;
  beginGame({kind:'hl',t:h.t,kit:h.kit,rosters:[R(h.t[0]),R(h.t[1])],lineup:'solo',humans:[],ai:[.5,.5],ups:null,league:L,home:null,sudden:false});

  live=skaters.slice();

function rr(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.arc(x+w-r,y+r,r,-Math.PI/2,0);
  c.lineTo(x+w,y+h-r); c.arc(x+w-r,y+h-r,r,0,Math.PI/2); c.lineTo(x+r,y+h); c.arc(x+r,y+h-r,r,Math.PI/2,Math.PI);
  c.lineTo(x,y+r); c.arc(x+r,y+r,r,Math.PI,Math.PI*1.5); c.closePath();
}
/* points along the rounded rink outline pushed out by d */
function perimPts(d,stepLen){
  const out=[], R=RC+d;
  const segs=[
    ['l',RC,-d,W-RC,-d],['a',W-RC,RC,-Math.PI/2,0],['l',W+d,RC,W+d,H-RC],['a',W-RC,H-RC,0,Math.PI/2],
    ['l',W-RC,H+d,RC,H+d],['a',RC,H-RC,Math.PI/2,Math.PI],['l',-d,H-RC,-d,RC],['a',RC,RC,Math.PI,Math.PI*1.5]
  ];
  for(const s of segs){
    if(s[0]==='l'){ const len=Math.hypot(s[3]-s[1],s[4]-s[2]), n=Math.max(1,Math.round(len/stepLen)); for(let i=0;i<n;i++){ const t=i/n; out.push({x:lerp(s[1],s[3],t),y:lerp(s[2],s[4],t),nx:s[1]===s[3]?Math.sign(s[1]-W/2):0,ny:s[2]===s[4]?Math.sign(s[2]-H/2):0}); } }
    else { const len=R*(s[4]-s[3]), n=Math.max(1,Math.round(len/stepLen)); for(let i=0;i<n;i++){ const a=lerp(s[3],s[4],i/n); out.push({x:s[1]+Math.cos(a)*R,y:s[2]+Math.sin(a)*R,nx:Math.cos(a),ny:Math.sin(a)}); } }
  }
  return out;
}

function drawNet(c,x,y,w,h,left){

  c.strokeStyle='#d1343f'; c.lineWidth=4; c.lineJoin='round'; c.beginPath();

  else { c.moveTo(x,y); c.lineTo(x+w,y); c.lineTo(x+w,y+h); c.lineTo(x,y+h); }

const VIEW_NAMES={bc:'Broadcast 3D',ice:'Ice level 3D',flat:'Top-down 2D',tp:'3rd person',fp:'1st person',tp2:'3rd person P2',fp2:'1st person P2',tilt:'Tilted 2D',p1:'Follow cam',p2:'Follow cam P2'};
let view=R3.ok?'bc':'tilt', camA=0, camMode=null, camPhi=0;
function viewList(){
  const two=(state==='menu'||state==='hub')?menuMode===2:humans.length>1;
  if(R3.ok) return two?['bc','ice','flat','tp','fp','tp2','fp2']:['bc','ice','flat','tp','fp'];
  return two?['tilt','flat','p1','p2']:['tilt','flat','p1'];
}
function setView(v){
  const L=viewList(); if(!L.includes(v)) v=L[0];
  view=v; camMode=null;
  $('btnView').textContent=VIEW_NAMES[view];
}
function cycleView(){ const L=viewList(); setView(L[(L.indexOf(view)+1)%L.length]); toast(VIEW_NAMES[view]); }
const is3D=()=>R3.ok&&['bc','ice','tp','fp','tp2','fp2'].includes(view);
function applyCam(dt){
  if(is3D()){
    if(camMode!=='r3'){ camMode='r3'; stage.classList.add('r3'); stage.classList.remove('tilt','cam'); cv.style.transform=''; cv.style.transformOrigin=''; camPhi=0; }
    if(state!=='hub') R3.render(dt);
    return false;
  }
  if(camMode==='r3'||stage.classList.contains('r3')){ stage.classList.remove('r3'); camMode=null; }
  const h=humans.find(x=>x.i===(view==='p2'?1:0));
  const p=(h&&(h.sk||h.gk))||{x:puck.x,y:puck.y,ang:0};
  const follow=(view==='p1'||view==='p2') && state!=='menu' && G;
  const want=follow?'cam':(view==='flat'?'flat':'tilt');
  if(want!==camMode){
    camMode=want;
    stage.classList.toggle('tilt',want==='tilt'); stage.classList.toggle('cam',want==='cam');
    if(want!=='cam'){ cv.style.transform=''; cv.style.transformOrigin=''; camPhi=0; }
    else camA=p.ang;
  }
  if(want!=='cam') return true;
  camA=turn(camA,p.ang,4*dt);
  camPhi=-Math.PI/2-camA;
  const sw=cv.clientWidth, ch=cv.clientHeight, sc=sw/CW;
  const ox=(M+p.x)*sc, oy=(M+p.y)*sc;
  cv.style.transformOrigin=`${ox}px ${oy}px`;
  cv.style.transform=`translate(${sw/2-ox}px,${ch*.8-oy}px) scale(1.7) perspective(${sw*1.05}px) rotateX(64deg) rotateZ(${camPhi}rad)`;
  return true;
}

$('hub').addEventListener('click',e=>{
  const L=curL; if(!L) return;
  const ren=e.target.closest('[data-ren]');
  if(ren){
    const p=findP(L,ren.dataset.ren); if(!p) return;
    const inp=document.createElement('input'); inp.value=p.name; inp.maxLength=26; ren.replaceWith(inp); inp.focus(); inp.select();
    const done=ok=>{ if(ok&&inp.value.trim()) p.name=inp.value.trim(); saveL(L); renderHub(); };
    inp.addEventListener('keydown',ev=>{ ev.stopPropagation(); if(ev.key==='Enter') done(true); if(ev.key==='Escape') done(false); });
    inp.addEventListener('blur',()=>done(true));
    return;
  }
  const tr=e.target.closest('[data-tr]');
  if(tr){ const s=tr.dataset.tr==='give'?tradeSel.give:tradeSel.get; if(s.has(tr.dataset.id)) s.delete(tr.dataset.id); else if(s.size<3) s.add(tr.dataset.id); tradeSel.msg=''; renderHub(); return; }

  const a=b.dataset.act;
  if(a==='play') hubPlay(); else if(a==='sim') hubSim(); else if(a==='menu') toMenu(); else if(a==='buy') buyUpgrade(+b.dataset.i); else if(a==='kit') cycleKit();
  else if(a==='simall') simToEnd();

  else if(a==='playas'){ L.playAs=L.playAs==='goalie'?'skater':'goalie'; saveL(L); renderHub(); }

    if(r.ok&&L.kind!=='car') doTrade(L,give,get,tradeSel.other);

    saveL(L);
    tradeSel.msg=r.msg; tradeSel.ok=r.ok; renderHub();
  }
  else if(a==='clrtrade'){ tradeSel.give.clear(); tradeSel.get.clear(); tradeSel.msg=''; renderHub(); }
  else if(a==='autopick'){ draftPick(L,aiPickId(L,L.id)); simDraft(L,false); if(L.phase==='season') L.tab='home'; saveL(L); renderHub(); }
  else if(a==='simdraft'){ simDraft(L,false); if(L.phase==='season') L.tab='home'; saveL(L); renderHub(); }
  else if(a==='simdraftall'){ simDraft(L,true); L.tab='home'; saveL(L); renderHub(); }

  else if(a==='pview'){ const want=+b.dataset.v, cur=findP(L,L.pid)===p1Of(L)?1:2; if(want!==cur){ swapP(L); saveL(L); } renderHub(); }
  else if(a==='skipintl'){ L.intlDone=L.season; saveL(L); renderHub(); }

  else if(a==='simpo'){ simNhlPlayoffs(L); saveL(L); renderHub(); }
  else if(a==='lreset'){ delete L.lines[myId(L)]; lineSel=null; lineMsg=''; saveL(L); renderHub(); }
  else if(a==='retire'){ if(confirm('Retire from hockey? This ends your career.')) retireCareer(L); }
});
function hubKey(code){
  if(code==='Enter'||code==='NumpadEnter') hubPlay();
  else if(code==='KeyS') hubSim();
  else if(code==='KeyJ') cycleKit();
  else if(code==='Escape'||code==='KeyM') toMenu();
  else if(/^Digit[1-4]$/.test(code)&&curL&&curL.kind==='fr') buyUpgrade(+code.slice(5)-1);
  else if(code==='KeyT'&&curL){ const t=tabsFor(curL); curL.tab=t[(t.findIndex(x=>x[0]===curL.tab)+1)%t.length][0]; renderHub(); }
}

function linesFrom(roster,c){
  if(!c) return buildLines(roster);
  const pool=roster.filter(p=>!(p.inj>0)), byId=new Map(pool.map(p=>[p.id,p])), used=new Set();
  const get=id=>{ const p=byId.get(id); if(p&&!used.has(p)){ used.add(p); return p; } return null; };
  const out={F:[],D:[],G:[]};
  for(let i=0;i<4;i++){ const f={}; ['C','LW','RW'].forEach((k,j)=>f[k]=get(c.F&&c.F[i]&&c.F[i][j])); out.F.push(f); }
  for(let i=0;i<3;i++){ const d={}; ['LD','RD'].forEach((k,j)=>d[k]=get(c.D&&c.D[i]&&c.D[i][j])); out.D.push(d); }
  out.G=[get(c.G&&c.G[0]),get(c.G&&c.G[1])];
  const best=f=>{ const p=pool.filter(q=>!used.has(q)&&f(q)).sort(byOvr)[0]; if(p) used.add(p); return p||null; };
  for(const f of out.F) for(const k of ['C','LW','RW']) if(!f[k]) f[k]=best(q=>q.pos===k)||best(q=>isF(q))||best(q=>q.pos!=='G');
  for(const d of out.D) for(const k of ['LD','RD']) if(!d[k]) d[k]=best(q=>q.pos==='D')||best(q=>q.pos!=='G');
  for(let i=0;i<2;i++) if(!out.G[i]) out.G[i]=best(q=>q.pos==='G')||out.G[0]||emergencyG();
  for(const f of out.F) for(const k in f) if(!f[k]) f[k]=out.F[0][k];
  for(const d of out.D) for(const k in d) if(!d[k]) d[k]=out.D[0][k]||out.F[0].C;
  return out;
}

}

let faMsg={t:'',ok:false};
function suggestFA(L,pid){
  if(L.inf<2){ faMsg={t:'You need 2 influence. Win games and put up points to earn more.',ok:false}; return; }
  const p=L.fa.find(q=>q.id===pid); if(!p) return;
  L.inf-=2;
  const r=ros(L,L.tid), worst=r.filter(q=>grp(q)===grp(p)).sort(byOvr).slice(grp(p)==='F'?11:grp(p)==='D'?5:1)[0];
  if(worst&&p.ovr<=worst.ovr){ faMsg={t:`GM: "${p.name} wouldn't crack our lineup." (influence spent)`,ok:false}; return; }
  const e=signFA(L,pid);
  faMsg=e?{t:`GM: "${e}" (influence spent)`,ok:false}:{t:`GM: "Good call. We signed ${p.name}."`,ok:true};
}

/* ---------- career trade suggestions (limited power) ---------- */
function careerTradeSuggest(L,give,get,other){
  if(give.some(p=>isMe(L,p))) return {ok:false,msg:'Use "Request a trade" on the Home tab to move yourself.'};
  if(L.inf<3) return {ok:false,msg:'You need 3 influence to pitch a trade to the GM.'};
  const r=tradeCheck(L,give,get,other,L.tid); if(!r.ok) return r;
  L.inf-=3;
  const before=teamOvr(ros(L,L.tid)), after=teamOvr(ros(L,L.tid).filter(p=>!give.includes(p)).concat(get));
  if(after<before) return {ok:false,msg:`GM: "That makes us worse right now (${before} to ${after} overall)." (3 influence spent)`};
  doTrade(L,give,get,other,L.tid);
  return {ok:true,msg:`GM: "Done. Thanks for the tip." (3 influence spent)`};
}

function careerOffers(L){

/* ---------- career totals, awards, Hall of Fame ---------- */
const HKEY='rinkRivalsHOFv1';
const readHOF=()=>{ try{ return JSON.parse(localStorage.getItem(HKEY)||'[]'); }catch(e){ return []; } };
function addTotals(p){
  const c=p.car||(p.car={gp:0,g:0,a:0,pim:0,w:0,sa:0,ga:0,so:0,seasons:0});
  for(const k of ['gp','g','a','pim','w','sa','ga','so']) c[k]+=p.st[k]||0;
  if(p.st.gp>0) c.seasons++;
}
function hofWorthy(L,p,extra){
  const c=p.car; if(!c||!c.gp) return false;
  const honors=(p.cups||0)+(p.aw||0)+(extra||0);
  if(p.pos==='G'){ const sv=c.sa?1-c.ga/c.sa:0; return c.gp>=L.len*4&&(sv>=.915||honors>=3); }
  return c.gp>=L.len*6&&((c.g+c.a)/c.gp>=.85||honors>=4);
}
function hofLine(p){
  const c=p.car||{gp:0,g:0,a:0,w:0,sa:0,ga:0,seasons:0};
  return p.pos==='G'?`${c.seasons} seasons · ${c.gp} GP · ${c.w} W · ${c.sa?(1-c.ga/c.sa).toFixed(3).replace(/^0/,''):'-'} SV%`:`${c.seasons} seasons · ${c.gp} GP · ${c.g} G · ${c.a} A · ${c.g+c.a} PTS`;
}
function onRetire(L,p,news){

}

  return `<div class="hgrid"><div class="hcard"><h3>Hall of Fame <span class="hsub">(this league)</span></h3>${L.hof.length?`<ul class="log">${L.hof.map(row).join('')}</ul>`:'<div class="hsub">Nobody yet. Players get in when they retire with great career numbers, Cups and awards.</div>'}</div>

const JR_T=[['j0','Kingston','Blades','#1e3a8a','#fbbf24'],['j1','Thunder Bay','Lynx','#065f46','#e5e7eb'],['j2','Halifax','Mariners','#0e7490','#f8fafc'],['j3','Regina','Pioneers','#7c2d12','#fde68a'],['j4','Kelowna','Peaks','#4c1d95','#e9d5ff'],['j5','Sarnia','Ironmen','#374151','#f97316'],['j6','Moncton','Tides','#1d4ed8','#93c5fd'],['j7','Brandon','Bisons','#78350f','#fef3c7']];

for(const [id,city,nick,j,tr] of [...JR_T,...AHL_T]){

const LVL_NAME={jr:'Junior',ahl:'AHL',nhl:'NHL'};
const inMinors=L=>L.kind==='car'&&L.lvl&&L.lvl!=='nhl';
const dispTeam=L=>inMinors(L)?L.mtid:userTeam(L);
function genMinor(L,lvl){
  const ids=(lvl==='jr'?JR_T:AHL_T).map(t=>t[0]), teams={};
  for(const id of ids){
    const R=genRoster(lvl==='jr'?rnd(53,59):rnd(60,66));
    for(const p of R){ p.tid=id; p.age=lvl==='jr'?rint(16,20):rint(19,28); p.pot=p.age<25?clamp(p.ovr+rint(2,14),p.ovr,95):p.ovr; }
    teams[id]={roster:R};
  }
  const rr=roundRobin(ids); let sched=[]; while(sched.length<L.len) sched=sched.concat(shuffle(rr));
  return {lvl,ids,teams,tbl:Object.fromEntries(ids.map(id=>[id,{gp:0,w:0,l:0,otl:0,gf:0,ga:0,pts:0}])),sched:sched.slice(0,L.len)};
}
function recordT(tbl,a,b,ga,gb,ot){
  const A=tbl[a], B=tbl[b];
  A.gp++; B.gp++; A.gf+=ga; A.ga+=gb; B.gf+=gb; B.ga+=ga;
  if(ga>gb){ A.w++; A.pts+=2; if(ot){ B.otl++; B.pts+=1; } else B.l++; }
  else { B.w++; B.pts+=2; if(ot){ A.otl++; A.pts+=1; } else A.l++; }
}
function removeMe(L,me){
  for(const id of LEAGUE_IDS){ const r=L.teams[id].roster, i=r.indexOf(me); if(i>=0) r.splice(i,1); }
  if(L.minor) for(const id in L.minor.teams){ const r=L.minor.teams[id].roster, i=r.indexOf(me); if(i>=0) r.splice(i,1); }
}
function goNhl(L){
  const me=findP(L,L.pid); removeMe(L,me);
  const r=ros(L,L.tid), nums=new Set(r.map(p=>p.num)); if(nums.has(me.num)){ const c=r.find(p=>p.num===me.num); nums.add(me.num); c.num=pickNum(c.pos,nums); }
  r.push(me); me.tid=L.tid;
  if(r.length>28){ const g=grp(me), drop=r.filter(p=>p!==me&&grp(p)===g).sort(byOvr).pop(); if(drop&&cnt(r,g)>MINS[g]){ r.splice(r.indexOf(drop),1); drop.tid='fa'; drop.con={sal:salFor(drop),yrs:0}; L.fa.push(drop); } }
  if(inMinors(L)) L.log.unshift(`You made the ${TEAMS[L.tid].full}! Welcome to the NHL.`);
  L.lvl='nhl'; L.minor=null; L.mtid=null; L.mst=null;
  if(!me.con) me.con={sal:.95,yrs:3};
}
function goMinor(L,lvl){
  const me=findP(L,L.pid);
  L.minor=genMinor(L,lvl);
  L.mtid=lvl==='ahl'&&L.tid?'a'+(hashStr(L.tid)%8):(L.mtid&&L.mtid[0]==='j'&&lvl==='jr'?L.mtid:'j'+rint(0,7));
  removeMe(L,me);
  const r=L.minor.teams[L.mtid].roster, g=grp(me), drop=r.filter(p=>grp(p)===g).sort(byOvr).pop(); if(drop) r.splice(r.indexOf(drop),1);
  const nums=new Set(r.map(p=>p.num)); const c=r.find(p=>p.num===me.num); if(c){ nums.add(me.num); c.num=pickNum(c.pos,nums); }
  r.push(me); me.tid=L.mtid; L.lvl=lvl; L.mst=blankSt();
  L.log.unshift(lvl==='jr'?`You're playing junior for the ${TEAMS[L.mtid].full}`:`Assigned to the ${TEAMS[L.mtid].full} (AHL)${L.tid?`, the ${TEAMS[L.tid].short}' farm team`:''}`);
}
function placeCareer(L){
  const me=findP(L,L.pid); if(!me||L.retired||L.p2) return;
  const was=L.lvl||'nhl';
  if(!L.tid&&me.age>=20){ L.tid=pick(LEAGUE_IDS); L.drafted=true; me.con={sal:.9,yrs:2}; L.log.unshift(`Undrafted, but the ${TEAMS[L.tid].full} signed you`); }

/* ---------- two-player career: two created players on the same team ---------- */
const P_FIELDS=['pid','xp','sp','trophies','hist','goal','pracKey','pracMsg','offers','tradeMsg','campSeason','campMsg','intlDone','money','owned','shopMsg','rival','rivRec'];

/* ---------- hot and cold streaks (league form) ---------- */
function updateForm(L){
  if(!L||!L.teams) return;
  for(const id of LEAGUE_IDS) for(const p of L.teams[id].roster){
    const s=p.st, ls=p._ls||[0,0,0,0];
    if(s.gp>ls[0]){
      const rec=p.rec||(p.rec=[]);
      if(p.pos==='G'){ const sa=s.sa-ls[2], ga=s.ga-ls[3]; rec.push(sa>0?Math.round((1-ga/sa)*1000)/1000:-1); }
      else rec.push((s.g+s.a)-ls[1]);
      while(rec.length>4) rec.shift();
    }
    p._ls=[s.gp,s.g+s.a,s.sa||0,s.ga||0];
    const r=p.rec||[]; let f=0;
    if(p.pos==='G'){
      const sv=r.filter(x=>x>=0);
      if(sv.length>=2&&sv.slice(-2).every(x=>x>=.93)) f=1;
      else if(sv.length>=2&&sv.slice(-2).every(x=>x<.87)) f=-1;
    } else {
      if(r.length>=3&&r.slice(-3).reduce((a,b)=>a+b,0)>=(p.pos==='D'?3:4)) f=1;

function ensureRival(L){

/* ---------- input ---------- */
const PREVENT=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','NumpadEnter','Slash','Tab','Quote']);
const typing=()=>{ const a=document.activeElement; return a&&(a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA'); };
addEventListener('keydown',e=>{
  if(typing()){ if(e.code==='Escape') document.activeElement.blur(); return; }
  if(PREVENT.has(e.code) || (e.ctrlKey && !e.shiftKey && !e.metaKey)) e.preventDefault();
  if(e.repeat) return;
  keys.add(e.code); audio();
  onDown(e.code);
});
addEventListener('keyup',e=>{ keys.delete(e.code); onUp(e.code); });
addEventListener('blur',()=>{ keys.clear(); for(const p of [...skaters,...goalies]){ if(p.human){ p.down=false; p.charge=0; } } if(state==='play') togglePause(true); });
const inGame=()=>state==='faceoff'||state==='play'||state==='goal'||state==='period'||state==='stop';
function onDown(code){
  if(code==='KeyK'){ openCtrls(); return; }
  if(code==='KeyO'){ openSettings(); return; }
  if(code==='KeyZ'){ toggleFull(); return; }
  if(state==='replay'&&(['Enter','NumpadEnter','Space','Escape'].includes(code)||humans.some(h=>h.ctl.s.includes(code)||h.ctl.p.includes(code)))){ endReplay(); return; }
  if(code==='KeyV'&&state!=='hub'){ cycleView(); return; }
  if(state==='hub'){ hubKey(code); return; }
  if(state==='menu'){ menuKey(code); return; }
  if(state==='over'){
    if(performance.now()-overAt<500) return;
    if(G&&G.league){ if(['KeyR','Enter','NumpadEnter','Space','KeyM','Escape'].includes(code)) afterResult(); return; }
    if(code==='KeyR'||code==='Enter'||code==='NumpadEnter') afterResult();
    else if(code==='KeyM'||code==='Escape') toMenu();
    return;
  }
  let used=false;
  for(const h of humans){
    for(const a of ['s','p','c','w','n','q','i']) if(h.ctl[a].includes(code)){ used=true; if(!paused) humanPress(h,a); }
    for(const a of ['u','d','l','r']) if(h.ctl[a].includes(code)) used=true;
  }
  if(used) return;
  if(code==='KeyP'){ togglePause(); return; }
  if(code==='KeyM'||code==='Escape'){ if(G&&G.league) showHub(G.league); else toMenu(); return; }
}
function onUp(code){
  for(const h of humans) if(h.ctl.s.includes(code)) humanRelease(h,'s');
}
function humanPress(h,a){
  if(state==='replay'){ if(a==='s'||a==='p') endReplay(); return; }
  if(state==='goal'){ if(a==='s'||a==='p'||a==='c') celebrate(h,a); return; }
  if(a==='i'){ instigate(h); return; }
  if(state==='fight'){ const F=G.fight; if(F&&!h.gk){ if(a==='s') fightPunch(h.side); else if(a==='c') fightBlock(h.side); } return; }
  const t=h.gk||h.sk;
  if(a==='w'){ switchPlayer(h); return; }
  if(a==='n'){ manualChange(h.side); return; }
  if(!t||t.box) return;
  if(a==='q'){ if(!t.isG&&puck.owner!==t) requestPass(h); return; }
  if(a==='s'){ t.down=true; t.charge=0; }
  else if(a==='p'){ if(puck.owner===t) passPuck(t); else if(!t.isG) requestPass(h); }
  else if(a==='c'){ if(t.isG) goalieDive(t); else crosscheck(t); }
}
function humanRelease(h,a){
  const t=h.gk||h.sk; if(!t) return;
  if(a==='s'&&t.down){ t.down=false; if(state==='play'&&!paused&&!t.box) fire(t,t.charge); t.charge=0; }
}

    let mx=0, my=0, mm=0;
    if(b[12]||b[13]||b[14]||b[15]){
      mx=(b[15]?1:0)-(b[14]?1:0); my=(b[13]?1:0)-(b[12]?1:0);
      const l=Math.hypot(mx,my)||1; mx/=l; my/=l; mm=1;
    } else if(mag>DZ){ mx=lx/mag; my=ly/mag; mm=Math.min(1,(mag-DZ)/(.9-DZ)); }
    const on=mm>.5;
    const dirs={up:on&&my<-.6,down:on&&my>.6,left:on&&mx<-.6,right:on&&mx>.6};
    const rd={left:rx<-.6,right:rx>.6};
    const edge=i=>b[i]&&!st.b[i], dE=k=>dirs[k]&&!st.d[k], rE=k=>rd[k]&&!st.r[k];
    if(inGame()){
      const h=humans[n]; if(!h){ st.b=b; st.d=dirs; st.r=rd; return; }
      if(mm>0) h.padMove={x:mx,y:my,mag:mm};
      const t=h.gk||h.sk;
      const sb=b[0]||b[7], psb=st.b[0]||st.b[7];
      if(sb&&!psb&&!paused&&t&&!t.down){ humanPress(h,'s'); h.padShoot=true; }
      if(!sb&&psb&&h.padShoot){ h.padShoot=false; humanRelease(h,'s'); }
      if((edge(2)||edge(5))&&!paused) humanPress(h,'p');
      if(edge(1)&&!paused) humanPress(h,'c');
      if(edge(4)&&!paused) humanPress(h,'w');
      if(edge(6)&&!paused) humanPress(h,'n');
      if(edge(11)&&!paused) humanPress(h,'i');
      if(edge(3)) cycleView();
      if(edge(9)) togglePause();
      if(edge(8)) onDown('Escape');
    } else if(n===0||(state==='menu'&&menuMode===2&&n===1)){
      const k=n===1?{u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight'}:{u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD'};
      if(state==='menu'){
        if(dE('left')) onDown(k.l); if(dE('right')) onDown(k.r);
        if(dE('up')) onDown(k.u); if(dE('down')) onDown(k.d);
        if(menuMode===1){ if(rE('left')) onDown('ArrowLeft'); if(rE('right')) onDown('ArrowRight'); }
        if(n===0&&(edge(0)||edge(9))) menuStart();
        if(n===0&&edge(2)) menuContinue();
        if(edge(4)) setMode(((menuMode+5)%7)+1); if(edge(5)) setMode((menuMode%7)+1);
        if(edge(6)||edge(7)){ const Ls=['solo','three','full']; lineup=Ls[(Ls.indexOf(lineup)+(edge(7)?1:2))%3]; renderMenu(); }
        if(edge(3)) cycleView();
      } else if(state==='hub'){
        if(edge(0)||edge(9)) onDown('Enter');
        if(edge(2)) onDown('KeyS'); if(edge(3)) onDown('KeyJ'); if(edge(1)) onDown('Escape');
        if(edge(5)) onDown('KeyT');
      } else if(state==='over'){
        if(edge(0)||edge(9)) onDown('Enter');
        if(edge(1)) onDown('Escape');
      }
    }
    st.b=b; st.d=dirs; st.r=rd;
  });
}
addEventListener('gamepadconnected',e=>{ toast(`${padName(e.gamepad)} connected`); });
addEventListener('gamepaddisconnected',e=>{ delete padPrev[e.gamepad.index]; toast(`${padName(e.gamepad)} disconnected`); });

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000); last=now;
  try{ pollPads(); }catch(err){ padsBlocked=true; }
  try{
    if(!paused&&$('ctrlModal').classList.contains('hidden')&&$('setModal').classList.contains('hidden')) step(dt);
    ambient();
    document.body.classList.toggle('playing',state!=='menu'&&state!=='hub');
    if(state!=='hub'){
      const twoD=applyCam(dt);
      if(twoD) draw();
      hud();
    }
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
buildIce(); buildCrowd2d();
if(R3.ok){ try{ R3.newGame(); }catch(e){ console.error(e); } }
toMenu();
requestAnimationFrame(frame);
if(location.hash==='#test') window.__rr={
  run(sec){ for(let t=0;t<sec;t+=1/60) step(1/60); },
  get s(){ return {state,score:score.slice(),period,clock,sog:G&&G.sog,view,box:skaters.filter(p=>p.box).length,lines:G&&G.sides.map(s=>s.fi),gmode:goalies.map(g=>g.mode),owner:puck.owner?(puck.owner.isG?'G'+puck.owner.side:'S'+puck.owner.side+(puck.owner.human?'H':'')):null}; },
  get G(){ return G; }, get L(){ return curL; }, skaters, goalies, puck, humans,
  DBG, beginGame, DEF, startShootout, startFight, SET, injure, instigate, celebrate, stickBreak, hlPlay, get state(){return state;}, get cheer(){return cheer;}, press(c){ onDown(c); }, release(c){ onUp(c); }, setView, keys
};
})();
