document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;ac();const a=b.dataset.a;if(a==='go')newG();else if(a==='diff'){sv.diff=(sv.diff+1)%3;sv_('t31',sv);render()}else if(a==='opp'){sv.pl=(sv.pl+1)%4;sv_('t31',sv);render()}else if(a==='title'){V='title';render()}});
function newG(){G={t:60,rack:0,ball:0,score:0,pw:0,hold:false,fly:null,msg:'',msgT:-9,sp:[],tt:0,over:false,swish:0,streak:0,ready:true};V='game';render()}
function press(){const g=G;if(!g||g.over||g.fly||!g.ready)return;g.hold=true;g.pw=0;g.dir=1}
function release(){const g=G;if(!g||!g.hold)return;g.hold=false;const ideal=.78,win=[.16,.11,.07][sv.diff],err=Math.abs(g.pw-ideal);let pr=err<win*.35?.97:err<win?.78-(err/win)*.2:clamp(.45-(err-win)*2.2,.04,.4);
 const mk=Math.random()<pr,money=g.ball===4,bonus=g.rack===2;g.fly={t:0,mk,pts:mk?(money?2:1):0,sx:RK[g.rack][0],sy:RK[g.rack][1],off:mk?0:rnd(-30,30),short:err>0&&g.pw<ideal};g.ready=false;beep(300,.08,'sine',.05)}
function nextBall(){const g=G;g.ball++;if(g.ball>=5){g.ball=0;g.rack++}if(g.rack>=5){fin();return}g.ready=true}
function fin(){const g=G;g.over=true;const opp=RIV[sv.pl%4][1];const win=g.score>opp;if(g.score>sv.best)sv.best=g.score;if(win)sv.wins++;sv_('t31',sv);
 $('#ovl').innerHTML='<div class="ovl"><div class="box"><h2>'+(win?'You win!':'Contest over')+'</h2><div class="big" style="font-size:44px">'+g.score+'</div><div class="tip" style="margin:10px 0">'+RIV[sv.pl%4][0]+' scored '+opp+'.'+(win?' Nice shooting.':' Try again.')+'</div><div style="display:grid;gap:8px"><button class="btn" data-a="go">Play again</button><button class="btn g" data-a="title">Menu</button></div></div></div>'}
function step(dt){const g=G;if(!g||g.over)return;g.tt+=dt;g.t-=dt;if(g.t<=0){g.t=0;fin();return}
 if(g.hold){g.pw+=g.dir*dt*1.15;if(g.pw>=1){g.pw=1;g.dir=-1}if(g.pw<=0){g.pw=0;g.dir=1}}
 g.sp=g.sp.filter(p=>(p.l-=dt*2)>0);g.sp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15});
 if(g.fly){const f=g.fly;f.t+=dt/.85;if(f.t>=1){if(f.mk){const pts=f.pts+(g.rack===2&&g.ball===2?2:0);g.score+=pts;g.streak++;g.msg='+'+pts;g.msgT=g.tt;beep(880,.12,'triangle',.07);for(let i=0;i<14;i++)g.sp.push({x:HOOP.x,y:HOOP.y+10,vx:rnd(-2.5,2.5),vy:rnd(-3,1),l:1})}else{g.streak=0;g.msg='MISS';g.msgT=g.tt;beep(140,.15,'sawtooth',.05)}g.fly=null;nextBall()}}}
addEventListener('keydown',e=>{if(e.code==='Space'&&V==='game'){e.preventDefault();if(!e.repeat)press()}});addEventListener('keyup',e=>{if(e.code==='Space'&&V==='game')release()});
document.addEventListener('pointerdown',e=>{if(V==='game'&&e.target.id==='cv'){ac();press()}});document.addEventListener('pointerup',()=>{if(V==='game')release()});
function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d'),g=G;
 const bg=x.createLinearGradient(0,0,0,560);bg.addColorStop(0,'#1a1040');bg.addColorStop(1,'#3a2060');x.fillStyle=bg;x.fillRect(0,0,1000,560);
 for(let i=0;i<120;i++){x.fillStyle='hsl('+(i*47%360)+',60%,'+(40+i%30)+'%)';x.globalAlpha=.5;x.beginPath();x.arc((i*83)%1000,40+Math.floor(i/8)*9+(i%3),4,0,7);x.fill()}x.globalAlpha=1;
 x.fillStyle='#c8873f';x.beginPath();x.moveTo(0,560);x.lineTo(0,330);x.lineTo(1000,330);x.lineTo(1000,560);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(500,150,330,.35,Math.PI-.35);x.stroke();
 // backboard
 x.fillStyle='#e8eef8';x.fillRect(450,95,100,70);x.strokeStyle='#e03a3e';x.lineWidth=3;x.strokeRect(475,130,50,30);x.strokeStyle='#ff6a2b';x.lineWidth=5;x.beginPath();x.moveTo(470,170);x.lineTo(530,170);x.stroke();x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=1.5;for(let i=0;i<5;i++){x.beginPath();x.moveTo(472+i*14,172);x.lineTo(482+i*9,205);x.stroke()}
 // racks
 RK.forEach((r,i)=>{x.fillStyle=i===g.rack?'rgba(255,210,63,.35)':'rgba(255,255,255,.1)';x.beginPath();x.ellipse(r[0],r[1]+30,34,10,0,0,7);x.fill()});
 // player
 const r=RK[Math.min(4,g.rack)],px=r[0],py=r[1];ath(x,px,py+40,88,{shirt:'#ffd23f',shorts:'#2a1a50',numc:'#222',num:7,f:px>520?-1:1,la:g.fly?2.9:g.hold?1.4+g.pw*1.2:.6,ra:g.fly?2.7:g.hold?1.2+g.pw*1.1:-.3,hair:'#2a1a0a'});
 // ball
 let bx=px+12,by=py-34,b=g.fly;if(b){const t=b.t;bx=b.sx+12+(HOOP.x-(b.sx+12)+(b.mk?0:b.off))*t;by=b.sy-34+(HOOP.y+8-(b.sy-34))*t-Math.sin(t*Math.PI)*190}
 x.fillStyle='#ff7a22';x.beginPath();x.arc(bx,by,11,0,7);x.fill();x.strokeStyle='#5a2a08';x.lineWidth=1.5;x.beginPath();x.arc(bx,by,11,0,7);x.moveTo(bx-11,by);x.lineTo(bx+11,by);x.moveTo(bx,by-11);x.lineTo(bx,by+11);x.stroke();
 x.fillStyle='rgba(255,210,63,.9)';g.sp.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;
 // balls on rack
 for(let i=g.ball+(g.fly?1:0);i<5;i++){x.fillStyle=i===4?'#ffd23f':'#ff7a22';x.beginPath();x.arc(px-42+i*0+0,py+38-i*0,0,0,7)}
 for(let i=0;i<5-g.ball-(g.fly?1:0);i++){const k=g.ball+(g.fly?1:0)+i;x.fillStyle=k===4?'#ffd23f':'#ff7a22';x.beginPath();x.arc(px-38+i*0,py-4+i*0,0,0,7);x.fill()}
 // HUD
 x.fillStyle='rgba(8,5,26,.85)';x.beginPath();x.roundRect(300,10,400,50,12);x.fill();x.textAlign='center';x.fillStyle='#ffd23f';x.font='900 26px system-ui';x.fillText(g.score,380,46);x.fillStyle='#fff';x.font='800 24px system-ui';x.fillText(Math.ceil(g.t)+'s',500,46);x.fillStyle='#a79bc8';x.font='700 12px system-ui';x.fillText('Rack '+(g.rack+1)+'/5 · ball '+(g.ball+1)+'/5',620,40);x.fillText('vs '+RIV[sv.pl%4][0]+' '+RIV[sv.pl%4][1],620,54);
 // meter
 const mx=350,my=510,mw=300;x.fillStyle='rgba(8,5,26,.85)';x.beginPath();x.roundRect(mx-6,my-8,mw+12,28,8);x.fill();const win=[.16,.11,.07][sv.diff];x.fillStyle='#2a2a50';x.fillRect(mx,my,mw,12);x.fillStyle='#4be07a';x.fillRect(mx+(.78-win)*mw,my,win*2*mw,12);x.fillStyle='#fff';x.fillRect(mx+g.pw*mw-2,my-5,4,22);
 if(g.t>57&&!g.hold){x.fillStyle='#fff';x.font='600 12px system-ui';x.fillText('Hold, then release in the green',500,550)}
 if(g.tt-g.msgT<1&&g.msg){x.font='900 44px system-ui';x.lineWidth=7;x.strokeStyle='rgba(0,0,0,.7)';x.strokeText(g.msg,500,280);x.fillStyle=g.msg==='MISS'?'#ff6b5a':'#ffd23f';x.fillText(g.msg,500,280)}}
function loop(){let last=performance.now();const f=now=>{const dt=Math.min(.03,(now-last)/1000||0);last=now;if(G){step(dt);draw()}if(V==='game')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
render();
