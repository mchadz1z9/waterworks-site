function stone(x,s){x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(s.x+3,s.y+4,15,13,0,0,7);x.fill();x.fillStyle='#8a8f98';x.beginPath();x.arc(s.x,s.y,15,0,7);x.fill();x.fillStyle=s.team===0?'#2f7fd0':'#d03a3a';x.beginPath();x.arc(s.x,s.y,10,0,7);x.fill();x.fillStyle='#ddd';x.fillRect(s.x-4,s.y-2,8,4)}
function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d'),g=G;
 x.fillStyle='#0e1a2c';x.fillRect(0,0,1000,600);x.fillStyle='#e8f2fa';x.fillRect(250,20,500,570);const ig=x.createLinearGradient(0,0,0,600);ig.addColorStop(0,'rgba(180,215,240,.5)');ig.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=ig;x.fillRect(250,20,500,570);
 [[HR,'#2f7fd0'],[HR*.66,'#fff'],[HR*.33,'#d03a3a'],[HR*.1,'#fff']].forEach(c=>{x.fillStyle=c[1];x.beginPath();x.arc(SX,HY,c[0],0,7);x.fill()});
 x.strokeStyle='#d03a3a';x.lineWidth=3;x.beginPath();x.moveTo(250,HOG);x.lineTo(750,HOG);x.stroke();x.strokeStyle='rgba(100,130,160,.6)';x.lineWidth=1.5;x.beginPath();x.moveTo(SX,20);x.lineTo(SX,590);x.moveTo(250,HY);x.lineTo(750,HY);x.stroke();
 x.fillStyle='#333';x.fillRect(250,20,6,570);x.fillRect(744,20,6,570);
 g.stones.forEach(s=>stone(x,s));if(g.cur)stone(x,g.cur);
 if(g.ph==='aim'&&g.turn===0){const px=SX,py=SY;stone(x,{x:px,y:py,team:0});x.strokeStyle='rgba(255,255,255,.8)';x.setLineDash([8,8]);x.lineWidth=2;x.beginPath();x.moveTo(px,py);x.lineTo(px+g.aim*70*3.2,HY+40);x.stroke();x.setLineDash([]);x.fillStyle='rgba(8,5,26,.85)';x.beginPath();x.roundRect(800,540,160,22,8);x.fill();x.fillStyle=g.pw>.8?'#ff6b5a':'#4be07a';x.fillRect(804,545,152*g.pw,12)}
 if(g.ph==='slide'&&g.sweep&&g.cur.team===0){x.strokeStyle='#ffd23f';x.lineWidth=3;for(let i=0;i<4;i++){x.beginPath();x.moveTo(g.cur.x-18+i*10,g.cur.y-26);x.lineTo(g.cur.x-12+i*10,g.cur.y-38);x.stroke()}}
 x.fillStyle='rgba(8,5,26,.85)';x.beginPath();x.roundRect(10,10,230,120,12);x.fill();x.textAlign='left';x.fillStyle='#fff';x.font='800 15px system-ui';x.fillText('END '+g.end+'/4',24,34);x.fillStyle='#2f7fd0';x.fillText('YOU  '+g.sc[0]+'   ('+(4-g.thrown[0])+' left)',24,62);x.fillStyle='#d03a3a';x.fillText(RV[sv.rv][0]+'  '+g.sc[1]+'   ('+(4-g.thrown[1])+' left)',24,88);x.fillStyle='#a79bc8';x.font='600 12px system-ui';x.fillText(g.ph==='aim'?(g.turn===0?'Your throw':'Opponent throwing'):g.ph==='slide'?'Hold Space to sweep':'',24,114)}
function loop(){let last=performance.now();const f=now=>{const dt=Math.min(.03,(now-last)/1000||0);last=now;if(G){step(dt);draw()}if(V==='game')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
render();
