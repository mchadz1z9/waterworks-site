<title>Rival Ski</title>

.btn{border:0;border-radius:12px;padding:13px 18px;font:900 16px system-ui;background:var(--acc);color:#0b1020;width:100%;margin-top:10px}.btn.g{background:#1c2a44;color:var(--tx)}
.note{color:var(--mut);font-size:14px;line-height:1.5}

<script type="module">
import * as THREE from './lib/three.module.min.js';
const $=id=>document.getElementById(id), V3=THREE.Vector3;
const LS={get(k,d){ try{ return JSON.parse(localStorage.getItem(k))??d; }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
const myName=()=>{ try{ return localStorage.getItem('rrOnlineName')||'You'; }catch(e){ return 'You'; } };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
/* ================= renderer, sky, light ================= */
const canvas=$('gl'); let R; let GFX=LS.get('rrSkiGfx','high');
try{ R=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }catch(e){ $('mbox').innerHTML='<h1>⛷️ Rival Ski</h1><p class="note">This computer can\'t run 3D graphics (WebGL is turned off). Try Chrome or Edge.</p>'; throw e; }
R.setPixelRatio(GFX==='low'?.75:Math.min(devicePixelRatio||1,1.5)); R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05; R.outputColorSpace=THREE.SRGBColorSpace; R.shadowMap.enabled=GFX!=='low'; R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); const HORIZON=new THREE.Color(0xd6e6f5); scene.fog=new THREE.Fog(HORIZON,140,1100);
const cam=new THREE.PerspectiveCamera(66,1,.1,4000);
const fit=()=>{ R.setSize(innerWidth,innerHeight,false); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); }; fit(); addEventListener('resize',fit);
const SUNDIR=new V3(.45,.62,.35).normalize();
const sky=new THREE.Mesh(new THREE.SphereGeometry(3000,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{sun:{value:SUNDIR}},
  vertexShader:'varying vec3 vp; void main(){ vp=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader:'uniform vec3 sun; varying vec3 vp; void main(){ float h=clamp(vp.y,0.,1.); vec3 top=vec3(.16,.42,.82), hor=vec3(.84,.90,.96); vec3 c=mix(hor,top,pow(h,.55)); float s=max(dot(vp,sun),0.); c+=vec3(1.,.93,.75)*(pow(s,600.)*3.+pow(s,12.)*.25); if(vp.y<0.) c=hor; gl_FragColor=vec4(c,1.); }'}));

/* textures drawn in code */
const ctex=(w,h,draw,rep,srgb=true)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; if(rep) t.repeat.set(rep,rep); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=R.capabilities.getMaxAnisotropy(); return t; };
/* groomed corduroy snow: a height map turned into a normal map */
const snowNormal=(()=>{ const N=512, h=new Float32Array(N*N); for(let y=0;y<N;y++) for(let x=0;x<N;x++){ h[y*N+x]=Math.sin(x/N*Math.PI*2*40)*.6+Math.sin(x/N*Math.PI*2*40+1.3)*.0; } for(let k=0;k<26000;k++){ const x=Math.random()*N|0, y=Math.random()*N|0; h[y*N+x]+=Math.random()*1.4-.7; }
  return ctex(N,N,(g)=>{ const im=g.createImageData(N,N); for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const l=h[y*N+(x+N-1)%N], r=h[y*N+(x+1)%N], u=h[((y+N-1)%N)*N+x], d=h[((y+1)%N)*N+x]; let nx=(l-r)*.9, ny=(u-d)*.9, nz=1; const m=Math.hypot(nx,ny,nz); const i=(y*N+x)*4; im.data[i]=(nx/m*.5+.5)*255; im.data[i+1]=(ny/m*.5+.5)*255; im.data[i+2]=(nz/m*.5+.5)*255; im.data[i+3]=255; } g.putImageData(im,0,0); },0,false); })();
const snowColor=ctex(256,256,(g,w,h)=>{ g.fillStyle='#f6f9fd'; g.fillRect(0,0,w,h); for(let i=0;i<5000;i++){ g.fillStyle=['#eaf0f8','#ffffff','#e3ebf5','#f0f4fa'][i%4]; g.globalAlpha=.6; g.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*4,2+Math.random()*4); } g.globalAlpha=1; });
const snowMat=new THREE.MeshStandardMaterial({map:snowColor,normalMap:snowNormal,normalScale:new THREE.Vector2(.55,.55),roughness:.78,metalness:0,color:0xffffff});
const softDot=ctex(64,64,(g)=>{ const gr=g.createRadialGradient(32,32,1,32,32,31); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.5,'rgba(255,255,255,.5)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); });
/* far mountains and clouds (follow the camera, always in the background) */
const peaks=(()=>{ const g=new THREE.BufferGeometry(), pos=[], col=[], S=160, r=rngF(99); const top=[], bot=[]; for(let i=0;i<=S;i++){ const a=i/S*Math.PI*2; const hgt=180+r()*260+Math.sin(a*3)*90+Math.sin(a*7+1)*60; top.push([Math.cos(a)*2200,hgt,Math.sin(a)*2200]); bot.push([Math.cos(a)*2200,-400,Math.sin(a)*2200]); }
  const rock=new THREE.Color(0x7d8ea3), snow=new THREE.Color(0xf4f8fc), base=new THREE.Color(0x9fb3c8);
  for(let i=0;i<S;i++){ const q=[bot[i],top[i],bot[i+1],top[i],top[i+1],bot[i+1]]; for(const p of q){ pos.push(...p); const c=p[1]>150?snow:p[1]>40?rock:base; col.push(c.r,c.g,c.b); } }
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.computeVertexNormals();
  return new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,fog:false,side:THREE.DoubleSide,transparent:true,opacity:.85})); })();
scene.add(peaks);
const clouds=new THREE.Group(); { const cm=new THREE.SpriteMaterial({map:softDot,fog:false,transparent:true,opacity:.75,depthWrite:false}); const r=rngF(5); for(let i=0;i<26;i++){ const s=new THREE.Sprite(cm); const a=r()*6.28, d=1200+r()*600; s.position.set(Math.cos(a)*d,380+r()*220,Math.sin(a)*d); s.scale.set(400+r()*400,90+r()*60,1); clouds.add(s); } } scene.add(clouds);
function rngF(s){ return ()=>{ s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5>>>0; let t=Math.imul(s^s>>>7,61|s)^s; return ((t^t>>>14)>>>0)/4294967296; }; }
/* ================= parks ================= */
const PARKS={
  slope:{name:'Pine Ridge Slopestyle',ico:'🌲',desc:'Rails, boxes, a kink, then four big jumps',len:800,halfW:26,
    slope:d=>.24+.06*sstep(0,30,d)-.05*sstep(260,300,d)+.03*Math.sin(d*.02),
    feats:[{t:'table',x:-14,z:-262,w:8,kH:1.4,gap:4},{t:'table',x:0,z:-300,w:12,kH:2.6,gap:18},{t:'table',x:0,z:-390,w:13,kH:2.8,gap:16},{t:'table',x:0,z:-490,w:14,kH:3.3,gap:15},{t:'table',x:0,z:-600,w:15,kH:3.8,gap:18},{t:'table',x:-17,z:-610,w:7,kH:1.6,gap:5}],
    rails:[{k:'box',p:[[-9,-70,.45],[-9,-88,.45]]},{k:'rail',p:[[9,-100,1.1],[9,-120,.55]]},{k:'rail',p:[[0,-150,.6],[0,-158,.85],[0,-176,.35]]},{k:'rail',p:[[-11,-205,.6],[-11,-235,.6]]},{k:'box',p:[[11,-210,.45],[11,-232,.45]]}]},
  air:{name:'Big Air',ico:'🚀',desc:'One huge jump. Best two of three tricks',len:250,halfW:22,bigair:true,
    slope:d=>.58-.36*sstep(48,66,d)+.08*sstep(140,170,d),
    feats:[{t:'table',x:0,z:-70,w:14,kH:4.6,gap:22}],rails:[]},
  pipe:{name:'Superpipe',ico:'🎿',desc:'A 6 m halfpipe. Go wall to wall',len:480,halfW:30,pipe:{flat:6,R:8.4},
    slope:d=>.29,feats:[],rails:[]}
};
let PK=null, PROF=null;
const slopeAt=d=>PK.slope(Math.max(0,d));
function buildProfile(){ PROF=new Float32Array(Math.ceil((PK.len+400)/.5)); let y=0; for(let i=0;i<PROF.length;i++){ PROF[i]=y; y-=slopeAt(i*.5)*.5; } }
const prof=d=>{ if(d<=0) return -d*slopeAt(0); const i=d/.5, a=Math.min(PROF.length-2,i|0), t=i-a; return PROF[a]+(PROF[a+1]-PROF[a])*t; };
function pipeY(x){ const p=PK.pipe, d=Math.abs(x)-p.flat; if(d<=0) return 0; const dm=p.R*.97; if(d<dm) return p.R-Math.sqrt(p.R*p.R-d*d); const lipY=p.R-Math.sqrt(p.R*p.R-dm*dm), e=d-dm; return e<6?lipY:lipY-(e-6)*.35; }
const lipX=()=>PK.pipe.flat+PK.pipe.R*.97;
function base(x,z){ const d=-z; let y=prof(d)+Math.sin(z*.07+x*.05)*.12+Math.sin(z*.023-x*.03)*.25;
  if(PK.pipe) y+=pipeY(x); else { const e=Math.abs(x)-PK.halfW; if(e>0) y+=e*e*.012+e*.08; }
  return y; }
function prepFeat(f){ const d0=-f.z, s0=slopeAt(d0); f.kLen=3*f.kH/(Math.tan(29*Math.PI/180)+s0); f.ds=s0-.06; f.h1=f.kH-.4+f.ds*f.gap; f.L=f.h1*Math.PI/(2*Math.max(.15,.64-s0)); f.end=f.kLen+f.gap+f.L; }
function featH(x,z){ let h=0; for(const f of PK.feats){ const d=f.z-z; if(d<0||d>f.end) continue; const ax=Math.abs(x-f.x);
    if(d<f.kLen){ const m=1-sstep(f.w/2,f.w/2+1.4,ax); if(m>0) h=Math.max(h,m*f.kH*Math.pow(d/f.kLen,3)); }
    else { const m=1-sstep(f.w/2+2,f.w/2+5,ax); if(m<=0) continue; let v; if(d<f.kLen+f.gap) v=f.kH-.4+f.ds*(d-f.kLen); else { const t=(d-f.kLen-f.gap)/f.L; v=f.h1*(.5+.5*Math.cos(Math.PI*t)); } h=Math.max(h,m*v); } }
  return h; }
const H=(x,z)=>base(x,z)+featH(x,z);
function normalAt(x,z,out){ const e=.02, hx=(H(x+e,z)-H(x-e,z))/(2*e), hz=(H(x,z+e)-H(x,z-e))/(2*e); return (out||new V3()).set(-hx,1,-hz).normalize(); }
/* rails: polylines on top of the snow */
function prepRail(rl){ rl.P=rl.p.map(([x,z,h])=>new V3(x,H(x,z)+h,z)); rl.seg=[]; let s=0; for(let i=0;i<rl.P.length-1;i++){ const a=rl.P[i], b=rl.P[i+1], L=a.distanceTo(b); rl.seg.push({a,b,L,s,d:b.clone().sub(a).normalize()}); s+=L; } rl.len=s; rl.kink=rl.P.length>2; }
function railAt(rl,s){ for(const g of rl.seg){ if(s<=g.s+g.L||g===rl.seg[rl.seg.length-1]) return {p:g.a.clone().addScaledVector(g.d,clamp(s-g.s,0,g.L)),d:g.d}; } }
function railNear(rl,p){ let best=null; for(const g of rl.seg){ const ap=p.clone().sub(g.a); const t=clamp(ap.dot(g.d),0,g.L); const q=g.a.clone().addScaledVector(g.d,t); const dh=Math.hypot(q.x-p.x,q.z-p.z); if(!best||dh<best.dh) best={dh,dy:p.y-q.y,s:g.s+t,d:g.d,inner:t>0&&t<g.L||(g!==rl.seg[0]&&t===0)}; } return best; }
/* ================= world building ================= */
const world=new THREE.Group(); scene.add(world);
const MAT={lip:new THREE.MeshStandardMaterial({color:0xf97316,roughness:.6}),dye:new THREE.MeshBasicMaterial({color:0x2563eb,transparent:true,opacity:.55,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}),
  rail:new THREE.MeshStandardMaterial({color:0xd5dae2,metalness:.95,roughness:.22}),leg:new THREE.MeshStandardMaterial({color:0x334155,metalness:.5,roughness:.5}),boxTop:new THREE.MeshStandardMaterial({color:0x111827,metalness:.3,roughness:.35}),boxSide:new THREE.MeshStandardMaterial({color:0xf97316,roughness:.5}),
  trunk:new THREE.MeshStandardMaterial({color:0x4a3424,roughness:1}),pine:new THREE.MeshStandardMaterial({color:0x1c4a2f,roughness:.92,flatShading:true}),cap:new THREE.MeshStandardMaterial({color:0xf8fbff,roughness:.85,flatShading:true}),
  net:new THREE.MeshStandardMaterial({map:ctex(128,64,(g,w,h)=>{ g.clearRect(0,0,w,h); g.strokeStyle='rgba(255,110,20,.95)'; g.lineWidth=3; for(let x=0;x<=w;x+=16){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); } for(let y=0;y<=h;y+=16){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); } }),transparent:true,side:THREE.DoubleSide,alphaTest:.3,roughness:.8}),
  metal:new THREE.MeshStandardMaterial({color:0x8b95a5,metalness:.7,roughness:.4})};
let TREES=[], chairs=null, CHAIR={};
function limbBetween(m,a,b){ const d=b.clone().sub(a), L=d.length(); m.position.copy(a).addScaledVector(d,.5); m.quaternion.setFromUnitVectors(new V3(0,1,0),d.normalize()); m.scale.set(1,Math.max(.001,L),1); }
function buildWorld(){ while(world.children.length){ const o=world.children.pop(); o.traverse(c=>{ if(c.geometry) c.geometry.dispose(); }); }
  buildProfile(); PK.feats.forEach(prepFeat); PK.rails.forEach(prepRail); TREES=[];
  /* ground: dense in the park, sparse outside */
  const xs=[], zs=[], inner=PK.pipe?(GFX==='low'?.5:.25):(GFX==='low'?1.6:.8), IW=PK.pipe?22:PK.halfW+12; for(let x=-260;x<-IW;x+=6) xs.push(x); for(let x=-IW;x<=IW+1e-6;x+=inner) xs.push(+x.toFixed(3)); for(let x=IW+6;x<=260;x+=6) xs.push(x);
  const zMin=-PK.len-160, zMax=80; for(let z=zMin;z<=zMax;z+=GFX==='low'?1.6:PK.pipe?.9:.8) zs.push(z);
  const nx=xs.length, nz=zs.length, pos=new Float32Array(nx*nz*3), uv=new Float32Array(nx*nz*2); let k=0;
  for(let j=0;j<nz;j++) for(let i=0;i<nx;i++){ const x=xs[i], z=zs[j]; pos[k*3]=x; pos[k*3+1]=H(x,z); pos[k*3+2]=z; uv[k*2]=x/4; uv[k*2+1]=z/4; k++; }
  const idx=new Uint32Array((nx-1)*(nz-1)*6); let q=0; for(let j=0;j<nz-1;j++) for(let i=0;i<nx-1;i++){ const a=j*nx+i,b=a+1,c=a+nx,d=c+1; idx[q++]=a; idx[q++]=c; idx[q++]=b; idx[q++]=b; idx[q++]=c; idx[q++]=d; }
  const gg=new THREE.BufferGeometry(); gg.setAttribute('position',new THREE.BufferAttribute(pos,3)); gg.setAttribute('uv',new THREE.BufferAttribute(uv,2)); gg.setIndex(new THREE.BufferAttribute(idx,1)); gg.computeVertexNormals();

  for(const f of PK.feats){ const lz=f.z-f.kLen; const lip=new THREE.Mesh(new THREE.BoxGeometry(f.w,.08,.25),MAT.lip); lip.position.set(f.x,H(f.x,lz+.05)+.04,lz+.1); world.add(lip);
    const dye=(z,w)=>{ const g=new THREE.PlaneGeometry(w,.35,24,1); g.rotateX(-Math.PI/2); const p=g.attributes.position; for(let i=0;i<p.count;i++){ const x=f.x+p.getX(i), zz=z+p.getZ(i); p.setXYZ(i,x,H(x,zz)+.03,zz); } const m=new THREE.Mesh(g,MAT.dye); world.add(m); };
    dye(lz+.7,f.w-.4); dye(f.z-f.kLen-f.gap-1.2,f.w+3); dye(f.z-f.kLen-f.gap-f.L*.5,f.w+3);

addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
document.querySelectorAll('#tb button').forEach(b=>{ const k=b.dataset.k; b.addEventListener('pointerdown',e=>{ e.preventDefault(); keys[k]=true; }); const up=()=>{ keys[k]=false; }; b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up); });
function menu(){ $('menu').style.display='flex'; S.started=false; $('board').style.display='none';
  $('mbox').innerHTML=`<h1>⛷️ Rival Ski</h1><p class="note">Pick a park, drop in, and stomp your tricks. Clean landings, big spins, inverts, grabs and rails score points. Land with your skis lined up with where you're going, or you'll wipe out.</p>
  <div class="parks">${Object.entries(PARKS).map(([k,p])=>`<button data-p="${k}" class="${k===park?'on':''}">${p.ico} ${p.name}<small>${p.desc}</small><small>${best[k]?'Best: '+best[k].toLocaleString():''}</small></button>`).join('')}</div>
  <button class="btn" id="solo">⛷️ Ride solo</button><button class="btn g" id="coop">🤝 Ride with friends online</button><button class="btn g" id="gfx" style="padding:9px;font-size:13px">Graphics: ${GFX==='low'?'Low (faster)':'High (shadows, thick forest)'}</button>
  <details><summary>🎮 Controls & tricks</summary><div class="keys"><b>A / D</b><span>carve left / right · in the air: spin · on a rail: balance</span><b>W</b><span>tuck for speed · in the air: front flip (Misty when you spin too)</span><b>S</b><span>skid to slow down · in the air: back flip (Cork / Rodeo when you spin too)</span><b>Space</b><span>hold to load, let go to pop (ollie). Pop onto rails and boxes. Pop at the lip to go higher</span>
  <b>Hold J / Shift</b><span>Mute grab · K Safety · L Japan · I Tail · U Nose · O Truck Driver</span><b>Q / E + A / D</b><span>nose / tail butter (spin on the snow)</span><b>C</b><span>change camera</span><b>R</b><span>restart the run</span></div>
  <p class="note">Tips: start a spin before you leave the lip. Holding a grab longer scores more. Repeating the same trick scores less. Land switch (backwards) for a switch takeoff next time.</p></details>`;
  $('mbox').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ park=b.dataset.p; LS.set('rrSkiPark',park); menu(); });
  $('solo').onclick=()=>{ mode='solo'; $('menu').style.display='none'; audio(); start(); };
  $('coop').onclick=()=>{ audio(); if(NET&&NET.open) NET.open(); };
  $('gfx').onclick=()=>{ LS.set('rrSkiGfx',GFX==='low'?'high':'low'); location.reload(); }; }
(function netInit(){ if(!window.RRO) return setTimeout(netInit,400);
  NET=RRO.init({game:'ski',maxPlayers:8,minPlayers:2,blurb:'Ride the same park with friends. Highest score wins!',
    onStart:()=>{ mode='online'; $('menu').style.display='none'; audio(); start(); },
    onMsg:m=>{ if(m.t==='p'&&NET.me&&m.k!==NET.me.seat&&Array.isArray(m.q)){ const o=others[m.k]||(others[m.k]={}); Object.assign(o,{x:m.x,y:m.y,z:m.z,q:m.q,c:m.c,g:m.g,sc:m.sc,d:m.d,park:m.park,name:m.name,seen:performance.now()}); } } }); })();
/* menu backdrop: the chosen park */
PK=PARKS[park]; buildWorld(); S.pos.set(0,H(0,-6),-6); groundQ(normalAt(0,-6),0,0); camPos.set(4,S.pos.y+3,0); menu();
window.__S={S,keys,step,H,PARKS,start,newRun,setPark:p=>{ park=p; },featH,lipX,camPos,camLook,renderNow:()=>{ render(.016,performance.now()); hud(); }};
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
