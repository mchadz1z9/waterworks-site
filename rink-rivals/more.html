<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arcade Rivals - More Games</title>
<style>
html,body{margin:0;min-height:100%;background:#04060e;color:#fff;font-family:system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:56px 14px 30px}
h1{margin:0;font:900 38px/1 system-ui;letter-spacing:.01em}.sub{color:#94a3b8;margin:6px 0 14px}
#q{width:100%;max-width:420px;padding:10px 14px;border-radius:12px;border:1px solid #334155;background:#0b1122;color:#fff;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}.chip{border:1px solid #334155;background:#0b1122;color:#fff;border-radius:999px;padding:7px 13px;font:700 13px system-ui;cursor:pointer}.chip.on{background:linear-gradient(90deg,#f59e0b,#ef4444);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.g{position:relative;display:block;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#111827;border:1px solid #1f2937;text-decoration:none;color:#fff;transition:transform .12s}
.g:hover{transform:translateY(-3px);border-color:#38bdf8}.g img{width:100%;height:100%;object-fit:cover;display:block}
.g b{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{position:fixed;left:10px;top:10px;z-index:9;background:rgba(15,23,42,.88);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 13px;font:700 13px system-ui;text-decoration:none}
.note{color:#64748b;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<a id="back" href="./">← Arcade</a>
<div class="wrap"><h1>🌐 More Games</h1><div class="sub" id="sub"></div><input id="q" placeholder="Search games…"><div class="chips" id="chips"></div><div class="grid" id="grid"></div>
<div class="note">These games come from the GameDistribution and GameMonetize networks, which share their games with websites. The networks show ads inside their games.</div></div>
<script src="net-games.js"></script>
<script>
(function(){ const G=window.NETGAMES||[], $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const CATS=[['all','🕹️ All'],['Racing','🏁 Racing'],['Shooters','🎯 Shooters'],['Sports','🏟️ Sports'],['Action','⚔️ Action'],['Multiplayer','🌐 Multiplayer'],['Puzzle','🧩 Puzzle'],['Casual','🎈 Casual']];
  let cat=new URLSearchParams(location.search).get('c')||'all';
  $('#sub').textContent=G.length+' extra games: racing, shooters, sports, multiplayer and more.';
  function draw(){ const q=$('#q').value.trim().toLowerCase(); $('#chips').innerHTML=CATS.map(([k,t])=>`<button class="chip${k===cat?' on':''}" data-c="${k}">${t}</button>`).join('');
    const L=G.filter(g=>(cat==='all'||g[3]===cat)&&(!q||(g[2]+' '+g[6]).toLowerCase().includes(q)));
    $('#grid').innerHTML=L.map(g=>`<a class="g" href="play?n=${g[0]}&id=${encodeURIComponent(g[1])}" title="${esc(g[6])}"><img loading="lazy" src="${esc(g[5])}" alt=""><b>${esc(g[2])}</b></a>`).join('')||'<div class="sub">No games match.</div>'; }
  $('#chips').onclick=e=>{ const b=e.target.closest('.chip'); if(b){ cat=b.dataset.c; draw(); } }; $('#q').oninput=draw; draw();
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
