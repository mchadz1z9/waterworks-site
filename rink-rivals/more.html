<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arcade Rivals - Games</title>
<style>
:root{--bg:#04060e;--card:#111827;--line:#1f2937;--mut:#94a3b8;--acc:linear-gradient(90deg,#f59e0b,#ef4444)}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:system-ui,sans-serif}
body{background:radial-gradient(1200px 500px at 20% -10%,rgba(124,58,237,.25),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(14,165,233,.18),transparent 60%),var(--bg)}
.wrap{max-width:1400px;margin:0 auto;padding:58px 16px 40px}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:6px}
h1{margin:0;font:900 36px/1 system-ui;letter-spacing:.01em}
#cnt{color:var(--mut);font-weight:600}
#q{flex:1;min-width:200px;max-width:460px;margin-left:auto;padding:11px 15px;border-radius:999px;border:1px solid #334155;background:#0b1122;color:#fff;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #334155;background:#0b1122;color:#fff;border-radius:999px;padding:8px 14px;font:700 13px system-ui;cursor:pointer}.chip.on{background:var(--acc);border-color:transparent}
.g{position:relative;display:block;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-decoration:none;color:#fff;transition:transform .12s,border-color .12s}
.g:hover{transform:translateY(-3px);border-color:#38bdf8}.g img{width:100%;height:100%;object-fit:cover;display:block}
.g b{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.88));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g i{position:absolute;top:6px;left:6px;font:800 10px system-ui;font-style:normal;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 6px}
.o{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c)}.o span{font-size:46px}.o b{background:none;position:static;padding:4px 8px;font-size:15px}
#hero{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;margin-bottom:22px}
#hero .g{aspect-ratio:auto;min-height:150px}#hero .g:first-child{grid-row:span 2;min-height:312px}#hero .g:first-child b{font-size:20px;padding:30px 14px 12px}
.row{margin:0 0 22px}.row h2{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font:800 20px system-ui}.row h2 small{color:var(--mut);font-weight:500;font-size:13px}
.row h2 button{margin-left:auto;background:none;border:1px solid #334155;color:#e2e8f0;border-radius:999px;padding:5px 12px;font:700 12px system-ui;cursor:pointer}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.strip .g:first-child{grid-column:span 2;aspect-ratio:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
#sent{height:40px}
#back{position:fixed;left:10px;top:10px;z-index:9;background:rgba(15,23,42,.9);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 13px;font:700 13px system-ui;text-decoration:none}
.note{color:#64748b;font-size:12px;margin-top:24px}.sub{color:var(--mut)}
@media(max-width:700px){h1{font-size:28px}#hero{grid-template-columns:1fr 1fr}#hero .g:first-child{grid-column:span 2;grid-row:auto;min-height:190px}#hero .g:nth-child(n+4){display:none}.strip{grid-auto-columns:140px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
</style>
</head>
<body>
<a id="back" href="./">← Arcade</a>
<div class="wrap">
  <div id="top"><h1>🎮 Games</h1><span id="cnt"></span><input id="q" placeholder="Search games…" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <div id="main"></div>
  <div class="note">Arcade Rivals originals are made by us. The other games come from the GameMonetize network, which shares its games with websites and shows ads inside them.</div>
</div>
<script src="net-games.js"></script>
<script>
(function(){
  const G=window.NETGAMES||[], $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ICON={Racing:'🏁',Shooters:'🎯',Sports:'🏟️',Action:'⚔️',Adventure:'🗺️',Multiplayer:'🌐',Puzzle:'🧩',Arcade:'👾',Casual:'🎈'};
  const SECS=(window.NETSECS||Object.keys(ICON)).filter(s=>G.some(g=>g[3]===s));
  /* our own games, shown first */
  const OURS=[['city','Rival City','🏙️','#1e293b,#f59e0b'],['br','Storm Royale','🌪️','#312e81,#db2777'],['blockverse','Blockverse','🧱','#3f9f46,#6e4e2c'],['skystunt','Sky Stunt','🚗','#0ea5e9,#f97316'],['football','Football','🏈','#14532d,#a16207'],['hockey','Hockey','🏒','#0c4a6e,#e2e8f0'],['packs','Pack Rip','🃏','#f59e0b,#be123c'],['elements','Element Lab','⚗️','#7c3aed,#0f172a'],['basketball','Basketball','🏀','#9a3412,#1e293b'],['f1','F1 Racing','🏎️','#991b1b,#111827'],['deepdive','Deep Dive','🤿','#0369a1,#0f172a'],['sports-arcade','Sports Arcade','🏆','#065f46,#1d4ed8']];
  const tile=g=>`<a class="g" href="play?n=${g[0]}&id=${encodeURIComponent(g[1])}" title="${esc(g[6])}"><img loading="lazy" decoding="async" src="${esc(g[5])}" alt=""><b>${esc(g[2])}</b></a>`;
  const ours=o=>`<a class="g o" href="${o[0]}" style="--c:linear-gradient(135deg,${o[3]})"><i>ORIGINAL</i><span>${o[2]}</span><b>${esc(o[1])}</b></a>`;
  const recent=()=>{ try{ return JSON.parse(localStorage.getItem('rrNetRecent')||'[]'); }catch(e){ return []; } };
  const byKey=new Map(G.map(g=>[g[0]+':'+g[1],g]));
  /* a fixed daily shuffle, so the featured games change each day but not on every reload */
  const day=Math.floor(Date.now()/864e5); const rnd=(i)=>{ let x=Math.sin((i+1)*9301+day*49297)*233280; return x-Math.floor(x); };
  const daily=L=>L.map((g,i)=>[rnd(i),g]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  $('#cnt').textContent=(G.length+OURS.length).toLocaleString()+' games';
  const qs=new URLSearchParams(location.search); let cat=qs.get('c')||'all', obs=null;
  function chips(){ $('#chips').innerHTML=[['all','🔥 Home']].concat([['ours','⭐ Originals']],SECS.map(s=>[s,ICON[s]+' '+s])).map(([k,t])=>`<button class="chip${k===cat?' on':''}" data-c="${k}">${t}</button>`).join(''); }
  function row(title,sub,list,more){ return `<section class="row"><h2>${title}${sub?` <small>${sub}</small>`:''}${more?`<button data-c="${more}">See all</button>`:''}</h2><div class="strip">${list.join('')}</div></section>`; }
  /* long lists are drawn 96 tiles at a time as you scroll, so the page stays fast */
  function grid(L,html){ const M=$('#main'); M.innerHTML=(html||'')+'<div class="grid" id="grid"></div><div id="sent"></div>'; let i=0; const gr=$('#grid');
    const more=()=>{ gr.insertAdjacentHTML('beforeend',L.slice(i,i+96).join('')); i+=96; if(i>=L.length&&obs){ obs.disconnect(); obs=null; } };
    if(obs) obs.disconnect(); obs=null; more(); if(!L.length) gr.innerHTML='<div class="sub">No games match.</div>';
    if(i<L.length){ if('IntersectionObserver' in window){ obs=new IntersectionObserver(e=>{ if(e[0].isIntersecting) more(); },{rootMargin:'900px'}); obs.observe($('#sent')); } else { while(i<L.length) more(); } } }
  function draw(){ chips(); const q=$('#q').value.trim().toLowerCase(); if(obs){ obs.disconnect(); obs=null; }
    if(q){ const O=OURS.filter(o=>o[1].toLowerCase().includes(q)).map(ours); const L=G.filter(g=>(g[2]+' '+g[3]+' '+g[6]).toLowerCase().includes(q)).map(tile); grid(O.concat(L),`<div class="sub" style="margin-bottom:10px">${O.length+L.length} results</div>`); return; }
    if(cat==='ours'){ grid(OURS.map(ours)); return; }
    if(cat!=='all'){ grid(G.filter(g=>g[3]===cat).map(tile)); return; }
    const F=daily(G.slice(0,400)).slice(0,5), R=recent().map(k=>byKey.get(k)).filter(Boolean).slice(0,16);
    let h=`<div id="hero">${F.map(tile).join('')}</div>`;
    h+=row('⭐ Arcade Rivals originals','made by us',OURS.map(ours),'ours');
    if(R.length) h+=row('🕘 Played recently','',R.map(tile));
    h+=row('🆕 New games','just added',G.slice().sort((a,b)=>b[1]-a[1]).slice(0,20).map(tile));
    for(const s of SECS){ const L=G.filter(g=>g[3]===s); h+=row(ICON[s]+' '+s,L.length+' games',daily(L.slice(0,120)).slice(0,20).map(tile),s); }
    $('#main').innerHTML=h; }
  document.addEventListener('click',e=>{ const b=e.target.closest('[data-c]'); if(!b) return; cat=b.dataset.c; $('#q').value=''; history.replaceState(null,'',cat==='all'?'more':'more?c='+encodeURIComponent(cat)); draw(); scrollTo(0,0); });
  let t; $('#q').oninput=()=>{ clearTimeout(t); t=setTimeout(draw,150); }; draw();
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
