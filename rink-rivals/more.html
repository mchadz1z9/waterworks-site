<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arcade Rivals - Games</title>
<style>
:root{--bg:#04060e;--card:#111827;--line:#1f2937;--mut:#94a3b8;--acc:linear-gradient(90deg,#f59e0b,#ef4444)}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:system-ui,sans-serif}
body{background:radial-gradient(1200px 500px at 20% -10%,rgba(124,58,237,.25),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(14,165,233,.18),transparent 60%),var(--bg)}
.wrap{max-width:1400px;margin:0 auto;padding:58px 16px 40px}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:6px}
h1{margin:0;font:900 36px/1 system-ui;letter-spacing:.01em}
#cnt{color:var(--mut);font-weight:600}
#q{flex:1;min-width:200px;max-width:460px;margin-left:auto;padding:11px 15px;border-radius:999px;border:1px solid #334155;background:#0b1122;color:#fff;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #334155;background:#0b1122;color:#fff;border-radius:999px;padding:8px 14px;font:700 13px system-ui;cursor:pointer}.chip.on{background:var(--acc);border-color:transparent}
.g{position:relative;display:block;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-decoration:none;color:#fff;transition:transform .12s,border-color .12s}
.g:hover{transform:translateY(-3px);border-color:#38bdf8}.g::before{content:'🎮';position:absolute;inset:0;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#1e1b4b,#0f766e);z-index:0}.g img{position:relative;z-index:1}.g.o::before{display:none}.g b,.g i{z-index:2}.g img{width:100%;height:100%;object-fit:cover;display:block}
.g b{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.88));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g i{position:absolute;top:6px;left:6px;font:800 10px system-ui;font-style:normal;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 6px}
.o{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c)}.o span{font-size:46px}.o b{background:none;position:static;padding:4px 8px;font-size:15px}
#hero{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;margin-bottom:22px}
#hero .g{aspect-ratio:auto;min-height:150px}#hero .g:first-child{grid-row:span 2;min-height:312px}#hero .g:first-child b{font-size:20px;padding:30px 14px 12px}
.row{margin:0 0 22px}.row h2{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font:800 20px system-ui}.row h2 small{color:var(--mut);font-weight:500;font-size:13px}
.row h2 button{margin-left:auto;background:none;border:1px solid #334155;color:#e2e8f0;border-radius:999px;padding:5px 12px;font:700 12px system-ui;cursor:pointer}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.strip .g:first-child{grid-column:span 2;aspect-ratio:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
#sent{height:40px}
#top{position:relative}#sg{display:none;position:absolute;right:0;top:52px;width:min(460px,100%);background:#0b1122;border:1px solid #334155;border-radius:14px;padding:6px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#sg a{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;color:#fff;text-decoration:none;font:600 14px system-ui}#sg a:hover{background:#1e293b}#sg img{width:56px;height:42px;object-fit:cover;border-radius:6px}
.g .rt{position:absolute;top:6px;right:6px;left:auto;font:800 11px system-ui;font-style:normal;background:rgba(0,0,0,.65);border-radius:6px;padding:2px 6px}
#back{position:fixed;left:10px;top:10px;z-index:9;background:rgba(15,23,42,.9);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 13px;font:700 13px system-ui;text-decoration:none}
.note{color:#64748b;font-size:12px;margin-top:24px}.sub{color:var(--mut)}
@media(max-width:700px){h1{font-size:28px}#hero{grid-template-columns:1fr 1fr}#hero .g:first-child{grid-column:span 2;grid-row:auto;min-height:190px}#hero .g:nth-child(n+4){display:none}.strip{grid-auto-columns:140px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
</style>
</head>
<body>
<a id="back" href="./">← Arcade</a>
<div class="wrap">

  <div class="note">Arcade Rivals originals are made by us. The other games come from the GameMonetize network, which shares its games with websites and shows ads inside them.</div>
</div>
<script src="net-games.js"></script><script src="net-direct.js"></script>

:'war fight royale',royale:'battle',tank:'tanks war',police:'cop cops chase',city:'town open world',open:'world sandbox',world:'open sandbox',math:'numbers learning',word:'words letters spelling',quiz:'trivia questions',draw:'drawing paint',color:'coloring paint',bubble:'shooter pop',merge:'2048 combine',girl:'girls',boy:'boys',minecraft:'craft block blocks blocky voxel mine mining sandbox',roblox:'obby blox parkour',bloxd:'block blocks craft blocky',fortnite:'battle royale build shooter',among:'impostor imposter crewmate',amongus:'impostor imposter crewmate',mario:'platformer jump adventure',sonic:'runner speed run',subway:'runner surfer run endless',surfers:'runner run endless',slither:'snake worm io',geometry:'dash jump',pokemon:'monster monsters catch',gta:'city car driving open world',krunker:'fps shooter io',smash:'fight brawl',zelda:'adventure sword quest',pacman:'maze arcade',tetris:'blocks block puzzle',flappy:'bird fly tap',temple:'runner run',angry:'birds slingshot',retro:'classic arcade pixel',bowl:'bowling',fnaf:'',freddy:'',granny:'',skibidi:'toilet'.replace('toilet','')};
  const lev=(a,b,max)=>{ if(Math.abs(a.length-b.length)>max) return max+1; let pp=null, p=Array.from({length:b.length+1},(_,i)=>i); for(let i=1;i<=a.length;i++){ const c=[i]; let lo=i; for(let j=1;j<=b.length;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) c[j]=Math.min(c[j],pp[j-2]+1); if(c[j]<lo) lo=c[j]; } if(lo>max) return max+1; pp=p; p=c; } return p[b.length]; };
  let IX=null, VOC=null; const index=()=>{ VOC=new Map(); IX=G.map((g,i)=>{ const t=norm(g[2]); const x={g,i,t,tw:t.split(' '),tg:norm((g[7]||'')+' '+g[3]).split(' ').filter(Boolean),tc:t.replace(/ /g,'')}; for(const w of x.tw.concat(x.tg)) if(w.length>2) VOC.set(w,(VOC.get(w)||0)+1); return x; }); };
  const fixWord=w=>{ if(w.length<4||VOC.has(w)||SYN[w]!==undefined) return w; const m=w.length>=7?2:1; let best=w, bd=m+1, bf=0; for(const [v,f] of [...Object.keys(SYN).filter(k=>k.length>3).map(k=>[k,1e6]),...VOC]){ if(Math.abs(v.length-w.length)>m) continue; const d=lev(w,v,m); if(d<bd||(d===bd&&f>bf)){ best=v; bd=d; bf=f; } } return bd<=m?best:w; };

  function chips(){ $('#chips').innerHTML=[['all','🔥 Home']].concat([['ours','⭐ Originals']],SECS.map(s=>[s,ICON[s]+' '+s]),COLS.map(c=>[c[0],c[1]])).map(([k,t])=>`<button class="chip${k===cat?' on':''}" data-c="${k}">${t}</button>`).join(''); }

  let t; $('#q').oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ const q=$('#q').value.trim(); history.replaceState(null,'',q?'more?q='+encodeURIComponent(q):(cat==='all'?'more':'more?c='+encodeURIComponent(cat))); draw(); },180); };
  const sg=document.createElement('div'); sg.id='sg'; $('#q').insertAdjacentElement('afterend',sg); let sgT;
  const sugg=()=>{ const q=$('#q').value.trim(); if(q.length<2||document.activeElement!==$('#q')){ sg.style.display='none'; return; } const r=search(q).L.slice(0,6);
    sg.innerHTML=r.map(g=>`<a href="${tile(g).match(/href="([^"]+)"/)[1].replace(/&amp;/g,'&')}"><img src="${esc(g[5])}" alt=""><span>${esc(g[2])}</span></a>`).join(''); sg.style.display=r.length?'block':'none'; };
  $('#q').addEventListener('input',()=>{ clearTimeout(sgT); sgT=setTimeout(sugg,120); }); $('#q').addEventListener('blur',()=>setTimeout(()=>sg.style.display='none',200)); $('#q').addEventListener('focus',sugg);
  $('#q').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const a=document.querySelector('#grid a'); if(a) location.href=a.href; } };
  draw();
  fetch(SRV+'/netnew').then(r=>r.json()).then(d=>{ if(!d||!d.games) return; NEW=d.games.map(r=>['gm',r[0],r[2],d.secs[r[3]]||'Casual','https://html5.gamemonetize.co/'+r[1]+'/','https://img.gamemonetize.com/'+r[1]+'/512x384.jpg',r[4],r[4]]); addNew(); if(!$('#q').value.trim()&&cat==='all') draw(); }).catch(()=>{});
  fetch(SRV+'/net/stats').then(r=>r.json()).then(d=>{ if(!d) return; ST=d; HIDE=new Set(d.hide||[]); if(!$('#q').value.trim()) draw(); }).catch(()=>{});
  /* the full catalog loads after the page is up, then search and categories cover every game */
  /* the full catalogs load after the page is up (GameMonetize, then GameDistribution and GamePix), then search and categories cover every game */
  const merge=()=>{ const A=(window.NETALL||[]).concat(window.NETX||[]), M=new Map(A.map(g=>[g[0]+':'+g[1],g])), f=new Set(FEAT.map(g=>g[0]+':'+g[1]));
    G=FEAT.map(g=>{ const x=M.get(g[0]+':'+g[1]); return x?[g[0],g[1],g[2],g[3],g[4],g[5],g[6],x[7]]:g; }).concat(A.filter(g=>!f.has(g[0]+':'+g[1]))); byKey=new Map(G.map(g=>[g[0]+':'+g[1],g])); byId=new Map(G.map(g=>[g[1],g])); IX=null; addNew(); count(); if($('#q').value.trim()||cat!=='all'||ST.top.length) draw(); };
  const loadJs=(src,next)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=()=>{ merge(); if(next) next(); }; s.onerror=()=>{ if(next) next(); }; document.body.appendChild(s); };
  loadJs('net-all.js',()=>loadJs('net-gd.js',()=>loadJs('net-gp.js',()=>loadJs('net-hg.js',()=>loadJs('net-pg.js',()=>loadJs('net-fm.js',()=>loadJs('net-js13k.js'))))))); 
  /* game source picker: if a school blocks one network, pick another */
  { const sel=document.createElement('select'); sel.id='srcSel'; sel.title='Game source'; sel.innerHTML=[['all','🌐 All sources'],['gm','GameMonetize'],['gd','GameDistribution'],['gp','GamePix'],['hg','HTMLGames'],['pg','Playgama'],['fm','Famobi'],['os','🛡️ Open source (hard to block)']].map(([k,t])=>`<option value="${k}" ${k===SRC?'selected':''}>${t}</option>`).join('');
    sel.style.cssText='padding:10px 12px;border-radius:999px;border:1px solid #334155;background:#0b1122;color:#fff;font:700 13px system-ui'; $('#q').insertAdjacentElement('afterend',sel);
    sel.onchange=()=>{ SRC=sel.value; try{ localStorage.setItem('rrNetSrc',SRC); }catch(e){} draw(); }; }
})();
