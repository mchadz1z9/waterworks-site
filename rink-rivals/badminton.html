<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Badminton</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }

.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; position:relative; z-index:1; }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl{ display:block; }
.viewbtn{ position:absolute; top:8px; right:8px; z-index:4; font:inherit; font-size:15px; color:#fff; background:rgba(5,8,18,.78); border:2px solid #ffd166; border-radius:999px; padding:3px 12px; cursor:pointer; }
.viewbtn:hover{ background:rgba(20,28,51,.95); }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
.st tr.dim td{ opacity:.55; }
.result{ align-items:flex-start; }
.bxw{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.bxs h3{ margin:6px 0 0; font-size:22px; } .bxs h3 img{ width:26px; height:26px; vertical-align:middle; }
.bxs small{ color:#93a0bd; }
.bxw .ls{ font-size:14px; } .bxw .ls th,.bxw .ls td{ padding:1px 6px; }
.result h2{ font-size:clamp(32px,6vw,60px); }
.potg{ margin:12px auto 0; max-width:420px; background:#141c33; border-left:8px solid var(--tc); border-radius:10px; padding:8px 14px; text-align:left; display:flex; flex-direction:column; }
.potg small{ color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:.06em; } .potg b{ font-size:24px; color:#fff; } .potg span{ color:#93a0bd; }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Rink Rivals <span>Badminton</span></div>
    <div class="tools">
      <a href="./">Home</a> <a href="hockey">Hockey</a>
      <a href="tennis">Tennis</a>
      <a href="tabletennis">Table Tennis</a>
      <button id="btnView" tabindex="-1">Broadcast 3D</button>
      <button id="btnFs" tabindex="-1">Full screen (Z)</button>
      <button id="btnSnd" tabindex="-1">Sound on</button>
    </div>
  </div>

  <section class="board" aria-label="Scoreboard">
    <div class="side" id="sideL"><img id="logoL" alt=""><div style="min-width:0"><div class="tn" id="nameL">-</div><div class="tp" id="tpL">Away</div></div><div class="sc" id="scoreL">0</div></div>
    <div class="clock"><div class="t" id="cntT">0-0</div><div class="pd"><span id="innT">Top 1st</span><span id="basesT"></span></div><div class="pd" id="outsT">0 outs</div></div>
    <div class="side r" id="sideR"><img id="logoR" alt=""><div style="min-width:0"><div class="tn" id="nameR">-</div><div class="tp" id="tpR">Home</div></div><div class="sc" id="scoreR">0</div></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <button class="viewbtn" id="viewBtn2" tabindex="-1">View: Broadcast 3D</button>
    <canvas id="cv" role="img" aria-label="Badminton game"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="menu"><div class="menu-in" id="menuIn"></div></div>
    <div class="overlay result hidden" id="result"><div id="resultIn"></div></div>
  </div>

  <footer class="keys" id="keysHelp"></footer>
  <section class="hub" id="hub" aria-label="Season hub"></section>
</main>
<script src="online.js"></script>
<script src="remote.js"></script>
<script>
(() => {
'use strict';
const W=1120, H=620, DPR=Math.min(2, window.devicePixelRatio||1);
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const TEST=/[?&]test\b/.test(location.search);
const rnd=(a,b)=>a+(b-a)*Math.random(), pick=a=>a[Math.floor(Math.random()*a.length)];
function gauss(){ let u=0; while(!u) u=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random()); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- vectors ---------- */
const v3=(x=0,y=0,z=0)=>[x,y,z], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{ const l=len(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; }, madd=(a,b,s)=>{ a[0]+=b[0]*s; a[1]+=b[1]*s; a[2]+=b[2]*s; return a; };
function rotV(v,ax,ang){ const c=Math.cos(ang), s=Math.sin(ang), d=dot(ax,v), cr=cross(ax,v); return [v[0]*c+cr[0]*s+ax[0]*d*(1-c),v[1]*c+cr[1]*s+ax[1]*d*(1-c),v[2]*c+cr[2]*s+ax[2]*d*(1-c)]; }
const angD=a=>{ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; };


const G=9.81;
/* ---------- the court (BWF): 13.40 x 6.10 m (singles 5.18), net 1.55 m at the posts, 1.524 m in the middle ----------
   z runs the length of the court (net at z = 0, you at z < 0), x across it */
const HL=6.7, HWD=3.05, HWS=2.59, SSL=1.98, LSD=HL-.76, NETC=1.524, NETPOST=1.55;
const netH=x=>NETC+(NETPOST-NETC)*Math.min(1,Math.abs(x)/HWD);
/* ---------- the shuttlecock: 5 g of cork and goose feathers. Its terminal velocity is only about 6.8 m/s, so drag is
   enormous: a 400 km/h smash is down to about 100 km/h by the time it reaches the other side, and a clear falls almost straight down ---------- */
const VT=6.8, KD=G/(VT*VT), SDT=1/480;
function shStep(s,dt){ const v=Math.hypot(s.vx,s.vy,s.vz)||1e-6, k=KD*v; s.vx-=k*s.vx*dt; s.vy-=(G+k*s.vy)*dt; s.vz-=k*s.vz*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.z+=s.vz*dt; }
const cpS=s=>({x:s.x,y:s.y,z:s.z,vx:s.vx,vy:s.vy,vz:s.vz});
/* follow a shot to the floor: where it lands, how high it got, and whether it cleared the net */
function flyOut(s0,maxT){ const s=cpS(s0); let t=0, apex=s.y, clr=9, crossed=false; const z0=Math.sign(s.z)||-1;
  while(t<(maxT||6)){ const pz=s.z; shStep(s,1/240); t+=1/240; apex=Math.max(apex,s.y); if(!crossed&&Math.sign(s.z)!==Math.sign(pz)&&pz!==0){ crossed=true; clr=s.y-netH(s.x); } if(s.y<=0) break; }
  return {x:s.x,z:s.z,t,apex,clr:crossed?clr:-9,crossed}; }
const launchS=(P,yaw,th,sp)=>({x:P[0],y:P[1],z:P[2],vx:Math.sin(yaw)*Math.cos(th)*sp,vy:Math.sin(th)*sp,vz:Math.cos(yaw)*Math.cos(th)*sp});
/* the shot solver. 'arc': a fixed launch angle, find the speed (clears, lifts, high serves, drops, net shots);
   'flat': a fixed racket speed, find the angle (smashes and drives), raising it if the net is in the way */
function solveShot(P,T,o){ const m=o.clr??.08; let tz=T[1], th=o.th, r=null;
  for(let k=0;k<8;k++){ r=solveShot1(P,[T[0],tz],Object.assign({},o,{th})); if(!r||r.r.clr>=m||!r.r.crossed&&Math.sign(tz)===Math.sign(P[2])) return r; if(o.mode==='arc') th=Math.min(1.35,th+.12); else tz+=Math.sign(tz||1)*.6; }
  return r; }
function solveShot1(P,T,o){ const yaw=Math.atan2(T[0]-P[0],T[1]-P[2]), D=Math.hypot(T[0]-P[0],T[1]-P[2]); let best=null;
  if(o.mode==='arc'){ let lo=1, hi=o.maxS||85; for(let k=0;k<24;k++){ const s=(lo+hi)/2, r=flyOut(launchS(P,yaw,o.th,s)); const dist=Math.hypot(r.x-P[0],r.z-P[2]); if(dist<D) lo=s; else hi=s; best={yaw,th:o.th,s,r}; } return best; }
  let lo=-1.3, hi=1.2; for(let k=0;k<24;k++){ const th=(lo+hi)/2, r=flyOut(launchS(P,yaw,th,o.s)); const dist=Math.hypot(r.x-P[0],r.z-P[2]); if(dist<D) lo=th; else hi=th; best={yaw,th,s:o.s,r}; }
  return best; }

/* ---------- the players (BWF world rankings): [name, nation, rating, smash, net game, defence] ---------- */
const PROS={
 ms:[['Shi Yu Qi','CHN',97,.9,.85,.9],['Anders Antonsen','DEN',95,.85,.85,.85],['Viktor Axelsen','DEN',96,.95,.85,.85],['Kunlavut Vitidsarn','THA',94,.8,.9,.9],['Jonatan Christie','INA',93,.88,.8,.85],['Li Shi Feng','CHN',93,.85,.85,.85],['Kodai Naraoka','JPN',92,.75,.9,.95],['Lee Zii Jia','MAS',91,.92,.75,.8],['Lakshya Sen','IND',90,.85,.85,.85],['Christo Popov','FRA',89,.85,.85,.8]],

const isDbl=e=>e==='md'||e==='wd'||e==='xd';

const hk=(t,k)=>held(KS[t][k]);
const sideZ=t=>t===0?-1:1;          /* team 0 plays the near end (z < 0) */

/* ---------- a match ---------- */

    const [n,code,rt,sm,nt,df]=e; return {code,name:n,players:[mkPlayer(t,0,n,code,rt,{smash:sm,net:nt,def:df,h:evtSel==='ws'?1.7:1.86})],score:0,games:0,right:0}; };

  for(const T of M.teams) for(const p of T.players) p.T=T;
  phase='play'; paused=false; $('menu').classList.add('hidden'); $('result').classList.add('hidden'); setupServe();
  banner(`${M.teams[0].name} v ${M.teams[1].name}`,`${EVT[evtSel]} · ${gamesSel===1?'one game':'best of three'} to 21 · ${LVL[lvl]}`,'#22c55e',2.6); updateBoard(); }
const HW=()=>M.dbl?HWD:HWS;
/* who serves, from which court, and where everyone stands */

  const sz=sideZ(srv.team), rz=-sz; place(S,srv,sx*.55,sz*(M.dbl?SSL+.4:SSL+1.4));
  if(M.dbl){ const mate=S.players.find(p=>p!==srv); place(S,mate,-sx*.3,sz*(SSL+2.6)); }
  /* the receiver stands diagonally opposite */ const rEven=even, rx=rightX(R.players[0].team)*(rEven?1:-1); let rcv;
  if(M.dbl){ rcv=R.players[rEven?R.right:1-R.right]; const mate=R.players.find(p=>p!==rcv); place(R,rcv,rx*.75,rz*(SSL+.7)); place(R,mate,-rx*.6,rz*(SSL+2.5)); } else { rcv=R.players[0]; place(R,rcv,rx*.75,rz*(SSL+1.6)); }

  const s=M.sh; s.x=srv.x+(srv.team===0?-1:1)*-.3; s.y=1.0; s.z=srv.z+sz*-.35; s.vx=s.vy=s.vz=0; }
function feed(t,col){ M.feed.unshift({t,col:col||'#e5e7eb',T:3}); if(M.feed.length>4) M.feed.pop(); }

/* ---------- hitting ---------- */
const reachH=p=>p.h*1.33+(p.y||0);   /* the racket head at full stretch */
function canReach(p,s){ if(Math.sign(s.z)!==sideZ(p.team)&&Math.abs(s.z)>.25) return false; const d=Math.hypot(s.x-p.x,s.z-p.z); return d<(p.lunge?1.55:1.15)&&s.y>.12&&s.y<reachH(p)+.1; }
/* a shot: kind is clear, lift, drop, net, smash, drive, sserve, lserve. Target chosen from the aim (lx: -1 left .. 1 right, dz: -1 short .. 1 deep) */

  else if(kind==='drop'){ tz=oz*(1.2+Math.max(0,aim.dz)*1.2); o={mode:'arc',th:s.y>2?.15:.45,clr:.05}; }
  else if(kind==='net'){ tz=oz*.7; tx=clamp(s.x+ax*1.2,-hw+.4,hw-.4); o={mode:'arc',th:.95,clr:.04}; }

/* the AI's choice of shot from where it meets the shuttle */
function aiShot(p){ const s=M.sh, h=s.y, az=Math.abs(s.z), O=M.teams[1-p.team].players, r=Math.random(), att=.35+.4*p.smash;

/* ---------- moving: the AI reads the flight and gets there; you move yourself (or let assist do it) ---------- */
function planIntercept(p){ const s0=cpS(M.sh), path=[]; let t=0; const s=cpS(s0); while(t<4){ shStep(s,1/120); t+=1/120; path.push({t,x:s.x,y:s.y,z:s.z}); if(s.y<=0) break; }
  let best=null; const rh=reachH(p)+.3; for(const q of path){ if(Math.sign(q.z)!==sideZ(p.team)||q.y>rh||q.y<.25) continue; const d=Math.max(0,Math.hypot(q.x-p.x,q.z-p.z)-.9), need=d/p.sp+.18;

  if(!best){ const L=path.filter(q=>Math.sign(q.z)===sideZ(p.team)).pop(); if(L) best={x:L.x,z:L.z,y:L.y,t:L.t,late:true}; }

function moveTo(p,x,z,sp,dt){ const dx=x-p.x, dz=z-p.z, d=Math.hypot(dx,dz), v=d>.05?Math.min(sp,d*3.2):0, tvx=d>.05?dx/d*v:0, tvz=d>.05?dz/d*v:0, a=Math.min(1,dt*7); p.vx+=(tvx-p.vx)*a; p.vz+=(tvz-p.vz)*a; }
function basePos(p){ const t=p.team, sz=sideZ(t), T=p.T, att=M.lastTeam===t&&(M.lastKind==='smash'||M.lastKind==='drop'||M.lastKind==='net');

  const i=T.players.indexOf(p), other=T.players[1-i]; if(att){ const front=Math.abs(p.z)<Math.abs(other.z); return front?[M.sh.x*.4,sz*2.1]:[M.sh.x*.3,sz*4.3]; }

function aiMove(p,dt){ const s=M.sh, T=p.T, sz=sideZ(p.team);

  const coming=M.lastTeam!==p.team; let goer=null;

/* ---------- the rally loop ---------- */
function step(dt){ if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('on'); } if(bannerT>0&&!paused){ bannerT-=dt; if(bannerT<=0) $('banner').classList.remove('on'); }

  if(M.state==='serve'){ M.serveT+=dt; const srv=M.server; s.x=srv.x+rightX(srv.team)*-.3; s.z=srv.z-sideZ(srv.team)*.35; s.y=1.0;
    /* the AI serves after a breath; you serve with SPACE (short) or J (a high serve) */ if(!isHuman(srv.team)&&M.serveT>1.4){ const lng=!M.dbl&&Math.random()<(M.evt==='ws'?.4:.18); srv.qual=.9+.1*Math.random(); hit(srv,lng?'lserve':'sserve',{lx:Math.random()*2-1,dz:1}); M.serveHit=true; }

  /* players move and swing */ for(const T of M.teams){ for(const p of T.players){ const human=isHuman(p.team)&&p===ctlOf(p.team);

function drawShuttle(){ const s=M.sh, K=K3, v=Math.hypot(s.vx,s.vy,s.vz), d=v>.3?[s.vx/v,s.vy/v,s.vz/v]:[0,-1,0], tail=[s.x-d[0]*.09,s.y-d[1]*.09,s.z-d[2]*.09];
  /* drawn a little larger than life so you can follow it */ R3.part(R3.US,R3.mm(R3.T(s.x*K,s.y*K,s.z*K),R3.S(.028*K,.028*K,.028*K)),[.97,.95,.88]); R3.part(R3.UB,R3.beam([s.x*K,s.y*K,s.z*K],tail.map(c=>c*K),.075*K,.075*K),[.98,.98,.98]);
  if(M.state==='rally') for(let i=1;i<M.trail.length;i++){ const a=M.trail[i-1], b=M.trail[i]; (R3.partE||R3.part)(R3.UB,R3.beam(a.map(c=>c*K),b.map(c=>c*K),.01*K,.01*K),[.75,.85,1]); }
  R3.part(R3.UC,R3.mm(R3.T(s.x*K,.006*K,s.z*K),R3.S(.08*K,.002*K,.08*K)),[.05,.15,.1]); }
let camE=null, camC=null;
function render3D(dt){ build3(); const K=K3, sky=[.05,.06,.1];
  if(!M||phase==='menu'){ const a=performance.now()/14000; R3.frame({eye:[Math.sin(a)*12*K,6*K,Math.cos(a)*14*K],center:[0,1*K,0],fov:52,near:5,far:80000,sky},()=>{},dt); return; }
  const s=M.sh; let e, c, fov=48;
  if(camMode===1){ e=[-12,6.5,s.z*.2]; c=[0,1,s.z*.35]; fov=52; } else if(camMode===2){ e=[0,13,-6]; c=[0,0,.5]; fov=62; }
  else { e=[clamp(s.x*.25,-1.5,1.5),7.6,-HL-7.2]; c=[clamp(s.x*.3,-1.5,1.5),.6,1.2+clamp(s.z*.1,-1,1)]; }

  R3.frame({eye:camE.map(v=>v*K),center:camC.map(v=>v*K),fov,near:5,far:80000,sky},()=>{ for(const T of M.teams) for(const p of T.players) drawPlayer(p); drawShuttle(); },dt); }

/* ---------- input ---------- */
function onPress(code){ if(!M||phase!=='play'||paused) return; const t=code.startsWith('P2')?1:0; if(!isHuman(t)) return; const K=KS[t];
  if(K.hi.includes(code)) humanSwing(t,'hi'); else if(K.soft.includes(code)) humanSwing(t,'soft'); else if(K.hard.includes(code)) humanSwing(t,'hard'); else if(K.auto.includes(code)) humanSwing(t,'auto'); }
addEventListener('keydown',e=>{ const tag=document.activeElement&&document.activeElement.tagName; if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); if(e.repeat) return; keys.add(e.code); audio();
  if(e.code==='KeyZ'){ toggleFs(); return; }
  if(phase==='menu'){ if(['Enter','NumpadEnter'].includes(e.code)) startGame(); return; }

  if(!M) return;
  if(e.code==='Escape'||e.code==='KeyP'){ paused=!paused; if(paused) banner('Paused','Esc to resume · M for the menu','#000',1e9); else { $('banner').classList.remove('on'); bannerT=0; } return; }

  if(e.code==='KeyC'){ camMode=(camMode+1)%3; savePrefs(); toast(['TV camera','Side camera','Overhead'][camMode],'#93c5fd'); return; }
  onPress(e.code); });
addEventListener('keyup',e=>keys.delete(e.code)); addEventListener('blur',()=>keys.clear());

const pill=(attr,val,on,label,key)=>`<button data-${attr}="${val}" class="${on?'on':''}" tabindex="-1">${label}${key?` <kbd>${key}</kbd>`:''}</button>`;

  <div class="pills"><span class="lbl">Event</span>${Object.keys(EVT).map(k=>pill('e',k,evtSel===k,EVT[k],'')).join('')}</div>

  <div class="pills"><span class="lbl">Opponent</span>${L.map((e,i)=>i===p0Sel?'':pill('b',i,p1Sel===i,`${FLAG[e[1]]||''} ${nm(e)}`,'')).join('')}</div>

  <div id="hint">Your record ${SV.wins}-${SV.games-SV.wins}${SV.smash?` · fastest smash ${SV.smash} km/h`:''}${SV.rally?` · longest rally ${SV.rally}`:''}</div>`;
  $('menuIn').innerHTML=h; const a=L[p0Sel], b=L[p1Sel], ca=NCOL[a[1]]||['#334155','#fff'], cb=NCOL[b[1]]||['#334155','#fff']; $('logoL').src=badge(ca[0],ca[1]); setText('nameL',nm(a)); setText('tpL','You'); setText('scoreL',''); $('logoR').src=badge(cb[0],cb[1]); setText('nameR',nm(b)); setText('tpR',LVL[lvl]); setText('scoreR',''); setText('cntT','BWF'); setText('innT',EVT[evtSel]); setText('outsT',gamesSel===1?'1 game':'Best of 3'); setText('basesT',''); renderKeysHelp(); }
$('menuIn').addEventListener('mousedown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
$('menuIn').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset; audio(); sfx.click(); if(d.e){ evtSel=d.e; p0Sel=0; p1Sel=1; } else if(d.a!==undefined) p0Sel=+d.a; else if(d.b!==undefined) p1Sel=+d.b; else if(d.l!==undefined) lvl=+d.l; else if(d.g) gamesSel=+d.g; else if(d.as!==undefined) assist=d.as==='1'; else if(d.act==='start'){ startGame(); return; } savePrefs(); renderMenu(); });

{ const _e=endMatch; endMatch=function(){ const r=_e.apply(this,arguments); try{ if(M&&!twoP){ const A=M.teams[0], B=M.teams[1]; if(A.games>B.games){ lbPost('wins',1); if(lvl===2) lbPost('tour',1); } if(M.mySmash>100) lbPost('smash',Math.round(M.mySmash),`${A.name} v ${B.name}`); if(M.maxRally>5) lbPost('rally',M.maxRally,`${A.name} v ${B.name}`); } }catch(e){} return r; }; }
