function newG(){G={outs:0,hr:0,st:'wait',t:.8,p:0,sw:null,bl:null,msg:'',msgT:-9,sp:[],tt:0,over:false,longest:0,streak:0};V='game';render()}
function swing(){const g=G;if(!g||g.over||g.sw!==null)return;if(g.st==='pitch'){g.sw=g.p;g.swt=0;beep(220,.1,'sawtooth',.05)}}
function step(dt){const g=G;if(!g||g.over)return;g.tt+=dt;g.sp=g.sp.filter(p=>(p.l-=dt*1.5)>0);g.sp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1});
 if(g.st==='wait'){g.t-=dt;if(g.t<=0){g.st='pitch';g.p=0;g.sw=null}}
 else if(g.st==='pitch'){const sp=[.85,1.1,1.45][sv.diff];g.p+=dt*sp;if(g.sw!==null){g.swt+=dt*6}
  if(g.sw!==null&&g.swt>=1){const err=g.sw-.78;const ae=Math.abs(err),win=[.1,.075,.055][sv.diff];let dist=0,ang=0;if(ae<win*3){dist=Math.round(420*Math.max(0,1-ae/(win*3.2))+rnd(-12,12));if(ae<win*.4)dist+=40;ang=-err*5}
   if(dist>=300&&Math.abs(ang)<.45){g.hr++;g.streak++;g.longest=Math.max(g.longest,dist);g.msg='HOME RUN! '+dist+' ft';beep(880,.2,'triangle',.08);g.bl={t:0,d:dist,a:ang};for(let i=0;i<25;i++)g.sp.push({x:500,y:300,vx:rnd(-4,4),vy:rnd(-6,0),l:1})}
   else{g.outs++;g.streak=0;g.msg=g.sw===null||ae>=win*3?'MISS':(Math.abs(ang)>=.45?'FOUL BALL':'WARNING TRACK ('+dist+' ft)');g.bl=dist>0?{t:0,d:Math.min(dist,290),a:ang}:null;beep(140,.15,'sawtooth',.05)}
   g.msgT=g.tt;g.st='fly';g.ft=0;g.sw=null}
  else if(g.p>=1.15&&g.sw===null){g.outs++;g.streak=0;g.msg='STRIKE';g.msgT=g.tt;g.st='fly';g.ft=0;g.bl=null;beep(140,.15,'sawtooth',.05)}}
 else if(g.st==='fly'){g.ft+=dt;if(g.bl)g.bl.t=Math.min(1,g.ft/1.6);if(g.ft>1.8){g.bl=null;if(g.outs>=10){fin();return}g.st='wait';g.t=.6}}}
function fin(){const g=G;g.over=true;sv.tot+=g.hr;sv.runs++;if(g.hr>sv.best)sv.best=g.hr;sv_('hd1',sv);const ti=g.hr>=SL[sv.diff][1]?'Champion!':'Round over';$('#ovl').innerHTML='<div class="ovl"><div class="box"><h2>'+ti+'</h2><div class="big" style="font-size:44px">'+g.hr+' HR</div><div class="tip" style="margin:10px 0">Longest: '+g.longest+' ft · Beat '+SL[sv.diff][0]+' ('+SL[sv.diff][1]+' HR)</div><div style="display:grid;gap:8px"><button class="btn" data-a="go">Play again</button><button class="btn g" data-a="title">Menu</button></div></div></div>'}

function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d'),g=G;
 const bg=x.createLinearGradient(0,0,0,560);bg.addColorStop(0,'#2a5aa0');bg.addColorStop(.5,'#8ec0e8');bg.addColorStop(1,'#d8e8f0');x.fillStyle=bg;x.fillRect(0,0,1000,560);
 x.fillStyle='#1a5a2a';x.fillRect(0,200,1000,360);for(let i=0;i<20;i++){x.fillStyle=i%2?'#1f6a30':'#1a5a2a';x.fillRect(i*50,200,50,360)}
 x.fillStyle='#2a3a50';x.fillRect(0,170,1000,40);for(let i=0;i<110;i++){x.fillStyle='hsl('+(i*47%360)+',50%,55%)';x.fillRect((i*9)%1000,176+(i%4)*8,5,5)}
 x.fillStyle='#8a5a2a';x.beginPath();x.ellipse(500,470,160,50,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(500,450);x.lineTo(520,462);x.lineTo(512,480);x.lineTo(488,480);x.lineTo(480,462);x.fill();
 // pitcher
 ath(x,500,340,70,{shirt:'#e8e8f0',shorts:'#cfcfd8',cap:'#d03a3a',sock:'#d03a3a',f:1,la:g.st==='pitch'?2.4*(1-Math.min(1,g.p*1.5))+.3:.5,ra:-.4});
 // batter
 const swp=g.sw!==null?Math.min(1,g.swt):0;ath(x,400,448,118,{shirt:'#2f7fd0',shorts:'#e8e8f0',helmet:'#2f7fd0',sock:'#2f7fd0',f:1,la:1.3,ra:1.45,ll:.25,rl:-.3});
 x.save();x.translate(410,380);x.rotate(-1.2+swp*2.6);x.fillStyle='#d8a050';x.fillRect(0,-4,95,8);x.restore();
 // ball
 if(g.st==='pitch'){const p=g.p;const bx=500-(500-430)*p,by=290+(450-290)*p,r=3+p*7;x.fillStyle='#fff';x.beginPath();x.arc(bx,by,r,0,7);x.fill()}
 if(g.bl){const b=g.bl,bx=430+Math.sin(b.a)*500*b.t,by=420-b.d*1.4*b.t+Math.pow(b.t,2)*150*(b.d>300?0:1);x.fillStyle='#fff';x.beginPath();x.arc(bx,by,6,0,7);x.fill()}
 x.fillStyle='#ffd23f';g.sp.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;
 // meter
 if(g.st==='pitch'){x.fillStyle='rgba(8,5,26,.8)';x.beginPath();x.roundRect(350,522,300,24,8);x.fill();const win=[.1,.075,.055][sv.diff];x.fillStyle='#2a2a50';x.fillRect(360,530,280,8);x.fillStyle='#4be07a';x.fillRect(360+280*(.78-win),530,280*win*2,8);x.fillStyle='#fff';x.fillRect(360+280*Math.min(1,g.p/1.15)-2,526,4,16)}
 x.fillStyle='rgba(8,5,26,.85)';x.beginPath();x.roundRect(300,10,400,48,12);x.fill();x.textAlign='center';x.fillStyle='#ffd23f';x.font='900 24px system-ui';x.fillText(g.hr+' HR',390,43);x.fillStyle='#fff';x.font='800 18px system-ui';x.fillText('Outs '+g.outs+'/10',600,42);
 if(g.tt-g.msgT<1.4&&g.msg){x.font='900 40px system-ui';x.lineWidth=7;x.strokeStyle='rgba(0,0,0,.7)';x.strokeText(g.msg,500,140);x.fillStyle=g.msg[0]==='H'?'#ffd23f':'#ff6b5a';x.fillText(g.msg,500,140)}}
function loop(){let last=performance.now();const f=now=>{const dt=Math.min(.03,(now-last)/1000||0);last=now;if(G){step(dt);draw()}if(V==='game')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
