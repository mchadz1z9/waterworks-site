<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Football</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }
.side.bat .tp::before{ content:'Ball · '; color:#f59e0b; }
.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; position:relative; z-index:1; }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl{ display:block; }
.viewbtn{ position:absolute; top:8px; right:8px; z-index:4; font:inherit; font-size:15px; color:#fff; background:rgba(5,8,18,.78); border:2px solid #ffd166; border-radius:999px; padding:3px 12px; cursor:pointer; }
.viewbtn:hover{ background:rgba(20,28,51,.95); }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
.st tr.dim td{ opacity:.55; }
.result{ align-items:flex-start; }
.bxw{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.bxs h3{ margin:6px 0 0; font-size:22px; } .bxs h3 img{ width:26px; height:26px; vertical-align:middle; }
.bxs small{ color:#93a0bd; }
.bxw .ls{ font-size:14px; } .bxw .ls th,.bxw .ls td{ padding:1px 6px; }
.result h2{ font-size:clamp(32px,6vw,60px); }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>
<body>
<script src="imports.js"></script>
<main>
  <div class="top">
    <div class="brand">Rink Rivals <span>Football</span></div>
    <div class="tools">
      <a href="./">Home</a> <a href="hockey">Hockey</a>
      <a href="baseball">Baseball</a>
      <a href="soccer">Soccer</a>
      <a href="basketball">Basketball</a>
      <a href="ufc">UFC</a>
      <a href="f1">F1</a>
      <button id="btnView" tabindex="-1">Broadcast 3D</button>
      <button id="btnFs" tabindex="-1">Full screen (Z)</button>
      <button id="btnSnd" tabindex="-1">Sound on</button>
    </div>
  </div>

  <section class="board" aria-label="Scoreboard">
    <div class="side" id="sideL"><img id="logoL" alt=""><div style="min-width:0"><div class="tn" id="nameL">-</div><div class="tp" id="tpL">Away</div></div><div class="sc" id="scoreL">0</div></div>
    <div class="clock"><div class="t" id="cntT">0-0</div><div class="pd"><span id="innT">Top 1st</span><span id="basesT"></span></div><div class="pd" id="outsT">0 outs</div></div>
    <div class="side r" id="sideR"><img id="logoR" alt=""><div style="min-width:0"><div class="tn" id="nameR">-</div><div class="tp" id="tpR">Home</div></div><div class="sc" id="scoreR">0</div></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <button class="viewbtn" id="viewBtn2" tabindex="-1">View: Broadcast 3D</button>
    <canvas id="cv" role="img" aria-label="Football field"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="menu"><div class="menu-in" id="menuIn"></div></div>
    <div class="overlay result hidden" id="result"><div id="resultIn"></div></div>
  </div>

  <footer class="keys" id="keysHelp"></footer>
  <section class="hub" id="hub" aria-label="Franchise"></section>
</main>
<script src="online.js"></script>
<script>
(() => {
'use strict';
/* ---------- basics ---------- */
const W=1120, H=620, DPR=Math.min(2, window.devicePixelRatio||1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let RNG=Math.random;
const rnd=(a,b)=>a+(b-a)*RNG();
const rint=(a,b)=>Math.floor(a+(b-a+1)*RNG());
const pick=a=>a[Math.floor(RNG()*a.length)];
function gauss(){ let u=0; while(!u) u=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random()); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const ORD=n=>n+(['th','st','nd','rd'][n]||'th');
const TEST=/[?&]test\b/.test(location.search);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const DBG=TEST?{}:null, dbg=(k,v)=>{ if(DBG) DBG[k]=(DBG[k]||0)+(v==null?1:v); };
if(!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){ this.rect(x,y,w,h); };

/* ---------- teams ---------- */
const svg=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const NFL=[
 ['buf','Buffalo','Bills','BUF','AFC','E','#00338d','#c60c30'],['mia','Miami','Dolphins','MIA','AFC','E','#008e97','#fc4c02'],['ne','New England','Patriots','NE','AFC','E','#002244','#c60c30'],['nyj','New York','Jets','NYJ','AFC','E','#125740','#ffffff'],
 ['bal','Baltimore','Ravens','BAL','AFC','N','#241773','#9e7c0c'],['cin','Cincinnati','Bengals','CIN','AFC','N','#fb4f14','#000000'],['cle','Cleveland','Browns','CLE','AFC','N','#311d00','#ff3c00'],['pit','Pittsburgh','Steelers','PIT','AFC','N','#101820','#ffb612'],
 ['hou','Houston','Texans','HOU','AFC','S','#03202f','#a71930'],['ind','Indianapolis','Colts','IND','AFC','S','#002c5f','#a2aaad'],['jax','Jacksonville','Jaguars','JAX','AFC','S','#006778','#d7a22a'],['ten','Tennessee','Titans','TEN','AFC','S','#0c2340','#4b92db'],
 ['den','Denver','Broncos','DEN','AFC','W','#fb4f14','#002244'],['kc','Kansas City','Chiefs','KC','AFC','W','#e31837','#ffb81c'],['lv','Las Vegas','Raiders','LV','AFC','W','#000000','#a5acaf'],['lac','Los Angeles','Chargers','LAC','AFC','W','#0080c6','#ffc20e'],
 ['dal','Dallas','Cowboys','DAL','NFC','E','#041e42','#869397'],['nyg','New York','Giants','NYG','NFC','E','#0b2265','#a71930'],['phi','Philadelphia','Eagles','PHI','NFC','E','#004c54','#a5acaf'],['was','Washington','Commanders','WAS','NFC','E','#5a1414','#ffb612'],
 ['chi','Chicago','Bears','CHI','NFC','N','#0b162a','#c83803'],['det','Detroit','Lions','DET','NFC','N','#0076b6','#b0b7bc'],['gb','Green Bay','Packers','GB','NFC','N','#203731','#ffb612'],['min','Minnesota','Vikings','MIN','NFC','N','#4f2683','#ffc62f'],
 ['atl','Atlanta','Falcons','ATL','NFC','S','#a71930','#000000'],['car','Carolina','Panthers','CAR','NFC','S','#0085ca','#101820'],['no','New Orleans','Saints','NO','NFC','S','#101820','#d3bc8d'],['tb','Tampa Bay','Buccaneers','TB','NFC','S','#d50a0a','#34302b'],
 ['ari','Arizona','Cardinals','ARI','NFC','W','#97233f','#000000'],['lar','Los Angeles','Rams','LAR','NFC','W','#003594','#ffa300'],['sf','San Francisco','49ers','SF','NFC','W','#aa0000','#b3995d'],['sea','Seattle','Seahawks','SEA','NFC','W','#002244','#69be28']
];
function makeLogo(abbr,c1,c2,shield){
  const fs=abbr.length>2?26:34;
  const body=shield?`<path d="M50 3L93 16V50C93 76 73 92 50 98C27 92 7 76 7 50V16Z" fill="${c2}"/><path d="M50 11L85 22V50C85 71 69 84 50 90C31 84 15 71 15 50V22Z" fill="${c1}"/>`
    :`<ellipse cx="50" cy="50" rx="48" ry="40" fill="${c2}"/><ellipse cx="50" cy="50" rx="42" ry="34" fill="${c1}"/><path d="M30 50H70M38 44V56M46 44V56M54 44V56M62 44V56" stroke="#fff" stroke-width="2.5" opacity=".45"/>`;
  return svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${body}<text x="50" y="${50+fs*.36}" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="${fs}" text-anchor="middle" fill="#fff" stroke="${c2}" stroke-width="1.5" paint-order="stroke">${abbr}</text></svg>`);
}
const LOGO_JCC=svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 4L92 17V50C92 75 73 91 50 97C27 91 8 75 8 50V17Z" fill="#ffc72c"/><path d="M50 12L84 22V50C84 70 68 83 50 89C32 83 16 70 16 50V22Z" fill="#4b2a86"/><text x="50" y="56" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="24" text-anchor="middle" fill="#ffc72c">JCC</text><text x="50" y="72" font-family="Arial,sans-serif" font-weight="700" font-size="9" text-anchor="middle" fill="#fff">WARRIORS</text></svg>`);
const TEAMS={};
NFL.forEach(([id,city,nick,abbr,cf,div,c1,c2],i)=>{ TEAMS[id]={id,city,name:nick,full:city+' '+nick,abbr,cf,div,c1,c2,logo:makeLogo(abbr,c1,c2,i%3===1)}; });
TEAMS.warriors={id:'warriors',city:'JCC',name:'Warriors',full:'JCC Warriors',abbr:'JCC',c1:'#4b2a86',c2:'#ffc72c',logo:LOGO_JCC};
const LEAGUE_IDS=NFL.map(t=>t[0]);
const FR_LIST=LEAGUE_IDS.slice().sort((a,b)=>TEAMS[a].full.localeCompare(TEAMS[b].full));
const EX_LIST=[...FR_LIST,'warriors'];
const DIV_NAME={E:'East',N:'North',S:'South',W:'West'};
const shortNm=n=>{ const p=n.split(' '); return p.length<2?n:p[0][0]+'. '+p.slice(1).join(' '); };

function addStars(id,R){
  const st=STARS[id]; if(!st) return; const used=new Set(R.map(p=>p.num)), taken=new Set();
  for(const [name,pos,num,ovr,age] of st){
    const cand=R.filter(p=>p.pos===pos&&!taken.has(p)).sort(byOvr)[0]; if(!cand) continue;
    const np=genPlayer(pos,Math.min(ovr,99),age); np.name=name; np.real=true; np.pot=age<25?Math.min(98,ovr+4):ovr;
    if(ovr>99){ /* a legend card: the number shows as is, but he plays like his real 99-cap self */ np.fixed=true; np.ovr=ovr; np.pot=ovr; }
    const clash=R.find(p=>p.num===num&&p!==cand); if(clash){ used.delete(clash.num); clash.num=pickNum(clash.pos,used); }
    np.num=num; used.add(num); R[R.indexOf(cand)]=np; taken.add(np);
  }
}
function genTeams(seed){ const old=RNG; RNG=mulberry32(seed); const out={}; for(const id of LEAGUE_IDS){ const R=genRoster(rnd(66,76)); addStars(id,R); out[id]={roster:R}; } /* players sent from 84 & Up and 82-0 */ if(window.RRI) RRI.apply(out,'nfl',{rate:(p)=>calcOvr(p),make:(pos,o,age)=>genPlayer(pos,o,age),renum:(p,R)=>pickNum(p.pos,new Set(R.map(x=>x.num))),after:(np,q)=>{ if(q.ovr>99){ np.fixed=true; np.ovr=q.ovr; } }}); out.warriors={roster:genRoster(72)}; RNG=old; return out; }

function depth(R){

  const avail=R.filter(p=>!(p.inj>0)||p.id===CAREER_ID);
  const top=(pos,n)=>{ const a=avail.filter(p=>p.pos===pos).sort((x,y)=>(y.id===CAREER_ID)-(x.id===CAREER_ID)||y.ovr-x.ovr).slice(0,n); while(a.length<n) a.push(genPlayer(pos,50,28)); return a; };

/* ratings past 99 (a 999 legend) count as a little over the top for team strength, so the sims stay sane */
const eo=p=>Math.min(p.ovr,108);
const avgO=a=>a.reduce((s,p)=>s+eo(p),0)/a.length;

const defR=D=>avgO([D.DL1,D.DL2])*.25+avgO([D.LB1,D.LB2])*.25+avgO([D.CB1,D.CB2])*.3+eo(D.S)*.2;
const teamOvr=R=>{ const D=depth(R); return Math.round(offR(D)*.52+defR(D)*.48); };

function bx(S,p,team){ return S.box[p.id]||(S.box[p.id]={p,team,pa:0,pc:0,py:0,ptd:0,pint:0,ra:0,ry:0,rtd:0,rec:0,rey:0,retd:0,tk:0,sk:0,int:0,fgm:0,fga:0}); }
const wpick=(arr,w)=>{ let s=0; const ws=arr.map(w); ws.forEach(v=>s+=v); let r=Math.random()*s; for(let i=0;i<arr.length;i++){ r-=ws[i]; if(r<=0) return arr[i]; } return arr[arr.length-1]; };
function fgProb(k,yds){ return clamp(.99-Math.pow(Math.max(0,yds-25),1.6)*.0035*(1.4-k.a.kck/100),.04,.99); }
/* one simulated possession (used by full sims and by "sim rest of game") */
function simDrive(S,o){
  const d=1-o, A=S.depth[o], B=S.depth[d], edge=(offR(A)-defR(B))/100, r=Math.random();
  const pTD=.21+edge*.9, pFG=.15, pTO=Math.max(.04,.11-edge*.3);
  const res=r<pTD?'TD':r<pTD+pFG?'FG':r<pTD+pFG+pTO?'TO':'PUNT';
  const yds=res==='TD'?rint(45,85):res==='FG'?rint(30,60):res==='TO'?rint(0,40):rint(5,35);
  const plays=Math.max(3,Math.round(yds/5.5)+rint(0,3)), passes=Math.round(plays*rnd(.5,.66)), runs=plays-passes;
  const qb=bx(S,A.QB,o), comp=Math.round(passes*clamp(.5+(A.QB.a.tha-60)*.006,.45,.78));
  const passY=Math.round(yds*rnd(.5,.75)), runY=yds-passY;
  qb.pa+=passes; qb.pc+=comp; qb.py+=passY;
  const rcv=[A.WR1,A.WR2,A.TE,A.RB], rw=p=>p===A.WR1?3.5:p===A.WR2?2.5:p===A.TE?2:1.2;
  let left=passY; for(let i=0;i<comp;i++){ const p=wpick(rcv,rw), y=i===comp-1?left:Math.round(left*rnd(.1,.5)); left-=y; const b=bx(S,p,o); b.rec++; b.rey+=y; }
  const rb=bx(S,A.RB,o), qr=Math.random()<.18+(A.QB.a.spd-60)*.006; rb.ra+=runs; rb.ry+=qr?Math.round(runY*.75):runY; if(qr){ qb.ra+=2; qb.ry+=Math.round(runY*.25); }

function applyBox(S){ for(const k in S.box){ const e=S.box[k], st=e.p.st; if(!st) continue; st.g++; for(const f of ['pa','pc','py','ptd','pint','ra','ry','rtd','rec','rey','retd','tk','sk','int','fgm','fga']) st[f]+=e[f]; } }
/* light injuries: a player can miss a few weeks; the career player never gets hurt */
function injuries(L,S){ for(const id of S.t){ if(!L.teams[id]||Math.random()>.3) continue; const cand=ros(L,id).filter(p=>p.id!==CAREER_ID&&p.id!==L.pid&&p.pos!=='K'&&!(p.inj>0)); if(!cand.length) continue; const p=wpick(cand,q=>q.ovr>=70?2:1); p.inj=rint(1,3)+(Math.random()<.15?rint(2,5):0); if(id===L.id) L.log.unshift(`Injury: ${p.name} (${p.pos}) is out ${p.inj} week${p.inj>1?'s':''}.`); } }
function healWeek(L){ for(const [p] of allPlayers(L)) if(p.inj>0) p.inj--; }
/* young players with potential improve a little during the season */
function develop(L){ let n=0; for(const [p,id] of allPlayers(L)){ if(p.age<=25&&p.pot>p.ovr&&Math.random()<.35){ for(const k in W8[p.pos]) p.a[k]=clamp(p.a[k]+1,20,99); p.ovr=Math.min(p.pot,calcOvr(p)); if(id===L.id) n++; } } if(n) L.log.unshift(`Week ${L.round}: ${n} young player${n>1?'s':''} on your team improved in practice.`); }
function recordGame(L,S){ injuries(L,S); const [a,h]=S.t, ta=L.tbl[a], th=L.tbl[h]; ta.pf+=S.score[0]; ta.pa+=S.score[1]; th.pf+=S.score[1]; th.pa+=S.score[0]; if(S.score[0]>S.score[1]){ ta.w++; th.l++; } else { th.w++; ta.l++; } applyBox(S); }
const myPair=L=>L.sched[L.round]&&L.sched[L.round].find(p=>p.includes(L.id));
function finishRound(L,userS){ for(const pr of L.sched[L.round]) recordGame(L,userS&&pr.includes(L.id)?userS:simGame(gameOpts(L,pr[0],pr[1]))); L.round++; healWeek(L); if(L.round%4===0) develop(L); if(L.round>=L.len) startPlayoffs(L); }
const seedsOf=(L,cf)=>LEAGUE_IDS.filter(id=>TEAMS[id].cf===cf).sort((a,b)=>pctOf(L.tbl[b])-pctOf(L.tbl[a])||(L.tbl[b].pf-L.tbl[b].pa)-(L.tbl[a].pf-L.tbl[a].pa)).slice(0,4);
const RND_NAMES=['Divisional round','Conference championships','Super Bowl'];
function startPlayoffs(L){ L.phase='playoffs'; const g=[]; for(const cf of ['AFC','NFC']){ const s=seedsOf(L,cf); g.push([s[3],s[0]],[s[2],s[1]]); } L.po={rnd:0,games:g}; L.log.unshift(`${L.season}: Regular season over. ${g.some(x=>x.includes(L.id))?'You made the playoffs!':'You missed the playoffs.'}`); }
const myPO=L=>L.po&&L.po.games.find(x=>x.includes(L.id));
function poRound(L,userS){
  const W=L.po.games.map(([a,h])=>{ const S=userS&&[a,h].includes(L.id)?userS:simGame(gameOpts(L,a,h)); return S.score[0]>S.score[1]?a:h; }); healWeek(L);
  if(L.po.rnd<2) L.log.unshift(`${RND_NAMES[L.po.rnd]}: ${W.map(id=>TEAMS[id].name).join(', ')} advance.`);
  if(L.po.rnd===0){ L.po.rnd=1; L.po.games=[[W[1],W[0]],[W[3],W[2]]]; }
  else if(L.po.rnd===1){ L.po.rnd=2; L.po.games=[[W[0],W[1]]]; }
  else finishSeason(L,W[0]);
}
function finishSeason(L,champ){
  const P=allPlayers(L), nm=x=>x?`${x[0].name} (${TEAMS[x[1]].abbr})`:'-';
  const ov=p=>p.st.py*.04+p.st.ptd*4-p.st.pint*3+p.st.ry*.1+p.st.rtd*6+p.st.rey*.1+p.st.retd*6;
  const dv=p=>p.st.tk*.5+p.st.sk*3+p.st.int*4;
  const mvp=P.slice().sort((a,b)=>ov(b[0])-ov(a[0]))[0], dpoy=P.slice().sort((a,b)=>dv(b[0])-dv(a[0]))[0], roy=P.filter(([p])=>p.age<=23).sort((a,b)=>(ov(b[0])+dv(b[0]))-(ov(a[0])+dv(a[0])))[0];
  L.awards.unshift({season:L.season,champ,mvp:nm(mvp),dpoy:nm(dpoy),roy:nm(roy)});
  L.log.unshift(`${L.season}: The ${TEAMS[champ].full} win the Super Bowl!${champ===L.id?' That is your team!':''} MVP ${nm(mvp)}, Defensive Player ${nm(dpoy)}, Rookie ${nm(roy)}.`);
  if(L.kind==='car') for(const [k,x] of [['MVP',mvp],['Defensive Player of the Year',dpoy],['Rookie of the Year',roy]]) if(x&&x[0].id===L.pid){ L.xp=(L.xp||0)+250; (L.awardsMe=L.awardsMe||[]).push(`${L.season} ${k}`); L.log.unshift(`${L.season}: You won ${k}! (+250 XP)`); }
  if(L.kind==='car'&&champ===L.id){ L.xp=(L.xp||0)+300; (L.awardsMe=L.awardsMe||[]).push(`${L.season} Super Bowl champion`); }
  for(const [p] of P){ p.car=p.car||blankSt(); for(const k in p.st) p.car[k]+=p.st[k]; }
  const order=LEAGUE_IDS.slice().sort((a,b)=>pctOf(L.tbl[a])-pctOf(L.tbl[b]));
  L.phase='draft'; L.draft={pool:Array.from({length:80},genProspect).sort((a,b)=>b.pot-a.pot),order:[...order,...order],pick:0};
}
const GRADE=p=>p>=90?'A+':p>=86?'A':p>=82?'B+':p>=78?'B':p>=73?'C+':p>=68?'C':'D';
function genProspect(){ const pos=pick(['QB','RB','WR','WR','TE','OL','OL','DL','DL','LB','CB','CB','S']), p=genPlayer(pos,rnd(52,70),rint(21,23)); p.pot=clamp(Math.round(p.ovr+rnd(8,30)),62,97); return p; }
function draftPick(L,pid){ const D=L.draft, tid=D.order[D.pick], i=D.pool.findIndex(p=>p.id===pid); if(i<0) return; const p=D.pool.splice(i,1)[0]; p.num=pickNum(p.pos,new Set(ros(L,tid).map(x=>x.num))); ros(L,tid).push(p); if(tid===L.id) L.log.unshift(`Draft: picked ${p.name} (${p.pos}, potential ${GRADE(p.pot)}).`); D.pick++; if(D.pick>=D.order.length) offseason(L); }
const aiPick=L=>L.draft.pool.slice().sort((a,b)=>(b.pot+b.ovr*.3)-(a.pot+a.ovr*.3))[0].id;
function simDraft(L,all){ while(L.phase==='draft'&&(all||L.draft.order[L.draft.pick]!==L.id)) draftPick(L,aiPick(L)); }
function tval(p){ let v=Math.pow(1.12,eo(p)-60)*(p.pos==='QB'?1.6:p.pos==='K'?.4:1); if(p.age<25) v*=1+Math.max(0,p.pot-p.ovr)*.03; if(p.age>30) v*=.8; if(p.age>33) v*=.7; return v; }
function progress(p){ if(p.fixed) return; const a=p.age; let d=a<=24?rint(1,5):a<=27?rint(0,3):a<=29?rint(-1,1):a<=32?rint(-3,0):rint(-6,-1); if(p.pos==='QB'&&a>30&&a<36) d=Math.max(d,rint(-1,1)); if(a<=27&&p.ovr+d>p.pot) d=Math.max(0,p.pot-p.ovr); for(const k in p.a) p.a[k]=clamp(p.a[k]+d+rint(-1,1),20,99); p.ovr=calcOvr(p); if(a>=28||p.pot<p.ovr) p.pot=p.ovr; }
const MINS={QB:2,RB:2,WR:4,TE:2,OL:5,DL:4,LB:3,CB:4,S:3,K:1};
function fillMins(R){ const used=new Set(R.map(p=>p.num)); for(const pos in MINS) while(R.filter(p=>p.pos===pos).length<MINS[pos]) R.push(genPlayer(pos,rnd(56,64),rint(23,28),used)); }
function trimRoster(R){ fillMins(R); while(R.length>34){ const cnt=pos=>R.filter(p=>p.pos===pos).length; const c=R.filter(p=>cnt(p.pos)>MINS[p.pos]&&p.id!==CAREER_ID).sort((a,b)=>tval(a)-tval(b))[0]; if(!c) break; R.splice(R.indexOf(c),1); } }
function offseason(L){
  const gone=[];
  for(const id of LEAGUE_IDS){ const R=ros(L,id); for(const p of R.slice()){ p.age++; progress(p); p.st=blankSt(); p.inj=0; const lim=p.pos==='QB'||p.pos==='K'?40:34; if(p.id!==CAREER_ID&&(p.age>=lim+3||(p.age>=lim&&Math.random()<.5)||(p.age>=lim-3&&p.ovr<64&&Math.random()<.5))){ R.splice(R.indexOf(p),1); if(p.real||p.ovr>=85) gone.push(p.name); } } trimRoster(R); }
  if(gone.length) L.log.unshift(`Retired: ${gone.slice(0,10).join(', ')}.`);
  L.season++; L.sched=makeSched(L.len); L.round=0; L.tbl=blankTbl(); L.phase='season'; L.po=null; L.draft=null; L.log.unshift(`${L.season}: New season begins.`);
}
function tradeCheck(L,give,get,other){
  if(!give.length||!get.length) return 'Pick at least one player on each side.';
  const R=ros(L,L.id), O=ros(L,other);
  if(R.length-give.length+get.length>38) return 'Your roster would be too big.';
  const vg=give.reduce((s,p)=>s+tval(p),0), vr=get.reduce((s,p)=>s+tval(p),0);
  return vr>vg*.97?`The ${TEAMS[other].name} say no. They want more value back.`:'';
}
function doTrade(L,give,get,other){ const R=ros(L,L.id), O=ros(L,other); for(const p of give){ R.splice(R.indexOf(p),1); O.push(p); } for(const p of get){ O.splice(O.indexOf(p),1); R.push(p); } fillMins(R); fillMins(O); L.log.unshift(`Trade with the ${TEAMS[other].full}: sent ${give.map(p=>p.name).join(', ')} for ${get.map(p=>p.name).join(', ')}.`); }
