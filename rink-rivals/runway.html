<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Runway</title>
<style>
:root{--bg:#0d0610;--p1:#1a0d1f;--p2:#26142d;--line:#3a2042;--tx:#fff1fb;--mut:#c9a7c4;--acc:linear-gradient(135deg,#ec4899,#f59e0b)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui}
#hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:1100px;margin:0 auto;flex-wrap:wrap}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal}
#hd .sp{flex:1}.tabs{display:flex;gap:6px}.tabs button{border:0;background:none;color:var(--mut);font:700 14px system-ui;padding:8px 12px;border-radius:10px}.tabs button.on{background:var(--p2);color:var(--tx)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
.theme{text-align:center;padding:20px;border-radius:18px;background:linear-gradient(135deg,#831843,#b45309);margin-bottom:14px}.theme small{display:block;font:700 13px system-ui;opacity:.85}.theme b{display:block;font:900 34px system-ui;margin:4px 0}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px;font:800 16px system-ui}
.btn{border:0;border-radius:12px;padding:12px 18px;font:900 15px system-ui;background:var(--acc);color:#fff}.btn.g{background:var(--p2);color:var(--tx)}
.note{color:var(--mut);font-size:13px}
.st{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
.big{width:100%;aspect-ratio:100/130;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px #0008}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}.sw button.on{border-color:#fff}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.ch button{border:2px solid var(--line);background:var(--p2);color:var(--tx);border-radius:10px;padding:6px 10px;font:700 13px system-ui}.ch button.on{border-color:#ec4899}
label{display:block;font:800 13px system-ui;color:var(--mut);margin:6px 0}
.vote{text-align:center}.vote .big{max-width:300px;margin:0 auto}.stars{display:flex;justify-content:center;gap:8px;margin:14px 0}.stars{flex-wrap:wrap}.stars button{border:0;background:var(--p2);border-radius:12px;font-size:18px;padding:10px 12px}
.podium{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.pd{background:var(--p2);border-radius:14px;padding:8px;text-align:center}.pd .big{border-radius:12px}.pd b{display:block;margin-top:6px}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
@media(max-width:760px){.st{grid-template-columns:1fr}.big{max-width:260px;margin:0 auto}.tabs{order:3;width:100%}}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a class="bk" href="./" title="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><a id="logo" href="runway"><i>👗</i>Rival Runway</a><span class="sp"></span>
  <nav class="tabs"><button data-t="style" class="on">✨ Style</button><button data-t="vote">⭐ Vote</button><button data-t="res">🏆 Results</button></nav></header>
<main id="main"><p class="note">Loading…</p></main>
<script src="avatar.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SRV=(()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })();
  const pid=()=>{ try{ let p=localStorage.getItem('rrPid'); if(!p||p.length<8){ p=Math.random().toString(36).slice(2,14); localStorage.setItem('rrPid',p); } return p; }catch(e){ return ''; } };
  const name=()=>{ try{ return localStorage.getItem('rrOnlineName')||'Player'; }catch(e){ return 'Player'; } };
  const post=(u,b)=>fetch(SRV+u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({pid:pid(),name:name()},b||{}))}).then(r=>r.json()).catch(()=>null);
  const R=window.RRAV; let S=null, tab='style', A=null, queue=[];
  const toast=t=>{ let e=$('toast'); if(!e){ e=document.createElement('div'); e.id='toast'; e.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#1a0d1f;border:2px solid #ec4899;border-radius:14px;padding:12px 16px;font:800 15px system-ui;z-index:99'; document.body.appendChild(e); } e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',3200); };
  async function load(){ S=await post('/rw/state'); if(!S){ $('main').innerHTML='<p class="note">Could not reach the runway.</p>'; return; }
    A=S.mine?R.decode(S.mine.code):R.load(); draw();
    /* coins for yesterday's winners come through the same pick-up as Market Day */
    const c=await post('/md/claims'); for(const x of (c&&c.claims)||[]){ if(x.kind==='coins'&&window.RRCOIN){ RRCOIN.tradeGive([],x.n); toast('🏆 +'+x.n+' 🪙 '+x.why); } } }
  const banner=()=>`<div class="theme"><small>Today's theme</small><b>✨ ${esc(S.theme)} ✨</b><small>${S.entries} look${S.entries===1?'':'s'} so far · tomorrow: ${esc(S.next)}</small></div>`;
  function style(){ const sw=(k,list,lbl)=>`<label>${lbl}</label><div class="sw">${list.map((c,i)=>`<button style="background:${c}" class="${A[k]===i?'on':''}" data-k="${k}" data-v="${i}"></button>`).join('')}</div>`;
    const ch=(k,n,names,lbl)=>`<label>${lbl}</label><div class="ch">${Array.from({length:n},(_,i)=>`<button class="${A[k]===i?'on':''}" data-k="${k}" data-v="${i}">${names?names[i]:i+1}</button>`).join('')}</div>`;
    $('main').innerHTML=banner()+`<div class="st"><div><div class="big" id="pv"></div><button class="btn" id="enter" style="width:100%;margin-top:10px">${S.mine?'💾 Update my look':'👠 Enter the runway'}</button>${S.mine?`<p class="note" style="text-align:center">Your look: ⭐ ${S.mine.avg||'–'} from ${S.mine.n} vote${S.mine.n===1?'':'s'}</p>`:''}</div>
      <div class="card"><h3>Style it for "${esc(S.theme)}"</h3>${ch('tp',5,['👕 Tee','🧥 Hoodie','🎽 Jersey','🩱 Tank','🧥 Jacket'],'Top')}${sw('tc',R.COL,'Top color')}${sw('pc',R.COL,'Pants')}${sw('sh',R.COL,'Shoes')}${ch('hs',R.N.hs,null,'Hair')}${sw('hc',R.HAIRC,'Hair color')}${sw('bg',R.BG,'Background')}${ch('ey',R.N.ey,null,'Eyes')}${ch('mo',R.N.mo,null,'Mouth')}
        <p class="note">Hats, glasses, chains, capes and badges come from your <a href="avatar" style="color:#f9a8d4">Avatar</a> gear (buy more in the 🪙 Shop).</p></div></div>`;
    const pv=()=>{ $('pv').innerHTML=R.svg(Object.assign({},A,{g:R.gearNow()}),true); }; pv();
    $('main').onclick=e=>{ const b=e.target.closest('[data-k]'); if(!b) return; A[b.dataset.k]=+b.dataset.v; b.parentElement.querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===b)); pv(); };
    $('enter').onclick=async()=>{ const r=await post('/rw/submit',{code:R.code(A)}); if(r&&r.ok){ toast(S.mine?'💾 Look updated!':'👠 You\'re on the runway! Now vote on others.'); load(); } else toast('Could not enter. Try again.'); }; }
  async function vote(){ if(!queue.length){ const d=await post('/rw/next'); queue=(d&&d.list)||[]; }
    const e=queue[0]; $('main').onclick=null;
    $('main').innerHTML=banner()+(e?`<div class="card vote"><h3>How well does this fit "${esc(S.theme)}"?</h3><div class="big">${R.svg(e.code,true)}</div><p><b>${esc(e.name)}</b></p><div class="stars">${[1,2,3,4,5].map(n=>`<button data-st="${n}">${'⭐'.repeat(n)}</button>`).join('')}</div><button class="btn g" id="skip">Skip</button></div>`:`<div class="card"><p class="note">You've rated every look for now. Check back later, or share the runway with friends!</p></div>`);
    document.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{ await post('/rw/vote',{id:e.id,stars:+b.dataset.st}); queue.shift(); vote(); });
    const sk=$('skip'); if(sk) sk.onclick=()=>{ queue.push(queue.shift()); vote(); }; }
  function res(){ $('main').onclick=null; const T=S.top||[];
    $('main').innerHTML=banner()+`<div class="card"><h3>🏆 Today's top looks (3+ votes)</h3>${T.length?`<div class="podium">${T.map((r,i)=>`<div class="pd"><div class="big">${R.svg(r.code,true)}</div><b>${['🥇','🥈','🥉'][i]||'#'+(i+1)} ${esc(r.name)}</b><span class="note">⭐ ${r.avg} · ${r.n} votes</span></div>`).join('')}</div>`:'<p class="note">No looks have 3 votes yet. Go vote!</p>'}</div>
      <div class="card"><h3>👑 Yesterday's winners: "${esc(S.yesterday.theme)}"</h3>${S.yesterday.top.length?`<div class="podium">${S.yesterday.top.map((r,i)=>`<div class="pd"><div class="big">${R.svg(r.code,true)}</div><b>${['🥇','🥈','🥉'][i]} ${esc(r.name)}</b><span class="note">⭐ ${r.avg} · won ${[300,200,100][i]} 🪙</span></div>`).join('')}</div>`:'<p class="note">No winners yesterday.</p>'}<p class="note">Every day the top 3 win 300, 200 and 100 coins (paid the next time they visit).</p></div>`; }
  function draw(){ document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab)); ({style,vote,res})[tab](); }
  document.querySelector('.tabs').onclick=e=>{ const b=e.target.closest('[data-t]'); if(b){ tab=b.dataset.t; draw(); } };
  const wait=setInterval(()=>{ if(window.RRCOIN&&RRCOIN.eqKey){ clearInterval(wait); load(); } },200); setTimeout(()=>{ if(!S){ clearInterval(wait); load(); } },4000);
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
