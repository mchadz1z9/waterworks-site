<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Track & Field</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }

.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; position:relative; z-index:1; }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl{ display:block; }
.viewbtn{ position:absolute; top:8px; right:8px; z-index:4; font:inherit; font-size:15px; color:#fff; background:rgba(5,8,18,.78); border:2px solid #ffd166; border-radius:999px; padding:3px 12px; cursor:pointer; }
.viewbtn:hover{ background:rgba(20,28,51,.95); }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
.st tr.dim td{ opacity:.55; }
.result{ align-items:flex-start; }
.bxw{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.bxs h3{ margin:6px 0 0; font-size:22px; } .bxs h3 img{ width:26px; height:26px; vertical-align:middle; }
.bxs small{ color:#93a0bd; }
.bxw .ls{ font-size:14px; } .bxw .ls th,.bxw .ls td{ padding:1px 6px; }
.result h2{ font-size:clamp(32px,6vw,60px); }
.potg{ margin:12px auto 0; max-width:420px; background:#141c33; border-left:8px solid var(--tc); border-radius:10px; padding:8px 14px; text-align:left; display:flex; flex-direction:column; }
.potg small{ color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:.06em; } .potg b{ font-size:24px; color:#fff; } .potg span{ color:#93a0bd; }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>

function lanePos(L,u){ const r=laneR(L), rm=laneRm(L), lap=lapLen(L); u=((u%lap)+lap)%lap; const k=r/rm, B=Math.PI*rm;
  if(u<B){ const p=u/rm; return {x:-r*Math.cos(p),z:HS+r*Math.sin(p),h:Math.atan2(r*Math.sin(p)*0+Math.cos(p)*1,0)*0+p}; }
  u-=B; if(u<STR) return {x:r,z:HS-u,h:Math.PI}; u-=STR; if(u<B){ const p=u/rm; return {x:r*Math.cos(p),z:-HS-r*Math.sin(p),h:Math.PI+p}; }
  u-=B; return {x:-r,z:-HS+u,h:0}; }
/* heading h: 0 = running +z; the bend helpers above return the angle turned so far */

function hjTakeoff(){ if(E.stage!=='run') return; const me=E.me, dd=HJ_RUN-me.d; E.stage='fly'; E.flight=hjFlight(clamp(1-Math.abs(dd-1.0)/.7,0,1),dd); }
function hjFlight(q,dd){ const me=E.me, vy=(gSel==='m'?4.62:4.3)*Math.pow(clamp(me.v/PV[gSel].hj,0,1),.6)*(.8+.2*q), y0=gSel==='m'?1.32:1.22, peak=y0+vy*vy/(2*G), tp=vy/G;
  return {t:0,vy,y0,peak,tp,T:tp*2+.35,q,dd:dd===undefined?-1:dd,arch:null}; }
function hjArch(){ if(E.stage==='fly'&&E.flight&&E.flight.arch===null) E.flight.arch=E.flight.t; }
function hjLand(){ const f=E.flight, bar=E.bars[E.hi]; let bonus=f.arch===null?-.06:Math.abs(f.arch-f.tp)<.1?.03:Math.abs(f.arch-f.tp)<.2?0:-.04; if(f.dd<0) bonus-=.15;
  const ok=f.peak+bonus>=bar+.005; E.stage='mark'; E.stT=0;
  if(ok){ E.best=bar; E.fails=0; E.msg={t:`Cleared ${bar.toFixed(2)}!`,col:'#22c55e'}; sfx.crowd(.25); speak(`Clear. ${bar.toFixed(2)}`,true); } else { E.fails++; E.totalFails++; E.msg={t:`Bar down at ${bar.toFixed(2)}${f.dd<0?' (no take-off)':f.q<.4?' (bad take-off spot)':''}`,col:'#f87171'}; sfx.bar(); speak('Bar down',true); }
  E.msgT=2.2; E.lastOk=ok; f.cleared=ok; E.after={t:NOW+2.2,fn:()=>hjNext(ok)}; }
function hjOpp(bar){ for(const o of E.oppHJ){ if(o.out||o.done===bar) continue; let tries=0; while(tries<3){ tries++; const p=clamp(.55+(o.pb-bar)*9,.03,.97); if(Math.random()<p){ o.best=bar; break; } o.fails++; o.tf++; if(o.fails>=3){ o.out=true; break; } } if(!o.out) o.fails=0; o.done=bar; } }
function hjNext(ok){ if(ok||E.fails>=3){ hjOpp(E.bars[E.hi]); if(E.fails>=3){ E.out=true; let h=E.hi+1; while(E.oppHJ.some(o=>!o.out)&&h<E.bars.length){ hjOpp(E.bars[h]); h++; } return hjOver(); } E.hi++; if(E.hi>=E.bars.length||(E.oppHJ.every(o=>o.out)&&E.best>0&&E.hi>0&&false)) return hjOver(); E.fails=0; }
  if(E.oppHJ.every(o=>o.out)&&E.best>Math.max(...E.oppHJ.map(o=>o.best))&&E.hi>0){ E.msg={t:'You have won! Keep going for a record or press F to finish',col:'#fde047'}; E.msgT=3; }
  readyField(); }
function hjPass(){ if(E.kind!=='hj'||E.stage!=='ready') return; hjOpp(E.bars[E.hi]); E.hi++; E.fails=0; E.msg={t:`Passed · next ${E.bars[E.hi]?E.bars[E.hi].toFixed(2):''}`,col:'#93c5fd'}; E.msgT=1.5; if(E.hi>=E.bars.length) hjOver(); }
function hjOver(){ const rows=[{name:'You',nat:'GBR',me:true,perf:E.best,fails:E.totalFails}].concat(E.oppHJ.map(o=>({name:o.name,nat:o.nat,perf:o.best,fails:o.tf}))).sort((a,b)=>b.perf-a.perf||a.fails-b.fails); finishEvent(rows,false); }

/* ---------- results, medals, championship ---------- */
const fmtP=(id,v)=>v>=1e8?(id==='e400'||id==='e100'||id==='hurd'?'DQ':'NM'):v<=0?'NM':EVENTS[id].kind==='sprint'||EVENTS[id].kind==='hurdles'||EVENTS[id].kind==='lap'?(v>=60?`${Math.floor(v/60)}:${(v%60).toFixed(2).padStart(5,'0')}`:v.toFixed(2)):v.toFixed(2)+' m';
function finishEvent(rows,track){ phase='over'; const id=E.id, me=rows.find(r=>r.me), pos=rows.indexOf(me)+1, perf=me.perf, k=id+gSel;
  const better=track?(perf<1e8&&(!SV.pb[k]||perf<SV.pb[k])):(perf>0&&(!SV.pb[k]||perf>SV.pb[k])); if(better) SV.pb[k]=perf; if(pos===1) SV.medals.g++; else if(pos===2) SV.medals.s++; else if(pos===3) SV.medals.b++; saveSV();
  const wr=track?perf<WR[id][gSel]:perf>WR[id][gSel]; if(pos<=3) sfx.win(); speak(wr?'World record!':pos===1?'Gold medal!':pos===2?'Silver':pos===3?'Bronze':`${pos}th place`,true);
  const pts=points(id,gSel,perf); let champTxt='';
  if(champ){ champ.res[id]={perf,pts}; champ.total+=pts; for(const r of champ.rivals) r.total+=r.per[id]; champTxt=`<p><b>Championship:</b> ${pts} points this event · total ${champ.total} after ${Object.keys(champ.res).length} of ${ORDER.length}</p>`; }
  const medal=['🥇','🥈','🥉'];

  <table class="ls"><tr><th>#</th><th>Athlete</th><th>Result</th>${track?'':'<th>Attempts</th>'}</tr>${rows.map((r,i)=>`<tr${r.me?' style="background:rgba(255,209,102,.2)"':''}><td>${i+1}</td><td>${FLAG[r.nat]||''} ${esc(r.name)}</td><td>${fmtP(id,r.perf)}</td>${track?'':`<td>${r.marks?r.marks.map(m=>m?m.toFixed(2):'x').join(' · '):r.fails!==undefined?r.fails+' misses':''}</td>`}</tr>`).join('')}</table>
  <p>${champ?(Object.keys(champ.res).length<ORDER.length?'Enter for the next event':'Enter for the final standings'):'Enter for the menu, R to go again'}.</p>`;
  setTimeout(()=>{ if(phase==='over') $('result').classList.remove('hidden'); },900); }
function newChamp(){ const R=RIVALS[gSel].map(([name,nat,pb])=>{ const per={}; for(const id of ORDER) per[id]=Math.round(pb/(gSel==='m'?10:7)*(.92+Math.random()*.12)); return {name,nat,pb,per,total:0}; }); champ={res:{},total:0,rivals:R,i:0}; startEvent(ORDER[0]); }
function champNext(){ champ.i++; if(champ.i<ORDER.length) return startEvent(ORDER[champ.i]); const rows=[{name:'You',nat:'GBR',me:true,total:champ.total}].concat(champ.rivals.map(r=>({name:r.name,nat:r.nat,total:r.total}))).sort((a,b)=>b.total-a.total), pos=rows.findIndex(r=>r.me)+1;
  SV.champ[gSel]=Math.max(SV.champ[gSel]||0,champ.total); saveSV(); phase='over'; champ.done=true;
  $('resultIn').innerHTML=`<h2>${pos===1?'🥇 Champion!':pos===2?'🥈 Silver':pos===3?'🥉 Bronze':pos+'th overall'}</h2><div class="rs">${champ.total} pts</div><p>${ORDER.map(id=>`${EVENTS[id].name} ${champ.res[id]?fmtP(id,champ.res[id].perf):'-'}`).join(' · ')}</p><table class="ls"><tr><th>#</th><th>Athlete</th><th>Points</th></tr>${rows.map((r,i)=>`<tr${r.me?' style="background:rgba(255,209,102,.2)"':''}><td>${i+1}</td><td>${FLAG[r.nat]||''} ${esc(r.name)}</td><td>${r.total}</td></tr>`).join('')}</table><p>Enter for the menu.</p>`;
  $('result').classList.remove('hidden'); }

/* ---------- loop ---------- */
function step(dt){
  NOW+=dt;
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('on'); }
  if(bannerT>0&&!paused){ bannerT-=dt; if(bannerT<=0) $('banner').classList.remove('on'); }
  if(!E||paused||phase!=='play') return; if(E.msgT>0) E.msgT-=dt; if(E.after&&NOW>=E.after.t){ const f=E.after.fn; E.after=null; f(); if(phase!=='play') return; }
  if(E.lanes) raceStep(dt); else fieldStep(dt); updateBoard(); }

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName; if(tag==='INPUT'||tag==='SELECT') return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.repeat) return; keys.add(e.code); audio();
  if(e.code==='KeyZ'){ toggleFs(); return; }
  if(e.code==='KeyV'){ setView3(!view3); return; }
  if(phase==='menu'){ menuKey(e.code); return; }
  if(phase==='over'){ if(champ&&!champ.done&&['Enter','NumpadEnter','Space'].includes(e.code)) return champNext(); if(e.code==='KeyR'&&!champ) startEvent(evSel); else if(['Enter','NumpadEnter','Escape','KeyM'].includes(e.code)) toMenu(); return; }
  if(!E) return;
  if(e.code==='Escape'||e.code==='KeyP'&&E.kind!=='hj'){ paused=!paused; if(paused) banner('Paused','Esc to resume · M for menu','#000',1e9); else { $('banner').classList.remove('on'); bannerT=0; } return; }
  if(paused) return;
  if(e.code==='KeyM'){ if(confirm('Leave this event?')) toMenu(); keys.clear(); return; }
  if(e.code==='KeyC'){ E.cam=((E.cam||0)+1)%2; toast(E.cam?'Close camera':'TV camera','#93c5fd'); return; }
  if(e.code==='KeyA'||e.code==='ArrowLeft') tap(-1); if(e.code==='KeyD'||e.code==='ArrowRight') tap(1);
  if(e.code==='Space'){ if(E.kind==='hurdles') hurdleJump(); else if(E.kind==='hj'){ if(E.stage==='run') hjTakeoff(); else if(E.stage==='fly') hjArch(); } else if(E.kind==='sp'&&E.stage==='ready'){ E.stage='run'; E.me.run=true; } else startHold(); }
  if(e.code==='KeyP'&&E.kind==='hj') hjPass();
  if(e.code==='KeyF'&&E.kind==='hj'&&E.oppHJ.every(o=>o.out)&&E.stage==='ready') hjOver();
});

/* ---------- 3D engine (shared with the other Rink Rivals sports) ---------- */
function makeR3(glc,stage){
  let gl=null;
  try{ gl=glc.getContext('webgl',{antialias:true,alpha:false})||glc.getContext('experimental-webgl'); }catch(e){}
  if(!gl) return {ok:false};
  const hx=h=>{ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  let time=0;

    else { const u=lapLen(4)-400+me.d, p=lanePos(4,u), h=headOf(4,u), nx=Math.cos(h), nz=-Math.sin(h); if(E.cam===1) camTo([p.x-Math.sin(h)*5,1.8,p.z-Math.cos(h)*5],[p.x+Math.sin(h)*6,1,p.z+Math.cos(h)*6],dt,8); else camTo([p.x+nx*14-Math.sin(h)*3,6,p.z+nz*14-Math.cos(h)*3],[p.x,1,p.z],dt,4); } }
  else { const me=E.me, k=E.kind; me.ph=(me.ph||0)+dt*Math.PI*2*(.75+me.v*.34)*(me.v>.3?1:0);
    if(k==='lj'){ let z=LJZ0+me.d, y=0, pose=me.v>.3?'run':'stand'; if(E.flight){ z=LJZ0+E.flight.x; y=Math.max(0,E.flight.y-1.0); pose=E.stage==='fly'?'fly':'crouch'; }
      draws.push({x:LJX,y,z,h:0,ph:me.ph,v:me.v,pose,kit:'#1d4ed8',bib:true,skin:'#c58c5c',shoe:'#facc15'}); if(E.cam===1) camTo([LJX-2,2,z-7],[LJX,1,z+4],dt,6); else camTo([LJX-11,3.2,Math.min(z,LJZ0+44)-2],[LJX,1,Math.min(z,LJZ0+46)+1.5],dt,5); }
    if(k==='hj'){ const t=E.stage==='fly'?E.flight:null; let z=HJZ0+Math.min(me.d,HJ_RUN-.5), x=HJX-3+3*clamp(me.d/HJ_RUN,0,1), y=0, pose=me.v>.3?'run':'stand', tilt=0, h=me.d>HJ_RUN-6?-.6:0;
      if(t||E.stage==='mark'&&E.flight){ const f=E.flight, tt=Math.min(f.t,f.T), yc=f.y0+f.vy*tt-.5*G*tt*tt; y=Math.max(0,yc-.95); z=HJZ-1+Math.min(2.6,tt*2.2); x=HJX; pose='hj'; tilt=-Math.min(Math.PI/2+.2,tt/f.tp*1.5); h=Math.PI; if(tt>=f.T) { y=.72; tilt=-1.6; } }
      draws.push({x,y,z,h,ph:me.ph,v:me.v,pose,tilt,kit:'#1d4ed8',bib:true,skin:'#c58c5c',shoe:'#facc15'}); camTo(E.cam===1?[HJX+5,2.2,HJZ-6]:[HJX-11,3.5,HJZ-5],[HJX,1.6,HJZ],dt,4); }
    if(k==='jt'){ const z=JTZ0+me.d; draws.push({x:0,y:0,z,h:0,ph:me.ph,v:me.v,pose:E.holding||E.flight?'throw':me.v>.3?'run':'stand',armA:E.flight?.4:-2.6,kit:'#1d4ed8',bib:true,skin:'#c58c5c',shoe:'#facc15'});
      if(E.flight&&E.stage!=='ready'){ const f=E.flight, jz=JTZ0+f.x, jy=Math.max(.05,f.y); camTo([10,4+jy*.4,jz-12],[0,jy*.7,jz+4],dt,3); } else camTo(E.cam===1?[1.2,1.9,z-5]:[9,3,z-3],[0,1.2,z+8],dt,5); }
    if(k==='sp'){ const spin=E.stage==='run'?E.glideT*4:0; draws.push({x:SPX,y:0,z:SPZ-.6+(E.stage==='run'?E.glideT*.3:0),h:spin,ph:0,v:0,pose:E.flight?'throw':'crouch',armA:E.flight?.6:-2.8,kit:'#1d4ed8',bib:true,skin:'#c58c5c',shoe:'#facc15'});
      if(E.flight){ const f=E.flight; camTo([SPX+13,4.5,SPZ+6],[SPX,1.2,SPZ+f.x*.75+2],dt,3); } else camTo([SPX+7,2.6,SPZ-1],[SPX,1.1,SPZ+1.5],dt,4); } }
  R3.frame({eye:camE.map(v=>v*K),center:camC.map(v=>v*K),fov:E.lanes?48:50,near:3,far:40000,sky:SKY},()=>{
    for(const d of draws) drawAthlete(d);
    /* hurdles */
    if(E.lanes&&E.kind==='hurdles') for(const h of E.hurdles) for(let L=1;L<=8;L++){ const x=-laneR(L), z=HS-E.D+h.d, me=L===4, down=me?!!h.down[4]:false; const lane=E.lanes.find(l=>l.lane===L);
      if(down){ R3.part(R3.UB,R3.mm(R3.T(x*K,.08*K,(z+.4)*K),R3.S(1.1*K,.06*K,.6*K)),'#f8fafc'); continue; } for(const sx of [-.5,.5]) R3.part(R3.UB,R3.mm(R3.T((x+sx)*K,E.hh/2*K,z*K),R3.S(.04*K,E.hh*K,.04*K)),'#94a3b8');
      R3.part(R3.UB,R3.mm(R3.T(x*K,(E.hh-.04)*K,z*K),R3.S(1.0*K,.08*K,.03*K)),'#f8fafc'); R3.part(R3.UB,R3.mm(R3.T(x*K,(E.hh-.04)*K,(z-.016)*K),R3.S(.6*K,.05*K,.005*K)),'#111827'); }
    /* field implements: the bar, the javelin, the shot, the landing mark */
    if(E.kind==='hj'){ const f=E.flight, down=E.stage==='mark'&&f&&!f.cleared, bar=E.bars[E.hi]||2; if(down) R3.part(R3.UB,R3.mm(R3.T(HJX*K,.75*K,(HJZ+1.4)*K),R3.RY(.2),R3.S(4*K,.03*K,.03*K)),'#f59e0b'); else R3.part(R3.UB,R3.mm(R3.T(HJX*K,bar*K,HJZ*K),R3.S(4*K,.03*K,.03*K)),'#f59e0b'); }
    if(E.kind==='jt'){ const f=E.flight; let p, ang; if(f&&E.stage!=='ready'){ p=[0,Math.max(.05,f.y),JTZ0+f.x]; ang=E.stage==='fly'?Math.atan2(f.vy,f.vx):-.5; } else { const hw=draws[0].handW||[0,1.9*K,0]; p=[hw[0]/K,hw[1]/K+.1,hw[2]/K]; ang=(E.theta||10)*Math.PI/180; }
      R3.part(R3.UB,R3.mm(R3.T(p[0]*K,p[1]*K,p[2]*K),R3.RX(-ang),R3.S(.03*K,.03*K,2.6*K)),'#cbd5e1'); R3.part(R3.UB,R3.mm(R3.T(p[0]*K,p[1]*K,p[2]*K),R3.RX(-ang),R3.S(.045*K,.045*K,.25*K)),'#1f2937'); }
    if(E.kind==='sp'){ const f=E.flight; let p; if(f&&E.stage!=='ready'){ p=[SPX,Math.max(.06,f.y),SPZ+f.x]; } else { const hw=draws[0].handW||[SPX*K,2*K,SPZ*K]; p=[hw[0]/K,hw[1]/K,hw[2]/K]; } R3.part(R3.US,R3.mm(R3.T(p[0]*K,p[1]*K,p[2]*K),R3.S(.065*K,.065*K,.065*K)),'#64748b'); }
    if(E.stage==='mark'&&E.lastMark&&(E.kind==='jt'||E.kind==='sp'||E.kind==='lj')){ const z=E.kind==='lj'?LJZ0+40+E.lastMark:E.kind==='jt'?JTZ0+30+E.lastMark:SPZ+E.lastMark, x=E.kind==='lj'?LJX:E.kind==='jt'?0:SPX; (R3.partE||R3.part)(R3.UC,R3.mm(R3.T(x*K,.05*K,z*K),R3.S(.25*K,.05*K,.25*K)),[1,.85,.1]); }
  },dt);
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; frameDtG=dt||1/60; step(dt); draw(); requestAnimationFrame(frame); }
function toggleFs(){ const st=$('stage'); try{ if(document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen&&st.requestFullscreen(); }catch(e){} }
$('btnFs').addEventListener('click',toggleFs);
$('btnView').addEventListener('click',()=>setView3(!view3));
$('viewBtn2').addEventListener('click',e=>{ e.stopPropagation(); audio(); setView3(!view3); });
$('viewBtn2').addEventListener('pointerdown',e=>e.stopPropagation());
$('btnSnd').addEventListener('click',()=>{ muted=!muted; $('btnSnd').textContent=muted?'Sound off':'Sound on'; if(!muted){ audio(); sfx.click(); } });
$('result').addEventListener('click',()=>{ if(phase==='over'){ if(champ&&!champ.done) champNext(); else toMenu(); } });
if(TEST) window.__at={get E(){return E;},get phase(){return phase;},step,startEvent,newChamp,tap,keys,hurdleJump,startHold,release,hjTakeoff,hjArch,effort,set lvl(v){lvl=v;},set gSel(v){gSel=v;},get champ(){return champ;},champNext};
setView3(view3);
renderMenu();
requestAnimationFrame(frame);
})();
