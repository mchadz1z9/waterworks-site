<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Code</title>
<style>
:root{--bg:#070b12;--p1:#0f1622;--p2:#182233;--line:#26334a;--tx:#eef4ff;--mut:#93a3bd;--acc:linear-gradient(135deg,#22c55e,#06b6d4)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui}
#hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:1300px;margin:0 auto;flex-wrap:wrap}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal}
#hd .sp{flex:1}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:0;background:none;color:var(--mut);font:700 14px system-ui;padding:8px 12px;border-radius:10px}.tabs button.on{background:var(--p2);color:var(--tx)}
main{max-width:1300px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px;font:800 16px system-ui}
.btn{border:0;border-radius:11px;padding:10px 14px;font:900 14px system-ui;background:var(--acc);color:#04130a}.btn.g{background:var(--p2);color:var(--tx)}
.note{color:var(--mut);font-size:13px;line-height:1.5}
input,select,textarea{border:1px solid var(--line);background:#0a1019;color:var(--tx);border-radius:10px;padding:9px 11px;font-size:14px;min-width:0;font-family:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:900px){.ed{grid-template-columns:1fr}}
.ftabs{display:flex;gap:4px}.ftabs button{border:1px solid var(--line);border-bottom:0;background:var(--p2);color:var(--mut);font:800 13px ui-monospace,monospace;padding:7px 14px;border-radius:10px 10px 0 0}.ftabs button.on{background:#0a1019;color:#fff}
.code{display:flex;border:1px solid var(--line);border-radius:0 12px 12px 12px;background:#0a1019;height:460px;overflow:hidden}
.gut{padding:10px 8px;text-align:right;color:#475569;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;user-select:none;overflow:hidden;white-space:pre;min-width:42px;background:#080d15}
.code textarea{flex:1;border:0;border-radius:0;resize:none;outline:none;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px;white-space:pre;overflow:auto;tab-size:2;background:transparent;color:#e2e8f0}
.prev{background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line);height:380px}.prev iframe{width:100%;height:100%;border:0;display:block;background:#fff}
#con{height:70px;overflow:auto;background:#05080d;border:1px solid var(--line);border-radius:10px;margin-top:8px;padding:6px 8px;font:12px/1.4 ui-monospace,monospace;color:#cbd5e1}#con .e{color:#fca5a5}#con .w{color:#fde68a}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gc{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}.gc:hover{border-color:#22c55e}
.gc .em{font-size:40px;height:70px;display:grid;place-items:center;background:var(--p2);border-radius:10px}.gc b{font-size:15px}.gc small{color:var(--mut)}
.st{font:800 11px system-ui;border-radius:999px;padding:2px 8px}.st-wait{background:#eab30833;color:#fde047}.st-ok{background:#22c55e33;color:#86efac}.st-no{background:#ef444433;color:#fca5a5}
#player{position:fixed;inset:0;z-index:50;background:#000d;display:none;flex-direction:column}
#player .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0b1220;flex-wrap:wrap}#player .bar b{flex:1;font-size:16px}
#player iframe{flex:1;width:100%;border:0;background:#fff}
pre.ex{background:#0a1019;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font:12.5px/1.5 ui-monospace,monospace;color:#e2e8f0}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
</style>
</head>
<body>
<i id="arena" hidden></i>
<div id="hd"><a class="bk" href="./" title="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><div id="logo"><i>💻</i>Rival Code</div><div class="sp"></div>
  <div class="tabs"><button data-v="make" class="on">✏️ Make</button><button data-v="play">🎮 Play</button><button data-v="mine">📁 My games</button><button data-v="learn">📘 Learn</button></div></div>
<main id="main"></main>
<div id="player"><div class="bar"><button class="btn g" id="pX">✕ Close</button><b id="pT"></b><button class="btn g" id="pL">❤️ <span></span></button><button class="btn g" id="pC">👀 See the code</button><button class="btn g" id="pR">↻</button></div><iframe id="pF" sandbox="allow-scripts allow-pointer-lock" title="Player game"></iframe></div>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SRV=(()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })();
  const pid=()=>{ try{ let p=localStorage.getItem('rrPid'); if(!p||p.length<8){ p=Math.random().toString(36).slice(2,14); localStorage.setItem('rrPid',p); } return p; }catch(e){ return ''; } };
  const name=()=>{ try{ return localStorage.getItem('rrOnlineName')||'Player'; }catch(e){ return 'Player'; } };
  const post=(u,b)=>fetch(SRV+u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({pid:pid(),name:name()},b||{}))}).then(r=>r.json()).catch(()=>({err:'net'}));
  const get=u=>fetch(SRV+u).then(r=>r.json()).catch(()=>({err:'net'}));
  const LS={get(k,d){ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
  const MAX=150000;
  /* ---------- starter templates ---------- */
  const T={
    dodge:{title:'Dodge the Blocks',emoji:'🟥',html:'<canvas id="c" width="480" height="360"></canvas>\n<p id="info">Arrow keys or A/D to move. Dodge the falling blocks!</p>',
      css:'body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center}\ncanvas{background:#111827;border-radius:12px;max-width:100%}',
      js:`const c = document.getElementById('c');
const ctx = c.getContext('2d');
let player = { x: 220, w: 40, speed: 6 };
let blocks = [];
let score = 0, alive = true;
const keys = {};
addEventListener('keydown', e => keys[e.key] = true);
addEventListener('keyup', e => keys[e.key] = false);

function loop() {
  if (!alive) return;
  if (keys.ArrowLeft || keys.a) player.x -= player.speed;
  if (keys.ArrowRight || keys.d) player.x += player.speed;
  player.x = Math.max(0, Math.min(c.width - player.w, player.x));

  // make new blocks, faster as your score goes up
  if (Math.random() < 0.04 + score / 20000) {
    blocks.push({ x: Math.random() * (c.width - 30), y: -30, s: 2 + Math.random() * 3 + score / 500 });
  }
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(player.x, c.height - 30, player.w, 20);
  ctx.fillStyle = '#ef4444';
  for (const b of blocks) {
    b.y += b.s;
    ctx.fillRect(b.x, b.y, 30, 30);
    if (b.y + 30 > c.height - 30 && b.y < c.height - 10 && b.x < player.x + player.w && b.x + 30 > player.x) alive = false;
  }
  blocks = blocks.filter(b => b.y < c.height);
  score++;
  ctx.fillStyle = '#fff';
  ctx.font = '20px sans-serif';
  ctx.fillText('Score: ' + score, 10, 26);
  if (!alive) ctx.fillText('Game over! Press Run to play again', 80, 180);
  requestAnimationFrame(loop);
}
loop();
console.log('Game started!');`},
    click:{title:'Target Clicker',emoji:'🎯',html:'<h1>🎯 Click the target!</h1>\n<p>Score: <b id="score">0</b> · Time: <b id="time">20</b></p>\n<div id="area"><button id="target">🎯</button></div>',
      css:'body{font-family:sans-serif;text-align:center;background:#fef3c7;margin:0}\n#area{position:relative;height:300px;margin:10px;background:#fde68a;border-radius:16px}\n#target{position:absolute;font-size:36px;border:0;background:none;cursor:pointer}',
      js:`let score = 0, time = 20;
const target = document.getElementById('target');
const area = document.getElementById('area');

function move() {
  target.style.left = Math.random() * (area.clientWidth - 50) + 'px';
  target.style.top = Math.random() * (area.clientHeight - 50) + 'px';
}
target.onclick = () => {
  if (time <= 0) return;
  score++;
  document.getElementById('score').textContent = score;
  move();
};
const timer = setInterval(() => {
  time--;
  document.getElementById('time').textContent = time;
  if (time <= 0) { clearInterval(timer); alert('Time is up! You scored ' + score); }
}, 1000);
move();`},
    blank:{title:'',emoji:'🎮',html:'<h1>My game</h1>\n',css:'body{font-family:sans-serif}\n',js:'// Your code here\n'}
  };
  /* ---------- the sandboxed runner: player code never touches this site (no cookies, no saved data, no internet) ---------- */
  const bridge=`(function(){ const send=(t,a)=>{ try{ parent.postMessage({rrcode:1,t,m:Array.from(a).map(x=>{ try{ return typeof x==='object'?JSON.stringify(x):String(x); }catch(e){ return String(x); } }).join(' ').slice(0,300)},'*'); }catch(e){} };
    ['log','warn','error','info'].forEach(k=>{ const o=console[k]; console[k]=function(){ send(k,arguments); o&&o.apply(console,arguments); }; });
    addEventListener('error',e=>send('error',[e.message+(e.lineno>window.__OFF?' (game.js line '+(e.lineno-window.__OFF)+')':'')]));
    try{ const mem={}; Object.defineProperty(window,'localStorage',{value:{getItem:k=>k in mem?mem[k]:null,setItem:(k,v)=>{mem[k]=String(v)},removeItem:k=>{delete mem[k]},clear:()=>{for(const k in mem)delete mem[k]}}}); }catch(e){} })();`;
  const CSP="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:";
  const build=g=>{ const pre=`<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="${CSP}"><meta name="viewport" content="width=device-width,initial-scale=1"><script>${bridge}<\/script><style>${String(g.css||'').replace(/<\/style/gi,'<\\/style')}</style></head><body>${g.html||''}<script>`;
    return pre.replace('<script>(function(){','<script>window.__OFF='+(pre.split('\n').length-1)+';(function(){')+`${String(g.js||'').replace(/<\/script/gi,'<\\/script')}\n<\/script></body></html>`; };
  /* ---------- views ---------- */
  let view='make', cur=LS.get('rrCodeDraft',null)||Object.assign({},T.dodge), ftab='js';
  const save=()=>LS.set('rrCodeDraft',cur);
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
  function show(v){ view=v; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); ({make,play,mine,learn})[v](); }
  function make(){ $('main').innerHTML=`<div class="ed"><div>
      <div class="row" style="margin-bottom:8px"><div class="ftabs"><button data-f="html">index.html</button><button data-f="css">style.css</button><button data-f="js">game.js</button></div><div style="flex:1"></div>
        <select id="tpl" title="Start from a template"><option value="">📄 Start from…</option><option value="dodge">🟥 Dodge game (canvas)</option><option value="click">🎯 Clicker game</option><option value="blank">⬜ Blank page</option></select></div>
      <div class="code"><div class="gut" id="gut"></div><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>
      <div class="note" id="size" style="margin-top:6px"></div></div>
    <div><div class="row" style="margin-bottom:8px"><button class="btn" id="run">▶ Run</button><label class="note"><input type="checkbox" id="auto" ${LS.get('rrCodeAuto',true)?'checked':''}> Run as I type</label><div style="flex:1"></div><button class="btn g" id="full">⛶ Big</button></div>
      <div class="prev"><iframe id="pv" sandbox="allow-scripts allow-pointer-lock" title="Preview"></iframe></div>
      <div id="con"><span class="note">console.log() messages and errors show here</span></div>
      <div class="card" style="margin-top:12px"><h3>📨 Send it to be added to the site</h3>
        <div class="row"><input id="em" maxlength="4" style="width:58px;text-align:center;font-size:20px" title="Emoji"><input id="ti" maxlength="40" placeholder="Game name" style="flex:1"></div>
        <textarea id="de" maxlength="200" rows="2" placeholder="How to play (keys, goal)" style="width:100%;margin-top:8px;resize:vertical"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn" id="send">📨 Send for approval</button><span class="note" id="sm">The owner checks every game before it goes on the site.</span></div></div></div></div>`;
    const ta=$('ta'), gut=$('gut');
    const lines=()=>{ const n=ta.value.split('\n').length; gut.textContent=Array.from({length:n},(_,i)=>i+1).join('\n'); gut.scrollTop=ta.scrollTop; };
    const setTab=f=>{ ftab=f; document.querySelectorAll('.ftabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===f)); ta.value=cur[f]||''; lines(); };
    const sz=()=>{ const n=(cur.html||'').length+(cur.css||'').length+(cur.js||'').length; $('size').textContent=`${n.toLocaleString()} / ${MAX.toLocaleString()} characters`+(cur.remixOf?` · remix of “${cur.remixOf}”`:''); $('size').style.color=n>MAX?'#fca5a5':''; };
    document.querySelectorAll('.ftabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.f)); setTab(ftab);
    $('em').value=cur.emoji||'🎮'; $('ti').value=cur.title||''; $('de').value=cur.desc||'';
    ['em','ti','de'].forEach(id=>$(id).oninput=()=>{ cur.emoji=$('em').value; cur.title=$('ti').value; cur.desc=$('de').value; save(); });
    let rt=0; ta.oninput=()=>{ cur[ftab]=ta.value; save(); lines(); sz(); if($('auto').checked){ clearTimeout(rt); rt=setTimeout(run,700); } };
    ta.onscroll=()=>{ gut.scrollTop=ta.scrollTop; };
    ta.onkeydown=e=>{ if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart; ta.setRangeText('  ',s,ta.selectionEnd,'end'); ta.oninput(); }
      if(e.key==='Enter'){ const s=ta.selectionStart, ln=ta.value.slice(0,s).split('\n').pop(), ind=(ln.match(/^\s*/)||[''])[0]+(/[{(\[]\s*$/.test(ln)?'  ':''); e.preventDefault(); ta.setRangeText('\n'+ind,s,ta.selectionEnd,'end'); ta.oninput(); }
      if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); run(); } };
    $('auto').onchange=()=>LS.set('rrCodeAuto',$('auto').checked);
    $('tpl').onchange=()=>{ const k=$('tpl').value; if(!k) return; if(!confirm('Replace your code with this template?')){ $('tpl').value=''; return; } cur=JSON.parse(JSON.stringify(T[k])); save(); make(); };
    $('run').onclick=run; $('full').onclick=()=>openPlayer({title:cur.title||'My game',code:cur},true);
    $('send').onclick=async()=>{ cur.title=$('ti').value.trim(); cur.desc=$('de').value.trim(); cur.emoji=$('em').value.trim()||'🎮'; save();
      if(!cur.title) return $('sm').textContent='Give your game a name first.';
      const n=(cur.html||'').length+(cur.css||'').length+(cur.js||'').length; if(n>MAX) return $('sm').textContent='Your code is too long. Make it shorter first.';
      $('send').disabled=true; $('sm').textContent='Sending…';
      const r=await post('/cd/submit',{game:{title:cur.title,emoji:cur.emoji,desc:cur.desc,html:cur.html||'',css:cur.css||'',js:cur.js||'',remixOf:cur.remixOf||''}});
      $('send').disabled=false; $('sm').textContent=r.ok?'📨 Sent! The owner will check it. See it in 📁 My games.':({title:'Please pick a friendlier name or description.',many:'You can send up to 5 games a day.',big:'Your code is too long.',bad:'Something is missing. Check the name.'}[r.err]||'Could not send it. Try again.'); };
    sz(); run(); }
  function run(){ const f=$('pv'); if(!f) return; $('con').innerHTML='<span class="note">Tip: click the game to use the keyboard.</span>'; f.srcdoc=build(cur); }
  addEventListener('message',e=>{ const d=e.data; if(!d||d.rrcode!==1) return; const pv=$('pv'); if(!pv||e.source!==pv.contentWindow) return; const c=$('con'); const div=document.createElement('div'); div.className=d.t==='error'?'e':d.t==='warn'?'w':''; div.textContent=(d.t==='error'?'❌ ':d.t==='warn'?'⚠️ ':'› ')+d.m; c.appendChild(div); while(c.children.length>100) c.firstChild.remove(); c.scrollTop=c.scrollHeight; });
  /* ---------- gallery ---------- */
  const card=g=>`<div class="gc" data-id="${esc(g.id)}"><div class="em">${esc(g.emoji||'🎮')}</div><b>${esc(g.title)}</b><small>by ${esc(g.name)}</small><small>${esc(g.descr||'')}</small><small>▶ ${g.plays||0} · ❤️ ${g.likes||0}</small></div>`;
  async function play(){ $('main').innerHTML='<div class="card"><h3>🎮 Games made by players</h3><div class="row" style="margin-bottom:10px"><input id="gq" placeholder="Search…" style="flex:1"><select id="gs"><option value="new">Newest</option><option value="top">Most played</option><option value="like">Most liked</option></select></div><div class="gal" id="gal"><span class="note">Loading…</span></div></div>';
    const d=await get('/cd/list'); const all=(d&&d.games)||[];
    const draw=()=>{ const q=$('gq').value.trim().toLowerCase(), s=$('gs').value; let L=all.filter(g=>!q||(g.title+' '+g.name+' '+(g.descr||'')).toLowerCase().includes(q)); L=L.slice().sort((a,b)=>s==='top'?b.plays-a.plays:s==='like'?b.likes-a.likes:b.ts-a.ts);
      $('gal').innerHTML=L.length?L.map(card).join(''):'<span class="note">'+(all.length?'No games match.':'No games yet. Be the first! Make one in ✏️ Make.')+'</span>'; };
    $('gq').oninput=draw; $('gs').onchange=draw; draw();
    $('gal').onclick=e=>{ const c=e.target.closest('[data-id]'); if(c) openById(c.dataset.id); }; }
  async function mine(){ $('main').innerHTML='<div class="card"><h3>📁 Games you sent</h3><div class="gal" id="gal"><span class="note">Loading…</span></div></div>';
    const d=await get('/cd/mine?pid='+encodeURIComponent(pid())); const L=(d&&d.games)||[]; const paid=LS.get('rrCodePaid',[]);
    for(const g of L) if(g.st==='ok'&&!paid.includes(g.id)){ paid.push(g.id); try{ window.RRCOIN&&RRCOIN.add(150,'Rival Code: game approved'); }catch(e){} } LS.set('rrCodePaid',paid);
    $('gal').innerHTML=L.length?L.map(g=>`<div class="gc" data-id="${esc(g.id)}"><div class="em">${esc(g.emoji||'🎮')}</div><b>${esc(g.title)}</b><span class="st st-${g.st}">${{wait:'⏳ Waiting for approval',ok:'✅ On the site',no:'❌ Not approved'}[g.st]||g.st}</span><small>▶ ${g.plays||0} · ❤️ ${g.likes||0}</small></div>`).join(''):'<span class="note">You haven\'t sent any games yet. Approved games earn you 🪙 150.</span>';
    $('gal').onclick=e=>{ const c=e.target.closest('[data-id]'); if(c) openById(c.dataset.id); }; }
  function learn(){ $('main').innerHTML=`<div class="card"><h3>📘 How Rival Code works</h3><p class="note">Write a game with <b>HTML</b> (what's on the page), <b>CSS</b> (how it looks) and <b>JavaScript</b> (what it does). Press ▶ Run to test it. When it's ready, send it. The owner plays every game first, and approved games show up in 🎮 Play for everyone (and you get 🪙 150).</p>
    <p class="note"><b>Rules:</b> keep it friendly for school, make it your own work, no scary or mean stuff. Games run in a safe box: they can't use the internet, see accounts or change the site. Pictures must be drawn with code, emoji, or a canvas.</p></div>
    <div class="card"><h3>🧱 Handy code</h3><p class="note">Draw on a canvas:</p><pre class="ex">const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = 'red';
ctx.fillRect(10, 10, 50, 50);   // x, y, width, height</pre>
    <p class="note">Keyboard:</p><pre class="ex">addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') console.log('up!');
});</pre>
    <p class="note">Game loop (runs about 60 times a second):</p><pre class="ex">function loop() {
  // move things, then draw them
  requestAnimationFrame(loop);
}
loop();</pre>
    <p class="note">Random number from 0 to 9: <code>Math.floor(Math.random() * 10)</code> · Show a message: <code>console.log('hi')</code></p></div>`; }
  /* ---------- player ---------- */
  let open=null;
  async function openById(id){ const d=await get('/cd/get?id='+encodeURIComponent(id)); if(!d||d.err) return alert('That game could not be loaded.'); openPlayer(d,false); if(d.st==='ok') post('/cd/play',{id}); }
  function openPlayer(g,local){ open=g; $('player').style.display='flex'; $('pT').textContent=(g.emoji||'🎮')+' '+(g.title||'Game')+(g.name?' · by '+g.name:''); $('pF').srcdoc=build(g.code); $('pL').style.display=local||g.st!=='ok'?'none':''; $('pL').querySelector('span').textContent=g.likes||''; $('pC').style.display=local?'none':''; }
  $('pX').onclick=()=>{ $('player').style.display='none'; $('pF').srcdoc=''; open=null; };
  $('pR').onclick=()=>{ if(open) $('pF').srcdoc=build(open.code); };
  $('pL').onclick=async()=>{ if(!open) return; const r=await post('/cd/like',{id:open.id}); if(r&&r.ok){ open.likes=(open.likes||0)+(r.liked?1:-1); $('pL').querySelector('span').textContent=open.likes||''; } };
  $('pC').onclick=()=>{ if(!open) return; if(!confirm('Open this game\'s code in the editor? (Your current code will be replaced.)')) return; cur={title:'',emoji:open.emoji||'🎮',desc:'',html:open.code.html,css:open.code.css,js:open.code.js,remixOf:open.title}; save(); $('pX').onclick(); show('make'); };
  /* ---------- start ---------- */
  const q=new URLSearchParams(location.search); show(q.get('play')?'play':'make'); if(q.get('play')) openById(q.get('play'));
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
