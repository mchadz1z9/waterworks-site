<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0;padding:0;height:100%;background:#0a1d15}</style><style id="polish">canvas{filter:contrast(1.07) saturate(1.15) brightness(1.02)}body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.38) 100%),linear-gradient(180deg,rgba(255,244,214,.07),rgba(0,0,20,.05));z-index:5}</style></head><body>
<title>Arcade Rivals - Around The World Golf</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* A live 3D course fills the whole window. Home, lobby, locker room and round controls float over it as panels. Night-clubhouse greens with brass accents. */
:root{
  --ink:#0b1814; --panel:#12261f; --panel2:#1b382c; --line:#2d5a44; --chalk:#eef3e6; --muted:#9bb7a6;
  --turf:#4fae5a; --brass:#e3b948; --brass-ink:#2a2006; --water:#3b8fd4; --bad:#e8664d; --good:#66d17f;
  --glass:rgba(10,22,17,.78);
  --f-display:'Alfa Slab One','Rockwell','Georgia',serif;
  --f-body:'Barlow','Segoe UI',system-ui,sans-serif;
  --f-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--ink);color:var(--chalk);font:500 15px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,canvas:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3,p{margin:0}
#stage{position:fixed;inset:0;background:#0a1d15;touch-action:none}
#cv{position:absolute;inset:0;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:none;overflow:auto;padding:16px;z-index:5}
.screen.on{display:block}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:6px;padding:9px 16px;font:700 16px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{background:var(--panel2);color:var(--muted);cursor:default}
.btn.ghost{background:rgba(10,22,17,.55);color:var(--chalk);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--brass);filter:none}
.btn.ghost:disabled{background:transparent;color:var(--muted)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.big{min-width:170px;font-size:22px;letter-spacing:.14em;padding:12px 20px}
.muted{color:var(--muted)}
.coins{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass);padding:6px 14px;border-radius:999px;font:700 20px var(--f-ui);font-variant-numeric:tabular-nums}
.coin{display:inline-block;flex:none;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--brass) 55%,#a9822a)}
/* home */
#home{display:none;padding:0}
#home.on{display:flex;flex-direction:column;justify-content:space-between}
.hbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px}
.hbar .right{display:flex;gap:8px;align-items:center}
.hero{display:flex;gap:28px;align-items:flex-end;justify-content:space-between;padding:0 clamp(16px,4vw,56px) clamp(16px,4vh,40px);flex-wrap:wrap}
.title{max-width:560px}
.title .globe{width:62px;height:62px;margin-bottom:10px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.title h1{font:400 clamp(34px,6.4vw,76px)/.95 var(--f-display);letter-spacing:.01em;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.title h1 span{color:var(--brass)}
.title p{margin-top:10px;font:600 15px var(--f-ui);letter-spacing:.22em;text-transform:uppercase;color:#dbe8d6;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,430px)}
.menu .play{grid-column:1/-1;font-size:28px;letter-spacing:.18em;padding:16px}
.menu .btn{padding:13px 12px}
.me{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(6px)}
.me canvas{width:84px;height:92px;background:var(--panel2);border-radius:6px;flex:none}
.me b{font:400 18px var(--f-display)}
.crsname{position:absolute;right:18px;bottom:12px;font:600 13px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);text-shadow:0 1px 6px #000}
/* panels */
.wrap{max-width:1100px;margin:0 auto;padding-bottom:30px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:16px;backdrop-filter:blur(8px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h2{font:400 28px var(--f-display)}
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;margin-bottom:-1px;font:700 17px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--chalk);border-color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.card{background:rgba(18,38,31,.92);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font:400 20px/1.15 var(--f-display)}
.card .meta{font:600 14px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.card.locked{background:#0f211a}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.swatch{height:34px;border-radius:5px;border:1px solid rgba(255,255,255,.12)}
.dots{display:flex;gap:4px;align-items:center;font:600 13px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.dots i.on{background:var(--brass);border-color:var(--brass)}
.portrait{width:120px;height:130px;background:var(--panel2);border-radius:6px;flex:none}
.gtop{display:flex;gap:12px}
.gtop>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.gname{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ovr{flex:none;min-width:54px;text-align:center;border-radius:6px;padding:3px 7px;border:1px solid currentColor;line-height:1}
.ovr b{display:block;font:700 24px var(--f-ui);font-variant-numeric:tabular-nums}
.ovr span{font:700 10px var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.r-common{color:#9bb7a6}.r-rare{color:#4aa3df}.r-epic{color:#b36be8}.r-legend{color:#e3b948;background:rgba(227,185,72,.12)}
.stat-row em{font:700 14px var(--f-ui);font-style:normal;color:var(--chalk);text-align:right;font-variant-numeric:tabular-nums}
.stat-row{display:grid;grid-template-columns:70px 1fr 26px;gap:8px;align-items:center;font:600 13px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--turf)}
.perk{font-size:14px;color:var(--chalk)}
.sec{margin:22px 0 10px;font:400 20px var(--f-display)}
.sec:first-child{margin-top:0}
.tier .nums{display:flex;gap:14px;font:600 15px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap}
.tier .nums b{color:var(--chalk);font-weight:700}
.bag{width:100%;border-collapse:collapse;font:600 16px var(--f-ui);font-variant-numeric:tabular-nums}
.bag td,.bag th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
.bag th{color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.bagwrap{overflow-x:auto;background:rgba(18,38,31,.92);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.howto{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:rgba(18,38,31,.92);border:1px solid var(--line);border-radius:8px}
.howto ol{margin:0;padding-left:20px;display:flex;gap:6px 28px;flex-wrap:wrap}
/* lobby */
.lobbyg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:820px){.lobbyg{grid-template-columns:1fr}}
.rooms{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.room{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(27,56,44,.8);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.room b{font:700 18px var(--f-ui);letter-spacing:.05em}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.plist div{display:flex;align-items:center;gap:10px;background:rgba(27,56,44,.8);border-radius:6px;padding:8px 10px}
.plist i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.plist i.rdy{background:var(--good)}
.plist span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font:700 13px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text],select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.conn{font:600 13px var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.conn.on{color:var(--good)}.conn.off{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 15px var(--f-ui);letter-spacing:.04em}
.chip[aria-pressed=true]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.chip:disabled{opacity:.45;cursor:default}
.slider{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;margin:10px 0}
.slider label{font:700 14px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--brass)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
/* round view */
#round{position:fixed;inset:0;display:none;z-index:6;pointer-events:none}
#round.on{display:block}
#round>*{pointer-events:auto}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;pointer-events:none}
.hud>*{pointer-events:auto}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-width:0;backdrop-filter:blur(6px)}
.stat span{display:block;font:600 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat b{display:flex;align-items:center;font:700 20px/1.15 var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat em{font-style:normal}
.warrow{display:inline-block;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:13px solid var(--brass);margin-right:7px;transition:transform .3s}
.hudbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
#pstrip{position:absolute;left:10px;top:96px;display:flex;flex-direction:column;gap:4px;min-width:150px}
#pstrip .pl{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:600 15px var(--f-ui)}
#pstrip .pl.on{border-color:var(--brass)}
#pstrip .pl i{width:10px;height:10px;border-radius:50%;flex:none}
#pstrip .pl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:34px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(6,14,10,0),rgba(6,14,10,.82) 38%)}
.ctrl.quiet{background:none;pointer-events:none}.ctrl.quiet .clubs,.ctrl.quiet .meters,.ctrl.quiet .aim,.ctrl.quiet #swingBtn{display:none}.ctrl.quiet #btnSkip{pointer-events:auto}
.track.pw::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 24.4%,rgba(255,255,255,.6) 24.4% 25%)}
.ctrl.meterMode .clubs,.ctrl.meterMode .aim{display:none}
.ctrl.meterMode .meters{flex:1 1 280px;gap:16px}
.ctrl.meterMode .meter{grid-template-columns:100px 1fr 84px}
.ctrl.meterMode .track{margin:8px 0}
.ctrl.meterMode .meter label{font-size:16px}
.ctrl.meterMode .track{height:46px;border-radius:12px;border-width:2px}
.ctrl.meterMode .track b{width:9px;margin-left:-4px;top:-9px;bottom:-9px;border-radius:4px}
.ctrl.meterMode .meter>span{font-size:18px;white-space:nowrap}
.ctrl[data-ph=acc] .meter:first-child,.ctrl[data-ph=power] .meter:last-child{opacity:.5}
.ctrl.meterMode .ctrl-row{gap:10px}
.ctrl.cpuTurn .meters,.ctrl.cpuTurn .aim{opacity:.35;pointer-events:none}
.clubs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.club{flex:1 0 58px;background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:center;line-height:1.1}
.club b{display:block;font:700 18px var(--f-ui);letter-spacing:.06em}
.club small{font:600 13px var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.club.on{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.club.on small{color:var(--brass-ink)}
.ctrl-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-right:190px;min-height:64px}
#swingBtn{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:170px;height:64px;padding:0 6px;font-size:19px;letter-spacing:.06em;line-height:1.1}
.aim{display:flex;gap:6px}
.aimb{width:52px;padding:6px 0;font-size:28px;line-height:1;touch-action:none;user-select:none}
.meters{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px}
.meter{display:grid;grid-template-columns:78px 1fr 70px;gap:10px;align-items:center}
.meter label{font:700 14px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.meter>span{font:700 17px var(--f-ui);font-variant-numeric:tabular-nums;text-align:right}
.track{position:relative;height:24px;border-radius:5px;border:1px solid var(--line);overflow:visible}
.track.pw{background:linear-gradient(90deg,#ff6a1a 0 16%,#ff9f1c 16% 30%,#ffd21f 30% 46%,#8ee82a 46% 54%,#ffd21f 54% 68%,#ff9f1c 68% 83%,#ff4a1a 83% 100%)}
.track.ac{background:linear-gradient(90deg,#ff6a1a 0 14%,#ff9f1c 14% 27%,#ffd21f 27% 38%,#8ee82a 38% 62%,#ffd21f 62% 73%,#ff9f1c 73% 86%,#ff6a1a 86% 100%)}
.track.pw,.track.ac{border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.track i{position:absolute;right:0;top:0;bottom:0;width:100%;background:rgba(11,24,20,.6);border-radius:0 4px 4px 0}
.track em{position:absolute;top:0;bottom:0;left:50%;width:12%;transform:translateX(-50%);border-inline:2px solid #fff;background:rgba(255,255,255,.22)}
.track b{position:absolute;top:-4px;bottom:-4px;left:0;width:5px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #000}
.track b::before,.track b::after{content:'';position:absolute;left:50%;transform:translateX(-50%);border:8px solid transparent}
.track b::before,.track b::after{display:none}.ctrl.meterMode .track b::before,.ctrl.meterMode .track b::after{display:block}
.track b::before{top:-12px;border-top:12px solid #fff;border-bottom:0}
.track b::after{bottom:-12px;border-bottom:12px solid #fff;border-top:0}
.pinmk{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #000}
.result{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(88%,360px);background:rgba(11,24,20,.94);border:1px solid var(--brass);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.result h2{font:400 30px/1.1 var(--f-display);color:var(--brass)}
.result .earn{display:flex;align-items:center;gap:8px;font:700 24px var(--f-ui)}
.result .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.hrows{width:100%;display:flex;flex-direction:column;gap:4px;text-align:left}
.hrows div,.board div{display:flex;align-items:center;gap:8px;background:rgba(27,56,44,.8);border-radius:6px;padding:6px 10px;font:600 17px var(--f-ui)}
.hrows i,.board i{width:10px;height:10px;border-radius:50%;flex:none}
.hrows span,.board span{flex:1;min-width:0}
.hrows em,.board em{font-style:normal;color:var(--muted)}
.board{display:flex;flex-direction:column;gap:5px}
.orow{display:flex;gap:10px;align-items:center;padding:4px 0;font:600 16px var(--f-ui)}
.orow span{flex:1}
.banner{position:absolute;left:50%;top:28%;transform:translateX(-50%);padding:10px 26px;background:rgba(11,24,20,.88);border:1px solid var(--brass);border-radius:8px;font:700 26px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--brass);pointer-events:none;white-space:nowrap}
.banner.show{animation:bn 2.2s ease both}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-14px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);padding:9px 18px;border-radius:6px;background:var(--brass);color:var(--brass-ink);font:700 18px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.bad{background:var(--bad);color:#fff}
.toast.good{background:var(--good);color:#06240f}
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,10,7,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font:400 26px/1.1 var(--f-display)}
.sum{display:flex;gap:10px;flex-wrap:wrap}
.sum div{flex:1 1 110px;background:var(--panel2);border-radius:6px;padding:8px 12px}
.sum span{display:block;font:600 12px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sum b{font:700 24px var(--f-ui)}
.scwrap{overflow-x:auto}
.sc{border-collapse:collapse;width:100%;min-width:480px;font:600 16px var(--f-ui);text-align:center;font-variant-numeric:tabular-nums;margin-bottom:8px}
.sc th,.sc td{border:1px solid var(--line);padding:5px 4px}
.sc th{background:var(--panel2);color:var(--muted);letter-spacing:.08em;font-size:13px;text-transform:uppercase}
.sc td.eag{background:#e3b948;color:#2a2006}
.sc td.bir{background:#2f7d4a}
.sc td.bog{background:#4a2a24}
.sc td.dbl{background:#7a2e22}
@media (max-width:560px){
  .meter{grid-template-columns:64px 1fr 56px;gap:8px}
  #swingBtn{width:130px;font-size:18px}.ctrl-row{padding-right:146px}
  .stat b{font-size:17px}
  #pstrip{top:120px}
}
@media (prefers-reduced-motion:reduce){.warrow{transition:none}.banner.show{animation:none}}
</style>

<div id="stage"><canvas id="cv" tabindex="0" aria-label="Golf course view. Drag to aim."></canvas></div>

<section id="home" class="screen on">
  <div class="hbar">
    <div class="coins" title="Your coins"><span class="coin"></span><span id="coins">0</span></div>
    <div class="right"><button class="btn ghost sm" id="hSound" aria-label="Toggle sound">Sound</button><button class="btn ghost sm" data-go="settings">Settings</button></div>
  </div>

const KEEP_18=['standrews','pebble','augusta'];
const SOFT_TAGS=['coastL','coastR','bridge','windmill'];
function hardestNine(c){
  const base=[0,190,430,570];
  const score=c.par.map((p,i)=>{
    const tg=(c.tags[i+1]||[]).filter(t=>SOFT_TAGS.indexOf(t)<0).length;
    const st=(c.e[i]==='f'?0:.06);
    return{i,s:c.yds[i]/base[p]*(p===3?1.15:1)+tg*.13+st};
  });
  const idx=score.sort((a,b)=>b.s-a.s).slice(0,9).map(x=>x.i).sort((a,b)=>a-b);
  const pick=arr=>idx.map(i=>arr[i]);
  c.par=pick(c.par);c.yds=pick(c.yds);
  c.e=idx.map(i=>c.e[i]||'f').join('');c.dg=idx.map(i=>(c.dg||'')[i]||'S').join('');
  if(c.names)c.names=pick(c.names);
  const t={};idx.forEach((o,n)=>{if(c.tags[o+1])t[n+1]=c.tags[o+1]});c.tags=t;
  c.holes=9;c.total=c.yds.reduce((a,b)=>a+b,0);c.parTotal=c.par.reduce((a,b)=>a+b,0);
}

  if(par>=4&&fun>0&&rnd()<.55*fun&&course.trees>0){

/* ----- path projection: distance, signed offset (right is positive) and fraction along ----- */
function pathCoord(h,x,y){
  const P=h.path;let best=1e9,bo=0,bt=0;
  for(let i=0;i<P.length-1;i++){
    const a=P[i],b=P[i+1],vx=b.x-a.x,vy=b.y-a.y,L=vx*vx+vy*vy;
    let u=L?((x-a.x)*vx+(y-a.y)*vy)/L:0;const uc=clamp(u,0,1);
    const px=a.x+vx*uc,py=a.y+vy*uc,dx=x-px,dy=y-py,d=dx*dx+dy*dy;
    if(d<best){const m=Math.sqrt(L)||1;best=d;bo=((x-a.x)*(-vy)+(y-a.y)*vx)/m;bt=(i+uc)/(P.length-1)}
  }
  return{d:Math.sqrt(best),o:bo,t:bt};
}
function surfaceAt(h,x,y,pc){
  for(const e of h.water)if(inEll(e,x,y))return'water';
  for(const e of h.sand)if(inEll(e,x,y))return'sand';
  const dg=Math.hypot(x-h.gx,y-h.gy);
  if(dg<=h.gr)return'green';
  if(dg<=h.gr+3.5)return'fringe';
  if(h.island&&dg<h.gr+11)return'water';
  if(h.plateau&&dg<=h.gr+9)return'deep';
  pc=pc||pathCoord(h,x,y);
  const d=pc.d;
  if(h.sea&&pc.o*h.sea.side-h.sea.edge>7)return'water';
  if(x>-6&&x<6&&y>-4&&y<6&&d<=h.fw/2)return'tee';
  if(d<=h.fw/2)return'fairway';
  if(h.ob.L&&pc.o<0&&d>h.fw/2+16)return'oob';
  if(h.ob.R&&pc.o>0&&d>h.fw/2+16)return'oob';
  if(h.ob.G&&pc.t>=.999&&(y<h.gy-h.gr-12))return'oob';
  if(d<=h.fw/2+22)return'rough';
  if(d<=h.fw/2+62)return'deep';
  return'oob';
}
function waterKind(h,x,y){
  for(const e of h.water)if(inEll(e,x,y))return e.kind||'water';
  if(h.sea){const pc=pathCoord(h,x,y);if(pc.o*h.sea.side-h.sea.edge>7)return'sea'}
  return'water';
}
function waterNote(kind,rolled){
  const tail=rolled?'Rolled into ':'';
  if(kind==='sea')return tail+(rolled?'the ocean. Penalty stroke':'Into the ocean! Penalty stroke');
  if(kind==='rock')return rolled?'Rolled into the quarry. Penalty stroke':'Lost in the quarry. Penalty stroke';
  if(kind==='chasm')return rolled?'Rolled into the gorge. Penalty stroke':'Into the gorge! Penalty stroke';
  if(kind==='creek')return rolled?'Rolled into the burn. Penalty stroke':'In the creek. Penalty stroke';
  return rolled?'Rolled into the water. Penalty stroke':'Splash! Penalty stroke';
}

/* ----- terrain heights on a 2 yard grid ----- */
const EL_PROF={
  f:t=>0,
  u:t=>2.4*t,
  d:t=>-2.4*t,
  g:t=>1.7*sstep(.78,.98,t),
  b:t=>1.6*Math.sin(Math.PI*clamp((t-.3)/.4,0,1)),
  v:t=>-1.5*Math.sin(Math.PI*clamp((t-.5)/.42,0,1))+.9*sstep(.86,1,t)
};
function ensureTerrain(h){
  if(h.T)return h;
  const step=2,rnd=mulberry32(h.seed),ph=[];for(let i=0;i<10;i++)ph.push(rnd()*6.283);
  let mnx=1e9,mxx=-1e9;for(const p of h.path){mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x)}
  const ext=h.fw/2+175,x0=mnx-ext,x1=mxx+ext,y0=-h.len-150,y1=80;
  const W=Math.ceil((x1-x0)/step)+1,Hh=Math.ceil((y1-y0)/step)+1;
  const arr=new Float32Array(W*Hh),amp=h.amp,prof=EL_PROF[h.ech]||EL_PROF.f,dunes=h.relief==='dunes';
  const noise=(x,y)=>{
    let n=.55*Math.sin(x*.021+ph[0])*Math.cos(y*.017+ph[1])+.4*Math.sin((x+y*.7)*.043+ph[2])+.22*Math.sin(x*.09+y*.07+ph[3]);
    if(dunes)n+=.8*Math.sin(x*.052+ph[4])*Math.sin(y*.04+ph[5])+.35*Math.sin((x-y)*.085+ph[6]);
    return n*amp;
  };
  const plat=h.plateau?2.2:0;
  const baseAt=(x,y,pc)=>{
    pc=pc||pathCoord(h,x,y);
    const dg=Math.hypot(x-h.gx,y-h.gy),dt=Math.hypot(x,y);
    let nz=noise(x,y);
    nz*=1-.55*(1-sstep(h.fw/2,h.fw/2+20,pc.d));
    nz*=sstep(6,40,dt)*sstep(h.gr+2,h.gr+30,dg);
    let v=amp*prof(pc.t)+nz;
    if(plat)v+=plat*(1-sstep(h.gr-1,h.gr+7,dg));
    return v;
  };
  const gH=baseAt(h.gx,h.gy);
  h.gH=gH;
  const cl=h.ccol;
  for(let j=0;j<Hh;j++){
    const y=y0+j*step;
    for(let i=0;i<W;i++){
      const x=x0+i*step,pc=pathCoord(h,x,y);
      let v=baseAt(x,y,pc);
      if(h.mounds)for(const m of h.mounds){const ddx=x-m.x,ddy=y-m.y,q2=ddx*ddx+ddy*ddy;if(q2<m.r*m.r*5)v+=m.h*Math.exp(-q2/(m.r*m.r))}
      const dxg=x-h.gx,dyg=y-h.gy,dg=Math.hypot(dxg,dyg);
      if(dg<h.gr+6){
        const w=1-sstep(h.gr*.85,h.gr+5,dg);
        const plane=gH+(plat?plat:0)*0+(-h.slope.x*dxg-h.slope.y*dyg)/10.7+.05*Math.sin(dxg*.33+ph[7])*Math.sin(dyg*.29+ph[8]);
        v=lerp(v,plane,w);
      }
      for(const e of h.sand){
        if(Math.abs(x-e.x)>e.rx+e.ry+2||Math.abs(y-e.y)>e.rx+e.ry+2)continue;
        const q=ellQ(e,x,y);if(q>1.15)continue;
        const dep=e.kind==='pot'||e.kind==='big'||e.kind==='pews'?.9:e.kind==='waste'?.15:.4;
        v-=dep*(1-sstep(.5,1.1,q));
      }
      for(const e of h.water){
        if(Math.abs(x-e.x)>e.rx+e.ry+2||Math.abs(y-e.y)>e.rx+e.ry+2)continue;
        const q=ellQ(e,x,y);if(q>1.2)continue;
        const dep=e.kind==='chasm'?10:e.kind==='rock'?6:e.creek?.7:1;
        v-=dep*(1-sstep(.62,1.05,q));
      }
      if(h.sea){const ds=pc.o*h.sea.side-h.sea.edge;if(ds>0)v-=9*sstep(0,12,ds)}
      arr[j*W+i]=v;
    }
  }
  h.T={x0,y0,step,W,H:Hh,a:arr};
  return h;
}
function heightAt(h,x,y){
  const T=h.T;if(!T)return 0;
  let fx=(x-T.x0)/T.step,fy=(y-T.y0)/T.step;
  fx=clamp(fx,0,T.W-1.001);fy=clamp(fy,0,T.H-1.001);
  const i=fx|0,j=fy|0,u=fx-i,v=fy-j,a=T.a,W=T.W,k=j*W+i;
  return (a[k]*(1-u)+a[k+1]*u)*(1-v)+(a[k+W]*(1-u)+a[k+W+1]*u)*v;
}
function gradAt(h,x,y){return{x:(heightAt(h,x+1,y)-heightAt(h,x-1,y))/2,y:(heightAt(h,x,y+1)-heightAt(h,x,y-1))/2}}

/* ----- trees (collision) ----- */
function indexTrees(h){
  if(h.tg)return;
  const g=new Map();
  for(const t of h.trees){const k=Math.floor(t.x/10)+','+Math.floor(t.y/10);(g.get(k)||g.set(k,[]).get(k)).push(t)}
  h.tg=g;
}
function treeHit(h,x,y,alt){
  if(!h.tg)indexTrees(h);
  const cx0=Math.floor(x/10),cy0=Math.floor(y/10);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const L=h.tg.get((cx0+i)+','+(cy0+j));if(!L)continue;
    for(const t of L){
      const dx=x-t.x,dy=y-t.y,rr=t.r*.78;
      if(dx*dx+dy*dy<rr*rr){
        const g=heightAt(h,t.x,t.y);
        if(alt<g+t.H&&alt>g+.15)return t;
      }
    }
  }
  return null;
}
function dryDrop(h,from,start){
  const dx=start.x-from.x,dy=start.y-from.y,m=Math.hypot(dx,dy)||1;
  for(let d=0;d<m+1;d+=1){
    const x=from.x+dx/m*d,y=from.y+dy/m*d,s=surfaceAt(h,x,y);
    if(s!=='water'&&s!=='oob')return{x:x+dx/m*2.5,y:y+dy/m*2.5};
  }
  return{x:start.x,y:start.y};
}
function scoreName(s,par){
  if(s===1)return'Hole in one!';
  const d=s-par;
  return d<=-3?'Albatross':d===-2?'Eagle':d===-1?'Birdie':d===0?'Par':d===1?'Bogey':d===2?'Double bogey':d===3?'Triple bogey':'+'+d;
}
function fmtDiff(d){return d===0?'E':d>0?'+'+d:String(d)}
/* ---------- Ball physics: flight with drag, wind and curve, bounces, terrain roll, putts ---------- */
const GRAV=10.7,KD=.0026,DT=1/60;
const FRIC={fairway:1.35,tee:1.35,fringe:1.05,rough:4.6,deep:9,sand:15,oob:9,green:0};
const BOUNCE={fairway:[.38,.86],tee:[.38,.86],fringe:[.32,.8],green:[.3,.78],rough:[.12,.5],deep:[.06,.3],sand:[0,0],oob:[.06,.3]};
const FRICV={fairway:.35,tee:.35,fringe:.2,rough:.3,deep:.5,sand:.5,oob:.5};
const _cal={};
function launchAng(club){return Math.atan(3.6*(club.loft||.15))}
/* flat no-wind carry for a launch speed */
function flatCarry(speed,th){
  let x=0,z=0,vx=speed*Math.cos(th),vz=speed*Math.sin(th),t=0;
  while(t<20){
    const sp=Math.hypot(vx,vz);
    vx+=-KD*sp*vx*DT;vz+=(-GRAV-KD*sp*vz)*DT;x+=vx*DT;z+=vz*DT;t+=DT;
    if(z<=0&&t>.1)return{d:x,T:t};
  }
  return{d:x,T:t};
}
function calibrate(club,carry){
  const key=club.id+':'+Math.round(carry*2);
  if(_cal[key])return _cal[key];
  const th=launchAng(club);let lo=5,hi=160;
  for(let i=0;i<16;i++){const m=(lo+hi)/2;if(flatCarry(m,th).d<carry)lo=m;else hi=m}
  const sp=(lo+hi)/2,f=flatCarry(sp,th);
  return _cal[key]={speed:sp,th,T:f.T};
}
function spinK(club){return Math.max(0,((club.loft||.15)-.14))*14}
function cupInfo(){return{r:.5,v:3.2}}

/* One shot, start to finish. p: yaw, carry, club, curve (yards of drift), wmul, cupR; roll=true for putts (carry = speed). */
function simBall(h,from,p){
  const club=p.club,cupR=p.cupR||.5;
  let x=from.x,y=from.y,g0=heightAt(h,x,y),z=g0+(p.putt?0:.12),vx,vy,vz,mode;
  const pts=[0,x,y,z],ev=[];
  const wm=(p.wmul==null?1:p.wmul),wx=h.wind.x*h.wind.mph*.488*wm,wy=h.wind.y*h.wind.mph*.488*wm;
  let curve=0,sk=spinK(club);
  if(p.putt){mode='roll';const hs=p.speed;vx=Math.sin(p.yaw)*hs;vy=-Math.cos(p.yaw)*hs;vz=0;}
  else{
    mode='air';const cal=calibrate(club,p.carry),hs=cal.speed*Math.cos(cal.th);
    vx=Math.sin(p.yaw)*hs;vy=-Math.cos(p.yaw)*hs;vz=cal.speed*Math.sin(cal.th);
    curve=2*(p.curve||0)/(cal.T*cal.T);
  }
  let landIdx=0,t=0,bounces=0,tree=false,landed=null,holed=false,water=null,steps=0;
  const firm=h.firm||1;
  while(t<40){
    t+=DT;steps++;
    if(mode==='air'){
      const rx=vx-wx,ry=vy-wy,rz=vz,sp=Math.sqrt(rx*rx+ry*ry+rz*rz);
      let ax=-KD*sp*rx,ay=-KD*sp*ry;const az=-GRAV-KD*sp*rz;
      if(curve){const hv=Math.hypot(vx,vy)||1;ax+=curve*(-vy/hv);ay+=curve*(vx/hv)}
      vx+=ax*DT;vy+=ay*DT;vz+=az*DT;x+=vx*DT;y+=vy*DT;z+=vz*DT;
      if(!tree&&h.trees.length){
        const tr=treeHit(h,x,y,z);
        if(tr){tree=true;ev.push([t,'t',1]);vx*=.12;vy*=.12;vz=-Math.abs(vz)*.2-1;curve=0}
      }
      const g=heightAt(h,x,y);
      if(z<=g&&vz<0){
        const s=surfaceAt(h,x,y);
        z=g;
        if(!landed){landed={x,y,s};landIdx=pts.length}
        if(s==='water'){water=waterKind(h,x,y);ev.push([t,'w',1]);pts.push(t,x,y,z);break}
        const gr=gradAt(h,x,y),nn=Math.sqrt(1+gr.x*gr.x+gr.y*gr.y),nx=-gr.x/nn,ny=-gr.y/nn,nz=1/nn;
        const vn=vx*nx+vy*ny+vz*nz,tx=vx-vn*nx,ty=vy-vn*ny,tz=vz-vn*nz;
        const B=BOUNCE[s]||BOUNCE.rough,e=B[0]*Math.pow(firm,.5),kt0=1-(1-B[1])/firm;
        const tm=Math.hypot(tx,ty,tz)||1,ratio=Math.abs(vn)/tm;
        const kt=kt0/(1+(sk+.9)*ratio*(s==='fairway'||s==='tee'?1:1.3));
        sk*=.45;bounces++;ev.push([t,s==='sand'?'s':'b',Math.min(1.4,Math.abs(vn)/35)]);
        if(s==='sand'){vx=vy=0;vz=0;mode='roll'}
        else{
          vx=tx*kt-vn*nx*e;vy=ty*kt-vn*ny*e;vz=tz*kt-vn*nz*e;
          if(Math.abs(vn)*e<1.5||bounces>7){mode='roll';vz=0}
        }
      }
      if(steps%3===0||mode==='roll'||water)pts.push(t,x,y,z);
    }else{
      /* rolling on the terrain */
      const sp=Math.hypot(vx,vy);
      const s=(steps%3===0||!p._s)?surfaceAt(h,x,y):p._s;p._s=s;
      if(s==='water'){water=waterKind(h,x,y);ev.push([t,'w',1]);const g=heightAt(h,x,y);z=g;pts.push(t,x,y,z);break}
      const gr=gradAt(h,x,y);
      let fr=s==='green'?.6*10/(h.stimp||11):(FRIC[s]||2)/Math.pow(firm,.6)+(FRICV[s]||.3)*sp/Math.pow(firm,.4);
      const sm=p.putt&&(s==='green'||s==='fringe')?.12:1,ax0=-GRAV*gr.x*sm,ay0=-GRAV*gr.y*sm,sa=Math.hypot(ax0,ay0);
      vx+=ax0*DT;vy+=ay0*DT;
      const sp2=Math.hypot(vx,vy),red=fr*DT;
      if(sp2<=red){vx=vy=0;if(sa<=fr*1.02){pts.push(t,x,y,z);break}}
      else{const k=(sp2-red)/sp2;vx*=k;vy*=k}
      x+=vx*DT;y+=vy*DT;
      const g=heightAt(h,x,y);z=g;
      if(h.trees.length){const tr=treeHit(h,x,y,g+.5);if(tr){vx*=-.2;vy*=-.2}}
      const dp=Math.hypot(x-h.pin.x,y-h.pin.y);
      const spd=Math.hypot(vx,vy);
      if(dp<cupR&&spd<2.8&&(s==='green'||s==='fringe')){holed=true;ev.push([t,'c',1]);pts.push(t,h.pin.x,h.pin.y,heightAt(h,h.pin.x,h.pin.y)-.3);break}
      if(steps%2===0)pts.push(t,x,y,z);
    }
  }
  const last=pts.length-4;
  const end=holed?{x:h.pin.x,y:h.pin.y}:{x:pts[last+1],y:pts[last+2]};
  const r={pts,ev,landIdx,end,land:landed?{x:landed.x,y:landed.y}:end,tree,holed,water,penalty:0,note:'',drop:null,final:end,surf:'',bounces,dur:t,yaw:p.yaw};
  if(holed){r.surf='green';return r}
  if(water){r.penalty=1;r.surf='water';r.note=waterNote(water,!!(landed&&mode==='roll'&&!(landed.s==='water')));r.final=dryDrop(h,end,from)}
  else{
    const s=surfaceAt(h,end.x,end.y);r.surf=s;
    if(s==='oob'){r.penalty=1;r.note='Out of bounds. Hit again';r.final={x:from.x,y:from.y};r.drop='replay'}
    else if(tree)r.note='Hit a tree';
  }
  return r;
}
/* putt speed for a target distance on a green of this speed */
function puttSpeed(h,dist){const a=.6*10/(h.stimp||11);return Math.sqrt(2*a*dist)}
/* ---------- Golfer sprites (side view, used by portraits and the map view) ---------- */
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
/* Feet at (x,y), facing right. sw runs from -1 (top of backswing) through 0 (address) to 1 (finish). */
function drawGolfer(c,g,x,y,s,sw){
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(4,1,17,4,0,0,6.283);c.fill();
  c.fillStyle=g.overalls?'#3a62a8':g.pants;
  rrect(c,-7,-28,6,27,2);c.fill();rrect(c,1,-28,6,27,2);c.fill();
  c.fillStyle='#1b1b1b';rrect(c,-9,-4,10,5,2);c.fill();rrect(c,0,-4,11,5,2);c.fill();
  c.fillStyle=g.shirt;rrect(c,-9,-52,18,27,5);c.fill();
  if(g.overalls){
    c.fillStyle='#3a62a8';rrect(c,-9,-38,18,16,3);c.fill();c.fillRect(-7,-52,3,16);c.fillRect(4,-52,3,16);
    c.fillStyle='#e3b948';c.beginPath();c.arc(-5.5,-37,1.7,0,6.283);c.arc(5.5,-37,1.7,0,6.283);c.fill();
    c.strokeStyle='#27457d';c.lineWidth=1;c.strokeRect(-4,-33,8,6);
  }
  if(g.robot){
    c.fillStyle=g.skin;rrect(c,-8,-70,18,16,3);c.fill();
    c.fillStyle='#0d1a22';rrect(c,0,-66,9,6,2);c.fill();
    c.fillStyle=g.hat;c.beginPath();c.arc(6,-63,2,0,6.283);c.fill();
    c.strokeStyle=g.skin;c.lineWidth=1.5;c.beginPath();c.moveTo(1,-70);c.lineTo(1,-76);c.stroke();
    c.fillStyle=g.hat;c.beginPath();c.arc(1,-77,2,0,6.283);c.fill();
  }else{
    c.fillStyle=g.skin;c.beginPath();c.arc(1,-61,8,0,6.283);c.fill();
    c.fillStyle='#1d1d1d';c.beginPath();c.arc(5,-61,1.2,0,6.283);c.fill();
    const hs=g.hatStyle;
    if(hs==='cap'){c.fillStyle=g.hat;c.beginPath();c.arc(1,-62,8.5,Math.PI,0);c.fill();rrect(c,3,-63,11,3,1.5);c.fill()}
    else if(hs==='visor'){c.fillStyle=g.hair;c.beginPath();c.arc(1,-62,8.5,Math.PI,0);c.fill();c.fillStyle=g.hat;c.fillRect(-7.5,-65,17,3);rrect(c,3,-63,11,3,1.5);c.fill()}
    else if(hs==='sunhat'){c.fillStyle=g.hair;c.beginPath();c.arc(1,-60,9,Math.PI*.9,Math.PI*2.1);c.fill();c.fillStyle=g.hat;c.beginPath();c.ellipse(1,-66,17,4,0,0,6.283);c.fill();c.beginPath();c.arc(1,-66,7.5,Math.PI,0);c.fill();c.fillStyle=g.shirt;c.fillRect(-6.5,-68,15,2)}
    else if(hs==='bucket'){c.fillStyle=g.hat;rrect(c,-7.5,-73,17,10,3);c.fill();c.fillRect(-11,-65,24,3.2)}
    else if(hs==='headband'){c.fillStyle=g.hair;c.beginPath();c.arc(1,-62,8.6,Math.PI,0);c.fill();c.fillRect(-7.6,-62,5,12);c.fillStyle=g.hat;c.fillRect(-7.5,-65,17,2.6)}
    else{c.fillStyle=g.hair;c.beginPath();c.arc(1,-63,8.4,Math.PI*1.02,Math.PI*1.98);c.fill()}
    if(g.glasses){c.strokeStyle='#222';c.lineWidth=1.2;c.beginPath();c.arc(4.5,-61,3,0,6.283);c.stroke();c.moveTo(-6,-61);c.lineTo(1.5,-61);c.stroke()}
  }
  const addr=.55,back=-2.5,fin=2.3;
  const a=sw<0?lerp(addr,back,-sw):lerp(addr,fin,sw);
  const sx=1,sy=-46,hx=sx+Math.sin(a)*15,hy=sy+Math.cos(a)*15,tx=hx+Math.sin(a)*33,ty=hy+Math.cos(a)*33;
  c.lineCap='round';
  c.strokeStyle=g.skin;c.lineWidth=4.6;c.beginPath();c.moveTo(sx,sy);c.lineTo(hx,hy);c.stroke();
  c.strokeStyle='#d9dde0';c.lineWidth=2;c.beginPath();c.moveTo(hx,hy);c.lineTo(tx,ty);c.stroke();
  c.fillStyle='#7d858c';c.beginPath();c.arc(tx,ty,3,0,6.283);c.fill();

}

/* ---------- Canvas and map view ---------- */
const cv=document.getElementById('cv');let cx=cv.getContext('2d');const cx0=cx;
let VW=300,VH=300,DPR=1,DPRCAP=2;
const cam={x:0,y:-100,s:2};
function fitCanvas(){
  const r=cv.parentElement.getBoundingClientRect();
  DPR=Math.min(DPRCAP,window.devicePixelRatio||1);
  VW=Math.max(200,Math.floor(r.width));VH=Math.max(200,Math.floor(r.height));
  cv.width=VW*DPR;cv.height=VH*DPR;
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  if(typeof glResize==='function')glResize();
}
const sX=x=>VW/2+(x-cam.x)*cam.s, sY=y=>VH/2+(y-cam.y)*cam.s;

function camTarget(){
  const h=hole(),b=R.ball,pts=[b,h.pin];
  if(R.shot)pts.push(R.shot.land||R.shot.final);else pts.push(aimTarget());
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const p of pts){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}
  const pad=clamp(Math.max(x1-x0,y1-y0)*.16,11,46);
  const w=x1-x0+pad*2,hh=y1-y0+pad*2;
  return{x:(x0+x1)/2,y:(y0+y1)/2,s:clamp(Math.min(VW/w,VH/hh),.9,16)};
}
function strokePath(h,w,col){
  cx.lineWidth=w;cx.strokeStyle=col;cx.lineCap='round';cx.lineJoin='round';
  cx.beginPath();h.path.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y));cx.stroke();
}
function ell(e,fill,stroke){
  cx.beginPath();cx.ellipse(e.x,e.y,e.rx,e.ry,e.rot||0,0,6.283);
  cx.fillStyle=fill;cx.fill();
  if(stroke){cx.lineWidth=.7;cx.strokeStyle=stroke;cx.stroke()}
}
const WKIND={rock:'#716c64',chasm:'#0e2216'};
const waterCol=(e,pal)=>WKIND[e.kind]||pal.water;
function drawScene(h,pal){
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.fillStyle=h.coast?pal.water:pal.oob;cx.fillRect(0,0,VW,VH);
  cx.setTransform(DPR*cam.s,0,0,DPR*cam.s,DPR*(VW/2-cam.x*cam.s),DPR*(VH/2-cam.y*cam.s));
  strokePath(h,h.fw+124,pal.deep);
  strokePath(h,h.fw+44,pal.rough);
  strokePath(h,h.fw,pal.fair);
  cx.lineCap='butt';cx.lineWidth=h.fw;cx.strokeStyle='rgba(255,255,255,.07)';
  for(let i=1;i<h.path.length-1;i+=2){cx.beginPath();cx.moveTo(h.path[i].x,h.path[i].y);cx.lineTo(h.path[i+1].x,h.path[i+1].y);cx.stroke()}
  cx.fillStyle=pal.tee;rrect(cx,-5,-3,10,6,1.5);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(-3,0,.5,0,6.283);cx.arc(3,0,.5,0,6.283);cx.fill();
  for(const e of h.water)ell(e,waterCol(e,pal),'rgba(255,255,255,.3)');
  if(h.island){cx.beginPath();cx.arc(h.gx,h.gy,h.gr+11,0,6.283);cx.fillStyle=pal.water;cx.fill()}
  cx.beginPath();cx.arc(h.gx,h.gy,h.gr+3.5,0,6.283);cx.fillStyle=pal.fringe;cx.fill();
  cx.beginPath();cx.arc(h.gx,h.gy,h.gr,0,6.283);cx.fillStyle=pal.green;cx.fill();
  cx.strokeStyle='rgba(255,255,255,.08)';cx.lineWidth=.5;
  for(let r=h.gr*.7;r>2;r-=h.gr*.3){cx.beginPath();cx.arc(h.gx,h.gy,r,0,6.283);cx.stroke()}
  for(const e of h.sand)ell(e,pal.sand,'rgba(0,0,0,.2)');
  if(cam.s>2.2){
    const m=Math.hypot(h.slope.x,h.slope.y)||1,ux=h.slope.x/m,uy=h.slope.y/m;
    cx.strokeStyle='rgba(255,255,255,.4)';cx.fillStyle='rgba(255,255,255,.4)';cx.lineWidth=.35;
    for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
      const px=h.gx+i*h.gr*.5,py=h.gy+j*h.gr*.5;
      if(Math.hypot(px-h.gx,py-h.gy)>h.gr*.8)continue;
      const ax=px-ux*.9,ay=py-uy*.9,bx=px+ux*.9,by=py+uy*.9;
      cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke();
      cx.beginPath();cx.moveTo(bx,by);cx.lineTo(bx-ux*.6-uy*.35,by-uy*.6+ux*.35);cx.lineTo(bx-ux*.6+uy*.35,by-uy*.6-ux*.35);cx.fill();
    }
  }
  for(const t of h.trees){
    cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.arc(t.x+.9,t.y+1.1,t.r,0,6.283);cx.fill();
    cx.fillStyle=pal.tree;cx.beginPath();cx.arc(t.x,t.y,t.r,0,6.283);cx.fill();
    cx.fillStyle=pal.tree2;cx.beginPath();cx.arc(t.x-t.r*.22,t.y-t.r*.25,t.r*.62,0,6.283);cx.fill();
  }
}
function drawOverlay(h,now){
  cx.setTransform(DPR,0,0,DPR,0,0);
  const club=CLUBS[R.club],lie=R.lie;
  const px=sX(h.pin.x),py=sY(h.pin.y);
  cx.fillStyle='#050a08';cx.beginPath();cx.arc(px,py,clamp(.55*cam.s,2,9),0,6.283);cx.fill();
  cx.strokeStyle='#f4f4f0';cx.lineWidth=1.6;cx.beginPath();cx.moveTo(px,py);cx.lineTo(px,py-26);cx.stroke();
  cx.fillStyle='#e8473a';cx.beginPath();cx.moveTo(px,py-26);cx.lineTo(px+15,py-21);cx.lineTo(px,py-16);cx.fill();
  const bx=sX(R.ball.x),by=sY(R.ball.y);
  if(R.phase==='aim'||R.phase==='power'||R.phase==='acc'||R.phase==='swing'){
    const eff=clubDist(club,lie),tg=aimTarget(),tx=sX(tg.x),ty=sY(tg.y);
    const spread=clubSpread(club,lie)*Math.PI/180;
    cx.fillStyle='rgba(255,255,255,.10)';cx.beginPath();cx.moveTo(bx,by);
    cx.lineTo(bx+Math.sin(R.aim-spread)*eff*cam.s,by-Math.cos(R.aim-spread)*eff*cam.s);
    cx.lineTo(bx+Math.sin(R.aim+spread)*eff*cam.s,by-Math.cos(R.aim+spread)*eff*cam.s);cx.closePath();cx.fill();
    cx.setLineDash([7,6]);cx.strokeStyle='rgba(255,255,255,.85)';cx.lineWidth=2;cx.beginPath();cx.moveTo(bx,by);cx.lineTo(tx,ty);cx.stroke();cx.setLineDash([]);
    cx.strokeStyle='#e3b948';cx.lineWidth=2.5;cx.beginPath();cx.arc(tx,ty,9,0,6.283);cx.stroke();
    cx.fillStyle='rgba(11,24,20,.82)';rrect(cx,tx-34,ty-34,68,20,4);cx.fill();
    cx.fillStyle='#eef3e6';cx.font='700 14px "Barlow Condensed",sans-serif';cx.textAlign='center';
    cx.fillText((club.putter?'max ':'')+Math.round(eff)+' yd',tx,ty-19);
  }
  if(R.phase!=='hole'&&!(R.vis&&R.vis.hide)){
    const show=R.phase==='aim'||R.phase==='power'||R.phase==='acc'||R.phase==='swing'||R.swAnim||R.phase==='fly';
    if(show)drawGolfer(cx,golferLook(golfer()),bx-26,by+3,.9,R.sw||0);
  }

    const rb=clamp(cam.s*.8,3.4,6.5),vx=sX(v.x),vy=sY(v.y),hh=v.h||0;
    cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.ellipse(vx+1,vy+2,rb*(1-hh/260),rb*.6*(1-hh/260),0,0,6.283);cx.fill();
    cx.fillStyle='#fff';cx.strokeStyle='#222';cx.lineWidth=1;cx.beginPath();cx.arc(vx,vy-hh,rb*(1+hh/220),0,6.283);cx.fill();cx.stroke();
  }
  if(R.fx){
    const u=(now-R.fx.t0)/.9;
    if(u<1){
      const fx=sX(R.fx.x),fy=sY(R.fx.y);cx.strokeStyle='rgba(255,255,255,'+(1-u)+')';cx.lineWidth=2.5;
      cx.beginPath();cx.arc(fx,fy,6+u*34,0,6.283);cx.stroke();cx.beginPath();cx.arc(fx,fy,3+u*18,0,6.283);cx.stroke();
    }else R.fx=null;
  }
}
function draw2D(now){

/* ---------- Orbit view: third-person chase camera ---------- */
const cam3={x:0,y:13,z:5.5,yaw:0,pitch:.12};

const NEAR=.8;

/* world (x,y,z up) to camera space [right, up, forward] */
function toCam(wx,wy,wz){

const scr=p=>[VW/2+FOC*p[0]/p[2],CYS-FOC*p[1]/p[2]];

/* ---- sky, sun, clouds, horizon silhouettes ---- */
function hash1(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}

  if(!c){const T=h.T;c=h.sc={a:new Uint8Array(T.W*2*T.H*2),W:T.W*2,Hh:T.H*2,x0:T.x0,y0:T.y0}}
  const i=Math.floor((x-c.x0)*2),j=Math.floor((y-c.y0)*2);
  const calc=(px,py)=>{const s=surfaceAt(h,px,py);return s==='water'?(waterKind(h,px,py)==='sea'?10:9):SID[s]||3};
  if(i<0||j<0||i>=c.W||j>=c.Hh)return calc(x,y);
  const k=j*c.W+i;let v=c.a[k];
  if(!v){v=calc(c.x0+(i+.5)/2,c.y0+(j+.5)/2);c.a[k]=v}
  return v;
}
const _lut={};
const FOGN=10,SHN=28;
function getLUT(course){
  if(_lut[course.id])return _lut[course.id];
  const p=course.pal,hz=course.env.haze,base={tee:p.tee,fair:p.fair,fair2:mixHex(p.fair,'#ffffff',.1),rough:p.rough,deep:p.deep,oob:p.oob,green:p.green,fringe:p.fringe,sand:p.sand,water:p.water,sea:mixHex(p.water,'#000000',.14),rock:'#7a6c5a'};
  const L=[];
  for(let f=0;f<FOGN;f++){
    const row={},fog=f/(FOGN-1)*.88;
    for(const k in base){
      const b=hexRGB(base[k]),H=hexRGB(hz),arr=[];
      for(let s=0;s<SHN;s++){
        const m=.62+s*.027;
        const r=Math.min(255,b[0]*m),g=Math.min(255,b[1]*m),bl=Math.min(255,b[2]*m);
        arr.push('rgb('+Math.round(r+(H[0]-r)*fog)+','+Math.round(g+(H[1]-g)*fog)+','+Math.round(bl+(H[2]-bl)*fog)+')');
      }
      row[k]=arr;

}
function mixHex(a,b,t){const A=hexRGB(a),B=hexRGB(b),m=i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0');return'#'+m(0)+m(1)+m(2)}
function windWave(x,y,now,h,amp){
  const w=h.wind,sp=1.4+w.mph*.13;
  return(Math.sin((x*w.x+y*w.y)*.16-now*sp)*.6+Math.sin((x*.07-y*.09)+now*.9)*.25+Math.sin((x*w.y-y*w.x)*.31-now*sp*.7)*.15)*amp;
}
const FAN_COL=['#e8473a','#2d73c9','#f2c230','#ffffff','#2fa36b','#9b59b6','#f08a2b','#1f2937'];
const SKINS=['#f0c9a8','#d9a77c','#a8714a','#7a4a2c','#f3d6bc'];
let _fr={sy:0,cy:1,sp:0,cp:1,cxx:0,cyy:0,czz:0};
function setFrame(){
  _fr.sy=Math.sin(cam3.yaw);_fr.cy=Math.cos(cam3.yaw);_fr.sp=Math.sin(cam3.pitch);_fr.cp=Math.cos(cam3.pitch);
  _fr.cxx=cam3.x;_fr.cyy=cam3.y;_fr.czz=cam3.z;
}
/* projects into _o: sx, sy, depth */
const _o={x:0,y:0,z:0,f:0};
function prj(wx,wy,wz){
  const dx=wx-_fr.cxx,dy=wy-_fr.cyy,dz=wz-_fr.czz;
  const f0=dx*_fr.sy-dy*_fr.cy,r=dx*_fr.cy+dy*_fr.sy;
  const up=dz*_fr.cp+f0*_fr.sp,fw=f0*_fr.cp-dz*_fr.sp;
  _o.z=fw;_o.f=f0;
  if(fw<NEAR){_o.x=_o.y=0;return false}
  _o.x=VW/2+FOC*r/fw;_o.y=CYS-FOC*up/fw;return true;
}

function drawTerrain(h,course,now,B,meta){
  const q=QUAL[SET.quality]||QUAL.med,K=q[0],RW=q[1],pal=course.pal,env=course.env,LUT=getLUT(course);

  const down=cam3.pitch+Math.atan((VH-CYS)/FOC);

  const dmax=950,lr=Math.log(dmax/dmin)/(RW-1);

  const hw=VW/2/FOC*1.1;

  const mk=()=>({sx:new Float32Array(K+1),sy:new Float32Array(K+1),z:new Float32Array(K+1),wx:new Float32Array(K+1),wy:new Float32Array(K+1),wz:new Float32Array(K+1)});
  let A=mk(),Bv=mk();

    const d=dmin*Math.exp(lr*j),fw=d*_fr.cp+camH*_fr.sp,lm=Math.max(fw,.5)*hw;
    for(let k=0;k<=K;k++){
      const l=(k/K-.5)*2*lm,wx=cam3.x+fx*d+rx*l,wy=cam3.y+fy*d+ry*l,wz=heightAt(h,wx,wy);
      R.wx[k]=wx;R.wy[k]=wy;R.wz[k]=wz;
      if(prj(wx,wy,wz)){R.sx[k]=_o.x;R.sy[k]=_o.y;R.z[k]=_o.z}else{R.sx[k]=0;R.sy[k]=0;R.z[k]=-1}
    }
  };
  const rows=[];
  for(let j=0;j<RW;j++){rows.push(null)}
  /* compute from far to near, keeping two rows */
  fill(A,RW-1);
  const amp=clamp(.35+h.wind.mph*.06,.35,1),ampW=SET.wind?amp:.0;
  const blades=SET.grass;
  const bladeRows=blades?Math.min(RW-1,Math.ceil(Math.log(34/dmin)/lr)+1):0;
  let last='';
  for(let j=RW-2;j>=0;j--){
    fill(Bv,j);   /* Bv = nearer row j, A = farther row j+1 */
    const d=dmin*Math.exp(lr*(j+.5)),fog=Math.min(FOGN-1,Math.floor(clamp((d-60)/820,0,1)*(FOGN-1)+.5)),LF=LUT[fog];
    let bl1=null,bl2=null;
    const near=j<bladeRows;
    if(near){bl1=[];bl2=[]}
    for(let k=0;k<K;k++){
      if(Bv.z[k]<0||Bv.z[k+1]<0||A.z[k]<0||A.z[k+1]<0)continue;
      const mx=(Bv.wx[k]+Bv.wx[k+1]+A.wx[k]+A.wx[k+1])*.25,my=(Bv.wy[k]+Bv.wy[k+1]+A.wy[k]+A.wy[k+1])*.25;
      let sid=surfCell(h,mx,my);
      /* normal from the diagonals */
      const ax=A.wx[k+1]-Bv.wx[k],ay=A.wy[k+1]-Bv.wy[k],az=A.wz[k+1]-Bv.wz[k];
      const bx=A.wx[k]-Bv.wx[k+1],by=A.wy[k]-Bv.wy[k+1],bz=A.wz[k]-Bv.wz[k+1];
      let nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;

      let key=SKEY[sid];

      else if(sid===2||sid===1){s+=windWave(mx,my,now,h,ampW)*1.3}

          const by0=lerp(Bv.wy[k],A.wy[k+1],u*.8+.1)*.5+lerp(Bv.wy[k+1],A.wy[k],v*.8+.1)*.5;

  if(B.near){B.near.sort((a,b)=>b.f-a.f);for(const o of B.near)o.draw(o)}
}

/* ---------- objects ---------- */
function drawFan(o){
  const f=o.f_,u=o.u,cheer=o.cheer>0;
  if(u<1.6)return;
  const bob=cheer?Math.abs(Math.sin(o.now*9+f.s))*.35*u:0,x=o.x,y=o.y-bob,sz=f.sz,k=u*sz;

  cx.fillStyle='rgba(0,0,0,.22)';cx.beginPath();cx.ellipse(o.x,o.y,.42*u,.11*u,0,0,6.283);cx.fill();
  if(k<4){ /* far: simple soft shapes */
    cx.fillStyle=pant;cx.fillRect(x-.16*k,y-.55*k,.32*k,.55*k);
    cx.fillStyle=cl;cx.beginPath();cx.ellipse(x,y-.82*k,.24*k,.32*k,0,0,6.283);cx.fill();
    cx.fillStyle=sk;cx.beginPath();cx.arc(x,y-1.3*k,.16*k,0,6.283);cx.fill();
  }else{
    /* legs */
    cx.fillStyle=pant;rrect(cx,x-.17*k,y-.62*k,.14*k,.62*k,.05*k);cx.fill();rrect(cx,x+.03*k,y-.62*k,.14*k,.62*k,.05*k);cx.fill();
    /* torso with shading */
    const gr=cx.createLinearGradient(x-.26*k,0,x+.26*k,0);gr.addColorStop(0,cl);gr.addColorStop(1,cl2);
    cx.fillStyle=gr;rrect(cx,x-.26*k,y-1.2*k,.52*k,.66*k,.2*k);cx.fill();
    /* arms */
    if(cheer){cx.strokeStyle=sk;cx.lineCap='round';cx.lineWidth=Math.max(1.2,.1*k);const w=Math.sin(o.now*10+f.s)*.12*k;cx.beginPath();cx.moveTo(x-.24*k,y-1.1*k);cx.lineTo(x-.42*k-w,y-1.75*k);cx.moveTo(x+.24*k,y-1.1*k);cx.lineTo(x+.42*k+w,y-1.75*k);cx.stroke()}
    else{cx.fillStyle=cl2;rrect(cx,x-.33*k,y-1.15*k,.1*k,.5*k,.05*k);cx.fill();rrect(cx,x+.23*k,y-1.15*k,.1*k,.5*k,.05*k);cx.fill()}
    /* head and hair */

    cx.fillStyle=mixc(['#2a1d14','#5a3a22','#c9a24a','#1a1a1a','#7a3b1d'][(f.c+(f.s|0))%5],hz,fg);cx.beginPath();cx.arc(x,y-1.47*k,.17*k,3.3,6.1);cx.fill();
  }
}
function drawStand(o){
  const s=o.st,c=Math.cos(s.rot),sn=Math.sin(s.rot),g=heightAt(CUR_H,s.x,s.y);
  const pt=(a,b,z)=>[s.x+c*a-sn*b,s.y+sn*a+c*b,g+z];
  const rows=3,col=['#3d4552','#4b5463','#596273'];
  for(let r=rows-1;r>=0;r--){
    const b0=r*(s.d/rows),b1=(r+1)*(s.d/rows),z0=r*(s.h/rows),z1=(r+1)*(s.h/rows);
    fillPoly([pt(-s.w/2,-b0,z0),pt(s.w/2,-b0,z0),pt(s.w/2,-b0,z1),pt(-s.w/2,-b0,z1)],mixc(col[r],o.haze,o.fog));
    fillPoly([pt(-s.w/2,-b0,z1),pt(s.w/2,-b0,z1),pt(s.w/2,-b1,z1),pt(-s.w/2,-b1,z1)],mixc('#7c8697',o.haze,o.fog));
    const n=Math.floor(s.w/1.1);
    for(let i=0;i<n;i++){
      const a=-s.w/2+(i+.5)*s.w/n;
      if(!prj(...pt(a,-b0-.5,z1+.6)))continue;
      const u=FOC/_o.z,sz=u*.35;if(sz<.7)continue;
      const k=(i*7+r*13)|0,cheer=o.cheer>0?Math.abs(Math.sin(o.now*8+k))*.3*u:0;
      cx.fillStyle=mixc(FAN_COL[k%8],o.haze,o.fog);cx.beginPath();cx.ellipse(_o.x,_o.y-sz*.75-cheer,sz*.62,sz*.8,0,0,6.283);cx.fill();
      cx.fillStyle=mixc(SKINS[k%5],o.haze,o.fog);cx.beginPath();cx.arc(_o.x,_o.y-sz*1.9-cheer,sz*.45,0,6.283);cx.fill();
    }
  }
}
let CUR_H=null;
function drawPinObj(o){
  const h=CUR_H,top=o.top,s=o.s;
  const hgt=Math.max(6,s.y-top.y),fl=hgt*.34,sw=SET.wind?Math.sin(o.now*(4+h.wind.mph*.3))*fl*.08:0;
  const pw=Math.max(1.4,hgt*.03);
  /* cup */
  cx.fillStyle='#050c08';cx.beginPath();cx.ellipse(s.x,s.y,Math.max(1.6,FOC*.36/o.zz),Math.max(.8,FOC*.14/o.zz),0,0,6.283);cx.fill();
  cx.strokeStyle='rgba(255,255,255,.35)';cx.lineWidth=.8;cx.stroke();
  /* pole with a lit side */
  const pg=cx.createLinearGradient(s.x-pw,0,s.x+pw,0);pg.addColorStop(0,'#ffffff');pg.addColorStop(1,'#b9bcb6');
  cx.fillStyle=pg;cx.beginPath();cx.moveTo(s.x-pw/2,s.y);cx.lineTo(top.x-pw/2,top.y);cx.lineTo(top.x+pw/2,top.y);cx.lineTo(s.x+pw/2,s.y);cx.closePath();cx.fill();
  const wr=h.wind.x*_fr.cy+h.wind.y*_fr.sy,dir=wr>=0?1:-1,wm=SET.wind?.4+Math.min(1,h.wind.mph/9)*.6*Math.min(1,Math.abs(wr)+.35):.55;
  if(o.basket){
    const bw=fl*.55,bh=fl*.45;
    const g=cx.createLinearGradient(top.x-bw,0,top.x+bw,0);g.addColorStop(0,o.bcol);g.addColorStop(1,mixc(o.bcol,'#000000',.35));
    cx.fillStyle=g;cx.beginPath();cx.ellipse(top.x,top.y+bh*.3,bw,bh,0,0,6.283);cx.fill();
    cx.strokeStyle='rgba(60,20,10,.4)';cx.lineWidth=Math.max(.8,fl*.03);
    for(let k=-2;k<=2;k++){cx.beginPath();cx.ellipse(top.x,top.y+bh*.3,bw*Math.abs(k)/2.4+.01,bh,0,0,6.283);cx.stroke()}
  }else{
    /* a cloth drawn as a rippling strip of many slices so it never looks like one hard block */
    const Lw=fl*1.45*wm*dir,Hh=fl*.8,N=14,col=o.bcol==='#d8402f'?'#e0473a':'#f0922e';
    const tx=top.x+pw/2*dir,ty=top.y;
    const up=[],dn=[];
    for(let i=0;i<=N;i++){
      const t=i/N,ph=o.now*(5+h.wind.mph*.35)-t*5,rip=SET.wind?Math.sin(ph)*fl*.07*t+sw*t:0;
      const x=tx+Lw*t,hh=Hh*(1-t*.38);
      up.push([x,ty+t*fl*.12+rip]);dn.push([x,ty+t*fl*.12+hh+rip*.9]);
    }
    for(let i=0;i<N;i++){
      const shade=.5+.5*Math.sin(o.now*(5+h.wind.mph*.35)-i/N*5+1.2);
      cx.fillStyle=mixc(col,shade>.5?'#ffffff':'#000000',Math.abs(shade-.5)*.34);
      cx.beginPath();cx.moveTo(up[i][0],up[i][1]);cx.lineTo(up[i+1][0],up[i+1][1]);cx.lineTo(dn[i+1][0],dn[i+1][1]);cx.lineTo(dn[i][0],dn[i][1]);cx.closePath();cx.fill();
    }
    cx.strokeStyle='rgba(0,0,0,.16)';cx.lineWidth=.8;cx.beginPath();up.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));for(let i=N;i>=0;i--)cx.lineTo(dn[i][0],dn[i][1]);cx.closePath();cx.stroke();
  }

}
let FLAT=null;
function pushObj(B,meta,f0,o){
  o.f=f0;
  if(FLAT){FLAT.push(o);return}
  let j=f0<=meta.dmin?-1:Math.min(meta.RW-2,Math.floor(Math.log(f0/meta.dmin)/meta.lr));
  if(j<0){(B.near||(B.near=[])).push(o)}else(B[j]||(B[j]=[])).push(o);
}

/* ---------- the whole frame ---------- */
function renderScene(h,course,now,ent){
  const env=course.env,pal=course.pal;
  CUR_H=h;
  FOC=VH*1.05;CYS=VH*(ent&&ent.shift!=null?ent.shift:.5);HOR=CYS-FOC*Math.tan(cam3.pitch);
  const useGL=glReady(h,course);
  FLAT=useGL?[]:null;
  if(useGL){
    GLS.cv.style.display='block';GLS.sky.style.display='block';
    cx=GLS.skyCx;cx.setTransform(DPR,0,0,DPR,0,0);setFrame();drawSky(env,now);
    cx=cx0;cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,VW,VH);
  }else{
    if(GLS.cv){GLS.cv.style.display='none';GLS.sky.style.display='none'}
    cx.setTransform(DPR,0,0,DPR,0,0);
    setFrame();
    drawSky(env,now);
    /* base fill under the mesh so seams never show sky */
    cx.fillStyle=mixHex(pal.fair,env.haze,.5);cx.fillRect(0,Math.max(0,HOR+1),VW,VH);
  }
  const B={},meta={dmin:1,lr:.1,RW:QUAL[SET.quality]?QUAL[SET.quality][1]:76};
  /* meta needs dmin first: compute the same way as the mesh */
  const gz=heightAt(h,cam3.x,cam3.y),camH=Math.max(.6,cam3.z-gz),down=cam3.pitch+Math.atan((VH-CYS)/FOC);
  meta.dmin=down>.07?clamp(camH/Math.tan(Math.min(down,1.4))*.6,1.1,260):1.1;meta.lr=Math.log(950/meta.dmin)/(meta.RW-1);
  const hazeC=env.haze;
  const fogOf=d=>clamp((d-120)/880,0,.88);
  const add=(x,y,z,maxD,fn)=>{
    if(!prj(x,y,z))return;
    const f0=_o.f,d=_o.z;if(d>maxD||f0<-1)return;
    if(useGL&&d>14&&hiddenByTerrain(h,x,y,z+1.4))return;
    const sx=_o.x,sy=_o.y;if(sx<-260||sx>VW+260||sy<HOR-VH*.8||sy>VH+260)return;
    fn(f0,d,sx,sy);
  };
  const baseKinds=env.tree,LOW={gorse:1.35,tuft:1.45};
  for(const t of h.deco){
    const z=heightAt(h,t.x,t.y);
    add(t.x,t.y,z,1100,(f0,d,sx,sy)=>{
      const k=env.deco||env.tree,H=FOC*t.r*(LOW[k]||3)/d;if(H<2.5)return;
      pushObj(B,meta,f0,{x:sx,y:sy,H,k,sd:t.s,fog:fogOf(d),draw:o=>{drawSway(o,env,pal)}});
    });
  }
  for(const t of h.trees){
    const z=heightAt(h,t.x,t.y);
    add(t.x,t.y,z,1100,(f0,d,sx,sy)=>{
      const H=FOC*t.H/d;if(H<2.5)return;
      pushObj(B,meta,f0,{x:sx,y:sy,H,k:env.tree,sd:t.s,fog:fogOf(d),draw:o=>{drawSway(o,env,pal)}});
    });

function drawEntities(h,course,now,ent){
  const pal=course.pal;
  /* aim guides */
  if(ent.guide){
    const G=ent.guide;
    if(G.pts){
      for(let i=0;i<G.pts.length;i+=4){
        if(!prj(G.pts[i+1],G.pts[i+2],G.pts[i+3]+(i? 0:0)))continue;

      }

      const R0=G.ring;

        const a=k/28*6.2832,lx=Math.cos(a)*R0.w,ly=Math.sin(a)*R0.d;
        /* right = (cos yaw, sin yaw), forward = (sin yaw, -cos yaw) */
        const x=G.x+Math.cos(G.yaw)*lx+Math.sin(G.yaw)*ly,y=G.y+Math.sin(G.yaw)*lx-Math.cos(G.yaw)*ly;
        P2.push([x,y,heightAt(h,x,y)+.08]);

      if(prj(G.x,G.y,heightAt(h,G.x,G.y)+.1)){
        const rr=clamp(FOC*1.2/_o.z,7,30);cx.strokeStyle='#e3b948';cx.lineWidth=3;cx.beginPath();cx.arc(_o.x,_o.y,rr*.5,0,6.283);cx.stroke();
        if(G.label){cx.fillStyle='rgba(11,24,20,.85)';rrect(cx,_o.x-40,_o.y-rr-28,80,22,5);cx.fill();cx.fillStyle='#eef3e6';cx.font='700 15px "Barlow Condensed",sans-serif';cx.textAlign='center';cx.fillText(G.label,_o.x,_o.y-rr-12)}
      }
    }
  }
  if(ent.slope){
    const m=h.slope,gr=h.gr;
    cx.strokeStyle='rgba(255,255,255,.5)';cx.lineWidth=1.5;cx.lineCap='round';
    for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){
      const px=h.gx+i*gr*.3,py=h.gy+j*gr*.3;
      if(Math.hypot(px-h.gx,py-h.gy)>gr*.85)continue;
      const g=gradAt(h,px,py),mm=Math.hypot(g.x,g.y);if(mm<.002)continue;
      const ux=-g.x/mm,uy=-g.y/mm,len=clamp(mm*40,.5,1.6),z=heightAt(h,px,py)+.06;
      if(!prj(px-ux*len*.5,py-uy*len*.5,z))continue;const a0={x:_o.x,y:_o.y};
      if(!prj(px+ux*len*.5,py+uy*len*.5,z))continue;const b0={x:_o.x,y:_o.y};
      const ang=Math.atan2(b0.y-a0.y,b0.x-a0.x),hs=Math.max(3,Math.hypot(b0.x-a0.x,b0.y-a0.y)*.35);
      cx.beginPath();cx.moveTo(a0.x,a0.y);cx.lineTo(b0.x,b0.y);cx.lineTo(b0.x-Math.cos(ang-.5)*hs,b0.y-Math.sin(ang-.5)*hs);cx.moveTo(b0.x,b0.y);cx.lineTo(b0.x-Math.cos(ang+.5)*hs,b0.y-Math.sin(ang+.5)*hs);cx.stroke();
    }
  }
  /* golfer from behind */
  if(ent.golfer&&ent.golfer.show){
    const g=ent.golfer,yaw=g.yaw,fx=Math.sin(yaw),fy=-Math.cos(yaw),rx=Math.cos(yaw),ry=Math.sin(yaw);
    const gx=g.x-rx*1.25-fx*.55,gy=g.y-ry*1.25-fy*.55,gz=heightAt(h,gx,gy);
    if(prj(gx,gy,gz)&&_o.z>1.2)drawGolferBack(cx,g.look,_o.x,_o.y,FOC*1.95/_o.z/72,g.sw||0);
  }
  /* tracer */
  const T=ent.trail||[];
  if(T.length>3){
    cx.lineCap='round';
    for(let i=4;i<T.length;i+=4){
      if(!prj(T[i-3],T[i-2],T[i-1]))continue;const a0={x:_o.x,y:_o.y};
      if(!prj(T[i+1],T[i+2],T[i+3]))continue;
      const al=.1+.85*i/T.length;
      cx.strokeStyle='rgba(255,214,74,'+al+')';cx.lineWidth=clamp(FOC*.13/_o.z,1.6,5);
      cx.beginPath();cx.moveTo(a0.x,a0.y);cx.lineTo(_o.x,_o.y);cx.stroke();
    }
  }
  const v=ent.ball;
  if(v&&!v.hide){
    const g=heightAt(h,v.x,v.y);
    if(prj(v.x,v.y,g)){
      const sx=_o.x,sy=_o.y,sz=_o.z,hgt=Math.max(0,v.z-g);
      if(prj(v.x,v.y,v.z+.08)){
        const r=clamp(FOC*.085/_o.z,3,12);
        cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.ellipse(sx,sy,r*(1.1-Math.min(.5,hgt/80)),r*.38,0,0,6.283);cx.fill();
        cx.fillStyle='#fff';cx.strokeStyle='rgba(0,0,0,.55)';cx.lineWidth=1;cx.beginPath();cx.arc(_o.x,_o.y-r*.4,r,0,6.283);cx.fill();cx.stroke();
      }
    }
  }
  if(ent.fx){
    const u=(now-ent.fx.t0)/1.1;
    if(u<1){
      const gz=heightAt(h,ent.fx.x,ent.fx.y);
      if(prj(ent.fx.x,ent.fx.y,gz+.05)){
        const rr=FOC*(1+u*7)/_o.z;cx.strokeStyle='rgba(255,255,255,'+(1-u)+')';cx.lineWidth=2.5;cx.beginPath();cx.ellipse(_o.x,_o.y,rr,rr*.35,0,0,6.283);cx.stroke();
        cx.beginPath();cx.ellipse(_o.x,_o.y,rr*.55,rr*.2,0,0,6.283);cx.stroke();
        cx.fillStyle='rgba(255,255,255,'+(.8*(1-u))+')';for(let k=0;k<9;k++){const a=k*.7,hh=Math.sin(u*3.14)*rr*.9*(.5+hash1(k));cx.beginPath();cx.arc(_o.x+Math.cos(a)*rr*u*.6,_o.y-hh,2.2,0,6.283);cx.fill()}
      }
    }else ent.fx=null;
  }
}
/* ---------- Audio: everything is synthesized with WebAudio ---------- */
const AU={ctx:null,master:null,sfx:null,amb:null,mus:null,windG:null,crowdG:null,windF:null,started:false,musicT:0,noiseBuf:null};
function auInit(){
  if(AU.ctx)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=AU.ctx=new C();
    AU.master=c.createGain();AU.sfx=c.createGain();AU.amb=c.createGain();AU.mus=c.createGain();
    AU.sfx.connect(AU.master);AU.amb.connect(AU.master);AU.mus.connect(AU.master);AU.master.connect(c.destination);
    const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    AU.noiseBuf=b;
    /* wind bed */
    const wn=c.createBufferSource();wn.buffer=b;wn.loop=true;
    AU.windF=c.createBiquadFilter();AU.windF.type='bandpass';AU.windF.frequency.value=420;AU.windF.Q.value=.6;
    AU.windG=c.createGain();AU.windG.gain.value=0;wn.connect(AU.windF);AU.windF.connect(AU.windG);AU.windG.connect(AU.amb);wn.start();
    /* crowd murmur */
    const cn=c.createBufferSource();cn.buffer=b;cn.loop=true;cn.playbackRate.value=.7;
    const cf=c.createBiquadFilter();cf.type='bandpass';cf.frequency.value=700;cf.Q.value=.9;
    AU.crowdG=c.createGain();AU.crowdG.gain.value=0;cn.connect(cf);cf.connect(AU.crowdG);AU.crowdG.connect(AU.amb);cn.start();
    auVolumes();
  }catch(e){AU.ctx=null}
}
function auVolumes(){
  if(!AU.ctx)return;
  AU.master.gain.value=SET.master;AU.sfx.gain.value=SET.sfx;AU.amb.gain.value=SET.amb;AU.mus.gain.value=SET.music*.5;
}
function auResume(){auInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume()}
function auAmbient(mph,crowd,seaside){
  if(!AU.ctx)return;
  const t=AU.ctx.currentTime;
  AU.windG.gain.setTargetAtTime(.04+Math.min(1,mph/22)*.22,t,.5);
  AU.windF.frequency.setTargetAtTime(280+mph*22+(seaside?120:0),t,.5);
  AU.crowdG.gain.setTargetAtTime(SET.crowd?crowd*.07:0,t,.8);
}
function auQuiet(){if(AU.ctx){const t=AU.ctx.currentTime;AU.windG.gain.setTargetAtTime(.03,t,.3);AU.crowdG.gain.setTargetAtTime(0,t,.3)}}
function noiseBurst(dur,f0,f1,q,gain,type,delay){
  if(!AU.ctx)return;
  const c=AU.ctx,t=c.currentTime+(delay||0),s=c.createBufferSource();s.buffer=AU.noiseBuf;
  const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);f.Q.value=q||1;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+Math.min(.03,dur*.3));g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.sfx);s.start(t,Math.random(),dur+.05);
}
function tone(freq,dur,gain,type,delay,slide){
  if(!AU.ctx)return;
  const c=AU.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(AU.sfx);o.start(t);o.stop(t+dur+.05);
}

function auMusic(){
  if(!AU.ctx||AU.ctx.state!=='running'||SET.music<=.01)return;
  const c=AU.ctx;if(c.currentTime<AU.musicT)return;
  AU.musicT=c.currentTime+4.8;

  const notes=[r,r*1.5,r*2*sc[Math.floor(Math.random()*5)]/2,r*2*sc[Math.floor(Math.random()*6)]];

    const t=c.currentTime+i*.35,o=c.createOscillator(),g=c.createGain();

    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+1.2);g.gain.linearRampToValueAtTime(0,t+5);

  h+='<article class="card"><div class="swatch" style="background:linear-gradient(135deg,#3f93e0 0 30%,#69bf5a 30% 70%,#f2e6bd 70%)"></div><h3>Make your own course</h3><div class="meta">You choose everything</div><p>Pick the look, number of holes, water, bunkers, trees, hills and wind, then play it.</p><div class="foot"><span class="muted">'+((S.custom||[]).length)+' made</span><button class="btn" data-design>Design</button></div></article>';
  for(const c of COURSES){
    const owned=S.courses.includes(c.id),best=S.best[c.id];
    const p=c.pal,e=c.env,dots=Math.min(5,c.diff);
    let btn;
    if(owned)btn='<button class="btn" data-play="'+c.id+'">Play</button>';
    else if(S.coins>=c.cost)btn='<button class="btn" data-buycourse="'+c.id+'">Unlock '+COIN+c.cost.toLocaleString()+'</button>';

      +'<h3>'+esc(c.name)+'</h3><div class="meta">'+esc(c.place)+'</div><div class="meta">'+c.holes+' holes · Par '+c.parTotal+' · '+c.total.toLocaleString()+' yd</div>'
      +'<p>'+esc(c.blurb)+'</p>'

function renderGolfers(){

$('hub').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const d=b.dataset;auResume();
  if(d.play){sfx('click');return openSetup(d.play)}
  if(d.pick){S.golfer=d.pick;toast(curGolfer().name+' is ready to play','good')}
  else if(d.outfit){S.outfit[d.outfit]=!S.outfit[d.outfit]}

/* ---------- Course designer: build your own course from a handful of choices ---------- */
const CD_THEMES={parkland:['Parkland','lagoon'],links:['Links by the sea','standrews'],pines:['Pine forest','pinevalley'],desert:['Desert','mirage'],night:['Night','moonlight'],island:['Tropical island','atoll']};
const CD_OPTS={
  holes:[['3','3'],['6','6'],['9','9'],['12','12'],['18','18']],
  len:[['short','Short'],['med','Medium'],['long','Long']],
  mix:[['bal','Balanced'],['p3','Lots of par 3s'],['p5','Lots of par 5s']],
  water:[['none','No water'],['some','Some'],['lots','Lots']],
  sand:[['few','Few'],['norm','Normal'],['lots','Lots']],
  trees:[['none','None'],['some','Some'],['dense','Dense']],
  hills:[['flat','Flat'],['gentle','Gentle'],['rolling','Rolling'],['hilly','Hilly'],['dunes','Dunes']],
  fw:[['wide','Wide'],['norm','Normal'],['narrow','Narrow']],
  wind:[['calm','Calm'],['norm','Normal'],['gale','Gale']],
  green:[['slow','Slow'],['med','Medium'],['fast','Fast']],
  fans:[['none','Empty'],['some','Some'],['many','Packed']]
};
let CD=null;
function cdDefault(){return{id:'',name:'My Course',theme:'parkland',holes:'9',len:'med',mix:'bal',water:'some',mid:'no',moat:'no',sand:'norm',trees:'some',hills:'rolling',fw:'norm',wind:'norm',green:'med',fans:'some'}}
function cdPick(a){return a[Math.floor(Math.random()*a.length)]}
function cdRandom(){
  const o=cdDefault();o.name=CD?CD.name:o.name;o.id=CD?CD.id:'';
  o.theme=cdPick(Object.keys(CD_THEMES));o.holes=cdPick(['6','9','9','12','18']);
  for(const k of Object.keys(CD_OPTS))if(k!=='holes')o[k]=cdPick(CD_OPTS[k])[0];
  o.mid=Math.random()<.25?'yes':'no';o.moat=Math.random()<.12?'yes':'no';
  return o;
}
function buildCustomCourse(sp){
  const rnd=mulberry32(strSeed(sp.id+':gen')),n=+sp.holes;
  const base=COURSE_BY[CD_THEMES[sp.theme][1]]||COURSES[0];
  const mix={bal:[.2,.8],p3:[.45,.9],p5:[.1,.5]}[sp.mix];
  const lenF={short:.8,med:1,long:1.15}[sp.len];
  const pars=[],yds=[],tags={},e=[],dg=[];
  for(let i=0;i<n;i++){
    const q=rnd(),p=q<mix[0]?3:q<mix[1]?4:5;pars.push(p);
    yds.push(Math.round((p===3?120+rnd()*100:p===4?300+rnd()*180:480+rnd()*120)*lenF));
    const t=[];
    if(sp.moat==='yes'){t.push('moat');if(p===3)t.push('island')}
    else if(sp.mid==='yes')t.push('lakeMid');
    if(sp.water!=='none'&&sp.moat!=='yes'){
      const k=sp.water==='lots'?1:.45;
      if(rnd()<.4*k)t.push('pond');else if(rnd()<.15*k)t.push('creekF');
      if(p>=4&&rnd()<.2*k&&sp.mid!=='yes')t.push('carry');
    }
    if(sp.theme==='desert'&&rnd()<.3)t.push('waste');
    if(sp.sand==='lots'&&rnd()<.35)t.push('bigL');
    if(t.length)tags[i+1]=t;
    e.push(sp.hills==='flat'?'f':'fufdgbfvf'[Math.floor(rnd()*9)]);
    dg.push(rnd()<.55?'S':rnd()<.5?'L':'R');
  }
  const links=sp.theme==='links'||sp.theme==='island';
  const c=mkCourse({id:sp.id,name:sp.name||'My Course',place:'Made by you',country:'You',cost:0,tier:2,diff:3,custom:true,
    h:pars.map((p,i)=>p+'/'+yds[i]).join(' '),e:e.join(''),dg:dg.join(''),tags,
    fw:{wide:1.3,norm:1,narrow:.8}[sp.fw],sand:{few:2.5,norm:5,lots:8}[sp.sand],trees:{none:0,some:.6,dense:1.6}[sp.trees],
    wind:{calm:.3,norm:.9,gale:1.8}[sp.wind],water:{none:0,some:.25,lots:.8}[sp.water],creek:sp.water==='lots'?.2:0,
    gs:1,sl:1,relief:sp.hills,firm:sp.theme==='desert'?1.45:links?1.25:1,stimp:{slow:9,med:11,fast:13.5}[sp.green],crowd:{none:0,some:.5,many:1}[sp.fans],
    links,potty:links,
    blurb:'Designed by you: '+CD_THEMES[sp.theme][0].toLowerCase()+', '+n+' holes.',
    pal:Object.assign({},base.pal),env:Object.assign({},base.env)});
  c.holes=n;
  return c;
}
function registerCustom(sp){
  const c=buildCustomCourse(sp);
  const i=COURSES.findIndex(x=>x.id===sp.id);
  if(i>=0)COURSES[i]=c;else COURSES.push(c);
  COURSE_BY[sp.id]=c;

const CAMS=['chase','tee','tv','flag','drone','map'];

function lookAtPose(px,py,pz,tx,ty,tz){
  const dx=tx-px,dy=ty-py;return{x:px,y:py,z:pz,yaw:Math.atan2(dx,-dy),pitch:Math.atan2(pz-tz,Math.hypot(dx,dy)||1)};

function rigPose(){
  const h=hole(),b=R.ball,v=R.vis||b,mode=R.camMode,s=R.shot;
  if(R.phase==='hole'&&R.camFrozen)return R.camFrozen;
  const flying=(R.phase==='fly'||R.phase==='swing'&&false)&&s;
  const aim=R.aim,fx=Math.sin(aim),fy=-Math.cos(aim),rx=Math.cos(aim),ry=Math.sin(aim);
  const clubNow=CLUBS[R.club];
  if(flying){
    const yaw=s.yaw,dx=Math.sin(yaw),dy=-Math.cos(yaw),putt=!!s.putt,g=heightAt(h,v.x,v.y);
    const vz=Math.max(0,v.z-g);

    const sp=R.vel||{x:dx,y:dy};
    const m=Math.hypot(sp.x,sp.y)||1,ux=sp.x/m,uy=sp.y/m;
    if(mode==='tv'){
      const st=R.snap?R.snap.ball:b,al=Math.max(0,(v.x-st.x)*dx+(v.y-st.y)*dy-70);
      const px=st.x+dx*al+Math.cos(yaw)*(putt?9:42)-dx*8,py=st.y+dy*al+Math.sin(yaw)*(putt?9:42)-dy*8;
      return lookAtPose(px,py,heightAt(h,px,py)+(putt?2.5:9),v.x,v.y,v.z);
    }
    if(mode==='flag'){
      const ex=h.pin.x-ux*0,ey=h.pin.y;const tx=b.x-h.pin.x,ty=b.y-h.pin.y,tm=Math.hypot(tx,ty)||1;
      const dd=Math.min(tm,putt?5:28),px=h.pin.x+tx/tm*dd,py=h.pin.y+ty/tm*dd;

    }
    if(mode==='drone'){
      const px=v.x-ux*34,py=v.y-uy*34,z=Math.max(heightAt(h,px,py)+4,v.z+(putt?10:42));
      return lookAtPose(px,py,z,v.x+ux*8,v.y+uy*8,Math.max(g,v.z-2));
    }
    const back=(mode==='tee'?(putt?5:16):(putt?7.5:24)),px=v.x-ux*back,py=v.y-uy*back;
    const cz=Math.max(heightAt(h,px,py)+(putt?2.1:4),putt?g+2.4:v.z*.55+5.5);
    let lx=v.x+ux*(putt?2:12),ly=v.y+uy*(putt?2:12);
    if(!putt&&s.land){const m2=Math.hypot(s.land.x-v.x,s.land.y-v.y)||1,k=clamp(m2*.4,6,55);lx=v.x+(s.land.x-v.x)/m2*k;ly=v.y+(s.land.y-v.y)/m2*k}

  }
  if(mode==='flag'){
    const tx=b.x-h.pin.x,ty=b.y-h.pin.y,tm=Math.hypot(tx,ty)||1,dd=Math.min(tm,14);
    const px=h.pin.x+tx/tm*dd,py=h.pin.y+ty/tm*dd;

    const px=b.x-fx*30,py=b.y-fy*30,Lk=clamp(clubNow.putter?Math.min(eff,d):eff*.8,20,160);

  if(clubNow.putter){B=mode==='tee'?5:7.5;H=mode==='tee'?1.8:2.5;Lk=clamp(Math.min(eff,d)+4,12,45)}
  else if(d<70){B=mode==='tee'?5:8.5;H=mode==='tee'?2:3;Lk=clamp(Math.min(eff,d+10)*.9,25,90)}
  const px=b.x-fx*B,py=b.y-fy*B,tx=b.x+fx*Lk,ty=b.y+fy*Lk;
  return lookAtPose(px,py,Math.max(heightAt(h,px,py)+H,g0+H*.7),tx,ty,heightAt(h,tx,ty));
}

/* the power bar: the small green sweet spot in the middle is a full-power hit; left of it is a softer swing, right of it is an overswing that costs accuracy */
const SWEET=.05;
const isPutt=()=>!!(R&&CLUBS[R.club].putter);
/* full shots: the goal is to stop the needle in the middle sweet spot. Putts: the needle fills up and the middle is the full-length putt. */
function pwr(u){
  if(isPutt()){
    /* the sweet spot rolls the ball just far enough to reach the hole; left is short, right is long */
    const dz=Math.abs(u-.5),f=dz<=SWEET*2?1:1+(u-.5)*2*.4,need=(distPin()+.5)/1.12,mx=clubDist(CLUBS[R.club],R.lie);
    return{p:clamp(need*f/mx,.03,1),over:0,f,sweet:dz<=SWEET*2};
  }
  /* the sweet spot is always the right power for the distance to the pin (or full power if the pin is out of reach) */
  const dz=Math.abs(u-.5),sweet=dz<=SWEET*2,eff=clubDist(CLUBS[R.club],R.lie)*(R.pmul||1),d=distPin();
  if(d<eff*.999){const target=Math.max(.06,d/eff),f=sweet?1:1+(u-.5)*2*.55;return{p:clamp(target*f,.04,1),over:0,f,sweet,aim:true}}
  const dd=dz*2,z=SWEET*4;
  return{p:sweet?1:Math.max(.4,1-(dd-z)*.85),over:0,f:1,sweet};
}

  else{$('aCur').style.left=(v*100)+'%';const e=(v-.5)*2;$('aVal').textContent=Math.abs(e)<zoneW()?'Perfect':(e<0?'L ':'R ')+Math.round(Math.abs(e)*100)}

/* the one place a swing becomes a ball flight. err is -1..1 (left to right) */
function takeShot(power,err,now){

  R.phase='swing';R.swAnim={t0:now,from:-power,power};setBtn();
  auResume();sfx('swoosh',power);
}

/* ----- CPU golfer ----- */
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)}
function cpuSkill(p){const d=p.diff==='easy'?.2:p.diff==='med'?.5:.8;return clamp(d*.55+p.g.acc*.45,.15,.98)}
function cpuPlan(){
  const h=hole(),b=R.ball,lie=R.lie,d=distPin(),p=R.cur,pt=cIdx('pt');
  const toPin=Math.atan2(h.pin.x-b.x,-(h.pin.y-b.y));
  const gg=golfer(),cupR=.36+gg.cup+(gearT('putter').cup||0)+gg.putt*.06;
  if(((lie==='green'||lie==='fringe')&&d<40)||(d<20&&lie!=='sand'&&lie!=='rough'&&lie!=='deep')){
    const club=CLUBS[pt],maxD=clubDist(club,lie);let best=null;
    for(const off of [-.07,-.045,-.025,-.012,0,.012,.025,.045,.07])for(const k of [.85,1,1.15,1.35]){
      const dist=Math.min(maxD,d*k+.4),yaw=toPin+off*Math.min(1,d/12);
      const r=simBall(h,b,{putt:true,yaw,speed:puttSpeed(h,dist),club,cupR});
      const e=Math.hypot(r.end.x-h.pin.x,r.end.y-h.pin.y),sc=r.holed?-5:e+(r.water?30:0);
      if(!best||sc<best.sc)best={sc,yaw,power:dist/maxD};
    }
    return{club:pt,aim:best.yaw,power:clamp(best.power,.05,1)};
  }
  const skill=cpuSkill(p),sigma=lerp(1.15,.42,skill);
  const cand=[];
  const clubs=[];
  for(let i=0;i<pt;i++){if(!bagOK(i))continue;const dd=clubDist(CLUBS[i],lie);if(lie==='sand'&&!CLUBS[i].sand&&dd<d*1.2&&d>60)continue;clubs.push([i,dd])}
  const fit=clubs.filter(c=>c[1]>=d*.97).sort((a,b)=>a[1]-b[1]).slice(0,2);
  if(fit.length)fit.forEach(c=>cand.push(c));
  const below=clubs.filter(c=>c[1]<d*.97).sort((a,b)=>b[1]-a[1]);
  if(below.length&&!(lie==='tee'&&h.par>=4))cand.push(below[0]);
  if(lie==='tee'&&h.par>=4){cand.length=0;cand.push([0,clubDist(CLUBS[0],lie)]);if(bagOK(1))cand.push([1,clubDist(CLUBS[1],lie)])}
  if(!cand.length)cand.push(clubs[0]||[0,clubDist(CLUBS[0],lie)]);
  let best=null;
  for(const [ci,dd] of cand){
    const club=CLUBS[ci],spr=clubSpread(club,lie);
    for(const pw of (dd>=d*.97&&d<dd?[d/dd,Math.min(1,d/dd*1.04)]:[1,.9])){
      for(const off of [-.1,-.05,0,.05,.1]){
        const power=clamp(pw,.3,1),carry=dd*power,yaw0=toPin+off*Math.min(.6,Math.max(.12,60/Math.max(30,d)));
        let tot=0;const M=5;
        for(let m=0;m<M;m++){
          const e=gauss()*sigma,pe=1+gauss()*.025*(1.3-skill),err=clamp(e,-1,1);
          const cr=carry*pe;
          const r=simBall(h,b,{yaw:yaw0+.55*err*spr*.01745,carry:Math.max(3,cr),club,curve:.45*err*spr*.01745*cr,wmul:windMult(),cupR});
          let e2=Math.hypot(r.final.x-h.pin.x,r.final.y-h.pin.y);
          if(h.par===5&&d>dd*1.3)e2=Math.hypot(r.final.x-h.pin.x,r.final.y-h.pin.y)*.5;
          tot+=e2+r.penalty*28+(r.tree?9:0)+(r.surf==='sand'?7:r.surf==='deep'?6:r.surf==='rough'?2:0)+(r.holed?-20:0);
        }
        const sc=tot/M;
        if(!best||sc<best.sc)best={sc,club:ci,aim:yaw0,power};
      }
    }
  }
  return best;
}
function cpuSwing(pl){
  const skill=cpuSkill(R.cur),putt=CLUBS[pl.club].putter;
  const sigma=putt?lerp(.6,.22,skill):lerp(1.15,.42,skill);
  const err=clamp(gauss()*sigma*(Math.random()<skill*.25?0:1),-1,1);
  const pe=clamp(pl.power*(1+gauss()*(putt?.07:.035)*(1.45-skill)),.05,1);
  return{err,power:pe};
}
function cpuSchedule(ms){clearTimeout(R.cpuT);R.cpuT=setTimeout(cpuAct,ms)}
function cpuAct(){
  if(!R||R.cur.kind!=='cpu'||R.phase!=='cpu')return;
  const pl=cpuPlan();
  R.club=pl.club;R.aim=pl.aim;R.gkey='';refreshUI();
  const sw=cpuSwing(pl);
  setTimeout(()=>{if(R&&R.phase==='cpu')takeShot(sw.power,sw.err,performance.now()/1000)},650);
}
function skipCpu(){
  if(!R||!R.cur||R.cur.kind!=='cpu')return;
  clearTimeout(R.cpuT);R.anim=null;R.swAnim=null;
  const h=hole();
  let guard=0;
  while(guard++<14){
    if(R.phase==='fly'||R.phase==='swing'){
      /* finish the shot in flight */
      R.anim=null;endShotCore();if(R.phase==='hole')return;
    }
    R.phase='cpu';
    const pl=cpuPlan();R.club=pl.club;R.aim=pl.aim;
    const sw=cpuSwing(pl);
    takeShot(sw.power,sw.err,0);

    if(R.strokes>=h.par+5)return;
  }
}
/* ---------- Round controller: flight playback, results, loop, input ---------- */
const PB=1.15;
function launch(now){
  const s=R.shot;R.phase='fly';
  R.anim={t0:now,i:0,k:0,pt:s.pts,ev:s.ev,wait:0,last:{x:R.ball.x,y:R.ball.y}};
  R.vel={x:Math.sin(s.yaw),y:-Math.cos(s.yaw)};
  if(s.putt)sfx('putt');else{sfx('hit',R.m.power||.8,R.club<=3)}
}
function pushTrail(t,x,y,z){R.trail.push(t,x,y,z);if(R.trail.length>2400)R.trail.splice(0,40)}
function cheerNear(x,y,rad,dur,k){
  const now=performance.now()/1000,h=hole();
  for(const f of h.fans)if(Math.hypot(f.x-x,f.y-y)<rad)f.cheer=now+dur*(.6+Math.random()*.6);
  for(const s of h.stands)if(Math.hypot(s.x-x,s.y-y)<rad+30)s.cheer=now+dur;
  if(SET.crowd)sfx('cheer',k);
}
function stepAnim(now){
  const a=R.anim,s=R.shot;
  if(a.wait){if(now>=a.wait){R.anim=null;endShot()}return}
  const t=(now-a.t0)*PB,P=a.pt;
  let i=a.i;while(i+4<P.length&&P[i+4]<=t)i+=4;a.i=i;
  const j=Math.min(i+4,P.length-4),t0=P[i],t1=P[j],u=t1>t0?clamp((t-t0)/(t1-t0),0,1):1;
  const x=lerp(P[i+1],P[j+1],u),y=lerp(P[i+2],P[j+2],u),z=lerp(P[i+3],P[j+3],u);
  const vx=x-a.last.x,vy=y-a.last.y;
  if(Math.hypot(vx,vy)>.002&&R.vel){R.vel.x=lerp(R.vel.x,vx,.12);R.vel.y=lerp(R.vel.y,vy,.12)}
  a.last={x,y};
  setVis(x,y,z);pushTrail(t,x,y,z);
  while(a.k<a.ev.length&&a.ev[a.k][0]<=t){
    const e=a.ev[a.k++];
    if(e[1]==='b')sfx('bounce',e[2]);else if(e[1]==='s')sfx('sand');else if(e[1]==='t')sfx('tree');
    else if(e[1]==='w'){R.fx={x,y,t0:now};R.vis.hide=true;sfx('splash')}
    else if(e[1]==='c'){sfx('cup')}
  }
  if(i+4>=P.length&&t>=P[P.length-4]){
    if(s.penalty){toast(s.note,'bad');a.wait=now+1.3}
    else if(s.holed)a.wait=now+.9;
    else{if(s.tree||s.note)toast(s.note,'');a.wait=now+.45}
    if(!s.putt&&!s.penalty&&R.cur.kind!=='cpu'&&s.land&&R.snap){
      const carry=Math.hypot(s.land.x-R.snap.ball.x,s.land.y-R.snap.ball.y),tot=Math.hypot(s.final.x-R.snap.ball.x,s.final.y-R.snap.ball.y);
      if(carry>25){
        let msg='Carry '+yardsTxt(carry)+' · Total '+yardsTxt(tot);
        if(tot>(S.longest||0)&&R.club<=3&&R.snap.lie==='tee'){S.longest=Math.round(tot);saveGame();msg+=' · New longest drive!'}
        toast(msg,'good');
      }
    }
    if(!s.penalty&&!s.holed){
      const hh=hole(),dp=Math.hypot(s.end.x-hh.pin.x,s.end.y-hh.pin.y),sf=s.surf;
      if(dp<6&&(sf==='green'||sf==='fringe'))cheerNear(s.end.x,s.end.y,110,2.6,dp<2.5?1.2:.8);
      else if(dp<25&&sf==='green')cheerNear(s.end.x,s.end.y,70,1.8,.5);
      else if(!s.putt&&s.land&&Math.hypot(s.land.x-R.snap.ball.x,s.land.y-R.snap.ball.y)>230)cheerNear(s.end.x,s.end.y,90,1.6,.6);
    }else if(s.holed)cheerNear(hole().pin.x,hole().pin.y,160,3.5,1.4);
    else if(SET.crowd)sfx('groan');
  }
}
function endShot(){endShotCore()}
function endShotCore(){
  const s=R.shot,h=hole();R.shot=null;
  if(!s)return;
  R.strokes+=1+(s.penalty||0);
  let holed=!!s.holed;
  if(!holed&&s.putt&&!s.penalty&&Math.hypot(s.final.x-h.pin.x,s.final.y-h.pin.y)<.75&&['green','fringe'].includes(surfaceAt(h,s.final.x,s.final.y))){R.strokes+=1;holed=true;if(R.cur.kind!=='cpu')toast('Tap-in','good')}
  R.ball=holed?{x:h.pin.x,y:h.pin.y}:{x:s.final.x,y:s.final.y};
  let ls=holed?'green':surfaceAt(h,R.ball.x,R.ball.y);
  if(s.tree&&ls==='fairway')ls='rough';
  if(ls==='water'||ls==='oob')ls='rough';
  R.lie=ls;
  setVis(R.ball.x,R.ball.y);
  R.anim=null;
  if(holed){holeDone(false);return}
  if(R.strokes>=h.par+5){holeDone(true);return}
  R.sw=0;R.swAnim=null;R.vel=null;R.trail=[];R.gkey='';
  R.aim=aimToward();

  else{R.phase='aim';R.pmul=1;R.club=SET.autoClub?autoClub():R.club;refreshUI()}

/* ----- hole and round results ----- */
function holeDone(pick){
