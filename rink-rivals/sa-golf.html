  R.phase='hole';setBtn();
  p.scores.push(st);p.lastScore=st-h.par;p.total+=st-h.par;p.last=st;
  const name=pick?'Picked up':scoreName(st,h.par);
  let coins=0;
  if(p.me||R.players.length===1){
    coins=Math.max(5,20+(h.par-st)*20);
    if(st===1&&!pick)coins+=250;
    coins=Math.round(coins*R.course.tier*(pick?.5:1)*(HARD[R.hard]||HARD.hard).pay);
    R.coins+=coins;S.coins+=coins;saveGame();updateCoins();
  }
  if(!pick&&st<=h.par-1){sfx('fanfare');if(st===1)banner('HOLE IN ONE!')}
  renderPlayers();
  if(R.ti+1<R.order.length){
    toast(p.name+': '+name,st<=h.par?'good':'');
    setTimeout(()=>{if(R&&R.phase==='hole'){R.ti++;beginTurn()}},1500);
    return;
  }
  const last=R.hi>=R.holeList.length-1,el=$('holeResult');
  let rows='';
  if(R.players.length>1)rows='<div class="hrows">'+R.order.map(q=>'<div><i style="background:'+q.color+'"></i><span>'+esc(q.name)+'</span><b>'+q.last+'</b><em>'+esc(scoreName(q.last,h.par))+'</em></div>').join('')+'</div>';
  el.innerHTML='<h2>'+esc(R.players.length>1?'Hole '+(R.hi+1)+' complete':name)+'</h2>'+(R.players.length>1?rows:'<div class="muted">'+st+' stroke'+(st===1?'':'s')+' · Par '+h.par+'</div>')
    +(coins?'<div class="earn">+'+COIN+coins+'</div>':'')
    +'<div class="row"><button class="btn" id="btnNext">'+(last?'Finish round':'Next hole')+'</button><button class="btn ghost" id="btnCard2">Scorecard</button></div>';
  el.hidden=false;
  $('btnNext').onclick=()=>{sfx('click');last?roundDone():startHole(R.hi+1)};
  $('btnCard2').onclick=showCard;
  $('btnMull').hidden=true;
  mpReport();
}
function cardTable(pl,from,to){
  const c=R.course,hs=R.holeList;let hd='<tr><th>Hole</th>',pr='<tr><th>Par</th>',sc='<tr><th>'+esc(pl.name).slice(0,12)+'</th>',ps=0,ss=0,played=0;
  for(let i=from;i<to;i++){

    if(s!=null){const d=s-par;cls=(s===1||d<=-2)?'eag':d===-1?'bir':d===1?'bog':d>=2?'dbl':'';ss+=s;played++}
    sc+='<td class="'+cls+'">'+(s==null?'':s)+'</td>';
  }
  return{hd:hd+'<th>Tot</th></tr>',pr:pr+'<td>'+ps+'</td></tr>',sc:sc+'<td>'+(played?ss:'')+'</td></tr>'};
}

function showCard(){showModal('<h2>'+esc(R.course.name)+'</h2>'+cardAll()+'<div><button class="btn" id="mClose">Keep playing</button></div>');$('mClose').onclick=closeModal}
function newStuff(){
  const out=[];
  COURSES.forEach(c=>{if(!S.courses.includes(c.id)&&S.coins>=c.cost)out.push(c.name)});
  GOLFERS.forEach(g=>{if(!S.golfers.includes(g.id)&&S.coins>=g.cost)out.push(g.name)});
  Object.keys(GEAR).forEach(k=>GEAR[k].tiers.forEach((t,i)=>{if(!S.owned[k].includes(i)&&S.coins>=t.cost)out.push(t.name)}));

function roundDone(){
  const c=R.course,me=R.players.find(q=>q.me)||R.players[0],total=me.scores.reduce((a,b)=>a+b,0),par=R.holeList.reduce((a,i)=>a+c.par[i],0),diff=total-par;
  const ranked=R.players.slice().sort((a,b)=>a.total-b.total),won=R.players.length>1&&ranked[0]===me;
  let bonus=Math.round((100+Math.max(0,-diff)*15)*c.tier*(R.holeList.length<c.holes?.5:1)*(c.holes<=9?.7:1));
  if(won)bonus=Math.round(bonus*1.5);
  S.coins+=bonus;R.coins+=bonus;
  const full=R.holeList.length===c.holes;
  const rec=full&&(S.best[c.id]==null||total<S.best[c.id]);
  if(rec)S.best[c.id]=total;
  if(full)S.done[c.id]=true;
  saveGame();updateCoins();
  const out=newStuff();
  let board='';
  if(R.players.length>1)board='<div class="board">'+ranked.map((q,i)=>'<div><b>'+(i+1)+'</b><i style="background:'+q.color+'"></i><span>'+esc(q.name)+' <small class="muted">'+esc(q.g.name)+'</small></span><em>'+q.scores.reduce((a,b)=>a+b,0)+' ('+fmtDiff(q.total)+')</em></div>').join('')+'</div>';
  sfx(won||R.players.length===1?'fanfare':'fail');
  mpReport(true);
  showModal('<h2>'+esc(c.name)+(won?' · You win!':'')+'</h2>'+board+'<div class="sum"><div><span>Your score</span><b>'+total+' ('+fmtDiff(diff)+')</b></div><div><span>Coins earned</span><b>'+R.coins.toLocaleString()+'</b></div><div><span>'+(rec?'New best':'Best')+'</span><b>'+(S.best[c.id]!=null?S.best[c.id]:'–')+'</b></div></div>'
    +cardAll()+'<p class="muted">Round bonus: '+bonus.toLocaleString()+' coins. '+(out.length?'You can unlock now: '+esc(out.slice(0,5).join(', '))+'.':'Keep earning coins to unlock more golfers, gear and courses.')+'</p><div><button class="btn" id="mDone">Back to home</button></div>');
  $('mDone').onclick=leaveRound;
}
function leaveRound(){
  closeModal();if(R&&R.cpuT)clearTimeout(R.cpuT);
  R=null;quitArm=0;$('btnQuit').textContent='Leave';
  auQuiet();mpReport();
  showScreen('home');
}

/* ----- main loop ----- */
function updateGuide(){
  if(!(R.phase==='aim'||R.phase==='power'||R.phase==='acc'||R.phase==='cpu')){R.guide=null;return}
  const club=CLUBS[R.club],b=R.ball,h=hole(),lie=R.lie,eff=clubDist(club,lie)*(club.putter?1:(R.pmul||1));
  const dpin=distPin(),effG=(!club.putter&&dpin<eff)?dpin:eff;
  const key=[R.aim.toFixed(3),R.pmul,R.club,lie,b.x.toFixed(1),b.y.toFixed(1),R.hi,SET.aimHelp,SET.units].join();
  if(key===R.gkey)return;R.gkey=key;
  if(!SET.aimHelp){R.guide=null;return}
  const sp=clubSpread(club,lie)*Math.PI/180;
  if(club.putter){
    const pts=[],fx=Math.sin(R.aim),fy=-Math.cos(R.aim);
    for(let d=1.5;d<eff;d+=2){const x=b.x+fx*d,y=b.y+fy*d;pts.push(0,x,y,heightAt(h,x,y)+.1)}
    const tx=b.x+fx*eff,ty=b.y+fy*eff;
    R.guide={pts,ring:{w:Math.max(1,Math.tan(sp)*eff*.7),d:Math.max(1,eff*.05)},x:tx,y:ty,yaw:R.aim,label:'max '+yardsTxt(eff)};
  }else{
    const sim=simBall(h,b,{yaw:R.aim,carry:effG,club,wmul:windMult()});
    const pts=sim.pts.slice(0,Math.max(8,sim.landIdx+4));
    R.guide={pts,ring:{w:Math.max(1.4,Math.tan(sp)*effG*.7),d:Math.max(1.4,effG*.05)},x:sim.land.x,y:sim.land.y,yaw:R.aim,label:yardsTxt(Math.hypot(sim.land.x-b.x,sim.land.y-b.y))};
  }
}
function update(dt,now){
  if(R.phase==='aim'){const k=(keys.R?1:0)-(keys.L?1:0);if(k){R.aim=clamp(R.aim+k*dt*(keys.fine?.25:.9),-1.7,1.7)}}
  if(R.phase==='power'){
    R.m.p=Math.min(1,(now-R.m.t0)/(1.9*golfer().meter));
    setMeter('p',R.m.p);R.sw=-pwr(R.m.p).p;
    if(R.m.p>=1)lockPower(now);
  }else if(R.phase==='acc'){
    const per=2.2*golfer().meter*(CLUBS[R.club].putter?1.15:1),u=((now-R.m.t1)/per)%1;
    R.m.pos=u<.5?u*2:2-u*2;setMeter('a',R.m.pos);R.sw=-R.m.power;
    if(now-R.m.t1>per*2)lockAcc(now);
  }
  if(R.swAnim){
    const u=clamp((now-R.swAnim.t0)/.4,0,1);
    R.sw=lerp(R.swAnim.from,1,u*u*(3-2*u));
    if(R.phase==='swing'&&u>=.55){launch(now)}
    if(u>=1)R.swAnim=null;
  }
  if(R.phase==='cpu'&&R.sw!==0&&!R.swAnim)R.sw=0;
  {const q=R.phase==='swing'||R.phase==='fly'||R.phase==='hole',c=$('ctrl'),mm=R.phase==='power'||R.phase==='acc';if(c.classList.contains('meterMode')!==mm)c.classList.toggle('meterMode',mm);if(c.dataset.ph!==R.phase)c.dataset.ph=R.phase;if(c.classList.contains('quiet')!==q)c.classList.toggle('quiet',q)}
  if(R.anim)stepAnim(now);
  if(R.phase==='aim'||R.phase==='power'||R.phase==='acc'||R.phase==='cpu')updateGuide();else R.guide=null;
  if(view==='orbit'){
    const T=rigPose(),k=1-Math.exp(-dt*(R.phase==='fly'?7:4.5));
    cam3.x+=(T.x-cam3.x)*k;cam3.y+=(T.y-cam3.y)*k;cam3.z+=(T.z-cam3.z)*k;
    cam3.yaw+=angDiff(cam3.yaw,T.yaw)*k;cam3.pitch+=(T.pitch-cam3.pitch)*k;
    const g=heightAt(hole(),cam3.x,cam3.y)+1;if(cam3.z<g)cam3.z=g;
  }else{
    const T=camTarget(),k=1-Math.exp(-dt*5);
    cam.x+=(T.x-cam.x)*k;cam.y+=(T.y-cam.y)*k;cam.s+=(T.s-cam.s)*k;
  }
  R._dt=(R._dt||0)+dt;if(R._dt>.5){R._dt=0;$('hDist').textContent=yardsTxt(distPin())}
}
function drawOrbit(now){
  const h=hole();
  const gb=R.phase==='fly'&&R.snap?R.snap.ball:R.ball,yaw=R.phase==='fly'&&R.shot?R.shot.yaw:R.aim;
  const aiming=R.phase==='aim'||R.phase==='power'||R.phase==='acc'||R.phase==='swing'||R.phase==='cpu';
  const fly=R.phase==='fly',cm=R.camMode,near=cm==='chase'||cm==='tee';
  renderScene(h,R.course,now,{
    shift:near?(fly?.44:CLUBS[R.club].putter?.4:.36):(cm==='drone'?.46:.5),
    ball:R.vis,trail:R.trail,fx:R.fx,hi:R.hi,
    golfer:{show:R.phase!=='hole',x:gb.x,y:gb.y,yaw,look:golferLook(golfer()),sw:R.sw},
    guide:aiming?R.guide:null,
    slope:(R.lie==='green'||R.lie==='fringe'||CLUBS[R.club].putter)&&distPin()<h.gr+40&&aiming
  });
}
function draw(now){if(view==='map')draw2D(now);else drawOrbit(now)}
let lastT=performance.now()/1000,musicTick=0;
const PERF={t:0,n:0};
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now()/1000,raw=now-lastT,dt=Math.min(.05,raw);lastT=now;
  /* if the device struggles, quietly draw fewer pixels so the game stays smooth */
  if(raw<.25){PERF.t+=raw;if(++PERF.n>=90){const avg=PERF.t/PERF.n;PERF.t=0;PERF.n=0;if(avg>.036&&DPR>.55){DPRCAP=Math.max(.5,DPR*.8);fitCanvas()}}}
  if(now>musicTick){musicTick=now+1.5;auMusic()}
  if(!R||!$('round').classList.contains('on')){homeFrame(now,dt);return}
  update(dt,now);draw(now);
}

/* ----- input ----- */
$('swingBtn').addEventListener('click',lockSwing);
$('clubs').addEventListener('click',e=>{const b=e.target.closest('.club');if(b&&!b.disabled&&R&&R.phase==='aim'){R.club=+b.dataset.i;R.gkey='';refreshUI();sfx('click')}});
$('btnCam').addEventListener('click',()=>{if(R){cycleCam();sfx('click')}});
$('btnPin').addEventListener('click',()=>{if(R&&R.phase==='aim'){R.aim=aimToward();R.gkey='';sfx('click')}});
$('btnPow').addEventListener('click',()=>{if(R&&R.phase==='aim'){R.pmul=R.pmul===1?.75:R.pmul===.75?.5:1;R.gkey='';refreshUI();sfx('click')}});
$('btnSkip').addEventListener('click',()=>{skipCpu()});
['aimL','aimR'].forEach(id=>{
  const k=id==='aimL'?'L':'R',on=e=>{e.preventDefault();keys[k]=true},off=()=>{keys[k]=false};
  const b=$(id);b.addEventListener('pointerdown',on);
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off));
});
let dragX=0;
function aimAt(e){
  if(view==='orbit'){R.aim=clamp(R.aim+(e.clientX-dragX)*.0045,-1.7,1.7);dragX=e.clientX;return}
  const r=cv.getBoundingClientRect(),wx=cam.x+(e.clientX-r.left-VW/2)/cam.s,wy=cam.y+(e.clientY-r.top-VH/2)/cam.s;
  const dx=wx-R.ball.x,dy=wy-R.ball.y;
  if(Math.hypot(dx,dy)>.5)R.aim=clamp(Math.atan2(dx,-dy),-1.7,1.7);
}
cv.addEventListener('pointerdown',e=>{
  if(!R||!$('round').classList.contains('on'))return;
  if(R.phase==='aim'){R.drag=true;dragX=e.clientX;try{cv.setPointerCapture(e.pointerId)}catch(_){}if(view==='map')aimAt(e)}
  else if(R.phase==='power'||R.phase==='acc')lockSwing();
});
cv.addEventListener('pointermove',e=>{if(R&&R.drag&&R.phase==='aim')aimAt(e)});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(R)R.drag=false}));
addEventListener('keydown',e=>{
  if(!R||!$('round').classList.contains('on')||!$('modal').hidden)return;
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)lockSwing()}
  else if(e.code==='ArrowLeft'){e.preventDefault();keys.L=true}
  else if(e.code==='ArrowRight'){e.preventDefault();keys.R=true}
  else if(e.code==='ArrowUp'||e.code==='KeyE'){e.preventDefault();cycleClub(-1)}
  else if(e.code==='ArrowDown'||e.code==='KeyQ'){e.preventDefault();cycleClub(1)}
  else if(e.code==='KeyC'){cycleCam()}
  else if(e.code==='KeyV')setCamMode(R.camMode==='map'?'chase':'map');
  else if(e.code==='KeyP'&&R.phase==='aim'){R.aim=aimToward();R.gkey=''}
  keys.fine=e.shiftKey;
});
addEventListener('keyup',e=>{
  if(e.code==='Space')e.preventDefault();
  if(e.code==='ArrowLeft')keys.L=false;
  if(e.code==='ArrowRight')keys.R=false;
  keys.fine=e.shiftKey;
});
$('btnCard').addEventListener('click',()=>{if(R)showCard()});
$('btnMull').addEventListener('click',()=>{
  if(!R||!R.snap||R.phase!=='aim')return;
  const s=R.snap;
  R.ball={x:s.ball.x,y:s.ball.y};R.lie=s.lie;R.strokes=s.strokes;R.aim=s.aim;R.club=s.club;
  setVis(R.ball.x,R.ball.y);R.snap=null;R.cur.mull++;R.sw=0;R.trail=[];R.gkey='';
  toast('Mulligan! Take it again','good');refreshUI();
});
$('btnQuit').addEventListener('click',()=>{
  const b=$('btnQuit');
  if(quitArm>performance.now()){leaveRound();return}
  quitArm=performance.now()+3000;b.textContent='Tap again to leave';
  setTimeout(()=>{if(R&&quitArm){b.textContent='Leave';quitArm=0}},3000);
});
if(window.ResizeObserver)new ResizeObserver(()=>fitCanvas()).observe(document.getElementById('stage'));
/* ---------- Online lobby: rooms live in the shared "room" presence. Everyone plays their own ball; scores travel as presence. ---------- */
const MP={room:null,ok:false,code:'',host:false,ready:false,cfg:{c:'standrews',t:'back',hs:'18',w:'real'},started:false,unsub:null};
function mpName(){return (S.name||'Golfer').slice(0,16)}
async function mpInit(){
  try{
    if(!window.claude||!claude.use){mpConn();return}
    MP.room=await claude.use('room');
    try{
      const user=await claude.use('user');
      if(user&&!S.name){const me=await user.me();if(me&&me.name){S.name=String(me.name).split(' ')[0].slice(0,16);saveGame()}}
    }catch(e){}
  }catch(e){MP.room=null}
  if(!MP.room){mpConn();return}
  MP.ok=true;
  MP.unsub=MP.room.onPeers(()=>mpPeers(),()=>{});
  try{MP.room.onConnected(()=>mpConn(),()=>{})}catch(e){}
  mpReport();mpConn();
}
function mpConn(){
  const el=$('conn');if(!el)return;
  const on=MP.ok&&(!MP.room.connected||MP.room.connected());
  el.textContent=on?'Online':'Offline';el.className='conn '+(on?'on':'off');
}
function mpPeersList(){
  if(!MP.ok)return[];
  try{return MP.room.peers().filter(p=>p.presence&&p.presence.g==='atwg'&&p.kind==='viewer')}catch(e){return[]}
}
function mpOthers(){
  if(!MP.code)return[];
  return mpPeersList().filter(p=>!p.isMe&&p.presence.rm===MP.code).map(p=>({name:String(p.presence.n||'Golfer').slice(0,16),total:+p.presence.tot||0,hole:+p.presence.hole||0}));
}
function mpReport(final){
  if(!MP.ok)return;
  const p={g:'atwg',n:mpName(),rm:MP.code||'',h:MP.host?1:0,rd:MP.ready?1:0,gf:S.golfer};
  if(MP.host){p.c=MP.cfg.c;p.t=MP.cfg.t;p.hs=MP.cfg.hs;p.w=MP.cfg.w}
  if(R&&R.online){const me=R.players.find(q=>q.me);p.st=final?'done':'play';p.hole=me.scores.length;p.tot=me.total;p.c=R.course.id}
  else p.st=MP.started?'play':'lobby';
  if(MP.host&&MP.started&&!R)p.st='play';
  try{MP.room.presence(p).catch(()=>{})}catch(e){}
}
function mpMembers(){return MP.code?mpPeersList().filter(p=>p.presence.rm===MP.code):[]}
function mpHostPeer(code){return mpPeersList().find(p=>p.presence.rm===code&&p.presence.h===1)}
function mpPeers(){
  if(!MP.ok)return;
  mpConn();
  /* guests follow the host into the round */
  if(MP.code&&!MP.host&&!R&&!MP.started){
    const hp=mpHostPeer(MP.code);
    if(hp&&hp.presence.st==='play'&&COURSE_BY[hp.presence.c]){MP.started=true;mpBegin(hp.presence)}
  }
  if(MP.code&&!MP.host&&!mpHostPeer(MP.code)&&!R&&screen==='lobby'&&mpPeersList().length&&Date.now()-(MP.joinedAt||0)>4000){
    toast('The host left the room','bad');MP.code='';MP.ready=false;mpReport();
  }
  if(screen==='lobby')renderLobby();
  if(R&&R.online)renderPlayers();
}
function mpBegin(c){
  closeModal();
  startRound({course:c.c,tees:c.t||'back',holes:c.hs||'18',wind:c.w||'real',mode:'online',online:{code:MP.code}});
}
function mpCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function mpCreate(){MP.code=mpCode();MP.host=true;MP.ready=true;MP.started=false;MP.joinedAt=Date.now();mpReport();renderLobby()}
function mpJoin(code){MP.code=code;MP.host=false;MP.ready=false;MP.started=false;MP.joinedAt=Date.now();mpReport();renderLobby()}
function mpLeave(){MP.code='';MP.host=false;MP.ready=false;MP.started=false;mpReport();renderLobby()}
function mpRooms(){
  const out=[];
  for(const p of mpPeersList()){
    if(p.presence.h!==1||!p.presence.rm||p.presence.st!=='lobby')continue;
    const n=mpPeersList().filter(q=>q.presence.rm===p.presence.rm).length;
    out.push({code:p.presence.rm,host:String(p.presence.n||'Golfer').slice(0,16),course:p.presence.c,n,mine:p.presence.rm===MP.code});
  }
  return out;
}
function renderLobby(){
  const L=$('lobbyL'),Rr=$('lobbyR');if(!L)return;
  mpConn();
  const rooms=mpRooms().filter(r=>!r.mine);
  let l='<h3 class="sec">Find a game</h3>';
  if(!MP.ok){
    l+='<p class="muted">Online rooms need this page to be opened from a shared link by signed-in people. You can still play against CPU golfers or pass and play on one device.</p>'
      +'<div class="foot" style="margin-top:12px"><button class="btn" data-go="home" id="mpHome">Back to home</button></div>';
  }else{
    l+='<p class="muted">Rooms are shared with everyone who has this page open right now. Each golfer plays their own ball and the leaderboard updates live.</p>'
      +'<div class="foot" style="margin:12px 0"><button class="btn" id="mpCreate"'+(MP.code?' disabled':'')+'>Create room</button><button class="btn ghost" id="mpQuick"'+(MP.code?' disabled':'')+'>Quick play</button></div>'
      +'<div class="muted" style="font:600 13px var(--f-ui);letter-spacing:.14em;text-transform:uppercase">Open rooms</div><div class="rooms">'
      +(rooms.length?rooms.map(r=>'<div class="room"><div><b>'+esc(r.code)+'</b> · '+esc(r.host)+'<div class="muted">'+esc(COURSE_BY[r.course]?COURSE_BY[r.course].name:'Course TBD')+' · '+r.n+'/4 players</div></div><button class="btn sm" data-mpjoin="'+esc(r.code)+'"'+(MP.code||r.n>=4?' disabled':'')+'>Join</button></div>').join(''):'<div class="muted">No open rooms yet. Create one and share the page with a friend.</div>')
      +'</div><p class="muted" style="margin-top:12px">Playing as <b>'+esc(mpName())+'</b> · change your name in Settings.</p>';
  }
  L.innerHTML=l;
  let r='<h3 class="sec">'+(MP.code?'Room '+esc(MP.code):'Your room')+'</h3>';
  if(!MP.code){
    r+='<p class="muted">Create a room or join one from the list. Up to four players per room.</p><div class="foot" style="margin-top:12px"><button class="btn ghost" id="mpCpu">Play vs CPU instead</button></div>';
  }else{
    const mem=mpMembers();
    r+='<div class="plist">'+mem.map(p=>'<div><i class="'+(p.presence.rd||p.presence.h?'rdy':'')+'"></i><span>'+esc(String(p.presence.n||'Golfer').slice(0,16))+(p.isMe?' (you)':'')+(p.presence.h?' · host':'')+'</span><small class="muted">'+esc((GOLFERS.find(g=>g.id===p.presence.gf)||{name:''}).name)+'</small></div>').join('')+'</div>';
    const hostPres=MP.host?MP.cfg:(mpHostPeer(MP.code)?{c:mpHostPeer(MP.code).presence.c,t:mpHostPeer(MP.code).presence.t,hs:mpHostPeer(MP.code).presence.hs,w:mpHostPeer(MP.code).presence.w}:MP.cfg);
    if(MP.host){
      r+='<div class="field"><label>Course</label><select id="mpCourse">'+COURSES.filter(c=>!c.custom).map(c=>'<option value="'+c.id+'"'+(c.id===MP.cfg.c?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'
        +'<div class="field"><label>Tees</label>'+['back','mid','fwd'].map(k=>'<button class="chip" data-mpcfg="t:'+k+'" aria-pressed="'+(MP.cfg.t===k)+'">'+TEES[k].name+'</button>').join(' ')+'</div>'
        +'<div class="field"><label>Holes</label>'+((COURSE_BY[MP.cfg.c]||{holes:18}).holes>9?[['18','All 18'],['f9','Front 9'],['b9','Back 9']]:[['18','The hardest 9']]).map(o=>'<button class="chip" data-mpcfg="hs:'+o[0]+'" aria-pressed="'+(MP.cfg.hs===o[0])+'">'+o[1]+'</button>').join(' ')+'</div>'
        +'<div class="field"><label>Wind</label>'+[['off','None'],['calm','Calm'],['real','Real'],['strong','Gale']].map(o=>'<button class="chip" data-mpcfg="w:'+o[0]+'" aria-pressed="'+(MP.cfg.w===o[0])+'">'+o[1]+'</button>').join(' ')+'</div>';
    }else{
      const cc=COURSE_BY[hostPres.c];
      r+='<p>'+esc(cc?cc.name:'Waiting for the host to pick a course')+' · '+esc((TEES[hostPres.t]||TEES.back).name)+' tees · '+esc(hostPres.hs==='f9'?'Front 9':hostPres.hs==='b9'?'Back 9':'18 holes')+'</p>';
    }
    r+='<div class="foot" style="margin-top:12px"><button class="btn ghost" id="mpLeave">Leave room</button>'
      +(MP.host?'<button class="btn big" id="mpStart">Start round</button>':'<button class="btn" id="mpReady">'+(MP.ready?'Not ready':'Ready')+'</button>')+'</div>'
      +(MP.host?'':'<p class="muted" style="margin-top:8px">The round starts when the host presses Start.</p>');
  }
  Rr.innerHTML=r;
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='mpCreate'){sfx('click');mpCreate()}
  else if(t.id==='mpQuick'){sfx('click');const r=mpRooms().find(x=>x.n<4&&!x.mine);r?mpJoin(r.code):mpCreate()}
  else if(t.dataset&&t.dataset.mpjoin){sfx('click');mpJoin(t.dataset.mpjoin)}
  else if(t.id==='mpLeave'){sfx('click');mpLeave()}
  else if(t.id==='mpReady'){sfx('click');MP.ready=!MP.ready;mpReport();renderLobby()}
  else if(t.id==='mpCpu'){go('home');openSetup()}
  else if(t.id==='mpStart'){
    sfx('click');MP.started=true;mpReport();
    mpBegin({c:MP.cfg.c,t:MP.cfg.t,hs:MP.cfg.hs,w:MP.cfg.w});
  }
  else if(t.dataset&&t.dataset.mpcfg){const[k,v]=t.dataset.mpcfg.split(':');MP.cfg[k]=v;sfx('click');mpReport();renderLobby()}
});
document.addEventListener('change',e=>{if(e.target.id==='mpCourse'){MP.cfg.c=e.target.value;mpReport()}});
/* ----- boot ----- */
loadSave();loadCustomCourses();loadSettings();auVolumes();updateCoins();fitCanvas();renderHome();
if(typeof mpInit==='function')mpInit();
requestAnimationFrame(frame);
