.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.g{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.q{font-size:23px;font-weight:600;line-height:1.3;margin:4px 0 14px;text-align:center}
.qn{color:var(--mut);font-size:14px;text-align:center;letter-spacing:1px;text-transform:uppercase}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}h1{font-size:34px}.q{font-size:20px}}

.timer i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#fde047,#fb7185);transform-origin:left}
.fact{margin-top:12px;color:#bae6fd;font-size:15px;text-align:center;min-height:20px}
.big{font-size:64px;font-weight:700;text-align:center;color:var(--gold);line-height:1;margin:6px 0}
.row{display:flex;gap:10px}.row .btn{flex:1}
.zone{text-align:center;color:#a5f3fc;font-size:18px;margin-bottom:6px}
.tip{color:var(--mut);font-size:14px;text-align:center;margin-top:10px}
.hide{display:none!important}
#pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font:700 40px Fredoka;color:var(--gold);text-shadow:0 4px 18px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .2s}

/* ---------- daily set ---------- */
const today=new Date(), DAY=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
function rng(seed){ let h=2166136261; for(const c of seed){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h+=0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function pickSet(seed,n){ const r=rng(seed), idx=[...QB.keys()]; for(let i=idx.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; } return idx.slice(0,n); }
const ls={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
const ZONES=[[0,'☀️ Sunlight zone'],[200,'🌅 Twilight zone'],[1000,'🌑 Midnight zone'],[4000,'🕳️ The Abyss'],[6000,'🔱 The Trench']];
const zoneOf=d=>ZONES.filter(z=>d>=z[0]).pop()[1];
/* ---------- game state ---------- */
let G=null, viewDepth=0, timer=null;
const QT=15;   /* seconds per question */
function start(mode){
  const daily=mode==='daily', order=daily?pickSet(DAY,12):pickSet(String(Math.random()),QB.length);
  G={mode,order,i:0,depth:0,air:3,streak:0,best:0,right:0,log:[],done:false};
  $('#hud').classList.remove('hide'); ask();
}
function ask(){
  if(G.air<=0||(G.mode==='daily'&&G.i>=G.order.length)) return finish();
  const q=QB[G.order[G.i%G.order.length]], r=rng(DAY+G.i+q[0]), opts=[q[1],q[2],q[3],q[4]];
  for(let i=3;i>0;i--){ const j=Math.floor(r()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  G.cur={q,opts,t0:performance.now(),answered:false};
  $('#scr').innerHTML=`<div class="zone">${zoneOf(G.depth)}</div><div class="qn">Question ${G.i+1}${G.mode==='daily'?' of '+G.order.length:''}</div><div class="q">${q[0]}</div><div class="timer"><i id="tb"></i></div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><kbd>${k+1}</kbd>${o}</button>`).join('')}</div><div class="fact" id="fact"></div>`;
  hud(); clearInterval(timer);
  timer=setInterval(()=>{ const left=QT-(performance.now()-G.cur.t0)/1000; const tb=$('#tb'); if(tb) tb.style.transform=`scaleX(${Math.max(0,left/QT)})`; if(left<=0) answer(-1); },50);
}
function answer(k){
  const c=G.cur; if(!c||c.answered) return; c.answered=true; clearInterval(timer);
  const right=c.opts.indexOf(c.q[1]), ok=k===right, secs=(performance.now()-c.t0)/1000;
  document.querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true; if(i===right) b.classList.add('ok'); else if(i===k) b.classList.add('no'); });
  let gain=0;
  if(ok){ G.streak++; G.best=Math.max(G.best,G.streak); G.right++;
    const speed=Math.round(Math.max(0,QT-secs)/QT*10), streak=Math.min(G.streak-1,5)*4; gain=10+speed+streak;
    /* the daily dive goes much deeper: a perfect run reaches the trench */
    if(G.mode==='daily') gain*=G.i<4?8:G.i<8?20:40;
    else gain*=1+Math.floor(G.i/5);
    G.depth+=gain; pop('+'+gain+' m'); sfx(1);
  } else { G.streak=0; G.air--; pop(k<0?'⏱️ Out of time!':'🫧 Lost an air tank'); sfx(0); }
  G.log.push(ok?'🟦':'🟥');
  $('#fact').textContent=(ok?'✅ ':'❌ The answer: '+c.q[1]+'. ')+c.q[5];
  hud(); G.i++;
  setTimeout(ask,ok?1500:2600);
}
function finish(){
  clearInterval(timer); G.done=true; const d=Math.round(G.depth);
  if(G.mode==='daily'){ const prev=ls.get('dd_daily',null); if(!prev||prev.day!==DAY) ls.set('dd_daily',{day:DAY,depth:d,log:G.log.join('')}); }
  const bestKey=G.mode==='daily'?'dd_bestDaily':'dd_bestFree', best=Math.max(ls.get(bestKey,0),d); ls.set(bestKey,best);
  try{ if(window.RRL) RRL.post(G.mode==='daily'?'daily':'free',d,`${d.toLocaleString()} m deep`); }catch(e){}
  try{ window.RRCOIN&&RRCOIN.add&&RRCOIN.add(Math.min(60,Math.round(d/100)),'Deep Dive'); }catch(e){}
  const share=`Deep Dive ${DAY}\n${G.log.join('')}\n${d.toLocaleString()} m · ${zoneOf(d)}`;
  $('#scr').innerHTML=`<h1>${G.air>0?'Dive complete!':'Out of air!'}</h1><div class="big">${d.toLocaleString()} m</div><div class="zone">Deepest zone: ${zoneOf(d)}</div>
   <p class="sub">${G.right} right · best streak ${G.best} · personal best ${best.toLocaleString()} m</p><div class="sub" style="font-size:22px;letter-spacing:2px">${G.log.join('')}</div>
   <div class="row"><button class="btn" data-a="share">📋 Copy result</button><button class="btn g" data-a="menu">Menu</button></div>
   ${G.mode==='free'?'<button class="btn g" data-a="free">Dive again</button>':''}<div class="tip" id="shareMsg"></div>`;
  $('#scr').dataset.share=share;
}
function menu(){
  G=null; clearInterval(timer); $('#hud').classList.add('hide');
  const done=ls.get('dd_daily',null), doneToday=done&&done.day===DAY;
  $('#scr').innerHTML=`<h1>🌊 Deep Dive</h1><p class="sub">Answer trivia to sink your submarine deeper and deeper. Fast answers and streaks dive extra deep. Wrong answers cost an air tank 🫧, and you only have three.</p>
   ${doneToday?`<div class="zone">Today’s dive: <b style="color:var(--gold)">${done.depth.toLocaleString()} m</b> ${done.log}</div><button class="btn" disabled>Daily Dive done, come back tomorrow</button>`:`<button class="btn" data-a="daily">🤿 Today’s Daily Dive (12 questions)</button>`}
   <button class="btn g" data-a="free">🐠 Free Dive (until your air runs out)</button>
   <div class="tip">Everyone gets the same Daily Dive questions each day. Best free dive: ${ls.get('dd_bestFree',0).toLocaleString()} m · Keys 1-4 to answer.</div>`;
}
function hud(){ $('#hDepth').textContent=Math.round(G.depth).toLocaleString(); $('#hAir').textContent='🫧'.repeat(Math.max(0,G.air))+'⚫'.repeat(3-Math.max(0,G.air)); $('#hStreak').textContent='Streak '+G.streak; $('#hQ').textContent=G.mode==='daily'?Math.min(G.i+1,G.order.length)+' / '+G.order.length:'Q '+(G.i+1); }
function pop(t){ const p=$('#pop'); p.textContent=t; p.style.opacity=1; clearTimeout(pop.t); pop.t=setTimeout(()=>p.style.opacity=0,900); }
let AC=null; function sfx(ok){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type='sine'; o.frequency.setValueAtTime(ok?520:220,AC.currentTime); o.frequency.exponentialRampToValueAtTime(ok?880:110,AC.currentTime+.25); g.gain.setValueAtTime(.12,AC.currentTime); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.35); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+.4); }catch(e){} }
document.addEventListener('click',e=>{ const o=e.target.closest('.opt'); if(o&&G&&!G.done){ answer(+o.dataset.k); return; }
  const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
  if(a==='daily'||a==='free') start(a); else if(a==='menu') menu();
  else if(a==='share'){ const t=$('#scr').dataset.share; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$('#shareMsg').textContent='Copied! Paste it in chat.',()=>$('#shareMsg').textContent=t); } });
addEventListener('keydown',e=>{ if(G&&!G.done&&/^Digit[1-4]$/.test(e.code)) answer(+e.code.slice(5)-1); });
/* ---------- the ocean: gets darker as you sink, with creatures for each zone ---------- */
const cv=$('#sea'), x=cv.getContext('2d'); let W=0,H=0;
function fit(){ const d=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; x.setTransform(d,0,0,d,0,0); }
addEventListener('resize',fit); fit();
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const SKY=[[0,[56,189,248],[3,105,161]],[200,[14,116,144],[8,47,73]],[1000,[8,47,73],[2,6,23]],[4000,[2,6,23],[1,2,10]],[11000,[1,2,10],[0,0,4]]];
function colAt(d){ for(let i=0;i<SKY.length-1;i++){ const a=SKY[i],b=SKY[i+1]; if(d<=b[0]){ const t=(d-a[0])/(b[0]-a[0]); return [mix(a[1],b[1],t),mix(a[2],b[2],t)]; } } return [SKY[4][1],SKY[4][2]]; }
const R=rng('sea'), bubbles=Array.from({length:60},()=>({x:R(),y:R(),r:1+R()*3,s:.3+R()*.8})), snow=Array.from({length:120},()=>({x:R(),y:R(),s:.1+R()*.3}));
/* creatures placed at real depths: [depth (m), kind, x (0..1), size] */
const LIFE=[];for(let i=0;i<90;i++){ const d=Math.pow(R(),1.6)*11000; LIFE.push([d,d<200?(R()<.5?'fish':'turtle'):d<1000?(R()<.5?'jelly':'squid'):d<4000?(R()<.5?'angler':'jelly'):'glow',.1+R()*.8,.6+R()*.8,R()*6]); }
LIFE.push([3800,'wreck',.72,1.4,0],[60,'whale',.25,2.2,0],[900,'whale',.8,1.6,1],[10900,'floor',.5,1,0]);
const PX=6;   /* pixels per metre of depth near the sub */
function draw(t){
  const target=G?G.depth:0; viewDepth+=(target-viewDepth)*.04;
  const [c1,c2]=colAt(viewDepth), g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,`rgb(${c1})`); g.addColorStop(1,`rgb(${c2})`); x.fillStyle=g; x.fillRect(0,0,W,H);
  if(viewDepth<250){ x.globalAlpha=Math.max(0,1-viewDepth/250)*.25; for(let i=0;i<6;i++){ const bx=W*(.1+i*.17)+Math.sin(t/2000+i)*30; x.fillStyle='#e0f2fe'; x.beginPath(); x.moveTo(bx,0); x.lineTo(bx+60,0); x.lineTo(bx+160,H); x.lineTo(bx+40,H); x.fill(); } x.globalAlpha=1; }
  /* marine snow drifts down in the dark */
  x.fillStyle='rgba(226,232,240,.5)'; for(const s of snow){ const yy=((s.y*H+t*s.s*.03-viewDepth*PX*.2)%H+H)%H; if(viewDepth>150) x.fillRect(s.x*W,yy,1.5,1.5); }
  const subY=H*.62;
  for(const L of LIFE){ const sy=subY+(L[0]-viewDepth)*PX*.35; if(sy<-120||sy>H+120) continue; creature(L[1],L[2]*W+Math.sin(t/1400+L[4])*24,sy,L[3],t,L[4]); }
  sub(W*.5,subY+Math.sin(t/600)*4,t);
  x.fillStyle='rgba(186,230,253,.45)'; for(const b of bubbles){ const yy=((b.y*H-t*b.s*.06)%H+H)%H; x.beginPath(); x.arc(b.x*W+Math.sin(t/700+b.y*9)*6,yy,b.r,0,7); x.fill(); }
  requestAnimationFrame(draw);
}
function creature(k,cx,cy,s,t,ph){
  x.save(); x.translate(cx,cy); x.scale(s,s);
  if(k==='fish'){ x.fillStyle=['#fb923c','#facc15','#38bdf8','#f472b6'][Math.floor(ph)%4]; x.beginPath(); x.ellipse(0,0,18,9,0,0,7); x.fill(); x.beginPath(); x.moveTo(-14,0); x.lineTo(-28,-9); x.lineTo(-28,9); x.fill(); x.fillStyle='#0f172a'; x.beginPath(); x.arc(9,-2,2,0,7); x.fill(); }
  else if(k==='turtle'){ x.fillStyle='#65a30d'; x.beginPath(); x.ellipse(0,0,22,15,0,0,7); x.fill(); x.fillStyle='#a3e635'; x.beginPath(); x.arc(26,-2,7,0,7); x.fill(); const f=Math.sin(t/300+ph)*6; x.fillRect(-8,-20+f*.3,8,8); x.fillRect(-8,12-f*.3,8,8); }
  else if(k==='jelly'){ x.globalAlpha=.75; x.fillStyle=ph%2<1?'#c084fc':'#f0abfc'; x.beginPath(); x.arc(0,0,16,Math.PI,0); x.fill(); x.strokeStyle=x.fillStyle; x.lineWidth=2; for(let i=-2;i<=2;i++){ x.beginPath(); x.moveTo(i*6,0); x.quadraticCurveTo(i*6+Math.sin(t/300+i)*6,16,i*6,30); x.stroke(); } x.globalAlpha=1; x.shadowBlur=0; }
  else if(k==='squid'){ x.fillStyle='#fb7185'; x.beginPath(); x.ellipse(0,0,8,20,0,0,7); x.fill(); x.strokeStyle='#fb7185'; x.lineWidth=2; for(let i=-2;i<=2;i++){ x.beginPath(); x.moveTo(i*3,18); x.lineTo(i*4+Math.sin(t/250+i)*4,36); x.stroke(); } }
  else if(k==='angler'){ x.fillStyle='#1e293b'; x.beginPath(); x.ellipse(0,0,24,18,0,0,7); x.fill(); x.strokeStyle='#475569'; x.lineWidth=2; x.beginPath(); x.moveTo(8,-16); x.quadraticCurveTo(20,-38,32,-22); x.stroke(); x.fillStyle='#fde68a'; x.shadowColor='#fde68a'; x.shadowBlur=20; x.beginPath(); x.arc(32,-22,4+Math.sin(t/200)*1,0,7); x.fill(); x.shadowBlur=0; x.fillStyle='#e2e8f0'; for(let i=0;i<5;i++){ x.beginPath(); x.moveTo(10+i*3,6); x.lineTo(11+i*3,12); x.lineTo(12+i*3,6); x.fill(); } }
  else if(k==='glow'){ x.fillStyle=['#22d3ee','#a78bfa','#4ade80'][Math.floor(ph)%3]; x.shadowColor=x.fillStyle; x.shadowBlur=14; for(let i=0;i<6;i++){ x.beginPath(); x.arc(Math.cos(i+t/900)*10,Math.sin(i*1.7+t/700)*6,2,0,7); x.fill(); } x.shadowBlur=0; }
  else if(k==='whale'){ x.fillStyle='#334e68'; x.beginPath(); x.ellipse(0,0,70,24,0,0,7); x.fill(); x.beginPath(); x.moveTo(-60,0); x.lineTo(-95,-18+Math.sin(t/600)*6); x.lineTo(-95,18+Math.sin(t/600)*6); x.fill(); x.fillStyle='#94a3b8'; x.beginPath(); x.ellipse(10,10,50,10,0,0,Math.PI); x.fill(); }
  else if(k==='wreck'){ x.fillStyle='#3f2a1e'; x.beginPath(); x.moveTo(-90,0); x.lineTo(90,-10); x.lineTo(70,30); x.lineTo(-70,34); x.fill(); x.fillStyle='#2b1d15'; x.fillRect(-10,-60,8,62); x.fillRect(30,-48,6,44); x.fillStyle='#1c120c'; for(let i=0;i<5;i++) x.fillRect(-60+i*25,6,8,8); }
  else if(k==='floor'){ x.fillStyle='#0b1220'; x.fillRect(-W,20,W*2,400); x.fillStyle='#0f1b2d'; for(let i=-10;i<10;i++){ x.beginPath(); x.arc(i*60,22,30,Math.PI,0); x.fill(); } }
  x.restore();
}
function sub(cx,cy,t){
  const deep=viewDepth>800;
  if(deep){ const g=x.createRadialGradient(cx+40,cy,4,cx+180,cy+30,200); g.addColorStop(0,'rgba(254,249,195,.35)'); g.addColorStop(1,'rgba(254,249,195,0)'); x.fillStyle=g; x.beginPath(); x.moveTo(cx+36,cy-6); x.lineTo(cx+320,cy-110); x.lineTo(cx+320,cy+170); x.closePath(); x.fill(); }
  x.save(); x.translate(cx,cy);
  x.fillStyle='#facc15'; x.beginPath(); x.ellipse(0,0,46,22,0,0,7); x.fill(); x.fillStyle='#eab308'; x.fillRect(-14,-34,26,16); x.fillRect(-2,-46,4,14);
  x.fillStyle='#0ea5e9'; for(const ox of [-18,0,18]){ x.beginPath(); x.arc(ox,-2,6,0,7); x.fill(); } x.fillStyle='rgba(255,255,255,.5)'; for(const ox of [-18,0,18]){ x.beginPath(); x.arc(ox-2,-4,2,0,7); x.fill(); }
  x.fillStyle='#a16207'; x.save(); x.translate(-48,0); x.rotate(Math.sin(t/80)); x.fillRect(-2,-10,4,20); x.restore(); x.fillRect(-52,-3,8,6);
  x.restore();
}
requestAnimationFrame(draw);
menu();
try{ window.RRL&&RRL.boards('deepdive',[{id:'daily',name:'Deepest Daily Dive (m)',mode:'max'},{id:'free',name:'Deepest Free Dive (m)',mode:'max'}]); }catch(e){}
})();
