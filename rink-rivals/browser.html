<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#070b16;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden}

#newtab{flex:none;border:0;background:none;color:#94a3b8;font-size:20px;padding:4px 10px;cursor:pointer}
#bar{display:flex;align-items:center;gap:6px;padding:8px;background:#1b2440;border-bottom:1px solid #26314f}
#bar button{border:0;background:none;color:#cbd5e1;width:36px;height:36px;border-radius:10px;font-size:17px;cursor:pointer;flex:none}
#bar button:hover{background:#26314f}
#url{flex:1;min-width:0;height:38px;border-radius:999px;border:1px solid #33405f;background:#0b1020;color:#f8fafc;padding:0 16px;font-size:15px;outline:0}
#url:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.2)}
.brand{font:900 20px 'Big Shoulders Display',sans-serif;background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 8px;white-space:nowrap;text-decoration:none}
#view{flex:1;position:relative;background:#0b1020}
#view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.home{position:absolute;inset:0;overflow-y:auto;padding:28px 18px}
.wrap{max-width:1100px;margin:0 auto}
.hero{text-align:center;margin:10px 0 22px}
.hero h1{margin:0;font:900 clamp(40px,7vw,64px) 'Big Shoulders Display',sans-serif;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#94a3b8;margin:4px 0 16px}
.sbox{display:flex;max-width:620px;margin:0 auto;gap:8px}
.sbox input{flex:1;height:48px;border-radius:999px;border:1px solid #33405f;background:#0f172a;color:#fff;padding:0 20px;font-size:16px;outline:0}
.sbox input:focus{border-color:#60a5fa}
.sbox button{height:48px;padding:0 20px;border:0;border-radius:999px;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;font-weight:800;cursor:pointer}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 4px}

.cats button.on,.cats button:hover{border-color:#60a5fa;color:#fff}
h3{font:900 24px 'Big Shoulders Display',sans-serif;margin:24px 0 10px;color:#f1f5f9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:linear-gradient(180deg,#141b2e,#0f1526);border:1px solid #26314f;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#4f6bb0}

.card button{border:0;border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer}
.play{background:#22c55e;color:#052e16}.fav{background:#1e293b;color:#e2e8f0}
.msg{color:#94a3b8;text-align:center;padding:20px}

.wres{display:flex;flex-direction:column;gap:10px;max-width:820px}

.wiki{display:flex;gap:14px;background:linear-gradient(135deg,#132044,#1b1640);border:1px solid #33405f;border-radius:16px;padding:14px;max-width:820px;margin-bottom:12px}.wiki img{width:110px;height:110px;object-fit:cover;border-radius:12px;flex:none}.wiki b{font-size:19px}.wiki p{margin:6px 0;color:#cbd5e1;line-height:1.5;font-size:14.5px}.wiki a{color:#93c5fd}
.askai{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;margin:0 0 12px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(90deg,#2563eb,#7c3aed)}
.dial{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-width:900px;margin:0 auto}
.dial a{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;background:#111a30;border:1px solid #26314f;color:#e2e8f0;text-decoration:none;cursor:pointer;font-size:13px;text-align:center}.dial a:hover{border-color:#60a5fa;transform:translateY(-2px)}
.dial .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#1e293b;overflow:hidden}.dial .ic img{width:26px;height:26px}
.dial .x{position:absolute;top:4px;right:6px;opacity:0;font-size:12px;color:#94a3b8}.dial a:hover .x{opacity:1}
.hist{display:flex;flex-direction:column;gap:6px}.hist a{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:#141b2e;color:#e2e8f0;text-decoration:none;cursor:pointer}.hist a:hover{background:#1b2440}.hist small{color:#94a3b8;margin-left:auto}
.tip{position:absolute;right:12px;bottom:12px;background:rgba(15,23,42,.92);border:1px solid #33405f;border-radius:12px;padding:8px 12px;font-size:13px;color:#cbd5e1;max-width:360px;z-index:2}
.tip button{margin-left:8px;border:0;background:#2563eb;color:#fff;border-radius:8px;padding:4px 9px;cursor:pointer}
</style></head><body>
<div id="tabs"><button id="newtab" title="New tab">＋</button></div>
<div id="bar"><a class="brand" href="./" title="Back to Arcade Rivals">Rivals</a>
  <button id="back" title="Back">←</button><button id="fwd" title="Forward">→</button><button id="rel" title="Reload">⟳</button><button id="hm" title="Home">🏠</button>

  <button id="histB" title="History">🕘</button><button id="star" title="Save to favourites">☆</button><button id="full" title="Full screen">⛶</button><button id="ext" title="Open in a new browser tab">↗</button></div>
<div id="view"></div>
<script>
(()=>{
const $=id=>document.getElementById(id), view=$('view'), urlIn=$('url');
const ls={get:(k,d)=>{ try{ return JSON.parse(localStorage.getItem(k)||'null')??d; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
const TOOL=/\b(engine|framework|library|sdk|toolkit|boilerplate|template|starter|tutorial|awesome|renderer|plugin)\b/i;

/* real game websites, each checked to play inside the Rivals Browser */
const FEAT=[
 ['🧊','ClassiCube','Open-source upgraded Classic from GitHub — more blocks, better physics, singleplayer right here','https://www.classicube.net/server/play/?warned=true','block'],
 ['🌍','ClassiCube servers','Play Classic-style with other people — hundreds of servers (free ClassiCube account)','https://www.classicube.net/server/list/','block','tab'],
 ['⛏️','Minecraft Classic','The official free 2009 Minecraft, from Mojang — build with 32 blocks','https://classic.minecraft.net','block'],['🟩','Blockverse','Our own block game — survival, crafting, disasters, multiplayer',location.origin+'/blockverse','block'],['🧱','Minefun.io','Block minigames: Skyblock, Bed Wars, Parkour, One Block','https://minefun.io','block'],
 ['🐬','Minecraft: Voyage Aquatic (2018)','Official Minecraft from Mojang + Code.org — the 2018 ocean update world','https://studio.code.org/s/aquatic/lessons/1/levels/1','block','tab'],
 ['🗡️','Minecraft: Hero\'s Journey (2017)','Official Minecraft adventure from Mojang + Code.org','https://studio.code.org/s/hero/lessons/1/levels/1','block','tab'],
 ['🐑','Minecraft: Designer (2016)','Official — make your own Minecraft game rules','https://studio.code.org/s/minecraft/lessons/1/levels/1','block','tab'],
 ['🧭','Minecraft: Adventurer (2015)','Official — the first Minecraft Hour of Code','https://studio.code.org/s/mc/lessons/1/levels/1','block','tab'],
 ['🐍','Slither.io','Grow the longest snake','https://slither.io','io'],['🔺','Diep.io','Tank battles — level up your tank','https://diep.io','io'],['🟥','Splix.io','Claim land, don\'t get cut off','https://splix.io','io'],['🐛','Wormate.io','Candy-eating worms','https://wormate.io','io'],
 ['⚡','Powerline.io','Neon snake racing','https://powerline.io','io'],['🗺️','Territorial.io','Conquer the map','https://territorial.io','io'],['🧟','ZombsRoyale','2D battle royale','https://zombsroyale.io','io'],['🔫','Surviv.io','Top-down battle royale','https://surviv.io','io'],
 ['🎯','Krunker','Fast browser shooter','https://krunker.io','fps'],['🥚','Shell Shockers','Egg shooter','https://shellshock.io','fps'],['🏹','Narrow.One','Castle archery battles','https://narrow.one','fps'],['🟦','Kirka.io','Blocky shooter','https://kirka.io','fps'],['🦸','Venge.io','Hero shooter','https://venge.io','fps'],
 ['🏎️','Smash Karts','Kart battles','https://smashkarts.io','race'],['🏍️','Moto X3M','Bike stunts (Coolmath)','https://www.coolmathgames.com/0-moto-x3m','race'],['🏃','Run 3','Space tunnel runner (Coolmath)','https://www.coolmathgames.com/0-run-3','race'],
 ['🧊','Bloxd.io','Blocky worlds and minigames','https://bloxd.io','block'],['⏳','Sandspiel','Falling sand sandbox','https://sandspiel.club','build'],['⚗️','Little Alchemy 2','Mix elements, discover 700+','https://littlealchemy2.com','puzzle'],
 ['🟪','Tetris','The real Tetris','https://tetris.com/play-tetris','puzzle'],['💣','Minesweeper','Minesweeper online','https://minesweeper.online','puzzle'],['🌍','WorldGuessr','Guess where on Earth you are','https://worldguessr.com','puzzle'],
 ['🐦','Flappy Bird','Tap to flap','https://flappybird.io','arcade'],['🦖','Dino Run','The Chrome dinosaur game','https://chromedino.com','arcade'],['🦘','Doodle Jump','Bounce up the platforms','https://doodle-jump.co','arcade'],['🧮','Coolmath Games','Hundreds of games','https://www.coolmathgames.com','arcade']];
const FCAT={block:'⛏️ Block games',io:'🐍 .io games',fps:'🎯 Shooters',race:'🏎️ Racing & runners',build:'🧱 Build & sandbox',puzzle:'🧩 Puzzle & brain',arcade:'👾 Arcade'};
const SRV=()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; };
/* ask the server which pages allow being shown inside another site, so only games that will actually load are listed */
async function frameable(urls){ const out={}; for(let i=0;i<urls.length;i+=30){ const part=urls.slice(i,i+30); try{ const r=await fetch(SRV()+'/fc?'+part.map(u=>'u='+encodeURIComponent(u)).join('&')); Object.assign(out,await r.json()); }catch(e){ for(const u of part) out[u]=true; } } return out; }
function fcard(f){ return `<div class="card"><div class="n">${f[0]} ${esc(f[1])}</div><div class="o">${esc(new URL(f[3]).hostname.replace(/^www\./,''))}</div><div class="d">${esc(f[2])}</div><div class="r"><span class="sp"></span><button class="fav" data-fav='${esc(JSON.stringify({n:f[1],u:f[3],d:f[2],o:'',av:'',s:0}))}'>${isFav(f[3])?'★':'☆'}</button>${f[5]==='tab'?`<button class="play" data-ext="${esc(f[3])}" title="This one only plays in its own tab">↗ Play</button>`:`<button class="play" data-go="${esc(f[3])}" data-t="${esc(f[1])}">▶ Play</button>`}</div></div>`; }
const ITAGS=[['🏃 Platformer','platformer'],['🧩 Puzzle','puzzle'],['🏎️ Racing','racing'],['👾 Arcade','arcade'],['😌 Casual','casual'],['🔫 Shooter','shooter'],['⚽ Sports','sports'],['🎨 Pixel art','pixel-art'],['👥 Multiplayer','multiplayer'],['🏃 Endless runner','endless-runner'],['🃏 Card game','card-game'],['🧠 Strategy','strategy']];
const srcPref=()=>{ try{ return localStorage.getItem('rbSrc')||'web'; }catch(e){ return 'web'; } };
async function webSearch(q){ const key='rbw:'+q; try{ const c=JSON.parse(sessionStorage.getItem(key)||'null'); if(c&&Date.now()-c.t<6e5) return c.r; }catch(e){}
  const r=await fetch(SRV()+'/ws?q='+encodeURIComponent(q)); const j=await r.json(); if(j.blocked) throw new Error('That search isn\'t allowed here.'); const out={results:j.results||[],wiki:j.wiki||null}; try{ sessionStorage.setItem(key,JSON.stringify({t:Date.now(),r:out})); }catch(e){} return out; }
function wres(x){ let host=''; try{ host=new URL(x.u).hostname.replace(/^www\./,''); }catch(e){} return `<div class="wr"><div class="h"><img src="https://icons.duckduckgo.com/ip3/${esc(host)}.ico" alt="" loading="lazy" onerror="this.remove()">${esc(host)}</div><a class="t" ${x.frame?`data-go="${esc(x.u)}" data-t="${esc(x.t)}"`:`data-ext="${esc(x.u)}"`}>${esc(x.t)}</a><div class="d">${esc(x.d||'')}</div><div class="b">${x.frame?`<button class="in" data-go="${esc(x.u)}" data-t="${esc(x.t)}">▶ Open here</button>`:''}<button data-ext="${esc(x.u)}">↗ ${x.frame?'New tab':'Open (in a new tab)'}</button></div></div>`; }
async function itchList(o){ const key='rbi:'+JSON.stringify(o); try{ const c=JSON.parse(sessionStorage.getItem(key)||'null'); if(c&&Date.now()-c.t<6e5) return c.r; }catch(e){}
  const r=await fetch(SRV()+'/itch?'+(o.q?'q='+encodeURIComponent(o.q):o.tag?'tag='+encodeURIComponent(o.tag):'')); const j=await r.json(); const g=j.games||[]; try{ sessionStorage.setItem(key,JSON.stringify({t:Date.now(),r:g})); }catch(e){} return g; }
function icard(g){ return `<div class="card"><div class="th" style="background-image:url('${esc(g.img)}')"></div><div class="n" title="${esc(g.t)}">🕹️ ${esc(g.t)}</div><div class="o">itch.io${g.by?' · '+esc(g.by):''}</div><div class="d">${esc(g.d||'A free web game on itch.io')}</div><div class="r"><span class="sp"></span><button class="fav" data-ext="${esc(g.u)}" title="Open the itch.io page">↗</button><button class="play" data-itch="${esc(g.u)}" data-t="${esc(g.t)}">▶ Play</button></div></div>`; }
const hist=()=>{ try{ return JSON.parse(localStorage.getItem('rbHist')||'[]'); }catch(e){ return []; } };
function addHist(u,title){ if(u.startsWith('rivals://')) return; try{ const h=hist().filter(x=>x.u!==u); h.unshift({u,t:title||u,at:Date.now()}); localStorage.setItem('rbHist',JSON.stringify(h.slice(0,80))); }catch(e){} }
const CATS=[['🔥 Popular','browser game'],['🏃 Platformer','platformer game'],['🧩 Puzzle','puzzle game'],['🏎️ Racing','racing game'],['🚀 Shooter','shooter game'],['🔢 2048','2048 game'],['🟦 Tetris','tetris'],['🐍 Snake','snake game'],['♟️ Chess','chess game'],['🖱️ Clicker','idle clicker game'],['🧱 Voxel','voxel game javascript'],['👾 Retro','retro arcade game']];
let tabs=[], cur=null, tid=0;
/* where a GitHub repo can be played: its homepage, or its GitHub Pages site */
function playURL(r){ const h=(r.homepage||'').trim(); if(/^https:\/\//.test(h)) return h; if(!r.has_pages) return null; const o=r.owner.login.toLowerCase(), n=r.name.toLowerCase(); return n===o+'.github.io'?`https://${o}.github.io/`:`https://${o}.github.io/${r.name}/`; }
function esc(t){ return String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function ghSearch(q){ const key='rbq:'+q; try{ const c=JSON.parse(sessionStorage.getItem(key)||'null'); if(c&&Date.now()-c.t<6e5) return c.r; }catch(e){}
  const r=await fetch('https://api.github.com/search/repositories?q='+encodeURIComponent(q+' in:name,description,topics')+'&sort=stars&order=desc&per_page=60',{headers:{accept:'application/vnd.github+json'}});
  if(r.status===403||r.status===429) throw new Error('GitHub says slow down — wait a minute and try again.'); if(!r.ok) throw new Error('GitHub search did not work ('+r.status+').');
  const j=await r.json(), out=(j.items||[]).filter(x=>!x.archived||x.has_pages).map(x=>({n:x.name,o:x.owner.login,av:x.owner.avatar_url,d:x.description||'',s:x.stargazers_count,u:playURL(x),gh:x.html_url})).filter(x=>x.u&&!BAD.test(x.n+' '+x.d)&&!TOOL.test(x.n+' '+x.d));
  const ok=await frameable(out.map(x=>x.u)); const keep=out.filter(x=>ok[x.u]!==false);
  try{ sessionStorage.setItem(key,JSON.stringify({t:Date.now(),r:keep})); }catch(e){} return keep; }
function card(g){ return `<div class="card"><div class="n" title="${esc(g.n)}">🎮 ${esc(g.n.replace(/[-_]/g,' '))}</div><div class="o"><img src="${esc(g.av)}&s=40" alt="" loading="lazy">${esc(g.o)}</div><div class="d">${esc(g.d||'No description')}</div><div class="r">⭐ ${g.s.toLocaleString()}<span class="sp"></span><button class="fav" data-fav='${esc(JSON.stringify(g))}'>${isFav(g.u)?'★':'☆'}</button><button class="play" data-go="${esc(g.u)}" data-t="${esc(g.n)}">▶ Play</button></div></div>`; }
const favs=()=>ls.get('rbFav',[]), isFav=u=>favs().some(f=>f.u===u);
function toggleFav(g){ let f=favs(); f=isFav(g.u)?f.filter(x=>x.u!==g.u):[{n:g.n,o:g.o||'',av:g.av||'',d:g.d||'',s:g.s||0,u:g.u},...f].slice(0,60); ls.set('rbFav',f); }
/* ---- the home page ---- */
function homeEl(t){ const el=document.createElement('div'); el.className='home'; el.innerHTML=`<div class="wrap"><div class="hero"><h1>🌐 Rivals Browser</h1><p>Search the web, play real game websites right here, and find thousands of free games on itch.io and GitHub.</p>
  <div class="src"><button data-src="web" class="${t.src==='web'?'on':''}">🌐 Web</button><button data-src="itch" class="${t.src==='itch'?'on':''}">🕹️ itch.io games</button><button data-src="gh" class="${t.src==='gh'?'on':''}">🐙 GitHub games</button></div>
  <form class="sbox"><input name="q" placeholder="${t.src==='web'?'Search the web (safe search is on)':t.src==='itch'?'Search thousands of free web games on itch.io':'Search games on GitHub (e.g. tetris, racing, snake)'}" value="${esc(t.q||'')}"><button>Search</button></form>
  <div class="cats">${t.src==='web'?'':t.src==='itch'?ITAGS.map(([l,g])=>`<button data-tag="${g}" class="${t.tag===g?'on':''}">${l}</button>`).join(''):CATS.map(([l,q])=>`<button data-q="${esc(q)}" class="${t.q===q?'on':''}">${l}</button>`).join('')}</div></div>
  ${t.q||t.tag?'':'<h3>⚡ Quick links</h3><div class="dial"></div>'}<div class="favs"></div>${t.src==='web'&&t.q?`<h3>🌐 Web results for “${esc(t.q)}”</h3><div class="wres"><div class="msg">Searching…</div></div><p class="msg" style="font-size:12px;text-align:left">Safe search is on. ▶ Open here works for sites that allow it; the rest open in a new tab.</p>`:''}${t.q||t.tag?'':Object.entries(FCAT).map(([k,l])=>`<h3>${l}</h3><div class="grid">${FEAT.filter(f=>f[4]===k).map(fcard).join('')}</div>`).join('')}${t.src==='web'&&t.q?'':(t.q||t.tag)&&t.src==='itch'?'':`${t.q||t.tag?'':'<h3>🕹️ Top free web games on itch.io</h3><div class="grid ires"><div class="msg">Loading…</div></div>'}`}
  ${t.src==='web'&&t.q?'':t.src==='itch'&&(t.q||t.tag)?`<h3>${t.q?'itch.io results for “'+esc(t.q)+'”':'🕹️ '+esc((ITAGS.find(x=>x[1]===t.tag)||['',t.tag])[0])+' games on itch.io'}</h3><div class="grid ires"><div class="msg">Loading…</div></div>`:`<h3 class="rt">${t.q?'GitHub results for “'+esc(t.q)+'”':'🔥 Popular games on GitHub'}</h3><div class="grid res"><div class="msg">Loading…</div></div>`}
  <p class="msg" style="font-size:12px">These games are made by other people and websites, not Arcade Rivals. Only games that allow being played inside another site are shown — if one still stays blank, use ↗ to open it in its own tab.</p></div>`;
  el.querySelector('form').onsubmit=e=>{ e.preventDefault(); const q=e.target.q.value.trim(); if(q) navigate(t,(t.src==='web'?'rivals://web/':t.src==='itch'?'rivals://itch/':'rivals://search/')+q); };
  el.querySelectorAll('.cats button').forEach(b=>b.onclick=()=>navigate(t,b.dataset.tag?'rivals://itch-tag/'+b.dataset.tag:'rivals://search/'+b.dataset.q));
  el.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{ try{ localStorage.setItem('rbSrc',b.dataset.src); }catch(e){} t.src=b.dataset.src; const q=t.q; navigate(t,q?(t.src==='web'?'rivals://web/':t.src==='itch'?'rivals://itch/':'rivals://search/')+q:'rivals://home'); });
  el.onclick=e=>{ const ai=e.target.closest('[data-ai]'); if(ai){ navigate(t,location.origin+'/ai?web=1&q='+encodeURIComponent(ai.dataset.ai),'🤖 Rink Rivals AI'); return; } const dx=e.target.closest('[data-dx]'); if(dx){ e.stopPropagation(); setDial(dial().filter((_,i)=>i!==+dx.dataset.dx)); drawDial(el); return; } if(e.target.closest('[data-dadd]')){ const u=prompt('Web address for the quick link (e.g. wikipedia.org):'); if(!u) return; const url=/^https?:\/\//.test(u)?u:'https://'+u; let nm=''; try{ nm=new URL(url).hostname.replace(/^www\./,''); }catch(x){ return; } setDial(dial().concat([{n:nm,u:url}]).slice(0,16)); drawDial(el); return; } const it=e.target.closest('[data-itch]'); if(it){ playItch(t,it); return; } const x=e.target.closest('[data-ext]'); if(x){ open(x.dataset.ext,'_blank','noopener'); return; } const g=e.target.closest('[data-go]'); if(g){ navigate(t,g.dataset.go,g.dataset.t); return; } const f=e.target.closest('[data-fav]'); if(f){ const o=JSON.parse(f.dataset.fav); toggleFav(o); f.textContent=isFav(o.u)?'★':'☆'; drawFavs(el); } };
  drawFavs(el); drawDial(el);
  const wr=el.querySelector('.wres'); if(wr) webSearch(t.q).then(o=>{ const r=Array.isArray(o)?o:o.results, w=o.wiki; wr.innerHTML=`<div><button class="askai" data-ai="${esc(t.q)}">🤖 Ask Rink Rivals AI about this</button></div>`+(w?`<div class="wiki">${w.img?`<img src="${esc(w.img)}" alt="">`:''}<div><b>📖 ${esc(w.t)}</b><p>${esc(w.d)}</p><a data-go="${esc(w.u)}" data-t="${esc(w.t)}" style="cursor:pointer">Read more on Wikipedia →</a></div></div>`:'')+(r.length?r.map(wres).join(''):'<div class="msg">No results — try different words.</div>'); }).catch(e=>{ wr.innerHTML=`<div class="msg">⚠️ ${esc(e.message||'Search did not work — try again.')}</div>`; });
  const ir=el.querySelector('.ires'); if(ir) itchList({q:t.src==='itch'?t.q:'',tag:t.src==='itch'?t.tag:''}).then(g=>{ ir.innerHTML=g.length?g.map(icard).join(''):'<div class="msg">No web games found for that — try another word.</div>'; }).catch(()=>{ ir.innerHTML='<div class="msg">⚠️ itch.io did not answer — try again in a moment.</div>'; });
  if(el.querySelector('.res')) ghSearch(t.q||'browser game').then(r=>{ el.querySelector('.res').innerHTML=r.length?r.map(card).join(''):'<div class="msg">No playable games found for that — try another word.</div>'; }).catch(e=>{ el.querySelector('.res').innerHTML=`<div class="msg">⚠️ ${esc(e.message)}</div>`; });
  return el; }
async function playItch(t,b){ const u=b.dataset.itch, c=b.closest('.card'); b.textContent='…'; try{ const j=await (await fetch(SRV()+'/itchplay?u='+encodeURIComponent(u))).json(); if(j.play){ navigate(t,j.play,j.title||b.dataset.t); return; } b.textContent='▶ Play'; c.querySelector('.err')||c.insertAdjacentHTML('beforeend',`<div class="err">${esc(j.err||'Could not open it')} <a href="${esc(u)}" target="_blank" rel="noopener" style="color:#93c5fd">Open on itch.io ↗</a></div>`); }catch(e){ b.textContent='▶ Play'; } }
const DIAL0=[{n:'Wikipedia',u:'https://en.wikipedia.org'},{n:'Minecraft Classic',u:'https://classic.minecraft.net'},{n:'Sandspiel',u:'https://sandspiel.club'},{n:'Tetris',u:'https://tetris.com/play-tetris'},{n:'Coolmath',u:'https://www.coolmathgames.com'},{n:'Rink Rivals AI',u:location.origin+'/ai'},{n:'Blockverse',u:location.origin+'/blockverse'}];
const dial=()=>{ try{ return JSON.parse(localStorage.getItem('rbDial')||'null')||DIAL0; }catch(e){ return DIAL0; } }, setDial=d=>{ try{ localStorage.setItem('rbDial',JSON.stringify(d)); }catch(e){} };
function drawDial(el){ const box=el.querySelector('.dial'); if(!box) return; box.innerHTML=dial().map((d,i)=>{ let h=''; try{ h=new URL(d.u).hostname; }catch(e){} const own=h===location.hostname; return `<a data-go="${esc(d.u)}" data-t="${esc(d.n)}"><span class="ic">${own?(/ai$/.test(d.u)?'🤖':'🟩'):`<img src="https://icons.duckduckgo.com/ip3/${esc(h)}.ico" alt="" onerror="this.replaceWith('🌐')">`}</span>${esc(d.n)}<span class="x" data-dx="${i}" title="Remove">✕</span></a>`; }).join('')+'<a data-dadd="1"><span class="ic">＋</span>Add</a>'; }
function drawFavs(el){ const f=favs(); el.querySelector('.favs').innerHTML=f.length?`<h3>⭐ Your favourites</h3><div class="grid">${f.map(card).join('')}</div>`:''; }
/* ---- tabs ---- */
function newTab(u){ const t={id:++tid,hist:[],pos:-1,title:'New tab',el:null,q:''}; tabs.push(t); navigate(t,u||'rivals://home'); show(t); return t; }
function closeTab(t){ setTimeout(saveTabs,0);  const i=tabs.indexOf(t); if(t.el) t.el.remove(); tabs.splice(i,1); if(!tabs.length){ newTab(); return; } if(cur===t) show(tabs[Math.max(0,i-1)]); else drawTabs(); }
function show(t){ cur=t; for(const x of tabs) if(x.el) x.el.style.display=x===t?'':'none'; drawTabs(); syncBar(); }
function drawTabs(){ const box=$('tabs'); box.querySelectorAll('.tab').forEach(e=>e.remove()); for(const t of tabs){ const d=document.createElement('div'); d.className='tab'+(t===cur?' on':''); d.innerHTML=`<span class="t">${esc(t.title)}</span><span class="x" title="Close">✕</span>`; d.onclick=e=>{ if(e.target.classList.contains('x')) closeTab(t); else show(t); }; box.insertBefore(d,$('newtab')); } }
function curURL(t){ return t.hist[t.pos]||'rivals://home'; }
function syncBar(){ if(!cur) return; const u=curURL(cur); urlIn.value=u==='rivals://home'||u==='rivals://history'?'':u.startsWith('rivals://search/')?decodeURIComponent(u.slice(16)):u.startsWith('rivals://web/')?decodeURIComponent(u.slice(13)):u.startsWith('rivals://itch/')?decodeURIComponent(u.slice(14)):u.startsWith('rivals://itch-tag/')?'':u; $('star').textContent=isFav(u)?'★':'☆'; $('back').disabled=cur.pos<=0; $('fwd').disabled=cur.pos>=cur.hist.length-1; }
function load(t,u,title){ if(t.el) t.el.remove(); let el;
  if(u==='rivals://history'){ t.title='🕘 History'; el=document.createElement('div'); el.className='home'; const h=hist(); el.innerHTML=`<div class="wrap"><h3>🕘 Recently played</h3><div class="hist">${h.length?h.map(x=>`<a data-go="${esc(x.u)}" data-t="${esc(x.t)}">🎮 ${esc(x.t)}<small>${new Date(x.at).toLocaleString()}</small></a>`).join(''):'<div class="msg">Nothing yet — go play something!</div>'}</div>${h.length?'<p><button id="clrH" style="border:0;border-radius:10px;padding:8px 12px;background:#334155;color:#fff;cursor:pointer">Clear history</button></p>':''}</div>`; el.onclick=e=>{ const g=e.target.closest('[data-go]'); if(g) navigate(t,g.dataset.go,g.dataset.t); if(e.target.id==='clrH'){ try{ localStorage.removeItem('rbHist'); }catch(x){} load(t,u); } }; }
  else if(u.startsWith('rivals://')){ t.src=srcPref(); t.q=''; t.tag='';
    if(u.startsWith('rivals://search/')){ t.src='gh'; t.q=decodeURIComponent(u.slice(16)); }
    else if(u.startsWith('rivals://web/')){ t.src='web'; t.q=decodeURIComponent(u.slice(13)); }
    else if(u.startsWith('rivals://itch/')){ t.src='itch'; t.q=decodeURIComponent(u.slice(14)); }
    else if(u.startsWith('rivals://itch-tag/')){ t.src='itch'; t.tag=decodeURIComponent(u.slice(18)); }
    t.title=t.q?'🔎 '+t.q:t.tag?'🕹️ '+t.tag:'🏠 Home'; el=homeEl(t); }
  else { el=document.createElement('div'); el.style.cssText='position:absolute;inset:0'; const f=document.createElement('iframe'); f.src=u; f.allow='fullscreen; gamepad; autoplay; clipboard-write'; f.setAttribute('allowfullscreen',''); f.referrerPolicy='no-referrer'; f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals allow-downloads allow-orientation-lock'); el.appendChild(f);
    const tip=document.createElement('div'); tip.className='tip'; tip.innerHTML='Blank page? Some sites don\'t allow being shown inside others.<button>↗ Open it</button><button style="background:#334155">✕</button>'; tip.querySelectorAll('button')[0].onclick=()=>open(u,'_blank','noopener'); tip.querySelectorAll('button')[1].onclick=()=>tip.remove(); el.appendChild(tip); setTimeout(()=>tip.remove(),9000);
    t.title=title||(()=>{ try{ const x=new URL(u); return x.pathname.split('/').filter(Boolean).pop()||x.hostname; }catch(e){ return u; } })(); }
  t.el=el; el.style.display=t===cur||!cur?'':'none'; view.appendChild(el); drawTabs(); if(t===cur) syncBar(); }
function navigate(t,u,title){ t.hist=t.hist.slice(0,t.pos+1); t.hist.push(u); t.pos++; t.titles=t.titles||{}; if(title) t.titles[u]=title; addHist(u,title); load(t,u,title); saveTabs(); }
/* tabs come back when you reload or come back later */
function saveTabs(){ try{ localStorage.setItem('rbTabs',JSON.stringify({cur:tabs.indexOf(cur),tabs:tabs.map(t=>({u:t.hist[t.pos]||'rivals://home',title:(t.titles||{})[t.hist[t.pos]]||t.title}))})); }catch(e){} }
function go(raw){ const v=raw.trim(); if(!v){ navigate(cur,'rivals://home'); return; } let u=null;
  if(/^https?:\/\//i.test(v)) u=v; else if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v)) u='https://'+v;
  if(u&&/^http:\/\//i.test(u)) u=u.replace(/^http:/i,'https:');
  navigate(cur,u||'rivals://web/'+v); }
urlIn.addEventListener('keydown',e=>{ if(e.key==='Enter'){ go(urlIn.value); urlIn.blur(); } });
urlIn.addEventListener('focus',()=>urlIn.select());
$('newtab').onclick=()=>newTab(); $('histB').onclick=()=>navigate(cur,'rivals://history');
$('back').onclick=()=>{ if(cur.pos>0){ cur.pos--; load(cur,curURL(cur)); } };
$('fwd').onclick=()=>{ if(cur.pos<cur.hist.length-1){ cur.pos++; load(cur,curURL(cur)); } };
$('rel').onclick=()=>load(cur,curURL(cur),cur.title);
$('hm').onclick=()=>navigate(cur,'rivals://home');
$('ext').onclick=()=>{ const u=curURL(cur); if(!u.startsWith('rivals://')) open(u,'_blank','noopener'); };
$('full').onclick=()=>{ const f=cur.el&&cur.el.querySelector('iframe'); (f||view).requestFullscreen&&(f||view).requestFullscreen(); };
$('star').onclick=()=>{ const u=curURL(cur); if(u.startsWith('rivals://')) return; toggleFav({n:cur.title,u,o:'',av:'',d:'',s:0}); syncBar(); };
addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='t'){ e.preventDefault(); newTab(); } if((e.ctrlKey||e.metaKey)&&e.key==='l'){ e.preventDefault(); urlIn.focus(); } });
const start=new URLSearchParams(location.search).get('q');
if(start) newTab('rivals://search/'+start);
else { let saved=null; try{ saved=JSON.parse(localStorage.getItem('rbTabs')||'null'); }catch(e){}
  if(saved&&saved.tabs&&saved.tabs.length){ for(const s of saved.tabs.slice(0,12)){ const t=newTab(s.u); if(s.title&&!s.u.startsWith('rivals://')){ t.title=s.title; t.titles={[s.u]:s.title}; } } show(tabs[Math.max(0,Math.min(tabs.length-1,saved.cur||0))]); drawTabs(); }
  else newTab('rivals://home'); }
})();
</script>
