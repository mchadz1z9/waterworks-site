<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rivals Browser — Arcade Rivals</title>
<meta name="description" content="Rivals Browser: find and play free web games people have made on GitHub, in tabs, right here.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#070b16;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 8px 0;background:#0b1020;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;min-width:120px;max-width:220px;padding:8px 12px;border-radius:12px 12px 0 0;background:#141b2e;color:#94a3b8;cursor:pointer;font-size:13px;white-space:nowrap;flex:none}
.tab.on{background:#1b2440;color:#f8fafc}
.tab .t{overflow:hidden;text-overflow:ellipsis;flex:1}.tab .x{opacity:.6;border-radius:6px;padding:0 4px}.tab .x:hover{background:#334155;opacity:1}
#newtab{flex:none;border:0;background:none;color:#94a3b8;font-size:20px;padding:4px 10px;cursor:pointer}
#bar{display:flex;align-items:center;gap:6px;padding:8px;background:#1b2440;border-bottom:1px solid #26314f}
#bar button{border:0;background:none;color:#cbd5e1;width:36px;height:36px;border-radius:10px;font-size:17px;cursor:pointer;flex:none}
#bar button:hover{background:#26314f}
#url{flex:1;min-width:0;height:38px;border-radius:999px;border:1px solid #33405f;background:#0b1020;color:#f8fafc;padding:0 16px;font-size:15px;outline:0}
#url:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.2)}
.brand{font:900 20px 'Big Shoulders Display',sans-serif;background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 8px;white-space:nowrap;text-decoration:none}
#view{flex:1;position:relative;background:#0b1020}
#view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.home{position:absolute;inset:0;overflow-y:auto;padding:28px 18px}
.wrap{max-width:1100px;margin:0 auto}
.hero{text-align:center;margin:10px 0 22px}
.hero h1{margin:0;font:900 clamp(40px,7vw,64px) 'Big Shoulders Display',sans-serif;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#94a3b8;margin:4px 0 16px}
.sbox{display:flex;max-width:620px;margin:0 auto;gap:8px}
.sbox input{flex:1;height:48px;border-radius:999px;border:1px solid #33405f;background:#0f172a;color:#fff;padding:0 20px;font-size:16px;outline:0}
.sbox input:focus{border-color:#60a5fa}
.sbox button{height:48px;padding:0 20px;border:0;border-radius:999px;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;font-weight:800;cursor:pointer}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 4px}
.cats button{border:1px solid #33405f;background:#0f172a;color:#cbd5e1;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px}
.cats button.on,.cats button:hover{border-color:#60a5fa;color:#fff}
h3{font:900 24px 'Big Shoulders Display',sans-serif;margin:24px 0 10px;color:#f1f5f9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:linear-gradient(180deg,#141b2e,#0f1526);border:1px solid #26314f;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#4f6bb0}
.card .n{font-weight:800;font-size:16px;color:#f8fafc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .o{display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8}.card .o img{width:18px;height:18px;border-radius:50%}
.card .d{font-size:13px;color:#cbd5e1;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:52px}
.card .r{display:flex;align-items:center;gap:8px;font-size:12px;color:#fbbf24}
.card .r .sp{flex:1}
.card button{border:0;border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer}
.play{background:#22c55e;color:#052e16}.fav{background:#1e293b;color:#e2e8f0}
.msg{color:#94a3b8;text-align:center;padding:20px}
.tip{position:absolute;right:12px;bottom:12px;background:rgba(15,23,42,.92);border:1px solid #33405f;border-radius:12px;padding:8px 12px;font-size:13px;color:#cbd5e1;max-width:360px;z-index:2}
.tip button{margin-left:8px;border:0;background:#2563eb;color:#fff;border-radius:8px;padding:4px 9px;cursor:pointer}
</style></head><body>
<div id="tabs"><button id="newtab" title="New tab">＋</button></div>
<div id="bar"><a class="brand" href="./" title="Back to Arcade Rivals">Rivals</a>
  <button id="back" title="Back">←</button><button id="fwd" title="Forward">→</button><button id="rel" title="Reload">⟳</button><button id="hm" title="Home">🏠</button>
  <input id="url" placeholder="Search GitHub games or type a web address" autocomplete="off" spellcheck="false">
  <button id="star" title="Save to favourites">☆</button><button id="full" title="Full screen">⛶</button><button id="ext" title="Open in a new browser tab">↗</button></div>
<div id="view"></div>
<script>
(()=>{
const $=id=>document.getElementById(id), view=$('view'), urlIn=$('url');
const ls={get:(k,d)=>{ try{ return JSON.parse(localStorage.getItem(k)||'null')??d; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
const TOOL=/\b(engine|framework|library|sdk|toolkit|boilerplate|template|starter|tutorial|awesome|renderer|plugin)\b/i;
const BAD=/\b(nsfw|porn|hentai|xxx|sex|nude|onlyfans|casino|gambl|betting|cheat engine|aimbot|keylogger|malware|exploit|ddos|phish)\b/i;
const CATS=[['🔥 Popular','browser game'],['🏃 Platformer','platformer game'],['🧩 Puzzle','puzzle game'],['🏎️ Racing','racing game'],['🚀 Shooter','shooter game'],['🔢 2048','2048 game'],['🟦 Tetris','tetris'],['🐍 Snake','snake game'],['♟️ Chess','chess game'],['🖱️ Clicker','idle clicker game'],['🧱 Voxel','voxel game javascript'],['👾 Retro','retro arcade game']];
let tabs=[], cur=null, tid=0;
/* where a GitHub repo can be played: its homepage, or its GitHub Pages site */
function playURL(r){ const h=(r.homepage||'').trim(); if(/^https:\/\//.test(h)) return h; if(!r.has_pages) return null; const o=r.owner.login.toLowerCase(), n=r.name.toLowerCase(); return n===o+'.github.io'?`https://${o}.github.io/`:`https://${o}.github.io/${r.name}/`; }
function esc(t){ return String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function ghSearch(q){ const key='rbq:'+q; try{ const c=JSON.parse(sessionStorage.getItem(key)||'null'); if(c&&Date.now()-c.t<6e5) return c.r; }catch(e){}
  const r=await fetch('https://api.github.com/search/repositories?q='+encodeURIComponent(q+' in:name,description,topics')+'&sort=stars&order=desc&per_page=60',{headers:{accept:'application/vnd.github+json'}});
  if(r.status===403||r.status===429) throw new Error('GitHub says slow down — wait a minute and try again.'); if(!r.ok) throw new Error('GitHub search did not work ('+r.status+').');
  const j=await r.json(), out=(j.items||[]).filter(x=>!x.archived||x.has_pages).map(x=>({n:x.name,o:x.owner.login,av:x.owner.avatar_url,d:x.description||'',s:x.stargazers_count,u:playURL(x),gh:x.html_url})).filter(x=>x.u&&!BAD.test(x.n+' '+x.d)&&!TOOL.test(x.n+' '+x.d));
  try{ sessionStorage.setItem(key,JSON.stringify({t:Date.now(),r:out})); }catch(e){} return out; }
function card(g){ return `<div class="card"><div class="n" title="${esc(g.n)}">🎮 ${esc(g.n.replace(/[-_]/g,' '))}</div><div class="o"><img src="${esc(g.av)}&s=40" alt="" loading="lazy">${esc(g.o)}</div><div class="d">${esc(g.d||'No description')}</div><div class="r">⭐ ${g.s.toLocaleString()}<span class="sp"></span><button class="fav" data-fav='${esc(JSON.stringify(g))}'>${isFav(g.u)?'★':'☆'}</button><button class="play" data-go="${esc(g.u)}" data-t="${esc(g.n)}">▶ Play</button></div></div>`; }
const favs=()=>ls.get('rbFav',[]), isFav=u=>favs().some(f=>f.u===u);
function toggleFav(g){ let f=favs(); f=isFav(g.u)?f.filter(x=>x.u!==g.u):[{n:g.n,o:g.o||'',av:g.av||'',d:g.d||'',s:g.s||0,u:g.u},...f].slice(0,60); ls.set('rbFav',f); }
/* ---- the home page ---- */
function homeEl(t){ const el=document.createElement('div'); el.className='home'; el.innerHTML=`<div class="wrap"><div class="hero"><h1>🌐 Rivals Browser</h1><p>Free web games people have made and shared on GitHub — search, play, and keep your favourites.</p>
  <form class="sbox"><input name="q" placeholder="Search games on GitHub (e.g. tetris, racing, minecraft clone)" value="${esc(t.q||'')}"><button>Search</button></form>
  <div class="cats">${CATS.map(([l,q])=>`<button data-q="${esc(q)}" class="${t.q===q?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="favs"></div><h3 class="rt">${t.q?'Results for “'+esc(t.q)+'”':'🔥 Popular games on GitHub'}</h3><div class="grid res"><div class="msg">Loading…</div></div>
  <p class="msg" style="font-size:12px">Games here come from GitHub and are made by other people, not Arcade Rivals. If one stays blank, use ↗ to open it in its own tab.</p></div>`;
  el.querySelector('form').onsubmit=e=>{ e.preventDefault(); const q=e.target.q.value.trim(); if(q) navigate(t,'rivals://search/'+q); };
  el.querySelectorAll('.cats button').forEach(b=>b.onclick=()=>navigate(t,'rivals://search/'+b.dataset.q));
  el.onclick=e=>{ const g=e.target.closest('[data-go]'); if(g){ navigate(t,g.dataset.go,g.dataset.t); return; } const f=e.target.closest('[data-fav]'); if(f){ const o=JSON.parse(f.dataset.fav); toggleFav(o); f.textContent=isFav(o.u)?'★':'☆'; drawFavs(el); } };
  drawFavs(el);
  ghSearch(t.q||'browser game').then(r=>{ el.querySelector('.res').innerHTML=r.length?r.map(card).join(''):'<div class="msg">No playable games found for that — try another word.</div>'; }).catch(e=>{ el.querySelector('.res').innerHTML=`<div class="msg">⚠️ ${esc(e.message)}</div>`; });
  return el; }
function drawFavs(el){ const f=favs(); el.querySelector('.favs').innerHTML=f.length?`<h3>⭐ Your favourites</h3><div class="grid">${f.map(card).join('')}</div>`:''; }
/* ---- tabs ---- */
function newTab(u){ const t={id:++tid,hist:[],pos:-1,title:'New tab',el:null,q:''}; tabs.push(t); navigate(t,u||'rivals://home'); show(t); return t; }
function closeTab(t){ const i=tabs.indexOf(t); if(t.el) t.el.remove(); tabs.splice(i,1); if(!tabs.length){ newTab(); return; } if(cur===t) show(tabs[Math.max(0,i-1)]); else drawTabs(); }
function show(t){ cur=t; for(const x of tabs) if(x.el) x.el.style.display=x===t?'':'none'; drawTabs(); syncBar(); }
function drawTabs(){ const box=$('tabs'); box.querySelectorAll('.tab').forEach(e=>e.remove()); for(const t of tabs){ const d=document.createElement('div'); d.className='tab'+(t===cur?' on':''); d.innerHTML=`<span class="t">${esc(t.title)}</span><span class="x" title="Close">✕</span>`; d.onclick=e=>{ if(e.target.classList.contains('x')) closeTab(t); else show(t); }; box.insertBefore(d,$('newtab')); } }
function curURL(t){ return t.hist[t.pos]||'rivals://home'; }
function syncBar(){ if(!cur) return; const u=curURL(cur); urlIn.value=u==='rivals://home'?'':u.startsWith('rivals://search/')?decodeURIComponent(u.slice(16)):u; $('star').textContent=isFav(u)?'★':'☆'; $('back').disabled=cur.pos<=0; $('fwd').disabled=cur.pos>=cur.hist.length-1; }
function load(t,u,title){ if(t.el) t.el.remove(); let el;
  if(u.startsWith('rivals://')){ t.q=u.startsWith('rivals://search/')?decodeURIComponent(u.slice(16)):''; t.title=t.q?'🔎 '+t.q:'🏠 Home'; el=homeEl(t); }
  else { el=document.createElement('div'); el.style.cssText='position:absolute;inset:0'; const f=document.createElement('iframe'); f.src=u; f.allow='fullscreen; gamepad; autoplay; clipboard-write'; f.setAttribute('allowfullscreen',''); f.referrerPolicy='no-referrer'; f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals allow-downloads allow-orientation-lock'); el.appendChild(f);
    const tip=document.createElement('div'); tip.className='tip'; tip.innerHTML='Blank page? Some sites don\'t allow being shown inside others.<button>↗ Open it</button><button style="background:#334155">✕</button>'; tip.querySelectorAll('button')[0].onclick=()=>open(u,'_blank','noopener'); tip.querySelectorAll('button')[1].onclick=()=>tip.remove(); el.appendChild(tip); setTimeout(()=>tip.remove(),9000);
    t.title=title||(()=>{ try{ const x=new URL(u); return x.pathname.split('/').filter(Boolean).pop()||x.hostname; }catch(e){ return u; } })(); }
  t.el=el; el.style.display=t===cur||!cur?'':'none'; view.appendChild(el); drawTabs(); if(t===cur) syncBar(); }
function navigate(t,u,title){ t.hist=t.hist.slice(0,t.pos+1); t.hist.push(u); t.pos++; load(t,u,title); }
function go(raw){ const v=raw.trim(); if(!v){ navigate(cur,'rivals://home'); return; } let u=null;
  if(/^https?:\/\//i.test(v)) u=v; else if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v)) u='https://'+v;
  if(u&&/^http:\/\//i.test(u)) u=u.replace(/^http:/i,'https:');
  navigate(cur,u||'rivals://search/'+v); }
urlIn.addEventListener('keydown',e=>{ if(e.key==='Enter'){ go(urlIn.value); urlIn.blur(); } });
urlIn.addEventListener('focus',()=>urlIn.select());
$('newtab').onclick=()=>newTab();
$('back').onclick=()=>{ if(cur.pos>0){ cur.pos--; load(cur,curURL(cur)); } };
$('fwd').onclick=()=>{ if(cur.pos<cur.hist.length-1){ cur.pos++; load(cur,curURL(cur)); } };
$('rel').onclick=()=>load(cur,curURL(cur),cur.title);
$('hm').onclick=()=>navigate(cur,'rivals://home');
$('ext').onclick=()=>{ const u=curURL(cur); if(!u.startsWith('rivals://')) open(u,'_blank','noopener'); };
$('full').onclick=()=>{ const f=cur.el&&cur.el.querySelector('iframe'); (f||view).requestFullscreen&&(f||view).requestFullscreen(); };
$('star').onclick=()=>{ const u=curURL(cur); if(u.startsWith('rivals://')) return; toggleFav({n:cur.title,u,o:'',av:'',d:'',s:0}); syncBar(); };
addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='t'){ e.preventDefault(); newTab(); } if((e.ctrlKey||e.metaKey)&&e.key==='l'){ e.preventDefault(); urlIn.focus(); } });
const start=new URLSearchParams(location.search).get('q'); newTab(start?'rivals://search/'+start:'rivals://home');
})();
</script>
<script src="site.js"></script><script src="chat.js"></script>
</body></html>
