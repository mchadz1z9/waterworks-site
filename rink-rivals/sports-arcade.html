nents. Aim, charge, sink your group, then the 8.", "c1": "#0d6a3e", "c2": "#4a2a14", "icon": "🎱", "new": 1}, {"id": "qbchallenge", "title": "QB Challenge", "cat": "Football", "desc": "Throw to moving receivers through target rings. Dodge the defenders for bullseyes.", "c1": "#14612a", "c2": "#2f7fd0", "icon": "🏈", "new": 1}, {"id": "shuffle", "title": "Table Shuffleboard", "cat": "Shuffleboard", "desc": "Slide pucks down the table, knock off the opponent and play to 15.", "c1": "#4a2a10", "c2": "#d8a860", "icon": "🛷", "new": 1}, {"id": "skeeball", "title": "Skee Rolls", "cat": "Arcade", "desc": "Arcade skee-ball: roll 9 balls for bullseyes, race a CPU or beat the clock, and win tickets.", "c1": "#2a0f44", "c2": "#ff8a2b", "icon": "🎳", "new": 1}, {"id": "skijump", "title": "Ski Jump Heroes", "cat": "Ski Jumping", "desc": "Time your take-off, hold your angle and stick the telemark landing. Two hills, 3 rivals.", "c1": "#0b2a55", "c2": "#8fd3ff", "icon": "⛷️", "new": 1}, {"id": "swim", "title": "Splash Sprint", "cat": "Swimming", "desc": "Alternate strokes, time your breaths and out-swim three rivals in 50, 100 or 200 metres.", "c1": "#0a2a4a", "c2": "#2aa0e0", "icon": "🏊", "new": 1}, {"id": "threept", "title": "Three-Point Contest", "cat": "Basketball", "desc": "Five racks, 25 balls, 60 seconds. Time your release and beat the shooting legends.", "c1": "#2a1060", "c2": "#ff7a22", "icon": "🏀", "new": 1}, {"id": "volley", "title": "Beach Spike", "cat": "Volleyball", "desc": "Beach volleyball with 8 countries, spikes, three difficulties and a World Tour.", "c1": "#ff9a3c", "c2": "#1b8fd0", "icon": "🏐", "new": 1}], LINK=id=>'sa-'+id, LIKES='https://rink-rivals-rooms.mitchellchad2026.workers.dev/like';

let rvG=null, rvStars=0, rvList=[];
function rvRender(){ const D=$('rvDlg'); if(!D) return; const g=GAMES.find(x=>x.id===rvG), mine=rvList.find(r=>r.me), keep={t:(D.querySelector('#rvT')||{}).value, n:(D.querySelector('#rvN')||{}).value};
  D.querySelector('.w').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h3>${g.icon} ${esc(g.title)}</h3><button class="rv" data-rvx>✕</button></div>
   <div class="st5">${[1,2,3,4,5].map(i=>`<button data-rs="${i}" class="${i<=rvStars?'on':''}" aria-label="${i} stars">★</button>`).join('')}</div>
   <input id="rvN" maxlength="20" placeholder="Your name" value="${esc(keep.n!=null?keep.n:(ls.get('rrName')||''))}"><textarea id="rvT" maxlength="300" rows="3" placeholder="What did you think? Tips, favourite mode, anything.">${esc(keep.t!=null?keep.t:(mine?mine.text:''))}</textarea>
   <div style="display:flex;gap:8px;margin-top:8px"><button class="play" data-rvpost style="border:0;cursor:pointer">${mine?'Update my review':'Post review'}</button>${mine?'<button class="rv" data-rvdel>Remove mine</button>':''}</div><p id="rvE" style="color:#fca5a5;margin:6px 0 0"></p>
   <div style="margin-top:10px">${rvList.length?rvList.map(r=>`<div class="rvi"><b>${esc(r.name)}${r.me?' (you)':''}</b><span class="rate">${starsTxt(r.stars)}</span> <span style="color:#64748b;font-size:12px">${new Date(r.at).toLocaleDateString()}</span>${r.text?`<p>${esc(r.text)}</p>`:''}</div>`).join(''):'<p style="color:#93a0bd">No reviews yet — be the first!</p>'}</div>`; }
function rvOpen(id){ rvG=id; rvStars=0; rvList=[]; let D=$('rvDlg'); if(!D){ D=document.createElement('div'); D.id='rvDlg'; D.innerHTML='<div class="w"></div>'; document.body.appendChild(D);
    D.addEventListener('click',async e=>{ if(e.target===D||e.target.closest('[data-rvx]')){ D.remove(); return; } const s2=e.target.closest('[data-rs]'); if(s2){ rvStars=+s2.dataset.rs; rvRender(); return; }
      if(e.target.closest('[data-rvpost]')){ if(!rvStars){ D.querySelector('#rvE').textContent='Tap a star rating first.'; return; } const name=D.querySelector('#rvN').value.trim(); if(name) ls.set('rrName',name);
        try{ const d=await post(REV,{op:'add',game:'sa'+rvG,pid:pid(),stars:rvStars,name,text:D.querySelector('#rvT').value.trim()}); rvList=d.list||[]; rvStars=0; D.querySelector('#rvT').value=''; rvRender(); refreshRS(rvG); }catch(x){ D.querySelector('#rvE').textContent='Could not post — try again.'; } return; }
      if(e.target.closest('[data-rvdel]')){ try{ const d=await post(REV,{op:'del',game:'sa'+rvG,pid:pid()}); rvList=d.list||[]; rvRender(); refreshRS(rvG); }catch(x){} } }); }
  D.querySelector('.w').innerHTML='<p>Loading reviews…</p>'; rvRender(); post(REV,{op:'get',game:'sa'+id,pid:pid()}).then(d=>{ rvList=d.list||[]; const m=rvList.find(r=>r.me); if(m) rvStars=m.stars; rvRender(); }).catch(()=>{ rvRender(); }); }
function refreshRS(id){ const L=rvList; RS[id]={n:L.length,avg:L.length?L.reduce((a,r)=>a+r.stars,0)/L.length:0}; render(); }
})();
</script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body></html>
