<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sports Arcade by Connor</title>
<meta name="description" content="Sports Arcade by Connor: 15 free sports games — golf, soccer, basketball, hockey, football, baseball, tennis, bowling, darts and more.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#070b16;--card:#111a30;--line:#24324f;--ink:#eef2fb;--mute:#93a0bd;--acc:#ff6a2b;--f-d:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--f-b:'Hanken Grotesk',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% -10%,#3b1d0c 0,transparent 60%),radial-gradient(900px 600px at 100% 0,#0c2a4a 0,transparent 60%),var(--bg);color:var(--ink);font-family:var(--f-b);min-height:100vh}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:54px 16px 80px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font:900 44px/1 var(--f-d);letter-spacing:.02em;text-transform:uppercase;background:linear-gradient(90deg,#ff6a2b,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
.by{font:700 15px var(--f-b);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.home{margin-left:auto;text-decoration:none;font:800 14px var(--f-b);background:#1e293b;border-radius:999px;padding:9px 16px}
.hero{margin:18px 0 8px;display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.feat{position:relative;border-radius:22px;padding:22px;min-height:210px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 20px 50px rgba(0,0,0,.45);background:var(--g)}
.feat .ic{position:absolute;right:18px;top:6px;font-size:120px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.feat small{font:800 12px var(--f-b);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.feat b{font:900 38px/1 var(--f-d);text-transform:uppercase;margin:4px 0 6px}
.feat span{max-width:60%;font-size:15px;opacity:.92}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.st b{display:block;font:900 32px/1 var(--f-d)}.st span{color:var(--mute);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 12px}
.chip{border:1px solid var(--line);background:#0d1527;color:#cbd5e1;border-radius:999px;padding:7px 14px;font:700 14px var(--f-b);cursor:pointer}
.chip.on{background:linear-gradient(90deg,#ff6a2b,#ff9d2b);color:#1a0a02;border-color:transparent}
#q{flex:1 1 220px;min-width:0;background:#0d1527;border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px 14px;font:600 15px var(--f-b)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.thumb{height:118px;background:var(--g);position:relative;display:flex;align-items:center;justify-content:center;text-decoration:none}
.thumb i{font-style:normal;font-size:62px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.thumb em{position:absolute;left:10px;top:10px;font:800 11px var(--f-b);letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);border-radius:999px;padding:3px 9px;font-style:normal}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{margin:0;font:900 24px/1.05 var(--f-d);text-transform:uppercase;letter-spacing:.01em}
.body p{margin:0;color:var(--mute);font-size:14px;line-height:1.4;flex:1}
.acts{display:flex;gap:8px;align-items:center;margin-top:6px}
.play{flex:1;text-align:center;text-decoration:none;background:linear-gradient(90deg,#ff6a2b,#ff9d2b);color:#1a0a02;font:800 15px var(--f-b);border-radius:12px;padding:10px}
.like{border:1px solid var(--line);background:#0d1527;color:#fff;border-radius:12px;padding:9px 12px;font:700 14px var(--f-b);cursor:pointer}
.like.on{background:#4c0519;border-color:#9f1239}
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.recent a{flex:0 0 auto;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:700 14px var(--f-b)}
h2{font:900 26px var(--f-d);text-transform:uppercase;margin:22px 0 10px;letter-spacing:.02em}
footer{color:var(--mute);font-size:13px;margin-top:30px;text-align:center}
@media(max-width:760px){ .hero{grid-template-columns:1fr} .feat span{max-width:100%} .logo{font-size:34px} }
</style></head><body><div class="wrap">
<header><div class="logo">🏟️ Sports Arcade</div><div class="by">made by Connor · upgraded</div><a class="home" href="./">🏆 Arcade Rivals home</a></header>
<div class="hero"><a class="feat" id="feat" href="#"></a><div class="stats"><div class="st"><b>15</b><span>sports games</span></div><div class="st"><b id="stLikes">—</b><span>likes from players</span></div><div class="st"><b>10</b><span>different sports</span></div><div class="st"><b id="stPlayed">0</b><span>games you've played</span></div></div></div>
<div id="recentBox" hidden><h2>▶ Keep playing</h2><div class="recent" id="recent"></div></div>
<div class="bar" id="chips"></div>
<div class="bar"><input id="q" placeholder="🔎 Search games, sports or players…" autocomplete="off"></div>
<div class="grid" id="grid"></div>
<footer>Sports Arcade games by Connor. Real teams and players are used for fun — every game runs right in your browser.</footer>
</div>
<script>
const GAMES=[{"id": "golf", "title": "Around The World Golf", "cat": "Golf", "desc": "26 courses and unlockable real pros like Scottie Scheffler, Rory McIlroy and Tiger Woods.", "c1": "#14703f", "c2": "#8ad06a", "icon": "⛳"}, {"id": "soccer", "title": "Pitch Kings", "cat": "Soccer", "desc": "Big-pitch 5-a-side soccer with real star players and team kits: play a quick match, an 8-team cup or a full 12-team season.", "c1": "#0c3b24", "c2": "#4be07a", "icon": "⚽"}, {"id": "penalty", "title": "Penalty Shootout", "cat": "Soccer", "desc": "Draw your shot and play goalie against Arsenal, Man City, Bayern and Real Madrid.", "c1": "#0c3b24", "c2": "#2c9a5a", "icon": "🥅"}, {"id": "hardwood", "title": "Hardwood Season", "cat": "Basketball", "desc": "Draft real NBA players, then play every game live 5-on-5 with broadcast, sideline and behind-the-offense cameras. Time your shot meter and chase the title.", "c1": "#2a1c47", "c2": "#ff7a2f", "icon": "🏀"}, {"id": "hoops", "title": "Free Throw Hoops", "cat": "Basketball", "desc": "Time attack, three-point contest, and a ladder against Brunson, Booker, Durant and Curry.", "c1": "#2a1c47", "c2": "#ff7a2f", "icon": "🏀"}, {"id": "hockey", "title": "Ice Legends", "cat": "Hockey", "desc": "Pick any of 32 NHL teams with real players, then play live 3D hockey with slap shots, checks and a tournament mode.", "c1": "#0e2a4a", "c2": "#4cc3ff", "icon": "🏒"}, {"id": "bowling", "title": "Strike Zone", "cat": "Bowling", "desc": "Neon 3D bowling lane. Aim, time your power and spin, and beat the CPU in a full 10-frame game.", "c1": "#2a0f44", "c2": "#ff4fd8", "icon": "🎳"}, {"id": "darts", "title": "Bullseye Club", "cat": "Darts", "desc": "Double-out 301 or 501 against a CPU. Steady your aim, hit triples and check out.", "c1": "#12301f", "c2": "#ff3d4d", "icon": "🎯"}, {"id": "tabletennis", "title": "Spin Doctors", "cat": "Table Tennis", "desc": "Fast 3D table tennis. Rally, place your shots and smash your way to 11.", "c1": "#0d2a4f", "c2": "#ff8a2b", "icon": "🏓"}, {"id": "puckclicker", "title": "Puck Clicker", "cat": "Clicker", "desc": "Click the puck, buy helpers, then level up through hockey, basketball, football, baseball and more. Every sport has its own ball.", "c1": "#0a1830", "c2": "#4cc3ff", "icon": "🖱️"}, {"id": "perfect", "title": "Perfect Season: Real Players", "cat": "Perfect Season", "desc": "Go undefeated in the NFL, NBA, NHL or MLB. Spin for a team or a player, build a player, run a GM cap challenge and guess players by their teams.", "c1": "#101a33", "c2": "#ffd23f", "icon": "🏆"}, {"id": "seventeen", "title": "Build a 17-0 Team", "cat": "Football", "desc": "Spin for a student or teacher, build your lineup, see if your team goes 17-0.", "c1": "#12361f", "c2": "#ffb347", "icon": "🏈"}, {"id": "football", "title": "Pixel Bowl Season", "cat": "Football", "desc": "Pick one of 32 NFL teams, draft real NFL stars, then play 18 weeks, the playoffs and the Super Bowl. Choose your routes.", "c1": "#12361f", "c2": "#3a7d44", "icon": "🏈"}, {"id": "tennis", "title": "Grand Slam Rally", "cat": "Tennis", "desc": "Keyboard or mouse. Time your swing and beat 4 named players.", "c1": "#1c3f8a", "c2": "#5aa0ff", "icon": "🎾"}, {"id": "baseball", "title": "Diamond Nine", "cat": "Baseball", "desc": "Real MLB teams and players. Pitch, bat, play the field live and run the bases yourself with cameras that change for every role.", "c1": "#1f5a30", "c2": "#d9a066", "icon": "⚾"}], LINK=id=>'sa-'+id, LIKES='https://rink-rivals-rooms.mitchellchad2026.workers.dev/like';
(()=>{
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } },set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} }};
const pid=()=>{ let p=ls.get('rrPid'); if(!p||p.length<8){ p=Array.from({length:12},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)]).join(''); ls.set('rrPid',p); } return p; };
const SPORT=g=>g.cat==='Perfect Season'||g.cat==='Clicker'?'More':g.cat;
let CAT='All', LK={};
const played=()=>{ try{ return JSON.parse(ls.get('saPlayed')||'[]'); }catch(e){ return []; } };
function card(g){ const n=LK[g.id]||{n:0,me:false}; return `<div class="card"><a class="thumb" href="${LINK(g.id)}" data-go="${g.id}" style="--g:linear-gradient(135deg,${g.c1},${g.c2})"><em>${esc(g.cat)}</em><i>${g.icon}</i></a><div class="body"><h3>${esc(g.title)}</h3><p>${esc(g.desc)}</p><div class="acts"><a class="play" href="${LINK(g.id)}" data-go="${g.id}">▶ Play</a>${LIKES?`<button class="like${n.me?' on':''}" data-like="${g.id}">❤️ ${n.n||0}</button>`:''}</div></div></div>`; }
function render(){ const q=$('q').value.trim().toLowerCase(); const L=GAMES.filter(g=>(CAT==='All'||SPORT(g)===CAT)&&(!q||(g.title+' '+g.cat+' '+g.desc).toLowerCase().includes(q)));
  $('grid').innerHTML=L.map(card).join('')||'<p style="color:#93a0bd">No games match that.</p>';
  const cats=['All',...new Set(GAMES.map(SPORT))]; $('chips').innerHTML=cats.map(c=>`<button class="chip${c===CAT?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const pl=played(); $('stPlayed').textContent=pl.length; $('recentBox').hidden=!pl.length; $('recent').innerHTML=pl.slice(0,6).map(id=>{ const g=GAMES.find(x=>x.id===id); return g?`<a href="${LINK(g.id)}" data-go="${g.id}">${g.icon} ${esc(g.title)}</a>`:''; }).join('');
  let tot=0; for(const k in LK) tot+=LK[k].n||0; $('stLikes').textContent=LIKES?tot:'—'; }
/* the featured game changes every day */
const f=GAMES[Math.floor(Date.now()/864e5)%GAMES.length]; $('feat').href=LINK(f.id); $('feat').dataset.go=f.id; $('feat').style.setProperty('--g',`linear-gradient(135deg,${f.c1},${f.c2})`); $('feat').innerHTML=`<div class="ic">${f.icon}</div><small>⭐ Game of the day</small><b>${esc(f.title)}</b><span>${esc(f.desc)}</span>`;
document.addEventListener('click',e=>{ const c=e.target.closest('[data-c]'); if(c){ CAT=c.dataset.c; render(); return; }
  const g=e.target.closest('[data-go]'); if(g){ const pl=played().filter(x=>x!==g.dataset.go); pl.unshift(g.dataset.go); ls.set('saPlayed',JSON.stringify(pl.slice(0,15))); }
  const l=e.target.closest('[data-like]'); if(l&&LIKES){ const id=l.dataset.like, cur=LK[id]||{n:0,me:false}, on=!cur.me; LK[id]={n:Math.max(0,cur.n+(on?1:-1)),me:on}; render(); fetch(LIKES,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({op:on?'like':'unlike',game:'sa'+id,pid:pid()})}).catch(()=>{}); } });
$('q').oninput=render; render();
if(LIKES) Promise.all(GAMES.map(g=>fetch(LIKES,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({op:'get',game:'sa'+g.id,pid:pid()})}).then(r=>r.json()).then(d=>{ LK[g.id]={n:d.n||0,me:!!d.me}; }).catch(()=>{}))).then(render);
})();
</script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body></html>
