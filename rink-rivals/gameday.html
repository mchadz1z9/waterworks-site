<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Game Day</title>
<style>
:root{--bg:#06080f;--p1:#0f1422;--p2:#182034;--line:#232c44;--tx:#f1f5f9;--mut:#94a3b8;--acc:linear-gradient(135deg,#22c55e,#0ea5e9);--hot:#ef4444}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
#hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:1300px;margin:0 auto}
#logo{display:flex;align-items:center;gap:8px;font:900 20px system-ui}#logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--acc);font-style:normal}
#hd .sp{flex:1}#hd a.b{background:var(--p2);border-radius:18px;padding:7px 13px;font:600 13px system-ui}
#wrap{max-width:1300px;margin:0 auto;padding:14px 16px 50px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font:800 16px system-ui}
#sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:20px 16px;background:linear-gradient(135deg,var(--ca,#1e293b),transparent 45%,transparent 55%,var(--ch,#1e293b));}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.side img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.side b{font-size:18px}.side small{color:var(--mut)}.side .sc{font:900 54px/1 system-ui}
.mid{text-align:center;color:var(--mut);font:800 14px system-ui}.mid .live{color:var(--hot)}.mid .live::before{content:'● ';animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.3}}
.wp{margin-top:12px}.wp .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--p2)}.wp .bar i{display:block}.wp .lbl{display:flex;justify-content:space-between;color:var(--mut);font:700 12px system-ui;margin-top:4px}
#next .btns{display:flex;gap:10px}#next button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--p2);color:var(--tx);border-radius:12px;padding:12px;font:800 15px system-ui}
#next button img{width:28px;height:28px}#next button.on{background:var(--acc);color:#04110a;border-color:transparent}
#next .split{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px;background:var(--p2)}#next .split i{display:block}
#next .note,.note{color:var(--mut);font-size:13px;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{border:0;background:none;color:var(--mut);font:700 14px system-ui;padding:7px 12px;border-radius:10px}.tabs button.on{background:var(--p2);color:var(--tx)}
.pl{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35}.pl:first-child{border:0}
.pl .k{flex:none;width:58px;color:var(--mut);font:700 12px system-ui}.pl .k b{display:block;color:var(--tx)}.pl.s{background:rgba(34,197,94,.08);border-radius:8px;padding:9px 6px}.pl .sc2{flex:none;color:var(--mut);font:800 12px system-ui}
.ld{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ld h4{margin:0 0 6px;font:800 14px system-ui}.ld div div{padding:6px 0;border-top:1px solid var(--line);font-size:13px}.ld small{color:var(--mut);display:block}
#chat{position:sticky;top:12px;display:flex;flex-direction:column;height:calc(100vh - 140px)}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:14px}#msgs .m b{color:#fbbf24;margin-right:6px}#msgs .s{color:var(--mut);font-size:12px;text-align:center}
#say{display:flex;gap:8px;margin-top:10px}#say input{flex:1;min-width:0;border:1px solid var(--line);background:#0a0e18;color:var(--tx);border-radius:10px;padding:10px 12px;font-size:14px}#say button{border:0;border-radius:10px;padding:0 14px;background:var(--acc);color:#04110a;font:800 14px system-ui}
.emo{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.emo button{border:0;background:var(--p2);border-radius:8px;padding:4px 8px;font-size:16px}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#0f172a;border:2px solid #22c55e;border-radius:14px;padding:12px 16px;font:800 15px system-ui;z-index:99;display:none}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
@media(max-width:900px){#wrap{grid-template-columns:1fr}#chat{position:static;height:360px}.side img{width:52px;height:52px}.side .sc{font-size:40px}.ld{grid-template-columns:1fr}#hd a.b.x{display:none}}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a id="logo" href="sports"><i>📡</i>Rival Game Day</a><span class="sp"></span><a class="b" href="sports">🏟️ Sports Center</a><a class="b x" href="./">← Arcade</a></header>
<div id="wrap">
  <div>
    <div class="card" id="sb"><div class="empty" style="grid-column:1/-1;text-align:center;color:var(--mut)">Loading the game…</div></div>
    <div class="card" id="next" style="display:none"></div>
    <div class="card"><div class="tabs" id="tabs"><button data-v="plays" class="on">📋 Play-by-play</button><button data-v="scoring">🔥 Scoring</button><button data-v="leaders">⭐ Leaders</button></div><div id="feed"></div></div>
  </div>
  <aside class="card" id="chat"><h3>💬 Fan chat <small id="cn" style="color:var(--mut);font-weight:600;font-size:12px"></small></h3><div id="msgs"><div class="s">Talk about the game with other fans!</div></div>
    <form id="say" autocomplete="off"><input id="sayI" maxlength="200" placeholder="Say something about the game…"><button>Send</button></form><div class="emo" id="emo"></div></aside>
</div>
<div id="toast"></div>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SRV=(()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })();
  const LSJ=(k,d)=>{ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } }, LSS=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
  const pid=()=>{ try{ let p=localStorage.getItem('rrPid'); if(!p||p.length<8){ p=Math.random().toString(36).slice(2,14); localStorage.setItem('rrPid',p); } return p; }catch(e){ return ''; } };
  const q=new URLSearchParams(location.search), LG=q.get('l')||'nba', ID=(q.get('id')||'').replace(/\D/g,'');
  let G=null, view='plays', timer=null, VOTES=LSJ('rrGdVotes',{});
  const toast=t=>{ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',3500); };
  const state=g=>`${g.home.score||0}-${g.away.score||0}`;
  const col=c=>c?'#'+c:'#1e293b';
  function board(g){ const status=g.st==='in'?`<div class="live">LIVE</div><div>${esc(g.det)}</div>`:g.st==='post'?`<div>${esc(g.det||'Final')}</div>`:`<div>${new Date(g.date).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}</div>`;
    const side=t=>`<div class="side"><img src="${esc(t.logo)}" alt=""><b>${esc(t.name)}</b><small>${esc(t.rec)}</small>${g.st!=='pre'?`<div class="sc">${esc(t.score)}</div>`:''}</div>`;
    $('sb').style.setProperty('--ca',col(g.away.color)+'55'); $('sb').style.setProperty('--ch',col(g.home.color)+'55');
    $('sb').innerHTML=`${side(g.away)}<div class="mid">${status}<div style="margin-top:6px;font-weight:600">@</div></div>${side(g.home)}`+(g.hw!=null&&g.st==='in'?`<div class="wp" style="grid-column:1/-1"><div class="bar"><i style="width:${100-g.hw}%;background:${col(g.away.color)}"></i><i style="width:${g.hw}%;background:${col(g.home.color)}"></i></div><div class="lbl"><span>${esc(g.away.ab)} ${100-g.hw}%</span><span>Chance to win</span><span>${g.hw}% ${esc(g.home.ab)}</span></div></div>`:'');
    document.title=`${g.away.ab} ${g.st!=='pre'?g.away.score:''} @ ${g.home.ab} ${g.st!=='pre'?g.home.score:''} · Rival Game Day`; }
  /* "who scores next?": vote while the score stays the same; when it changes, right guesses win coins */
  async function next(g){ const box=$('next'); if(g.st!=='in'){ box.style.display='none'; return; } box.style.display='block'; const s=state(g), mine=VOTES[ID]&&VOTES[ID].state===s?VOTES[ID].side:'';
    const sp=await fetch(SRV+'/gd/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({gid:ID,state:s})}).then(r=>r.json()).catch(()=>({h:0,a:0}));
    const tot=(sp.h||0)+(sp.a||0), ap=tot?Math.round(100*sp.a/tot):50;
    box.innerHTML=`<h3>🔮 Who scores next?</h3><div class="btns"><button data-side="a" class="${mine==='a'?'on':''}"><img src="${esc(g.away.logo)}" alt="">${esc(g.away.ab)}</button><button data-side="h" class="${mine==='h'?'on':''}"><img src="${esc(g.home.logo)}" alt="">${esc(g.home.ab)}</button></div>
      <div class="split"><i style="width:${ap}%;background:${col(g.away.color)}"></i><i style="width:${100-ap}%;background:${col(g.home.color)}"></i></div><div class="note">${tot?`${tot} fan${tot>1?'s':''} voted · ${ap}% say ${esc(g.away.ab)}`:'Be the first to vote!'} · Right guess = <b>+10 🪙</b>. Stay on this page to collect.</div>`; }
  function settle(g){ const v=VOTES[ID]; if(!v||g.st==='pre') return; const s=state(g); if(v.state===s) return;
    const [h0,a0]=v.state.split('-').map(Number), h1=+g.home.score||0, a1=+g.away.score||0; const who=h1>h0&&a1===a0?'h':a1>a0&&h1===h0?'a':'';
    delete VOTES[ID]; LSS('rrGdVotes',VOTES); if(!who) return;
    if(who===v.side){ try{ window.RRCOIN&&RRCOIN.add(10,'Game Day · called the next score'); }catch(e){} toast(`🔮 You called it! ${who==='h'?g.home.ab:g.away.ab} scored · +10 🪙`); } else toast(`😬 ${who==='h'?g.home.ab:g.away.ab} scored instead. Vote again!`); }
  function feed(g){ let h='';
    if(view==='leaders'){ h=g.leaders.length?`<div class="ld">${g.leaders.map(l=>`<div><h4>${esc(l.ab)}</h4>${l.cats.map(c=>`<div><small>${esc(c.n)}</small><b>${esc(c.who)}</b> · ${esc(c.v)}</div>`).join('')}</div>`).join('')}</div>`:'<div class="note">Leaders show up once the game starts.</div>'; }
    else { const L=view==='scoring'?g.scoring:g.plays; h=L.length?L.map(p=>`<div class="pl${p.s||view==='scoring'?' s':''}"><div class="k"><b>${esc(p.tm)}</b>${p.p?(LG==='mlb'?'Inn ':'Q')+esc(p.p):''} ${esc(p.c)}</div><div style="flex:1">${esc(p.t)}</div>${p.hs!=null?`<div class="sc2">${esc(p.as)}-${esc(p.hs)}</div>`:''}</div>`).join(''):`<div class="note">${g.st==='pre'?'Plays show up here once the game starts.':view==='scoring'?'No scoring yet.':'No plays yet.'}</div>`; }
    $('feed').innerHTML=h; }
  async function load(){ const g=await fetch(SRV+'/gd/sum?l='+LG+'&id='+ID).then(r=>r.json()).catch(()=>null);
    if(!g||g.err){ $('sb').innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--mut)">This game could not be loaded. <a href="sports" style="color:#38bdf8">Back to Sports Center</a></div>'; return; }
    G=g; settle(g); board(g); next(g); feed(g); clearTimeout(timer); timer=setTimeout(load,g.st==='in'?10000:g.st==='pre'?60000:0); if(g.st==='post') clearTimeout(timer); }
  $('tabs').onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b) return; view=b.dataset.v; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); if(G) feed(G); };
  $('next').onclick=async e=>{ const b=e.target.closest('[data-side]'); if(!b||!G) return; VOTES[ID]={state:state(G),side:b.dataset.side}; LSS('rrGdVotes',VOTES);
    await fetch(SRV+'/gd/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({gid:ID,state:state(G),pid:pid(),side:b.dataset.side})}).catch(()=>{}); next(G); };
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&G&&G.st!=='post') load(); });
  if(!ID){ location.href='sports'; return; } load();
  /* fan chat for this game (site chat with all its filters) */
  const room='tvg'+ID.slice(-11), seen=new Set();
  function addMsg(m){ if(seen.has(m.id)) return; seen.add(m.id); const d=document.createElement('div'); d.className='m'; d.innerHTML=`<b>${esc(m.name)}</b>${esc(m.text)}`; const box=$('msgs'), stick=box.scrollTop+box.clientHeight>=box.scrollHeight-40; box.appendChild(d); while(box.children.length>150) box.firstChild.remove(); if(stick) box.scrollTop=box.scrollHeight; }
  let joinedAt=0; const join=()=>{ if(window.RRC&&RRC.ready){ RRC.tvJoin(room); joinedAt=Date.now(); } };
  setInterval(()=>{ if(window.RRC&&RRC.ready&&(Date.now()-joinedAt>60000||RRC._tv!==room)) join(); },3000);
  addEventListener('rrc-tv',e=>{ const m=e.detail; if(m.room!==room) return; if(m.t==='tvhist'){ (m.list||[]).forEach(addMsg); $('cn').textContent=m.n?`· ${m.n} here`:''; } else if(m.m) addMsg(m.m); });
  $('say').onsubmit=e=>{ e.preventDefault(); const t=$('sayI').value.trim(); if(!t) return; if(!(window.RRC&&RRC.ready)){ addMsg({id:'x'+Date.now(),name:'Game Day',text:'Connecting to chat… try again in a second.'}); return; } RRC.tvSay(t); $('sayI').value=''; };
  $('emo').innerHTML=['🔥','😱','👏','💯','😂','🙌','GOAL','LETS GO'].map(x=>`<button type="button">${x}</button>`).join('');
  $('emo').onclick=e=>{ const b=e.target.closest('button'); if(b&&window.RRC&&RRC.ready) RRC.tvSay(b.textContent); };
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
