<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arcade Rivals - Pack Rip</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b18;--panel:#0f172e;--line:#24305a;--tx:#eef2ff;--mut:#93a0cc;--gold:#fde047}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#1e2a5c,#070b18 60%);color:var(--tx);font-family:Fredoka,system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:58px 16px 40px}
h1{font:700 54px/1 Teko,sans-serif;margin:0;letter-spacing:1px;text-align:center;background:linear-gradient(90deg,#fde047,#f97316,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);margin:4px 0 16px}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600}
.pill b{color:var(--gold)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 18px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:999px;padding:8px 15px;font:600 15px Fredoka;cursor:pointer}
.tab.on{background:linear-gradient(90deg,#f59e0b,#ef4444);border-color:transparent}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.pack{position:relative;border-radius:18px;padding:16px 14px 14px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,.15);overflow:hidden;transition:transform .15s}
.pack:hover{transform:translateY(-4px)}
.pack .art{height:150px;margin:0 auto 10px;width:112px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 12px 28px rgba(0,0,0,.5);position:relative;overflow:hidden}
.pack .art::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);animation:shine 3s infinite}
@keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.pack b{display:block;font:700 30px/1 Teko}.pack small{display:block;color:#dbe3ff;font-size:13px;margin:4px 0 8px;min-height:32px}
.pack .cost{display:inline-block;background:rgba(0,0,0,.4);border-radius:999px;padding:5px 12px;font-weight:700}
.pack.locked{filter:grayscale(.6) brightness(.75);cursor:default}
.sect{margin-top:28px}.sect h2{font:600 34px/1 Teko;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:12px;padding:9px 14px;font:600 14px Fredoka;cursor:pointer}
.btn.y{background:linear-gradient(90deg,#f59e0b,#ef4444);border:0}
/* the cards */
.card{position:relative;aspect-ratio:5/7;border-radius:14px;padding:8px;color:#fff;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.5);font-family:Teko,sans-serif;user-select:none}
.card .rt{position:absolute;left:9px;top:5px;font:700 40px/1 Teko}.card .ps{position:absolute;left:11px;top:43px;font:600 18px/1 Teko;opacity:.9}
.card .sp{position:absolute;right:9px;top:8px;font-size:20px}
.card .face{position:absolute;left:50%;top:26%;transform:translateX(-50%);width:54%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 32px/1 Teko;border:3px solid rgba(255,255,255,.7);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.card .nm{position:absolute;left:6px;right:6px;bottom:30px;text-align:center;font:700 21px/1 Teko;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tm{position:absolute;left:6px;right:6px;bottom:12px;text-align:center;font:500 14px/1 Teko;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tag{position:absolute;left:0;right:0;bottom:0;height:5px}
.card .n{position:absolute;right:7px;bottom:46px;background:rgba(0,0,0,.55);border-radius:999px;font:600 14px/1 Fredoka;padding:3px 7px}
.r0{background:linear-gradient(160deg,#a16207,#5b3a12)}.r1{background:linear-gradient(160deg,#cbd5e1,#64748b)}.r2{background:linear-gradient(160deg,#facc15,#b45309)}
.r3{background:linear-gradient(160deg,#38bdf8,#4338ca 55%,#1e1b4b)}.r4{background:linear-gradient(160deg,#fff7c2,#f59e0b 40%,#7c2d12)}.r5{background:linear-gradient(160deg,#f472b6,#a855f7,#22d3ee,#4ade80)}
.r1,.r2,.r4{color:#1a1205}.r4 .face,.r2 .face{border-color:rgba(0,0,0,.35)}
.r3::before,.r4::before,.r5::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.35),transparent 30%);animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.card>*{z-index:1}
/* opening */
#open{position:fixed;inset:0;background:rgba(3,6,16,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
#open.on{display:flex}
#bigpack{width:180px;height:250px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:80px;cursor:pointer;box-shadow:0 0 60px rgba(253,224,71,.35);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
#bigpack.shake{animation:shake .5s infinite}@keyframes shake{25%{transform:rotate(-6deg) scale(1.05)}75%{transform:rotate(6deg) scale(1.05)}}
#bigpack.burst{animation:burst .45s forwards}@keyframes burst{to{transform:scale(1.8);opacity:0}}
#deal{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:980px}
.slot{width:150px;perspective:900px;cursor:pointer}
.flip{position:relative;transition:transform .6s;transform-style:preserve-3d;aspect-ratio:5/7}
.flip.on{transform:rotateY(180deg)}
.flip>div{position:absolute;inset:0;backface-visibility:hidden}
.flip .back{border-radius:14px;background:repeating-linear-gradient(45deg,#1e293b 0 10px,#0f172a 10px 20px);border:2px solid #475569;display:flex;align-items:center;justify-content:center;font-size:40px}
.flip .front{transform:rotateY(180deg)}
.slot.hint .back{box-shadow:0 0 26px 6px var(--glow)}
#walk{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:120;background:radial-gradient(circle,rgba(253,224,71,.25),rgba(3,6,16,.96) 60%)}
#walk.on{display:flex}#walk .card{width:230px;animation:walk .9s cubic-bezier(.2,1.4,.5,1)}@keyframes walk{from{transform:scale(.2) rotate(-20deg);opacity:0}}
#walk h3{font:700 46px/1 Teko;color:var(--gold);margin:16px 0 0;text-shadow:0 0 20px rgba(253,224,71,.6)}
.msg{color:var(--mut);margin-top:16px;text-align:center}
#back{position:fixed;left:10px;top:10px;z-index:90;background:rgba(15,23,42,.88);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 13px;font:700 13px system-ui;text-decoration:none}
</style>
</head>
<body>
<a id="back" href="./">← Arcade</a><a href="cards" style="position:fixed;right:12px;top:10px;z-index:9;background:linear-gradient(135deg,#f59e0b,#ec4899);color:#fff;border-radius:999px;padding:7px 13px;font:800 13px system-ui;text-decoration:none">🃏 Battle with your cards</a>
<div class="wrap">
  <h1>PACK RIP</h1><div class="sub">Open sports packs, pull real stars and legends, and complete your collection.</div>
  <div class="bar"><span class="pill">🪙 <b id="bal">0</b> coins</span><span class="pill">🗂️ <b id="own">0</b> / <span id="tot">0</span> collected</span><span class="pill" id="free">🎁 Free pack…</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="packs" id="packs"></div>
  <div class="sect"><h2>📒 Your collection</h2><div class="row"><select class="btn" id="fr"><option value="-1">All rarities</option></select><button class="btn" id="sell">💰 Sell duplicates</button><span class="msg" id="sellMsg" style="margin:0"></span></div><div class="grid" id="binder"></div></div>
</div>
<div id="open"><div id="bigpack"></div><div id="deal"></div><div class="msg" id="omsg">Tap the pack to rip it open!</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="all" style="display:none">Reveal all</button><button class="btn y" id="done" style="display:none">Collect</button></div></div>
<div id="walk"></div>
<script src="packs-data.js"></script>
<script>
/* Pack Rip: an original pack-opening game for Arcade Rivals using the real rosters from 84 & Up. Coins are the site's arcade coins. */
(function(){
const $=s=>document.querySelector(s), D=window.PACKDATA, ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SP={hockey:['🏒','Hockey','nhl','NHL'],football:['🏈','Football','nfl','NFL'],basketball:['🏀','Basketball','nba','NBA'],baseball:['⚾','Baseball','mlb','MLB'],soccer:['⚽','Soccer','soc','SOC']};
const RAR=[['Bronze','#a16207'],['Silver','#94a3b8'],['Gold','#facc15'],['Elite','#38bdf8'],['Icon','#f59e0b'],['Arcade Legend','#f472b6']];
const SELL=[5,15,40,120,350,600];
/* every card in the game */
const ALL=[];
for(const [sp,[e,n,lg,K]] of Object.entries(SP)){ for(const leg of [0,1]) for(const p of D[K+(leg?'_LEG':'_NOW')]){ const r=p[4], rar=leg?4:r>=95?4:r>=90?3:r>=85?2:r>=78?1:0; const t=D.TEAMS[lg+':'+p[1]]||[p[1],'#334155','#94a3b8'];
  ALL.push({id:sp+':'+p[0]+(leg?':L':''),sp,name:p[0],team:t[0],c1:t[1],c2:t[2],pos:p[2],num:p[3],r,rar,leg}); } }
for(const k of D.KIDS) ALL.push({id:'kid:'+k[0],sp:'kid',name:k[0],team:'Arcade Rivals',c1:'#a855f7',c2:'#22d3ee',pos:'⭐',num:'',r:k[1],rar:5});
const BY={}; for(const c of ALL) BY[c.id]=c;
/* packs: [name, emoji, cards, cost, odds per rarity, guaranteed min rarity, look] */
const PACKS=[
 ['Free Pack','🎁',4,0,[60,30,8,1.6,.35,.05],0,'linear-gradient(160deg,#334155,#0f172a)','Every 5 minutes. Mostly bronze and silver.'],
 ['Silver Pack','🥈',5,150,[40,40,15,4,.8,.2],1,'linear-gradient(160deg,#e2e8f0,#475569)','5 cards, one is Silver or better.'],
 ['Gold Pack','🥇',5,450,[10,35,38,13,3.4,.6],2,'linear-gradient(160deg,#fde047,#b45309)','5 cards, one is Gold or better.'],
 ['Elite Pack','💎',5,1200,[0,20,45,26,8,1],3,'linear-gradient(160deg,#38bdf8,#312e81)','5 cards, one is Elite or better.'],
 ['Icon Pack','👑',3,3000,[0,0,40,35,22,3],4,'linear-gradient(160deg,#fff7c2,#f59e0b,#7c2d12)','3 cards, one is an all-time Icon.']];
const FREE_MS=5*60000;
let sport=ls.get('pk_sport','all'), own=ls.get('pk_own',{});
/* coins: the site's arcade coins when available, otherwise a local purse */
const coin={bal(){ try{ const b=window.RRCOIN&&RRCOIN.bal; if(typeof b==='number') return b; }catch(e){} return ls.get('pk_coins',500); },
  spend(n){ if(!n) return true; try{ if(window.RRCOIN&&RRCOIN.tradeTake) return RRCOIN.tradeTake([],n); }catch(e){} const b=ls.get('pk_coins',500); if(b<n) return false; ls.set('pk_coins',b-n); return true; },
  give(n){ try{ if(window.RRCOIN&&RRCOIN.tradeGive){ RRCOIN.tradeGive([],n); return; } }catch(e){} ls.set('pk_coins',ls.get('pk_coins',500)+n); }};
function cardHTML(c,cnt){ const ini=c.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(), e=c.sp==='kid'?'🕹️':SP[c.sp][0];
  return `<div class="card r${c.rar}"><div class="rt">${c.r}</div><div class="ps">${c.pos}</div><div class="sp">${e}</div><div class="face" style="background:linear-gradient(160deg,${c.c1},${c.c2})">${c.num||ini}</div><div class="nm">${c.name}</div><div class="tm">${c.leg?'ICON · ':''}${c.team}</div>${cnt>1?`<div class="n">×${cnt}</div>`:''}<div class="tag" style="background:${RAR[c.rar][1]}"></div></div>`; }
function pool(rar){ return ALL.filter(c=>c.rar===rar&&(c.sp==='kid'||sport==='all'||c.sp===sport)); }
function roll(odds,min){ let x=Math.random()*odds.reduce((a,b)=>a+b,0); for(let i=0;i<odds.length;i++){ if((x-=odds[i])<0) return Math.max(i,min); } return min; }
function pick(rar){ for(let r=rar;r>=0;r--){ const p=pool(r); if(p.length) return p[Math.floor(Math.random()*p.length)]; } return ALL[0]; }
function render(){ $('#bal').textContent=Math.floor(coin.bal()).toLocaleString(); const mine=Object.keys(own).filter(k=>BY[k]); $('#own').textContent=mine.length; $('#tot').textContent=ALL.length;
  $('#tabs').innerHTML=[['all','🌟 All sports'],...Object.entries(SP).map(([k,v])=>[k,v[0]+' '+v[1]])].map(([k,t])=>`<button class="tab${k===sport?' on':''}" data-s="${k}">${t}</button>`).join('');
  const left=Math.max(0,ls.get('pk_free',0)+FREE_MS-Date.now());
  $('#free').innerHTML=left?`🎁 Free pack in <b>${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}</b>`:'🎁 <b>Free pack ready!</b>';
  $('#packs').innerHTML=PACKS.map((p,i)=>{ const lock=i===0?left>0:coin.bal()<p[3]; return `<div class="pack${lock?' locked':''}" data-p="${i}" style="background:${p[6]}"><div class="art" style="background:${p[6]}">${p[1]}</div><b>${p[0]}</b><small>${p[7]}</small><span class="cost">${p[3]?'🪙 '+p[3].toLocaleString():(left?'⏳ wait':'FREE')}</span></div>`; }).join('');
  binder(); }
function binder(){ const f=+$('#fr').value, l=Object.keys(own).map(k=>BY[k]).filter(c=>c&&(sport==='all'||c.sp===sport||c.sp==='kid')&&(f<0||c.rar===f)).sort((a,b)=>b.rar-a.rar||b.r-a.r);
  $('#binder').innerHTML=l.length?l.map(c=>cardHTML(c,own[c.id])).join(''):'<div class="msg">No cards here yet. Open a pack!</div>'; }
/* opening a pack */
let cur=null;
function openPack(i){ const p=PACKS[i];
  if(i===0){ if(ls.get('pk_free',0)+FREE_MS>Date.now()) return; ls.set('pk_free',Date.now()); }
  else if(!coin.spend(p[3])){ $('#sellMsg').textContent='Not enough coins: play games to earn more, or sell duplicates.'; return; }
  const rs=Array.from({length:p[2]},()=>roll(p[4],0)); if(Math.max(...rs)<p[5]) rs[Math.floor(Math.random()*rs.length)]=p[5];
  const cards=rs.map(pick).sort((a,b)=>a.rar-b.rar||a.r-b.r); cur={cards,flipped:0};
  for(const c of cards) own[c.id]=(own[c.id]||0)+1; ls.set('pk_own',own);
  try{ if(window.RRL) RRL.post('coll',Object.keys(own).length,Object.keys(own).length+' cards'); }catch(e){}
  const bp=$('#bigpack'); bp.className=''; bp.style.background=p[6]; bp.textContent=p[1]; bp.style.display='flex'; $('#deal').innerHTML=''; $('#omsg').textContent='Tap the pack to rip it open!'; $('#all').style.display='none'; $('#done').style.display='none'; $('#open').classList.add('on'); render(); }
$('#bigpack').onclick=()=>{ const bp=$('#bigpack'); if(bp.classList.contains('shake')) return; bp.classList.add('shake'); snd(200,.4);
  setTimeout(()=>{ bp.className='burst'; snd(500,.3); setTimeout(()=>{ bp.style.display='none';
    $('#deal').innerHTML=cur.cards.map((c,i)=>`<div class="slot${c.rar>=3?' hint':''}" style="--glow:${RAR[c.rar][1]}" data-i="${i}"><div class="flip"><div class="back">🎴</div><div class="front">${cardHTML(c)}</div></div></div>`).join('');
    $('#omsg').textContent='Tap each card to flip it. Glowing ones are rare!'; $('#all').style.display=''; },420); },900); };
function flip(i){ const s=$('#deal').children[i]; if(!s) return; const f=s.querySelector('.flip'); if(f.classList.contains('on')) return; f.classList.add('on'); cur.flipped++; const c=cur.cards[i];
  snd(300+c.rar*150,.2); if(c.rar>=3) walkout(c); if(cur.flipped>=cur.cards.length){ $('#done').style.display=''; $('#all').style.display='none'; } }
function walkout(c){ const w=$('#walk'); w.innerHTML=cardHTML(c)+`<h3>${RAR[c.rar][0].toUpperCase()}${c.rar===5?'!!!':'!'}</h3><div class="msg">${c.name} · ${c.team}</div>`; w.classList.add('on'); snd(880,.5); setTimeout(()=>snd(1320,.5),180); }
$('#walk').onclick=()=>$('#walk').classList.remove('on');
$('#deal').addEventListener('click',e=>{ const s=e.target.closest('.slot'); if(s) flip(+s.dataset.i); });
$('#all').onclick=()=>{ cur.cards.forEach((c,i)=>setTimeout(()=>flip(i),i*220)); };
$('#done').onclick=()=>{ $('#open').classList.remove('on'); render(); };
$('#packs').addEventListener('click',e=>{ const p=e.target.closest('.pack'); if(p&&!p.classList.contains('locked')) openPack(+p.dataset.p); });
$('#tabs').addEventListener('click',e=>{ const t=e.target.closest('.tab'); if(!t) return; sport=t.dataset.s; ls.set('pk_sport',sport); render(); });
$('#fr').innerHTML+=RAR.map((r,i)=>`<option value="${i}">${r[0]}</option>`).join(''); $('#fr').onchange=binder;
$('#sell').onclick=()=>{ let got=0,n=0; for(const k of Object.keys(own)){ const c=BY[k]; if(c&&own[k]>1){ got+=(own[k]-1)*SELL[c.rar]; n+=own[k]-1; own[k]=1; } } ls.set('pk_own',own); if(got) coin.give(got); $('#sellMsg').textContent=n?`Sold ${n} duplicate${n>1?'s':''} for 🪙 ${got.toLocaleString()}`:'No duplicates to sell.'; render(); };
let AC=null; function snd(f,d){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type='triangle'; o.frequency.setValueAtTime(f,AC.currentTime); o.frequency.exponentialRampToValueAtTime(f*1.5,AC.currentTime+d); g.gain.setValueAtTime(.09,AC.currentTime); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d); }catch(e){} }
render(); setInterval(()=>{ if(!$('#open').classList.contains('on')){ const b=$('#bal'); if(b) b.textContent=Math.floor(coin.bal()).toLocaleString(); const left=Math.max(0,ls.get('pk_free',0)+FREE_MS-Date.now()); $('#free').innerHTML=left?`🎁 Free pack in <b>${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}</b>`:'🎁 <b>Free pack ready!</b>'; if(left<1000&&left>0) render(); } },1000);
setTimeout(render,1500);   /* coins load a moment after the page */
try{ window.RRL&&RRL.boards('packs',[{id:'coll',name:'Cards collected',mode:'max'}]); }catch(e){}
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
