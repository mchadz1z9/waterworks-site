function press(){const g=G;if(!g||g.over||g.fly)return;g.hold=true;g.pw=0;g.dir=1}
function release(){const g=G;if(!g||!g.hold)return;g.hold=false;const ideal=.55+g.yd/200,win=[.14,.1,.07][sv.diff],err=g.pw-ideal;const short=err<-win*1.2;
 const spread=Math.abs(err)<win?0:Math.abs(err)*1.1;const wind=g.wind*(g.yd/50)*.45*[.6,1,1.3][sv.diff];
 let lat=g.aim+wind*.0+(Math.random()-.5)*spread*.3-wind*.12*0;const drift=wind*.22;const endx=g.aim+drift+(Math.random()-.5)*(.05+spread*.4)*[.7,1,1.4][sv.diff];
 const dist=g.yd/55,range=Math.min(1.25,(g.pw/ideal))*(.62+g.yd/150)*1.08;const long=range>=dist*.97;
 const good=!short&&long&&Math.abs(endx)<.1;g.fly={t:0,endx,good,short:short||!long,miss:(Math.abs(endx)<.13&&!good)};g.sp=[];beep(260,.1,'triangle',.06)}
function step(dt){const g=G;if(!g||g.over)return;g.tt+=dt;g.sp=g.sp.filter(p=>(p.l-=dt*2)>0);g.sp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12});
 if(g.hold){g.pw+=g.dir*dt*.9;if(g.pw>=1){g.pw=1;g.dir=-1}if(g.pw<=0){g.pw=0;g.dir=1}}
 if(g.fly){g.fly.t+=dt/1.3;if(g.fly.t>=1){const f=g.fly;if(f.good){const pts=3+(g.yd>=50?2:g.yd>=40?1:0);g.score+=pts;g.makes++;g.msg='GOOD! +'+pts;beep(900,.2,'triangle',.08);for(let i=0;i<20;i++)g.sp.push({x:500,y:140,vx:rnd(-3,3),vy:rnd(-4,0),l:1})}else{g.msg=f.short?'SHORT':Math.abs(f.endx)<.13?'NO GOOD (just wide)':'WIDE';beep(150,.2,'sawtooth',.06)}g.msgT=g.tt;g.fly=null;g.k++;if(g.k>=10){fin();return}g.yd=22+g.k*3.5;g.wind=Math.max(-1,Math.min(1,g.wind*.5+rnd(-.7,.7)))}}}
function fin(){const g=G;g.over=true;if(g.score>sv.best)sv.best=g.score;sv.runs++;sv_('fg1',sv);$('#ovl').innerHTML='<div class="ovl"><div class="box"><h2>'+(g.makes>=8?'All-Pro kicker!':g.makes>=5?'Solid day':'Keep practicing')+'</h2><div class="big" style="font-size:44px">'+g.score+'</div><div class="tip" style="margin:10px 0">'+g.makes+'/10 made · best '+sv.best+'</div><div style="display:grid;gap:8px"><button class="btn" data-a="go">Play again</button><button class="btn g" data-a="title">Menu</button></div></div></div>'}
addEventListener('keydown',e=>{if(V!=='game'||!G)return;if(e.code==='Space'){e.preventDefault();if(!e.repeat)press()}if(e.code==='KeyA'||e.code==='ArrowLeft')G.aim=Math.max(-.12,G.aim-.01);if(e.code==='KeyD'||e.code==='ArrowRight')G.aim=Math.min(.12,G.aim+.01)});addEventListener('keyup',e=>{if(e.code==='Space'&&V==='game')release()});
document.addEventListener('pointermove',e=>{const cv=$('#cv');if(!cv||!G)return;const r=cv.getBoundingClientRect();G.aim=Math.max(-.12,Math.min(.12,((e.clientX-r.left)/r.width-.5)*.3))});
document.addEventListener('pointerdown',e=>{if(V==='game'&&e.target.id==='cv'){ac();press()}});document.addEventListener('pointerup',()=>{if(V==='game')release()});
function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d'),g=G;
 const bg=x.createLinearGradient(0,0,0,560);bg.addColorStop(0,'#1a3a7a');bg.addColorStop(.5,'#6aa0d8');bg.addColorStop(1,'#c8dcec');x.fillStyle=bg;x.fillRect(0,0,1000,560);
 x.fillStyle='#2a3a5a';x.fillRect(0,170,1000,40);for(let i=0;i<120;i++){x.fillStyle='hsl('+(i*47%360)+',50%,55%)';x.fillRect((i*9)%1000,176+(i%4)*8,5,5)}
 x.fillStyle='#17702f';x.fillRect(0,210,1000,350);for(let i=0;i<14;i++){x.fillStyle=i%2?'#1c7c36':'#17702f';x.fillRect(0,210+i*25,1000,25)}
 // uprights
 x.strokeStyle='#ffd23f';x.lineWidth=7;x.beginPath();x.moveTo(420,60);x.lineTo(420,160);x.lineTo(580,160);x.lineTo(580,60);x.moveTo(500,160);x.lineTo(500,215);x.stroke();
 // wind flag
 x.strokeStyle='#ccc';x.lineWidth=3;x.beginPath();x.moveTo(850,290);x.lineTo(850,220);x.stroke();x.fillStyle='#e03a3a';x.beginPath();x.moveTo(850,222);x.lineTo(850+g.wind*70,232+Math.sin(g.tt*6)*4);x.lineTo(850,246);x.fill();x.fillStyle='#fff';x.font='700 13px system-ui';x.textAlign='center';x.fillText('wind '+(g.wind>0?'→':'←')+' '+Math.abs(g.wind*12).toFixed(0)+' mph',850,310);
 // ball/kicker
 const f=g.fly;let bx=500+g.aim*1500,by=500;if(f){const t=f.t;bx=500+g.aim*1500+(f.endx*1500-g.aim*1500)*t;by=500-340*t-Math.sin(t*Math.PI)*140;}
 const sc=f?1-f.t*.6:1;x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(bx,f?500-340*(f?f.t:0):510,16*sc,6*sc,0,0,7);x.fill();x.save();x.translate(bx,by);x.rotate(f?f.t*10:0);x.fillStyle='#8a4a1a';x.beginPath();x.ellipse(0,0,15*sc,9*sc,.4,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke();x.restore();
 if(!f){ath(x,452,545,70,{shirt:'#2f7fd0',helmet:'#1a2a5a',num:3,f:1,sock:'#fff',ll:g.hold?-.4-g.pw*.7:.15,rl:g.hold?.25:-.1,la:.5,ra:-.5});
  x.strokeStyle='rgba(255,255,255,.6)';x.setLineDash([8,8]);x.lineWidth=2;x.beginPath();x.moveTo(500+g.aim*1500,490);x.lineTo(500+g.aim*1500*1.0,230);x.stroke();x.setLineDash([])}
 x.fillStyle='#ffd23f';g.sp.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;
 // meter
 const ideal=.55+g.yd/200,win=[.14,.1,.07][sv.diff],mx=350,my=520,mw=300;x.fillStyle='rgba(8,5,26,.85)';x.beginPath();x.roundRect(mx-6,my-8,mw+12,26,8);x.fill();x.fillStyle='#2a2a50';x.fillRect(mx,my,mw,10);x.fillStyle='#4be07a';x.fillRect(mx+(ideal-win)*mw,my,win*2*mw,10);x.fillStyle='#fff';x.fillRect(mx+g.pw*mw-2,my-5,4,20);
 x.fillStyle='rgba(8,5,26,.85)';x.beginPath();x.roundRect(250,10,500,50,12);x.fill();x.fillStyle='#ffd23f';x.font='900 24px system-ui';x.textAlign='center';x.fillText(g.score+' pts',350,44);x.fillStyle='#fff';x.font='800 17px system-ui';x.fillText('Kick '+Math.min(10,g.k+1)+'/10 · '+Math.round(g.yd)+' yards',560,42);
 if(g.tt-g.msgT<1.3&&g.msg){x.font='900 42px system-ui';x.lineWidth=7;x.strokeStyle='rgba(0,0,0,.7)';x.strokeText(g.msg,500,320);x.fillStyle=g.msg[0]==='G'?'#ffd23f':'#ff6b5a';x.fillText(g.msg,500,320)}}
function loop(){let last=performance.now();const f=now=>{const dt=Math.min(.03,(now-last)/1000||0);last=now;if(G){step(dt);draw()}if(V==='game')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
render();
