<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rink Rivals - Rodeo</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6f2; --panel:#ffffff; --ink:#0f1730; --muted:#55627f; --line:#c3cde2;
  --led:#ffb703; --ledbg:#0a0d18; --acc:#3b82f6;
  --font:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Impact,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
}
:root[data-theme="dark"]{ --bg:#0b1120; --panel:#141c33; --ink:#eef2fb; --muted:#93a0bd; --line:#27345a; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:600; }
main{ max-width:1060px; margin:0 auto; padding:12px 14px 22px; }
.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:800; letter-spacing:.01em; }
.brand span{ color:var(--muted); font-weight:600; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button,.tools a{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:4px 14px; cursor:pointer; text-decoration:none; }
.tools button:focus-visible,.tools a:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; }

.board{ display:grid; grid-template-columns:1fr auto 1fr; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
.side{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-left:9px solid var(--tc,var(--line)); min-width:0; }
.side.r{ flex-direction:row-reverse; text-align:right; border-left:0; border-right:9px solid var(--tc,var(--line)); }
.side img{ width:46px; height:46px; flex:none; }
.tn{ font-size:26px; font-weight:800; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tp{ font-size:15px; color:var(--muted); white-space:nowrap; }
.sc{ font-size:58px; font-weight:800; line-height:.9; margin-left:auto; font-variant-numeric:tabular-nums; }
.side.r .sc{ margin-left:0; margin-right:auto; }

.clock{ background:var(--ledbg); color:var(--led); padding:6px 18px; text-align:center; min-width:170px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.clock .t{ font-size:40px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(255,183,3,.55); }
.clock .pd{ font-size:17px; display:flex; align-items:center; gap:8px; }
.clock svg{ width:30px; height:22px; }

.stage{ position:relative; margin:10px auto 0; width:min(100%, calc((100vh - 300px) * 1.806)); min-width:320px; border-radius:14px; overflow:hidden; background:#070b16; touch-action:none; }
#cv{ display:block; width:100%; height:auto; position:relative; z-index:1; }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:none; }
.r3 #gl{ display:block; }
.viewbtn{ position:absolute; top:8px; right:8px; z-index:4; font:inherit; font-size:15px; color:#fff; background:rgba(5,8,18,.78); border:2px solid #ffd166; border-radius:999px; padding:3px 12px; cursor:pointer; }
.viewbtn:hover{ background:rgba(20,28,51,.95); }
.stage:fullscreen{ width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#05080f; }
.stage:fullscreen #cv{ width:min(100vw, calc(100vh * 1.806)); }

.overlay{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; background:rgba(8,12,24,.9); color:#fff; padding:14px; text-align:center; overflow:auto; z-index:3; }
.hidden{ display:none !important; }
.menu-in{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:900px; margin:auto; width:100%; }
.menu-in h1{ margin:0; font-size:clamp(34px,6vw,54px); font-weight:800; line-height:.95; }
.menu-in p{ margin:0; font-size:clamp(15px,2.2vw,19px); color:#b7c2dd; }
.pills{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
.pills button,.pills a{ font:inherit; font-size:17px; color:#dbe3f5; background:#141c33; border:2px solid #27345a; border-radius:999px; padding:3px 14px; cursor:pointer; text-decoration:none; }
.pills button.on{ background:#fff; color:#0b1120; border-color:#fff; }
.pills button.gold{ color:#08101f; background:#ffd166; border-color:#ffd166; }
.pills .lbl{ color:#93a0bd; font-size:17px; margin-right:2px; }
.pickers{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:4px 0; }
.pk{ width:300px; max-width:100%; padding:10px; border-radius:14px; background:#141c33; border:3px solid #27345a; display:grid; grid-template-columns:34px 1fr 34px; align-items:center; gap:4px; }
.pk.p1{ border-color:#34d399; } .pk.p2{ border-color:#f472b6; }
.pk .ar{ font:inherit; font-size:24px; color:#fff; background:#27345a; border:0; border-radius:10px; height:60px; cursor:pointer; }
.pk .mid img{ width:62px; height:62px; }
.pk .who{ font-size:15px; font-weight:800; }
.pk.p1 .who{ color:#34d399; } .pk.p2 .who{ color:#f472b6; }
.pk .n{ font-size:24px; font-weight:800; line-height:1.05; }
.pk .meta{ font-size:15px; color:#93a0bd; }
.how{ display:flex; gap:6px 22px; flex-wrap:wrap; justify-content:center; font-size:16px; color:#dbe3f5; }
.how b{ color:#fff; }
#hint{ min-height:22px; font-size:18px; color:#ffd166; }
.toast{ position:absolute; left:50%; top:12px; transform:translateX(-50%); background:rgba(10,14,28,.94); color:#fff; border:2px solid #34d399; border-radius:999px; padding:4px 18px; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:5; white-space:nowrap; }
.toast.on{ opacity:1; }
.banner{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; color:#fff; text-shadow:0 0 28px var(--glow,#000), 0 4px 18px rgba(0,0,0,.7); z-index:2; }
.banner.on{ opacity:1; }
.banner .big{ display:block; font-size:clamp(40px,9vw,100px); font-weight:800; line-height:1; }
.banner .sub{ display:block; font-size:clamp(18px,3vw,30px); margin-top:4px; }
.result{ align-items:center; }
.result h2{ margin:0; font-size:clamp(40px,8vw,76px); font-weight:800; line-height:1; }
.result .rs{ font-size:clamp(36px,6vw,60px); font-weight:800; color:var(--led); font-variant-numeric:tabular-nums; }
.result p{ margin:8px 0 0; font-size:20px; color:#dbe3f5; }
table.ls{ margin:12px auto 0; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums; background:#141c33; border-radius:10px; overflow:hidden; }
.ls th,.ls td{ padding:3px 9px; text-align:center; border-left:1px solid #27345a; }
.ls th{ color:#93a0bd; font-weight:600; }
.ls td:first-child,.ls th:first-child{ text-align:left; border-left:0; }
.ls .tot{ color:var(--led); font-weight:800; }
.keys{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 26px; font-size:17px; color:var(--muted); justify-content:center; }
.keys b{ color:var(--ink); margin-right:4px; }
.hub{ display:none; margin-top:10px; }
.inhub .hub{ display:block; }
.inhub .board,.inhub .stage,.inhub .keys,.inhub .onice{ display:none; }
.hhead{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-left:9px solid var(--tc,var(--line)); border-radius:14px; padding:10px 16px; flex-wrap:wrap; }
.hhead img{ width:56px; height:56px; }
.hname{ font-size:32px; font-weight:800; line-height:1; }
.hsub{ color:var(--muted); font-size:18px; }
.coins{ margin-left:auto; font-size:22px; background:var(--ledbg); color:var(--led); padding:4px 14px; border-radius:10px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tabs button{ font:inherit; font-size:18px; padding:4px 16px; border-radius:999px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.tabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tabs button.alert{ border-color:#f59e0b; }
.hgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:12px; }
.hcard{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; }
.hcard h3{ margin:0 0 8px; font-size:22px; font-weight:800; }
.hcard h3 img{ width:26px; height:26px; vertical-align:middle; margin:0 6px; }
.wide{ grid-column:1/-1; }
.scroll{ max-height:520px; overflow:auto; }
table.st{ width:100%; border-collapse:collapse; font-size:17px; font-variant-numeric:tabular-nums; }
.st th{ text-align:right; color:var(--muted); font-weight:600; padding:2px 6px; position:sticky; top:0; background:var(--panel); }
.st td{ text-align:right; padding:3px 6px; border-top:1px solid var(--line); }
.st th:first-child,.st td:first-child,.st .l{ text-align:left; white-space:nowrap; }
.st tr.me td{ background:rgba(59,130,246,.16); font-weight:800; }
.st tr.cut td{ border-top:2px dashed var(--muted); }
.st tr.sel td{ background:rgba(245,158,11,.22); }
.st tr.click{ cursor:pointer; }
.st img{ width:20px; height:20px; vertical-align:middle; margin-right:6px; }
.ovr{ display:inline-block; min-width:34px; text-align:center; border-radius:6px; padding:0 4px; font-weight:800; color:#08101f; }
.nm{ cursor:text; border-bottom:1px dashed transparent; }
.nm:hover{ border-bottom-color:var(--muted); }
.st input{ font:inherit; font-size:16px; width:160px; }
.opp{ display:flex; align-items:center; gap:14px; margin:6px 0 12px; }
.opp img{ width:64px; height:64px; }
.opp .on{ font-size:28px; font-weight:800; line-height:1.05; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{ font:inherit; font-size:20px; font-weight:800; padding:6px 18px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); }
.btn.sm{ font-size:16px; padding:2px 12px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.up{ display:grid; grid-template-columns:1fr auto auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.up .d{ grid-column:1; color:var(--muted); font-size:15px; }
.up .n{ font-size:20px; font-weight:800; }
.pips{ display:flex; gap:3px; }
.pip{ width:14px; height:14px; border-radius:3px; background:var(--line); }
.pip.on{ background:#f59e0b; }
.log{ margin:0; padding:0; list-style:none; font-size:18px; }
.log li{ padding:3px 0; border-top:1px solid var(--line); }
.hfoot{ margin-top:12px; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; color:var(--muted); font-size:17px; align-items:center; }
.bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.bar i{ display:block; height:100%; background:#34d399; }
.attr{ display:grid; grid-template-columns:120px 1fr 40px auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
select.big{ font:inherit; font-size:18px; padding:3px 8px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
.msg{ font-size:18px; margin-top:8px; min-height:24px; }
.msg.ok{ color:#10b981; } .msg.no{ color:#ef4444; }
.st tr.dim td{ opacity:.55; }
.result{ align-items:flex-start; }
.bxw{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.bxs h3{ margin:6px 0 0; font-size:22px; } .bxs h3 img{ width:26px; height:26px; vertical-align:middle; }
.bxs small{ color:#93a0bd; }
.bxw .ls{ font-size:14px; } .bxw .ls th,.bxw .ls td{ padding:1px 6px; }
.result h2{ font-size:clamp(32px,6vw,60px); }
.potg{ margin:12px auto 0; max-width:420px; background:#141c33; border-left:8px solid var(--tc); border-radius:10px; padding:8px 14px; text-align:left; display:flex; flex-direction:column; }
.potg small{ color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:.06em; } .potg b{ font-size:24px; color:#fff; } .potg span{ color:#93a0bd; }
kbd{ display:inline-block; min-width:24px; padding:1px 7px; margin:0 2px; border-radius:6px; border:2px solid currentColor; font:inherit; font-size:.9em; text-align:center; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Rink Rivals <span>Rodeo</span></div>
    <div class="tools">
      <a href="./">Home</a> <a href="hockey">Hockey</a>
      <a href="hunting">Hunting</a>
      <a href="monster">Monster Truck</a>
      <button id="btnView" tabindex="-1">Broadcast 3D</button>
      <button id="btnFs" tabindex="-1">Full screen (Z)</button>
      <button id="btnSnd" tabindex="-1">Sound on</button>
    </div>
  </div>

  <section class="board" aria-label="Scoreboard">
    <div class="side" id="sideL"><img id="logoL" alt=""><div style="min-width:0"><div class="tn" id="nameL">-</div><div class="tp" id="tpL">Away</div></div><div class="sc" id="scoreL">0</div></div>
    <div class="clock"><div class="t" id="cntT">0-0</div><div class="pd"><span id="innT">Top 1st</span><span id="basesT"></span></div><div class="pd" id="outsT">0 outs</div></div>
    <div class="side r" id="sideR"><img id="logoR" alt=""><div style="min-width:0"><div class="tn" id="nameR">-</div><div class="tp" id="tpR">Home</div></div><div class="sc" id="scoreR">0</div></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <button class="viewbtn" id="viewBtn2" tabindex="-1">View: Broadcast 3D</button>
    <canvas id="cv" role="img" aria-label="Rodeo game"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="menu"><div class="menu-in" id="menuIn"></div></div>
    <div class="overlay result hidden" id="result"><div id="resultIn"></div></div>
  </div>

  <footer class="keys" id="keysHelp"></footer>
  <section class="hub" id="hub" aria-label="Season hub"></section>
</main>
<script src="online.js"></script>
<script src="versus.js"></script>
<script>
(() => {
'use strict';
const W=1120, H=620, DPR=Math.min(2, window.devicePixelRatio||1);
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const TEST=/[?&]test\b/.test(location.search);
const rnd=(a,b)=>a+(b-a)*Math.random(), pick=a=>a[Math.floor(Math.random()*a.length)];
function gauss(){ let u=0; while(!u) u=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random()); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- vectors ---------- */
const v3=(x=0,y=0,z=0)=>[x,y,z], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{ const l=len(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; }, madd=(a,b,s)=>{ a[0]+=b[0]*s; a[1]+=b[1]*s; a[2]+=b[2]*s; return a; };
function rotV(v,ax,ang){ const c=Math.cos(ang), s=Math.sin(ang), d=dot(ax,v), cr=cross(ax,v); return [v[0]*c+cr[0]*s+ax[0]*d*(1-c),v[1]*c+cr[1]*s+ax[1]*d*(1-c),v[2]*c+cr[2]*s+ax[2]*d*(1-c)]; }
const angD=a=>{ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; };


/* ---------- the cowboys and cowgirls, and the stock (game ratings) ---------- */
const RIDERS={bull:[['José Vitor Leme','BRA',96],['Jess Lockwood','USA',93],['Kaique Pacheco','BRA',94],['J.B. Mauney','USA',92],['Daylon Swearingen','USA',91],['Dalton Kasel','USA',91],['John Crimber','USA',90],['Cassio Dias','BRA',90],['Sage Kimzey','USA',92],['Brady Fielder','AUS',89]],
 bronc:[['Zeke Thurston','CAN',95],['Ryder Wright','USA',94],['Stetson Wright','USA',95],['Sage Newman','USA',93],['Brody Cress','USA',92],['Lefty Holman','USA',91],['Statler Wright','USA',90],['Ryder Sanford','USA',90]],
 barrels:[['Hailey Kinsel','USA',96],['Jordon Briggs','USA',95],['Emily Beisel','USA',93],['Stevi Hillman','USA',92],['Jessica Routier','USA',92],['Kassie Mowry','USA',91],['Sissy Winn','USA',90],['Amanda Welsh','USA',90]]};
const BULLS=[['Ridin\' Solo',96,'spin'],['Woopa',95,'kick'],['Chiseled',94,'spin'],['Smooth Operator',93,'drop'],['Bruiser',94,'kick'],['Little Yellow Jacket',97,'spin'],['Bushwacker',98,'drop'],['Sweet Pro\'s Bruiser',93,'kick'],['Wicked Stick',90,'spin'],['Hostage',92,'belly']];
const BRONCS=[['Get Smart',95],['Lunatic Fringe',94],['Medicine Woman',93],['Spades',92],['Wound Up',91],['Big Tex',90]];
/* ---------- the bull's moves: what each does to the rider (forward/back and sideways pushes, in g) and how it looks ---------- */
const MOVES={kick:{d:.7,tell:.22,ax:[[0,0],[.15,.9],[.45,-.35],[.7,0]],az:null,pose:'kick'},drop:{d:.65,tell:.2,ax:[[0,-.3],[.3,-.5],[.42,1.1],[.65,0]],pose:'drop'},rear:{d:.7,tell:.25,ax:[[0,0],[.25,-.9],[.55,.35],[.7,0]],pose:'rear'},
 spinL:{d:2.2,tell:.25,yaw:-3.2,az:.75,ax:[[0,.2],[.4,.5],[.8,.1],[1.2,.6],[1.6,.1],[2.2,.3]],pose:'spin'},spinR:{d:2.2,tell:.25,yaw:3.2,az:-.75,ax:[[0,.2],[.4,.5],[.8,.1],[1.2,.6],[1.6,.1],[2.2,.3]],pose:'spin'},
 belly:{d:.9,tell:.18,az2:[[0,0],[.25,1.1],[.5,-1.1],[.9,0]],ax:[[0,.2],[.5,.4],[.9,0]],pose:'belly'},jump:{d:.55,tell:.12,ax:[[0,.3],[.25,.45],[.55,0]],pose:'kick'}};
const sampleK=(k,t)=>{ if(!k) return 0; for(let i=1;i<k.length;i++){ if(t<=k[i][0]){ const a=k[i-1], b=k[i], u=(t-a[0])/Math.max(1e-6,b[0]-a[0]); return a[1]+(b[1]-a[1])*u; } } return k[k.length-1][1]; };
/* a bull's trip out of the chute: a sequence of moves in its own style */
function bullScript(style,rat,rng,len){ const out=[]; let t=.4; const W={spin:{spinL:.25,spinR:.25,kick:.2,drop:.12,belly:.06,jump:.12},kick:{kick:.38,drop:.2,spinL:.12,spinR:.12,belly:.06,jump:.12},drop:{drop:.35,kick:.25,spinL:.12,spinR:.12,belly:.06,jump:.1},belly:{belly:.25,kick:.2,spinL:.15,spinR:.15,drop:.15,jump:.1}}[style]||{kick:.3,drop:.2,spinL:.2,spinR:.2,jump:.1};
  const pick=()=>{ let r=rng()*Object.values(W).reduce((a,b)=>a+b,0); for(const k in W){ if((r-=W[k])<=0) return k; } return 'kick'; };
  while(t<len){ const k=pick(), M=MOVES[k], intens=.75+(rat-88)*.025+rng()*.15; out.push({k,t,d:M.d*(1.15-(rat-88)*.012),i:intens}); t+=M.d*(1.15-(rat-88)*.012)+.05+rng()*.18; } return out; }
/* the bronc: rhythmic leaps, the rider spurs at the top of each one */
function broncScript(rat,rng,len){ const out=[]; let t=.35; while(t<len){ const d=.62-(rat-88)*.006+rng()*.06; out.push({k:rng()<.12?'drop':'jump',t,d,i:.8+(rat-88)*.03+rng()*.1}); t+=d; } return out; }

/* ---------- the arena: barrel pattern (cloverleaf) ---------- */
const BARRELS=[[-8.2,17.5],[8.2,17.5],[0,35]];

/* ---------- audio ---------- */
let AC=null, muted=false;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type='square',v=.05,f2=null,delay=0){ if(muted||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function noise(d,v,fc,type='lowpass',delay=0){ if(muted||!AC) return; const n=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,n,AC.sampleRate), x=b.getChannelData(0); for(let i=0;i<n;i++) x[i]=(Math.random()*2-1)*(1-i/n); const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=b; f.type=type; f.frequency.value=fc; g.gain.value=v; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(AC.currentTime+delay); }
const sfx={ click:()=>tone(700,.04,'square',.03), gate:()=>{ noise(.3,.25,600); tone(180,.2,'square',.05,120); }, stomp:v=>noise(.12,.1+.12*v,260), snort:()=>noise(.25,.08,1400,'bandpass'), buzzer:()=>tone(330,.9,'sawtooth',.06), fall:()=>{ noise(.35,.25,300); }, crowd:v=>noise(1.6,v||.14,900), spur:()=>tone(2400,.05,'triangle',.03), hoof:()=>noise(.05,.05,400), barrel:()=>{ tone(160,.25,'square',.06,90); noise(.2,.15,500); }, cheer:()=>{ noise(1.8,.2,1200); } };
let lastSay=0; function speak(t,pri){ if(muted||!window.speechSynthesis) return; const now=performance.now(); if(!pri&&now-lastSay<1200) return; lastSay=now; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=1.08; speechSynthesis.speak(u); }catch(e){} }
/* ---------- state ---------- */
let RD=null, EV=null, phase='menu', paused=false, evSel='bull', modeSel='event', assist=true, camMode=0;
const keys=new Set(); const held=a=>a.some(k=>keys.has(k));
const SKEY='rinkRivalsRodeoV1'; let SV=(()=>{ try{ return Object.assign({best:{bull:0,bronc:0,barrels:null},rides:0,falls:0,wins:0,buckles:0},JSON.parse(localStorage.getItem(SKEY)||'null')||{}); }catch(e){ return {best:{bull:0,bronc:0,barrels:null},rides:0,falls:0,wins:0,buckles:0}; } })();
const saveSV=()=>{ try{ localStorage.setItem(SKEY,JSON.stringify(SV)); }catch(e){} };
try{ const p=JSON.parse(localStorage.getItem('rinkRivalsRodeoPrefs')||'null'); if(p){ evSel=p.evSel||evSel; modeSel=p.modeSel||modeSel; assist=p.assist??assist; camMode=p.camMode||0; } }catch(e){}
const savePrefs=()=>{ try{ localStorage.setItem('rinkRivalsRodeoPrefs',JSON.stringify({evSel,modeSel,assist,camMode})); }catch(e){} };
const EVN={bull:'Bull riding',bronc:'Saddle bronc',barrels:'Barrel racing'};

/* ---------- an event: two go-rounds, the real field rides too, the aggregate wins the buckle ---------- */
function newEvent(){ const seed=window.RRV&&RRV.on?(RRV.seed||1):Math.floor(Math.random()*1e9), rng=mulberry32(seed);
  EV={ev:evSel,round:0,rounds:modeSel==='event'?2:1,rng,me:[],field:RIDERS[evSel].map(([name,nat,rat])=>({name,nat,rat,r:[]})),draw:[]};
  for(let i=0;i<2;i++) EV.draw.push(evSel==='bull'?BULLS[Math.floor(rng()*BULLS.length)]:evSel==='bronc'?BRONCS[Math.floor(rng()*BRONCS.length)]:null);
  startGo(); }
function startGo(){ const e=EV.ev, d=EV.draw[EV.round]; phase='play'; paused=false; $('menu').classList.add('hidden'); $('result').classList.add('hidden'); camE=null;
  if(e==='barrels') newBarrels(); else newRide(e,{name:d[0],rat:d[1],style:d[2]||'kick'});
  banner(EV.rounds>1?`Round ${EV.round+1}`:EVN[e],e==='barrels'?'The cloverleaf: round all three barrels and home':`You drew ${d[0]}`,'#b45309',2.4); updateBoard(); renderKeysHelp(); }
/* the rest of the field's results for this go-round */
function fieldGo(){ const e=EV.ev, r=EV.rng, out=[];
  for(const f of EV.field){ if(e==='barrels'){ const t=15.6+(96-f.rat)*.09+gauss()*.18+(r()<.09?5:0); f.r.push({t:+t.toFixed(2)}); }
    else { const st=EV.draw[EV.round][1], p=clamp(.42+(f.rat-88)*.035-(st-92)*.03,.12,.8); if(r()<p) f.r.push({s:+(82+(f.rat-88)*.55+(st-88)*.6+gauss()*1.6).toFixed(1)}); else f.r.push({s:null}); } }
  void out; }

/* ---------- a ride: eight seconds, balance against what the animal does ---------- */
function newRide(ev,stock){ const rng=mulberry32(Math.floor((EV&&EV.rng?EV.rng():Math.random())*1e9)), len=10; /* from the event's seed, so everyone in an online battle gets the same trip */ RD={kind:'ride',ev,stock,script:ev==='bull'?bullScript(stock.style,stock.rat,rng,len):broncScript(stock.rat,rng,len),t:-1.6,o:[0,0],v:[0,0],yaw:0,out:false,done:false,dq:null,mark:ev==='bronc'?null:true,spurs:0,spurGood:0,jumps:0,ctrl:0,ctrlN:0,fat:0,arm:.8,cue:null,bx:0,bz:0,score:null,msg:null,msgT:0,lean:[0,0],tilt:[0,0]}; sfx.snort(); }
function curMove(t){ const s=RD.script; for(let i=s.length-1;i>=0;i--) if(s[i].t<=t) return s[i]; return null; }
function rideStep(dt){ const r=RD; r.t+=dt; if(r.msgT>0) r.msgT-=dt; if(r.t<0) return; if(r.out||r.done){ r.after=(r.after||0)+dt; if(r.after>3.2) rideOver(); return; }
  if(r.t<dt*1.5){ sfx.gate(); sfx.crowd(.2); }
  const m=curMove(r.t); let ax=0, az=0, yaw=0; if(m){ const M=MOVES[m.k], tau=r.t-m.t; if(tau<m.d){ const k=tau/m.d*M.d; ax=sampleK(M.ax,k)*m.i; az=(M.az?M.az*m.i:0)+sampleK(M.az2,k)*m.i; yaw=(M.yaw||0)*m.i; if(Math.abs(ax)>.7&&!r.stompT){ sfx.stomp(Math.abs(ax)); r.stompT=.25; } } }
  if(r.stompT>0) r.stompT-=dt; else r.stompT=0;
  /* the tell: the head drops before a kick, turns before a spin */ const nx=RD.script.find(q=>q.t>r.t); r.cue=nx&&nx.t-r.t<MOVES[nx.k].tell+.12?nx.k:null;
  r.yaw+=yaw*dt; /* the bull moves around the arena a little */ r.bx+=Math.sin(r.yaw)*dt*.6; r.bz+=Math.cos(r.yaw)*dt*.6; r.bx=clamp(r.bx,-8,8); r.bz=clamp(r.bz,-4,10);
  /* the rider: legs and the bull rope pull you back to centre, fatigue weakens them, leaning fights the forces */ const L=[(held(['KeyW','ArrowUp'])?1:0)-(held(['KeyS','ArrowDown'])?1:0),(held(['KeyD','ArrowRight'])?1:0)-(held(['KeyA','ArrowLeft'])?1:0)]; r.lean[0]=lerp(r.lean[0],L[0],dt*9); r.lean[1]=lerp(r.lean[1],L[1],dt*9);
  r.fat=Math.min(1,r.fat+dt*(.05+Math.hypot(ax,az)*.04)); const kp=6.2*(1-r.fat*.3), kd=3.1, G=9.6*(.85+(r.stock.rat-88)*.02);
  for(const i of [0,1]){ const f=i?az:ax; const acc=f*G-kp*r.o[i]-kd*r.v[i]+r.lean[i]*5.2; r.v[i]+=acc*dt; r.o[i]+=r.v[i]*dt; }
  /* the free hand: if you get thrown sideways with it down, it slaps the animal */ if(Math.abs(r.o[1])>.78&&Math.abs(r.v[1])>1.4&&!r.dq&&Math.random()<dt*3){ r.dq='touched the bull with his free hand'; msg('Free hand touched: no score','#f87171',2); }
  const off=Math.hypot(r.o[0],r.o[1]); r.ctrl+=off; r.ctrlN++; r.tilt=[r.o[0],r.o[1]];
  if(off>1){ r.out=true; r.after=0; sfx.fall(); SV.falls++; saveSV(); msg(r.t<8?`Bucked off at ${r.t.toFixed(2)} s`:'Off after the whistle','#f87171',2.4); speak('He\'s down!',true); return; }
  /* broncs: mark him out on the first jump, then spur in rhythm */ if(r.ev==='bronc'){ if(m){ const ph=(r.t-m.t)/m.d; if(ph<.05&&!m.counted){ m.counted=1; r.jumps++; } } if(r.mark===null&&r.t>.75){ r.mark=false; msg('Missed him out: no score','#f87171',2); } }
  if(r.t>=8){ r.done=true; r.after=0; sfx.buzzer(); sfx.cheer(); speak('Eight seconds!',true); } }
function spur(){ const r=RD; if(!r||r.kind!=='ride'||r.out||r.done||r.t<0) return; sfx.spur(); r.spurs++;
  if(r.ev==='bronc'&&r.mark===null){ if(r.t<.75){ r.mark=true; msg('Marked out!','#86efac',1); } return; }
  const m=curMove(r.t); if(!m) return; const ph=(r.t-m.t)/m.d; if(ph>.18&&ph<.48&&!m.spurred){ m.spurred=1; r.spurGood++; } }
function rideOver(){ const r=RD; if(r.score!=null) return; let total=null, rider=0, bull=0; const qual=r.done&&!r.out||r.done;
  bull=clamp(16.5+(r.stock.rat-86)*.45+r.script.filter(q=>q.t<8).reduce((a,q)=>a+q.i,0)/12*1.6,14,24);
  if(qual&&!r.dq&&r.mark!==false){ const ctrl=1-clamp(r.ctrl/r.ctrlN,0,1)*1.15, sp=r.ev==='bronc'?clamp(r.spurGood/Math.max(1,r.jumps),0,1):clamp(r.spurGood/8,0,1)*.6+.4; rider=clamp(14+9.5*(.62*ctrl+.38*sp),11,23.8); total=Math.round((rider+bull)*2*10)/10; }
  r.score=total; r.parts={rider,bull}; if(total!=null){ SV.rides++; if(total>SV.best[r.ev]) SV.best[r.ev]=total; } saveSV(); EV.me.push(total==null?{s:null}:{s:total}); fieldGo(); goOver(); }
function msg(t,col,d){ const o=RD||{}; o.msg={t,col}; o.msgT=d||1.4; }

/* ---------- barrel racing: run the cloverleaf ---------- */
function newBarrels(){ RD={kind:'barrels',x:0,z:-14,h:0,v:0,t:null,tm:0,started:false,fin:null,b:0,turns:[0,0,0],dir:null,lastA:null,tipped:[0,0,0],pen:0,broke:false,ph:0,msg:null,msgT:0}; }
function barrelStep(dt){ const r=RD; r.tm+=dt; if(r.msgT>0) r.msgT-=dt; if(r.fin!=null||r.broke){ r.after=(r.after||0)+dt; r.v*=1-dt*1.5; r.x+=Math.sin(r.h)*r.v*dt; r.z+=Math.cos(r.h)*r.v*dt; if(r.after>2.6) barrelOver(); return; }
  const go=held(['KeyW','ArrowUp']), wh=held(['KeyS','ArrowDown']), st=(held(['KeyD','ArrowRight'])?1:0)-(held(['KeyA','ArrowLeft'])?1:0);
  r.v=clamp(r.v+(go?8.5*(1-r.v/18):wh?-13:-1.2)*dt,0,16.5); const maxTurn=Math.min(4.2,14/Math.max(r.v,2.2)); r.h+=st*maxTurn*dt; r.x+=Math.sin(r.h)*r.v*dt; r.z+=Math.cos(r.h)*r.v*dt; r.ph+=dt*(2+r.v*.55); if(Math.floor(r.ph*2)!==Math.floor((r.ph-dt*(2+r.v*.55))*2)&&r.v>1) sfx.hoof();
  /* the fence */ if(Math.abs(r.x)>19){ r.x=Math.sign(r.x)*19; r.v*=.6; } if(r.z>48){ r.z=48; r.v*=.6; } if(r.z<-20) r.z=-20;
  /* the timer line */ if(!r.started&&r.z>=0){ r.started=true; r.t=0; sfx.buzzer(); } if(r.started) r.t+=dt;
  /* going round the barrels: count the angle swept round the one you're on */ if(r.b<3&&r.started){ const B=BARRELS[r.b], dx=r.x-B[0], dz=r.z-B[1], d=Math.hypot(dx,dz), a=Math.atan2(dz,dx);
    if(d<7.5){ if(r.lastA!=null){ let da=a-r.lastA; while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI; r.turns[r.b]+=da; } r.lastA=a;
      if(Math.abs(r.turns[r.b])>5.3){ const s=Math.sign(r.turns[r.b]); if(r.b===0) r.dir=s; else if(s!==-r.dir){ r.broke=true; msg('Broke the pattern: no time','#f87171',2.4); return; } r.b++; r.lastA=null; sfx.click(); msg(['Barrel one!','Barrel two!','Barrel three: run home!'][r.b-1],'#86efac',1); } }
    else r.lastA=null; }
  /* knocking a barrel over: five seconds */ BARRELS.forEach((B,i)=>{ if(!r.tipped[i]&&Math.hypot(r.x-B[0],r.z-B[1])<.62&&r.v>2.5){ r.tipped[i]=1; r.pen+=5; sfx.barrel(); msg('Tipped a barrel: +5','#f87171',1.6); } });
  if(r.b>=3&&r.z<0){ r.fin=r.t+r.pen; sfx.buzzer(); sfx.cheer(); speak(`${r.fin.toFixed(2)}`,true); } if(r.started&&r.t>40){ r.broke=true; } }
function barrelOver(){ const r=RD; if(r.done2) return; r.done2=1; const t=r.broke?null:r.fin; if(t!=null&&(SV.best.barrels==null||t<SV.best.barrels)) SV.best.barrels=+t.toFixed(2); saveSV(); EV.me.push({t:t==null?null:+t.toFixed(2)}); fieldGo(); goOver(); }

/* ---------- after each go: the standings; after the last, the buckle ---------- */
function goOver(){ phase='over'; const e=EV.ev, me={name:'You',nat:'',r:EV.me,me:1}, all=[me,...EV.field], agg=p=>{ if(e==='barrels'){ const ts=p.r.map(x=>x.t); return ts.some(x=>x==null)?null:ts.reduce((a,b)=>a+b,0); } const ss=p.r.map(x=>x.s).filter(x=>x!=null); return {n:ss.length,s:ss.reduce((a,b)=>a+b,0)}; };
  const rows=all.map(p=>({p,a:agg(p)})).sort((A,B)=>e==='barrels'?((A.a??1e9)-(B.a??1e9)):(B.a.n-A.a.n||B.a.s-A.a.s)), pos=rows.findIndex(q=>q.p.me)+1, last=EV.round+1>=EV.rounds, cur=EV.me[EV.me.length-1];
  if(last&&pos===1){ SV.wins++; if(EV.rounds>1) SV.buckles++; saveSV(); }
  const curTxt=e==='barrels'?(cur.t==null?'No time':`${cur.t.toFixed(2)} s`):(cur.s==null?(RD.out?`Bucked off at ${Math.min(8,RD.t).toFixed(2)}`:RD.dq?'No score: '+RD.dq:RD.mark===false?'No score: missed him out':'No score'):`${cur.s} points (rider ${(RD.parts.rider*2).toFixed(1)}, ${e==='bull'?'bull':'horse'} ${(RD.parts.bull*2).toFixed(1)})`);
  $('resultIn').innerHTML=`<h2>${last?(pos===1?'🏆 You win the buckle!':`${ordinal(pos)} in the event`):`Round ${EV.round+1} done`}</h2><div class="rs">${curTxt}</div><p>${EVN[e]}${EV.draw[EV.round]?' · '+esc(EV.draw[EV.round][0]):''}</p>
   <table class="ls"><tr><th>#</th><th>${e==='barrels'?'Cowgirl':'Cowboy'}</th>${EV.me.map((x,i)=>`<th>R${i+1}</th>`).join('')}<th>${e==='barrels'?'Average':'Total'}</th></tr>${rows.slice(0,10).map((q,i)=>`<tr${q.p.me?' style="background:rgba(255,209,102,.2)"':''}><td>${i+1}</td><td style="text-align:left">${esc(q.p.name)} ${q.p.nat||''}</td>${q.p.r.map(x=>`<td>${e==='barrels'?(x.t==null?'NT':x.t.toFixed(2)):(x.s==null?'-':x.s)}</td>`).join('')}<td>${e==='barrels'?(q.a==null?'-':(q.a/q.p.r.length).toFixed(2)):(q.a.n?q.a.s.toFixed(1):'-')}</td></tr>`).join('')}</table>
   <p>${last?'Enter for the menu, R to enter again.':'Enter for the next round.'}</p>`;
  EV.next=!last; setTimeout(()=>{ if(phase==='over') $('result').classList.remove('hidden'); },500); }
const ordinal=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:n%10]||'th');

/* ---------- the loop ---------- */
function step(dt){ if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('on'); } if(bannerT>0&&!paused){ bannerT-=dt; if(bannerT<=0) $('banner').classList.remove('on'); }
  if(!RD||paused||phase!=='play') return; const n=3; for(let i=0;i<n&&phase==='play';i++){ if(RD.kind==='ride') rideStep(dt/n); else barrelStep(dt/n); } }

/* ---------- HUD ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'); cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
function hudText(t,x,y,size=18,col='#fff',align='left'){ ctx.font=`800 ${size}px 'Big Shoulders Display','Arial Narrow',sans-serif`; ctx.textAlign=align; ctx.lineWidth=Math.max(3,size/6); ctx.strokeStyle='rgba(0,0,0,.7)'; ctx.strokeText(t,x,y); ctx.fillStyle=col; ctx.fillText(t,x,y); }
function rr(x,y,w,h,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }
function drawHUD(){ const r=RD;
  if(r.kind==='ride'){ rr(16,14,300,70,12,'rgba(5,10,24,.82)'); hudText(r.t<0?'In the chute...':`${Math.min(8,Math.max(0,r.t)).toFixed(2)} s`,28,50,32,r.t>=8?'#86efac':'#fff'); hudText(`${r.stock.name} · ${r.ev==='bull'?'bull':'bronc'} ${r.stock.rat}`,28,74,14,'#cbd5e1');
    /* the balance ring: keep the dot in the middle */ const cx=W-110, cy=152, R0=80; rr(cx-R0-12,cy-R0-12,(R0+12)*2,(R0+12)*2+50,14,'rgba(5,10,24,.8)'); ctx.strokeStyle='#ef4444'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,cy,R0,0,7); ctx.stroke(); ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(cx,cy,R0*.5,0,7); ctx.stroke();
    const off=Math.hypot(r.o[0],r.o[1]); ctx.fillStyle=off<.5?'#22c55e':off<.8?'#fde047':'#ef4444'; ctx.beginPath(); ctx.arc(cx+r.o[1]*R0,cy-r.o[0]*R0,9,0,7); ctx.fill(); hudText('Balance',cx,cy+R0+22,13,'#cbd5e1','center');
    rr(W-162,cy+R0+34,136,10,5,'rgba(255,255,255,.15)'); rr(W-162,cy+R0+34,136*(1-r.fat),10,5,'#38bdf8'); hudText('Grip',W-192,cy+R0+44,12,'#cbd5e1');
    if(assist&&r.cue&&r.cue!=='jump'&&!r.out&&!r.done){ const t={kick:'KICK: lean back (S)',drop:'DROP: lean back (S)',rear:'REAR: lean forward (W)',spinL:'SPIN LEFT: lean in (A)',spinR:'SPIN RIGHT: lean in (D)',belly:'BELLY ROLL: ride it out',jump:'Jump'}[r.cue]; hudText(t,W/2,H-60,26,'#fde047','center'); }
    if(r.ev==='bronc'&&r.mark===null&&r.t>-.4) hudText('Mark him out: SPACE now!',W/2,150,28,'#fde047','center');
    if(r.ev==='bronc'&&r.t>.8&&!r.done&&!r.out) hudText(`Spurs in rhythm: SPACE at the top of each jump (${r.spurGood}/${r.jumps})`,W/2,H-24,15,'#cbd5e1','center'); }
  else { rr(16,14,300,70,12,'rgba(5,10,24,.82)'); hudText(r.started?`${(r.t+r.pen).toFixed(2)} s`:'Ready...',28,50,32,'#fff'); hudText(`${(r.v*3.6).toFixed(0)} km/h · barrel ${Math.min(3,r.b+1)}${r.pen?` · +${r.pen}`:''}`,28,74,14,'#cbd5e1');
    const mx=W-190, my=52, sc=3.6; rr(mx-10,my-6,170,250,10,'rgba(5,10,24,.8)'); const P=(x,z)=>[mx+75+x*sc,my+230-(z+14)*sc]; BARRELS.forEach((B,i)=>{ const q=P(...B); ctx.fillStyle=r.tipped[i]?'#ef4444':i<r.b?'#64748b':'#facc15'; ctx.beginPath(); ctx.arc(q[0],q[1],5,0,7); ctx.fill(); }); ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.moveTo(...P(-6,0)); ctx.lineTo(...P(6,0)); ctx.stroke(); const q=P(r.x,r.z); ctx.fillStyle='#38bdf8'; ctx.beginPath(); ctx.arc(q[0],q[1],5,0,7); ctx.fill();
    if(r.tm<5) hudText('W gallop · S whoa · A / D steer · round each barrel, right first or left first, then home',W/2,H-24,15,'#cbd5e1','center'); }
  if(r.msg&&r.msgT>0) hudText(r.msg.t,W/2,120,30,r.msg.col,'center'); }
function draw(){ ctx.clearRect(0,0,W,H); if(view3) render3D(frameDtG); if(!RD||phase==='menu'){ if(!view3){ ctx.fillStyle='#3b2a1a'; ctx.fillRect(0,0,W,H); } return; } if(!view3){ ctx.fillStyle='#5b4329'; ctx.fillRect(0,0,W,H); } drawHUD(); }

/* ---------- board, toasts ---------- */
let toastT=0, bannerT=0;
const setText=(id,t)=>{ const e=$(id); if(e&&e.textContent!==String(t)) e.textContent=t; };
const badgeR=col=>svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${col}"/><path d="M22 58 Q50 36 78 58 L70 62 Q50 50 30 62 Z" fill="#7c4a1e"/><rect x="36" y="38" width="28" height="18" rx="6" fill="#7c4a1e"/></svg>`);
function updateBoard(){ $('logoL').src=badgeR('#b45309'); setText('nameL','You'); $('logoR').src=badgeR('#1e3a8a');
  const e=EV?EV.ev:evSel; setText('tpL',EVN[e]); setText('scoreL',e==='barrels'?(SV.best.barrels?SV.best.barrels.toFixed(2):'-'):(SV.best[e]||'-')); const top=RIDERS[e][0]; setText('nameR',top[0]); setText('tpR',top[1]); setText('scoreR','');
  setText('cntT','Rodeo'); setText('innT',EVN[e]); setText('outsT',EV?`Round ${EV.round+1}/${EV.rounds}`:''); setText('basesT',''); }

function makeR3(glc,stage){

  { const c=ccv.getContext('2d'); c.textAlign='center'; c.textBaseline='middle'; c.font='900 104px "Arial Black",Impact,sans-serif'; c.lineJoin='round';

  function crowdRow(g,c,a,b,y,depth,rows,seat){

  const r=RD, f=[Math.sin(r.h),Math.cos(r.h)]; let eye=camMode?[r.x-f[0]*5,3,r.z-f[1]*5]:[r.x+(r.x>0?-10:10),9,r.z-12], ctr=[r.x,1.2,r.z];
  if(!camE){ camE=eye; camC=ctr; } else { const k=Math.min(1,dt*3); for(let i=0;i<3;i++){ camE[i]=lerp(camE[i],eye[i],k); camC[i]=lerp(camC[i],ctr[i],k); } }

    for(const s of [-1,1]) R3.part(R3.UB,R3.mm(R3.T(s*6*K,.9*K,0),R3.S(.15*K,1.8*K,.15*K)),[.9,.2,.2]);
    const lean=Math.sin(r.ph*.5)*.05; const M=drawHorse(r.x,r.z,r.h,Math.sin(r.ph*2)*.05*Math.min(1,r.v/8),0,Math.abs(Math.sin(r.ph*2))*.12*Math.min(1,r.v/8),r.ph*2.2,[.42,.26,.14],r.v>2); drawRider(R3.mm(M,R3.T(0,.5*K,.05*K)),.25+lean,0,false,K,true); },dt); }

{ const _r=rideOver; rideOver=function(){ const r=_r.apply(this,arguments); try{ if(RD&&RD.score!=null){ lbPost(RD.ev,RD.score,RD.stock.name); lbPost('rides',1,RD.stock.name); } }catch(e){} return r; }; }
