function newG(){G={th:0,score:0,rec:[mkR(0),mkR(1),mkR(2),mkR(3)],ball:null,mx:500,my:300,msg:'',msgT:-9,tt:0,over:false,sp:[],defs:[{x:300,y:230,t:0},{x:700,y:400,t:0}]};V='game';render()}
function throwB(){const g=G;if(!g||g.over||g.ball)return;let best=null,bd=1e9;g.rec.forEach(r=>{const d=Math.hypot(r.x-g.mx,r.y-g.my);if(d<bd){bd=d;best=r}});if(!best||bd>60)return;g.ball={t:0,r:best,sx:500,sy:530,lead:.55};beep(300,.1,'sine',.06)}
function step(dt){const g=G;if(!g||g.over)return;g.tt+=dt;g.sp=g.sp.filter(p=>(p.l-=dt*2)>0);g.sp.forEach(p=>{p.x+=p.vx;p.y+=p.vy});
 g.rec.forEach(r=>{r.x+=r.dir*r.sp*dt;if(r.x<120){r.x=120;r.dir=1}if(r.x>880){r.x=880;r.dir=-1}r.y+=Math.sin(g.tt*1.2+r.ph)*dt*25;r.y=Math.min(500,Math.max(110,r.y))});
 g.defs.forEach((d,i)=>{const t=g.rec[(i*2+Math.floor(g.tt/4))%4];d.x+=(t.x-d.x)*dt*.5*DF[sv.diff][2];d.y+=(t.y-d.y)*dt*.5*DF[sv.diff][2]});
 if(g.ball){const b=g.ball;b.t+=dt/.7;if(b.t>=1){const r=b.r;const tx=r.x+r.dir*r.sp*.45,ty=r.y;const dx=Math.hypot(tx-b.ax,0);b.done=true}
  if(b.t>=1){const r=b.r,px=b.ax,py=b.ay;const d=Math.hypot(r.x-px,r.y-py);const R=36*DF[sv.diff][1];let pts=0;if(d<R*.3)pts=5;else if(d<R*.65)pts=3;else if(d<R)pts=1;const cov=g.defs.some(df=>Math.hypot(df.x-r.x,df.y-r.y)<26);if(cov&&pts>0){pts=0;g.msg='BROKEN UP'}else g.msg=pts?'+'+pts+(pts===5?' BULLSEYE':''):'INCOMPLETE';g.score+=pts;g.th++;g.msgT=g.tt;beep(pts?800:140,.15,pts?'triangle':'sawtooth',.07);if(pts)for(let i=0;i<10;i++)g.sp.push({x:r.x,y:r.y,vx:rnd(-3,3),vy:rnd(-3,3),l:1});g.ball=null;if(g.th>=10)fin()}}
 if(g.ball&&!g.ball.ax){const b=g.ball;b.ax=g.mx;b.ay=g.my}}
function fin(){const g=G;g.over=true;if(g.score>sv.best)sv.best=g.score;sv.runs++;sv_('qb1',sv);$('#ovl').innerHTML='<div class="ovl"><div class="box"><h2>'+(g.score>=30?'MVP performance!':g.score>=18?'Solid game':'Keep practicing')+'</h2><div class="big" style="font-size:44px">'+g.score+'</div><div class="tip" style="margin:10px 0">Best '+sv.best+' / 50</div><div style="display:grid;gap:8px"><button class="btn" data-a="go">Play again</button><button class="btn g" data-a="title">Menu</button></div></div></div>'}
document.addEventListener('pointermove',e=>{const cv=$('#cv');if(!cv||!G)return;const r=cv.getBoundingClientRect();G.mx=(e.clientX-r.left)*1000/r.width;G.my=(e.clientY-r.top)*560/r.height});
document.addEventListener('pointerdown',e=>{if(V==='game'&&e.target.id==='cv'){ac();const r=e.target.getBoundingClientRect();G.mx=(e.clientX-r.left)*1000/r.width;G.my=(e.clientY-r.top)*560/r.height;throwB()}});addEventListener('keydown',e=>{if(e.code==='Space'&&V==='game'){e.preventDefault();throwB()}});
function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d'),g=G;
 x.fillStyle='#14612a';x.fillRect(0,0,1000,560);for(let i=0;i<14;i++){x.fillStyle=i%2?'#18702f':'#14612a';x.fillRect(0,i*40,1000,40)}x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=2;for(let i=1;i<6;i++){x.beginPath();x.moveTo(0,i*90+20);x.lineTo(1000,i*90+20);x.stroke()}
 ath(x,500,552,80,{shirt:'#2f7fd0',helmet:'#1a2a5a',num:12,f:1,la:g.ball?2.5:1.0,ra:g.ball?1.7:1.3,sock:'#fff'});
 const R=36*DF[sv.diff][1];
 g.defs.forEach(d=>{const s=Math.sin(g.tt*9);ath(x,d.x,d.y+30,74,{shirt:'#d03a3a',helmet:'#7a1a1a',num:55,f:d.x<500?1:-1,la:.9,ra:-.9,ll:.5*s,rl:-.5*s,sock:'#fff'})});
 g.rec.forEach(r=>{[[R,'rgba(255,255,255,.22)'],[R*.65,'rgba(255,210,63,.3)'],[R*.3,'rgba(255,90,90,.45)']].forEach(c=>{x.fillStyle=c[1];x.beginPath();x.arc(r.x,r.y,c[0],0,7);x.fill()})});
 g.rec.forEach(r=>{const s=Math.sin(g.tt*9+r.ph);ath(x,r.x,r.y+30,74,{shirt:'#ffd23f',helmet:'#a07a10',shorts:'#2a2a2a',numc:'#222',num:80,f:r.dir,la:.6,ra:-.6,ll:.55*s,rl:-.55*s,sock:'#fff'})});
 x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(g.mx,g.my,10,0,7);x.moveTo(g.mx-16,g.my);x.lineTo(g.mx+16,g.my);x.moveTo(g.mx,g.my-16);x.lineTo(g.mx,g.my+16);x.stroke();
 if(g.ball){const b=g.ball,t=b.t,bx=b.sx+(b.ax-b.sx)*t,by=b.sy+(b.ay-b.sy)*t-Math.sin(t*Math.PI)*60;x.fillStyle='#8a4a1a';x.beginPath();x.ellipse(bx,by,9,5.5,.5,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=1;x.stroke()}
 x.fillStyle='#ffd23f';g.sp.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;
 x.fillStyle='rgba(8,5,26,.85)';x.beginPath();x.roundRect(300,10,400,48,12);x.fill();x.textAlign='center';x.fillStyle='#ffd23f';x.font='900 24px system-ui';x.fillText(g.score+' pts',400,43);x.fillStyle='#fff';x.font='800 18px system-ui';x.fillText('Throw '+Math.min(10,g.th+1)+'/10',600,42);
 if(g.tt-g.msgT<1.2&&g.msg){x.font='900 38px system-ui';x.lineWidth=7;x.strokeStyle='rgba(0,0,0,.7)';x.strokeText(g.msg,500,300);x.fillStyle='#ffd23f';x.fillText(g.msg,500,300)}}
function loop(){let last=performance.now();const f=now=>{const dt=Math.min(.03,(now-last)/1000||0);last=now;if(G){step(dt);draw()}if(V==='game')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
render();
