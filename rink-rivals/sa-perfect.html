<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2540;--tx:#eef3ff;--mut:#93a3c4;--ac:#ffd23f;--ac2:#3ddc97;--bad:#ff5d6c;--bd:#26344f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;padding:12px 14px 40px}
.wrap{max-width:980px;margin:0 auto}
h1{margin:4px 0 2px;font-size:26px;letter-spacing:.5px}
h1 span{color:var(--ac)}
.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card2);color:var(--tx);padding:9px 14px;border-radius:10px;font-weight:600}
button:hover{border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--ac);color:#111;border-color:var(--ac)}
button.big{background:var(--ac);color:#111;border-color:var(--ac);padding:12px 20px;font-size:16px}
button.sec{background:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}.draft{grid-template-columns:1fr!important}}
@media(max-width:420px){.g2,.g3,.g4{grid-template-columns:1fr}}
.mode{text-align:left;padding:14px;line-height:1.35}
.mode b{display:block;font-size:17px;margin-bottom:3px}
.mode small{color:var(--mut);font-weight:400}
.draft{display:grid;grid-template-columns:260px 1fr;gap:12px}
.slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--card2);margin-bottom:6px;min-height:42px;border:1px solid transparent}
.slot.open{border:1px dashed var(--bd);color:var(--mut)}
.slot .pos{font-weight:800;width:44px;color:var(--ac);font-size:13px}
.slot .nm{flex:1;font-weight:600;font-size:14px}
.slot .ov{font-weight:800}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:30px;padding:0 8px;border-radius:8px;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 2px #0008}
.reel{height:90px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;text-align:center;padding:0 10px;border:2px solid var(--ac);background:var(--card2);transition:background .1s}
.pl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:6px}
.pl .o{margin-left:auto;font-weight:800;font-size:17px}
.pl small{color:var(--mut);font-weight:500}
.tiles{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0}
.t{width:14px;height:14px;border-radius:3px;background:#243049}
.t.w{background:var(--ac2)}.t.l{background:var(--bad)}
.tiles.big .t{width:34px;height:34px;font-size:12px;display:flex;align-items:center;justify-content:center;color:#111;font-weight:800}
.res{text-align:center}
.res .rec{font-size:46px;font-weight:900;margin:4px 0}
.perfect{color:var(--ac)}
.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--mut);font-weight:600}
.attr{margin:10px 0}
.opt{text-align:left;padding:12px}
.opt b{display:block}.opt .v{font-size:22px;font-weight:900;color:var(--ac)}
.meter{height:12px;background:#243049;border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ac2)}
.meter.over i{background:var(--bad)}
select{font:inherit;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
input[type=text]{font:inherit;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%}
.hid{display:none}
.note{font-size:13px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pcard{border-radius:14px;padding:14px;border:1px solid var(--bd);background:linear-gradient(135deg,var(--card2),var(--card))}

 if(D.mode==='team'){
  return '<div class="card" style="max-height:60vh;overflow-y:auto">'+D.cur.t.p.map((p,i)=>{const used=D.used.has(D.cur.t.a+p[0]),ok=!used&&openIdx(p).length;return '<button class="pl" '+(ok?'':'disabled')+' data-a="takep" data-v="'+i+'"><span>'+p[0]+' <small>'+p[1]+(used?' (taken)':'')+'</small></span><span class="o">'+p[2]+'</span></button>'}).join('')+
  '<div class="note">Greyed out players do not fit an open spot.</div></div>';
 }
 const p=D.cur.p,o=openIdx(p),seen={};
 return '<div class="card"><div class="pcard"><div style="font-size:22px;font-weight:900">'+p[0]+'</div><div class="mut">'+D.cur.t.n+' · '+p[1]+' · overall <b style="color:var(--ac)">'+p[2]+'</b></div></div><div class="chips" style="margin-top:10px">'+

H.spin=()=>{if(D.busy||D.cur)return;runSpin()};
H.respin=()=>{if(D.busy||!D.cur||D.spins<1)return;D.spins--;D.cur=null;D.pend=null;runSpin()};
function runSpin(){
 D.busy=true;const sp=D.sp;let items,fin;
 if(D.mode==='team'){const ct=candTeams();fin={t:pick(ct)};items=()=>pick(DATA[sp]);}
 else{const cp=candPlayers();fin=pick(cp);items=()=>pick(allPlayers(sp));}
 const reel=$('#reel');document.querySelectorAll('button[data-a=spin],button[data-a=respin]').forEach(b=>b.disabled=true);
 let n=0,tot=22+rnd(6);
 (function tick(){
  if(n>=tot){D.cur=fin;D.busy=false;drawDraft();return}
  const it=items();const t=D.mode==='team'?it:it.t;
  reel.style.background=t.c;reel.innerHTML=D.mode==='team'?t.n:it.p[0]+'<br><span style="font-size:15px;font-weight:600">'+t.n+'</span>';
  n++;setTimeout(tick,45+n*n*0.55);
 })();
}
H.takep=i=>{const p=D.cur.t.p[+i],o=openIdx(p);const kinds=new Set(o.map(j=>D.slots[j].l));if(kinds.size>1){D.pend={p,opts:o};drawDraft()}else place(o[0],p)};
H.slotpick=i=>{const p=D.pend.p;D.pend=null;place(+i,p)};
H.cancelpend=()=>{D.pend=null;drawDraft()};
H.place=i=>place(+i,D.cur.p);
function place(i,p){
 const t=D.cur.t;D.slots[i].p=[p[0],p[1],p[2]];D.slots[i].p.t=t.a;D.used.add(t.a+p[0]);D.cur=null;D.pend=null;
 if(D.slots.every(s=>s.p)){const sl=D.slots.map(s=>({k:s.k,l:s.l,w:s.w,p:s.p}));finishDraft(sl)}else drawDraft()
}
function finishDraft(sl){
 const sp=D.sp,c=CFG[sp],R=rating(sp,sl),res=simSeason(sp,R),wins=res.reduce((a,b)=>a+b,0),losses=c.g-wins,perfect=losses===0;
 const st=stOf(sp);st.runs++;if(perfect)st.perf++;st.best=Math.max(st.best,wins);st.bestR=Math.max(st.bestR,+R.toFixed(1));save();
 SIM={sp,sl,R,res,shown:0,wins,losses,perfect,odds:perfOdds(sp,R)};
 const ev=sl.map(s=>s.p);
 let h='<div class="card res"><div class="mut">Team rating '+R.toFixed(1)+' · estimated perfect-season odds '+fmtP(SIM.odds)+'</div><div class="rec" id="rec">0-0</div><div id="verdict" class="mut">Playing the season...</div><div class="tiles'+(c.g<=20?' big':'')+'" id="tiles">'+res.map(()=>'<div class="t"></div>').join('')+'</div><div class="bar" style="justify-content:center"><button data-a="skip" id="skip">Skip to the end</button></div></div>';
 h+='<div class="card"><b>Your team</b><table>'+sl.map(s=>'<tr><td>'+s.l+'</td><td>'+badge(sp,s.p.t)+' '+s.p[0]+'</td><td>'+s.p[2]+'</td></tr>').join('')+'</table></div>';
 $('#view').innerHTML=h;
 const tiles=document.querySelectorAll('#tiles .t');const per=Math.max(8,Math.min(120,4500/c.g));
 SIM.timer=setInterval(()=>{if(SIM.shown>=res.length){endSim();return}revealTo(SIM.shown+1)},per);
}
function revealTo(n){
 const tiles=document.querySelectorAll('#tiles .t');if(!tiles.length)return;
 for(let i=SIM.shown;i<n;i++){tiles[i].className='t '+(SIM.res[i]?'w':'l');if(SIM.sp==='nfl')tiles[i].textContent=i+1}
 SIM.shown=n;const w=SIM.res.slice(0,n).reduce((a,b)=>a+b,0);$('#rec').textContent=w+'-'+(n-w);
}
H.skip=()=>{if(!SIM)return;clearInterval(SIM.timer);revealTo(SIM.res.length);endSim()};
function endSim(){
 clearInterval(SIM.timer);if(SIM.done)return;SIM.done=true;const c=CFG[SIM.sp];
 $('#rec').className='rec'+(SIM.perfect?' perfect':'');
 $('#verdict').innerHTML=SIM.perfect?'<b class="perfect" style="font-size:20px">PERFECT SEASON! '+c.nick+'!</b>':(SIM.losses+(SIM.losses===1?' loss':' losses')+'. So close to '+c.nick+'.');
 $('#skip').parentNode.innerHTML='<button class="big" data-a="again">Play again</button><button data-a="copyres">Copy result</button><button class="sec" data-a="mode" data-v="draft">Menu</button>';
}

function career(sp,ov){
 const seasons=[];let titles=0,mvps=0;
 for(let y=0;y<5;y++){
  const o=ov-3+y*1.2+rn()*2.2,d=o-70;let line;
  if(sp==='nfl')line=Math.round(3200+d*105)+' yds, '+Math.round(22+d*1.25)+' TD, '+Math.max(3,Math.round(16-d*.4))+' INT';
  else if(sp==='nba')line=(11+d*.7).toFixed(1)+' pts, '+(3.5+d*.22).toFixed(1)+' reb, '+(3+d*.25).toFixed(1)+' ast';
  else if(sp==='nhl')line=Math.round(14+d*1.5)+' G, '+Math.round(22+d*1.9)+' A, '+Math.round(36+d*3.4)+' PTS';
  else line='.'+Math.round(240+d*3.5)+' avg, '+Math.round(14+d*1.5)+' HR, '+Math.round(50+d*2.2)+' RBI';
  const mvp=o>96.5&&Math.random()<.6,ring=o>92&&Math.random()<.45+(o-92)*.06;
  if(mvp)mvps++;if(ring)titles++;
  seasons.push({y:y+1,line,mvp,ring})}
 return {seasons,titles,mvps};
}

let GM=null;
function gmStart(){
 const c=CFG[SPORT];GM={sp:SPORT,sel:c.slots.map(()=>-1),leg:0,pool:null};
 const all=allPlayers(SPORT);GM.pool=c.slots.map(s=>all.filter(x=>fits(SPORT,s[0],x.p[1])).sort((a,b)=>b.p[2]-a.p[2]));

}
function gmState(){const c=CFG[GM.sp];let used=0,a=0,w=0,names=new Set(),dup=false,full=true;
 GM.sel.forEach((v,i)=>{if(v<0){full=false;return}const x=GM.pool[i][v];used+=cost(x.p[2]);a+=c.slots[i][2]*x.p[2];w+=c.slots[i][2];const key=x.t.a+x.p[0];if(names.has(key))dup=true;names.add(key)});
 return {used,R:w?a/w:0,dup,full,over:used>c.cap}}
function drawGM(){
 const c=CFG[GM.sp],s=gmState();
 let h='<div class="card"><b>GM Mode: '+c.n+'</b><div class="note" style="margin:6px 0">Stars cost more. Build the best team you can under the salary cap, then play a best-of-7 against a legendary team.</div>'+
 '<div class="meter'+(s.over?' over':'')+'"><i style="width:'+Math.min(100,s.used/c.cap*100)+'%"></i></div><div style="margin-top:4px"><b>Payroll '+s.used+' / '+c.cap+'</b> <span class="mut">· team rating '+(s.R?s.R.toFixed(1):'--')+'</span></div></div><div class="card grid g2">';
 c.slots.forEach((sl,i)=>{h+='<div><div class="note">'+sl[1]+'</div><select data-gm="'+i+'"><option value="-1">Choose a player...</option>'+GM.pool[i].map((x,j)=>'<option value="'+j+'"'+(GM.sel[i]===j?' selected':'')+'>'+x.p[0]+' ('+x.t.a+') '+x.p[2]+' · $'+cost(x.p[2])+'</option>').join('')+'</select></div>'});
 h+='</div><div class="card"><b>Pick your opponent</b><div class="chips" style="margin-top:8px">'+c.legends.map((l,i)=>'<button class="'+(GM.leg===i?'on':'')+'" data-a="gleg" data-v="'+i+'">'+l[0]+' ('+l[1]+')</button>').join('')+'</div>'+
 '<div class="bar"><button class="big" data-a="gplay" '+(s.full&&!s.over&&!s.dup?'':'disabled')+'>Play the series</button></div><div class="note">'+(s.dup?'You picked the same player twice.':s.over?'Over the cap.':!s.full?'Fill every spot to play.':'')+'</div></div><div id="gres"></div>';
 $('#view').innerHTML=h;
}

};

function guessStart(){
 const b=ST.gs[SPORT]||0;
 $('#view').innerHTML='<div class="card"><b>Guess That Player</b><div class="note" style="margin:6px 0">You see the logos of the teams a player has played for, one at a time. Name him before you run out of clues. 8 rounds. Fewer clues means more points, and streaks add bonus points.</div><div>Best score here: <b>'+b+'</b></div><div class="bar"><button class="big" data-a="gstart">Start</button></div></div>';
}
H.gstart=()=>{GS={sp:SPORT,round:0,score:0,streak:0,list:clues(SPORT).sort(()=>Math.random()-.5).slice(0,8)};gRound()};
function gRound(){
 const g=GS;if(g.round>=g.list.length){const b=ST.gs[g.sp]||0;if(g.score>b)ST.gs[g.sp]=g.score;save();$('#view').innerHTML='<div class="card res"><div class="mut">Final score</div><div class="rec perfect">'+g.score+'</div><div>'+(g.score>b?'New best!':'Best: '+b)+'</div><div class="bar" style="justify-content:center"><button class="big" data-a="gstart">Play again</button></div></div>';return}
 const cur=g.list[g.round],all=clues(g.sp).filter(x=>x.n!==cur.n).sort(()=>Math.random()-.5).slice(0,3);
 g.cur=cur;g.shown=1;g.done=false;g.ch=all.concat([cur]).sort(()=>Math.random()-.5).map(x=>x.n);drawG();
}
function drawG(){
 const g=GS,cur=g.cur;
 $('#view').innerHTML='<div class="card"><div class="mut">Round '+(g.round+1)+' of '+g.list.length+' · Score '+g.score+' · Streak '+g.streak+'</div><div class="chips" style="margin:12px 0;min-height:40px">'+cur.t.slice(0,g.shown).map(t=>badge(g.sp,t)).join('')+'</div>'+
 (g.done?'':'<div class="bar"><button data-a="gclue" '+(g.shown>=cur.t.length?'disabled':'')+'>Reveal another team ('+g.shown+'/'+cur.t.length+')</button></div>')+
 '<div class="grid g2" style="margin-top:8px">'+g.ch.map(n=>'<button '+(g.done?'disabled':'')+' data-a="gans" data-v="'+n.replace(/"/g,'&quot;')+'" style="'+(g.done&&n===cur.n?'background:var(--ac2);color:#111':'')+'">'+n+'</button>').join('')+'</div>'+
 (g.done?'<div style="margin-top:10px"><b>'+g.msg+'</b></div><div class="bar"><button class="big" data-a="gnext">Next</button></div>':'')+'</div>';
}
H.gclue=()=>{if(GS.shown<GS.cur.t.length){GS.shown++;drawG()}};
H.gans=v=>{const g=GS;if(g.done)return;g.done=true;if(v===g.cur.n){const pts=Math.max(20,100-(g.shown-1)*20)+g.streak*10;g.score+=pts;g.streak++;g.msg='Correct! +'+pts}else{g.streak=0;g.msg='Not quite. It was '+g.cur.n+'.'}g.shown=g.cur.t.length;drawG()};
H.gnext=()=>{GS.round++;gRound()};
// ---------- STATS
function statsView(){
 let h='<div class="card"><b>Undefeated challenge records</b><table><tr><th>Sport</th><th>Seasons</th><th>Perfect</th><th>Best wins</th><th>Best rating</th></tr>'+
 Object.keys(CFG).map(k=>{const s=stOf(k);return '<tr><td>'+CFG[k].n+' '+CFG[k].nick+'</td><td>'+s.runs+'</td><td>'+(s.perf?'<b class="perfect">'+s.perf+'</b>':0)+'</td><td>'+s.best+'/'+CFG[k].g+'</td><td>'+(s.bestR||'--')+'</td></tr>'}).join('')+'</table></div>'+
 '<div class="card"><b>GM Mode</b><div class="mut">Series won '+ST.gm.w+' · lost '+ST.gm.l+'</div></div>'+
 '<div class="card"><b>Guess That Player best scores</b><div class="mut">'+Object.keys(CFG).map(k=>CFG[k].n+' '+(ST.gs[k]||0)).join(' · ')+'</div></div>'+(savedCards()||'<div class="card note">Players you build will show up here.</div>')+
 '<div class="bar"><button class="sec" data-a="reset">Reset my stats</button></div>';
 $('#view').innerHTML=h;
}
H.reset=()=>{if(confirm('Erase all your saved stats and players?')){ST={st:{},builds:[],gm:{w:0,l:0,best:{}},gs:{}};save();statsView()}};
shell();
