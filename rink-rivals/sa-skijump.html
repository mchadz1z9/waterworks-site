 $('#ovl').innerHTML='<div class="ovl"><div class="box"><h2>Competition result</h2><div class="big" style="font-size:44px">'+(w?'🥇 WIN':['🥇','🥈','🥉','4th'][ord.findIndex(o=>o[1]===0)])+'</div><table style="margin:10px 0">'+ord.map((o,i)=>'<tr style="'+(o[1]===0?'color:var(--gold);font-weight:800':'')+'"><td>'+(i+1)+'</td><td>'+g.names[o[1]]+'</td><td>'+g.sc[o[1]].map(j=>j.d.toFixed(0)+'m').join(' / ')+'</td><td>'+o[0].toFixed(1)+'</td></tr>').join('')+'</table><div style="display:grid;gap:8px"><button class="btn" data-a="start">Again</button><button class="btn g" data-a="title">Menu</button></div></div></div>'}
function act(){const g=G;if(!g||g.over)return;ac();if(g.ph==='ready'){g.ph='ramp';beep(400,.1,'sine',.06)}else if(g.ph==='ramp'){takeoff(true);g.tkAt=0}else if(g.ph==='air'){const gr=groundY(g.x),h=gr-g.y;const near=h<(sv.df===0?90:60);if(near&&g.lq===0){g.lq=clamp(1-h/(sv.df===0?90:60),.2,1);g.tkAt=g.air}else if(!near&&g.lq===0){g.lq=-1}}}
addEventListener('keydown',e=>{if(V!=='game')return;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(!KEYS[e.code]&&(e.code==='Space'||e.code==='Enter'))act();KEYS[e.code]=1});addEventListener('keyup',e=>{KEYS[e.code]=0});
document.addEventListener('pointerdown',e=>{const cv=$('#cv');if(!cv||e.target!==cv||!G)return;const r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/r.height,x=(e.clientX-r.left)/r.width;if(G.ph==='air'&&x<.25){KEYS.ArrowUp=1;setTimeout(()=>KEYS.ArrowUp=0,150)}else if(G.ph==='air'&&x>.75){KEYS.ArrowDown=1;setTimeout(()=>KEYS.ArrowDown=0,150)}else act()});
function jumper(x,px,py,ang,tuck){x.save();x.translate(px,py);x.rotate(ang);x.fillStyle='#e84a2c';x.fillRect(-14,-6,28,9);x.fillStyle='#f1c8a0';x.beginPath();x.arc(15,-8,6,0,7);x.fill();x.fillStyle='#1a8cff';x.beginPath();x.arc(15,-10,6.5,Math.PI,6.3);x.fill();x.restore();x.save();x.translate(px,py);x.rotate(ang*.55);x.fillStyle='#333';x.fillRect(-34,5,70,3);x.restore()}
function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d'),g=G;
 const sk=x.createLinearGradient(0,0,0,560);sk.addColorStop(0,'#5fa8ff');sk.addColorStop(1,'#dcefff');x.fillStyle=sk;x.fillRect(0,0,1000,560);
 const jx=(g.ph==='ready'||g.ph==='ramp')?-RL*.9+Math.min(1.1,g.s/RL)*RL*.9:g.x,camx=jx-340,camy=g.ph==='air'||g.ph==='land'?Math.max(0,g.y-150):0;
 x.fillStyle='#c8d9ee';for(let i=0;i<6;i++){x.beginPath();x.moveTo(i*220-(camx*.15)%220-100,340);x.lineTo(i*220-(camx*.15)%220+30,170+(i%3)*30);x.lineTo(i*220-(camx*.15)%220+160,340);x.fill()}
 x.save();x.translate(-camx,-camy);
 // hill landing slope
 x.fillStyle='#f4f8ff';x.beginPath();x.moveTo(0,groundY(0)+165);for(let X=0;X<=camx+1100;X+=40)x.lineTo(X,groundY(X)+165);x.lineTo(camx+1100,800);x.lineTo(0,800);x.fill();
 x.fillStyle='#e6eefb';x.beginPath();x.moveTo(0,groundY(0)+165);for(let X=0;X<=camx+1100;X+=40)x.lineTo(X,groundY(X)+165);x.lineTo(camx+1100,groundY(camx+1100)+181);for(let X=camx+1100;X>=0;X-=40)x.lineTo(X,groundY(X)+181);x.fill();
 // markers
 x.fillStyle='#e03a3e';x.font='700 13px system-ui';x.textAlign='center';[Math.round(K()*.7),K(),Math.round(K()*1.2)].forEach(m=>{const X=m/1.1/HILLS[sv.hill][2]*12;x.fillRect(X-2,groundY(X)+135,4,36);x.fillStyle=m===K()?'#e03a3e':'#445';x.fillText(m+'m',X,groundY(X)+125);x.fillStyle='#e03a3e'});
 // ramp (screen coords start at x=-300..)
 x.fillStyle='#8a6a3a';x.beginPath();x.moveTo(-RL*.9-60,150);x.lineTo(0,172);x.lineTo(0,186);x.lineTo(-RL*.9-60,166);x.fill();x.fillStyle='#6b4a2a';for(let i=0;i<10;i++)x.fillRect(-RL*.9-20+i*40,170+i*2.2,6,170-i*2);x.fillStyle='#fff';x.fillRect(-RL*.9-60,150,RL*.9+60,3);
 // jumper position
 let px,py,ang;if(g.ph==='ready'||g.ph==='ramp'){const m=g.s/RL;px=-RL*.9+Math.min(1.1,m)*RL*.9;py=154+Math.min(1,m)*18;ang=.05}else{px=g.x;py=g.y+160;ang=g.ang*1.0}
 g.tr.forEach((t,i)=>{x.globalAlpha=i/g.tr.length*.25;x.fillStyle='#fff';x.fillRect(t[0],t[1]+162,3,3)});x.globalAlpha=1;
 jumper(x,px,py,ang);
 g.fx.forEach(f=>{x.globalAlpha=Math.max(0,f.l);x.fillStyle=f.c;x.fillRect(f.x,f.y+165,4,4)});x.globalAlpha=1;
 x.restore();
 // HUD
 x.textAlign='center';x.fillStyle='rgba(8,18,40,.85)';x.beginPath();x.roundRect(380,10,240,52,12);x.fill();x.fillStyle='#ffd23f';x.font='900 28px system-ui';x.fillText(g.ph==='air'||g.ph==='land'?(Math.max(0,g.x/12*1.1*HILLS[sv.hill][2])).toFixed(1)+' m':'--',500,44);
 x.fillStyle='rgba(8,18,40,.8)';x.beginPath();x.roundRect(20,10,190,56,12);x.fill();x.fillStyle='#fff';x.font='700 13px system-ui';x.fillText('Jump '+(g.rnd+1)+' of 2 · '+HILLS[sv.hill][0],115,30);x.fillStyle=Math.abs(g.wind)>2.5?'#ff9a5a':'#9fe8b4';x.fillText('Wind '+(g.wind<0?'←':'→')+' '+Math.abs(g.wind).toFixed(1)+' m/s',115,52);
 if(g.ph==='ramp'||g.ph==='ready'){const bx=300,by=500,w=400;x.fillStyle='rgba(8,18,40,.85)';x.beginPath();x.roundRect(bx-10,by-30,w+20,56,12);x.fill();x.fillStyle='#fff';x.font='700 12px system-ui';x.fillText(g.ph==='ready'?'Press SPACE to start your run':'Press SPACE in the GREEN zone to take off!',500,by-12);const zoneW=sv.df===0?.22:sv.df===1?.14:.1;x.fillStyle='#e8472c';x.fillRect(bx,by,w,14);x.fillStyle='#3ddc84';x.fillRect(bx+w*(.97-zoneW),by,w*zoneW*2,14);x.fillStyle='#fff';x.fillRect(bx+Math.min(1,g.s/RL)*w*.9+0*w-3,by-6,6,26)}
 if(g.ph==='air'){const bx=40,by=130,h=260;x.fillStyle='rgba(8,18,40,.85)';x.beginPath();x.roundRect(bx-12,by-24,56,h+48,12);x.fill();x.fillStyle='#e8472c';x.fillRect(bx,by,22,h);const band=sv.df===0?.22:sv.df===1?.14:.09;const lo=.42-band,hi=.42+band,ym=a=>by+h*(1-(a+.2)/1.15);x.fillStyle='#3ddc84';x.fillRect(bx,ym(hi),22,ym(lo)-ym(hi));x.fillStyle='#fff';x.fillRect(bx-6,ym(g.ang)-3,34,6);x.font='700 10px system-ui';x.fillText('ANGLE',bx+11,by-8);x.fillText('W / S',bx+11,by+h+16)}
 if(g.ph==='air'&&g.lq===0){const gr=groundY(g.x),h=gr-g.y;if(h<(sv.df===0?90:60)){x.fillStyle='rgba(8,18,40,.85)';x.beginPath();x.roundRect(370,480,260,34,10);x.fill();x.fillStyle='#ffd23f';x.font='800 15px system-ui';x.fillText('PRESS SPACE FOR TELEMARK!',500,502)}}
 if(g.t-g.msgT<1.8&&g.msg){x.font='900 40px system-ui';x.lineWidth=8;x.strokeStyle='rgba(0,0,0,.6)';x.strokeText(g.msg,500,140);x.fillStyle='#ffd23f';x.fillText(g.msg,500,140)}}
function loop(){let last=performance.now();const f=now=>{const dt=Math.min(.033,(now-last)/1000||0);last=now;if(G){step(dt);draw()}if(V==='game')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
