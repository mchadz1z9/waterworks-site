 else h+='<canvas id="cv" width="1000" height="560"></canvas><div id="ovl"></div>';
 $('#app').innerHTML=h;if(V==='game')loop()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;ac();const a=b.dataset.a;if(a==='go')newG();else if(a==='lv'){sv.lv=(sv.lv+1)%4;sv_('bx1',sv);render()}else if(a==='diff'){sv.diff=(sv.diff+1)%3;sv_('bx1',sv);render()}else if(a==='title'){V='title';render()}});
function newG(){const o=OPP[sv.lv%4];const dm=[.7,1,1.3][sv.diff];G={o,php:100,ohp:o.hp,pst:100,rd:1,rt:90,t:0,pa:null,pt:0,oa:null,ot:0,ocd:1.2,lean:0,blk:false,msg:'',msgT:-9,sp:[],over:false,dm,sh:0,combo:0,dodged:0,pf:0,of:0}; V='game';render()}
function jab(){const g=G;if(!g||g.over||g.pa||g.pst<8)return;g.pa='jab';g.pt=.28;g.pst-=8;g.pf=1}
function hook(){const g=G;if(!g||g.over||g.pa||g.pst<18)return;g.pa='hook';g.pt=.55;g.pst-=18;g.pf=1}
function hurtO(d){const g=G;const bl=g.oa==='blk';g.ohp-=bl?d*.2:d;g.sh=6;beep(bl?160:100,.1,'square',.08);for(let i=0;i<8;i++)g.sp.push({x:610,y:240,vx:rnd(-3,3),vy:rnd(-3,2),l:1});if(g.ohp<=0)fin(true)}
function hurtP(d){const g=G;const x=g.blk?d*.2:d;g.php-=x*G.dm;g.sh=g.blk?3:9;beep(90,.15,'sawtooth',.09);if(g.php<=0)fin(false)}
function fin(w){const g=G;g.over=true;if(w){sv.wins++;sv.ko++;sv.lv=Math.min(sv.lv+1,3)}sv_('bx1',sv);$('#ovl').innerHTML='<div class="ovl"><div class="box"><h2>'+(w?'KNOCKOUT!':'You were knocked out')+'</h2><div class="big" style="font-size:40px">'+(w?'YOU WIN':'TRY AGAIN')+'</div><div style="display:grid;gap:8px;margin-top:10px"><button class="btn" data-a="go">'+(w?'Next fight':'Rematch')+'</button><button class="btn g" data-a="title">Menu</button></div></div></div>'}
function step(dt){const g=G;if(!g||g.over)return;g.t+=dt;if(g.sh>0)g.sh-=dt*30;g.sp=g.sp.filter(p=>(p.l-=dt*2)>0);g.sp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12});
 if(g.msgT>g.t)g.msgT=-9;
 g.blk=!!(KEYS.Space)&&g.pst>0&&!g.pa;if(g.blk)g.pst-=dt*10;else g.pst=Math.min(100,g.pst+dt*(g.pa?4:16));
 g.lean=KEYS.KeyA||KEYS.ArrowLeft?-1:KEYS.KeyD||KEYS.ArrowRight?1:0;
 if(g.pa){g.pt-=dt;const hitAt=g.pa==='jab'?.14:.28;if(g.pf&&g.pt<=hitAt){g.pf=0;const d=g.pa==='jab'?5:13;const cb=g.oa==='stag';hurtO(cb?d*1.8:d);g.combo++;}if(g.pt<=0)g.pa=null}
 const sp=g.o.sp*[.8,1,1.2][sv.diff];
 if(g.oa===null){g.ocd-=dt*sp;if(g.ocd<=0){g.oa=Math.random()<.35?'hook':'jab';g.ot=g.oa==='jab'?.5:.8;g.of=1;g.tell=.3}}
 else if(g.oa==='jab'||g.oa==='hook'){g.ot-=dt;const hitAt=g.oa==='jab'?.2:.28;if(g.of&&g.ot<=hitAt){g.of=0;const dodged=g.lean!==0&&g.lean!==g.dlean;if(g.lean!==0){g.msg='DODGE!';g.msgT=g.t+1;g.dodged++;g.oa='stag';g.ot=.7;g.pf=0}else{hurtP(g.o.dm*(g.oa==='hook'?1.6:1));g.msg='';}}
  if(g.oa!=='stag'&&g.ot<=0){g.oa=null;g.ocd=rnd(.8,1.8)}}
 else if(g.oa==='stag'){g.ot-=dt;if(g.ot<=0){g.oa=null;g.ocd=rnd(.7,1.5)}}
 g.rt-=dt;if(g.rt<=0){const w=g.php/100>g.ohp/g.o.hp;fin(w)}}
addEventListener('keydown',e=>{if(V!=='game')return;KEYS[e.code]=1;if(e.code==='KeyJ')jab();if(e.code==='KeyK')hook();if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>{KEYS[e.code]=0});
document.addEventListener('mousedown',e=>{if(V==='game'&&e.target.id==='cv'){ac();if(e.button===2)hook();else jab()}});document.addEventListener('contextmenu',e=>{if(V==='game')e.preventDefault()});

function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d'),g=G;x.save();if(g.sh>0)x.translate(rnd(-g.sh,g.sh)/2,rnd(-g.sh,g.sh)/2);
 const bg=x.createRadialGradient(500,200,60,500,260,600);bg.addColorStop(0,'#3a2a5a');bg.addColorStop(1,'#0a0618');x.fillStyle=bg;x.fillRect(-10,-10,1020,580);
 for(let i=0;i<90;i++){x.fillStyle='hsl('+(i*53%360)+',40%,35%)';x.beginPath();x.arc((i*97)%1000,30+Math.floor(i/10)*14,5,0,7);x.fill()}
 x.fillStyle='#d9d3c4';x.fillRect(0,420,1000,140);x.fillStyle='#b8b0a0';x.fillRect(0,420,1000,6);x.strokeStyle='#d03a3a';x.lineWidth=6;[300,340,380].forEach(y=>{x.beginPath();x.moveTo(0,y);x.lineTo(1000,y);x.stroke()});
 // opponent
 const ox=640,oy=280,o=g.o;let oxs=0,oys=0,arm=0;if(g.oa==='jab'||g.oa==='hook'){arm=1-g.ot/(g.oa==='jab'?.5:.8)}if(g.oa==='stag'){oxs=14}const brk=g.t%1<.5?3:0;
 ath(x,ox+oxs,425,310,{shirt:o.col,shorts:'#222',stripe:'#fff',f:-1,skin:'#d9a070',hair:'#1a1008',glove:'#c02020',la:(g.oa==='jab'||g.oa==='hook')?.6+arm*.95:g.oa==='stag'?.2:2.0,ra:g.oa==='stag'?-.2:2.3,eb:.7,ll:.18,rl:-.22,lean:g.oa==='stag'?-.3:0});
 // player (from behind)
 const lx=g.lean*70,px=300+lx;{const k=g.pa?(g.pa==='jab'?1-g.pt/.28:1-g.pt/.55):0;ath(x,px,430,340,{shirt:'#2f7fd0',shorts:'#ffd23f',stripe:'#fff',f:1,skin:'#e0b080',hair:'#4a2a14',glove:'#d03a3a',la:g.blk?2.7:g.pa?.9+k*.7:1.9,ra:g.blk?2.5:g.pa==='hook'?1.2+k*.3:2.1,eb:.6,ll:.2,rl:-.25,lean:g.pa?k*.6:0})}
 g.sp.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillStyle='#ffd23f';x.fillRect(p.x,p.y,5,5)});x.globalAlpha=1;
 x.restore();
 // HUD
 x.fillStyle='rgba(8,5,26,.85)';x.beginPath();x.roundRect(20,12,960,56,12);x.fill();x.fillStyle='#2a2a50';x.fillRect(40,24,300,14);x.fillRect(660,24,300,14);x.fillStyle='#4be07a';x.fillRect(40,24,300*Math.max(0,g.php)/100,14);x.fillStyle='#ff6b5a';x.fillRect(960-300*Math.max(0,g.ohp)/g.o.hp,24,300*Math.max(0,g.ohp)/g.o.hp,14);x.fillStyle='#2a2a50';x.fillRect(40,46,200,8);x.fillStyle='#ffd23f';x.fillRect(40,46,200*g.pst/100,8);
 x.fillStyle='#fff';x.font='800 20px system-ui';x.textAlign='center';x.fillText(Math.ceil(g.rt)+'',500,46);x.font='700 11px system-ui';x.fillText('YOU',90,20);x.fillText(g.o.n.toUpperCase(),810,20);
 if(g.msgT>g.t){x.font='900 40px system-ui';x.lineWidth=6;x.strokeStyle='rgba(0,0,0,.7)';x.strokeText(g.msg,300,200);x.fillStyle='#4be07a';x.fillText(g.msg,300,200)}
 if(g.t<5){x.fillStyle='rgba(8,5,26,.8)';x.beginPath();x.roundRect(250,520,500,24,8);x.fill();x.fillStyle='#fff';x.font='600 12px system-ui';x.fillText('J jab · K hook · Space block · A/D dodge when the red glove swings',500,537)}}
function loop(){let last=performance.now();const f=now=>{const dt=Math.min(.03,(now-last)/1000||0);last=now;if(G){step(dt);draw()}if(V==='game')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
render();
