 if(k<9){if(r[i]===10){fr.r=[10];if(i+2<r.length||(i+2<=r.length-0&&r[i+1]!==undefined&&r[i+2]!==undefined)){}

function step(dt){const g=G;if(!g||g.over)return;g.t+=dt;if(g.flash>0)g.flash-=dt;
 if(g.ph==='aim'||g.ph==='power'||g.ph==='spin'){
  if(g.cpu){g.cpu.t-=dt;if(g.cpu.t<=0){g.aimX+=(g.cpu.x-g.aimX)*.2;g.ang+=(g.cpu.ang-g.ang)*.2;if(Math.abs(g.cpu.x-g.aimX)<1&&g.cpu.stage===0){g.aimX=g.cpu.x;g.ang=g.cpu.ang;g.cpu.stage=1;g.cpu.t=.5}else if(g.cpu.stage===1&&g.cpu.t<=0){g.pw=g.cpu.pw;g.spin=g.cpu.sp;throwBall()}}return}
  if(g.ph==='aim'){const mv=(KEYS.KeyD||KEYS.ArrowRight?1:0)-(KEYS.KeyA||KEYS.ArrowLeft?1:0),an=(KEYS.KeyW||KEYS.ArrowUp?1:0)-(KEYS.KeyS||KEYS.ArrowDown?1:0);
   g.aimX=clamp(g.aimX+mv*70*dt,-40,40);g.ang=clamp(g.ang+an*2.2*dt,-5,5)}
  else{g.m+=g.md*dt*(g.ph==='power'?1.25:1.55);if(g.m>1){g.m=1;g.md=-1}if(g.m<0){g.m=0;g.md=1}}
  g.ball.x=g.aimX;return}
 if(g.ph==='roll'){const N=4,h=dt/N;for(let k=0;k<N;k++)physics(h);g.rollT+=dt;
  const moving=g.pins.some(p=>!p.gone&&(Math.hypot(p.vx,p.vy)>9));
  if(g.ball.y>PITY||Math.hypot(g.ball.vx,g.ball.vy)<20){g.ball.vx=g.ball.vy=0;g.settle+=dt;if(!moving||g.settle>3.2)finishRoll()}return}
 if(g.ph==='result'){g.wait-=dt;g.pins.forEach(p=>{p.tilt=Math.min(1.5,p.tilt+dt*4)});if(g.wait<=0)nextTurn();return}}
function physics(dt){const g=G,b=g.ball,P=g.pins;
 if(b.y<PITY&&!(b.vy===0&&b.vx===0)){const k=clamp((b.y-850)/350,0,1);b.vx+=b.sp*210*k*dt*(Math.hypot(b.vx,b.vy)/900);const f=Math.exp(-.035*dt);b.vx*=f;b.vy*=f;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vy*dt*.05;
  if(!b.ghost&&Math.abs(b.x)>LW/2+4&&b.y<PINY-20){b.ghost=1;b.vx=0;b.x=Math.sign(b.x)*(LW/2+13);b.sp=0;beep(90,.2,'sawtooth',.06)}
  if(b.ghost){b.z=-5;b.x=Math.sign(b.x)*(LW/2+13)}
  if(b.y>PITY){b.y=PITY+30;b.vx=b.vy=0;b.z=-12}}
 if(!b.ghost)for(const p of P){if(p.gone)continue;const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy),m=RB+RP;
  if(d<m&&d>.01){const nx=dx/d,ny=dy/d,sp=Math.hypot(b.vx,b.vy);p.x=b.x+nx*m;p.y=b.y+ny*m;const tr=sp*1.08;p.vx+=nx*tr*.9+b.vx*.1;p.vy+=ny*tr*.9+b.vy*.1;
   if(!p.down){p.down=1;p.dir=Math.sign(nx)||1;crash(2)}b.vx-=nx*sp*.1;b.vy-=ny*sp*.12;b.vy*=.992;g.flash=.1}}
 for(let i=0;i<P.length;i++){const p=P[i];if(p.gone)continue;if(p.down){const sp=Math.hypot(p.vx,p.vy);if(sp>0){p.x+=p.vx*dt;p.y+=p.vy*dt;const f=Math.exp(-1.9*dt);p.vx*=f;p.vy*=f;if(sp<7){p.vx=p.vy=0}}}
  if(p.y>PITY-4||Math.abs(p.x)>LW/2+14){if(p.y>PITY-4){p.gone=1}else{p.x=Math.sign(p.x)*(LW/2+14);p.vx=0}}
  if(p.y>PINY+60&&!p.gone&&p.y>PITY-30){p.gone=1}}
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],c=P[j];if(a.gone||c.gone)continue;const sa=Math.hypot(a.vx,a.vy),sc=Math.hypot(c.vx,c.vy);if(sa<20&&sc<20)continue;
  const dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy),m=RP*2;if(d<m&&d>.01){const nx=dx/d,ny=dy/d,rel=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny;const ov=(m-d)/2;a.x-=nx*ov;a.y-=ny*ov;c.x+=nx*ov;c.y+=ny*ov;
   if(rel>0){const j2=rel*.85;a.vx-=nx*j2;a.vy-=ny*j2;c.vx+=nx*j2;c.vy+=ny*j2;[a,c].forEach(q=>{if(!q.down&&j2>18){q.down=1;q.dir=Math.sign(nx*(q===a?-1:1))||1;crash(1)}})}}}}
function finishRoll(){const g=G,P=g.pins,pl=g.pl[g.turn];let n=0;P.forEach(p=>{if(p.on&&p.down){n++;g.standing[p.i]=0}});
 pl.rolls.push(n);const fr=g.fr,last=fr===9;let strike=false,spare=false,nb=false,reset=false;const before=10-g.standing.reduce((a,v)=>a+v,0)-n;
 const totalNow=10-g.standing.reduce((a,v)=>a+v,0);
 if(totalNow===10){if(g.b===0)strike=true;else spare=true}
 if(!last){if(strike){nb=false}else if(g.b===0)nb=true;else nb=false}
 else{if(g.b===0){nb=true;if(strike)reset=true}else if(g.b===1){const r=pl.rolls.slice(-2);if(r[0]===10){nb=true;if(strike)reset=true}else if(r[0]+r[1]===10){nb=true;reset=true}else nb=false}else nb=false}
 g.msg=strike?'STRIKE!':spare?'SPARE!':n===0?(g.ball.ghost?'GUTTER':'MISS'):n+' down';g.msgT=g.t;if(strike){beep(660,.15);setTimeout(()=>beep(880,.2),120);setTimeout(()=>beep(1180,.3),260)}else if(spare)beep(700,.2);
 g.nb=nb;g.reset=reset;g.ph='result';g.wait=1.8;refreshSB()}
function nextTurn(){const g=G;const pl=g.pl[g.turn];
 if(g.nb){g.b++;if(g.reset||false){g.standing=g.standing.map(()=>1)}startTurn();return}
 g.b=0;g.standing=g.standing.map(()=>1);
 if(g.turn===0){g.turn=1}else{g.turn=0;g.fr++}
 if(g.fr>9){g.over=true;const a=scoreRolls(g.pl[0].rolls).slice(-1)[0].c||0,c=scoreRolls(g.pl[1].rolls).slice(-1)[0].c||0;g.fs=[a,c];if(a>sv.best)sv.best=a;if(a>c)sv.wins++;save();refreshSB();$('#ovl').innerHTML='<div class="ovl"><div class="box"><h2>Game over</h2><div class="big">'+a+' - '+c+'</div><div style="font-size:22px;font-weight:900;margin:10px 0;color:'+(a>c?'var(--ok)':a===c?'var(--gold)':'var(--bad)')+'">'+(a>c?'YOU WIN!':a===c?'Tie game':'CPU wins')+'</div><div style="display:grid;gap:8px"><button class="btn" data-a="start">Play again</button><button class="btn g" data-a="title">Menu</button></div></div></div>';return}
 startTurn()}
/* ---------- input */
function action(){const g=G;if(!g||g.over||!g.pl[g.turn].human)return;ac();
 if(g.ph==='aim'){g.ph='power';g.m=0;g.md=1}
 else if(g.ph==='power'){g.pw=clamp(g.m,0,1);g.ph='spin';g.m=0;g.md=1;g.m=.5;g.md=1}
 else if(g.ph==='spin'){g.spin=(g.m-.5)*2;throwBall()}}
addEventListener('keydown',e=>{if(V!=='game')return;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space'||e.code==='Enter'){if(!KEYS[e.code])action()}KEYS[e.code]=1});
addEventListener('keyup',e=>{KEYS[e.code]=0});
const cpt=e=>{const r=$('#cv').getBoundingClientRect();return{x:(e.clientX-r.left)*1000/r.width,y:(e.clientY-r.top)*560/r.height}};
const TB=[{k:'KeyA',x:70,y:500,r:36,t:'◀'},{k:'KeyD',x:160,y:500,r:36,t:'▶'},{k:'KeyW',x:250,y:500,r:30,t:'↺'},{k:'KeyS',x:325,y:500,r:30,t:'↻'},{k:'act',x:900,y:490,r:56,t:'GO'}];let TCH=0;
document.addEventListener('pointerdown',e=>{const cv=$('#cv');if(!cv||e.target!==cv||!G)return;if(e.pointerType==='touch')TCH=1;const q=cpt(e);const h=TB.find(b=>Math.hypot(q.x-b.x,q.y-b.y)<b.r);
 if(h){if(h.k==='act')action();else{KEYS[h.k]=1;e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);cv._hk=h.k}return}action()});
const pu=()=>{const cv=$('#cv');if(cv&&cv._hk){KEYS[cv._hk]=0;cv._hk=null}};document.addEventListener('pointerup',pu);document.addEventListener('pointercancel',pu);
/* ---------- drawing */
function drawPin(x,p){const c=cs(p.x,p.y,0);if(c[2]<NEAR+10)return;const u=CAM.f/c[2],[sx,sy]=sp2(c),H=40*u;
 x.save();x.translate(sx,sy);
 x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(0,0,7*u,2.6*u,0,0,7);x.fill();
 const side=(p.dir*CAM.r[0])>=0?1:-1;if(p.down){x.rotate(side*p.tilt)}
 const w=u;const path=()=>{x.beginPath();x.moveTo(-4.4*w,0);x.bezierCurveTo(-7.4*w,H*.2,-6.6*w,H*.42,-3*w,H*.62);x.bezierCurveTo(-2.4*w,H*.72,-3.6*w,H*.8,-3.7*w,H*.9);x.bezierCurveTo(-3.7*w,H*1.03,3.7*w,H*1.03,3.7*w,H*.9);x.bezierCurveTo(3.6*w,H*.8,2.4*w,H*.72,3*w,H*.62);x.bezierCurveTo(6.6*w,H*.42,7.4*w,H*.2,4.4*w,0);x.closePath()};
 x.scale(1,-1);const gr=x.createLinearGradient(-7*w,0,7*w,0);gr.addColorStop(0,'#cfd3df');gr.addColorStop(.35,'#ffffff');gr.addColorStop(1,'#b8bfd0');path();x.fillStyle=gr;x.fill();x.strokeStyle='rgba(30,30,50,.6)';x.lineWidth=Math.max(.6,.8*u);x.stroke();
 x.save();path();x.clip();x.fillStyle='#e0262f';x.fillRect(-10*w,H*.65,20*w,H*.045);x.fillRect(-10*w,H*.72,20*w,H*.045);x.restore();x.restore()}
function drawBall(x,b){const c=cs(b.x,b.y,RB+(b.z||0));if(c[2]<NEAR)return;const u=CAM.f/c[2],[sx,sy]=sp2(c),r=RB*u*1.08;
 x.fillStyle='rgba(0,0,0,.35)';const sc=cs(b.x,b.y,0);const ss=sp2(sc);x.beginPath();x.ellipse(ss[0],ss[1]+1,r*.95,r*.32,0,0,7);x.fill();
 const g=x.createRadialGradient(sx-r*.35,sy-r*.4,r*.1,sx,sy,r);g.addColorStop(0,'#c06bff');g.addColorStop(.5,'#5a1fa8');g.addColorStop(1,'#1c0b3c');x.fillStyle=g;x.beginPath();x.arc(sx,sy,r,0,7);x.fill();
 x.save();x.beginPath();x.arc(sx,sy,r,0,7);x.clip();x.strokeStyle='rgba(255,255,255,.22)';x.lineWidth=Math.max(1,r*.12);const a=b.rot;x.beginPath();x.ellipse(sx,sy,r*.9,r*.35,a*.7,0,7);x.stroke();x.beginPath();x.ellipse(sx,sy,r*.35,r*.9,-a*.5,0,7);x.stroke();
 x.fillStyle='#10061f';[[.0,-.38],[-.2,-.22],[.2,-.22]].forEach(h=>{const hx=h[0]*Math.cos(a)-h[1]*Math.sin(a),hy=h[0]*Math.sin(a)+h[1]*Math.cos(a);x.beginPath();x.arc(sx+hx*r,sy+hy*r*.8,r*.09,0,7);x.fill()});x.restore();
 x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.ellipse(sx-r*.35,sy-r*.45,r*.22,r*.13,-.6,0,7);x.fill()}
function drawScene(x,g){
 const fl=g.flash>0?1:0,neon=['#ff4fd8','#38e1ff','#ffd23f','#7a5cff'];
 const bg=x.createLinearGradient(0,0,0,560);bg.addColorStop(0,'#05030c');bg.addColorStop(.55,'#150b2c');bg.addColorStop(1,'#07040f');x.fillStyle=bg;x.fillRect(0,0,1000,560);
 // back wall + masking unit
 poly3(x,[[-260,2080,-30],[260,2080,-30],[260,2080,320],[-260,2080,320]],'#0d0820');
 for(let i=0;i<8;i++){const x0=-230+i*60;poly3(x,[[x0,2078,40],[x0+52,2078,40],[x0+52,2078,300],[x0,2078,300]],'rgba('+(i%2?'56,225,255':'255,79,216')+','+(.13+(g.ph==='result'&&/STRIKE/.test(g.msg)?.25*Math.abs(Math.sin(g.t*8+i)):0))+')')}
 poly3(x,[[-120,PITY,0],[120,PITY,0],[120,PITY,150],[-120,PITY,150]],'#090514');
 poly3(x,[[-140,PITY-4,150],[140,PITY-4,150],[140,PITY-4,170],[-140,PITY-4,170]],'#2a1a55');
 // side walls
 [-1,1].forEach(s=>{poly3(x,[[s*140,-600,0],[s*140,2080,0],[s*140,2080,330],[s*140,-600,330]],'#0c0720');for(let k=0;k<9;k++){const y0=-500+k*300;poly3(x,[[s*139,y0,150],[s*139,y0+160,150],[s*139,y0+160,160],[s*139,y0,160]],neon[k%4])}})
 // floor around
 poly3(x,[[-140,-600,0],[140,-600,0],[140,2080,0],[-140,2080,0]],'#150c2e');
 poly3(x,[[-LW/2-GUT*.2-80,-600,0],[LW/2+80,-600,0],[LW/2+80,0,0],[-LW/2-80,0,0]],'#2a1f4a');
 // gutters
 [-1,1].forEach(s=>poly3(x,[[s*LW/2,0,-1],[s*(LW/2+27),0,-1],[s*(LW/2+27),PITY,-1],[s*LW/2,PITY,-1]],'#07040d'));
 // lane
 for(let y=0;y<PITY;y+=150){const sh=Math.floor(y/150)%2?'#d9a35a':'#e0ab62';poly3(x,[[-LW/2,y,0],[LW/2,y,0],[LW/2,Math.min(y+150,PITY),0],[-LW/2,Math.min(y+150,PITY),0]],y>1300?'#e6b46c':sh)}
 for(let i=-19;i<=19;i+=2)line3(x,[i*LW/39,0,0],[i*LW/39,PITY,0],'rgba(120,70,20,.22)',1);
 poly3(x,[[-LW*.28,0,0],[LW*.28,0,0],[LW*.14,PITY,0],[-LW*.14,PITY,0]],'rgba(255,255,255,.1)');
 // arrows + dots
 for(let k=-3;k<=3;k++){const ax=k*LW/10,ay=420+Math.abs(k)*(-26)+78;poly3(x,[[ax-3,ay-8,0],[ax+3,ay-8,0],[ax,ay+22,0]],'#6a3a12')}
 for(let k=-3;k<=3;k++)poly3(x,[[k*LW/10-1.6,150-1.6,0],[k*LW/10+1.6,150-1.6,0],[k*LW/10+1.6,150+1.6,0],[k*LW/10-1.6,150+1.6,0]],'#6a3a12');
 poly3(x,[[-LW/2,-4,0],[LW/2,-4,0],[LW/2,4,0],[-LW/2,4,0]],'#c8202a');
 // pin deck glow
 poly3(x,[[-70,PINY-40,0],[70,PINY-40,0],[70,PITY,0],[-70,PITY,0]],'rgba(255,255,255,.08)');
 // overhead light bars
 for(let k=0;k<6;k++){const y0=-200+k*400;line3(x,[-120,y0,260],[120,y0,260],k%2?'#38e1ff':'#ff4fd8',5)}
 // aim guide
 if((g.ph==='aim'||g.ph==='power'||g.ph==='spin')&&g.pl[g.turn].human){const a=g.ang*Math.PI/180;for(let y=40;y<1100;y+=60){const px=g.aimX+Math.tan(a)*y;poly3(x,[[px-2.2,y-4,.5],[px+2.2,y-4,.5],[px+2.2,y+4,.5],[px-2.2,y+4,.5]],'rgba(255,79,216,'+(.8-y/1500)+')')}}
 // entities
 const ents=g.pins.filter(p=>!p.gone).map(p=>({d:cs(p.x,p.y,0)[2],p}));ents.push({d:cs(g.ball.x,g.ball.y,0)[2]-1,ball:1});
 ents.sort((a,b)=>b.d-a.d).forEach(e=>e.ball?(g.ball.y<PITY+20&&drawBall(x,g.ball)):drawPin(x,e.p));
 if(fl){x.fillStyle='rgba(255,255,255,.08)';x.fillRect(0,0,1000,560)}}
function drawHud(x,g){const pl=g.pl[g.turn];x.fillStyle='rgba(8,5,18,.88)';x.beginPath();x.roundRect(260,6,480,44,12);x.fill();x.textAlign='center';x.fillStyle='#ffd23f';x.font='800 18px system-ui';x.fillText(pl.n+'  -  Frame '+(g.fr+1)+'  -  Ball '+(g.b+1),500,24);
 const pins=g.pins.filter(p=>p.on&&!p.down).length;x.fillStyle='#a79bc8';x.font='700 13px system-ui';x.fillText('Pins standing: '+(g.ph==='result'||g.ph==='roll'?pins:g.standing.reduce((a,v)=>a+v,0)),500,42);
 if(g.t-g.msgT<1.8&&g.msg&&g.ph==='result'){x.font='900 56px system-ui';x.lineWidth=9;x.strokeStyle='rgba(0,0,0,.7)';x.strokeText(g.msg,500,190);x.fillStyle=/STRIKE|SPARE/.test(g.msg)?'#ffd23f':'#fff';x.fillText(g.msg,500,190)}
 if(g.pl[g.turn].human&&(g.ph==='power'||g.ph==='spin')){const bx=300,by=500,w=400,h=26;x.fillStyle='rgba(8,5,18,.9)';x.beginPath();x.roundRect(bx-12,by-34,w+24,78,12);x.fill();x.fillStyle='#fff';x.font='800 13px system-ui';x.fillText(g.ph==='power'?'POWER: press Space':'SPIN: press Space (center = straight)',500,by-16);
  if(g.ph==='power'){const gr=x.createLinearGradient(bx,0,bx+w,0);gr.addColorStop(0,'#3ddc84');gr.addColorStop(.8,'#ffd23f');gr.addColorStop(1,'#ff4a3a');x.fillStyle=gr}else{const gr=x.createLinearGradient(bx,0,bx+w,0);gr.addColorStop(0,'#38e1ff');gr.addColorStop(.5,'#3ddc84');gr.addColorStop(1,'#ff4fd8');x.fillStyle=gr}
  x.beginPath();x.roundRect(bx,by,w,h,8);x.fill();x.fillStyle='#fff';x.fillRect(bx+g.m*w-3,by-6,6,h+12);x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=2;x.stroke()}
 if(g.pl[g.turn].human&&g.ph==='aim'){x.fillStyle='rgba(8,5,18,.85)';x.beginPath();x.roundRect(250,508,500,36,10);x.fill();x.fillStyle='#fff';x.font='700 13px system-ui';x.fillText('A / D slide ball   W / S angle   Space continue',500,531)}
 if(TCH&&g.pl[g.turn].human){TB.forEach(b=>{x.fillStyle='rgba(255,255,255,.2)';x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=3;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.stroke();x.fillStyle='#fff';x.font='800 '+(b.k==='act'?16:22)+'px system-ui';x.fillText(b.t,b.x,b.y+7)})}}
function draw(){const cv=$('#cv');if(!cv||!G)return;const x=cv.getContext('2d');updateCam(1/60);drawScene(x,G);drawHud(x,G)}
function loop(){let last=performance.now();const f=now=>{const dt=Math.min(.033,(now-last)/1000||0);last=now;if(G){step(dt);draw()}if(V==='game')raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
render();
