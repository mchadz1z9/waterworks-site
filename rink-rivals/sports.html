<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Sports Center</title>
<style>
:root{--bg:#06080f;--p1:#0f1422;--p2:#182034;--line:#232c44;--tx:#f1f5f9;--mut:#94a3b8;--acc:linear-gradient(135deg,#22c55e,#0ea5e9);--hot:#ef4444}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
#hd{position:sticky;top:0;z-index:20;background:rgba(6,8,15,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#hd .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal;font-size:18px}
#hd .sp{flex:1}#hd a.b{background:var(--p2);border-radius:18px;padding:7px 13px;font:600 13px system-ui}
.tabs{display:flex;gap:6px}.tab{border:0;background:none;color:var(--mut);font:700 15px system-ui;padding:8px 12px;border-radius:10px}.tab.on{background:var(--p2);color:var(--tx)}
.lgs{max-width:1200px;margin:0 auto;display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.lg{flex:none;border:1px solid var(--line);background:var(--p1);color:var(--tx);border-radius:999px;padding:7px 14px;font:700 14px system-ui}.lg.on{background:var(--acc);border-color:transparent;color:#04110a}
main{max-width:1200px;margin:0 auto;padding:14px 16px 60px}
.dnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}.dnav button{border:1px solid var(--line);background:var(--p1);color:var(--tx);border-radius:10px;padding:6px 12px;font:700 14px system-ui}.dnav b{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gm{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative}
.gm .top{display:flex;justify-content:space-between;color:var(--mut);font:700 12px system-ui;margin-bottom:8px}.gm .top .live{color:var(--hot)}.gm .top .live::before{content:'● ';animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.3}}
.tm{display:flex;align-items:center;gap:10px;padding:5px 0}.tm img{width:34px;height:34px;object-fit:contain}.tm .nm{flex:1;min-width:0}.tm .nm b{display:block;font-size:16px}.tm .nm small{color:var(--mut);font-size:12px}
.tm .sc{font:900 24px system-ui;min-width:36px;text-align:right}.tm.lose{opacity:.55}
.tm .star{border:0;background:none;color:#475569;font-size:16px;padding:0 2px}.tm .star.on{color:#fbbf24}
.gdl{display:block;margin-top:10px;text-align:center;border-top:1px solid var(--line);padding-top:9px;color:#38bdf8;font:800 13px system-ui}.gdl:hover{color:#7dd3fc}
.gm .tv{color:var(--mut);font-size:12px;margin-top:6px}
.pk{display:flex;gap:8px;margin-top:10px}.pk button{flex:1;border:1px solid var(--line);background:var(--p2);color:var(--tx);border-radius:10px;padding:8px;font:800 13px system-ui;display:flex;align-items:center;justify-content:center;gap:6px}
.pk button img{width:20px;height:20px}.pk button.on{background:var(--acc);color:#04110a;border-color:transparent}.pk button:disabled{cursor:default;opacity:.85}
.res{margin-top:8px;font:800 13px system-ui}.res.w{color:#4ade80}.res.l{color:#f87171}
.note{color:var(--mut);font-size:14px;margin:6px 0 14px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font:800 16px system-ui}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-weight:700;text-align:right;padding:6px 4px;font-size:12px}th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}td:nth-child(1){color:var(--mut);text-align:left;width:26px}td:nth-child(2){text-align:left}
td .t{display:flex;align-items:center;gap:8px}td .t img{width:22px;height:22px;object-fit:contain}tr.fav td{background:rgba(251,191,36,.08)}
.lb{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lb ol{margin:0;padding-left:22px}.lb li{padding:5px 0;border-top:1px solid var(--line);font-size:15px}.lb li:first-child{border:0}.lb li span{float:right;color:var(--mut)}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.stat{flex:1;min-width:120px;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font:900 26px system-ui}.stat span{color:var(--mut);font-size:13px}
.empty{color:var(--mut);padding:30px;text-align:center;background:var(--p1);border-radius:16px;border:1px dashed var(--line)}
@media(max-width:700px){.lb{grid-template-columns:1fr}.tabs{order:3;width:100%;overflow-x:auto}#hd a.b{display:none}}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui;text-decoration:none}.bk:hover{background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><div class="in"><a class="bk" href="./" title="Back" aria-label="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><a id="logo" href="sports"><i>🏟️</i>Rival Sports Center</a><span class="sp"></span>
  <nav class="tabs"><button class="tab" data-t="scores">📺 Scores</button><button class="tab" data-t="pick">🎯 Pick'em</button><button class="tab" data-t="stand">📊 Standings</button><button class="tab" data-t="lb">🏆 Leaders</button></nav>
  <a class="b" href="league">🏈 League</a><a class="b" href="market">📈 Market</a><a class="b" href="./">← Arcade</a></div></header>
<div class="lgs" id="lgs"></div>
<main id="main"><div class="empty">Loading…</div></main>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SRV=(()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })();
  const LSJ=(k,d)=>{ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } }, LSS=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
  const pid=()=>{ try{ let p=localStorage.getItem('rrPid'); if(!p||p.length<8){ p=Math.random().toString(36).slice(2,14); localStorage.setItem('rrPid',p); } return p; }catch(e){ return ''; } };
  const name=()=>{ try{ return localStorage.getItem('rrOnlineName')||'Player'; }catch(e){ return 'Player'; } };
  const LGS=[['all','⭐ My teams'],['nfl','🏈 NFL'],['nba','🏀 NBA'],['nhl','🏒 NHL'],['mlb','⚾ MLB']];
  const q=new URLSearchParams(location.search); let tab=q.get('t')||'scores', lg=q.get('l')||LSJ('rrScLg','nba'), day=0, timer=null, MY=null, FAV=LSJ('rrScFav',[]);
  if(!LGS.some(x=>x[0]===lg)) lg='nba';
  const ymd=off=>{ const d=new Date(Date.now()+off*864e5); return d.toLocaleDateString('en-CA',{timeZone:'America/New_York'}).replace(/-/g,''); };
  const dayName=off=>off===0?'Today':off===-1?'Yesterday':off===1?'Tomorrow':new Date(Date.now()+off*864e5).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const get=u=>fetch(SRV+u).then(r=>r.json()).catch(()=>null), post=(u,b)=>fetch(SRV+u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>null);
  const fk=(l,ab)=>l+':'+ab, isFav=(l,ab)=>FAV.includes(fk(l,ab));
  function nav(){ document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab)); const L=tab==='scores'?LGS:LGS.slice(1); if(lg==='all'&&tab!=='scores') lg='nba';
    $('lgs').innerHTML=L.map(([k,t])=>`<button class="lg${k===lg?' on':''}" data-l="${k}">${t}</button>`).join(''); history.replaceState(null,'','sports?t='+tab+'&l='+lg); }
  const timeOf=g=>new Date(g.date).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  function team(t,l,g,showScore){ const lose=g.st==='post'&&!t.win&&(g.home.win||g.away.win); return `<div class="tm${lose?' lose':''}"><img src="${esc(t.logo)}" alt="" loading="lazy"><div class="nm"><b>${esc(t.name)}</b><small>${esc(t.rec)}</small></div><button class="star${isFav(l,t.ab)?' on':''}" data-fav="${l}:${esc(t.ab)}" title="Follow this team">★</button><div class="sc">${showScore?esc(t.score):''}</div></div>`; }
  function gameCard(g,l,pickMode){ const status=g.st==='in'?`<span class="live">LIVE · ${esc(g.det)}</span>`:g.st==='post'?esc(g.det||'Final'):timeOf(g);
    let pk=''; if(pickMode){ const my=MY&&MY.find(p=>p.gid===g.id); const locked=g.st!=='pre'||Date.parse(g.date)<=Date.now();
      pk=`<div class="pk">${[g.away,g.home].map(t=>`<button data-pick="${l}|${g.id}|${esc(t.ab)}|${new Date(g.date).toLocaleDateString('en-CA',{timeZone:'America/New_York'}).replace(/-/g,'')}" class="${my&&my.team===t.ab?'on':''}" ${locked?'disabled':''}><img src="${esc(t.logo)}" alt="">${esc(t.ab)}${my&&my.team===t.ab?' ✓':''}</button>`).join('')}</div>`;
      if(my&&my.res===1) pk+=`<div class="res w">✅ You picked right! +25 🪙</div>`; else if(my&&my.res===-1) pk+=`<div class="res l">❌ Not this time</div>`; else if(my&&locked) pk+=`<div class="res" style="color:var(--mut)">🔒 Locked in: ${esc(my.team)}</div>`; else if(!my&&locked) pk+=`<div class="res" style="color:var(--mut)">🔒 Picks closed</div>`; }
    return `<div class="gm"><div class="top"><span>${{nfl:'🏈 NFL',nba:'🏀 NBA',nhl:'🏒 NHL',mlb:'⚾ MLB'}[l]}</span>${status}</div>${team(g.away,l,g,g.st!=='pre')}${team(g.home,l,g,g.st!=='pre')}${g.tv?`<div class="tv">📺 ${esc(g.tv)}</div>`:''}${pk}<a class="gdl" href="gameday?l=${l}&id=${g.id}">${g.st==='in'?'📡 Watch live on Game Day ›':g.st==='post'?'📋 Game recap ›':'📡 Game Day ›'}</a></div>`; }
  async function boards(leagues,d){ const R=await Promise.all(leagues.map(l=>get('/sc/board?l='+l+'&d='+d).then(b=>[l,b]))); return R; }
  async function scores(){ const leagues=lg==='all'?[...new Set(FAV.map(f=>f.split(':')[0]))]:[lg]; const d=ymd(day);
    let h=`<div class="dnav"><button data-day="-1">◀</button><b>${dayName(day)}</b><button data-day="1">▶</button>${day?'<button data-day="0">Today</button>':''}</div>`;
    if(lg==='all'&&!FAV.length){ $('main').innerHTML=h+'<div class="empty">Tap the ★ next to any team to follow it. Your teams show up here.</div>'; return; }
    const R=await boards(leagues,d); let cards=[], live=false;
    for(const [l,b] of R){ if(!b||!b.games) continue; for(const g of b.games){ if(lg==='all'&&!isFav(l,g.home.ab)&&!isFav(l,g.away.ab)) continue; if(g.st==='in') live=true; cards.push([g,l]); } }
    cards.sort((a,b)=>(a[0].st==='in'?0:a[0].st==='pre'?1:2)-(b[0].st==='in'?0:b[0].st==='pre'?1:2)||Date.parse(a[0].date)-Date.parse(b[0].date));
    $('main').innerHTML=h+(cards.length?`<div class="grid">${cards.map(([g,l])=>gameCard(g,l,false)).join('')}</div>`:`<div class="empty">No ${lg==='all'?'games for your teams':LGS.find(x=>x[0]===lg)[1]+' games'} ${dayName(day).toLowerCase()==='today'?'today':'on '+dayName(day)}.${lg==='mlb'?' (Baseball is in its offseason.)':''}</div>`);
    clearTimeout(timer); if(tab==='scores'&&live) timer=setTimeout(scores,20000); }
  /* pick'em: today's and tomorrow's games */
  async function loadMy(){ const d=await post('/sc/my',{pid:pid()}); MY=(d&&d.picks)||[]; const paid=LSJ('rrScPaid',[]); let n=0;
    for(const p of MY) if(p.res===1&&!paid.includes(p.gid)){ paid.push(p.gid); n++; }
    if(n){ LSS('rrScPaid',paid.slice(-500)); try{ window.RRCOIN&&RRCOIN.add(25*n,`Pick'em · ${n} right pick${n>1?'s':''}`); }catch(e){} } }
  async function pickem(){ await loadMy(); const R=await Promise.all([0,1,2].map(o=>get('/sc/board?l='+lg+'&d='+ymd(o)))); const seen=new Set(), G=[];
    for(const b of R) for(const g of (b&&b.games)||[]) if(!seen.has(g.id)){ seen.add(g.id); G.push(g); }
    const done=MY.filter(p=>p.res!==0), w=done.filter(p=>p.res===1).length;
    let h=`<div class="stats"><div class="stat"><b>${w}</b><span>right picks</span></div><div class="stat"><b>${done.length-w}</b><span>wrong picks</span></div><div class="stat"><b>${done.length?Math.round(100*w/done.length):0}%</b><span>accuracy</span></div><div class="stat"><b>${MY.filter(p=>p.res===0).length}</b><span>waiting</span></div></div>`;
    h+=`<div class="note">Pick who wins before the game starts. Every right pick is <b>+25 🪙</b> and a point on the 🏆 Leaders board. You can change a pick until the game begins.</div>`;
    const open=G.filter(g=>g.st==='pre'), rest=G.filter(g=>g.st!=='pre').concat(MY.filter(p=>p.lg===lg&&!seen.has(p.gid)).slice(0,0));
    $('main').innerHTML=h+(open.length?`<h3>🎯 Make your picks</h3><div class="grid">${open.map(g=>gameCard(g,lg,true)).join('')}</div>`:'<div class="empty">No upcoming games to pick in this league right now.</div>')+(rest.length?`<h3 style="margin-top:22px">🔒 Started &amp; finished</h3><div class="grid">${rest.map(g=>gameCard(g,lg,true)).join('')}</div>`:''); }
  async function stand(){ const d=await get('/sc/stand?l='+lg); if(!d||!d.groups||!d.groups.length){ $('main').innerHTML='<div class="empty">Standings are not available right now.</div>'; return; }
    const ice=lg==='nhl', foot=lg==='nfl';
    $('main').innerHTML=d.groups.map(gr=>`<div class="card"><h3>${esc(gr.name)}</h3><table><tr><th>#</th><th>Team</th><th>W</th><th>L</th>${ice?'<th>OTL</th><th>PTS</th>':foot?'<th>T</th><th>PCT</th>':'<th>PCT</th><th>GB</th>'}<th>STRK</th></tr>${gr.teams.map((t,i)=>`<tr class="${isFav(lg,t.ab)?'fav':''}"><td>${i+1}</td><td><span class="t"><img src="${esc(t.logo)}" alt="" loading="lazy">${esc(t.name)}</span></td><td>${esc(t.w)}</td><td>${esc(t.l)}</td>${ice?`<td>${esc(t.t)}</td><td><b>${esc(t.pts)}</b></td>`:foot?`<td>${esc(t.t)}</td><td>${esc(t.pct)}</td>`:`<td>${esc(t.pct)}</td><td>${esc(t.gb)}</td>`}<td>${esc(t.strk)}</td></tr>`).join('')}</table></div>`).join(''); }
  async function lb(){ const d=await get('/sc/lb'); const me=name(); const list=L=>(L&&L.length)?`<ol>${L.map(x=>`<li${x.name===me?' style="color:#4ade80;font-weight:800"':''}>${esc(x.name)}<span>${x.w} right · ${x.l} wrong</span></li>`).join('')}</ol>`:'<div class="note">No right picks yet. Be the first!</div>';
    $('main').innerHTML=`<div class="note">The best pickers on Arcade Rivals, counted from every league. Make picks in the 🎯 Pick'em tab.</div><div class="lb"><div class="card"><h3>🔥 This week</h3>${d?list(d.week):'…'}</div><div class="card"><h3>👑 All time</h3>${d?list(d.all):'…'}</div></div>`; }
  function draw(){ nav(); clearTimeout(timer); $('main').innerHTML='<div class="empty">Loading…</div>'; ({scores,pick:pickem,stand,lb})[tab](); }
  document.addEventListener('click',async e=>{ const t=e.target.closest('.tab'); if(t){ tab=t.dataset.t; day=0; draw(); return; }
    const l=e.target.closest('[data-l]'); if(l){ lg=l.dataset.l; if(lg!=='all') LSS('rrScLg',lg); draw(); return; }
    const dd=e.target.closest('[data-day]'); if(dd){ const v=+dd.dataset.day; day=v===0?0:day+v; scores(); return; }
    const f=e.target.closest('[data-fav]'); if(f){ const k=f.dataset.fav; FAV=FAV.includes(k)?FAV.filter(x=>x!==k):FAV.concat(k); LSS('rrScFav',FAV); document.querySelectorAll(`[data-fav="${k}"]`).forEach(x=>x.classList.toggle('on',FAV.includes(k))); return; }
    const p=e.target.closest('[data-pick]'); if(p&&!p.disabled){ const [l2,gid,team,gday]=p.dataset.pick.split('|'); const card=p.closest('.gm'); card.querySelectorAll('[data-pick]').forEach(b=>b.disabled=true);
      const r=await post('/sc/pick',{pid:pid(),name:name(),lg:l2,gid,team,day:gday}); if(r&&r.ok){ MY=MY.filter(x=>x.gid!==gid).concat({gid,team,res:0,lg:l2}); }
      else alert(r&&r.err==='locked'?'That game already started, so picks are closed.':'Could not save your pick. Try again.');
      card.querySelectorAll('[data-pick]').forEach(b=>{ b.disabled=false; const on=b.dataset.pick.split('|')[2]===(MY.find(x=>x.gid===gid)||{}).team; b.classList.toggle('on',on); b.innerHTML=b.innerHTML.replace(' ✓','')+(on?' ✓':''); }); } });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&tab==='scores') scores(); });
  draw();
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
