<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival Market Day</title>
<style>
:root{--bg:#0b0806;--p1:#17110b;--p2:#231a10;--line:#3a2b18;--tx:#fff7ed;--mut:#c8b393;--acc:linear-gradient(135deg,#f59e0b,#ef4444)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui}
#hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:1200px;margin:0 auto;flex-wrap:wrap}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal}
#hd .sp{flex:1}#bal{background:var(--p2);border-radius:999px;padding:7px 14px;font:800 14px system-ui}
.tabs{display:flex;gap:6px}.tabs button{border:0;background:none;color:var(--mut);font:700 14px system-ui;padding:8px 12px;border-radius:10px}.tabs button.on{background:var(--p2);color:var(--tx)}
main{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.card h3{margin:0 0 10px;font:800 17px system-ui}
.btn{border:0;border-radius:11px;padding:9px 14px;font:900 14px system-ui;background:var(--acc);color:#fff}.btn.g{background:var(--p2);color:var(--tx)}
.note{color:var(--mut);font-size:14px}
.banner{text-align:center;padding:22px;border-radius:16px;background:linear-gradient(135deg,#7c2d12,#b45309);font:900 22px system-ui;margin-bottom:14px}.banner small{display:block;font:700 15px system-ui;opacity:.9;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.li{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.li .ic{font-size:34px}.li b{font-size:15px}.li small{color:var(--mut)}.li .pr{font:900 20px system-ui}.li .tag{font:800 11px system-ui;border-radius:999px;padding:2px 8px;background:#ef444433;color:#fca5a5;align-self:flex-start}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{border:1px solid var(--line);background:#100b06;color:var(--tx);border-radius:10px;padding:9px 11px;font-size:14px;min-width:0}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:360px;overflow:auto}
.own{border:2px solid var(--line);background:var(--p2);border-radius:12px;padding:10px;color:var(--tx);text-align:left}.own.on{border-color:#f59e0b}.own span{font-size:22px}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
@media(max-width:700px){.tabs{order:3;width:100%}}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a class="bk" href="./" title="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><a id="logo" href="marketday"><i>🛒</i>Rival Market Day</a><span class="sp"></span><span id="bal">🪙 …</span>
  <nav class="tabs"><button data-t="buy" class="on">🛍️ Shop</button><button data-t="sell">💰 Sell</button><button data-t="me">📦 My listings</button></nav></header>
<main id="main"><p class="note">Loading…</p></main>
<script src="packs-data.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SRV=(()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })();
  const pid=()=>{ try{ let p=localStorage.getItem('rrPid'); if(!p||p.length<8){ p=Math.random().toString(36).slice(2,14); localStorage.setItem('rrPid',p); } return p; }catch(e){ return ''; } };
  const name=()=>{ try{ return localStorage.getItem('rrOnlineName')||'Player'; }catch(e){ return 'Player'; } };
  const post=(u,b)=>fetch(SRV+u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({pid:pid(),name:name()},b||{}))}).then(r=>r.json()).catch(()=>({err:'net'}));
  const ls={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
  const C=()=>window.RRCOIN, bal=()=>{ const b=C()&&C().bal; return typeof b==='number'?b:0; }, fmt=n=>n===Infinity?'∞':Math.round(n).toLocaleString();
  setInterval(()=>{ $('bal').textContent='🪙 '+fmt(bal()); },1000);
  /* cards: same names and ratings as Pack Rip */
  const D=window.PACKDATA||{}, SPI={hockey:['🏒','NHL'],football:['🏈','NFL'],basketball:['🏀','NBA'],baseball:['⚾','MLB'],soccer:['⚽','SOC']}, CARD={};
  for(const [sp,[e,K]] of Object.entries(SPI)) for(const leg of [0,1]) for(const p of (D[K+(leg?'_LEG':'_NOW')]||[])) CARD[sp+':'+p[0]+(leg?':L':'')]={ic:e,n:p[0]+(leg?' (Legend)':''),r:p[4]};
  for(const k of D.KIDS||[]) CARD['kid:'+k[0]]={ic:'🕹️',n:k[0]+' (classmate)',r:k[1]};
  const cardsOwn=()=>ls.get('pk_own',{}), giveCard=k=>{ const o=cardsOwn(); o[k]=(o[k]||0)+1; ls.set('pk_own',o); }, takeCard=k=>{ const o=cardsOwn(); if(!o[k]) return false; o[k]--; if(!o[k]) delete o[k]; ls.set('pk_own',o); return true; };
  const label=(kind,k)=>kind==='card'?(CARD[k]?`${CARD[k].ic} ${CARD[k].n} · ${CARD[k].r}`:k):(C()&&C().itemName?C().itemName(k):k);
  const icon=(kind,k)=>kind==='card'?(CARD[k]?CARD[k].ic:'🃏'):((C()&&C().itemOf&&C().itemOf(k))||{}).ic||'🎁';
  let tab='buy', S=null, sel=null, toastT;
  const toast=t=>{ let e=$('toast'); if(!e){ e=document.createElement('div'); e.id='toast'; e.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#1c1208;border:2px solid #f59e0b;border-radius:14px;padding:12px 16px;font:800 15px system-ui;z-index:99'; document.body.appendChild(e); } e.textContent=t; e.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>e.style.display='none',3500); };
  /* pick up coins, items and cards waiting for this player */
  async function claims(){ const d=await post('/md/claims'); if(!d||!d.claims) return d; for(const c of d.claims){ if(c.kind==='coins') C().tradeGive([],c.n); else if(c.kind==='item') C().tradeGive([c.k],0); else if(c.kind==='card') giveCard(c.k); toast((c.kind==='coins'?`+${c.n} 🪙 `:'📦 ')+c.why); } return d; }
  const left=ms=>{ ms=Math.max(0,ms); const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/3600000), m=Math.floor(ms%3600000/60000); return (d?d+'d ':'')+(h?h+'h ':'')+m+'m'; };
  async function load(){ S=await fetch(SRV+'/md/list').then(r=>r.json()).catch(()=>null); draw(); }
  function banner(){ return S.open?`<div class="banner">🛒 Market Day is OPEN!<small>Closes in ${left(S.closeAt-S.now)} · auctions end then · unsold things go back to their owners</small></div>`:`<div class="banner" style="background:linear-gradient(135deg,#292524,#57534e)">🔒 The market is closed<small>Opens every Saturday and Sunday · next one in ${left(S.openAt-S.now)}</small></div>`; }
  const avg=k=>{ const h=S.hist[k]; return h&&h.length?Math.round(h.reduce((a,b)=>a+b,0)/h.length):0; };
  function draw(){ if(!S){ $('main').innerHTML='<p class="note">Could not reach the market.</p>'; return; } document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab)); let h=banner();
    if(tab==='buy'){ const L=S.list.filter(l=>!$('fq')||!$('fq').value||l.label.toLowerCase().includes($('fq').value.toLowerCase()));
      h+=`<div class="row" style="margin-bottom:12px"><input id="fq" placeholder="Search the market…" style="flex:1"><select id="fk"><option value="">Everything</option><option value="item">🎁 Shop items</option><option value="card">🃏 Cards</option><option value="auc">🔨 Auctions</option></select></div><div class="grid" id="lst"></div>`;
      $('main').innerHTML=h; const fk=$('fk'), fq=$('fq'); const paint=()=>{ const q=fq.value.toLowerCase(), k=fk.value; const L2=S.list.filter(l=>(!q||l.label.toLowerCase().includes(q))&&(!k||(k==='auc'?l.auc:l.kind===k)));
        $('lst').innerHTML=L2.map(l=>{ const a=avg(l.k); const cur=l.auc?(l.bid||l.price):l.price; return `<div class="li"><span class="ic">${icon(l.kind,l.k)}</span><b>${esc(l.label)}</b><small>sold by ${esc(l.name)}${a?` · usually ~${fmt(a)} 🪙`:''}</small>${l.auc?`<span class="tag">🔨 Auction${l.bid?' · top bid by '+esc(l.bname):''}</span>`:''}<div class="pr">🪙 ${fmt(cur)}</div>${S.open?(l.auc?`<div class="row"><input type="number" min="${l.bid?l.bid+Math.max(1,Math.ceil(l.bid*.05)):l.price}" value="${l.bid?l.bid+Math.max(1,Math.ceil(l.bid*.05)):l.price}" style="width:110px" data-bidv="${l.id}"><button class="btn" data-bid="${l.id}">Bid</button></div>`:`<button class="btn" data-buy="${l.id}">Buy for 🪙 ${fmt(l.price)}</button>`):''}</div>`; }).join('')||'<p class="note">Nothing for sale yet. Be the first seller!</p>'; };
      fk.onchange=paint; fq.oninput=paint; paint(); return; }
    if(tab==='sell'){ const items=(C()&&C().tradeable?C().tradeable():[]).filter(i=>i.own), cards=Object.entries(cardsOwn()).filter(([k])=>CARD[k]);
      h+=`<div class="card"><h3>1. Pick something to sell</h3><div class="mine">${items.map(i=>`<button class="own${sel&&sel.k===i.k?' on':''}" data-pick="item|${esc(i.k)}"><span>${i.ic}</span> ${esc(i.n)}</button>`).join('')}${cards.map(([k,n])=>`<button class="own${sel&&sel.k===k?' on':''}" data-pick="card|${esc(k)}"><span>${CARD[k].ic}</span> ${esc(CARD[k].n)} · ${CARD[k].r}${n>1?` ×${n}`:''}</button>`).join('')||''}</div>${!items.length&&!cards.length?'<p class="note">You don\'t have shop items or cards to sell yet.</p>':''}</div>
        <div class="card"><h3>2. Set a price</h3>${sel?`<p>${esc(label(sel.kind,sel.k))}${avg(sel.k)?` <span class="note">· usually sells for ~${fmt(avg(sel.k))} 🪙</span>`:''}</p><div class="row"><select id="sk"><option value="0">Buy now price</option><option value="1">🔨 Auction (starting bid)</option></select><input id="sp" type="number" min="1" max="100000" value="${avg(sel.k)||100}" style="width:140px"><button class="btn" id="sgo" ${S.open?'':'disabled'}>List it</button></div><p class="note">${S.open?'Your item leaves your inventory while it is listed. If it does not sell, it comes back when the market closes.':'Selling opens on Saturday.'}</p>`:'<p class="note">Pick something above first.</p>'}</div>`;
      $('main').innerHTML=h; const go=$('sgo'); if(go) go.onclick=sell; return; }
    if(tab==='me'){ post('/md/claims').then(d=>{ for(const c of (d&&d.claims)||[]){ if(c.kind==='coins') C().tradeGive([],c.n); else if(c.kind==='item') C().tradeGive([c.k],0); else if(c.kind==='card') giveCard(c.k); toast(c.why); }
        const L=(d&&d.mine)||[]; $('main').innerHTML=banner()+`<div class="card"><h3>📦 Your listings</h3>${L.length?L.map(l=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><b style="flex:1">${esc(l.label)}</b><span class="note">${l.auc?'🔨 '+(l.bid?'top bid '+fmt(l.bid)+' by '+esc(l.bname):'no bids yet'):'🪙 '+fmt(l.price)}</span><span class="note">${{open:'For sale',sold:'✅ Sold',back:'↩️ Returned'}[l.st]}</span>${l.st==='open'&&!(l.auc&&l.bid)?`<button class="btn g" data-cancel="${l.id}">Take back</button>`:''}</div>`).join(''):'<p class="note">You haven\'t listed anything.</p>'}<p class="note">Coins from sales arrive here automatically the next time you visit.</p></div>`; }); return; } }
  async function sell(){ const price=Math.floor(+$('sp').value||0), auc=$('sk').value==='1'; if(price<1) return toast('Pick a price.'); const lbl=label(sel.kind,sel.k);
    const took=sel.kind==='card'?takeCard(sel.k):C().tradeTake([sel.k],0); if(!took) return toast('You no longer have that.');
    const r=await post('/md/sell',{kind:sel.kind,k:sel.k,label:lbl,price,auc}); if(!r.ok){ sel.kind==='card'?giveCard(sel.k):C().tradeGive([sel.k],0); return toast(r.err==='many'?'You can have up to 10 things listed.':r.err==='closed'?'The market is closed.':'Could not list it.'); }
    toast('🛒 Listed! '+lbl); sel=null; load(); }
  document.addEventListener('click',async e=>{ const t=e.target.closest('[data-t]'); if(t){ tab=t.dataset.t; draw(); return; }
    const p=e.target.closest('[data-pick]'); if(p){ const [kind,k]=p.dataset.pick.split('|'); sel={kind,k}; draw(); return; }
    const b=e.target.closest('[data-buy]'); if(b){ const l=S.list.find(x=>x.id===+b.dataset.buy); if(!l) return; if(bal()<l.price) return toast('Not enough coins.'); if(!confirm(`Buy ${l.label} for ${fmt(l.price)} coins?`)) return;
      if(!C().tradeTake([],l.price)) return toast('Not enough coins.'); const r=await post('/md/buy',{id:l.id,pay:l.price}); if(!r.ok){ C().tradeGive([],l.price); return toast(r.err==='own'?'That is your own listing.':'Someone else just bought it.'); }
      r.kind==='card'?giveCard(r.k):C().tradeGive([r.k],0); toast('✅ You bought '+l.label+'!'); load(); return; }
    const bd=e.target.closest('[data-bid]'); if(bd){ const id=+bd.dataset.bid, v=Math.floor(+document.querySelector(`[data-bidv="${id}"]`).value||0), l=S.list.find(x=>x.id===id); if(bal()<v) return toast('Not enough coins.'); if(!confirm(`Bid ${fmt(v)} coins on ${l.label}? Your coins are held, and come back if someone outbids you.`)) return;
      if(!C().tradeTake([],v)) return toast('Not enough coins.'); const r=await post('/md/bid',{id,pay:v}); if(!r.ok){ C().tradeGive([],v); return toast(r.err==='low'?'Bid at least '+fmt(r.min)+' coins.':r.err==='own'?'You can\'t bid on your own auction.':'Could not bid.'); } toast('🔨 You are the top bidder!'); load(); return; }
    const c=e.target.closest('[data-cancel]'); if(c){ const r=await post('/md/cancel',{id:+c.dataset.cancel}); if(r.ok){ r.kind==='card'?giveCard(r.k):C().tradeGive([r.k],0); toast('↩️ Taken back.'); } else toast(r.err==='bids'?'Auctions with bids can\'t be taken back.':'Could not take it back.'); draw(); } });
  const wait=setInterval(()=>{ if(window.RRCOIN&&RRCOIN.tradeGive){ clearInterval(wait); claims().then(load); setInterval(()=>{ claims(); if(tab==='buy') load(); },45000); } },200);
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
