<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival TV</title>
<style>
:root{--bg:#07070c;--p1:#12121b;--p2:#1b1b28;--line:#262636;--tx:#f2f2f7;--mut:#9a9ab0;--acc:linear-gradient(135deg,#f59e0b,#ec4899 60%,#8b5cf6)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit}
#hd{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--acc);font-style:normal;font-size:17px}
#hd .sp{flex:1}#hd a.b{background:var(--p2);border-radius:18px;padding:8px 14px;font:600 14px system-ui}
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;max-width:1600px;margin:0 auto}
#stage{min-width:0}
#scr{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
#scr iframe,#pl{position:absolute;inset:0;width:100%;height:100%;border:0}
#bug{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:2}
#bug b{background:#e11d48;border-radius:6px;padding:3px 8px;font:800 12px system-ui;letter-spacing:.06em}#bug b::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:6px;animation:bl 1.2s infinite}
#bug span{background:rgba(0,0,0,.6);border-radius:6px;padding:3px 8px;font:700 12px system-ui}
@keyframes bl{50%{opacity:.2}}
#snd{position:absolute;right:12px;bottom:12px;z-index:3;border:0;border-radius:22px;padding:10px 16px;background:var(--acc);color:#fff;font:800 15px system-ui;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#cover{position:absolute;inset:0;z-index:1}
#now{display:flex;gap:14px;align-items:flex-start;margin-top:12px}
#now .ch{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--p2)}
#now h1{margin:0;font:700 19px/1.3 system-ui}#now p{margin:4px 0 0;color:var(--mut);font-size:14px}
#bar{height:4px;background:var(--p2);border-radius:2px;margin-top:10px;overflow:hidden}#bar i{display:block;height:100%;background:var(--acc);width:0}
#next{margin-top:10px;color:var(--mut);font-size:14px}#next b{color:var(--tx)}
#guide{margin-top:18px}#guide h2,#side h2{margin:0 0 10px;font:800 16px system-ui;letter-spacing:.02em}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gc{display:flex;gap:10px;align-items:center;padding:10px;background:var(--p1);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;color:var(--tx);min-width:0}
.gc:hover{border-color:#ec4899}.gc.on{background:var(--p2);border-color:#f59e0b}
.gc .e{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:var(--p2)}
.gc div{min-width:0}.gc b{display:block;font-size:14px}.gc small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side{display:flex;flex-direction:column;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px;height:calc(100vh - 88px);position:sticky;top:16px}
#side h2 small{color:var(--mut);font-weight:600;font-size:12px;margin-left:6px}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px;font-size:14px;line-height:1.35}
#msgs .m b{color:#fbbf24;margin-right:6px}#msgs .m.me b{color:#38bdf8}#msgs .s{color:var(--mut);font-size:12px;text-align:center}
#say{display:flex;gap:8px;margin-top:10px}#say input{flex:1;min-width:0;border:1px solid var(--line);background:#0c0c14;color:var(--tx);border-radius:10px;padding:10px 12px;font-size:14px}
#say button{border:0;border-radius:10px;padding:0 14px;background:var(--acc);color:#fff;font:800 14px system-ui;cursor:pointer}
.emo{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.emo button{border:0;background:var(--p2);border-radius:8px;padding:4px 8px;font-size:16px;cursor:pointer}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
#side{height:calc(100vh - 150px)!important}
@media(max-width:900px){#side{height:340px!important}}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-weight:600}
@media(max-width:900px){#wrap{grid-template-columns:1fr;padding:0 0 16px;gap:0}#scr{border-radius:0}#now,#next,#bar,#guide{margin-left:12px;margin-right:12px}#side{position:static;height:340px;margin:14px 12px 0;order:2}#stage{display:contents}#guide{order:3}#hd a.b{display:none}}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a id="logo" href="tv"><i>📺</i>Rival TV</a><span class="sp"></span><a class="b" href="rivalclips">📱 Rival Clips</a><a class="b" href="./">← Arcade</a></header>
<div id="wrap">
  <div id="stage">
    <div id="scr"><div id="pl"></div><div id="cover"></div><div id="loading">Tuning in…</div><div id="bug"><b>LIVE</b><span id="chn"></span><span id="vw"></span></div><button id="snd">🔊 Tap for sound</button></div>
    <div id="now"><div class="ch" id="nowE"></div><div><h1 id="nowT">&nbsp;</h1><p id="nowB"></p></div></div>
    <div id="bar"><i id="barI"></i></div>
    <div id="next"></div>
    <section id="guide"><h2>📡 Channels</h2><div class="gl" id="gl"></div></section>
  </div>
  <aside id="side"><h2>💬 Live chat<small id="cn"></small></h2><div id="msgs"><div class="s">Say hi to everyone watching!</div></div>
    <form id="say" autocomplete="off"><input id="sayI" maxlength="200" placeholder="Chat with everyone watching…"><button>Send</button></form>
    <div class="emo"></div></aside>
</div>
<script>window.RR_CLIPS=window.RR_CLIPS||[];</script>
<script src="clips-long.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  /* channels: one per video category, plus a mix of everything */
  const CH=[['mix','📺','Rival Mix',null],['nba','🏀','NBA TV','🏀 NBA'],['baseball','⚾','Baseball TV','⚾ Baseball'],['sports','⚽','Sports TV','⚽ Sports'],['gaming','🎮','Gaming TV','🎮 Gaming'],['science','🔬','Science TV','🔬 Science'],['animals','🐾','Animal TV','🐾 Animal'],['funny','😂','Funny TV','😂 Comedy'],['builds','🧱','Builds TV','🧱 LEGO & builds'],['food','🍳','Food TV','🍳 Food'],['satisfying','✨','Satisfying TV','✨ Satisfying'],['cars','🚗','Cars TV','🚗 Cars & machines'],['music','🎵','Music TV','🎵 Music'],['world','🌍','World TV','🌍 World & travel'],['magic','🎩','Magic TV','🎩 Magic & tricks'],['art','🎨','Art TV','🎨 Art & DIY']];
  const V=(window.RR_CLIPS||[]).filter(c=>c.d>=75&&c.d<=1200&&c.yt).sort((a,b)=>a.yt<b.yt?-1:1);
  /* the same shuffle for everyone, new each day (UTC), so every viewer sees the same thing at the same second */
  const DAY=864e5; const rng=seed=>{ let s=seed>>>0; return ()=>{ s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5>>>0; s^=s+Math.imul(s^s>>>7,61|s); return ((s^s>>>14)>>>0)/4294967296; }; };
  const hs=str=>{ let h=2166136261; for(const c of str) h=Math.imul(h^c.charCodeAt(0),16777619); return h>>>0; };
  const cache={};
  function list(ch,day){ const k=ch[0]+day; if(cache[k]) return cache[k]; const L=V.filter(c=>!ch[3]||c.cat===ch[3]); const r=rng(hs(k)); const A=L.slice(); for(let i=A.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [A[i],A[j]]=[A[j],A[i]]; }
    let t=0; const P=[]; for(const c of A){ P.push([t,c]); t+=c.d; if(t>DAY/1000+3600) break; } P.total=t; return cache[k]=P; }
  function at(ch,now){ const day=Math.floor(now/DAY), P=list(ch,day); if(!P.length) return null; let t=(now-day*DAY)/1000; if(P.total) t%=P.total;
    let lo=0, hi=P.length-1; while(lo<hi){ const m=(lo+hi+1)>>1; if(P[m][0]<=t) lo=m; else hi=m-1; } const [st,c]=P[lo]; return {c,off:t-st,left:c.d-(t-st),next:P[lo+1]?P[lo+1][1]:P[0][1],i:lo,P}; }
  let cur=CH[0], skip={}, player=null, apiReady=false, timer=null, sound=false, nowItem=null;
  try{ const q=new URLSearchParams(location.search).get('c'); const f=CH.find(c=>c[0]===q); if(f) cur=f; sound=localStorage.getItem('rrTvSound')==='1'; }catch(e){}
  const fmt=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  function guide(){ const now=Date.now(); $('gl').innerHTML=CH.map(c=>{ const x=at(c,now); return `<button class="gc${c===cur?' on':''}" data-c="${c[0]}"><span class="e">${c[1]}</span><div><b>${c[2]}</b><small>${x?esc(x.c.title):'Off air'}</small></div></button>`; }).join(''); }
  function tune(){ const now=Date.now(); let x=at(cur,now); if(!x){ $('loading').textContent='This channel is off air right now.'; return; }
    /* a video that wouldn't play is skipped for this viewer until the next one starts */
    let guard=0; while(skip[x.c.yt]&&guard++<20){ const t2=now+(x.left+1)*1000; x=at(cur,t2); x.off=0; x.left=x.c.d; }
    nowItem=x; $('chn').textContent=cur[1]+' '+cur[2]; $('nowE').textContent=cur[1]; $('nowT').textContent=x.c.title; $('nowB').textContent=(x.c.by||'')+' · on Rival TV';
    $('next').innerHTML=`Up next: <b>${esc(x.next.title)}</b> in ${fmt(x.left)}`; document.title=cur[2]+' · Rival TV';
    const vars={autoplay:1,controls:0,disablekb:1,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,start:Math.floor(x.off),mute:sound?0:1,origin:location.origin};
    if(player&&player.loadVideoById){ player.loadVideoById({videoId:x.c.yt,startSeconds:Math.floor(x.off)}); if(sound) player.unMute(); else player.mute(); }
    else if(apiReady){ player=new YT.Player('pl',{host:'https://www.youtube-nocookie.com',videoId:x.c.yt,playerVars:vars,events:{onReady:e=>{ $('loading').style.display='none'; sound?e.target.unMute():e.target.mute(); e.target.playVideo(); },onError:()=>{ skip[nowItem.c.yt]=1; tune(); },onStateChange:e=>{ if(e.data===1) $('loading').style.display='none'; }}}); }
    clearTimeout(timer); timer=setTimeout(tune,Math.max(1,x.left)*1000+400); guide(); }
  setInterval(()=>{ if(!nowItem) return; const x=at(cur,Date.now()); if(!x) return; $('barI').style.width=(100*x.off/x.c.d).toFixed(1)+'%'; if(nowItem.c.yt===x.c.yt) $('next').innerHTML=`Up next: <b>${esc(x.next.title)}</b> in ${fmt(x.left)}`; },1000);
  /* every few minutes, re-sync in case the tab was asleep */
  setInterval(()=>{ if(player&&player.getCurrentTime&&nowItem){ const x=at(cur,Date.now()); if(x&&x.c.yt===nowItem.c.yt&&Math.abs(player.getCurrentTime()-x.off)>8) player.seekTo(Math.floor(x.off),true); else if(x&&x.c.yt!==nowItem.c.yt) tune(); } },60000);
  function setSound(on){ sound=on; try{ localStorage.setItem('rrTvSound',on?'1':'0'); }catch(e){} if(player&&player.unMute){ on?player.unMute():player.mute(); if(on) player.playVideo(); } $('snd').textContent=on?'🔇 Mute':'🔊 Tap for sound'; $('snd').style.opacity=on?'.55':'1'; }
  $('snd').onclick=e=>{ e.stopPropagation(); setSound(!sound); }; $('cover').onclick=()=>setSound(!sound); setSound(sound);
  $('gl').onclick=e=>{ const b=e.target.closest('[data-c]'); if(!b) return; cur=CH.find(c=>c[0]===b.dataset.c); history.replaceState(null,'','tv?c='+cur[0]); seen.clear(); $('msgs').innerHTML='<div class="s">Say hi to everyone watching '+esc(cur[2])+'!</div>'; join(); tune(); if(innerWidth<900) scrollTo({top:0,behavior:'smooth'}); };
  window.onYouTubeIframeAPIReady=()=>{ apiReady=true; tune(); };
  const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  guide(); if(!V.length){ $('loading').textContent='Rival TV is warming up — check back soon.'; }
  /* live chat for this channel (through the site chat, with all its safety filters) */
  const seen=new Set(), me=()=>{ try{ return localStorage.getItem('rrOnlineName')||''; }catch(e){ return ''; } };
  function addMsg(m){ if(seen.has(m.id)) return; seen.add(m.id); const d=document.createElement('div'); d.className='m'+(m.name===me()?' me':''); d.innerHTML=`${m.av&&window.RRAV?`<i style="display:inline-block;width:22px;height:22px;border-radius:50%;overflow:hidden;vertical-align:middle;margin-right:6px">${RRAV.mini(m.av)}</i>`:''}<b>${esc(m.name)}</b>${esc(m.text)}`; const box=$('msgs'), stick=box.scrollTop+box.clientHeight>=box.scrollHeight-40; box.appendChild(d); while(box.children.length>150) box.firstChild.remove(); if(stick) box.scrollTop=box.scrollHeight; }
  let joinedAt=0; function join(){ if(window.RRC&&RRC.ready){ RRC.tvJoin('tv'+cur[0]); joinedAt=Date.now(); } }
  setInterval(()=>{ if(window.RRC&&RRC.ready&&(Date.now()-joinedAt>60000||RRC._tv!=='tv'+cur[0])) join(); },3000);
  addEventListener('rrc-tv',e=>{ const m=e.detail; if(m.room!=='tv'+cur[0]) return; if(m.t==='tvhist'){ (m.list||[]).forEach(addMsg); $('cn').textContent=m.n?`${m.n} watching`:''; $('vw').textContent=m.n?`👀 ${m.n}`:''; } else if(m.m) addMsg(m.m); });
  $('say').onsubmit=e=>{ e.preventDefault(); const t=$('sayI').value.trim(); if(!t) return; if(!(window.RRC&&RRC.ready)){ addMsg({id:'x'+Date.now(),name:'Rival TV',text:'Connecting to chat… try again in a second.'}); return; } RRC.tvSay(t); $('sayI').value=''; };
  document.querySelector('.emo').innerHTML=['🔥','😂','😮','🏀','⚾','👏','💯','GG'].map(x=>`<button type="button">${x}</button>`).join('');
  document.querySelector('.emo').onclick=e=>{ const b=e.target.closest('button'); if(b&&window.RRC&&RRC.ready) RRC.tvSay(b.textContent); };
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
