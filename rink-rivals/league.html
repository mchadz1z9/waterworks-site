<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival League</title>
<style>
:root{--bg:#060a08;--p1:#0e1612;--p2:#16231c;--line:#223428;--tx:#effaf3;--mut:#93b09f;--acc:linear-gradient(135deg,#16a34a,#84cc16);--gold:#facc15}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.bk{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:800 19px system-ui}
#hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:1100px;margin:0 auto}
#logo{display:flex;align-items:center;gap:8px;font:900 21px system-ui}#logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font-style:normal}
main{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.card h3{margin:0 0 10px;font:800 17px system-ui}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{border:1px solid var(--line);background:#09110d;color:var(--tx);border-radius:10px;padding:10px 12px;font-size:15px;min-width:0}
.btn{border:0;border-radius:12px;padding:11px 16px;font:900 15px system-ui;background:var(--acc);color:#052e16}.btn.g{background:var(--p2);color:var(--tx)}.btn.r{background:#dc2626;color:#fff}
.note{color:var(--mut);font-size:14px}
.lgl{display:grid;gap:10px}.lgi{display:flex;align-items:center;gap:12px;background:var(--p2);border-radius:12px;padding:12px 14px}.lgi b{flex:1}.pill{font:800 12px system-ui;border-radius:999px;padding:3px 10px;background:#22c55e22;color:#86efac}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.top h2{margin:0;font:900 24px system-ui;flex:1}.code{font:900 18px ui-monospace,monospace;letter-spacing:.15em;background:var(--p2);border-radius:10px;padding:6px 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:var(--p1);color:var(--tx);border-radius:999px;padding:8px 14px;font:700 14px system-ui}.tabs button.on{background:var(--acc);color:#052e16;border-color:transparent}
.pl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line)}.pl:first-child{border:0}.pl .nm{flex:1;min-width:0}.pl .nm b{display:block}.pl .nm small{color:var(--mut);font-size:12px}
.ov{font:900 18px system-ui;min-width:38px;text-align:center;border-radius:8px;padding:2px 4px;background:var(--p2)}.ov.hi{background:#facc1533;color:var(--gold)}
.pos{font:800 11px system-ui;border-radius:6px;padding:2px 6px;background:#0ea5e933;color:#7dd3fc}
.kid{font:800 10px system-ui;color:#fda4af;margin-left:4px}
.turn{font:900 18px system-ui;padding:12px 14px;border-radius:12px;background:var(--p2);margin-bottom:12px}.turn.me{background:var(--acc);color:#052e16}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);text-align:left;font-size:12px;padding:6px}td{padding:8px 6px;border-top:1px solid var(--line)}td.n{text-align:right}tr.me td{background:#22c55e14}
.gm{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);font-size:14px}.gm:first-child{border:0}.gm .t{flex:1}.gm .t.w{font-weight:900}.gm .s{font:900 16px system-ui;min-width:30px;text-align:center}.gm small{color:var(--mut)}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.slot:first-child{border:0}.slot>b{width:44px}.slot select{flex:1}
.champ{text-align:center;padding:24px;border-radius:16px;background:linear-gradient(135deg,#713f12,#facc15 50%,#713f12);color:#1c1917;font:900 22px system-ui;margin-bottom:14px}
#btnKeys,#rrEmoB,#rrPhotoB,#rrGC,#rrTourBtn{display:none!important}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<i id="arena" hidden></i>
<header id="hd"><a class="bk" href="./" title="Back" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}">←</a><a id="logo" href="league"><i>🏈</i>Rival League</a></header>
<main id="main"><div class="note">Loading…</div></main>
<script>
(function(){
  const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SRV=(()=>{ try{ if(localStorage.getItem('rrSrv')==='relay') return location.origin+'/rr'; }catch(e){} return 'https://rink-rivals-rooms.mitchellchad2026.workers.dev'; })();
  const pid=()=>{ try{ let p=localStorage.getItem('rrPid'); if(!p||p.length<8){ p=Math.random().toString(36).slice(2,14); localStorage.setItem('rrPid',p); } return p; }catch(e){ return ''; } };
  const name=()=>{ try{ return localStorage.getItem('rrOnlineName')||'Player'; }catch(e){ return 'Player'; } };
  const post=(u,b)=>fetch(SRV+u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({pid:pid(),name:name()},b||{}))}).then(r=>r.json()).catch(()=>({err:'net'}));
  const POS=['QB','WR','TE','RB'], SLOTS=['QB','RB','WR','WR','TE'];
  let P=[], code=new URLSearchParams(location.search).get('c')||'', L=null, tab='team', timer=null, filt='ALL', q='', trade={to:-1,give:[],get:[]};
  const ovr=i=>Math.max(...P[i].slice(1,5)), pos=i=>{ const p=P[i]; let b=0; for(let k=1;k<4;k++) if(p[k+1]>p[b+1]) b=k; return POS[b]; }, rate=(i,ps)=>P[i][1+POS.indexOf(ps)];
  const plRow=(i,extra)=>`<div class="pl"><span class="ov${ovr(i)>=95?' hi':''}">${ovr(i)}</span><div class="nm"><b>${esc(P[i][0])}${P[i][5]==='k'?'<span class="kid">⭐ classmate</span>':''}</b><small>QB ${P[i][1]} · WR ${P[i][2]} · TE ${P[i][3]} · RB ${P[i][4]}</small></div><span class="pos">${pos(i)}</span>${extra||''}</div>`;
  const fmtT=ms=>{ ms=Math.max(0,ms); const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000); return h?`${h}h ${m}m`:`${m}m`; };
  async function home(){ const d=await post('/lg/my'); const my=(d&&d.leagues)||[];
    $('main').innerHTML=`<div class="card"><h3>🏈 Your leagues</h3>${my.length?`<div class="lgl">${my.map(l=>`<a class="lgi" href="league?c=${l.code}"><b>${esc(l.name)}</b><span class="pill">${{lobby:'Waiting to start',draft:'Drafting',season:'Season',playoffs:'Playoffs',done:'Finished'}[l.state]||l.state}</span><span class="note">${l.teams} teams ›</span></a>`).join('')}</div>`:'<p class="note">You\'re not in a league yet. Make one and send the code to your friends, or join theirs.</p>'}</div>
      <div class="grid2"><div class="card"><h3>➕ Make a league</h3><div class="row" style="flex-direction:column;align-items:stretch"><input id="ln" maxlength="30" placeholder="League name (e.g. Lunch Table League)"><input id="tn" maxlength="22" placeholder="Your team name"><button class="btn" id="mk">Create league</button></div></div>
      <div class="card"><h3>🔑 Join with a code</h3><div class="row" style="flex-direction:column;align-items:stretch"><input id="jc" maxlength="6" placeholder="6-letter code" style="text-transform:uppercase;letter-spacing:.2em;font-weight:900"><input id="tn2" maxlength="22" placeholder="Your team name"><button class="btn" id="jn">Join league</button></div></div></div>
      <div class="card"><h3>How it works</h3><p class="note">Draft 7 players from your classmates and real NFL stars in a snake draft. Set a lineup (QB, RB, 2 WR, TE), trade with other managers, and play a short season: a game every 4 hours, then playoffs. Champions win 🪙 500. Empty spots are filled with computer teams.</p></div>`;
    $('mk').onclick=async()=>{ const r=await post('/lg/create',{lname:$('ln').value,team:$('tn').value}); if(r.ok) go(r.code); else alert(r.err==='many'?'You can be in up to 10 leagues.':'Could not make the league.'); };
    $('jn').onclick=async()=>{ const c=$('jc').value.trim().toUpperCase(); if(c.length!==6) return alert('Codes are 6 letters.'); const r=await post('/lg/join',{code:c,team:$('tn2').value}); if(r.ok) go(r.code); else alert({nolg:'No league with that code.',started:'That league already started.',full:'That league is full.'}[r.err]||'Could not join.'); }; }
  function go(c){ code=c; history.pushState(null,'','league?c='+c); load(); }
  async function load(){ clearTimeout(timer); if(!code){ home(); return; } const d=await post('/lg/get',{code}); if(!d||d.err){ $('main').innerHTML=`<div class="card"><p class="note">${d&&d.err==='nolg'?'That league does not exist.':'Could not load the league.'}</p><a class="btn g" href="league">← My leagues</a></div>`; return; }
    L=d; draw(); timer=setTimeout(load,L.state==='draft'?4000:L.state==='lobby'?6000:30000); }
  const tn=i=>L.teams[i]?L.teams[i].name:'?';
  function draw(){ const me=L.me, mine=me>=0?L.teams[me]:null;
    let h=`<div class="top"><h2>${esc(L.name)}</h2><span class="note">Code</span><span class="code">${L.code}</span><button class="btn g" id="cp">🔗 Copy invite</button></div>`;
    if(L.state==='done'){ const c=L.champ; h+=`<div class="champ">🏆 ${esc(tn(c))} are the champions!</div>`; if(c===me){ try{ const k='rrLgChamp_'+L.code; if(!localStorage.getItem(k)){ localStorage.setItem(k,'1'); window.RRCOIN&&RRCOIN.add(500,'Rival League champion'); } }catch(e){} } }
    if(L.state==='lobby') h+=lobby(); else if(L.state==='draft') h+=draft(); else h+=season();
    $('main').innerHTML=h; wire(); }
  function lobby(){ const owner=L.teams[0]&&L.me===0; return `<div class="card"><h3>👥 Teams (${L.teams.length}/10)</h3>${L.teams.map(t=>`<div class="pl"><div class="nm"><b>${esc(t.name)}</b><small>${esc(t.mgr)}</small></div></div>`).join('')}<p class="note">Send friends the code <b>${L.code}</b>. ${owner?'When everyone is in, start the draft. Empty spots become computer teams.':'Waiting for the league maker to start the draft.'}</p>${owner?'<button class="btn" id="st">▶ Start the draft</button>':''}</div>`; }
  function draft(){ const n=L.teams.length, k=L.picks.length, rd=Math.floor(k/n), idx=rd%2?n-1-(k%n):k%n, myTurn=idx===L.me; const taken=new Set(L.picks.map(p=>p.i));
    const avail=P.map((_,i)=>i).filter(i=>!taken.has(i)&&(filt==='ALL'||pos(i)===filt)&&(!q||P[i][0].toLowerCase().includes(q))).sort((a,b)=>ovr(b)-ovr(a)).slice(0,80);
    const left=6*3600000-(L.now-(L.turnAt||L.now));
    return `<div class="turn${myTurn?' me':''}">${myTurn?'🟢 Your pick! Choose a player below.':`⏳ ${esc(tn(idx))} is picking… (round ${rd+1} of 7)`}<div style="font:600 13px system-ui;opacity:.8">Pick ${k+1} of ${n*7} · auto-pick in ${fmtT(left)}</div></div>
      <div class="grid2"><div class="card"><h3>🔎 Players</h3><div class="row" style="margin-bottom:8px">${['ALL',...POS].map(p=>`<button class="btn g" data-f="${p}" style="${p===filt?'outline:2px solid #84cc16':''};padding:7px 12px">${p}</button>`).join('')}<input id="sq" placeholder="Search" value="${esc(q)}" style="flex:1"></div>
        <div style="max-height:520px;overflow:auto">${avail.map(i=>plRow(i,myTurn?`<button class="btn" data-pick="${i}" style="padding:7px 12px">Draft</button>`:'')).join('')}</div></div>
      <div><div class="card"><h3>🧢 My team</h3>${L.me>=0&&L.teams[L.me].roster.length?L.teams[L.me].roster.map(i=>plRow(i)).join(''):'<p class="note">No players yet.</p>'}</div>
        <div class="card"><h3>📋 Draft board</h3><div style="max-height:300px;overflow:auto">${L.picks.slice().reverse().map((p,j)=>`<div class="pl"><small class="note">#${L.picks.length-j}</small><div class="nm"><b>${esc(P[p.i][0])}</b><small>${esc(tn(p.t))}${p.auto?' · auto':''}</small></div><span class="pos">${pos(p.i)}</span></div>`).join('')||'<p class="note">No picks yet.</p>'}</div></div></div></div>`; }
  function season(){ const T=L.table||[]; const tabs=[['team','🧢 My team'],['games','📅 Games'],['table','📊 Standings'],['trade','🔁 Trades']];
    let h=`<div class="tabs">${tabs.map(([k,t])=>`<button data-t="${k}" class="${k===tab?'on':''}">${t}</button>`).join('')}</div>`;
    const next=L.games.filter(g=>!g.done).sort((a,b)=>a.at-b.at)[0];
    if(next) h+=`<p class="note">⏱️ Next games in <b>${fmtT(next.at-L.now)}</b>${next.po?` · ${next.po}`:''}</p>`;
    if(tab==='team'){ if(L.me<0) return h+'<div class="card"><p class="note">You are watching this league.</p></div>'; const t=L.teams[L.me];
      h+=`<div class="grid2"><div class="card"><h3>🏟️ Starting lineup</h3>${SLOTS.map((s,k)=>`<div class="slot"><b>${s}</b><select data-slot="${k}">${t.roster.map(i=>`<option value="${i}" ${t.line[k]===i?'selected':''}>${esc(P[i][0])} · ${s} ${rate(i,s)}</option>`).join('')}</select></div>`).join('')}<button class="btn" id="sv" style="margin-top:10px">💾 Save lineup</button><p class="note" id="svm"></p></div>
        <div class="card"><h3>🧢 Roster</h3>${t.roster.map(i=>plRow(i)).join('')}</div></div>`; }
    if(tab==='games'){ const R={}; for(const g of L.games){ const k=g.po||('Week '+(g.r+1)); (R[k]=R[k]||[]).push(g); }
      h+=Object.entries(R).map(([k,G])=>`<div class="card"><h3>${esc(k)} <small class="note">${G[0].done?'':new Date(G[0].at).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}</small></h3>${G.map(g=>`<div class="gm"><span class="t${g.done&&g.sa>g.sb?' w':''}">${esc(tn(g.a))}</span><span class="s">${g.done?g.sa:'–'}</span><span class="s">${g.done?g.sb:'–'}</span><span class="t${g.done&&g.sb>g.sa?' w':''}" style="text-align:right">${esc(tn(g.b))}</span></div>${g.done&&g.star?`<div class="note" style="padding:0 10px 8px">⭐ ${esc(g.star[g.sa>g.sb?0:1].n)} led the way</div>`:''}`).join('')}</div>`).join(''); }
    if(tab==='table') h+=`<div class="card"><table><tr><th>#</th><th>Team</th><th class="n">W</th><th class="n">L</th><th class="n">PF</th><th class="n">PA</th></tr>${T.map((r,k)=>`<tr class="${r.i===L.me?'me':''}"><td>${k+1}</td><td><b>${esc(tn(r.i))}</b> <small class="note">${esc(L.teams[r.i].mgr)}</small></td><td class="n">${r.w}</td><td class="n">${r.l}</td><td class="n">${r.pf}</td><td class="n">${r.pa}</td></tr>`).join('')}</table><p class="note">Top 4 make the playoffs.</p></div>`;
    if(tab==='trade'){ if(L.me<0) return h; const open=L.trades.filter(x=>x.st==='open'&&(x.to===L.me||x.from===L.me)), past=L.trades.filter(x=>x.st!=='open'&&(x.to===L.me||x.from===L.me)).slice(-8).reverse();
      const names=a=>a.map(i=>esc(P[i][0])).join(', ');
      h+=`<div class="card"><h3>📨 Trade offers</h3>${open.length?open.map(x=>`<div class="pl"><div class="nm"><b>${x.from===L.me?'You → '+esc(tn(x.to)):esc(tn(x.from))+' → you'}</b><small>${x.from===L.me?'You give':'They give'}: ${names(x.from===L.me?x.give:x.give)} · ${x.from===L.me?'you get':'you give'}: ${names(x.get)}</small></div>${x.to===L.me?`<button class="btn" data-ans="${x.id}" data-ok="1">Accept</button><button class="btn r" data-ans="${x.id}" data-ok="0">No</button>`:`<button class="btn g" data-cancel="${x.id}">Cancel</button>`}</div>`).join(''):'<p class="note">No open offers.</p>'}
        ${past.length?`<p class="note" style="margin-top:10px">Recent: ${past.map(x=>`${esc(tn(x.from))} ↔ ${esc(tn(x.to))} ${x.st==='yes'?'✅':x.st==='no'?'❌':'↩️'}`).join(' · ')}</p>`:''}</div>
        <div class="card"><h3>🔁 Make a trade</h3><div class="row"><select id="tto"><option value="-1">Pick a team…</option>${L.teams.map((t,i)=>i===L.me?'':`<option value="${i}" ${i===trade.to?'selected':''}>${esc(t.name)}${t.cpu?' (CPU)':''}</option>`).join('')}</select></div>
        ${trade.to>=0?`<div class="grid2" style="margin-top:10px"><div><b>You give</b>${L.teams[L.me].roster.map(i=>`<label class="pl"><input type="checkbox" data-give="${i}" ${trade.give.includes(i)?'checked':''}><div class="nm"><b>${esc(P[i][0])}</b></div><span class="ov">${ovr(i)}</span></label>`).join('')}</div><div><b>You get</b>${L.teams[trade.to].roster.map(i=>`<label class="pl"><input type="checkbox" data-get="${i}" ${trade.get.includes(i)?'checked':''}><div class="nm"><b>${esc(P[i][0])}</b></div><span class="ov">${ovr(i)}</span></label>`).join('')}</div></div><button class="btn" id="tsend" style="margin-top:10px">Send offer</button><p class="note">Computer teams answer right away and only take fair trades.</p>`:''}</div>`; }
    return h; }
  function wire(){ const cp=$('cp'); if(cp) cp.onclick=()=>{ const u=location.origin+'/league?c='+L.code; (navigator.clipboard?navigator.clipboard.writeText(`Join my Rival League! Code ${L.code}: ${u}`):Promise.reject()).then(()=>cp.textContent='✅ Copied').catch(()=>prompt('Send this to friends:',u)); };
    const st=$('st'); if(st) st.onclick=async()=>{ const r=await post('/lg/start',{code}); if(r.err) alert('Could not start.'); load(); };
    const sq=$('sq'); if(sq){ sq.oninput=()=>{ q=sq.value.toLowerCase(); const p=sq.selectionStart; draw(); const s2=$('sq'); s2.focus(); s2.setSelectionRange(p,p); }; }
    const sv=$('sv'); if(sv) sv.onclick=async()=>{ const line=[...document.querySelectorAll('[data-slot]')].map(s=>+s.value); if(new Set(line).size!==5){ $('svm').textContent='Each player can only be in one spot.'; return; } const r=await post('/lg/lineup',{code,line}); $('svm').textContent=r.err?'Could not save.':'✅ Lineup saved!'; if(!r.err) L=r; };
    const tto=$('tto'); if(tto) tto.onchange=()=>{ trade={to:+tto.value,give:[],get:[]}; draw(); };
    const ts=$('tsend'); if(ts) ts.onclick=async()=>{ if(!trade.give.length||!trade.get.length) return alert('Pick at least one player on each side.'); const r=await post('/lg/trade',{code,to:trade.to,give:trade.give,get:trade.get}); if(r.err) return alert('That trade is not allowed.'); L=r; const last=L.trades[L.trades.length-1]; if(last.st==='yes') alert('✅ Trade accepted!'); else if(last.st==='no') alert('❌ They said no. Try offering more.'); trade={to:-1,give:[],get:[]}; draw(); }; }
  document.addEventListener('click',async e=>{ const t=e.target.closest('[data-t]'); if(t){ tab=t.dataset.t; draw(); return; }
    const f=e.target.closest('[data-f]'); if(f){ filt=f.dataset.f; draw(); return; }
    const p=e.target.closest('[data-pick]'); if(p){ p.disabled=true; const r=await post('/lg/pick',{code,player:+p.dataset.pick}); if(r.err) alert(r.err==='turn'?'It is not your turn.':'That player was just taken.'); else { L=r; draw(); } return; }
    const a=e.target.closest('[data-ans]'); if(a){ const r=await post('/lg/answer',{code,id:+a.dataset.ans,ok:a.dataset.ok==='1'}); if(!r.err){ L=r; draw(); } return; }
    const c=e.target.closest('[data-cancel]'); if(c){ const r=await post('/lg/answer',{code,id:+c.dataset.cancel,cancel:1}); if(!r.err){ L=r; draw(); } return; } });
  document.addEventListener('change',e=>{ const g=e.target.closest('[data-give]'), h=e.target.closest('[data-get]'); if(g){ const i=+g.dataset.give; trade.give=g.checked?[...new Set(trade.give.concat(i))].slice(0,3):trade.give.filter(x=>x!==i); } if(h){ const i=+h.dataset.get; trade.get=h.checked?[...new Set(trade.get.concat(i))].slice(0,3):trade.get.filter(x=>x!==i); } });
  addEventListener('popstate',()=>{ code=new URLSearchParams(location.search).get('c')||''; load(); });
  fetch(SRV+'/lg/pool').then(r=>r.json()).then(d=>{ P=d.pool||[]; load(); }).catch(()=>{ $('main').innerHTML='<div class="card"><p class="note">Could not reach the league server.</p></div>'; });
})();
</script>
<script src="online.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
