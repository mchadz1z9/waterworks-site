<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rink Rivals - 82-0</title>
<meta name="description" content="82-0: roll real NBA, NHL and MLB players, draft a team position by position, then play the full season and the playoffs game by game. Chase 82-0 in basketball and hockey, or 162-0 in baseball.">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060c;--panel:rgba(13,19,33,.82);--panel2:rgba(7,11,21,.78);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--text:#f2f5fb;--muted:#9ba8bf;--acc:#ff7a18;--acc2:#ffd166;--good:#4ade80;--bad:#f87171;--gold:#fbbf24;--glow:rgba(255,122,24,.35)}
body[data-sport=hk]{--acc:#4fd1ff;--acc2:#c3f0ff;--glow:rgba(79,209,255,.35)} body[data-sport=mb]{--acc:#ff4d5e;--acc2:#ffd0d4;--glow:rgba(255,77,94,.33)}
body[data-sport=nhl]{--acc:#4fd1ff;--acc2:#c3f0ff;--glow:rgba(79,209,255,.35)} body[data-sport=mlb]{--acc:#ff4d5e;--acc2:#ffd0d4;--glow:rgba(255,77,94,.33)} body[data-sport=nfl]{--acc:#7ee06d;--acc2:#e2ffd9;--glow:rgba(126,224,109,.32)} body[data-sport=soc]{--acc:#c084fc;--acc2:#f0dcff;--glow:rgba(192,132,252,.33)}
*{box-sizing:border-box} html{background:var(--bg)} body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
/* ---- the arena ---- */
.arena{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,#1b2747 0%,#0a0f1e 45%,#04060c 80%)}
.arena .floor{position:absolute;left:-20%;right:-20%;bottom:-38vh;height:70vh;background:radial-gradient(50% 50% at 50% 50%,var(--glow),transparent 70%);filter:blur(10px);opacity:.75}
.arena .beam{position:absolute;top:-30vh;width:46vw;height:150vh;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 55%,transparent 80%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(6px);mix-blend-mode:screen;transform-origin:50% 0;opacity:.55}
.arena .b1{left:2vw;animation:sweep 11s ease-in-out infinite alternate} .arena .b2{right:2vw;animation:sweep 13s ease-in-out -4s infinite alternate-reverse}
.arena .b3{left:27vw;width:46vw;opacity:.28;background:linear-gradient(180deg,var(--glow),transparent 70%);animation:sweep 17s ease-in-out -7s infinite alternate}
@keyframes sweep{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.arena .crowd{position:absolute;left:0;right:0;bottom:0;height:46vh;opacity:.55;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.6px),radial-gradient(circle,rgba(255,220,160,.5) 0 1px,transparent 1.6px);background-size:38px 26px,57px 33px;background-position:0 0,19px 11px;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);animation:flick 2.6s steps(2) infinite}
@keyframes flick{50%{opacity:.35;background-position:6px 2px,13px 15px}}
.arena .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent)}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:12px 16px 70px}
/* ---- header ---- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font:900 26px 'Big Shoulders Display',sans-serif;letter-spacing:.02em;display:flex;align-items:center;gap:10px} .brand span{color:var(--acc);text-shadow:0 0 18px var(--glow)}
.brand .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 10px #ef4444;animation:live 1.4s ease-in-out infinite} @keyframes live{50%{opacity:.25}}
.nav{display:flex;flex-wrap:wrap;gap:6px} .nav a,.nav button{font:700 14px 'DM Sans',sans-serif;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:999px;padding:7px 13px;text-decoration:none;cursor:pointer;backdrop-filter:blur(6px)} .nav a:hover,.nav button:hover{border-color:var(--acc)}
.jumbo{position:relative;border-radius:22px;padding:20px 22px;margin-bottom:14px;overflow:hidden;background:linear-gradient(135deg,rgba(20,30,56,.92),rgba(8,12,24,.92));border:1px solid var(--line2);box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.jumbo::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.07) 0 .8px,transparent 1.2px);background-size:5px 5px;pointer-events:none}
.jumbo::after{content:'';position:absolute;top:-50%;left:-30%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:rotate(18deg);animation:glint 7s ease-in-out infinite;pointer-events:none}
@keyframes glint{0%,60%{left:-40%}100%{left:130%}}
.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:800;color:var(--acc2);opacity:.9}
h1{margin:4px 0 6px;font:900 clamp(44px,8vw,74px)/.95 'Big Shoulders Display',sans-serif;letter-spacing:.01em;background:linear-gradient(180deg,#fff 30%,var(--acc) 140%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px var(--glow))}
h2{margin:0 0 10px;font:800 28px 'Big Shoulders Display',sans-serif} h3{margin:0;font:800 32px/1.05 'Big Shoulders Display',sans-serif}
p{line-height:1.5} .muted{color:var(--muted)} .display{font-family:'Big Shoulders Display',sans-serif}
.lede{max-width:780px;margin:0 0 12px;color:#c9d3e6}
/* sport picker */
.sports{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 12px} @media(max-width:620px){.sports{grid-template-columns:1fr}}
.sports button{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;transition:transform .18s,border-color .18s,background .18s;font:inherit}
.sports button:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.35)} .sports button .e{font-size:34px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.sports button b{display:block;font:900 26px/1 'Big Shoulders Display',sans-serif} .sports button small{color:var(--muted);font-size:12px}
.sports button.on{border-color:var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,transparent),rgba(255,255,255,.03));box-shadow:0 0 0 1px var(--c),0 10px 30px color-mix(in srgb,var(--c) 30%,transparent)}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center} .pills button{font:800 15px 'Big Shoulders Display',sans-serif;border-radius:999px;padding:6px 13px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:#fff;cursor:pointer} .pills button.on{background:var(--acc);border-color:var(--acc);color:#0b0f1a}
.pills .lbl{font:800 12px 'DM Sans',sans-serif;text-transform:uppercase;color:var(--muted);letter-spacing:.1em;margin:0 2px 0 8px} .pills .lbl:first-child{margin-left:0}
/* layout */
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr);gap:16px} @media(max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);padding:16px;backdrop-filter:blur(10px)}
.panel.stage{background:linear-gradient(160deg,rgba(24,34,62,.88),rgba(9,13,26,.9));min-height:300px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .between{justify-content:space-between}
button{font-family:inherit} .btn{font:800 18px 'Big Shoulders Display',sans-serif;letter-spacing:.03em;border-radius:12px;padding:10px 18px;border:1px solid var(--line2);background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;transition:transform .15s,filter .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.12)} .btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--acc2),var(--acc));border-color:var(--acc);color:#0b0f1a;box-shadow:0 6px 22px var(--glow)} .btn.gold{background:linear-gradient(180deg,#ffe08a,#f59e0b);border-color:#f59e0b;color:#111}
kbd{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:1px 6px;font-size:12px;font-family:'DM Sans',sans-serif} .btn.primary kbd,.btn.gold kbd{border-color:rgba(0,0,0,.3);color:inherit}
#notice{min-height:24px;font-weight:700;color:var(--acc2);margin:2px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;background:rgba(255,255,255,.07);border:1px solid var(--line2);cursor:pointer;color:var(--text);transition:transform .12s} .chip:hover{transform:translateY(-1px);border-color:var(--acc)} .chip b{color:var(--acc2)}
.tag{display:inline-block;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800;margin:2px} .tag.g{background:rgba(34,197,94,.18);color:#bbf7d0;border:1px solid rgba(34,197,94,.35)} .tag.b{background:rgba(239,68,68,.16);color:#fecaca;border:1px solid rgba(239,68,68,.35)}
/* ---- portraits ---- */
.pt{position:relative;flex:none;width:132px;height:132px;border-radius:16px;overflow:hidden;background:radial-gradient(85% 70% at 50% 30%,color-mix(in srgb,var(--tp) 75%,#fff 8%),color-mix(in srgb,var(--tp) 45%,#05070d) 60%,#05070d);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pt::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.14),transparent 40%)}
.pt svg{position:absolute;inset:0;width:100%;height:100%} .pt.sm{width:42px;height:42px;border-radius:10px} .pt.xs{width:30px;height:30px;border-radius:8px} .pt.md{width:74px;height:74px;border-radius:14px}
/* ---- the card ---- */
.reveal{position:relative;perspective:1100px;min-height:250px}
.pcard{--rc:#cbd5e1;--rc2:#64748b;position:relative;border-radius:20px;padding:3px;background:linear-gradient(135deg,var(--rc),var(--rc2) 45%,var(--rc) 70%,var(--rc2));box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 40px color-mix(in srgb,var(--rc) 35%,transparent);transform-origin:50% 60%}
.pcard .in{position:relative;border-radius:17px;padding:14px;background:linear-gradient(160deg,#141d33,#0a0f1d 70%);overflow:hidden}
.pcard .in::before{content:'';position:absolute;inset:0;background:radial-gradient(60% 50% at 15% 10%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 70%);pointer-events:none}
.r-bronze{--rc:#e09a6b;--rc2:#7a4426} .r-silver{--rc:#eef2f7;--rc2:#7c8796} .r-gold{--rc:#ffe08a;--rc2:#b7791f} .r-elite{--rc:#c4b5fd;--rc2:#2563eb} .r-legend{--rc:#ff7ab6;--rc2:#ffb627}
.r-mystery{--rc:#475569;--rc2:#1e293b}
.r-legend{background:linear-gradient(115deg,#ff5d8f,#ffb627,#7cf2ff,#b388ff,#ff5d8f);background-size:300% 300%;animation:holo 4s linear infinite} @keyframes holo{to{background-position:300% 0}}
.r-elite .in::after,.r-legend .in::after{content:'';position:absolute;top:-60%;left:-60%;width:50%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:rotate(20deg);animation:glint 3.6s ease-in-out infinite;pointer-events:none}
.ch{display:flex;gap:14px;align-items:flex-start;position:relative} .ch .meta{flex:1;min-width:0}
.ch h3{font-size:clamp(26px,4.6vw,36px);overflow-wrap:anywhere}
.ovr{flex:none;text-align:center;border-radius:14px;padding:6px 12px;background:linear-gradient(180deg,var(--rc),var(--rc2));color:#0b0f1a;box-shadow:0 6px 20px rgba(0,0,0,.4)} .ovr b{display:block;font:900 40px/1 'Big Shoulders Display',sans-serif} .ovr span{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}
.rar{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--rc)} .icon{background:linear-gradient(90deg,#ff5d8f,#ffb627);color:#111;border-radius:6px;padding:1px 6px;letter-spacing:.1em}
.sk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px;position:relative} @media(max-width:480px){.sk{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}}
.sk .s{background:rgba(255,255,255,.05);border-radius:10px;padding:6px 4px 5px;text-align:center;border:1px solid transparent} .sk .s.hot{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.sk .s span{display:block;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.06em} .sk .s b{display:block;font:800 21px/1.1 'Big Shoulders Display',sans-serif}
.sk .s i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:3px;overflow:hidden} .sk .s em{display:block;height:100%;background:var(--acc)}
.t-legend{color:#ff8fbf}.t-elite{color:#c4b5fd}.t-gold{color:#fcd34d}.t-silver{color:#e2e8f0}.t-bronze{color:#e8a77a}.t-x{color:var(--muted)}
/* the pack */
.pack{width:min(250px,70%);aspect-ratio:3/4;margin:6px auto;border-radius:18px;position:relative;background:linear-gradient(135deg,#283a66,#0f1730 50%,#283a66);border:2px solid rgba(255,255,255,.25);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 50px var(--glow);display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;animation:shake .5s ease-in-out both}
.pack::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.18),transparent 30%,var(--glow),transparent 60%);animation:spin 1.2s linear infinite}
.pack .logo{position:relative;font:900 44px 'Big Shoulders Display',sans-serif;color:#fff;text-shadow:0 0 18px var(--glow)} .pack .e{position:relative;font-size:56px}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes shake{0%{transform:scale(.8) rotate(0)}20%{transform:scale(1) rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-4deg) scale(1.03)}80%{transform:rotate(4deg) scale(1.05)}100%{transform:rotate(0) scale(1.08)}}
.burst{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center} .burst::before{content:'';width:40px;height:40px;border-radius:50%;background:var(--bc);box-shadow:0 0 80px 40px var(--bc);animation:burst .55s ease-out forwards} @keyframes burst{to{transform:scale(9);opacity:0}}
.flip{animation:flipIn .55s cubic-bezier(.2,1.4,.4,1) both} @keyframes flipIn{from{transform:rotateY(95deg) scale(.85);opacity:.2}to{transform:none;opacity:1}}
.enter{animation:enter .35s ease-out both} @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.flashFx{position:fixed;inset:0;z-index:9400;pointer-events:none;background:radial-gradient(circle at 50% 40%,var(--fc),transparent 65%);animation:fl .7s ease-out forwards;mix-blend-mode:screen} @keyframes fl{from{opacity:.75}to{opacity:0}}
/* roster slots */
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{position:relative;display:flex;gap:9px;align-items:center;background:rgba(255,255,255,.035);border:1px dashed rgba(255,255,255,.16);border-radius:14px;padding:7px 9px;min-height:58px;text-align:left;color:var(--text);cursor:default;font:inherit;transition:transform .15s,background .15s}
.slot .ph{flex:none;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:900 15px 'Big Shoulders Display',sans-serif;color:var(--muted);background:rgba(255,255,255,.05)}
.slot .tx{min-width:0;flex:1} .slot .p{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.12em} .slot .n{font-weight:800;font-size:14px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.slot .r{font:900 24px 'Big Shoulders Display',sans-serif;flex:none}
.slot.can{border:2px solid var(--acc);cursor:pointer;background:color-mix(in srgb,var(--acc) 14%,transparent);animation:pulseB 1.2s ease-in-out infinite} .slot.can:hover{transform:translateY(-1px)} @keyframes pulseB{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}}
.slot.filled{border-style:solid;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06)} .slot.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.9);background:color-mix(in srgb,var(--acc) 35%,transparent)}100%{transform:none}}
.sub{grid-column:1/-1;margin-top:4px}
/* scoreboard */
.board{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.led{font:900 clamp(58px,11vw,96px)/.9 'Big Shoulders Display',sans-serif;color:var(--acc);text-shadow:0 0 22px var(--glow),0 0 2px #fff;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.big{font:900 64px/1 'Big Shoulders Display',sans-serif;color:var(--acc);text-shadow:0 0 18px var(--glow)}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 12px var(--glow);transition:width .2s}
.log{max-height:240px;overflow:auto;font-size:14px;background:var(--panel2);border-radius:12px;padding:8px 10px;border:1px solid var(--line)} .log div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums} .w{color:#86efac} .l{color:#fca5a5} .o{color:#fcd34d}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:13px} @media(max-width:560px){.bracket{grid-template-columns:repeat(2,minmax(0,1fr))}}
.series{background:var(--panel2);border-radius:12px;padding:8px;border:1px solid var(--line)} .series b{color:var(--acc2)} .series.won{border-color:rgba(74,222,128,.5)} .series.lost{border-color:rgba(248,113,113,.5)} .series.live{border-color:var(--acc)}
.banner{position:relative;margin-top:12px;text-align:center;border-radius:18px;padding:16px;overflow:hidden;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.01))}
.banner.champ{background:linear-gradient(135deg,rgba(251,191,36,.28),rgba(244,114,182,.15));border-color:rgba(251,191,36,.6);box-shadow:0 0 50px rgba(251,191,36,.25)}
.banner .trophy{font-size:54px;filter:drop-shadow(0 6px 16px rgba(251,191,36,.6))}
table.box{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums} table.box td,table.box th{padding:5px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle} table.box th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
table.box td,table.box th{white-space:nowrap} .grid2.res{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)} @media(max-width:1180px){.grid2.res{grid-template-columns:minmax(0,1fr)}.grid2.res .log{max-height:200px}}
table.box td.pl{display:flex;gap:8px;align-items:center;min-width:0} table.box .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tblwrap{overflow-x:auto}
.waiting{text-align:center;padding:34px 0;color:var(--muted)}
@media(max-width:520px){.wrap{padding:10px 12px 60px}.pt{width:96px;height:96px}.ovr b{font-size:32px}.panel{padding:13px}.jumbo{padding:16px}.btn{padding:9px 13px;font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sk button.s{font:inherit;color:inherit;cursor:pointer;position:relative;transition:transform .12s,border-color .12s}
.sk button.s:not(:disabled){border-color:var(--line2)} .sk button.s:not(:disabled):hover{transform:translateY(-2px);border-color:var(--acc)} .sk button.s:disabled{opacity:.32;cursor:default}
.sk button.s.hot:not(:disabled){animation:pulseB 1.2s ease-in-out infinite} .sk button.s small{position:absolute;top:2px;right:4px;font-size:8px;color:var(--muted);text-transform:uppercase}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)} .scale b{color:#7dd3fc}
@media(max-width:440px){.slots{grid-template-columns:minmax(0,1fr)}.slot{min-height:50px;padding:5px 8px}.slot .ph,.slot .pt.sm{width:36px;height:36px}}

@media(max-width:620px){.sports{gap:7px}.sports button{padding:8px 12px;border-radius:13px}.sports button .e{font-size:26px}.sports button b{font-size:22px}}
</style>
