<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WaterWorks Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Single-sided card. Print size: 3.5in x 2in + 0.125in bleed on every side = 3.75in x 2.25in.
   All text stays inside the safe zone (0.25in in from the bleed edge). */
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0b3f73;--deep:#06264a;--blue:#2e86d6;--sky:#8cc4f0;--ink:#10283f;--body:#4a5f72;--grass:#3aa35a;--lime:#a6e07a}
body{background:#888;font-family:'Source Sans 3',sans-serif}
.card{width:3.75in;height:2.25in;position:relative;overflow:hidden;background:#fff;color:var(--ink)}

/* left: striped lawn panel, runs into the bleed on top, left and bottom */
.panel{position:absolute;top:0;bottom:0;left:0;width:1.5in;background:url(img/lawn-stripes.jpg) center/cover;color:#fff}
.panel::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,38,74,.93) 0%,rgba(6,38,74,.7) 55%,rgba(6,38,74,.35) 100%)}
.panel .in{position:absolute;top:0.25in;bottom:0.25in;left:0.25in;right:0.1in;display:flex;flex-direction:column;justify-content:space-between}
.logo .drop{width:0.2in;height:0.26in;display:block;margin-bottom:0.04in}
.ww{font-family:'Archivo',sans-serif;font-size:0.178in;font-weight:900;line-height:1;letter-spacing:-0.005in}
.ww b{color:var(--sky);font-weight:900}
.sub{font-family:'Archivo',sans-serif;font-size:0.062in;font-weight:800;letter-spacing:0.018in;text-transform:uppercase;color:var(--lime);margin-top:0.03in}
.qrbox{background:#fff;border-radius:0.05in;padding:0.035in 0.035in 0.025in;width:0.62in;text-align:center;box-shadow:0 0.015in 0.05in rgba(0,0,0,.35)}
.qrbox img{width:0.55in;height:0.55in;display:block}
.qrbox span{display:block;font-family:'Archivo',sans-serif;font-size:0.05in;font-weight:800;color:var(--navy);margin-top:0.02in;text-transform:uppercase}

/* right: services, prices, contact */
.main{position:absolute;top:0.25in;bottom:0.25in;left:1.62in;right:0.25in;display:flex;flex-direction:column}
.main h2{font-family:'Archivo',sans-serif;font-size:0.06in;font-weight:800;letter-spacing:0.016in;text-transform:uppercase;color:var(--blue);margin-bottom:0.02in}
.svc{display:grid;grid-template-columns:0.34in 1fr auto;align-items:center;gap:0.06in;flex:1;border-bottom:0.5px solid #dbe7f3}
.svc:last-of-type{border-bottom:0}
.ph{width:0.34in;height:0.22in;border-radius:0.03in;background-size:cover;background-position:center}
.name{font-family:'Archivo',sans-serif;font-weight:800;font-size:0.085in;color:var(--navy);line-height:1.1}
.price{text-align:right;line-height:1;white-space:nowrap}
.from{font-size:0.05in;font-weight:700;color:var(--body);text-transform:uppercase;letter-spacing:0.01in;margin-right:0.015in}
.amt{font-family:'Archivo',sans-serif;font-weight:900;font-size:0.12in;color:var(--grass)}
.unit{font-size:0.055in;color:var(--body);font-weight:700}
.contact{margin-top:0.04in;padding-top:0.04in;border-top:1px solid var(--navy);font-size:0.074in;line-height:1.45}
.contact .row{display:flex;align-items:center;gap:0.04in}
.contact svg{width:0.075in;height:0.075in;flex:none}
.contact .email{font-weight:700;font-size:0.08in;color:var(--navy)}
.contact .promise{font-weight:700;color:var(--grass);font-size:0.064in}

@media screen{body{display:flex;justify-content:center;padding:20px}}
</style>
</head>
<body>

<section class="card" id="card">
  <div class="panel">
    <div class="in">
      <div class="logo">
        <svg class="drop" viewBox="0 0 34 44" aria-hidden="true">
          <path d="M17 1 C17 1 2 19 2 29 a15 15 0 0 0 30 0 C32 19 17 1 17 1Z" fill="#8cc4f0"/>
          <path d="M9 29 q1 7 8 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".85"/>
        </svg>
        <div class="ww">Water<b>Works</b></div>
        <div class="sub">Lawn &amp; Landscaping</div>
      </div>
      <div class="qrbox"><img src="qr-quote.svg" alt="QR code to the free quote form"><span>Free quote</span></div>
    </div>
  </div>

  <div class="main">
    <h2>Services &amp; starting prices</h2>
    <div class="svc">
      <div class="ph" style="background-image:url(img/lawn-mower.jpg)"></div>
      <div class="name">Lawn Mowing</div>
      <div class="price"><span class="from">from</span><span class="amt">$10</span><span class="unit">/cut</span></div>
    </div>
    <div class="svc">
      <div class="ph" style="background-image:url(img/clean-driveway.jpg)"></div>
      <div class="name">Pressure Washing</div>
      <div class="price"><span class="from">from</span><span class="amt">$30</span></div>
    </div>
    <div class="svc">
      <div class="ph" style="background-image:url(img/car-wash.jpg);background-position:45% 60%"></div>
      <div class="name">Car Hand Wash</div>
      <div class="price"><span class="amt">$10</span><span class="unit">/car</span></div>
    </div>
    <div class="svc">
      <div class="ph" style="background-image:url(img/snow-house.jpg);background-position:50% 70%"></div>
      <div class="name">Snow Removal</div>
      <div class="price"><span class="from">from</span><span class="amt">$15</span></div>
    </div>
    <div class="contact">
      <div class="row email">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2e86d6" stroke-width="2.6"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
        waterworkslandscaping3@gmail.com
      </div>
      <div class="row">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2e86d6" stroke-width="2.6"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c3 3 4 6.5 4 10s-1 7-4 10c-3-3-4-6.5-4-10s1-7 4-10z"/></svg>
        waterworkslandscaping.ca &middot; Thornhill, ON
      </div>
      <div class="row promise">&#10003; Price agreed first &nbsp;&#10003; Pay after the job</div>
    </div>
  </div>
</section>

</body>
</html>
